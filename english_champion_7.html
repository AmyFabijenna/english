<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Champion 7</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--primary:#132033;--primary-light:#1a4262;--accent:#4a9eff;--accent-glow:#85c1ff;--accent-dark:#2d7acc;--success:#4ade80;--error:#ff5252;--text:#fff;--text-muted:#b4c8e8;--gold:#ffd740;--card:rgba(19,32,51,.92)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Quicksand',system-ui,sans-serif;background:linear-gradient(180deg,#0e1a2b 0%,#153454 40%,#1f4d70 70%,#2c72a8 100%) fixed;min-height:100vh;color:var(--text);line-height:1.5}
.container{max-width:1000px;margin:0 auto;padding:16px 16px 60px}
header{text-align:center;padding:8px 0 10px}
h1{font-family:'Fredoka',sans-serif;font-size:2.2rem;background:linear-gradient(135deg,#4a9eff,#85c1ff,#ffd740);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:4px}
.subtitle{color:var(--text-muted);font-size:.95rem}
.view{display:none;animation:fadeIn .35s ease}.view.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#topnav{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;position:sticky;top:0;z-index:50;padding:8px 4px;margin-bottom:12px;background:rgba(14,26,43,.92);backdrop-filter:blur(6px);border-bottom:1px solid rgba(74,158,255,.2)}
.tabbtn{background:rgba(26,66,98,.7);border:1px solid rgba(74,158,255,.3);border-radius:20px;padding:8px 14px;color:var(--text);font-family:inherit;font-weight:700;font-size:.88rem;cursor:pointer;transition:.2s}
.tabbtn:hover{border-color:var(--accent-glow)}.tabbtn.on{background:linear-gradient(135deg,var(--accent-dark),var(--accent));border-color:var(--accent-glow)}
.tab{display:none}.tab.on{display:block}
.card{background:linear-gradient(135deg,rgba(19,32,51,.95),rgba(26,66,98,.88));border-radius:18px;padding:20px;margin-bottom:16px;border:1px solid rgba(74,158,255,.25);box-shadow:0 8px 26px rgba(0,0,0,.3)}
.card h2{font-family:'Fredoka',sans-serif;font-size:1.3rem;color:var(--accent-glow);margin-bottom:4px}
.card h3{font-family:'Fredoka',sans-serif;font-size:1.05rem;color:var(--gold);margin:10px 0 6px}
.desc{color:var(--text-muted);font-size:.88rem;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.tcard{background:rgba(14,26,43,.6);border:1px solid rgba(74,158,255,.2);border-radius:14px;padding:14px}
.tcard .tt{font-family:'Fredoka',sans-serif;color:var(--gold);font-size:1.02rem;margin-bottom:2px}
.tcard .td{color:var(--text-muted);font-size:.8rem;margin-bottom:8px;min-height:2.4em}
.btnrow{display:flex;gap:6px;flex-wrap:wrap}
.sbtn{flex:1;min-width:76px;background:linear-gradient(135deg,var(--primary),var(--primary-light));border:2px solid rgba(74,158,255,.3);border-radius:10px;padding:8px 10px;color:var(--text);font-family:inherit;font-size:.82rem;font-weight:700;cursor:pointer;transition:.2s;text-align:center}
.sbtn:hover:not(:disabled){border-color:var(--accent-glow);background:linear-gradient(135deg,var(--accent-dark),var(--accent));transform:translateY(-2px)}
.sbtn:disabled{opacity:.35;cursor:not-allowed}
.sbtn.gold{border-color:var(--gold);color:var(--gold)}
.best{font-size:.72rem;color:var(--success);margin-left:6px;font-weight:700}
.modebtn{width:100%;display:block;background:linear-gradient(135deg,var(--primary),var(--primary-light));border:2px solid rgba(74,158,255,.3);border-radius:12px;padding:12px 16px;color:var(--text);font-family:inherit;font-size:.98rem;font-weight:700;cursor:pointer;text-align:left;margin-bottom:8px;transition:.2s}
.modebtn small{display:block;color:var(--text-muted);font-weight:500;font-size:.8rem}
.modebtn:hover{border-color:var(--accent-glow);transform:translateX(5px);background:linear-gradient(135deg,var(--accent-dark),var(--accent))}
.modebtn:hover small{color:#eaf3ff}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{background:rgba(26,66,98,.7);border:2px solid rgba(74,158,255,.3);border-radius:12px;padding:8px 12px;color:var(--text);font-family:inherit;font-weight:700;font-size:.85rem;cursor:pointer;transition:.2s}
.chip:hover{border-color:var(--accent-glow)}.chip.on{background:linear-gradient(135deg,var(--accent-dark),var(--accent));border-color:var(--gold)}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.vtile{background:rgba(14,26,43,.6);border:2px solid rgba(74,158,255,.25);border-radius:14px;padding:12px;color:var(--text);cursor:pointer;font-family:inherit;text-align:left;transition:.2s}
.vtile:hover{border-color:var(--accent-glow);transform:translateY(-3px)}
.vtile .ic{font-size:1.6rem}.vtile .vt{font-weight:700;font-size:.92rem}.vtile .vn{font-size:.75rem;color:var(--text-muted)}
.bar{background:rgba(19,32,51,.7);border-radius:10px;height:14px;overflow:hidden;border:1px solid rgba(74,158,255,.2)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent-dark),var(--accent-glow));transition:width .4s}
.bar.gold i{background:linear-gradient(90deg,#ff9800,var(--gold))}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:10px 0}
.stat{background:rgba(19,32,51,.7);border:1px solid rgba(74,158,255,.25);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-family:'Fredoka',sans-serif;font-size:1.5rem;color:var(--accent-glow)}.stat span{font-size:.72rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px}
/* Spiel */
.ghead{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.mode-ind{background:linear-gradient(135deg,var(--accent-dark),var(--accent));padding:7px 16px;border-radius:20px;font-weight:700;font-family:'Fredoka',sans-serif;font-size:.9rem}
.sbar{display:flex;gap:8px}.si{background:rgba(19,32,51,.7);padding:6px 12px;border-radius:10px;border:1px solid rgba(74,158,255,.25);text-align:center;min-width:64px}
.si small{display:block;font-size:.62rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px}.si b{font-family:'Fredoka',sans-serif;color:var(--accent-glow);font-size:1.1rem}
.ptext{text-align:center;color:var(--text-muted);font-size:.8rem;margin:4px 0 14px}
.qprompt{text-align:center;color:var(--gold);font-weight:700;margin-bottom:8px;font-size:.95rem}
.sbox{background:linear-gradient(135deg,rgba(19,32,51,.95),rgba(26,66,98,.85));border-radius:18px;padding:28px 20px;margin-bottom:18px;border:1px solid rgba(74,158,255,.3);text-align:center;box-shadow:0 8px 28px rgba(0,0,0,.3)}
.sent{font-family:'Fredoka',sans-serif;font-size:1.45rem;line-height:2.1}
.blank{display:inline-block;min-width:80px;padding:2px 12px;background:rgba(74,158,255,.15);border:2px dashed rgba(133,193,255,.6);border-radius:9px;color:var(--accent-glow);font-weight:700}
.blank.correct{background:rgba(74,222,128,.25);border:2px solid var(--success);color:var(--success)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:18px}
.opts.wide{grid-template-columns:1fr}
.opt{background:linear-gradient(135deg,var(--primary),var(--primary-light));border:2px solid rgba(74,158,255,.3);border-radius:12px;padding:13px 14px;color:var(--text);font-family:inherit;font-size:1rem;font-weight:700;cursor:pointer;transition:.2s;text-align:center}
.opts.wide .opt{text-align:left}
.opt:hover:not(:disabled){border-color:var(--accent-glow);background:linear-gradient(135deg,var(--accent-dark),var(--accent));transform:translateY(-2px)}
.opt:disabled{opacity:.55;cursor:default}
.opt.correct{background:linear-gradient(135deg,rgba(74,222,128,.35),rgba(74,222,128,.15));border-color:var(--success);color:var(--success);opacity:1;animation:pulse .5s}
.opt.wrong{background:linear-gradient(135deg,rgba(255,82,82,.35),rgba(255,82,82,.15));border-color:var(--error);color:#ffb4b4;animation:shake .4s}
@keyframes pulse{50%{transform:scale(1.06)}}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.tin{font-family:'Fredoka',sans-serif;font-size:1.25rem;background:rgba(14,26,43,.8);border:2px solid rgba(133,193,255,.5);border-radius:9px;color:#fff;padding:2px 8px;margin:0 4px;text-align:center;outline:none}
.tin:focus{border-color:var(--gold)}.tin.ok{border-color:var(--success);background:rgba(74,222,128,.2);color:var(--success)}.tin.bad{border-color:var(--error);background:rgba(255,82,82,.2);animation:shake .4s}
.tin.wide{width:min(94%,640px);display:block;margin:10px auto 0}
.ctrl{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.cbtn{background:linear-gradient(135deg,var(--primary),var(--primary-light));border:2px solid rgba(74,158,255,.3);border-radius:11px;padding:10px 20px;color:var(--text);font-family:inherit;font-size:.9rem;font-weight:700;cursor:pointer;transition:.2s}
.cbtn:hover{border-color:var(--accent-glow);transform:translateY(-2px)}.cbtn.primary{background:linear-gradient(135deg,var(--accent-dark),var(--accent));border-color:var(--accent-glow)}
.fb{min-height:1.5em;text-align:center;margin:0 auto 12px;max-width:720px;font-size:.95rem;padding:0 6px}
.fb.hint{color:#ffe08a;background:rgba(255,215,64,.1);border:1px solid rgba(255,215,64,.35);border-radius:10px;padding:8px 12px}
.fb.ok{color:var(--success)}
.chipwrap{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0;min-height:44px}
.wchip{background:linear-gradient(135deg,var(--primary),var(--primary-light));border:2px solid rgba(74,158,255,.4);border-radius:10px;padding:8px 13px;color:#fff;font-family:'Fredoka',sans-serif;font-size:1.05rem;cursor:pointer;transition:.15s}
.wchip:hover{border-color:var(--gold);transform:translateY(-2px)}.wchip.used{opacity:.25;pointer-events:none}
.ansline{min-height:56px;background:rgba(14,26,43,.6);border:2px dashed rgba(133,193,255,.5);border-radius:12px;padding:8px}
.ansline.ok .wchip{border-color:var(--success);color:var(--success)}.ansline.bad .wchip{border-color:var(--error);color:#ffb4b4}
.deside{color:var(--accent-glow);font-size:1.15rem;font-family:'Fredoka',sans-serif;margin-bottom:6px}
.fcard{perspective:900px;max-width:520px;margin:0 auto 16px;height:240px;cursor:pointer}
.fin{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.fcard.flip .fin{transform:rotateY(180deg)}
.fside{position:absolute;inset:0;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:18px;border:2px solid rgba(133,193,255,.5);font-family:'Fredoka',sans-serif;font-size:2rem;text-align:center;padding:16px;background:linear-gradient(135deg,rgba(19,32,51,.98),rgba(26,66,98,.9))}
.fside.back{transform:rotateY(180deg);background:linear-gradient(135deg,#1a4262,#2d7acc);color:var(--gold)}
.fside small{font-size:.8rem;color:var(--text-muted);font-family:'Quicksand'}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:640px;margin:0 auto 14px}
.mcard{min-height:72px;background:linear-gradient(135deg,var(--primary),var(--primary-light));border:2px solid rgba(74,158,255,.4);border-radius:12px;color:#fff;font-family:inherit;font-weight:700;font-size:.85rem;cursor:pointer;padding:6px;transition:.2s}
.mcard.up{background:linear-gradient(135deg,var(--accent-dark),var(--accent));border-color:var(--gold)}.mcard.done{background:rgba(74,222,128,.25);border-color:var(--success);color:var(--success);pointer-events:none}
.hang{font-family:'Fredoka',sans-serif;font-size:2.2rem;letter-spacing:.35em;margin:10px 0}
.kb{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:560px;margin:0 auto 12px}
.kb button{width:38px;height:42px;border-radius:9px;border:2px solid rgba(74,158,255,.4);background:var(--primary-light);color:#fff;font-weight:700;font-family:inherit;cursor:pointer}
.kb button:disabled{opacity:.3}.kb button.g{background:rgba(74,222,128,.3);border-color:var(--success)}.kb button.b{background:rgba(255,82,82,.3);border-color:var(--error)}
.back-btn{position:fixed;top:12px;left:12px;z-index:100;display:none;background:var(--card);border:1px solid rgba(74,158,255,.4);border-radius:11px;padding:8px 14px;color:#fff;font-family:inherit;font-weight:700;font-size:.85rem;cursor:pointer}
/* Regel & Tabellen */
.rule table,.ref table{width:100%;border-collapse:collapse;margin:8px 0;font-size:.88rem}
.rule th,.rule td,.ref th,.ref td{border:1px solid rgba(133,193,255,.25);padding:6px 9px;text-align:left;vertical-align:top}
.rule th,.ref th{background:rgba(74,158,255,.2);color:var(--gold)}
.rule p,.ref p{margin:8px 0;font-size:.92rem}.ex{color:var(--accent-glow);font-style:italic}
.tablewrap{overflow-x:auto}
details{background:rgba(14,26,43,.55);border:1px solid rgba(74,158,255,.2);border-radius:12px;margin-bottom:8px;padding:2px 12px}
details summary{cursor:pointer;padding:10px 0;font-weight:700;color:var(--gold);font-family:'Fredoka',sans-serif}
#modal{position:fixed;inset:0;background:rgba(5,10,20,.85);z-index:200;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:20px}
#modal.on{display:flex}.mbox{background:linear-gradient(135deg,#132033,#1a4262);border:1px solid var(--accent);border-radius:18px;padding:22px;max-width:760px;width:100%;margin:auto}
.mbox h2{font-family:'Fredoka',sans-serif;color:var(--gold);margin-bottom:8px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--gold);padding:10px 18px;border-radius:14px;z-index:300;display:none;font-weight:700}
.badge{display:inline-block;margin:4px;padding:8px 12px;border-radius:12px;border:1px solid rgba(74,158,255,.3);background:rgba(14,26,43,.6);font-size:.85rem}.badge.on{border-color:var(--gold);background:rgba(255,215,64,.12)}.badge.off{opacity:.4;filter:grayscale(1)}
.plan-week{margin-bottom:10px}.day{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-top:1px solid rgba(133,193,255,.15);padding:6px 0}.day b{min-width:52px;color:var(--gold)}
.task{font-size:.8rem;padding:5px 10px;border-radius:9px;border:1px solid rgba(74,158,255,.35);background:rgba(26,66,98,.6);color:#fff;cursor:pointer;font-family:inherit;font-weight:600}
.task:hover{border-color:var(--accent-glow)}.task.done{background:rgba(74,222,128,.2);border-color:var(--success);color:var(--success)}
table.rl{width:100%;border-collapse:collapse;font-size:.85rem}table.rl td,table.rl th{border-bottom:1px solid rgba(133,193,255,.15);padding:5px 8px;text-align:left}table.rl th{color:var(--gold)}
.cloze{font-family:'Fredoka',sans-serif;font-size:1.15rem;line-height:2.4;text-align:left}
.cloze select{font-family:inherit;font-size:1.05rem;border-radius:8px;background:#0e1a2b;color:#fff;border:2px solid rgba(133,193,255,.5);padding:2px 4px}
.cloze .tin{font-size:1.05rem;width:9em}
.timer{color:var(--gold)}
@media(max-width:700px){h1{font-size:1.7rem}.sent{font-size:1.15rem}.mem{grid-template-columns:repeat(4,1fr)}.tabbtn{padding:6px 10px;font-size:.8rem}.fside{font-size:1.5rem}}

body.ingame header{padding-top:46px}

</style>
</head>
<body>
<button class="back-btn" id="backBtn">← Menü</button>
<div class="container">
  <header>
    <h1>🏆 English Champion 7</h1>
    <div class="subtitle">Zeiten · Grammatik · Verwechslungen · Vokabeln – dein Zwei-Monats-Training für die 7. Schulstufe</div>
  </header>
  <div id="menuView" class="view active">
    <nav id="topnav"></nav>
    <div id="tabs"></div>
  </div>
  <div id="gameView" class="view">
    <div class="ghead">
      <div class="mode-ind" id="modeInd"></div>
      <div class="sbar">
        <div class="si"><small>Punkte</small><b id="stPoints">0</b></div>
        <div class="si"><small>Serie</small><b id="stStreak">0</b></div>
        <div class="si" id="timeStat" style="display:none"><small>Zeit</small><b id="stTime">0:00</b></div>
      </div>
    </div>
    <div class="bar"><i id="pfill" style="width:0"></i></div>
    <div class="ptext" id="ptext"></div>
    <div id="qArea"></div>
    <div class="fb" id="fb"></div>
    <div class="ctrl" id="nextRow" style="display:none"><button class="cbtn primary" id="nextBtn">Weiter ➜</button></div>
    <div class="ctrl" style="margin-top:14px">
      <button class="cbtn" id="ruleBtn" style="display:none">📖 Regel</button>
      <button class="cbtn" id="endBtn">🏁 Beenden</button>
    </div>
  </div>
  <div id="resultView" class="view"><div id="resultBox"></div></div>
</div>
<div id="modal"><div class="mbox" id="mbody"></div></div>
<div id="toast"></div>
<script>
'use strict';
/* ==================== CORE: Helfer, Speicher, Parser ==================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  kids.flat(9).forEach(c => { if (c == null || c === false) return; e.append(c.nodeType ? c : document.createTextNode(String(c))); });
  return e;
}
const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
function shuffle(a) { const b = [...a]; for (let i = b.length - 1; i > 0; i--) { const j = rnd(i + 1);[b[i], b[j]] = [b[j], b[i]]; } return b; }
function sample(a, n) { return shuffle(a).slice(0, n); }
const uniq = a => [...new Set(a)];
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const pad2 = n => String(n).padStart(2, '0');
function todayKey(d = new Date()) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }

/* ---------- Speicher (localStorage mit Fallback) ---------- */
const STORE_KEY = 'englishChampion7_v1';
function defaultDB() { return { xp: 0, answered: 0, correct: 0, days: {}, best: {}, vocab: {}, seen: {}, mistakes: [], plan: {}, badges: {}, sessions: 0, sound: true, exam: [], bestStreak: 0 }; }
function loadDB() { try { const r = localStorage.getItem(STORE_KEY); if (r) return Object.assign(defaultDB(), JSON.parse(r)); } catch (e) { } return defaultDB(); }
let DB = loadDB();
function saveDB() { try { localStorage.setItem(STORE_KEY, JSON.stringify(DB)); } catch (e) { } }

/* ---------- Text-Normalisierung für Eingaben ---------- */
function norm(s) {
  s = String(s).toLowerCase().replace(/[’‘`´]/g, "'").replace(/[“”"]/g, '').replace(/\s+/g, ' ').trim();
  s = s.replace(/[.!?;:,]+$/g, '').replace(/,/g, '');
  s = s.replace(/\bcan't\b/g, 'can not').replace(/\bcannot\b/g, 'can not').replace(/\bwon't\b/g, 'will not').replace(/\bshan't\b/g, 'shall not')
    .replace(/n't\b/g, ' not').replace(/'m\b/g, ' am').replace(/'re\b/g, ' are').replace(/'ll\b/g, ' will').replace(/'ve\b/g, ' have');
  return s.replace(/\s+/g, ' ').trim();
}
function normDe(s) {
  return String(s).toLowerCase().replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss')
    .replace(/[’‘`´]/g, "'").replace(/[.!?;:,]+$/g, '').replace(/\s+/g, ' ').trim();
}
function deVariants(s) {
  // "(sich) ausborgen" -> ["sich ausborgen","ausborgen"], "der Apfel" -> ["der apfel","apfel"]
  const out = new Set();
  const base = [s, s.replace(/\([^)]*\)/g, ' '), s.replace(/[()]/g, '')];
  base.forEach(b => {
    b = b.replace(/\s+/g, ' ').trim();
    out.add(normDe(b));
    out.add(normDe(b.replace(/^(der|die|das|ein|eine|to)\s+/i, '')));
  });
  return [...out].filter(Boolean);
}

/* ---------- Aufgaben-Parser ----------
   mc("She [goes|go|is going] to school.", "Erklärung")  -> Lückensatz mit Auswahl (erste Option = richtig)
   sc("Richtiger Satz|falsch 1|falsch 2", "Erklärung")   -> Welcher Satz ist richtig?
   ty("She {goes} (go) to school.", "Erklärung")        -> Eintippen (mehrere Lücken möglich, Alternativen mit /)
   tf("Prompt", ["Antwort 1","Antwort 2"], "Erklärung")   -> ganzen Satz eintippen
   wo("English sentence.", "Deutsche Übersetzung", "Erklärung") -> Wörter in Reihenfolge bringen
-------------------------------------------------------- */
function mc(txt, e) {
  const m = txt.match(/\[([^\]]+)\]/);
  if (!m) throw new Error('mc ohne []: ' + txt);
  const opts = m[1].split('|').map(s => s.trim());

      const swap = { Do: 'Does', Does: 'Do', Have: 'Has', Has: 'Have', Is: 'Are', Are: 'Is', Was: 'Were', Were: 'Was' }[f[tense].q];
      if (swap) dist.unshift(swap);

      item = mcItem('', q, f[tense].q, dist, tenseHint(tense));

<p><b>Past Continuous</b> (was/were + -ing) = Handlung war gerade im Gange (Hintergrund, Dauer), oft unterbrochen. Signalwörter: <i>while, at 8 o'clock yesterday, all evening</i>.<br><span class="ex">At 8 o'clock I was watching TV. – I was cooking when the phone rang.</span></p>

<tr><td><b>while</b> + Past Continuous (lange Handlung)</td><td>While I <b>was walking</b> home, it started to rain.</td></tr>

<p>was/were: <i>I/he/she/it was – you/we/they were</i>. Verneinung: <i>wasn't / weren't</i>. Frage: <i>Was she sleeping?</i></p>`,

T({

<p><b>Present Perfect</b> (have/has + 3. Form): Bezug zur Gegenwart – Ergebnis sichtbar, Zeitspanne dauert an, Erfahrung im Leben. <i>already, yet, just, ever, never, so far, since, for, this week/today (noch nicht vorbei), recently</i><br><span class="ex">I have lost my keys. (Ich habe sie jetzt nicht.) – Have you ever been to London?</span></p>
<table><tr><th>Frage</th><th>Zeitform</th></tr>
<tr><td>Genaue Zeit genannt? (yesterday, last year, in 2015, ago)</td><td>Past Simple</td></tr>

<tr><td>Wie lange schon? <i>for / since</i>, noch nicht abgeschlossen</td><td>Present Perfect</td></tr>

<tr><td>Ergebnis jetzt wichtig: <i>I've cut my finger.</i></td><td>Present Perfect</td></tr>
<tr><td>Person lebt nicht mehr / Ereignis abgeschlossen: Mozart <b>wrote</b> …</td><td>Past Simple</td></tr></table>

    mc('My room is [smaller|more small|smallest|the smaller] than yours.', 'small + er.'),

T({
  id: 'modals', g: 'g', ic: '🔧', t: 'Modalverben: can, must, have to, should, may, might', d: 'Können, müssen, dürfen, sollen – und der große Unterschied mustn\'t / don\'t have to.',
  rule: `<table><tr><th>Verb</th><th>Bedeutung</th><th>Beispiel</th></tr>
<tr><td><b>can / can't</b></td><td>können, dürfen (informell)</td><td>I can swim. Can I open the window?</td></tr>
<tr><td><b>could / couldn't</b></td><td>konnte (Fähigkeit früher) / höfliche Bitte</td><td>I could read at four. Could you help me?</td></tr>
<tr><td><b>must</b></td><td>müssen (innere Überzeugung, Regel)</td><td>You must do your homework.</td></tr>
<tr><td><b>mustn't</b></td><td>darf NICHT (Verbot!)</td><td>You mustn't smoke here.</td></tr>
<tr><td><b>have to / has to</b></td><td>müssen (von außen), Vergangenheit: <i>had to</i></td><td>I have to wear a uniform. Did you have to pay?</td></tr>
<tr><td><b>don't have to</b></td><td>muss NICHT / braucht nicht (= needn't)</td><td>You don't have to come.</td></tr>
<tr><td><b>should / shouldn't</b></td><td>sollte (Rat)</td><td>You should see a doctor.</td></tr>
<tr><td><b>may / might</b></td><td>vielleicht / darf ich (formell)</td><td>It might rain. May I come in?</td></tr>
<tr><td><b>would like</b></td><td>möchte (höflich)</td><td>I would like a tea.</td></tr></table>
<p>Nach Modalverben: <b>Grundform ohne to</b>, kein -s, Verneinung/Frage ohne do. Ausnahme: <i>have to</i> braucht do/does/did. Ersatzform von can: <i>be able to</i> (I was able to finish it.)</p>`,

    mc('You [mustn\'t|don\'t have to|needn\'t|haven\'t to] park here. It\'s forbidden.', 'mustn\'t = Verbot.'),
    mc('You [don\'t have to|mustn\'t|can\'t|shouldn\'t] wear a uniform at our school, but you can if you want.', 'don\'t have to = nicht nötig.'),
    mc('[Can|Do|Are|Must] I open the window, please?', 'Bitte um Erlaubnis.'),
    mc('She [can|cans|is can|cane] speak three languages.', 'Kein -s bei Modalverben.'),
    mc('He [can\'t|isn\'t can|don\'t can|not can] swim.', 'can\'t ohne do.'),
    mc('You [should|must to|should to|shoulds] drink more water. It\'s healthy.', 'Rat → should + Grundform.'),
    mc('I [had to|must|have to|musted] get up early yesterday.', 'Vergangenheit von must → had to.'),
    mc('It\'s very cold. You [should wear|should to wear|should wearing|should wears] a jacket.', 'should + Grundform.'),
    mc('[Could you|Do you could|Can you to|Are you could] help me, please?', 'Höfliche Bitte.'),
    mc('When I was five, I [could|can|able to|will can] ride a bike.', 'Fähigkeit in der Vergangenheit.'),
    mc('Yesterday I was ill, so I [couldn\'t|can\'t|don\'t can|mustn\'t] go to school.', 'Vergangenheit von can\'t.'),
    mc('You [mustn\'t|don\'t have to|needn\'t to|have not to] tell anyone. It\'s a secret.', 'Verbot / Warnung.'),
    mc('[Do we have to|Must we to|Have we to|Are we have to] wear a costume?', 'Frage mit have to: do.'),
    mc('She [might|mights|might to|is might] come to the party. I\'m not sure.', 'Möglichkeit.'),
    mc('Passengers [must not|does not must|not must|must don\'t] use their phones during take-off.', 'Verbot.'),
    mc('You [needn\'t|mustn\'t|can\'t|shouldn\'t] hurry. We have plenty of time.', 'needn\'t = nicht nötig.'),
    mc('I\'m sorry, I [can\'t|mustn\'t|needn\'t|don\'t have to] come tomorrow. I have a doctor\'s appointment.', 'Nicht möglich.'),
    mc('[May I|Do I may|Am I may|May to I] ask a question?', 'Höflich fragen.'),
    mc('My little brother [can\'t|mustn\'t|hasn\'t|shouldn\'t] read yet.', 'Fähigkeit fehlt.'),
    mc('You look tired. You [should|would|might to|must to] go to bed early tonight.', 'Rat.'),
    mc('In Austria you [have to|must to|has to|do have] be 18 to vote.', 'Regel/Gesetz.'),
    mc('He [has to|have to|must to|has] do his homework before he can play.', '3. Person: has to.'),
    mc('Would you [like|liking|likes|to like] some tea?', 'Would you like …?'),
    mc('I [would like|am like|liking|would liking] to book a table for four.', 'höfliche Bitte.'),
    mc('Lisa [doesn\'t have to|mustn\'t|can\'t|hasn\'t to] cook tonight – Dad is making dinner.', 'nicht nötig.'),
    mc('We [were able to|can|must|are able to] finish the project yesterday, so we got a good grade.', 'Einmaliger Erfolg in der Vergangenheit.'),
    mc('Where\'s Tom? – I don\'t know. He [might|must to|can to|is might] be at the library.', 'Vermutung.'),
    mc('[Did you have to|Had you to|Must you|Did you must] wear a uniform at your old school?', 'Vergangenheit: Did + have to.'),
    mc('You [shouldn\'t|mustn\'t to|don\'t should|not should] eat so much sugar. It\'s bad for your teeth.', 'Rat gegen etwas.'),
    mc('I [have to|must to|has to|am must] go now. My bus leaves in five minutes.', 'Notwendigkeit von außen.')
  ],
  w: [
    ty('You {mustn\'t} (not / must) run in the corridor.', 'Verbot.'),
    ty('She {has to} (have to) wear glasses.', '3. Person: has to.'),
    ty('{Do} we {have to} bring food?', 'Frage: Do + have to.'),
    ty('I {couldn\'t} (not / can) find my keys yesterday.', 'Vergangenheit von can\'t.'),
    ty('You {should} (should) see a doctor.', 'Rat.'),
    ty('He {can\'t} (not / can) come because he is ill.', 'Fähigkeit/Möglichkeit.'),
    ty('We {didn\'t have to} (not / have to) pay for the museum yesterday. It was free.', 'Vergangenheit + nicht nötig.'),
    ty('{May} I use your phone, please?', 'Höfliche Erlaubnisfrage.'),
    ty('He {had to} (have to) stay at home yesterday.', 'Vergangenheit.'),
    ty('You {don\'t have to} (not / have to) come with me if you don\'t want to.', 'Nicht nötig.'),
    ty('It {might} rain later. Take an umbrella.', 'Möglichkeit.'),
    tf('Schreibe mit „must not“: smoke / in the hospital', ['You must not smoke in the hospital', 'You mustn\'t smoke in the hospital'], 'Verbot.'),
    tf('Es ist nicht nötig: You must wear a uniform. → verneine mit dem passenden Ausdruck.', ['You don\'t have to wear a uniform', 'You needn\'t wear a uniform', 'You do not have to wear a uniform'], 'don\'t have to = nicht müssen.')
  ]
});

T({
  id: 'conditionals', g: 'g', ic: '🌈', t: 'If-Sätze: Type 0, 1 und 2', d: 'Wenn es regnet … / Wenn ich reich wäre …',
  rule: `<table><tr><th>Typ</th><th>If-Teil</th><th>Hauptsatz</th><th>Beispiel</th></tr>
<tr><td><b>0</b> – immer gültig</td><td>Present Simple</td><td>Present Simple</td><td>If you heat ice, it melts.</td></tr>
<tr><td><b>1</b> – möglich</td><td>Present Simple</td><td>will + Grundform</td><td>If it rains, we will stay at home.</td></tr>
<tr><td><b>2</b> – unwahrscheinlich / erfunden</td><td>Past Simple</td><td>would + Grundform</td><td>If I had a million, I would buy an island.</td></tr></table>
<p>Bei Typ 2 sagt man für alle Personen <b>If I were …</b> (auch <i>was</i> ist üblich). <i>If I were you, I would …</i> = Ratschlag.</p>
<p>Kein <i>will</i> und kein <i>would</i> im if-Teil! Der if-Teil kann vorne oder hinten stehen (mit Beistrich nur, wenn vorne). <b>unless</b> = if … not: <i>Unless you hurry, you'll be late.</i></p>`,
  q: [
    mc('If it rains tomorrow, we [will stay|would stay|stay|stayed] at home.', 'Typ 1.'),
    mc('If I [had|have|would have|will have] a million euros, I would buy an island.', 'Typ 2: Past Simple im if-Teil.'),
    mc('If you heat ice, it [melts|will melt|would melt|melted].', 'Typ 0 – immer gültig.'),
    mc('If you [study|will study|would study|studied] hard, you\'ll pass the test.', 'if + Present Simple.'),
    mc('She would help you if you [asked|ask|would ask|will ask].', 'Typ 2.'),
    mc('What would you do if you [won|win|would win|will win] the lottery?', 'Typ 2.'),
    mc('If I were you, I [would tell|will tell|tell|told] the teacher.', 'Rat mit would.'),
    mc('If we [hurry|will hurry|would hurry|hurried], we\'ll catch the bus.', 'Typ 1.'),
    mc('I [won\'t go|wouldn\'t go|don\'t go|didn\'t go] to the party if I feel ill tomorrow.', 'Typ 1.'),
    mc('If he [were|is|will be|would be] taller, he could play basketball.', 'Typ 2 mit were.'),
    mc('If you don\'t water the plants, they [will die|would die|die not|died].', 'Typ 1.'),
    mc('[Will you come|Would you come|Do you come|Did you come] to my party if I invite you?', 'Typ 1 – Frage.'),
    mc('If I [see|will see|would see|saw] Anna, I\'ll tell her.', 'Typ 1.'),
    mc('We would go to the beach if the weather [were|is|will be|would be] nicer.', 'Typ 2.'),
    mc('Unless you [hurry|don\'t hurry|will hurry|hurried] up, you\'ll be late.', 'unless = if not, daher positiv.'),
    mc('If it [doesn\'t stop|won\'t stop|wouldn\'t stop|didn\'t stopping] raining, we\'ll cancel the picnic.', 'Typ 1, Verneinung.'),
    mc('If I had wings, I [would fly|will fly|fly|flew] to the moon.', 'Typ 2.'),
    mc('If you mix red and blue, you [get|will get|would get|got] purple.', 'Typ 0 – Naturgesetz.'),
    mc('What will happen if I [press|will press|would press|pressed] this button?', 'Typ 1.'),
    mc('I\'d be very happy if I [passed|pass|will pass|would pass] the exam.', 'Typ 2.'),
    mc('If Tom [doesn\'t come|won\'t come|wouldn\'t come|didn\'t came] soon, we\'ll start without him.', 'Typ 1.'),
    mc('She\'d buy a bigger house if she [had|has|would have|will have] more money.', 'Typ 2.'),
    mc('If I [were|am|be|would be] you, I wouldn\'t do that.', 'If I were you …'),
    mc('They will win the match if they [play|would play|played|will play] well.', 'Typ 1.'),
    mc('I\'d take the job if I [didn\'t have|don\'t have|wouldn\'t have|won\'t have] to move to another city.', 'Typ 2, Verneinung.'),
    mc('If we [don\'t leave|won\'t leave|wouldn\'t leave|didn\'t leaving] now, we\'ll miss the train.', 'Typ 1.'),
    mc('If you find my wallet, [please call|you would call|calling|to call] me.', 'Befehl im Hauptsatz möglich.'),
    mc('Would you be angry if I [told|tell|will tell|would tell] you the truth?', 'Typ 2.'),

T({

<p><b>Bildung:</b> Adjektiv + <b>-ly</b> (quick → quickly, careful → carefully, happy → happ<b>ily</b>, easy → eas<b>ily</b>). Unregelmäßig: <b>good → well</b>. Gleiche Form: <b>fast, hard, late, early</b>.</p>

<p><b>Stellung:</b> Häufigkeitswörter (always, usually, often, sometimes, never) stehen <u>vor</u> dem Vollverb, aber <u>nach</u> be: <i>She often visits us. He is always late.</i> Bei Modalverben/Hilfsverben nach dem Hilfsverb: <i>I have never seen it.</i> <b>still</b> = immer noch, <b>already</b> = schon, <b>yet</b> = noch nicht/schon (Ende).</p>`,

T({

  rule: `<p>Wenn das Einleitungsverb in der Vergangenheit steht (<i>said, told, asked</i>), geht die Zeit einen Schritt zurück („Backshift“):</p>

<tr><td>now / today / tomorrow / yesterday</td><td>then / that day / the next day / the day before</td></tr></table>
<p><b>say</b> (ohne Person) / <b>tell</b> (mit Person): <i>He said that … / He told me that …</i>. <b>Fragen:</b> ohne Fragewortstellung und mit <i>if/whether</i> bei Ja/Nein-Fragen: <i>She asked me if I liked tea. – He asked where I lived.</i> <b>Befehle:</b> <i>told me to …, told me not to …</i></p>`,

    mc('He said, „I will help you.“ → He said he [would help|will help|helps|helped] me.', 'will → would.'),
    mc('They said, „We are playing.“ → They said they [were playing|are playing|played|was playing].', 'Continuous zurück.'),

    mc('„I can swim,“ he said. → He said he [could swim|can swim|may swim|cans swim].', 'can → could.'),

    mc('„Do you like tea?“ he asked. → He asked [if I liked|do I like|if do I like|that I liked] tea.', 'if + Aussage.'),
    mc('„Open the window,“ the teacher said. → The teacher told us [to open|opening|open|that open] the window.', 'told + to.'),
    mc('„Don\'t run,“ Mum said. → Mum told me [not to run|to not run|don\'t run|no running].', 'not to.'),

  w: [

});

/* ---------- Lückentexte ---------- */
function parseCloze(text) {
  const segs = []; const re = /\{([^}]+)\}|\[([^\]]+)\]/g; let last = 0, m;
  while ((m = re.exec(text))) {
    if (m.index > last) segs.push({ t: text.slice(last, m.index) });
    if (m[1] != null) segs.push({ b: 1, ans: m[1].split('/').map(s => s.trim()) });
    else { const o = m[2].split('|').map(s => s.trim()); segs.push({ sel: 1, correct: o[0], options: shuffle(o) }); }
    last = re.lastIndex;
  }
  if (last < text.length) segs.push({ t: text.slice(last) });
  return segs;
}
function clozeItem(c) { return { k: 'cloze', title: c.t, segs: parseCloze(c.text), id: 'cloze.' + c.id }; }

function modeTitle(key) {
  const [kind, a, b] = key.split(':');
  if (kind === 'gen') return GEN_LABELS[a] || a;
  if (kind === 'gram') { const t = TOPIC[a]; return t ? t.t : a; }
  if (kind === 'mix') return 'Themen-Mix';
  if (kind === 'vocab') { const m = VMODES[a]; const t = VTOPIC[b]; return (m ? m[1] : a) + ' – ' + (t ? t.title : b === 'all' ? 'alle Themen' : b === 'hard' ? 'schwierige Wörter' : b); }
  if (kind === 'irreg') return 'Unregelmäßige Verben';
  if (kind === 'opp') return 'Gegenteile'; if (kind === 'defs') return 'Definitionen';
  if (kind === 'cloze') { const c = CLOZE.find(x => x.id === a); return 'Lückentext: ' + (c ? c.t : a); }
  return { daily: '🌟 Tages-Challenge', exam: '📝 Schularbeit-Simulator', marathon: '🏃 Grammatik-Marathon', blitz: '⚡ Blitzrunde (60 s)', sprint: '⚡ Vokabel-Sprint (60 s)', mistakes: '🩹 Fehlerheft', umform: '✏️ Umformen' }[kind] || key;
}

function buildSession(key) {
  const [kind, a, b, c] = key.split(':');
  const title = modeTitle(key); let items = [], extra = {};
  switch (kind) {
    case 'gen': items = GEN[a]().map(prep); break;
    case 'gram': { const t = TOPIC[a]; items = pickItems(topicPool(t, b || 'all'), 20); break; }
    case 'mix': items = mixItems(a.split('+'), 25); break;
    case 'vocab': { const ws = wordPool(b); if (ws.length < 4) return null; items = vocabItems(a, ws, a === 'fc' ? 20 : 20); break; }
    case 'irreg': items = irregItems(a, 20); break;
    case 'opp': items = oppItems(a, 20); break;
    case 'defs': items = defItems(a, 15); break;
    case 'cloze': items = [clozeItem(CLOZE.find(x => x.id === a))]; break;
    case 'umform': items = umformItems(20); break;
    case 'daily': items = dailyItems(); break;
    case 'exam': items = examItems(); extra = { exam: 1, timeLimit: 40 * 60 }; break;
    case 'marathon': items = pickItems(allBankItems(['z', 'g', 'c'], ['q', 'w']), 100); break;
    case 'blitz': items = blitzItems(80); extra = { timeLimit: 60 }; break;
    case 'sprint': items = vocabItems('mix', ALLWORDS, 120).filter(i => i.k === 'mc'); items = [...vocabItems('mc_ende', ALLWORDS, 60), ...vocabItems('mc_deen', ALLWORDS, 60)]; items = shuffle(items); extra = { timeLimit: 60 }; break;
    case 'mistakes': items = shuffle(DB.mistakes).slice(0, 25).map(x => JSON.parse(JSON.stringify(x))); items.forEach(i => { if (i.k === 'mc') i.options = shuffle(i.options); }); break;

/* ---------- Fehlerheft & Statistik ---------- */

}

/* ---------- Eintippen ---------- */

/* ---------- Ende ---------- */
function gradeOf(p) { return p >= 88 ? 1 : p >= 76 ? 2 : p >= 63 ? 3 : p >= 50 ? 4 : 5; }
const GRADE_NAMES = { 1: 'Sehr gut', 2: 'Gut', 3: 'Befriedigend', 4: 'Genügend', 5: 'Nicht genügend' };
const LEVELS = [[0, 'Newcomer'], [300, 'Word Collector'], [800, 'Sentence Builder'], [1600, 'Grammar Explorer'], [2800, 'Tense Tamer'], [4500, 'Vocab Hero'], [6800, 'Grammar Ninja'], [9800, 'Language Star'], [13500, 'Tense Master'], [18000, 'English Champion'], [24000, 'Legend 🏆']];
function levelInfo(xp) { let i = 0; while (i + 1 < LEVELS.length && xp >= LEVELS[i + 1][0]) i++; const next = LEVELS[i + 1]; return { n: i + 1, name: LEVELS[i][1], from: LEVELS[i][0], to: next ? next[0] : null }; }

function finishSession(timeout) {
  if (!S) return;
  clearInterval(S.iv); clearTimeout(S.tmo); try { speechSynthesis.cancel(); } catch (e) { }
  const elapsed = Math.floor((Date.now() - S.start) / 1000);
  const denom = S.exam ? S.total : Math.max(S.done, 1);
  const acc = S.done ? Math.round(S.firstOk / denom * 100) : 0;
  DB.xp += S.points; DB.sessions++; DB.bestStreak = Math.max(DB.bestStreak, S.best);
  if (S.done > 0) DB.best[S.key] = Math.max(DB.best[S.key] || 0, acc);
  let grade = null;
  if (S.exam) { grade = gradeOf(acc); DB.exam.push({ d: todayKey(), p: acc, g: grade }); }
  // Plan
  if (S.done >= Math.min(5, S.total)) {
    if (S.task) DB.plan[S.task] = true;
    else { const t = allPlanTasks().find(t => t.m === S.key && !DB.plan[t.id]); if (t) DB.plan[t.id] = true; }
  }
  const gained = checkBadges(S.done >= 15 && S.firstOk === S.done && S.total >= 15);

  if (gained.length) res.append(h('div', { class: 'fb ok', style: 'margin:8px auto' }, '🎖 Neue Abzeichen: ' + gained.join(' · ')));

const CLOZE_ORDER = ['c1', 'c2', 'c3', 'c4', 'c5', 'c6', 'c7', 'c8', 'c9', 'c10'];
let PLAN = null;
function buildPlan() {
  const DAYS = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
  PLAN = PLAN_DEF.map((w, wi) => {
    const days = DAYS.map((dn, di) => {
      const [gl_, gk] = w.g[di]; const vt = V_ORDER[wi][di % 3]; const meth = METHODS[(wi * 6 + di) % METHODS.length];
      const mk = (meth === 'listen_ty' && !SPEECH) ? 'ty_deen' : meth;
      const xk = w.x[di % w.x.length];
      const tasks = [
        { l: gl_, m: gk },
        { l: `${VMODES[mk][1]}: ${VTOPIC[vt].title}`, m: `vocab:${mk}:${vt}` },
        { l: di === 5 ? '📝 Wochen-Test (Themen-Mix)' : (xk === 'exam' ? 'Schularbeit-Simulator' : modeTitle(xk)), m: di === 5 ? 'mix:' + w.g.slice(0, 5).filter(x => x[1].startsWith('gram:')).map(x => x[1].split(':')[1]).join('+') : xk }
      ];
      if (!tasks[2].m.replace('mix:', '')) tasks[2].m = 'blitz';
      return { d: dn, tasks: tasks.map((t, ti) => Object.assign(t, { id: `w${wi + 1}${dn}${ti}`, wk: `Woche ${wi + 1}`, day: dn })) };
    });
    const clz = CLOZE_ORDER[wi] || 'c1';
    days.push({ d: 'So', tasks: [{ l: 'Lückentext', m: 'cloze:' + clz }, { l: 'Tages-Challenge', m: 'daily' }, { l: 'Fehlerheft', m: 'mistakes' }].map((t, ti) => Object.assign(t, { id: `w${wi + 1}So${ti}`, wk: `Woche ${wi + 1}`, day: 'So' })) });
    return { t: w.t, days };
  });
  PLAN[7].days[5].tasks[2] = Object.assign(PLAN[7].days[5].tasks[2], { l: '📝 Abschluss-Schularbeit', m: 'exam' });
}
function allPlanTasks() { if (!PLAN) buildPlan(); return PLAN.flatMap(w => w.days.flatMap(d => d.tasks)); }
function renderPlan(el) {
  if (!PLAN) buildPlan();
  const all = allPlanTasks(), done = all.filter(t => DB.plan[t.id]).length;
  el.append(h('div', { class: 'card' }, h('h2', {}, '📅 Zwei-Monats-Plan'), h('div', { class: 'desc' }, 'Acht Wochen, jeden Tag drei kurze Aufgaben (ca. 20–25 Minuten), sonntags ein lockerer Abschluss. Aufgabe antippen = starten. Grün = erledigt (wird automatisch abgehakt).'),
    h('div', { class: 'bar' }, h('i', { style: `width:${Math.round(done / all.length * 100)}%` })), h('div', { class: 'ptext' }, `${done} von ${all.length} Aufgaben erledigt`)));
  PLAN.forEach(w => {

    el.append(det);

const TENSE_TABLE = `<table><tr><th>Zeit</th><th>Form</th><th>Verwendung</th><th>Signalwörter</th><th>Beispiel</th></tr>
<tr><td>Present Simple</td><td>go / goes<br>don't go, Do you go?</td><td>Gewohnheit, Fakt, Fahrplan</td><td>always, usually, every day, never</td><td>She plays tennis on Mondays.</td></tr>
<tr><td>Present Continuous</td><td>am/is/are + -ing</td><td>jetzt, vorübergehend, fixer Termin</td><td>now, at the moment, today, Look!</td><td>It is raining now.</td></tr>
<tr><td>Past Simple</td><td>went / played<br>didn't go, Did you go?</td><td>abgeschlossen, Handlungsfolge</td><td>yesterday, last week, … ago, in 2019</td><td>I saw him yesterday.</td></tr>
<tr><td>Past Continuous</td><td>was/were + -ing</td><td>Handlung im Verlauf, Hintergrund</td><td>while, at 8 o'clock yesterday</td><td>I was cooking when he called.</td></tr>
<tr><td>Present Perfect</td><td>have/has + 3. Form</td><td>Bezug zur Gegenwart, Erfahrung, Dauer bis jetzt</td><td>already, yet, just, ever, never, since, for, so far</td><td>I have lived here for 5 years.</td></tr>
<tr><td>will-Future</td><td>will + Grundform</td><td>spontan, Vermutung, Versprechen</td><td>tomorrow, I think, probably</td><td>I'll open the door.</td></tr>
<tr><td>going to</td><td>am/is/are going to + Grundform</td><td>Plan, Absicht, sichtbares Anzeichen</td><td>tomorrow, next week, Look!</td><td>It's going to rain.</td></tr>
<tr><td>Past Perfect (Bonus)</td><td>had + 3. Form</td><td>Vorvergangenheit</td><td>before, after, already, by the time</td><td>The film had started.</td></tr>
<tr><td>Passiv (Bonus)</td><td>be + 3. Form</td><td>Handlung wichtiger als Täter</td><td>by …</td><td>English is spoken here.</td></tr></table>`;
