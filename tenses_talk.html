<!DOCTYPE html>
<html lang="de">
<head>

<title>Tenses Talk</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--primary:#132033;--primary-light:#1a4262;--accent:#4a9eff;--accent-glow:#85c1ff;--accent-dark:#2d7acc;--success:#4ade80;--error:#ff5252;--text:#fff;--text-muted:#b4c8e8;--gold:#ffd740;--card:rgba(19,32,51,.92)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Quicksand',system-ui,sans-serif;background:linear-gradient(180deg,#0e1a2b 0%,#153454 40%,#1f4d70 70%,#2c72a8 100%) fixed;min-height:100vh;color:var(--text);line-height:1.5}
.container{max-width:1000px;margin:0 auto;padding:16px 16px 60px}
header{text-align:center;padding:8px 0 10px}
h1{font-family:'Fredoka',sans-serif;font-size:2.2rem;background:linear-gradient(135deg,#4a9eff,#85c1ff,#ffd740);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:4px}
.subtitle{color:var(--text-muted);font-size:.95rem}
.view{display:none;animation:fadeIn .35s ease}.view.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#topnav{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;position:sticky;top:0;z-index:50;padding:8px 4px;margin-bottom:12px;background:rgba(14,26,43,.92);backdrop-filter:blur(6px);border-bottom:1px solid rgba(74,158,255,.2)}
.tabbtn{background:rgba(26,66,98,.7);border:1px solid rgba(74,158,255,.3);border-radius:20px;padding:8px 14px;color:var(--text);font-family:inherit;font-weight:700;font-size:.88rem;cursor:pointer;transition:.2s}
.tabbtn:hover{border-color:var(--accent-glow)}.tabbtn.on{background:linear-gradient(135deg,var(--accent-dark),var(--accent));border-color:var(--accent-glow)}
.tab{display:none}.tab.on{display:block}
.card{background:linear-gradient(135deg,rgba(19,32,51,.95),rgba(26,66,98,.88));border-radius:18px;padding:20px;margin-bottom:16px;border:1px solid rgba(74,158,255,.25);box-shadow:0 8px 26px rgba(0,0,0,.3)}
.card h2{font-family:'Fredoka',sans-serif;font-size:1.3rem;color:var(--accent-glow);margin-bottom:4px}
.card h3{font-family:'Fredoka',sans-serif;font-size:1.05rem;color:var(--gold);margin:10px 0 6px}
.desc{color:var(--text-muted);font-size:.88rem;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.tcard{background:rgba(14,26,43,.6);border:1px solid rgba(74,158,255,.2);border-radius:14px;padding:14px}
.tcard .tt{font-family:'Fredoka',sans-serif;color:var(--gold);font-size:1.02rem;margin-bottom:2px}
.tcard .td{color:var(--text-muted);font-size:.8rem;margin-bottom:8px;min-height:2.4em}
.btnrow{display:flex;gap:6px;flex-wrap:wrap}
.sbtn{flex:1;min-width:76px;background:linear-gradient(135deg,var(--primary),var(--primary-light));border:2px solid rgba(74,158,255,.3);border-radius:10px;padding:8px 10px;color:var(--text);font-family:inherit;font-size:.82rem;font-weight:700;cursor:pointer;transition:.2s;text-align:center}
.sbtn:hover:not(:disabled){border-color:var(--accent-glow);background:linear-gradient(135deg,var(--accent-dark),var(--accent));transform:translateY(-2px)}
.sbtn:disabled{opacity:.35;cursor:not-allowed}
.sbtn.gold{border-color:var(--gold);color:var(--gold)}
.best{font-size:.72rem;color:var(--success);margin-left:6px;font-weight:700}
.modebtn{width:100%;display:block;background:linear-gradient(135deg,var(--primary),var(--primary-light));border:2px solid rgba(74,158,255,.3);border-radius:12px;padding:12px 16px;color:var(--text);font-family:inherit;font-size:.98rem;font-weight:700;cursor:pointer;text-align:left;margin-bottom:8px;transition:.2s}
.modebtn small{display:block;color:var(--text-muted);font-weight:500;font-size:.8rem}
.modebtn:hover{border-color:var(--accent-glow);transform:translateX(5px);background:linear-gradient(135deg,var(--accent-dark),var(--accent))}
.modebtn:hover small{color:#eaf3ff}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{background:rgba(26,66,98,.7);border:2px solid rgba(74,158,255,.3);border-radius:12px;padding:8px 12px;color:var(--text);font-family:inherit;font-weight:700;font-size:.85rem;cursor:pointer;transition:.2s}
.chip:hover{border-color:var(--accent-glow)}.chip.on{background:linear-gradient(135deg,var(--accent-dark),var(--accent));border-color:var(--gold)}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.vtile{background:rgba(14,26,43,.6);border:2px solid rgba(74,158,255,.25);border-radius:14px;padding:12px;color:var(--text);cursor:pointer;font-family:inherit;text-align:left;transition:.2s}
.vtile:hover{border-color:var(--accent-glow);transform:translateY(-3px)}
.vtile .ic{font-size:1.6rem}.vtile .vt{font-weight:700;font-size:.92rem}.vtile .vn{font-size:.75rem;color:var(--text-muted)}
.bar{background:rgba(19,32,51,.7);border-radius:10px;height:14px;overflow:hidden;border:1px solid rgba(74,158,255,.2)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent-dark),var(--accent-glow));transition:width .4s}
.bar.gold i{background:linear-gradient(90deg,#ff9800,var(--gold))}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:10px 0}
.stat{background:rgba(19,32,51,.7);border:1px solid rgba(74,158,255,.25);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-family:'Fredoka',sans-serif;font-size:1.5rem;color:var(--accent-glow)}.stat span{font-size:.72rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px}
/* Spiel */
.ghead{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.mode-ind{background:linear-gradient(135deg,var(--accent-dark),var(--accent));padding:7px 16px;border-radius:20px;font-weight:700;font-family:'Fredoka',sans-serif;font-size:.9rem}
.sbar{display:flex;gap:8px}.si{background:rgba(19,32,51,.7);padding:6px 12px;border-radius:10px;border:1px solid rgba(74,158,255,.25);text-align:center;min-width:64px}
.si small{display:block;font-size:.62rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px}.si b{font-family:'Fredoka',sans-serif;color:var(--accent-glow);font-size:1.1rem}
.ptext{text-align:center;color:var(--text-muted);font-size:.8rem;margin:4px 0 14px}
.qprompt{text-align:center;color:var(--gold);font-weight:700;margin-bottom:8px;font-size:.95rem}
.sbox{background:linear-gradient(135deg,rgba(19,32,51,.95),rgba(26,66,98,.85));border-radius:18px;padding:28px 20px;margin-bottom:18px;border:1px solid rgba(74,158,255,.3);text-align:center;box-shadow:0 8px 28px rgba(0,0,0,.3)}
.sent{font-family:'Fredoka',sans-serif;font-size:1.45rem;line-height:2.1}
.blank{display:inline-block;min-width:80px;padding:2px 12px;background:rgba(74,158,255,.15);border:2px dashed rgba(133,193,255,.6);border-radius:9px;color:var(--accent-glow);font-weight:700}
.blank.correct{background:rgba(74,222,128,.25);border:2px solid var(--success);color:var(--success)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:18px}
.opts.wide{grid-template-columns:1fr}
.opt{background:linear-gradient(135deg,var(--primary),var(--primary-light));border:2px solid rgba(74,158,255,.3);border-radius:12px;padding:13px 14px;color:var(--text);font-family:inherit;font-size:1rem;font-weight:700;cursor:pointer;transition:.2s;text-align:center}
.opts.wide .opt{text-align:left}
.opt:hover:not(:disabled){border-color:var(--accent-glow);background:linear-gradient(135deg,var(--accent-dark),var(--accent));transform:translateY(-2px)}
.opt:disabled{opacity:.55;cursor:default}
.opt.correct{background:linear-gradient(135deg,rgba(74,222,128,.35),rgba(74,222,128,.15));border-color:var(--success);color:var(--success);opacity:1;animation:pulse .5s}
.opt.wrong{background:linear-gradient(135deg,rgba(255,82,82,.35),rgba(255,82,82,.15));border-color:var(--error);color:#ffb4b4;animation:shake .4s}
@keyframes pulse{50%{transform:scale(1.06)}}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.tin{font-family:'Fredoka',sans-serif;font-size:1.25rem;background:rgba(14,26,43,.8);border:2px solid rgba(133,193,255,.5);border-radius:9px;color:#fff;padding:2px 8px;margin:0 4px;text-align:center;outline:none}
.tin:focus{border-color:var(--gold)}.tin.ok{border-color:var(--success);background:rgba(74,222,128,.2);color:var(--success)}.tin.bad{border-color:var(--error);background:rgba(255,82,82,.2);animation:shake .4s}
.tin.wide{width:min(94%,640px);display:block;margin:10px auto 0}
.ctrl{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.cbtn{background:linear-gradient(135deg,var(--primary),var(--primary-light));border:2px solid rgba(74,158,255,.3);border-radius:11px;padding:10px 20px;color:var(--text);font-family:inherit;font-size:.9rem;font-weight:700;cursor:pointer;transition:.2s}
.cbtn:hover{border-color:var(--accent-glow);transform:translateY(-2px)}.cbtn.primary{background:linear-gradient(135deg,var(--accent-dark),var(--accent));border-color:var(--accent-glow)}
.fb{min-height:1.5em;text-align:center;margin:0 auto 12px;max-width:720px;font-size:.95rem;padding:0 6px}
.fb.hint{color:#ffe08a;background:rgba(255,215,64,.1);border:1px solid rgba(255,215,64,.35);border-radius:10px;padding:8px 12px}
.fb.ok{color:var(--success)}
.chipwrap{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0;min-height:44px}
.wchip{background:linear-gradient(135deg,var(--primary),var(--primary-light));border:2px solid rgba(74,158,255,.4);border-radius:10px;padding:8px 13px;color:#fff;font-family:'Fredoka',sans-serif;font-size:1.05rem;cursor:pointer;transition:.15s}
.wchip:hover{border-color:var(--gold);transform:translateY(-2px)}.wchip.used{opacity:.25;pointer-events:none}
.ansline{min-height:56px;background:rgba(14,26,43,.6);border:2px dashed rgba(133,193,255,.5);border-radius:12px;padding:8px}
.ansline.ok .wchip{border-color:var(--success);color:var(--success)}.ansline.bad .wchip{border-color:var(--error);color:#ffb4b4}
.deside{color:var(--accent-glow);font-size:1.15rem;font-family:'Fredoka',sans-serif;margin-bottom:6px}
.fcard{perspective:900px;max-width:520px;margin:0 auto 16px;height:240px;cursor:pointer}
.fin{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.fcard.flip .fin{transform:rotateY(180deg)}
.fside{position:absolute;inset:0;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:18px;border:2px solid rgba(133,193,255,.5);font-family:'Fredoka',sans-serif;font-size:2rem;text-align:center;padding:16px;background:linear-gradient(135deg,rgba(19,32,51,.98),rgba(26,66,98,.9))}
.fside.back{transform:rotateY(180deg);background:linear-gradient(135deg,#1a4262,#2d7acc);color:var(--gold)}
.fside small{font-size:.8rem;color:var(--text-muted);font-family:'Quicksand'}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:640px;margin:0 auto 14px}
.mcard{min-height:72px;background:linear-gradient(135deg,var(--primary),var(--primary-light));border:2px solid rgba(74,158,255,.4);border-radius:12px;color:#fff;font-family:inherit;font-weight:700;font-size:.85rem;cursor:pointer;padding:6px;transition:.2s}
.mcard.up{background:linear-gradient(135deg,var(--accent-dark),var(--accent));border-color:var(--gold)}.mcard.done{background:rgba(74,222,128,.25);border-color:var(--success);color:var(--success);pointer-events:none}
.hang{font-family:'Fredoka',sans-serif;font-size:2.2rem;letter-spacing:.35em;margin:10px 0}
.kb{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:560px;margin:0 auto 12px}
.kb button{width:38px;height:42px;border-radius:9px;border:2px solid rgba(74,158,255,.4);background:var(--primary-light);color:#fff;font-weight:700;font-family:inherit;cursor:pointer}
.kb button:disabled{opacity:.3}.kb button.g{background:rgba(74,222,128,.3);border-color:var(--success)}.kb button.b{background:rgba(255,82,82,.3);border-color:var(--error)}
.back-btn{position:fixed;top:12px;left:12px;z-index:100;display:none;background:var(--card);border:1px solid rgba(74,158,255,.4);border-radius:11px;padding:8px 14px;color:#fff;font-family:inherit;font-weight:700;font-size:.85rem;cursor:pointer}
/* Regel & Tabellen */
.rule table,.ref table{width:100%;border-collapse:collapse;margin:8px 0;font-size:.88rem}
.rule th,.rule td,.ref th,.ref td{border:1px solid rgba(133,193,255,.25);padding:6px 9px;text-align:left;vertical-align:top}
.rule th,.ref th{background:rgba(74,158,255,.2);color:var(--gold)}
.rule p,.ref p{margin:8px 0;font-size:.92rem}.ex{color:var(--accent-glow);font-style:italic}
.tablewrap{overflow-x:auto}
details{background:rgba(14,26,43,.55);border:1px solid rgba(74,158,255,.2);border-radius:12px;margin-bottom:8px;padding:2px 12px}
details summary{cursor:pointer;padding:10px 0;font-weight:700;color:var(--gold);font-family:'Fredoka',sans-serif}
#modal{position:fixed;inset:0;background:rgba(5,10,20,.85);z-index:200;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:20px}
#modal.on{display:flex}.mbox{background:linear-gradient(135deg,#132033,#1a4262);border:1px solid var(--accent);border-radius:18px;padding:22px;max-width:760px;width:100%;margin:auto}
.mbox h2{font-family:'Fredoka',sans-serif;color:var(--gold);margin-bottom:8px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--gold);padding:10px 18px;border-radius:14px;z-index:300;display:none;font-weight:700}
.badge{display:inline-block;margin:4px;padding:8px 12px;border-radius:12px;border:1px solid rgba(74,158,255,.3);background:rgba(14,26,43,.6);font-size:.85rem}.badge.on{border-color:var(--gold);background:rgba(255,215,64,.12)}.badge.off{opacity:.4;filter:grayscale(1)}
.plan-week{margin-bottom:10px}.day{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-top:1px solid rgba(133,193,255,.15);padding:6px 0}.day b{min-width:52px;color:var(--gold)}
.task{font-size:.8rem;padding:5px 10px;border-radius:9px;border:1px solid rgba(74,158,255,.35);background:rgba(26,66,98,.6);color:#fff;cursor:pointer;font-family:inherit;font-weight:600}
.task:hover{border-color:var(--accent-glow)}.task.done{background:rgba(74,222,128,.2);border-color:var(--success);color:var(--success)}
table.rl{width:100%;border-collapse:collapse;font-size:.85rem}table.rl td,table.rl th{border-bottom:1px solid rgba(133,193,255,.15);padding:5px 8px;text-align:left}table.rl th{color:var(--gold)}
.cloze{font-family:'Fredoka',sans-serif;font-size:1.15rem;line-height:2.4;text-align:left}
.cloze select{font-family:inherit;font-size:1.05rem;border-radius:8px;background:#0e1a2b;color:#fff;border:2px solid rgba(133,193,255,.5);padding:2px 4px}
.cloze .tin{font-size:1.05rem;width:9em}
.timer{color:var(--gold)}
@media(max-width:700px){h1{font-size:1.7rem}.sent{font-size:1.15rem}.mem{grid-template-columns:repeat(4,1fr)}.tabbtn{padding:6px 10px;font-size:.8rem}.fside{font-size:1.5rem}}

body.ingame header{padding-top:46px}

/* ===== Tenses Talk: Ergänzungen ===== */
body.ingame header{padding-top:46px}
.tlsvg{width:100%;max-width:560px;height:auto;display:block;margin:6px auto}
.tl-line{stroke:#85c1ff;stroke-width:3}.tl-arrow{fill:#85c1ff}.tl-now{stroke:#ffffff;stroke-width:2;stroke-dasharray:3 3;opacity:.7}
.tl-t{fill:#ffffff;font:700 12px Fredoka,Quicksand,sans-serif;letter-spacing:1px}.tl-t.dim{fill:#85c1ff;opacity:.8}.tl-l{fill:#ffd740;font:600 12.5px Quicksand,sans-serif}
.tl-dot{fill:#ffd740}.tl-dot2{fill:#4ade80}.tl-bar{fill:#ffd740}.tl-hit{stroke:#ff6b6b;stroke-width:4;stroke-linecap:round}
.tl-arc{fill:none;stroke:#ffd740;stroke-width:3;stroke-dasharray:5 4}.tl-arrowf{fill:#ffd740}
.tlmini{max-width:560px;margin:10px auto 0}
.explain{margin-top:14px;padding:12px 14px;border-radius:12px;background:rgba(74,222,128,.10);border:1px solid rgba(74,222,128,.45);line-height:1.55}
.sent.big{font-size:1.45rem}
.explain small{opacity:.8}
.model .say,.say{background:rgba(255,215,64,.08);border-left:4px solid var(--gold);padding:12px 14px;border-radius:10px;font-size:1.08rem;line-height:1.7}
.de-bridge{margin-top:12px;padding:10px 12px;border-radius:10px;background:rgba(74,158,255,.12);border:1px solid rgba(74,158,255,.35)}
.wrongc{color:#ff9d9d;text-decoration:line-through;text-decoration-color:rgba(255,157,157,.6)}.rightc{color:#8df0b0;font-weight:700}
.exrow{margin:3px 0}.tiny{background:none;border:none;cursor:pointer;font-size:.95rem;margin-left:6px;padding:0 4px}
.chip.static{cursor:default}.chip.static:hover{transform:none}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}.crumb{background:rgba(74,158,255,.18);border:1px solid rgba(74,158,255,.4);border-radius:999px;padding:3px 12px;font-size:.85rem}
.tbtn{text-align:left;cursor:pointer;font-family:inherit;color:inherit}.tbtn:hover{border-color:var(--gold)}
.rate{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}.rate span{margin-right:6px;font-weight:700}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0}.pairbox{background:rgba(14,26,43,.5);border:1px solid rgba(74,158,255,.3);border-radius:14px;padding:12px}
.pts{line-height:1.7;margin:10px 0 0 20px}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-top:10px}
.qtile{background:rgba(19,32,51,.8);border:2px solid rgba(74,158,255,.35);border-radius:14px;padding:12px 14px;text-align:left;color:#fff;font-family:inherit;cursor:pointer}
.qtile:hover{border-color:var(--gold)}.qtile.done{border-color:#4ade80}.qtile .qq{display:block;font-weight:700;margin-bottom:4px}.qtile small{opacity:.75}
.phr{display:flex;flex-direction:column;gap:6px}.phrbtn{text-align:left;background:rgba(14,26,43,.6);border:1px solid rgba(74,158,255,.3);color:#fff;border-radius:10px;padding:9px 12px;font-family:inherit;font-size:1rem;cursor:pointer}.phrbtn:hover{border-color:var(--gold)}
.transcript{margin:10px 0;padding:10px 12px;border-radius:10px;background:rgba(14,26,43,.7);border:1px dashed rgba(133,193,255,.5);font-style:italic}
.checks{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.chk{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border-radius:999px;border:1px solid rgba(74,158,255,.4);background:rgba(14,26,43,.5);cursor:pointer}.chk.on{border-color:#4ade80;background:rgba(74,222,128,.14)}
.lesson-step.done{opacity:.72}.lhead{display:flex;align-items:center;gap:6px;border:none;background:none;padding:0;font-size:1.1rem;cursor:pointer}.lhead .min{margin-left:auto;color:var(--gold);font-weight:700}
.lesson-step p{line-height:1.65}
.barlab{position:absolute;left:8px;top:0;font-size:.75rem;line-height:14px;color:#fff}.bar{position:relative}
.dim{opacity:.6}

</style>
</head>
<body>
<button class="back-btn" id="backBtn">← Menü</button>
<div class="container">
  <header>
    <h1>🎓 Tenses Talk</h1>
    <div class="subtitle">Zeitformen verstehen und auf Englisch erklären – When and why?</div>
  </header>
  <div id="menuView" class="view active" style="display:block">
    <nav id="topnav"></nav>
    <div id="tabs"></div>
  </div>
  <div id="gameView" class="view" style="display:none">
    <div class="ghead"><div class="mode-ind" id="modeInd"></div></div>
    <div class="bar"><i id="pfill" style="width:0"></i></div>
    <div class="ptext" id="ptext"></div>
    <div id="qArea"></div>
    <div class="fb" id="fb"></div>
    <div class="ctrl" id="nextRow" style="display:none"><button class="cbtn primary" id="nextBtn">Weiter ➜</button></div>
  </div>
</div>
<div id="toast"></div>
<script>
'use strict';
/* ===== Zeitformen ===== */
const TENSES = [
{ id:'ps', name:'Present Simple', ic:'🔁', one:'Things that are always true or happen regularly.',
  uses:[
   {k:'habit', en:'habits & routines', de:'Gewohnheiten & Routinen', ex:['I practise the piano every day.','My brother never eats breakfast.'], why:'The action repeats again and again, so it is a pattern – not one single event.'},
   {k:'fact', en:'facts & general truths', de:'Fakten & allgemeine Wahrheiten', ex:['Water freezes at 0 degrees.','Vienna is the capital of Austria.'], why:'It is true at any time, not only at this moment.'},
   {k:'sched', en:'timetables & fixed schedules', de:'Fahrpläne & feste Zeitpläne', ex:['The bus leaves at 7.45.','The film starts at eight.'], why:'Official schedules are fixed, so we talk about them like facts.'},
   {k:'state', en:'states (know, like, love, want, own …)', de:'Zustände (wissen, mögen, besitzen …)', ex:['I know the answer.','She has two cats.'], why:'These verbs describe a state, not an action in progress – so they usually avoid the -ing form.'}],
  form:{aff:'I / you / we / they play  ·  he / she / it plays', neg:"I don't play  ·  she doesn't play", q:'Do you play?  ·  Does she play?', note:'he / she / it: -s (plays), -es (watches), consonant + y → -ies (studies). After do/does the verb stays in its base form.'},
  signals:['always','usually','often','sometimes','never','every day','on Mondays','once a week','how often'],
  mistakes:[['She go to school by bus.','She goes to school by bus.','With he, she and it the verb needs an -s.'],["He doesn't likes pizza.","He doesn't like pizza.","After doesn't the verb stays in the base form, because doesn't already carries the -s."],['I am knowing the answer.','I know the answer.','Know is a stative verb, so there is no -ing.'],['Do she play tennis?','Does she play tennis?','With he, she and it we use does.']],
  de:"Im Deutschen steht fast alles im Präsens („Ich lerne seit zwei Jahren Englisch“). Im Englischen ist das Present Simple für Gewohnheiten, Fakten und Fahrpläne reserviert.",
  model:"We use the Present Simple to talk about things that happen regularly or are always true. For example, we use it for habits and routines, like 'I walk to school every day'. We also use it for facts, like 'Water freezes at zero degrees', and for timetables, like 'The bus leaves at seven forty-five'. We use it because the action is a pattern and not something that is happening right now. Typical signal words are always, usually, never and every day.",
  keys:['habits & routines|habit|routine|regular','facts|fact|always true|general truth','timetables|timetable|schedule','example|for example|for instance','signal words|always|usually|never|every day|often','pattern|again and again|not right now|repeat'],
  formSpeech:"In the affirmative we use the base verb, and we add an -s for he, she and it. In the negative we use don't or doesn't plus the base verb, and in questions we put do or does at the beginning. For example: 'She doesn't play tennis.' and 'Does she play tennis?'",
  formKeys:['base verb|base form|infinitive','-s|add s|he she it|he, she','don\'t|do not|doesn\'t|does not','question|questions|do or does|does']},

{ id:'pc', name:'Present Continuous', ic:'▶️', one:'Something is happening right now – or only for now.',
  uses:[
   {k:'now', en:'happening right now', de:'passiert gerade jetzt', ex:["Look! It's snowing.","I'm writing an email at the moment."], why:'The action is in progress and not finished – the -ing form shows that we are in the middle of it.'},
   {k:'temp', en:'temporary situations', de:'vorübergehende Situationen', ex:["I'm staying with my aunt this week.","He's learning Spanish these days."], why:'It is not permanent: it has a beginning and an end around now.'},
   {k:'arr', en:'fixed arrangements for the future', de:'fest vereinbarte Pläne', ex:["I'm meeting Lena tomorrow at five.","We're flying to Rome on Friday."], why:'The plan is already organised (time, place, people), so it feels almost like it has already started.'},
   {k:'change', en:'changing & developing situations', de:'Entwicklungen', ex:["It's getting colder.","Your English is improving."], why:'Something is changing step by step, right now.'},
   {k:'annoy', en:"annoying habits with 'always'", de:'nervige Gewohnheiten mit always', ex:["He's always losing his keys!","You're always interrupting me!"], why:"'Always' + -ing shows that something happens too often and annoys the speaker."}],
  form:{aff:"I'm reading  ·  she's reading  ·  they're reading", neg:"I'm not reading  ·  he isn't reading  ·  we aren't reading", q:'Are you reading?  ·  Is she reading?', note:'Spelling: make → making, run → running, lie → lying. Stative verbs (know, like, want …) normally have no -ing form.'},
  signals:['now','right now','at the moment','today','this week','currently','Look!','Listen!'],
  mistakes:[['I am go to school now.','I am going to school now.','After am / is / are the verb needs -ing.'],['She is liking music.','She likes music.','Like is a stative verb, so we use the Present Simple.'],["I'm playing tennis every Saturday.",'I play tennis every Saturday.','A regular habit needs the Present Simple.'],['What you are doing?','What are you doing?','In questions the auxiliary comes before the subject.']],
  de:"Das Deutsche hat keine -ing-Form: „Ich esse“ kann „I eat“ oder „I am eating“ heißen. Frag dich also immer: Ist es gerade im Gange oder nur vorübergehend?",
  model:"We use the Present Continuous for actions that are happening right now, for example 'I'm writing an email at the moment'. We also use it for temporary situations, like 'I'm staying with my aunt this week', for changes, like 'It's getting colder', and for fixed arrangements in the future, like 'I'm meeting Tom tomorrow'. We use it because the -ing form shows that the action is in progress and not finished. Typical signal words are now, at the moment, today, and look or listen.",
  keys:['right now|now|at the moment|happening now','temporary|only for now|for a short time','future arrangements|arrangement|arranged|fixed plan|future','example|for example|for instance','in progress|not finished|middle of','signal words|today|look|listen|this week'],
  formSpeech:"We form the Present Continuous with am, is or are plus the verb with -ing. For the negative we add not, and for questions we put am, is or are in front of the subject. For example: 'I'm reading.', 'She isn't reading.' and 'Are you reading?'",
  formKeys:['am|is|are','-ing|ing form|verb with ing','not|negative','question|questions|in front|before the subject']},

{ id:'pas', name:'Past Simple', ic:'⏮️', one:'A finished action at a definite time in the past.',
  uses:[
   {k:'fin', en:'finished actions at a definite time', de:'abgeschlossene Handlung zu einer bestimmten Zeit', ex:['I visited my grandma last weekend.','They moved to Graz in 2019.'], why:'The time is over and the story is closed – we do not connect it to now.'},
   {k:'seq', en:'events following each other (a story)', de:'Abfolge von Ereignissen', ex:['She opened the door, looked around and screamed.'], why:'One action follows the next, so we tell the story step by step.'},
   {k:'pastHab', en:'habits and states in the past', de:'Gewohnheiten & Zustände in der Vergangenheit', ex:['When I was little, I played outside every day.','We lived in a small village. We used to have a dog.'], why:'The habit or state belonged to a time that is over.'}],
  form:{aff:'regular: walk → walked  ·  irregular: go → went, see → saw', neg:"I didn't go  ·  she didn't see it", q:'Did you go?  ·  Did she see it?', note:"In negatives and questions did already shows the past, so the main verb goes back to the base form (didn't go – not didn't went)."},
  signals:['yesterday','last week / year','two days ago','in 2019','when I was ten','then','the other day'],
  mistakes:[["I didn't went home.","I didn't go home.",'Did already shows the past, so the verb stays in the base form.'],['Did you saw him?','Did you see him?','After did we use the base form.'],['I goed to the park.','I went to the park.','Go is irregular: go – went – gone.'],['I have seen him yesterday.','I saw him yesterday.','A finished time word like yesterday needs the Past Simple.']],
  de:"Im gesprochenen Deutsch nehmen wir meist das Perfekt („Ich bin gestern gegangen“). Im Englischen steht bei yesterday, ago und last … immer das Past Simple – nie das Present Perfect.",
  model:"We use the Past Simple for finished actions at a definite time in the past, for example 'I visited my grandma last weekend'. We also use it to tell a story, when one action follows the other, and for habits and states in the past. The reason is that the time is over and the action is complete, so there is no link to the present. Typical signal words are yesterday, last week, ago and in 2019.",
  keys:['finished|completed|over|complete','definite time|specific time|at a time','story|one after the other|sequence','example|for example|for instance','signal words|yesterday|last week|ago|in 2019','no link|not connected|present'],
  formSpeech:"Regular verbs get -ed in the affirmative, and irregular verbs have their own second form, like went or saw. In the negative and in questions we use did and the base verb, so the main verb does not change. For example: 'I didn't go.' and 'Did you go?'",
  formKeys:['ed|-ed|regular','irregular|second form|went|saw','did|didn\'t|did not','base verb|base form|infinitive']},

{ id:'pac', name:'Past Continuous', ic:'⏪', one:'An action was in progress at a moment in the past.',
  uses:[
   {k:'prog', en:'an action in progress at a past moment', de:'Handlung im Verlauf zu einem Zeitpunkt', ex:['At eight o\'clock last night I was doing my homework.','What were you doing at six?'], why:'We look at the middle of the action: it had started before and was still going on.'},
   {k:'interr', en:'a longer action interrupted by a shorter one', de:'lange Handlung wird unterbrochen', ex:['I was walking home when it started to rain.','She was talking on the phone when the doorbell rang.'], why:'The long action is the background (Past Continuous), the short interruption is a single event (Past Simple).'},
   {k:'back', en:'background & parallel actions', de:'Hintergrund & gleichzeitige Handlungen', ex:['The sun was shining and the birds were singing.','While Mum was cooking, I was setting the table.'], why:'It paints the scene, while the Past Simple moves the story forward.'}],
  form:{aff:'I / he / she / it was reading  ·  we / you / they were reading', neg:"I wasn't reading  ·  they weren't reading", q:'Was she reading?  ·  Were you reading?', note:'The short interrupting action (after when) is in the Past Simple.'},
  signals:['while','when','as','at 8 o\'clock yesterday','all evening','at that moment'],
  mistakes:[['When I was arriving, the film started.','When I arrived, the film started.','A short, sudden action is a Past Simple event.'],['While I cooked, the phone rang.','While I was cooking, the phone rang.','The long action in the background needs the Past Continuous.'],['I was knowing the answer.','I knew the answer.','Know is a stative verb, so no -ing.']],
  de:"Im Deutschen sagen wir oft „Ich las gerade, als …“ oder „Ich habe gerade gelesen, als …“. Im Englischen merkst du dir: lange Handlung = was reading, kurze Unterbrechung = rang / arrived / started.",
  model:"We use the Past Continuous for an action that was in progress at a certain moment in the past, for example 'At eight o'clock I was doing my homework'. We also use it for a long action that is interrupted by a short one, like 'I was walking home when it started to rain', and for the background of a story. We use it because we look at the middle of the action, not at the end. Typical words are while, when and as.",
  keys:['in progress|was going on|middle of|continuing','interrupted|interruption|short action|longer action','background|scene|parallel|at the same time','example|for example|for instance','signal words|while|when|as','was or were|was|were|-ing'],
  formSpeech:"We form the Past Continuous with was or were plus the verb with -ing. I, he, she and it take was, and we, you and they take were. For example: 'I was reading.', 'They weren't listening.' and 'Were you sleeping?'",
  formKeys:['was|were','-ing|ing form|verb with ing','I he she it|singular','question|questions|negative|weren\'t|wasn\'t']},

{ id:'pp', name:'Present Perfect', ic:'🔗', one:'The past is connected to the present.',
  uses:[
   {k:'exp', en:'life experience (no time given)', de:'Lebenserfahrung (ohne Zeitangabe)', ex:["I've been to London twice.","Have you ever eaten sushi?"], why:'It does not matter when – what matters is that you have this experience now.'},
   {k:'res', en:'a past action with a result now', de:'Handlung mit Ergebnis in der Gegenwart', ex:["I've lost my key – I can't get in.","She's broken her arm, so she can't write."], why:'The past action is connected to the present because the result is visible now.'},
   {k:'dur', en:'something that started in the past and still continues', de:'hat begonnen und dauert noch an (for / since)', ex:["I've lived here for five years.","She has known him since 2020."], why:'The time period is not finished – it runs until now.'},
   {k:'recent', en:'very recent news (just, already, yet)', de:'ganz frische Neuigkeiten', ex:["I've just finished my project.","Have you done your homework yet?"], why:'The action is so recent that it still touches the present.'}],
  form:{aff:"I've seen  ·  she's seen  (have / has + past participle)", neg:"I haven't seen  ·  she hasn't seen", q:'Have you seen it?  ·  Has she seen it?', note:'Regular: past participle = verb + -ed. Irregular: learn the third form (go – went – gone, write – wrote – written).'},
  signals:['ever','never','already','yet','just','so far','since','for','recently','this week / this year'],
  mistakes:[['I have seen him yesterday.','I saw him yesterday.','A finished time word like yesterday needs the Past Simple.'],['I live here since 2019.','I have lived here since 2019.','The time runs until now, so we need the Present Perfect.'],['I am here for two hours.','I have been here for two hours.','For + length of time up to now needs the Present Perfect.'],['She has went home.','She has gone home.','After has we need the past participle (the third form).']],
  de:"Auf Deutsch sagen wir „Ich wohne seit fünf Jahren hier“ (Präsens!). Im Englischen: „I have lived here for five years“ – die Zeit läuft bis jetzt, also Present Perfect.",
  model:"We use the Present Perfect when the past is connected to the present. First, for life experience, like 'I've been to London'. Second, for a past action with a result now, like 'I've lost my key'. Third, for something that started in the past and still continues, with for or since, like 'I've lived here for five years'. And fourth, for recent news with just, already and yet. The time is not finished, or it is not important, so we do not use finished-time words like yesterday.",
  keys:['connected to the present|connection|link to now|up to now|present','experience|ever|never','result|result now','for or since|for|since|still continues|still true','just|already|yet|recent','not yesterday|no finished time|finished time words'],
  formSpeech:"We form the Present Perfect with have or has plus the past participle. We use has for he, she and it. For example: 'I've seen it.', 'She hasn't called.' and 'Have you finished?' With irregular verbs we have to know the third form, like gone, seen or written.",
  formKeys:['have|has','past participle|third form|3rd form','he she it|has for','irregular|gone|seen|written']},

{ id:'pap', name:'Past Perfect', ic:'⏮️⏮️', one:'The action that happened first – before another past action.',
  uses:[
   {k:'earlier', en:'an action before another past action', de:'Vorzeitigkeit in der Vergangenheit', ex:['When I arrived, the film had already started.','She was sad because she had lost her phone.'], why:'We need to show which of two past events came first – had + past participle goes one step further back.'},
   {k:'rep', en:'reporting earlier events (reported speech)', de:'Bericht über Früheres (indirekte Rede)', ex:['He told me he had seen the movie.','She said she had finished her book.'], why:'What she or he said happened before the moment of reporting, so everything moves one step back.'}],
  form:{aff:"I had finished  ·  she had finished  (had is the same for everybody)", neg:"I hadn't finished", q:'Had you finished?', note:"Use it only when the order matters. If the events are told in order, the Past Simple is enough: 'I got up, ate breakfast and left.'"},
  signals:['before','after','already','by the time','until','when (+ Past Simple)'],
  mistakes:[['When I came home, my mum already cooked.','When I came home, my mum had already cooked.','The cooking was finished before I came, so we need the Past Perfect.'],['I had went home.','I had gone home.','After had we need the past participle.'],["After I had finish, I left.","After I had finished, I left.",'Had needs the past participle (-ed).']],
  de:"Im Deutschen heißt es Plusquamperfekt („Ich hatte gegessen“) – im Englischen bildest du es genauso: had + Partizip. Wichtig ist nur die Reihenfolge: was war zuerst?",
  model:"We use the Past Perfect for an action that happened before another action in the past. For example, 'When I arrived, the film had already started': first the film started, then I arrived. We use had plus the past participle to go one step further back in time. It is useful when the order of events is important, and typical words are before, after, already and by the time.",
  keys:['before another|earlier|first|one step back|earlier action','two past|two actions|another past','example|for example|for instance','had|had plus|had + past participle','signal words|before|after|already|by the time','order|which came first|sequence'],
  formSpeech:"We form the Past Perfect with had plus the past participle, and had is the same for every person. For example: 'I had finished.', 'They hadn't arrived.' and 'Had you met her before?' It is easy because there is only one form of the auxiliary.",
  formKeys:['had','past participle|third form','same for every person|every person|all persons','negative|question|hadn\'t']},

{ id:'fw', name:'Future Simple (will)', ic:'🔮', one:'Decisions made now, opinions and promises about the future.',
  uses:[
   {k:'spont', en:'spontaneous decisions', de:'spontane Entscheidungen', ex:["The phone is ringing – I'll get it!","I'm thirsty. I'll get some water."], why:'There was no plan before; you decide at the moment of speaking.'},
   {k:'pred', en:'predictions & opinions about the future', de:'Vorhersagen & Meinungen', ex:["I think it will rain tomorrow.","You'll love this book!"], why:'It is what you believe or guess – not a plan and not based on a visible sign.'},
   {k:'prom', en:'promises, offers & requests', de:'Versprechen, Angebote & Bitten', ex:["I'll help you with your homework.","I won't tell anyone.","Will you open the window, please?"], why:'Will expresses willingness: you commit yourself to do something.'}],
  form:{aff:"I'll go  ·  she'll go  (will + base verb, same for all persons)", neg:"I won't go  (will not)", q:'Will you go?', note:"Never 'will to go'. In if / when / as soon as clauses we use the Present Simple: If it rains, I'll stay at home."},
  signals:['tomorrow','next week','soon','in 2030','I think','probably','perhaps','I\'m sure','I promise'],
  mistakes:[['If it will rain, I will stay at home.',"If it rains, I will stay at home.",'After if, when and as soon as we use the Present Simple for the future.'],['I will to go.','I will go.','After will the verb comes without to.'],["I'll visit my aunt on Saturday – we planned it weeks ago.","I'm going to visit my aunt on Saturday – we planned it weeks ago.",'A plan that was made before needs going to.']],
  de:"Im Deutschen reicht oft das Präsens („Morgen regnet es“) oder „werden“. Im Englischen unterscheidest du: will (spontan, Meinung, Versprechen) – going to (Plan, Anzeichen).",
  model:"We use the Future Simple with will for spontaneous decisions, like 'I'll open the door', for predictions and opinions, like 'I think it will rain', and for promises and offers, like 'I'll help you'. We use will when there is no plan yet, because the decision or the opinion comes at the moment of speaking. Typical signal words are tomorrow, soon, probably and I think.",
  keys:['spontaneous|spontaneous decisions|decision at the moment|decide now','predictions|prediction|opinion|think|guess','promises|promise|offers|offer','example|for example|for instance','no plan|not planned|no plan before|moment of speaking','signal words|tomorrow|soon|probably|I think'],
  formSpeech:"We form the Future Simple with will plus the base verb, and it is the same for all persons. The negative is won't, and in questions will comes first. For example: 'I'll help.', 'She won't come.' and 'Will you join us?' We never use to after will.",
  formKeys:['will','base verb|base form|infinitive','won\'t|will not','same for all|every person|all persons|no s']},

{ id:'fg', name:'going to (bonus)', ic:'🎯', one:'Plans, intentions – and predictions you can see coming.',
  uses:[
   {k:'plan', en:'plans & intentions', de:'Pläne & Absichten', ex:["I'm going to learn French this year.","We're going to paint my room green."], why:'You decided before the moment of speaking, so the future already has a cause: your intention.'},
   {k:'evid', en:'predictions based on evidence', de:'Vorhersagen mit sichtbarem Anzeichen', ex:["Look at those clouds! It's going to rain.","Watch out! You're going to fall!"], why:'You can see a sign now that tells you what will happen next.'}],
  form:{aff:"I'm going to learn  ·  she's going to learn  ·  they're going to learn", neg:"I'm not going to learn  ·  he isn't going to learn", q:'Are you going to learn?  ·  Is she going to learn?', note:"In speech: 'gonna'. After going to the verb is in the base form."},
  signals:['tomorrow','next week','this weekend','Look!','Watch out!','I\'ve decided','in the future'],
  mistakes:[["I'm going to to learn French.","I'm going to learn French.",'Only one to – after going to comes the base verb.'],['Look at the clouds! It will rain.',"Look at the clouds! It's going to rain.",'You can see the evidence, so going to fits better than will.'],['We going to see a film tonight.',"We're going to see a film tonight.",'We need am / is / are before going to.']],
  de:"„Ich werde …“ kann im Englischen will oder going to heißen. Frage dich: Habe ich das schon vorher geplant oder sehe ich schon ein Anzeichen? Dann: going to.",
  model:"We use going to for plans and intentions that we decided before, for example 'I'm going to learn French'. We also use it for predictions when we can see evidence now, like 'Look at the clouds! It's going to rain'. We use it because the future already has a cause in the present: a plan or a sign.",
  keys:['plans|plan|intentions|intention|decided before','predictions|prediction','evidence|sign|can see|see now','example|for example|for instance','present|already|cause|connection','signal words|look|watch out|tomorrow'],
  formSpeech:"We form going to with am, is or are, then going to, and then the base verb. For example: 'I'm going to learn French.', 'She isn't going to come.' and 'Are you going to stay?'",
  formKeys:['am|is|are','going to','base verb|base form|infinitive','question|negative|not']}
];

const REASON = {}; TENSES.forEach(t => t.uses.forEach(u => REASON[u.k] = Object.assign({ t: t.id }, u)));

/* ===== Unterschiede ===== */
const CONTRASTS = [
 { id:'ps_pc', a:'ps', b:'pc', title:'Present Simple vs Present Continuous', test:'Is it a pattern – or a moment? Permanent – or only for now?',
   points:['Present Simple = a pattern: habits, facts, timetables.','Present Continuous = a moment: happening now, temporary, changing.','State verbs (know, like, want, need, own) stay in the Present Simple – even right now.'],
   pairs:[['I walk to school.',"I'm walking to school today.",'Walking is my routine in the first sentence; in the second, it is happening today (maybe because something is different).'],['He lives in Graz.',"He's living in Graz this year.",'Permanent home vs a temporary stay.'],['I think it is a good idea.',"I'm thinking about it.",'Think as an opinion is a state; think about is an action in progress.'],['She talks a lot.',"She's talking on the phone.",'A character trait vs what she is doing right now.']],
   de:'Deutsch: „Ich esse“ = beides. Englisch muss sich entscheiden: I eat (immer) oder I am eating (gerade).',
   model:"The Present Simple is for habits, facts and timetables, so it describes a pattern. The Present Continuous is for actions that are happening right now or only temporarily. For example, 'I walk to school' is my routine, but 'I'm walking to school today' means it is different today. Also, verbs like know or like are states, so we use them in the Present Simple, even right now.",
   keys:['habits|habit|routine|pattern|regular','right now|happening now|at the moment|in progress','temporary|only for now','example|for example|for instance','state|stative|know|like','facts|timetables|fact'] },
 { id:'pas_pp', a:'pas', b:'pp', title:'Past Simple vs Present Perfect', test:"Can you add 'yesterday', 'last week' or 'in 2019'? Then it is the Past Simple.",
   points:['Past Simple: finished time (yesterday, last year, in 2019, ago).','Present Perfect: no time named, or a time that is not over (today, this week, since, for).','Both talk about the past – but the Present Perfect keeps a link to now.'],
   pairs:[['I lived in Linz for two years.',"I've lived in Linz for two years.",'First: I do not live there any more. Second: I still live there.'],['Did you see the film last night?','Have you seen the film?','A finished time vs an experience without a time.'],['She lost her keys yesterday.',"She's lost her keys.",'A story about yesterday vs the result now (she cannot get in).'],['We went to Italy in 2022.',"We've been to Italy twice.",'A definite year vs how many times in our life.']],
   de:'Deutsch nutzt das Perfekt für alles („Ich habe ihn gestern gesehen“). Englisch trennt streng: yesterday → Past Simple.',
   model:"We use the Past Simple for finished actions with a definite time, like yesterday or in 2019. We use the Present Perfect when the time is not mentioned or not over, and the action is connected to now: an experience, a result, or something that is still going on. For example, 'I lived in Linz for two years' means I don't live there any more, but 'I've lived in Linz for two years' means I still do.",
   keys:['finished|definite time|specific time|over','yesterday|last week|ago|in 2019','connected to now|connection|link|present','experience|result|still going on|still','for|since|for or since','example|for example|for instance'] },
 { id:'pas_pac', a:'pas', b:'pac', title:'Past Simple vs Past Continuous', test:'Is the action finished (or a short event) – or was it in the middle at that moment?',
   points:['Past Simple: finished action, short event, next step in a story.','Past Continuous: in progress at a moment, long background action.','Together: long action (was doing) + short interruption (did).'],
   pairs:[['I read a book last night.','I was reading a book at nine.','Finished (maybe the whole book) vs in the middle of reading at nine.'],['When Tom came in, I switched off the TV.','When Tom came in, I was watching TV.','First: one thing after the other. Second: the TV was already on.'],['It rained yesterday.','It was raining when we left.','A fact about yesterday vs the weather at one moment.']],
   de:'Merke: lange Handlung = was / were + -ing; kurze Unterbrechung = einfache Vergangenheit.',
   model:"We use the Past Simple for finished actions and for events in a story that follow each other. We use the Past Continuous for an action that was in progress at a certain moment, or for the background. Usually, a long action in the Past Continuous gets interrupted by a short action in the Past Simple, for example: 'I was reading when the phone rang.'",
   keys:['finished|complete|one after the other|story','in progress|was going on|middle of','background|long action|longer','interrupted|interruption|short action|short','example|for example|for instance','when|while'] },

    chipRow([['q', '🗣 Lehrerfragen'], ['phr', '💬 Redewendungen'], ['gl', '📚 Grammatik-Wörter']], V.sp, id => { V.sp = id; renderAll(); })));

    el.append(grid);
  } else if (V.sp === 'phr') {
    PHRASES.forEach(([title, list]) => el.append(h('div', { class: 'card' }, h('h3', {}, title), h('div', { class: 'phr' }, list.map(p => h('button', { class: 'phrbtn', onclick: () => speak(p.replace(/…/g, '')) }, TTS ? '🔊 ' : '', p))))));
  } else {

      h('div', { class: 'tablewrap' }, h('table', { class: 'rl' }, h('tr', {}, h('th', {}), h('th', {}, 'English'), h('th', {}, 'Deutsch')), ...GLOSS.map(g => h('tr', {}, h('td', {}, TTS ? h('button', { class: 'tiny', onclick: () => speak(g[0]) }, '🔊') : ''), h('td', {}, g[0]), h('td', {}, g[1])))))));
  }
}

/* ==================== Üben ==================== */

    modeBtn('🕵️ Error Hunt', 'Welcher Satz ist richtig? Typische Fehler von Deutschsprachigen (10 Sätze)', RUN.err(f)),
    modeBtn('🇩🇪→🇬🇧 Translate', 'Ganze Sätze übersetzen und eintippen (10 Sätze)', RUN.tr(f)),
    modeBtn('📚 Grammar words', 'Die englischen Fachwörter für Grammatik (12 Fragen)', RUN.gl)));
  el.append(h('div', { class: 'card' }, h('h2', {}, 'Challenges'),
    modeBtn('🎯 Diagnose', 'Zwei Sätze pro Zeitform – wo stehe ich?', RUN.diag),
    modeBtn('🏆 Boss-Runde', '20 gemischte Aufgaben aus allen Bereichen', RUN.boss)));

/* ==================== Stunde 1 (für Amy) ==================== */
const LESSON = [
 { id:'l1', min:5, t:'Ankommen & Aufwärmen', body:[
  "Ein kurzes Gespräch auf Englisch, ganz ohne Korrigieren: „What did you do at the weekend?“ – „What do you usually do after school?“ – „What are you doing at the moment?“ So hört Nabiha drei Zeitformen ganz natürlich, und du siehst, wie lang ihre Sätze von allein werden und wo sie Pausen macht.",
  "Fehler merkst du dir und sprichst sie am Ende der Stunde als richtige Version noch einmal vor (Recast), statt mitten im Satz zu unterbrechen."], go:[] },
 { id:'l2', min:10, t:'Standortbestimmung', body:[
  "Auf der Seite „Üben“ die Diagnose starten: 16 Sätze, zwei pro Zeitform, jeweils erst die Zeitform, dann der Grund. Die Seite erklärt nach jeder Antwort und zeigt am Ende, bei welcher Zeitform es noch wackelt.",
  "Danach setzt Nabiha bei jeder Zeitform unter „Zeitformen“ ihre Selbsteinschätzung (😕 🙂 😀): kann sie es nur anwenden oder auch erklären? Das ist deine ehrliche Landkarte für die nächsten Wochen."], go:[['Diagnose starten', () => RUN.diag()], ['Zeitformen öffnen', () => go('tenses')]] },
 { id:'l3', min:10, t:'Die Zeiten-Landkarte', body:[
  "Gemeinsam die Zeitstrahl-Karten ansehen: Wo liegt die Handlung – jetzt, davor, danach, mehrfach, unterbrochen?",
  "Mit dem Tense-Finder drei Sätze aus Nabihas Alltag durchgehen (zum Beispiel „I go swimming on Tuesdays“, „I was doing my homework when you called“, „I have never been to London“). Entscheidend ist jedes Mal die Frage nach dem Warum."], go:[['Landkarte öffnen', () => go('map')]] },
 { id:'l4', min:20, t:'Kernstück: Erklären, wie der Lehrer es verlangt', body:[
  "Schritt 1 – Vormachen: Unter „Zeitformen“ → Present Simple die Musterantwort auf „When and why do we use the Present Simple?“ anhören.",
  "Schritt 2 – Nachsprechen: Mit „Satz für Satz nachsprechen“ wiederholt Nabiha jeden Satz, auch langsam. Die Antwort ist absichtlich in kurzen Bausteinen gebaut (We use … / For example … / We use it because …).",
  "Schritt 3 – Eigene Antwort: Nabiha schaut nicht mehr auf den Text, sieht nur die Starter-Sätze und erklärt in eigenen Worten. Im Trainer zeigt die Seite, welche Schlüsselideen schon dabei waren; fehlende kannst du mit einer Rückfrage anstoßen („Is there a typical signal word?“).",
  "Danach dasselbe mit dem Present Continuous und anschließend mit „Unterschiede“ → Present Simple vs Present Continuous („What is the difference?“). Wenn die Zeit reicht: Past Simple."], go:[['Present Simple öffnen', () => go('tenses', { tense: 'ps' })], ['Frage: Present Simple', () => go('speak', { q: 'ps1', sp: 'q' })], ['Unterschied PS/PC', () => go('diff', { contrast: 'ps_pc' })]] },
 { id:'l5', min:8, t:'Mini-Challenge: Rollenspiel „Lehrerfrage“', body:[
  "Du bist der Lehrer und stellst zwei Fragen aus dem Trainer (Zufallsfrage). Danach acht Sätze Tense Detective mit Past-/Present-Mischung, damit das Erklärte in Sätzen landet."], go:[['Zufallsfrage', () => go('speak', { q: nextQuestion().id, sp: 'q' })], ['Tense Detective', () => RUN.det('all')()]] },
 { id:'l6', min:5, t:'Abschluss & Hausübung', body:[
  "Rückblick: „Was kannst du jetzt erklären?“ – Selbsteinschätzung bei Present Simple und Present Continuous noch einmal setzen. Dann die Hausübung (siehe unten) besprechen."], go:[] }
];
function rLesson(el) {
  const total = LESSON.reduce((s, l) => s + l.min, 0);
  el.append(h('div', { class: 'card' }, h('div', { class: 'ctrl', style: 'justify-content:space-between' }, h('h2', {}, '👩‍🏫 Erste Englisch-Stunde – Ablauf'), h('button', { class: 'cbtn', onclick: () => window.print() }, '🖨 Drucken')),
    h('div', { class: 'desc' }, `Vorschlag für ${total} Minuten + 2 Minuten Puffer. Thema: Zeitformen verstehen und in eigenen Worten erklären – so, wie Nabihas Lehrer es im Unterricht fragt („Wann und warum Present Simple, Present Continuous, Past Simple, Past Continuous, Present Perfect, Past Perfect, Future Simple?“). Alles läuft ohne Timer; die Schritte kannst du abhaken.`)));
  LESSON.forEach((l, i) => {
    const done = !!DB.lesson[l.id];
    el.append(h('div', { class: 'card lesson-step' + (done ? ' done' : '') },
      h('label', { class: 'chk lhead' }, h('input', { type: 'checkbox', checked: done ? 'checked' : false, onchange: e => { DB.lesson[l.id] = e.target.checked; saveDB(); renderAll(); } }), h('b', {}, ` ${i + 1}. ${l.t}`), h('span', { class: 'min' }, `${l.min} min`)),
      l.body.map(p => h('p', {}, p)), l.go.length ? h('div', { class: 'btnrow noprint' }, l.go.map(([lab, fn]) => sbtn(lab, fn))) : ''));
  });
  const HW = ['Die Frage „When and why do we use the Present Simple?“ laut beantworten und als Sprachmemo aufnehmen (30–60 Sekunden). Dasselbe mit dem Present Continuous.', 'Tense Detective: Present Simple und Present Continuous, je 12 Sätze.', 'Zehn Grammatik-Wörter lernen (Sprechen → Grammatik-Wörter → Quiz).', 'Bonus: Jemandem zu Hause den Unterschied zwischen „I walk to school“ und „I’m walking to school today“ erklären.'];
  el.append(h('div', { class: 'card' }, h('h2', {}, '📝 Hausübung nach Stunde 1 (ca. 20 Minuten, über drei Tage)'), h('ul', { class: 'pts' }, HW.map(x => h('li', {}, x)))));
  const sp = QS.filter(q => ['tenses', 'diff', 'general'].includes(q.cat));
  el.append(h('div', { class: 'card noprint' }, h('h2', {}, '❓ Spickzettel: Fragen, die der Lehrer typischerweise stellt'), h('div', { class: 'desc' }, 'Jede Frage öffnet den Trainer mit Starter-Sätzen, Musterantwort und Schlüsselideen.'), h('div', { class: 'qgrid' }, sp.map(q => h('button', { class: 'qtile' + (DB.spoken[q.id] ? ' done' : ''), onclick: () => go('speak', { q: q.id, sp: 'q' }) }, h('span', { class: 'qq' }, q.q), h('small', {}, QCATS[q.cat]))))));
  const NEXT = [['Stunde 2 – Vergangenheit', 'Past Simple und Past Continuous; unregelmäßige Verben (go – went – gone, sing – sang – sung); Unterschied Past Simple vs Past Continuous („I was reading when …“); Fragen pas1–3, pac1–3; Error Hunt zur Vergangenheit.'], ['Stunde 3 – Present Perfect', 'Erfahrung, Ergebnis, for/since, just/already/yet; Unterschied Past Simple vs Present Perfect; typische Fehler von Deutschsprachigen („I live here since …“); Übersetzen-Aufgaben.'], ['Stunde 4 – Past Perfect & Zukunft', 'Reihenfolge von Ereignissen; will vs going to; Present Continuous für Termine; danach eine Probe-Runde, in der du sechs gemischte Lehrerfragen stellst.'], ['Stunde 5 – Wiederholung', 'Boss-Runde, Schwachstellen laut Fortschrittsseite, Lieblingsfragen noch einmal sprechen.']];
  el.append(h('div', { class: 'card' }, h('h2', {}, '📅 Vorschlag für Stunde 2–5'), NEXT.map(([a, b]) => h('p', {}, h('b', {}, a + ': '), b))));
}

/* ==================== Fortschritt ==================== */

  const lv = level(DB.xp), acc = DB.answered ? Math.round(DB.correct / DB.answered * 100) + ' %' : '–';
  el.append(h('div', { class: 'card' }, h('h2', {}, '📊 Dein Fortschritt'), h('div', { class: 'stats' }, stat('Level', lv.n), stat('XP', DB.xp), stat('Aufgaben', DB.answered), stat('Auf Anhieb richtig', acc), stat('Laut beantwortet', Object.keys(DB.spoken).length + ' / ' + QS.length))));
  el.append(h('div', { class: 'card' }, h('h2', {}, 'Die acht Zeitformen'), h('div', { class: 'desc' }, 'Genauigkeit beim Üben und deine Selbsteinschätzung beim Erklären.'),
    h('table', { class: 'rl' }, h('tr', {}, h('th', {}, 'Tense'), h('th', {}, 'Üben (Anhieb richtig)'), h('th', {}, 'Selbsteinschätzung'), h('th', {})),
      ...TENSES.map(t => { const s = DB.tst[t.id], p = s ? Math.round(s.c / s.n * 100) : null; return h('tr', {}, h('td', {}, `${t.ic} ${t.name}`), h('td', {}, p === null ? h('span', { class: 'dim' }, 'noch nichts geübt') : h('div', { class: 'bar' + (p >= 70 ? '' : ' gold') }, h('i', { style: 'width:' + p + '%' }), h('span', { class: 'barlab' }, p + ' %  (' + s.n + ')'))), h('td', {}, ['–', '😕', '🙂', '😀'][DB.rate[t.id] || 0]), h('td', {}, h('button', { class: 'task', onclick: () => go('tenses', { tense: t.id }) }, 'Öffnen'))); }))));
  const inp = h('input', { type: 'file', accept: '.json', style: 'display:none', onchange: e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { try { DB = Object.assign(defaultDB(), JSON.parse(r.result)); saveDB(); renderAll(); toast('Fortschritt geladen ✔'); } catch (er) { toast('Die Datei konnte nicht gelesen werden.'); } }; r.readAsText(f); } });
  el.append(h('div', { class: 'card' }, h('h2', {}, '💾 Sichern & Einstellungen'), h('div', { class: 'desc' }, 'Der Fortschritt liegt im Browser dieses Geräts. Mit der Sicherung kannst du ihn auf ein anderes Gerät mitnehmen.'),
    h('div', { class: 'btnrow' }, sbtn('⬇ Fortschritt sichern', () => { const b = new Blob([JSON.stringify(DB)], { type: 'application/json' }); const a = h('a', { href: URL.createObjectURL(b), download: 'tenses-talk-fortschritt.json' }); document.body.append(a); a.click(); a.remove(); }), sbtn('⬆ Fortschritt laden', () => inp.click()), inp,
      TTS ? sbtn(DB.sound ? '🔊 Ton: an' : '🔇 Ton: aus', () => { DB.sound = !DB.sound; saveDB(); renderAll(); }) : '', sbtn('🗑 Zurücksetzen', () => { if (confirm('Wirklich alles zurücksetzen?')) { DB = defaultDB(); saveDB(); renderAll(); } }))));
}

/* ==================== Aufbau ==================== */
function renderAll() {
  const nav = $('#topnav'); nav.innerHTML = '';
  TABS.forEach(([id, label]) => nav.append(h('button', { class: 'tabbtn' + (V.tab === id ? ' on' : ''), onclick: () => go(id) }, label)));
  const root = $('#tabs'); root.innerHTML = ''; const el = h('div', { class: 'tab on' }); root.append(el);
  ({ home: rHome, map: rMap, tenses: rTenses, diff: rDiff, speak: rSpeak, practice: rPractice, lesson: rLesson, prog: rProg })[V.tab](el);
}
function init() {
  $('#backBtn').onclick = endRun;
  $('#nextBtn').onclick = goNext;
  document.addEventListener('keydown', e => { if (!G) return; const t = e.target && e.target.tagName; if (e.key === 'Enter' && $('#nextRow').style.display !== 'none' && t !== 'INPUT') { e.preventDefault(); goNext(); } });
  showView('menu'); renderAll();
}

init();
