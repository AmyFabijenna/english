<!DOCTYPE html>
<html lang="de">
<head>
<script src="passwort.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Englisch Oberstufe – der komplette Kurs (9.–12. Schulstufe)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f2ec; --card:#ffffff; --ink:#1b1b1f; --muted:#56535d; --line:#e3ddd3;
  --blue:#3a5a8c; --blue-soft:#e7edf6;
  --petrol:#1d6b74; --petrol-soft:#e3eff1;
  --lilac:#5d4a7e; --lilac-soft:#eee9f5;
  --terra:#9c4f3d; --terra-soft:#f6e9e4;
  --gold:#a7843b; --gold-soft:#f6efdf;
  --radius:20px; --shadow:0 6px 24px rgba(40,30,20,.07);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Lexend',system-ui,sans-serif;font-size:18px;line-height:1.75}
h1,h2,h3,h4{line-height:1.3;font-weight:600;margin:0 0 .6em}
h2{font-size:1.75rem} h3{font-size:1.25rem;margin-top:1.5em} h4{font-size:1.05rem}
p{margin:0 0 1em} a{color:var(--blue)}
ul{margin:0 0 1em;padding-left:1.3em} li{margin-bottom:.35em}
.gap{letter-spacing:.04em;color:#8a8490}
.la{font-style:italic;font-weight:500;color:#2c3f63}
.la b.e,b.e{color:var(--terra);font-weight:600}
.note .la,.fb .gap{letter-spacing:.04em;color:#8a8490}
.la{color:inherit}
.big{font-size:1.15rem;line-height:1.9}
.vers{background:var(--bg);border-radius:14px;padding:12px 18px;margin:12px 0;font-size:1.1rem;line-height:2.1;overflow-x:auto;white-space:nowrap}
.vers u{text-decoration:none;border-bottom:3px solid var(--blue);padding-bottom:1px}
.vers s{text-decoration:none;border-bottom:3px dotted var(--terra);padding-bottom:1px}

.topbar{position:sticky;top:0;z-index:60;background:rgba(245,242,236,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 18px}
.topbar .brand{font-weight:600;cursor:pointer;white-space:nowrap}
.topbar .brand small{font-weight:400;color:var(--muted)}
.topbar .grow{flex:1}
.pbar{width:150px;height:10px;background:#e6dfd3;border-radius:99px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--petrol);border-radius:99px;width:0;transition:.4s}
.ptxt{font-size:.85rem;color:var(--muted);white-space:nowrap}
#menuBtn{display:none}

.layout{display:grid;grid-template-columns:320px minmax(0,1fr);max-width:1380px;margin:0 auto}
aside{position:sticky;top:57px;height:calc(100vh - 57px);overflow-y:auto;padding:18px 14px 40px;border-right:1px solid var(--line)}
aside input{width:100%;font:inherit;font-size:.95rem;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:#fff;margin-bottom:10px}
aside h5{margin:16px 6px 6px;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
aside a.ch{display:flex;gap:8px;align-items:center;text-decoration:none;color:var(--ink);padding:7px 10px;border-radius:12px;font-size:.93rem;line-height:1.35}
aside a.ch:hover{background:#fff}
aside a.ch.on{background:#fff;box-shadow:var(--shadow);font-weight:500}
aside a.ch .dot{flex-shrink:0;width:18px;height:18px;border-radius:50%;border:2px solid var(--line);font-size:.7rem;display:grid;place-items:center;color:#fff}
aside a.ch.done .dot{background:var(--petrol);border-color:var(--petrol)}
aside a.ch.part .dot{border-color:var(--gold);background:var(--gold-soft)}
aside a.homelink{display:block;text-decoration:none;color:var(--ink);padding:8px 10px;border-radius:12px;font-weight:500}
aside a.homelink:hover{background:#fff}
main{padding:28px 30px 90px;min-width:0}
.inner{max-width:880px;margin:0 auto}

.hero{background:linear-gradient(135deg,#2f4a75 0%,#1d5d68 50%,#4a3e6b 100%);color:#fff;padding:44px 38px;border-radius:30px;margin-bottom:26px}
.hero h1{font-size:2.3rem;font-weight:700;margin-bottom:.3em}
.hero p{font-size:1.1rem;max-width:720px;opacity:.96;margin-bottom:0}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.chips span{background:rgba(255,255,255,.15);border-radius:999px;padding:6px 14px;font-size:.92rem}

.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:26px 28px;margin-bottom:20px;border:1px solid #efe9df}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.tile{display:block;text-decoration:none;color:var(--ink);background:#fff;border-radius:16px;padding:14px 16px;border:1px solid #efe9df;border-left:6px solid var(--blue);transition:.15s}
.tile:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.tile b{display:block;font-weight:500;line-height:1.35}
.tile small{color:var(--muted)}
.tile.done{background:var(--petrol-soft)}
.cG{--c:var(--blue);--cs:var(--blue-soft)}.cU{--c:var(--petrol);--cs:var(--petrol-soft)}.cW{--c:var(--gold);--cs:var(--gold-soft)}.cT{--c:var(--lilac);--cs:var(--lilac-soft)}.cP{--c:var(--terra);--cs:var(--terra-soft)}
.tile{border-left-color:var(--c)} aside h5{color:var(--c)}
.step3{counter-reset:s}
.step3 .card{position:relative;padding-top:54px;margin:0}
.step3 .card:before{counter-increment:s;content:counter(s);position:absolute;top:16px;left:24px;width:32px;height:32px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:600}

.chead{border-radius:26px;padding:30px 32px;background:var(--cs);border-top:6px solid var(--c);margin-bottom:22px}
.chead h2{margin-bottom:.35em}
.tag{display:inline-block;font-size:.8rem;padding:3px 11px;border-radius:999px;font-weight:500;background:#fff;color:var(--c);margin-right:6px}
.goals{margin:14px 0 0;padding-left:1.2em;font-size:.98rem}
.goals li{margin-bottom:.15em}
.formula{background:var(--bg);border-radius:14px;padding:12px 18px;margin:12px 0;overflow-x:auto}
.note{border-left:5px solid var(--gold);background:var(--gold-soft);padding:14px 18px;border-radius:12px;margin:14px 0}
.note.f{border-color:var(--terra);background:var(--terra-soft)}
.note.t{border-color:var(--petrol);background:var(--petrol-soft)}
.note b.lab{display:block;font-size:.8rem;letter-spacing:.05em;text-transform:uppercase;margin-bottom:2px}
.tw{overflow-x:auto;margin:12px 0}
table.plain{width:100%;border-collapse:separate;border-spacing:0;font-size:.97rem}
table.plain th{background:var(--cs);text-align:left;padding:10px 14px;font-weight:600}
table.plain td{padding:9px 14px;border-bottom:1px solid var(--line);vertical-align:top}
table.plain tr:last-child td{border-bottom:none}
table.plain th:first-child{border-radius:12px 0 0 0}table.plain th:last-child{border-radius:0 12px 0 0}
figure{margin:14px 0;text-align:center}
figure svg{max-width:100%;height:auto;background:#fff;border-radius:16px;border:1px solid var(--line)}
figcaption{font-size:.88rem;color:var(--muted);margin-top:4px}

.walk{background:#fff;border-radius:18px;box-shadow:var(--shadow);padding:22px 26px;margin:20px 0;border:1px solid #efe9df}
.walk h4{color:var(--c);margin-bottom:.3em}
.walk .task{background:var(--bg);border-radius:14px;padding:14px 18px;margin:8px 0 12px}
.wstep{display:none;gap:14px;padding:12px 0;border-top:1px dashed var(--line);animation:fade .35s}
.wstep.show{display:flex}
.wstep .n{flex-shrink:0;width:32px;height:32px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:.9rem;font-weight:600}
.wstep>div:last-child{min-width:0;flex:1}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1}}

button{font-family:inherit;font-size:1rem;border:none;border-radius:14px;padding:10px 20px;cursor:pointer;background:var(--blue);color:#fff;transition:.2s}
button:hover{filter:brightness(1.08)}
button.ghost{background:#fff;color:var(--blue);border:2px solid var(--blue);padding:8px 18px}
button.petrol{background:var(--petrol)} button.lilac{background:var(--lilac)}
button:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}

.ex{background:#fff;border-radius:18px;border:1px solid #efe9df;box-shadow:var(--shadow);padding:20px 24px;margin-bottom:16px}
.ex.ok{border-left:6px solid var(--petrol)}
.ex.no{border-left:6px solid var(--terra)}
.ex .nr{font-size:.82rem;font-weight:600;color:var(--c);letter-spacing:.05em;text-transform:uppercase}
.ex input[type=text]{font:inherit;padding:9px 14px;border-radius:12px;border:2px solid var(--line);width:210px;max-width:100%}
.ex input[type=text]:focus{outline:none;border-color:var(--blue)}
.ex .unit{color:var(--muted);font-size:.95rem}
.opts{display:grid;gap:8px;margin:10px 0}
.opt{display:block;text-align:left;background:var(--bg);color:var(--ink);border:2px solid transparent;border-radius:14px;padding:10px 16px;cursor:pointer;font:inherit;line-height:1.5}
.opt:hover{border-color:var(--blue);filter:none}
.opt.right{background:var(--petrol-soft);border-color:var(--petrol)}
.opt.wrong{background:var(--terra-soft);border-color:var(--terra)}
.fb{margin-top:12px;border-radius:14px;padding:12px 16px;display:none}
.fb.show{display:block;animation:fade .3s}
.fb.good{background:var(--petrol-soft)} .fb.bad{background:var(--terra-soft)} .fb.hint{background:var(--gold-soft)}
.fb b.h{display:block;margin-bottom:2px}
.hintline{font-size:.88rem;color:var(--muted);margin-top:6px}
.navrow{display:flex;justify-content:space-between;gap:12px;margin-top:34px;flex-wrap:wrap}
.score{font-weight:600;color:var(--petrol)}
.phi{background:var(--bg);border-radius:14px;padding:14px 18px;margin:12px 0}
.phi input{font:inherit;width:110px;padding:7px 10px;border-radius:10px;border:2px solid var(--line)}
footer{color:var(--muted);font-size:.85rem;margin-top:50px;text-align:center}

@media(max-width:560px){.ptxt{display:none}}
@media(max-width:980px){
  .layout{grid-template-columns:1fr}
  aside{position:fixed;left:0;top:57px;width:min(330px,88vw);background:var(--bg);z-index:55;transform:translateX(-105%);transition:.25s;box-shadow:0 0 40px rgba(0,0,0,.2)}
  aside.open{transform:none}
  #menuBtn{display:block;padding:7px 14px}
  main{padding:20px 14px 80px}
  .hero{padding:30px 24px}.hero h1{font-size:1.8rem}
  .pbar{width:80px}
  .topbar .brand small{display:none}
  .topbar{gap:8px;padding:8px 12px}.topbar .brand{overflow:hidden;text-overflow:ellipsis;font-size:.95rem}
  #menuBtn{white-space:nowrap;flex-shrink:0}
  .pbar{flex-shrink:0;width:64px}
  .card,.walk,.ex{padding:18px 16px}.chead{padding:22px 18px}
  .ex input[type=text]{width:100%}
  body{font-size:17px}
}
</style>
</head>

<script>
const DATA={"chapters":[{"id":"zeiten","t":"Die Zeiten im Überblick: welche wann?","kl":"1","k":1,"a":"G","tag":"Basis","goals":["die zwölf Zeitformen des Englischen benennen und bilden","an Signalwörtern erkennen, welche Zeit verlangt ist","die drei Fragen beantworten, mit denen man jede Zeitform findet","die typischen Verwechslungen deutschsprachiger Lernender vermeiden"],"ex":[{"type":"mc","q":"Welche Zeit gehört in den Satz <span class=\"la\">I <span class=\"gap\">___<\/span> her since we were at school together<\/span>?","h":"Achte auf <span class=\"la\">since<\/span> und darauf, dass die Bekanntschaft bis heute besteht.","s":"<span class=\"la\">since<\/span> verbindet einen Anfangspunkt mit der Gegenwart, das verlangt das Present Perfect. Weil <span class=\"la\">know<\/span> ein Zustandsverb ist, steht hier die einfache Form: <span class=\"la\">I have known her since …<\/span>","o":["Present Perfect: <span class=\"la\">have known<\/span>","Simple Present: <span class=\"la\">know<\/span>","Simple Past: <span class=\"la\">knew<\/span>","Past Perfect: <span class=\"la\">had known<\/span>"]},{"type":"mc","q":"Welche Zeit gehört in den Satz <span class=\"la\">She <span class=\"gap\">___<\/span> dinner when the lights went out<\/span>?","h":"Eine Handlung läuft, die andere unterbricht sie.","s":"Die laufende Handlung im Hintergrund steht im Past Progressive, das plötzliche Ereignis im Simple Past. Mit <span class=\"la\">cooked<\/span> klängen beide Handlungen nacheinander abgeschlossen.","o":["Past Progressive: <span class=\"la\">was cooking<\/span>","Simple Past: <span class=\"la\">cooked<\/span>","Past Perfect: <span class=\"la\">had cooked<\/span>","Present Perfect: <span class=\"la\">has cooked<\/span>"]},{"type":"mc","q":"Welche Zeit gehört in den Satz _By the time we got to the station, the train <span class=\"gap\">___<\/span>?","h":"Was war zuerst, das Ankommen oder die Abfahrt?","s":"Von zwei Handlungen in der Vergangenheit steht die frühere im Past Perfect. <span class=\"la\">By the time<\/span> ist dafür ein verlässliches Signal.","o":["Past Perfect: <span class=\"la\">had left<\/span>","Simple Past: <span class=\"la\">left<\/span>","Past Progressive: <span class=\"la\">was leaving<\/span>","Present Perfect: <span class=\"la\">has left<\/span>"]},{"type":"txt","a":["am going to rain","is going to rain"],"q":"Vervollständige: <span class=\"la\">Look at those black clouds! It <span class=\"gap\">___<\/span>.<\/span> Setze die ganze Verbform ein.","h":"Es gibt ein sichtbares Anzeichen in der Gegenwart.","s":"Richtig ist <span class=\"la\">is going to rain<\/span>. Sichtbare Anzeichen verlangen <span class=\"la\">going to<\/span>. <span class=\"la\">will<\/span> wäre eine spontane Vermutung ohne Beleg."},{"type":"txt","a":["leaves","is leaving"],"q":"Vervollständige: <span class=\"la\">Our train <span class=\"gap\">___<\/span> (leave) at 7.15 tomorrow morning.<\/span>","h":"Fahrpläne behandelt das Englische wie Tatsachen.","s":"Fahrpläne stehen im Simple Present: <span class=\"la\">leaves<\/span>. Als fester persönlicher Plan wäre auch <span class=\"la\">is leaving<\/span> richtig; <span class=\"la\">will leave<\/span> passt hier nicht."},{"type":"mc","q":"In welchem Satz ist die Zeitform <b class=\"e\">falsch<\/b>?","h":"Ein Verb hat hier zwei verschiedene Bedeutungen.","s":"<span class=\"la\">have<\/span> im Sinn von besitzen oder verwandt sein steht nie in der Verlaufsform: <span class=\"la\">I have a brother.<\/span> In der Bedeutung „einnehmen, erleben“ ist die Verlaufsform dagegen richtig.","o":["<span class=\"la\">I am having a brother and two sisters.<\/span>","<span class=\"la\">I am having lunch at the moment.<\/span>","<span class=\"la\">She has a new bike.<\/span>","<span class=\"la\">We are having a wonderful time.<\/span>"]},{"type":"mc","q":"Welche Zeit verlangt <span class=\"la\">This time next week<\/span>?","h":"Gefragt ist ein Verlauf zu einem bestimmten Zeitpunkt in der Zukunft.","s":"<span class=\"la\">This time next week<\/span> nennt einen Zeitpunkt, zu dem etwas gerade ablaufen wird. Dafür gibt es im Englischen eine eigene Form, das Future Progressive.","o":["Future Progressive: <span class=\"la\">I will be lying on a beach.<\/span>","Simple Present: <span class=\"la\">I lie on a beach.<\/span>","Present Perfect: <span class=\"la\">I have lain on a beach.<\/span>","Simple Past: <span class=\"la\">I lay on a beach.<\/span>"]},{"type":"txt","a":["had been working","had worked"],"q":"Vervollständige: <span class=\"la\">He <span class=\"gap\">___<\/span> (work) at the hotel for ten years before he moved to Linz.<\/span>","h":"Welche der beiden Vergangenheiten liegt weiter zurück?","s":"Richtig ist <span class=\"la\">had been working<\/span> oder <span class=\"la\">had worked<\/span>. Das Past Perfect zeigt an, dass diese Handlung noch vor dem Umzug lag; die Verlaufsform betont zusätzlich die Dauer."},{"type":"self","q":"Erkläre in zwei oder drei Sätzen den Unterschied zwischen <span class=\"la\">I worked in a café<\/span> und <span class=\"la\">I have worked in a café<\/span>.","s":"<span class=\"la\">I worked in a café<\/span> bezieht sich auf einen abgeschlossenen Abschnitt der Vergangenheit, der nichts mehr mit jetzt zu tun hat; man ergänzt oft einen Zeitpunkt: <span class=\"la\">last summer<\/span>. <span class=\"la\">I have worked in a café<\/span> sagt etwas über die Gegenwart aus, nämlich dass ich diese Erfahrung habe oder dass ich noch immer dort arbeite. Im Deutschen steht in beiden Fällen oft dasselbe Perfekt, deshalb ist diese Unterscheidung so fehleranfällig."}],"gen":["tense","irr"],"html":"<h3>Warum das Englische mehr Zeiten hat als das Deutsche<\/h3>\n<p>Im Deutschen gibt es sechs Zeitformen, im Englischen zwölf. Der Grund ist einfach: Zu jeder Zeitstufe gibt es eine einfache Form (<span class=\"la\">simple<\/span>) und eine Verlaufsform (<span class=\"la\">progressive<\/span>), und zu jeder gibt es zusätzlich eine abgeschlossene Variante (<span class=\"la\">perfect<\/span>). Daraus ergibt sich ein Raster, das du dir einmal einprägen solltest, weil danach fast jede Zeitenfrage mechanisch zu lösen ist.<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th><\/th><th>simple<\/th><th>progressive<\/th><th>perfect<\/th><th>perfect progressive<\/th><\/tr><tr><td>Gegenwart<\/td><td><span class=\"la\">I work<\/span><\/td><td><span class=\"la\">I am working<\/span><\/td><td><span class=\"la\">I have worked<\/span><\/td><td><span class=\"la\">I have been working<\/span><\/td><\/tr><tr><td>Vergangenheit<\/td><td><span class=\"la\">I worked<\/span><\/td><td><span class=\"la\">I was working<\/span><\/td><td><span class=\"la\">I had worked<\/span><\/td><td><span class=\"la\">I had been working<\/span><\/td><\/tr><tr><td>Zukunft<\/td><td><span class=\"la\">I will work<\/span><\/td><td><span class=\"la\">I will be working<\/span><\/td><td><span class=\"la\">I will have worked<\/span><\/td><td><span class=\"la\">I will have been working<\/span><\/td><\/tr><\/table><\/div>\n<h3>Drei Fragen führen immer zur richtigen Zeit<\/h3>\n<p>Bevor du eine Form einsetzt, beantworte in dieser Reihenfolge:<\/p>\n<ul><li><b class=\"e\">Wann?<\/b> Gegenwart, Vergangenheit oder Zukunft? Das entscheidet die Zeile im Raster.<\/li><li><b class=\"e\">Abgeschlossen oder nicht?<\/b> Reicht die Handlung bis zu einem späteren Punkt oder hat sie Folgen für ihn? Dann brauchst du eine <span class=\"la\">perfect<\/span>-Form.<\/li><li><b class=\"e\">Verlauf oder Tatsache?<\/b> Geht es darum, dass etwas gerade abläuft oder eine Weile andauert? Dann brauchst du eine <span class=\"la\">progressive<\/span>-Form.<\/li><\/ul>\n<div class=\"note\"><b class=\"lab\">Merke<\/b>Diese drei Fragen lösen auch Aufgaben, bei denen kein Signalwort dasteht. Signalwörter sind eine Abkürzung, kein Ersatz für das Mitdenken.<\/div>\n<h3>Die wichtigsten Signalwörter<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Zeitform<\/th><th>Signalwörter<\/th><th>Beispiel<\/th><\/tr><tr><td>Simple Present<\/td><td><span class=\"la\">always, usually, often, every day<\/span><\/td><td><span class=\"la\">She usually walks to school.<\/span><\/td><\/tr><tr><td>Present Progressive<\/td><td><span class=\"la\">now, at the moment, look!, listen!<\/span><\/td><td><span class=\"la\">Look! It is snowing.<\/span><\/td><\/tr><tr><td>Simple Past<\/td><td><span class=\"la\">yesterday, last week, in 1999, ago<\/span><\/td><td><span class=\"la\">We met them two years ago.<\/span><\/td><\/tr><tr><td>Past Progressive<\/td><td><span class=\"la\">while, as, at eight o'clock<\/span><\/td><td><span class=\"la\">While I was reading, he called.<\/span><\/td><\/tr><tr><td>Present Perfect<\/td><td><span class=\"la\">since, for, just, already, yet, ever, never<\/span><\/td><td><span class=\"la\">I have known her since 2019.<\/span><\/td><\/tr><tr><td>Past Perfect<\/td><td><span class=\"la\">before, after, by the time, already<\/span><\/td><td><span class=\"la\">She had left before I arrived.<\/span><\/td><\/tr><tr><td>will-Future<\/td><td><span class=\"la\">probably, I think, I am sure<\/span><\/td><td><span class=\"la\">I think it will rain.<\/span><\/td><\/tr><tr><td>going to<\/td><td>sichtbare Anzeichen, feste Absicht<\/td><td><span class=\"la\">Look at those clouds. It is going to rain.<\/span><\/td><\/tr><\/table><\/div>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>Die mit Abstand häufigste Verwechslung: Im Deutschen heißt es „Ich wohne seit 2019 in Wien“, im Englischen aber <span class=\"la\">I have lived in Vienna since 2019<\/span>. Alles, was mit <span class=\"la\">since<\/span> oder <span class=\"la\">for<\/span> bis jetzt reicht, braucht das Present Perfect, niemals das Present Simple.<\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Die richtige Zeit in vier Schritten finden<\/h4><div class=\"task\">Setze ein: <span class=\"la\">We <span class=\"gap\">___<\/span> (wait) here for two hours and the bus still hasn't come.<\/span><\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div><b class=\"e\">Wann?<\/b> Das Warten begann in der Vergangenheit und dauert bis jetzt an. Also keine reine Vergangenheit, sondern eine Verbindung zu jetzt.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div><b class=\"e\">Abgeschlossen?<\/b> Die Verbindung zur Gegenwart verlangt eine <span class=\"la\">perfect<\/span>-Form. Das bestätigt auch <span class=\"la\">for two hours<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div><b class=\"e\">Verlauf?<\/b> Es geht um eine Dauer, nicht um ein Ergebnis. Also die Verlaufsform.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Ergebnis: <span class=\"la\">We have been waiting here for two hours.<\/span> Die einfache Form <span class=\"la\">We have waited<\/span> wäre nicht falsch, betont aber das Ergebnis statt die Dauer.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"present","t":"Present Simple und Present Progressive","kl":"1","k":1,"a":"G","tag":"Basis","goals":["beide Gegenwartsformen bilden, auch in Frage und Verneinung","entscheiden, welche von beiden ein Satz verlangt","die Verben kennen, die keine Verlaufsform bilden","das dritte s sicher setzen"],"ex":[{"type":"txt","a":["studies"],"q":"Setze ein: <span class=\"la\">She <span class=\"gap\">___<\/span> (study) medicine in Vienna.<\/span>","s":"Nach Konsonant plus y wird das y zu <span class=\"la\">-ies<\/span>: <span class=\"la\">study – studies<\/span>. Dieselbe Regel gilt für <span class=\"la\">carry, worry, try<\/span>."},{"type":"txt","a":["does not go","doesn't go"],"q":"Setze ein, verneint: <span class=\"la\">He <span class=\"gap\">___<\/span> (not / go) to the gym on Sundays.<\/span>","h":"Die Verneinung im Simple Present braucht ein Hilfsverb.","s":"Richtig ist <span class=\"la\">does not go<\/span> beziehungsweise <span class=\"la\">doesn't go<\/span>. Nach dem Hilfsverb steht die Grundform ohne s."},{"type":"mc","q":"Welcher Satz ist richtig?","h":"<span class=\"la\">understand<\/span> gehört zu einer besonderen Gruppe von Verben.","s":"<span class=\"la\">understand<\/span> ist ein Zustandsverb und bildet keine Verlaufsform. Die Verneinung lautet deshalb <span class=\"la\">do not understand<\/span>.","o":["<span class=\"la\">I do not understand this rule.<\/span>","<span class=\"la\">I am not understanding this rule.<\/span>","<span class=\"la\">I am not understand this rule.<\/span>","<span class=\"la\">I not understand this rule.<\/span>"]},{"type":"mc","q":"Welcher Satz passt zu „Er verliert ständig seine Schlüssel, und das nervt“?","h":"Es schwingt Ärger mit.","s":"Present Progressive mit <span class=\"la\">always<\/span> drückt Ärger oder Verwunderung über eine Gewohnheit aus. Die einfache Form <span class=\"la\">he always loses<\/span> wäre eine neutrale Feststellung.","o":["<span class=\"la\">He is always losing his keys.<\/span>","<span class=\"la\">He always loses his keys.<\/span>","<span class=\"la\">He always is losing his keys.<\/span>","<span class=\"la\">He has always lost his keys.<\/span>"]},{"type":"txt","a":["Does your sister speak","Does your sister talk"],"q":"Bilde die Frage: <span class=\"la\">(your sister / speak) Italian?<\/span>","s":"Richtig ist <span class=\"la\">Does your sister speak Italian?<\/span> Das Hilfsverb <span class=\"la\">does<\/span> steht am Anfang, das Vollverb bleibt in der Grundform."},{"type":"mc","q":"Welcher Satz beschreibt einen Fahrplan richtig?","h":"Fahrpläne behandelt das Englische wie unveränderliche Tatsachen.","s":"Fahrpläne, Öffnungszeiten und Stundenpläne stehen im Simple Present. Die Verlaufsform wäre ein persönlicher Plan, <span class=\"la\">will<\/span> eine Vermutung.","o":["<span class=\"la\">The last train leaves at 11.40.<\/span>","<span class=\"la\">The last train is leaving at 11.40.<\/span>","<span class=\"la\">The last train will leave at 11.40.<\/span>","<span class=\"la\">The last train leave at 11.40.<\/span>"]},{"type":"txt","a":["is having","'s having"],"q":"Setze ein: <span class=\"la\">Be quiet, please. The baby <span class=\"gap\">___<\/span> (have) a nap.<\/span>","h":"<span class=\"la\">have<\/span> hat hier nicht die Bedeutung „besitzen“.","s":"Richtig ist <span class=\"la\">is having<\/span>. In der Bedeutung „einnehmen, erleben, machen“ bildet <span class=\"la\">have<\/span> sehr wohl eine Verlaufsform: <span class=\"la\">have a nap, have lunch, have a good time<\/span>."},{"type":"mc","q":"In welchem Satz ist die Form <b class=\"e\">falsch<\/b>?","s":"Nach <span class=\"la\">does<\/span> steht immer die Grundform ohne s. Das dritte s erscheint nur einmal im Satz, entweder im Vollverb oder im Hilfsverb.","o":["<span class=\"la\">Does she lives in Graz?<\/span>","<span class=\"la\">Does she live in Graz?<\/span>","<span class=\"la\">She lives in Graz.<\/span>","<span class=\"la\">She does not live in Graz.<\/span>"]},{"type":"self","q":"Beschreibe deinen gewöhnlichen Dienstag in vier Sätzen im Simple Present und sage dann in zwei Sätzen im Present Progressive, was gerade jetzt anders ist.","s":"Ein mögliches Muster: <span class=\"la\">On a normal Tuesday I get up at half past six, I catch the bus at ten to eight and I have four lessons before lunch. In the afternoon I usually meet friends. This week, though, I am staying at my grandmother's, so I am taking the train instead of the bus.<\/span> Entscheidend ist der Wechsel: Regel im Simple, Ausnahme im Progressive."}],"gen":["tense","coll"],"html":"<h3>Bildung<\/h3>\n<div class=\"formula\"><span class=\"la\">Simple Present:<\/span> I / you / we / they <b class=\"e\">work<\/b> · he / she / it <b class=\"e\">works<\/b><\/div>\n<div class=\"formula\"><span class=\"la\">Present Progressive:<\/span> <b class=\"e\">am / is / are<\/b> + <b class=\"e\">working<\/b><\/div>\n<p>In Frage und Verneinung braucht das Simple Present das Hilfsverb <span class=\"la\">do<\/span>, die Verlaufsform nicht:<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th><\/th><th>Aussage<\/th><th>Frage<\/th><th>Verneinung<\/th><\/tr><tr><td>Simple<\/td><td><span class=\"la\">She works here.<\/span><\/td><td><span class=\"la\">Does she work here?<\/span><\/td><td><span class=\"la\">She does not work here.<\/span><\/td><\/tr><tr><td>Progressive<\/td><td><span class=\"la\">She is working.<\/span><\/td><td><span class=\"la\">Is she working?<\/span><\/td><td><span class=\"la\">She is not working.<\/span><\/td><\/tr><\/table><\/div>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>Nach <span class=\"la\">does<\/span> und <span class=\"la\">doesn't<\/span> steht nie ein zweites s: <span class=\"la\">Does she works here?<\/span> ist falsch. Das s wandert gewissermaßen ins Hilfsverb.<\/div>\n<h3>Schreibung des dritten s<\/h3>\n<ul><li>Nach Zischlauten steht <span class=\"la\">-es<\/span>: <span class=\"la\">watches, passes, mixes, goes, does.<\/span><\/li><li>Nach Konsonant plus y wird y zu <span class=\"la\">-ies<\/span>: <span class=\"la\">study – studies, carry – carries.<\/span> Nach Vokal plus y bleibt es: <span class=\"la\">play – plays.<\/span><\/li><li>Unregelmäßig: <span class=\"la\">have – has.<\/span><\/li><\/ul>\n<h3>Wann welche Form?<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Simple Present<\/th><th>Present Progressive<\/th><\/tr><tr><td>Gewohnheiten: <span class=\"la\">I get up at seven.<\/span><\/td><td>Vorgang jetzt: <span class=\"la\">I am getting up.<\/span><\/td><\/tr><tr><td>Tatsachen: <span class=\"la\">Water boils at 100 degrees.<\/span><\/td><td>Vorübergehendes: <span class=\"la\">He is living with friends this month.<\/span><\/td><\/tr><tr><td>Fahrpläne: <span class=\"la\">The bus leaves at six.<\/span><\/td><td>Feste Pläne: <span class=\"la\">We are meeting at six.<\/span><\/td><\/tr><tr><td>Zustandsverben: <span class=\"la\">I believe you.<\/span><\/td><td>Ärger mit <span class=\"la\">always<\/span>: <span class=\"la\">He is always losing his keys.<\/span><\/td><\/tr><\/table><\/div>\n<h3>Verben ohne Verlaufsform<\/h3>\n<p>Diese Verben beschreiben Zustände, keine Vorgänge, und stehen deshalb normalerweise nicht in der <span class=\"la\">-ing<\/span>-Form:<\/p>\n<ul><li>Denken und Meinen: <span class=\"la\">believe, know, understand, remember, forget, mean, agree<\/span><\/li><li>Gefühle: <span class=\"la\">like, love, hate, prefer, want, need<\/span><\/li><li>Sinne: <span class=\"la\">see, hear, smell, taste<\/span><\/li><li>Besitz und Zugehörigkeit: <span class=\"la\">have, own, belong, contain, cost<\/span><\/li><\/ul>\n<div class=\"note t\"><b class=\"lab\">Tipp<\/b>Manche dieser Verben haben eine zweite Bedeutung, in der die Verlaufsform sehr wohl möglich ist: <span class=\"la\">I am thinking about your offer<\/span> (Vorgang) gegenüber <span class=\"la\">I think you are right<\/span> (Meinung). Ebenso <span class=\"la\">I am seeing the dentist tomorrow<\/span> im Sinn eines Termins.<\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Simple oder Progressive entscheiden<\/h4><div class=\"task\">Setze ein: <span class=\"la\">Normally I <span class=\"gap\">___<\/span> (work) in the office, but this week I <span class=\"gap\">___<\/span> (work) from home.<\/span><\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Der erste Teil beschreibt die Gewohnheit, erkennbar an <span class=\"la\">normally<\/span>. Gewohnheiten stehen im Simple Present: <span class=\"la\">I work<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Der zweite Teil beschreibt eine vorübergehende Ausnahme, erkennbar an <span class=\"la\">this week<\/span>. Vorübergehendes steht in der Verlaufsform: <span class=\"la\">I am working<\/span>.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">3<\/div><div>Ergebnis: <span class=\"la\">Normally I work in the office, but this week I am working from home.<\/span> Genau dieser Gegensatz zwischen Regel und Ausnahme ist die eigentliche Aufgabe der beiden Formen.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"past","t":"Past Simple, Past Progressive und used to","kl":"1","k":1,"a":"G","tag":"Basis","goals":["die Vergangenheitsformen bilden, auch unregelmäßig","entscheiden, wann der Verlauf und wann das Ereignis gemeint ist","_used to_ und _would_ für vergangene Gewohnheiten richtig einsetzen","die Falle „deutsches Perfekt gleich englisches Present Perfect“ vermeiden"],"ex":[{"type":"txt","a":["stopped"],"q":"Setze ein: <span class=\"la\">The car <span class=\"gap\">___<\/span> (stop) right in front of our house.<\/span>","s":"Einsilbige Wörter mit kurzem Vokal verdoppeln vor <span class=\"la\">-ed<\/span> den Endkonsonanten: <span class=\"la\">stop – stopped<\/span>. Ebenso <span class=\"la\">plan – planned<\/span> und <span class=\"la\">chat – chatted<\/span>."},{"type":"txt","a":["did not understand","didn't understand"],"q":"Setze ein, verneint: <span class=\"la\">She <span class=\"gap\">___<\/span> (not / understand) the question.<\/span>","h":"Nach dem Hilfsverb steht die Grundform.","s":"Richtig ist <span class=\"la\">did not understand<\/span>. Die Vergangenheit steckt bereits in <span class=\"la\">did<\/span>, deshalb darf das Vollverb nicht noch einmal in der zweiten Form stehen."},{"type":"mc","q":"Welcher Satz ist richtig?","h":"Welche der beiden Handlungen bildet den Rahmen?","s":"Der Heimweg ist der Rahmen und steht im Past Progressive, der Fund ist das Ereignis und steht im Simple Past. <span class=\"la\">find<\/span> ist außerdem ein Verb, das kaum in der Verlaufsform vorkommt.","o":["<span class=\"la\">While I was walking home, I found a wallet.<\/span>","<span class=\"la\">While I walked home, I was finding a wallet.<\/span>","<span class=\"la\">While I was walking home, I was finding a wallet.<\/span>","<span class=\"la\">While I walked home, I found a wallet.<\/span>"]},{"type":"mc","q":"Welcher Satz drückt aus, dass etwas früher so war und heute nicht mehr?","h":"Achte darauf, ob eine Form von <span class=\"la\">be<\/span> davorsteht.","s":"<span class=\"la\">used to<\/span> ohne <span class=\"la\">be<\/span> beschreibt eine vergangene Gewohnheit oder einen vergangenen Zustand. <span class=\"la\">be used to<\/span> heißt „gewohnt sein“ und verlangt danach die <span class=\"la\">-ing<\/span>-Form.","o":["<span class=\"la\">I used to live in Salzburg.<\/span>","<span class=\"la\">I am used to living in Salzburg.<\/span>","<span class=\"la\">I would live in Salzburg.<\/span>","<span class=\"la\">I was used to live in Salzburg.<\/span>"]},{"type":"txt","a":["was reading","'ve been reading"],"q":"Setze ein: <span class=\"la\">I <span class=\"gap\">___<\/span> (read) in the garden when it started to rain.<\/span>","s":"Richtig ist <span class=\"la\">was reading<\/span>. Die Handlung lief bereits, als das Ereignis sie unterbrach."},{"type":"mc","q":"Welche deutsche Form entspricht <span class=\"la\">We visited Rome in 2019<\/span>?","h":"Das deutsche Perfekt entspricht sehr oft dem englischen Simple Past.","s":"Mit einer abgeschlossenen Zeitangabe steht im Englischen das Simple Past, im Deutschen dagegen meist das Perfekt. Wer vom Deutschen ausgeht, setzt hier fälschlich <span class=\"la\">have visited<\/span> ein.","o":["„Wir haben Rom 2019 besucht.“","„Wir besuchen Rom seit 2019.“","„Wir hatten Rom besucht.“","„Wir werden Rom besuchen.“"]},{"type":"txt","a":["would drive","used to drive"],"q":"Setze ein: <span class=\"la\">Every summer my grandparents <span class=\"gap\">___<\/span> (drive) us to the lake.<\/span>","h":"Es geht um eine wiederholte Handlung, nicht um einen Zustand.","s":"Richtig sind <span class=\"la\">would drive<\/span> und <span class=\"la\">used to drive<\/span>. Für wiederholte Handlungen in der Vergangenheit sind beide möglich; bei Zuständen wäre nur <span class=\"la\">used to<\/span> richtig."},{"type":"self","q":"Erzähle in fünf Sätzen von einem Tag, an dem etwas schiefgegangen ist. Benütze mindestens zweimal das Past Progressive für den Rahmen und dreimal das Simple Past für die Ereignisse.","s":"Ein mögliches Muster: <span class=\"la\">I was sitting on the bus and listening to music when I noticed that my bag was open. While I was looking for my wallet, the bus stopped. I got off in a hurry and left my umbrella on the seat.<\/span> Achte beim Nachlesen darauf, dass alle Ereignisse im Simple Past stehen und nur der Rahmen in der Verlaufsform."}],"gen":["irr","tense"],"html":"<h3>Bildung<\/h3>\n<div class=\"formula\"><span class=\"la\">Simple Past:<\/span> regelmäßig <b class=\"e\">-ed<\/b> · unregelmäßig die <b class=\"e\">zweite Form<\/b> (<span class=\"la\">go – went<\/span>)<\/div>\n<div class=\"formula\"><span class=\"la\">Past Progressive:<\/span> <b class=\"e\">was / were<\/b> + <b class=\"e\">-ing<\/b><\/div>\n<p>In Frage und Verneinung steht <span class=\"la\">did<\/span>, und das Vollverb kehrt zur Grundform zurück:<\/p>\n<div class=\"formula\"><span class=\"la\">Did you see it?<\/span> · <span class=\"la\">I did not see it.<\/span> (niemals <span class=\"la\">did not saw<\/span>)<\/div>\n<h3>Schreibung bei -ed<\/h3>\n<ul><li>Stummes e fällt weg: <span class=\"la\">live – lived, hope – hoped.<\/span><\/li><li>Konsonant plus y wird zu <span class=\"la\">-ied<\/span>: <span class=\"la\">study – studied, try – tried.<\/span><\/li><li>Einsilbige Wörter mit kurzem Vokal verdoppeln den Endkonsonanten: <span class=\"la\">stop – stopped, plan – planned.<\/span> Bei zwei Konsonanten oder langem Vokal nicht: <span class=\"la\">work – worked, rain – rained.<\/span><\/li><\/ul>\n<h3>Simple oder Progressive?<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Simple Past<\/th><th>Past Progressive<\/th><\/tr><tr><td>Ereignis, Handlungskette<\/td><td>Hintergrund, Rahmen<\/td><\/tr><tr><td><span class=\"la\">She opened the door and went out.<\/span><\/td><td><span class=\"la\">It was raining and the wind was blowing.<\/span><\/td><\/tr><tr><td>Unterbrechung<\/td><td>laufende Handlung<\/td><\/tr><tr><td><span class=\"la\">The phone rang while I was cooking.<\/span><\/td><td><span class=\"la\">I was cooking when the phone rang.<\/span><\/td><\/tr><\/table><\/div>\n<div class=\"note\"><b class=\"lab\">Merke<\/b>Merksatz: Das Past Progressive ist die Bühne, das Simple Past ist das, was auf ihr passiert.<\/div>\n<h3>Vergangene Gewohnheiten<\/h3>\n<ul><li><span class=\"la\">used to<\/span> für alles, was früher regelmäßig war und heute nicht mehr: <span class=\"la\">I used to play the violin.<\/span><\/li><li><span class=\"la\">would<\/span> nur für wiederholte Handlungen, nicht für Zustände: <span class=\"la\">Every summer we would drive to the sea.<\/span> Aber nicht: <span class=\"la\">I would have long hair.<\/span><\/li><li><span class=\"la\">be used to<\/span> ist etwas ganz anderes und heißt „gewohnt sein“: <span class=\"la\">I am used to getting up early.<\/span><\/li><\/ul>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b><span class=\"la\">used to<\/span> und <span class=\"la\">be used to<\/span> werden ständig verwechselt. Prüfe, ob eine Form von <span class=\"la\">be<\/span> davorsteht: Ohne <span class=\"la\">be<\/span> geht es um die Vergangenheit, mit <span class=\"la\">be<\/span> um Gewohnheit, und danach folgt die <span class=\"la\">-ing<\/span>-Form.<\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Eine Erzählung aufbauen<\/h4><div class=\"task\">Setze ein: <span class=\"la\">It <span class=\"gap\">___<\/span> (be) a cold evening. The streets <span class=\"gap\">___<\/span> (be) empty and it <span class=\"gap\">___<\/span> (snow). Suddenly someone <span class=\"gap\">___<\/span> (shout) my name.<\/span><\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Die ersten drei Lücken beschreiben den Rahmen, die Kulisse der Szene. Rahmen heißt: Zustände mit <span class=\"la\">was<\/span>, Vorgänge in der Verlaufsform.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div><span class=\"la\">It was a cold evening. The streets were empty and it was snowing.<\/span> Die Verlaufsform bei <span class=\"la\">snow<\/span> zeigt, dass das Schneien die ganze Zeit über andauerte.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Der letzte Satz bringt das Ereignis, das die Szene unterbricht. Ereignisse stehen im Simple Past: <span class=\"la\">Suddenly someone shouted my name.<\/span><\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Dieses Muster trägt jede Erzählung: Kulisse im Progressive, Handlung im Simple.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"perfect","t":"Present Perfect und Past Perfect","kl":"1","k":1,"a":"G","tag":"Aufbau","goals":["beide Perfektformen bilden und von den einfachen Vergangenheiten unterscheiden","_since_ und _for_ richtig verwenden","erkennen, wann die Verlaufsform nötig ist","die deutsche Interferenz bei _since_ ausschalten"],"ex":[{"type":"txt","a":["have lived","have been living","'ve lived","'ve been living"],"q":"Setze ein: <span class=\"la\">We <span class=\"gap\">___<\/span> (live) in this flat since 2021.<\/span>","h":"<span class=\"la\">since<\/span> verbindet den Anfangspunkt mit jetzt.","s":"Richtig ist <span class=\"la\">have lived<\/span> oder <span class=\"la\">have been living<\/span>. Im Deutschen steht hier Präsens, im Englischen niemals."},{"type":"mc","q":"Welcher Satz ist richtig?","h":"Zwei Fallen auf einmal: die Zeitform und die Präposition.","s":"Die Dauer verlangt <span class=\"la\">for<\/span>, die Verbindung bis jetzt das Present Perfect, und <span class=\"la\">know<\/span> ist ein Zustandsverb ohne Verlaufsform. Nur die erste Fassung erfüllt alle drei Bedingungen.","o":["<span class=\"la\">I have known him for three years.<\/span>","<span class=\"la\">I know him since three years.<\/span>","<span class=\"la\">I have been knowing him for three years.<\/span>","<span class=\"la\">I know him for three years.<\/span>"]},{"type":"txt","a":["had already left","'d already left"],"q":"Setze ein: <span class=\"la\">When I got to the party, most of the guests <span class=\"gap\">___<\/span> (already / leave).<\/span>","s":"Richtig ist <span class=\"la\">had already left<\/span>. Das Weggehen lag vor dem Ankommen, also Past Perfect."},{"type":"mc","q":"Welcher Satz ist <b class=\"e\">falsch<\/b>?","h":"Prüfe, ob Zeitform und Zeitangabe zusammenpassen.","s":"<span class=\"la\">last week<\/span> ist ein abgeschlossener Zeitraum und verträgt sich nicht mit dem Present Perfect. Richtig wäre entweder <span class=\"la\">finished … last week<\/span> oder <span class=\"la\">has finished<\/span> ohne Zeitangabe.","o":["<span class=\"la\">She has finished her exams last week.<\/span>","<span class=\"la\">She finished her exams last week.<\/span>","<span class=\"la\">She has finished her exams.<\/span>","<span class=\"la\">She had finished her exams before the holidays started.<\/span>"]},{"type":"txt","a":["have been waiting","'ve been waiting"],"q":"Setze ein: <span class=\"la\">I <span class=\"gap\">___<\/span> (wait) for over an hour and I am getting annoyed.<\/span>","h":"Betont wird die Dauer, und die Handlung läuft noch.","s":"Richtig ist <span class=\"la\">have been waiting<\/span>. Die Verlaufsform des Present Perfect betont die Dauer und das Andauern."},{"type":"mc","q":"Was bedeutet <span class=\"la\">She has gone to Paris<\/span> im Unterschied zu <span class=\"la\">She has been to Paris<\/span>?","h":"Achte auf das Partizip.","s":"<span class=\"la\">have gone to<\/span> heißt, dass die Person hingefahren und noch nicht zurück ist. <span class=\"la\">have been to<\/span> beschreibt eine abgeschlossene Erfahrung. Dieser Unterschied kommt in Prüfungen regelmäßig vor.","o":["Sie ist jetzt dort beziehungsweise auf dem Weg; im zweiten Satz war sie dort und ist zurück.","Beide Sätze bedeuten dasselbe.","Im ersten Satz war sie dort und ist zurück, im zweiten ist sie noch dort.","Der erste Satz ist falsch gebildet."]},{"type":"txt","a":["have not finished","haven't finished","have not yet finished"],"q":"Setze ein: <span class=\"la\">They <span class=\"gap\">___<\/span> (not / finish) the building yet.<\/span>","s":"Richtig ist <span class=\"la\">have not finished<\/span>. <span class=\"la\">yet<\/span> in Verneinung und Frage verlangt das Present Perfect."},{"type":"mc","q":"In welchem Satz ist das Past Perfect <b class=\"e\">nötig<\/b>?","h":"Wo weicht die Reihenfolge der Erzählung von der Reihenfolge der Ereignisse ab?","s":"Nur im ersten Satz liegt eine Handlung vor der anderen und muss das auch zeigen. In den übrigen Sätzen ist die Reihenfolge durch <span class=\"la\">and then<\/span> oder <span class=\"la\">first … then<\/span> bereits klar.","o":["<span class=\"la\">She told me that she had seen the film before.<\/span>","<span class=\"la\">She told me that she liked the film.<\/span>","<span class=\"la\">She saw the film and then went home.<\/span>","<span class=\"la\">First she saw the film, then she went home.<\/span>"]},{"type":"self","q":"Schreibe fünf Sätze über dich mit Present Perfect: zwei mit <span class=\"la\">since<\/span>, zwei mit <span class=\"la\">for<\/span>, einen mit <span class=\"la\">never<\/span>.","s":"Ein mögliches Muster: <span class=\"la\">I have played the guitar since I was ten. I have known my best friend since primary school. I have been learning English for eight years. I have lived in this town for most of my life. I have never been to Scotland.<\/span> Prüfe zum Schluss: Steht nach <span class=\"la\">since<\/span> wirklich ein Zeitpunkt und nach <span class=\"la\">for<\/span> eine Dauer?"}],"gen":["tense","irr","prep"],"html":"<h3>Bildung<\/h3>\n<div class=\"formula\"><span class=\"la\">Present Perfect:<\/span> <b class=\"e\">have / has<\/b> + <b class=\"e\">Past Participle<\/b> · <span class=\"la\">I have seen, she has gone<\/span><\/div>\n<div class=\"formula\"><span class=\"la\">Present Perfect Progressive:<\/span> <b class=\"e\">have / has been<\/b> + <b class=\"e\">-ing<\/b> · <span class=\"la\">I have been waiting<\/span><\/div>\n<div class=\"formula\"><span class=\"la\">Past Perfect:<\/span> <b class=\"e\">had<\/b> + <b class=\"e\">Past Participle<\/b> · <span class=\"la\">I had seen<\/span><\/div>\n<div class=\"formula\"><span class=\"la\">Past Perfect Progressive:<\/span> <b class=\"e\">had been<\/b> + <b class=\"e\">-ing<\/b> · <span class=\"la\">I had been waiting<\/span><\/div>\n<h3>Present Perfect oder Simple Past?<\/h3>\n<p>Die Entscheidung hängt an einer einzigen Frage: <b class=\"e\">Ist der Zeitabschnitt abgeschlossen?<\/b><\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Present Perfect<\/th><th>Simple Past<\/th><\/tr><tr><td>Verbindung zu jetzt<\/td><td>abgeschlossene Vergangenheit<\/td><\/tr><tr><td><span class=\"la\">I have lost my keys.<\/span> (ich habe sie jetzt nicht)<\/td><td><span class=\"la\">I lost my keys yesterday.<\/span><\/td><\/tr><tr><td><span class=\"la\">She has been to London.<\/span> (Erfahrung)<\/td><td><span class=\"la\">She went to London in May.<\/span><\/td><\/tr><tr><td><span class=\"la\">We have finished.<\/span> (Ergebnis zählt)<\/td><td><span class=\"la\">We finished at six.<\/span><\/td><\/tr><tr><td>mit <span class=\"la\">since, for, just, already, yet, ever, never, so far<\/span><\/td><td>mit <span class=\"la\">yesterday, last week, in 2020, ago, when<\/span><\/td><\/tr><\/table><\/div>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>Eine abgeschlossene Zeitangabe und das Present Perfect vertragen sich nicht: <span class=\"la\">I have seen him yesterday<\/span> ist falsch. Entweder <span class=\"la\">I saw him yesterday<\/span> oder <span class=\"la\">I have seen him<\/span> ohne Zeitangabe.<\/div>\n<h3>since und for<\/h3>\n<ul><li><span class=\"la\">since<\/span> nennt den <b class=\"e\">Anfangspunkt<\/b>: <span class=\"la\">since 2019, since Monday, since I was a child.<\/span><\/li><li><span class=\"la\">for<\/span> nennt die <b class=\"e\">Dauer<\/b>: <span class=\"la\">for three years, for ten minutes, for ages.<\/span><\/li><\/ul>\n<p>Beide verlangen das Present Perfect, weil der Zeitraum bis jetzt reicht.<\/p>\n<div class=\"note\"><b class=\"lab\">Merke<\/b>Deutsch: „Ich lerne seit zwei Jahren Englisch.“ Englisch: <span class=\"la\">I have been learning English for two years.<\/span> Zwei Unterschiede auf einmal, nämlich Zeitform und Präposition. Diesen Satz lohnt es sich auswendig zu können.<\/div>\n<h3>Einfache Form oder Verlaufsform?<\/h3>\n<ul><li>Die Verlaufsform betont die <b class=\"e\">Dauer<\/b> und oft, dass die Handlung noch läuft: <span class=\"la\">I have been reading all afternoon.<\/span><\/li><li>Die einfache Form betont das <b class=\"e\">Ergebnis<\/b>: <span class=\"la\">I have read three chapters.<\/span><\/li><li>Zustandsverben bilden keine Verlaufsform: <span class=\"la\">I have known her for years<\/span>, nicht <span class=\"la\">have been knowing<\/span>.<\/li><\/ul>\n<h3>Das Past Perfect<\/h3>\n<p>Es markiert, dass etwas <b class=\"e\">vor<\/b> einer anderen Vergangenheit lag. Es steht nie allein, sondern immer in Bezug auf einen zweiten Zeitpunkt:<\/p>\n<div class=\"formula\"><span class=\"la\">When we arrived, the film <b class=\"e\">had<\/b> already <b class=\"e\">started<\/b>.<\/span><\/div>\n<div class=\"note t\"><b class=\"lab\">Tipp<\/b>Wenn die Reihenfolge der Handlungen durch <span class=\"la\">first, then, after that<\/span> oder durch die Satzfolge ohnehin klar ist, genügt oft das Simple Past. Das Past Perfect brauchst du vor allem dort, wo die Reihenfolge der Erzählung von der Reihenfolge der Ereignisse abweicht.<\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Present Perfect oder Simple Past?<\/h4><div class=\"task\">Entscheide: <span class=\"la\">I <span class=\"gap\">___<\/span> (not / see) that film.<\/span> und <span class=\"la\">I <span class=\"gap\">___<\/span> (not / see) that film last night.<\/span><\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Erster Satz: Es steht keine abgeschlossene Zeitangabe da. Gemeint ist meine Erfahrung bis jetzt.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Also Present Perfect: <span class=\"la\">I have not seen that film.<\/span><\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Zweiter Satz: <span class=\"la\">last night<\/span> ist ein abgeschlossener Zeitraum.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Also Simple Past: <span class=\"la\">I did not see that film last night.<\/span> Derselbe Satz, dieselbe Handlung, zwei verschiedene Zeiten, entschieden allein durch die Zeitangabe.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"passive","t":"Das Passiv","kl":"2","k":2,"a":"G","tag":"Aufbau","goals":["das Passiv in allen Zeiten bilden","entscheiden, wann es sinnvoll ist","Sätze mit zwei Objekten umformen","_by_ und _with_ unterscheiden","das persönliche Passiv nach _say_ und _believe_ verstehen"],"ex":[{"type":"txt","a":["The road is being repaired at the moment."],"q":"Setze ins Passiv: <span class=\"la\">They are repairing the road at the moment.<\/span>","h":"Present Progressive im Passiv: <span class=\"la\">is/are being<\/span> plus Past Participle.","s":"<span class=\"la\">The road is being repaired at the moment.<\/span> Die Zeit steckt in <span class=\"la\">is being<\/span>, das Vollverb steht als Past Participle."},{"type":"txt","a":["The letters had been sent before noon."],"q":"Setze ins Passiv: <span class=\"la\">Someone had sent the letters before noon.<\/span>","h":"Past Perfect im Passiv.","s":"<span class=\"la\">The letters had been sent before noon.<\/span> <span class=\"la\">had been<\/span> plus Past Participle. <span class=\"la\">someone<\/span> fällt weg, weil die <span class=\"la\">by<\/span>-Angabe nichts beitragen würde."},{"type":"txt","a":["Anna was offered the job.","Anna was offered the job"],"q":"Setze ins Passiv, mit der Person als Subjekt: <span class=\"la\">They offered Anna the job.<\/span>","h":"Bei zwei Objekten wird meist die Person zum Subjekt.","s":"<span class=\"la\">Anna was offered the job.<\/span> Die zweite Möglichkeit, <span class=\"la\">The job was offered to Anna<\/span>, ist grammatisch richtig, klingt aber gestelzter."},{"type":"txt","a":["with"],"q":"<span class=\"la\">by<\/span> oder <span class=\"la\">with<\/span>? <span class=\"la\">The cake was decorated <span class=\"gap\">___<\/span> fresh berries.<\/span>","h":"Werkzeug oder Handelnder?","s":"<span class=\"la\">with<\/span>. Die Beeren sind das Mittel, nicht der Handelnde. <span class=\"la\">by<\/span> stünde nur vor einer Person oder Institution: <span class=\"la\">decorated by the chef<\/span>."},{"type":"mc","q":"Welcher Satz ist richtig gebildet?","h":"Nach einem Modalverb steht immer der Infinitiv.","s":"Nach <span class=\"la\">will<\/span> steht der Infinitiv <span class=\"la\">be<\/span>, danach das Past Participle. Dasselbe Muster gilt bei allen Modalverben: <span class=\"la\">must be done, can be seen, should be told<\/span>.","o":["<span class=\"la\">The museum will be opened next spring.<\/span>","<span class=\"la\">The museum will been opened next spring.<\/span>","<span class=\"la\">The museum will opened next spring.<\/span>","<span class=\"la\">The museum will being opened next spring.<\/span>"]},{"type":"mc","q":"In welchem Satz ist die <span class=\"la\">by<\/span>-Angabe sinnvoll?","h":"Welche Angabe liefert Information, die man sonst nicht hätte?","s":"Nur im ersten Satz trägt die <span class=\"la\">by<\/span>-Angabe Information bei. <span class=\"la\">by someone<\/span>, <span class=\"la\">by a thief<\/span> und <span class=\"la\">by a person<\/span> sagen nichts, was man nicht schon wüsste, und werden deshalb weggelassen.","o":["<span class=\"la\">The theory was first described by a Swiss physicist.<\/span>","<span class=\"la\">The classrooms are cleaned by someone every evening.<\/span>","<span class=\"la\">My wallet was stolen by a thief.<\/span>","<span class=\"la\">The rooms were booked by a person.<\/span>"]},{"type":"mc","q":"<span class=\"la\">He <span class=\"gap\">___<\/span> to be one of the best players of his generation.<\/span>","h":"Persönliches Passiv nach einem Verb des Meinens.","s":"<span class=\"la\">is considered to be<\/span> ist die Passivkonstruktion zu <span class=\"la\">people consider him to be<\/span>. Diese Form begegnet dir ständig in Zeitungstexten und in Prüfungstexten des Leseverständnisses.","o":["<span class=\"la\">is considered<\/span>","<span class=\"la\">is considering<\/span>","<span class=\"la\">considers<\/span>","<span class=\"la\">has considered<\/span>"]},{"type":"txt","a":["English is spoken all over the world."],"q":"Setze ins Passiv: <span class=\"la\">People speak English all over the world.<\/span>","h":"<span class=\"la\">people<\/span> als Handelnder fällt weg.","s":"<span class=\"la\">English is spoken all over the world.<\/span> Wenn der Handelnde <span class=\"la\">people, someone, they<\/span> im unbestimmten Sinn ist, verschwindet er im Passiv ersatzlos."},{"type":"self","q":"Schreibe fünf Sätze, die den Ablauf einer Veranstaltung an deiner Schule beschreiben, durchgehend im Passiv. Überlege anschließend bei jedem Satz, ob das Passiv hier wirklich die bessere Wahl ist oder ob das Aktiv klarer wäre.","s":"Musterlösung: <span class=\"la\">The hall is decorated on the morning of the event. Chairs are arranged in rows and the sound system is tested. Guests are welcomed at the entrance. Drinks are served during the break. Afterwards the room is cleaned by the students of the organising class.<\/span> Die letzte Zeile zeigt eine sinnvolle <span class=\"la\">by<\/span>-Angabe, weil sie wirklich Information trägt. Zugleich gilt: Eine ganze Seite im Passiv ermüdet; in einem Report ist etwa jeder dritte Satz eine gute Dosis."}],"gen":["pass","irr"],"html":"<h3>Wozu das Passiv da ist<\/h3>\n<p>Im Aktiv steht der Handelnde vorne: <span class=\"la\">The council <b class=\"e\">built<\/b> the bridge.<\/span> Im Passiv steht die Sache vorne, der Handelnde tritt zurück oder verschwindet ganz: <span class=\"la\">The bridge <b class=\"e\">was built<\/b> in 1890.<\/span><\/p>\n<p>Du brauchst das Passiv, wenn eines der Folgenden zutrifft:<\/p>\n<ul><li>Der Handelnde ist <b>unbekannt<\/b>: <span class=\"la\">My bike has been stolen.<\/span><\/li><li>Er ist <b>unwichtig<\/b>: <span class=\"la\">The museum was opened in 1965.<\/span><\/li><li>Er ist <b>selbstverständlich<\/b>: <span class=\"la\">She was arrested.<\/span> ~von der Polizei, wer sonst~<\/li><li>Du willst den <b>Ablauf in den Vordergrund<\/b> rücken: in Beschreibungen von Vorgängen, in Berichten, in wissenschaftlichen Texten.<\/li><\/ul>\n<div class=\"note t\"><b class=\"lab\">Tipp<\/b>Genau deshalb wimmelt es in der Textsorte Report von Passivkonstruktionen, während ein Blog Comment fast ohne auskommt. Welche Form du wählst, ist auch eine Frage des Registers.<\/div>\n<h3>Die Bildung: eine Form von be plus Past Participle<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Zeit<\/th><th>Aktiv<\/th><th>Passiv<\/th><\/tr><tr><td>Present Simple<\/td><td><span class=\"la\">They clean the rooms.<\/span><\/td><td><span class=\"la\">The rooms <b class=\"e\">are cleaned<\/b>.<\/span><\/td><\/tr><tr><td>Present Progressive<\/td><td><span class=\"la\">They are cleaning the rooms.<\/span><\/td><td><span class=\"la\">The rooms <b class=\"e\">are being cleaned<\/b>.<\/span><\/td><\/tr><tr><td>Past Simple<\/td><td><span class=\"la\">They cleaned the rooms.<\/span><\/td><td><span class=\"la\">The rooms <b class=\"e\">were cleaned<\/b>.<\/span><\/td><\/tr><tr><td>Past Progressive<\/td><td><span class=\"la\">They were cleaning the rooms.<\/span><\/td><td><span class=\"la\">The rooms <b class=\"e\">were being cleaned<\/b>.<\/span><\/td><\/tr><tr><td>Present Perfect<\/td><td><span class=\"la\">They have cleaned the rooms.<\/span><\/td><td><span class=\"la\">The rooms <b class=\"e\">have been cleaned<\/b>.<\/span><\/td><\/tr><tr><td>Past Perfect<\/td><td><span class=\"la\">They had cleaned the rooms.<\/span><\/td><td><span class=\"la\">The rooms <b class=\"e\">had been cleaned<\/b>.<\/span><\/td><\/tr><tr><td>will-Future<\/td><td><span class=\"la\">They will clean the rooms.<\/span><\/td><td><span class=\"la\">The rooms <b class=\"e\">will be cleaned<\/b>.<\/span><\/td><\/tr><tr><td>Modalverb<\/td><td><span class=\"la\">They must clean the rooms.<\/span><\/td><td><span class=\"la\">The rooms <b class=\"e\">must be cleaned<\/b>.<\/span><\/td><\/tr><\/table><\/div>\n<div class=\"note\"><b class=\"lab\">Merke<\/b>Die Zeit steckt immer in <span class=\"la\">be<\/span>, nie im Past Participle. Wer das einmal begriffen hat, kann jede Passivform selbst herleiten: Welche Zeit? Entsprechende Form von <span class=\"la\">be<\/span>. Dann Past Participle. Fertig.<\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Einen Satz ins Passiv setzen<\/h4><div class=\"task\">Setze ins Passiv: <span class=\"la\">The company has produced these cars in Austria since 1995.<\/span><\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Suche das <b>Objekt<\/b> des Aktivsatzes: <span class=\"la\">these cars<\/span>. Es wird zum Subjekt des Passivsatzes.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Bestimme die <b>Zeit<\/b> des Aktivsatzes: <span class=\"la\">has produced<\/span> ist Present Perfect.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Bilde die passende Form von <span class=\"la\">be<\/span> im Present Perfect: <span class=\"la\">have been<\/span> — Plural, weil <span class=\"la\">these cars<\/span> Plural ist.<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div>Hänge das <b>Past Participle<\/b> des Vollverbs an: <span class=\"la\">produced<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">5<\/div><div>Setze den Rest unverändert dahinter: <span class=\"la\">in Austria since 1995<\/span>.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">6<\/div><div>Ergebnis: <span class=\"la\">These cars <b class=\"e\">have been produced<\/b> in Austria since 1995.<\/span> Den Handelnden lässt man weg, weil <span class=\"la\">the company<\/span> hier nichts Zusätzliches sagt.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>\n<h3>Sätze mit zwei Objekten<\/h3>\n<p>Verben wie <span class=\"la\">give, send, offer, tell, show, teach, pay<\/span> haben zwei Objekte. Daraus lassen sich <b>zwei Passivsätze<\/b> bilden, und der mit der Person als Subjekt ist der übliche:<\/p>\n<div class=\"formula\">Aktiv: <span class=\"la\">They offered <b class=\"e\">Anna<\/b> <b class=\"e\">the job<\/b>.<\/span><\/div>\n<div class=\"formula\">Passiv 1: <span class=\"la\"><b class=\"e\">Anna<\/b> was offered the job.<\/span> ~die übliche Fassung~<\/div>\n<div class=\"formula\">Passiv 2: <span class=\"la\"><b class=\"e\">The job<\/b> was offered to Anna.<\/span> ~möglich, betont die Sache~<\/div>\n<h3>by oder with?<\/h3>\n<ul><li><b><span class=\"la\">by<\/span><\/b> nennt den <b>Handelnden<\/b>: <span class=\"la\">The window was broken <b class=\"e\">by<\/b> a boy.<\/span><\/li><li><b><span class=\"la\">with<\/span><\/b> nennt das <b>Werkzeug<\/b>: <span class=\"la\">The window was broken <b class=\"e\">with<\/b> a stone.<\/span><\/li><\/ul>\n<p>Die <span class=\"la\">by<\/span>-Angabe bleibt nur dort, wo sie wirklich etwas beiträgt: <span class=\"la\">Hamlet was written <b class=\"e\">by Shakespeare<\/b><\/span> ist sinnvoll, <span class=\"la\">The rooms were cleaned by someone<\/span> ist überflüssig.<\/p>\n<h3>Das persönliche Passiv<\/h3>\n<p>Nach Verben des Sagens und Meinens gibt es eine Konstruktion, die im Deutschen keine Entsprechung hat:<\/p>\n<div class=\"formula\"><span class=\"la\">People say that he lives abroad.<\/span> → <span class=\"la\">He <b class=\"e\">is said to live<\/b> abroad.<\/span><\/div>\n<div class=\"formula\"><span class=\"la\">They believe that she has left.<\/span> → <span class=\"la\">She <b class=\"e\">is believed to have left<\/b>.<\/span><\/div>\n<p>Gebräuchlich ist das mit <span class=\"la\">say, believe, think, know, report, expect, consider<\/span>. Du erkennst es daran, dass die Person zum Subjekt wird und danach ein Infinitiv mit <span class=\"la\">to<\/span> folgt. In Zeitungstexten ist das sehr häufig, deshalb lohnt es sich fürs Leseverständnis.<\/p>"},{"id":"conditionals","t":"If-Sätze und Wunschsätze","kl":"2","k":2,"a":"G","tag":"Aufbau","goals":["die vier Typen der Bedingungssätze bilden und auseinanderhalten","gemischte If-Sätze verstehen","Wünsche mit _wish_ und _if only_ ausdrücken","die Fehler vermeiden, die aus dem Deutschen kommen"],"ex":[{"type":"txt","a":["rains"],"q":"Setze ein (Typ 1): <span class=\"la\">If it <span class=\"gap\">___<\/span> (rain) tomorrow, we'll take the bus.<\/span>","h":"Was steht im <span class=\"la\">if<\/span>-Teil?","s":"<span class=\"la\">rains<\/span>. Im <span class=\"la\">if<\/span>-Teil steht das Present Simple, nie <span class=\"la\">will<\/span>. Die Zukunft steckt ausschließlich im Hauptsatz."},{"type":"txt","a":["would travel","'d travel"],"q":"Setze ein (Typ 2): <span class=\"la\">If I had a year off, I <span class=\"gap\">___<\/span> (travel) around Asia.<\/span>","h":"Hauptsatz bei Typ 2.","s":"<span class=\"la\">would travel<\/span>. Die Bedingung ist gedacht, also Typ 2: <span class=\"la\">if<\/span> plus Past Simple, dann <span class=\"la\">would<\/span> plus Infinitiv."},{"type":"txt","a":["had known","'d known"],"q":"Setze ein (Typ 3): <span class=\"la\">If I <span class=\"gap\">___<\/span> (know) about the test, I would have prepared.<\/span>","h":"<span class=\"la\">if<\/span>-Teil bei Typ 3.","s":"<span class=\"la\">had known<\/span>. Bei Typ 3 steht im <span class=\"la\">if<\/span>-Teil das Past Perfect. <span class=\"la\">If I would have known<\/span> ist ein Germanismus und immer falsch."},{"type":"txt","a":["were"],"q":"Setze ein: <span class=\"la\">If I <span class=\"gap\">___<\/span> (be) in your position, I would say nothing.<\/span>","h":"Welche Form von <span class=\"la\">be<\/span> steht in Typ 2?","s":"<span class=\"la\">were<\/span>. In Typ 2 steht <span class=\"la\">were<\/span> in allen Personen. <span class=\"la\">If I were you<\/span> ist die feste Wendung, mit der man Rat gibt."},{"type":"mc","q":"Welcher Satz ist falsch?","h":"Suche <span class=\"la\">will<\/span> an der verbotenen Stelle.","s":"Im <span class=\"la\">if<\/span>-Teil darf nie <span class=\"la\">will<\/span> stehen. Die anderen drei Sätze sind korrekte Beispiele für die Typen 1, 2 und 3.","o":["<span class=\"la\">If it will snow, we will go skiing.<\/span>","<span class=\"la\">If it snows, we will go skiing.<\/span>","<span class=\"la\">If it snowed, we would go skiing.<\/span>","<span class=\"la\">If it had snowed, we would have gone skiing.<\/span>"]},{"type":"mc","q":"<span class=\"la\">I wish I <span class=\"gap\">___<\/span> more free time.<\/span>","h":"Der Wunsch bezieht sich auf die Gegenwart.","s":"Ein Wunsch über die Gegenwart steht mit dem Past Simple. <span class=\"la\">would have<\/span> wäre nur bei einem Wunsch nach fremdem Verhalten möglich, <span class=\"la\">had had<\/span> bezöge sich auf die Vergangenheit.","o":["<span class=\"la\">had<\/span>","<span class=\"la\">have<\/span>","<span class=\"la\">would have<\/span>","<span class=\"la\">had had<\/span>"]},{"type":"mc","q":"Was bedeutet <span class=\"la\">Take your keys in case I am not at home<\/span>?","h":"<span class=\"la\">in case<\/span> ist nicht dasselbe wie <span class=\"la\">if<\/span>.","s":"<span class=\"la\">in case<\/span> heißt „für den Fall, dass“ und beschreibt eine Vorsichtsmaßnahme, die man auf jeden Fall trifft. <span class=\"la\">if<\/span> dagegen macht die Handlung von der Bedingung abhängig.","o":["Nimm die Schlüssel vorsorglich mit, falls ich nicht da sein sollte.","Nimm die Schlüssel nur dann mit, wenn ich nicht da bin.","Nimm die Schlüssel mit, sobald ich weg bin.","Nimm die Schlüssel mit, obwohl ich zu Hause bin."]},{"type":"txt","a":["would be","'d be"],"q":"Setze ein (gemischter Typ): <span class=\"la\">If she had taken the job in Berlin, she <span class=\"gap\">___<\/span> (be) much happier now.<\/span>","h":"Bedingung in der Vergangenheit, Folge in der Gegenwart.","s":"<span class=\"la\">would be<\/span>. Der <span class=\"la\">if<\/span>-Teil steht im Past Perfect (Typ 3), der Hauptsatz bezieht sich auf die Gegenwart und steht deshalb wie Typ 2 mit <span class=\"la\">would<\/span> plus Infinitiv."},{"type":"self","q":"Schreibe sechs If-Sätze über dein eigenes Leben: je zwei vom Typ 1, 2 und 3. Schreibe dazu einen Wunschsatz mit <span class=\"la\">I wish<\/span> über die Gegenwart und einen über die Vergangenheit.","s":"Musterlösung: <span class=\"la\">If I finish my homework early, I will meet friends in town. If the weather is good on Saturday, we will cycle to the lake. If I had more money, I would buy a better laptop. If I were born in another country, I would probably speak three languages. If I had started learning the guitar earlier, I would have played in a band. If we hadn't missed the train, we would have arrived on time. I wish I had more time for reading. I wish I had asked more questions in class last year.<\/span> Prüfe bei jedem Satz, dass im <span class=\"la\">if<\/span>-Teil weder <span class=\"la\">will<\/span> noch <span class=\"la\">would<\/span> steht."}],"gen":["cond"],"html":"<h3>Vier Typen, eine Logik<\/h3>\n<p>Ein If-Satz besteht aus einer <b>Bedingung<\/b> (dem <span class=\"la\">if<\/span>-Teil) und einer <b>Folge<\/b> (dem Hauptsatz). Welcher Typ vorliegt, hängt allein davon ab, wie wahrscheinlich die Bedingung ist.<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Typ<\/th><th>Bedingung<\/th><th>Folge<\/th><th>Bedeutung<\/th><\/tr><tr><td>0<\/td><td><span class=\"la\">If you heat water to 100 °C,<\/span><\/td><td><span class=\"la\">it boils.<\/span><\/td><td>allgemeingültig, immer wahr<\/td><\/tr><tr><td>1<\/td><td><span class=\"la\">If it rains tomorrow,<\/span><\/td><td><span class=\"la\">we will stay at home.<\/span><\/td><td>gut möglich<\/td><\/tr><tr><td>2<\/td><td><span class=\"la\">If I had more time,<\/span><\/td><td><span class=\"la\">I would learn Italian.<\/span><\/td><td>unwahrscheinlich, gedacht<\/td><\/tr><tr><td>3<\/td><td><span class=\"la\">If she had asked me,<\/span><\/td><td><span class=\"la\">I would have helped her.<\/span><\/td><td>vorbei, nicht mehr änderbar<\/td><\/tr><\/table><\/div>\n<p>Die Formeln:<\/p>\n<div class=\"formula\"><b>Typ 0:<\/b> <span class=\"la\">if<\/span> + Present Simple → Present Simple<\/div>\n<div class=\"formula\"><b>Typ 1:<\/b> <span class=\"la\">if<\/span> + Present Simple → <span class=\"la\">will<\/span> + Infinitiv<\/div>\n<div class=\"formula\"><b>Typ 2:<\/b> <span class=\"la\">if<\/span> + Past Simple → <span class=\"la\">would<\/span> + Infinitiv<\/div>\n<div class=\"formula\"><b>Typ 3:<\/b> <span class=\"la\">if<\/span> + Past Perfect → <span class=\"la\">would have<\/span> + Past Participle<\/div>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b><b>Im <span class=\"la\">if<\/span>-Teil steht niemals <span class=\"la\">will<\/span> oder <span class=\"la\">would<\/span>.<\/b> <span class=\"la\">If it will rain<\/span> und <span class=\"la\">If I would have time<\/span> sind immer falsch. Das ist der häufigste Fehler überhaupt bei dieser Konstruktion, weil im Deutschen in beiden Teilen der Konjunktiv stehen kann.<\/div>\n<div class=\"note\"><b class=\"lab\">Merke<\/b>Bei <span class=\"la\">be<\/span> steht in Typ 2 in allen Personen <span class=\"la\">were<\/span>: <span class=\"la\">If I <b class=\"e\">were<\/b> you, I would apply.<\/span> <span class=\"la\">was<\/span> ist umgangssprachlich geduldet, gilt in der Schularbeit aber als Fehler.<\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Den richtigen Typ bestimmen<\/h4><div class=\"task\">Setze ein: <span class=\"la\">If she (study) harder last year, she (pass) the exam.<\/span><\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Zuerst die Frage nach der Zeit: <span class=\"la\">last year<\/span> zeigt, dass alles vorbei ist. Die Prüfung ist geschrieben, das Lernen hat nicht mehr stattgefunden.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Eine Bedingung, die nicht mehr erfüllbar ist, ist <b>Typ 3<\/b>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Im <span class=\"la\">if<\/span>-Teil steht das <b>Past Perfect<\/b>: <span class=\"la\">If she had studied harder<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div>Im Hauptsatz steht <b><span class=\"la\">would have<\/span><\/b> plus Past Participle: <span class=\"la\">she would have passed<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">5<\/div><div>Ergebnis: <span class=\"la\">If she <b class=\"e\">had studied<\/b> harder last year, she <b class=\"e\">would have passed<\/b> the exam.<\/span><\/div><\/div><div class=\"wstep final\"><div class=\"n\">6<\/div><div>Gegenprobe: Setze Typ 2 ein — <span class=\"la\">If she studied harder, she would pass<\/span>. Das hieße: Es ginge noch, sie müsste nur anfangen. Weil die Prüfung vorbei ist, passt das nicht.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>\n<h3>Gemischte If-Sätze<\/h3>\n<p>Manchmal liegen Bedingung und Folge in verschiedenen Zeiten. Dann mischt man die Typen:<\/p>\n<div class=\"formula\"><span class=\"la\">If I <b class=\"e\">had studied<\/b> medicine, I <b class=\"e\">would be<\/b> a doctor now.<\/span><\/div>\n<p>~Bedingung in der Vergangenheit (Typ 3), Folge in der Gegenwart (Typ 2)~<\/p>\n<div class=\"formula\"><span class=\"la\">If she <b class=\"e\">weren't<\/b> so shy, she <b class=\"e\">would have asked<\/b> him.<\/span><\/div>\n<p>~Bedingung dauerhaft (Typ 2), Folge in der Vergangenheit (Typ 3)~<\/p>\n<h3>Was statt if stehen kann<\/h3>\n<ul><li><b><span class=\"la\">unless<\/span><\/b> = <span class=\"la\">if … not<\/span>: <span class=\"la\">You won't pass unless you work harder.<\/span><\/li><li><b><span class=\"la\">as long as, provided that, on condition that<\/span><\/b> betonen die Bedingung stärker.<\/li><li><b><span class=\"la\">in case<\/span><\/b> heißt „für den Fall, dass“ und ist etwas anderes als <span class=\"la\">if<\/span>: <span class=\"la\">Take an umbrella in case it rains.<\/span> ~vorsorglich, auch wenn es nicht regnet~<\/li><\/ul>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b><span class=\"la\">unless<\/span> enthält die Verneinung schon. <span class=\"la\">Unless you don't hurry<\/span> ist eine doppelte Verneinung und damit falsch. Richtig: <span class=\"la\">Unless you hurry, we'll be late.<\/span><\/div>\n<h3>Wünsche: wish und if only<\/h3>\n<p>Beide drücken aus, dass etwas anders wäre, als es ist. Die Zeitform geht dabei einen Schritt zurück:<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Wunsch über …<\/th><th>Form<\/th><th>Beispiel<\/th><\/tr><tr><td>die Gegenwart<\/td><td><span class=\"la\">wish<\/span> + Past Simple<\/td><td><span class=\"la\">I wish I <b class=\"e\">knew<\/b> the answer.<\/span> ~ich weiß sie nicht~<\/td><\/tr><tr><td>die Vergangenheit<\/td><td><span class=\"la\">wish<\/span> + Past Perfect<\/td><td><span class=\"la\">I wish I <b class=\"e\">had said<\/b> nothing.<\/span> ~ich habe leider etwas gesagt~<\/td><\/tr><tr><td>eine Veränderung<\/td><td><span class=\"la\">wish<\/span> + <span class=\"la\">would<\/span><\/td><td><span class=\"la\">I wish you <b class=\"e\">would stop<\/b> doing that.<\/span> ~Ärger über fremdes Verhalten~<\/td><\/tr><\/table><\/div>\n<p><span class=\"la\">if only<\/span> funktioniert genauso und klingt nur eindringlicher: <span class=\"la\">If only I had listened!<\/span><\/p>"},{"id":"reported","t":"Indirekte Rede","kl":"2","k":2,"a":"G","tag":"Aufbau","goals":["Aussagen, Fragen und Aufforderungen in die indirekte Rede setzen","die Verschiebung der Zeiten beherrschen","Orts- und Zeitangaben anpassen","erkennen, wann keine Verschiebung nötig ist"],"ex":[{"type":"txt","a":["She said that she was tired.","She said she was tired."],"q":"Gib in der indirekten Rede wieder: <span class=\"la\">She said: „I am tired.“<\/span>","h":"Present wird zu Past, <span class=\"la\">I<\/span> wird zu <span class=\"la\">she<\/span>.","s":"<span class=\"la\">She said that she was tired.<\/span> Das Wort <span class=\"la\">that<\/span> darf auch wegfallen."},{"type":"txt","a":["He asked where I lived.","He asked where I lived"],"q":"Gib in der indirekten Rede wieder: <span class=\"la\">He asked: „Where do you live?“<\/span>","h":"Das Fragewort bleibt, die Frageform verschwindet.","s":"<span class=\"la\">He asked where I lived.<\/span> Nach dem Fragewort steht die normale Satzstellung, und <span class=\"la\">do<\/span> fällt weg."},{"type":"txt","a":["She asked if I had seen the film.","She asked whether I had seen the film.","She asked if I had seen the film"],"q":"Gib in der indirekten Rede wieder: <span class=\"la\">She asked: „Have you seen the film?“<\/span>","h":"Entscheidungsfrage, und das Present Perfect verschiebt sich.","s":"<span class=\"la\">She asked if I had seen the film.<\/span> Entscheidungsfragen werden mit <span class=\"la\">if<\/span> oder <span class=\"la\">whether<\/span> angeschlossen, das Present Perfect wird zum Past Perfect."},{"type":"txt","a":["He told me not to worry.","He told me not to worry"],"q":"Gib in der indirekten Rede wieder: <span class=\"la\">He said: „Don't worry!“<\/span>","h":"Verneinte Aufforderung.","s":"<span class=\"la\">He told me not to worry.<\/span> Die Verneinung steht vor dem <span class=\"la\">to<\/span>, nicht danach. <span class=\"la\">He told me to not worry<\/span> gilt als umgangssprachlich."},{"type":"mc","q":"<span class=\"la\">She said: „We must leave now.“<\/span> → Welche Fassung ist richtig?","h":"<span class=\"la\">must<\/span> und <span class=\"la\">now<\/span> verschieben sich beide.","s":"<span class=\"la\">must<\/span> wird in der indirekten Rede zu <span class=\"la\">had to<\/span>, <span class=\"la\">now<\/span> wird zu <span class=\"la\">then<\/span>, <span class=\"la\">we<\/span> zu <span class=\"la\">they<\/span>. <span class=\"la\">must<\/span> unverändert zu lassen ist nur möglich, wenn die Verpflichtung weiterhin gilt.","o":["<span class=\"la\">She said that they had to leave then.<\/span>","<span class=\"la\">She said that they must leave now.<\/span>","<span class=\"la\">She said that they must left then.<\/span>","<span class=\"la\">She said that they have to leave now.<\/span>"]},{"type":"mc","q":"In welchem Satz ist <b>keine<\/b> Verschiebung nötig?","h":"Achte auf das einleitende Verb.","s":"Steht das einleitende Verb im Präsens (<span class=\"la\">says<\/span>), bleibt alles, wie es ist. Nur ein einleitendes Verb in der Vergangenheit löst den backshift aus.","o":["<span class=\"la\">He says he is on his way.<\/span>","<span class=\"la\">He said he was on his way.<\/span>","<span class=\"la\">He said he had arrived.<\/span>","<span class=\"la\">He said he would come.<\/span>"]},{"type":"mc","q":"<span class=\"la\">The teacher said: „Hand in your essays on Friday.“<\/span>","h":"Welches Verb braucht ein Objekt, und wessen Aufsätze sind es jetzt?","s":"<span class=\"la\">tell<\/span> braucht ein Objekt (<span class=\"la\">told us<\/span>), <span class=\"la\">say<\/span> nicht (<span class=\"la\">said that …<\/span>). Außerdem wird aus <span class=\"la\">your essays<\/span> aus unserer Sicht <span class=\"la\">our essays<\/span>.","o":["<span class=\"la\">The teacher told us to hand in our essays on Friday.<\/span>","<span class=\"la\">The teacher said us to hand in our essays on Friday.<\/span>","<span class=\"la\">The teacher told to hand in our essays on Friday.<\/span>","<span class=\"la\">The teacher said to hand in your essays on Friday.<\/span>"]},{"type":"txt","a":["He said that he had lost his keys.","He said he had lost his keys."],"q":"Gib in der indirekten Rede wieder: <span class=\"la\">He said: „I have lost my keys.“<\/span>","h":"Present Perfect und Possessivpronomen.","s":"<span class=\"la\">He said that he had lost his keys.<\/span> Das Present Perfect wird zum Past Perfect, <span class=\"la\">my<\/span> wird zu <span class=\"la\">his<\/span>."},{"type":"self","q":"Nimm ein kurzes Gespräch aus deinem Alltag, etwa drei Aussagen, eine Frage und eine Bitte, und gib es vollständig in der indirekten Rede wieder.","s":"Musterlösung: Direkt: <span class=\"la\">„I'm going to the library.“ – „Are you coming with me?“ – „Please bring my book.“<\/span> Indirekt: <span class=\"la\">She said that she was going to the library. She asked whether I was coming with her. She asked me to bring her book.<\/span> Prüfe bei jedem Satz: Stimmen Zeit, Person und Ortsangabe? Steht bei der Frage die normale Satzstellung?"}],"gen":["rep"],"html":"<h3>Was sich verschiebt<\/h3>\n<p>Wenn du wiedergibst, was jemand gesagt hat, rückt alles einen Schritt in die Vergangenheit. Das heißt im Englischen <b>backshift<\/b>.<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Direkte Rede<\/th><th>Indirekte Rede<\/th><\/tr><tr><td>Present Simple <span class=\"la\">works<\/span><\/td><td>Past Simple <span class=\"la\">worked<\/span><\/td><\/tr><tr><td>Present Progressive <span class=\"la\">is working<\/span><\/td><td>Past Progressive <span class=\"la\">was working<\/span><\/td><\/tr><tr><td>Past Simple <span class=\"l
