für Schritt: Die Lesezeit nützen<\/h4><div class=\"task\">Die Aufgabe lautet: <span class=\"la\">The course costs <span class=\"gap\">___<\/span> per week and includes <span class=\"gap\">___<\/span>.<\/span><\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div><b class=\"e\">Grammatik der Lücke bestimmen:<\/b> Nach <span class=\"la\">costs<\/span> folgt ein Betrag, also eine Zahl mit Währung. Nach <span class=\"la\">includes<\/span> folgt ein Substantiv, vermutlich im Plural.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div><b class=\"e\">Erwartung bilden:<\/b> Welche Wörter könnten kommen? <span class=\"la\">accommodation, meals, materials, excursions<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div><b class=\"e\">Beim Hören gezielt warten:<\/b> Du hörst auf einen Betrag und auf eine Aufzählung.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div><b class=\"e\">Nach dem Hören prüfen:<\/b> Passt die eingetragene Form grammatisch in den Satz? Eine Lücke, die nach dem Eintragen einen unmöglichen Satz ergibt, ist fast immer falsch gehört.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"matura","t":"Die Klausur: Zeitplan und letzte Woche","kl":"4","k":4,"a":"P","tag":"Fortgeschritten","goals":["den Ablauf der schriftlichen Klausur kennen","die Zeit über die Teile verteilen","die letzten Tage sinnvoll nützen","am Prüfungstag ruhig und systematisch vorgehen"],"ex":[{"type":"mc","q":"Wofür gehören die letzten Minuten einer Schreibaufgabe reserviert?","h":"Welche Kriterien lassen sich in wenigen Minuten noch verbessern?","s":"Das Abhaken sichert das Kriterium Erfüllung der Aufgabenstellung, die Fehlerliste das Kriterium Sprachrichtigkeit. Beides zusammen wirkt auf die Hälfte der Bewertung.","o":["für das Abhaken der Bullet Points und die persönliche Fehlerliste","für zusätzliche Argumente","für eine schönere Überschrift","für das Abschreiben ins Reine"]},{"type":"mc","q":"Wie viele Wörter solltest du höchstens nachschlagen?","h":"Nachschlagen kostet Zeit und birgt eine eigene Fehlerquelle.","s":"Das Wörterbuch hilft bei Wörtern, die du fast kennst. Wer zwanzig Wörter nachschlägt, verliert Zeit und baut Konstruktionen ein, die er nicht beherrscht.","o":["ungefähr fünf bis sieben","so viele wie möglich","keines","mindestens zwanzig"]},{"type":"mc","q":"Eine Leseaufgabe kostet dich viel mehr Zeit als geplant. Was tust du?","s":"Eine offene Aufgabe kostet einen Punkt, eine verlorene Viertelstunde kostet viele. Feste Uhrzeiten einzuhalten ist in der Prüfung wichtiger als Vollständigkeit in jedem Einzelteil.","o":["die Aufgabe offen lassen, weitermachen und am Ende zurückkommen","so lange bleiben, bis du sie gelöst hast","alle folgenden Aufgaben schneller und oberflächlicher bearbeiten","den Text noch einmal ganz von vorne lesen"]},{"type":"mc","q":"Was ist am Tag vor der Klausur sinnvoll?","h":"Was lässt sich an einem Tag noch wirklich lernen?","s":"Neues am Vortag verunsichert mehr, als es bringt. Wiederholen von Bekanntem und Schlaf wirken sich auf das Ergebnis messbar aus.","o":["eine alte Aufgabe ansehen und früh schlafen","eine neue Textsorte lernen","die gesamte Grammatik wiederholen","bis spät nachts Vokabeln lernen"]},{"type":"mc","q":"Welche Reihenfolge ist beim Bearbeiten einer Schreibaufgabe sinnvoll?","s":"Zwei Minuten für das zweimalige Lesen der Angabe verhindern den teuersten aller Fehler, nämlich die verfehlte Textsorte oder den vergessenen Bullet Point.","o":["Angabe zweimal lesen, Bullet Points markieren, planen, schreiben, überarbeiten","sofort schreiben und am Ende die Angabe prüfen","planen, schreiben, neue Argumente ergänzen","Angabe lesen, Wörterbuch durchsehen, schreiben"]},{"type":"txt","a":["Yours sincerely"],"q":"Letzte Sicherheitsfrage: Welche Grußformel steht unter einem förmlichen Brief, wenn du den Namen der Empfängerin kennst? Antworte auf Englisch, zwei Wörter.","s":"<span class=\"la\">Yours sincerely<\/span> bei bekanntem Namen, <span class=\"la\">Yours faithfully<\/span> bei <span class=\"la\">Dear Sir or Madam<\/span>. Solche Kleinigkeiten kosten im Kriterium Aufbau und Layout Punkte, obwohl sie in einer Sekunde zu lernen sind."},{"type":"self","q":"Erstelle deinen persönlichen Prüfungsplan: Uhrzeiten für jeden Teil, deine sechs Punkte der Fehlerliste, die Redemittel für die zwei Textsorten, die dir am wenigsten liegen. Eine Seite, handschriftlich.","s":"Dieser Plan ist in zwanzig Minuten geschrieben und ersetzt am Prüfungstag das Nachdenken über Organisatorisches. Wer weiß, wann er wo sein muss und worauf er am Ende prüft, hat den Kopf frei für das, was tatsächlich zählt: die Sprache."}],"gen":["coll","wf","tense"],"html":"<h3>Der Aufbau der Klausur<\/h3>\n<p>Die schriftliche Arbeit in der ersten lebenden Fremdsprache besteht aus zwei Teilen, die nacheinander bearbeitet werden: dem Kompetenzbereich <b class=\"e\">Lesen, Hören und Language in Use<\/b> und dem <b class=\"e\">Schreiben<\/b>. Zwischen den Teilen liegt eine Pause, und das Wörterbuch ist nur im Schreibteil zugelassen.<\/p>\n<div class=\"note t\"><b class=\"lab\">Tipp<\/b>Frag deine Lehrkraft rechtzeitig nach dem genauen Ablauf und den Zeiten an deiner Schule. Wer den Ablauf kennt, verliert am Prüfungstag keine Energie an Organisatorisches.<\/div>\n<h3>Zeit einteilen<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Teil<\/th><th>Faustregel<\/th><\/tr><tr><td>Hören<\/td><td>folgt dem Tonträger, die Zeit ist vorgegeben<\/td><\/tr><tr><td>Lesen<\/td><td>Gesamtzeit durch Anzahl der Texte, zwei Minuten Reserve je Text<\/td><\/tr><tr><td>Language in Use<\/td><td>kurz halten, die Aufgaben sind in wenigen Minuten lösbar<\/td><\/tr><tr><td>Schreiben<\/td><td>pro Aufgabe: ein Fünftel planen, drei Fünftel schreiben, ein Fünftel überarbeiten<\/td><\/tr><\/table><\/div>\n<div class=\"note\"><b class=\"lab\">Merke<\/b>Die häufigste Ursache für schlechte Ergebnisse ist nicht mangelndes Können, sondern falsche Zeiteinteilung: zu lange an einer Leseaufgabe, dann keine Zeit zum Überarbeiten des Textes. Setze dir feste Uhrzeiten, zu denen du beim nächsten Teil sein musst, und halte sie ein, auch wenn eine Aufgabe offen bleibt.<\/div>\n<h3>Das Wörterbuch<\/h3>\n<p>Im Schreibteil ist ein Wörterbuch zugelassen. Es hilft bei Wörtern, die du fast kennst, und schadet bei Wörtern, die du gar nicht kennst, weil du ihre Verwendung nicht abschätzen kannst.<\/p>\n<ul><li>Schlage höchstens fünf bis sieben Wörter nach.<\/li><li>Prüfe bei jedem Treffer die Wortart und ein Beispiel.<\/li><li>Nimm nie das erste Wort einer Liste ungeprüft.<\/li><\/ul>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>Wörter, die man nur aus dem Wörterbuch hat, stehen erfahrungsgemäß in der falschen Konstruktion. Sicherer ist es, den Gedanken mit bekannten Wörtern auszudrücken.<\/div>\n<h3>Die letzten sieben Tage<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Tag<\/th><th>Was sinnvoll ist<\/th><\/tr><tr><td>7 bis 5<\/td><td>je eine vollständige Schreibaufgabe unter Zeitbedingungen, danach mit der Checkliste prüfen<\/td><\/tr><tr><td>4 bis 3<\/td><td>Lese- und Hörteile üben, immer mit Zeitnahme<\/td><\/tr><tr><td>2<\/td><td>die persönliche Fehlerliste und die Redemittel der Textsorten durchgehen<\/td><\/tr><tr><td>1<\/td><td>nichts Neues mehr; eine alte Aufgabe ansehen, früh schlafen<\/td><\/tr><\/table><\/div>\n<h3>Am Prüfungstag<\/h3>\n<ul><li>Lies jede Angabe zweimal, bevor du beginnst.<\/li><li>Markiere in den Schreibaufgaben die Bullet Points und die Wortzahl.<\/li><li>Lass beim Übertragen von Antworten keine Zeile aus; Verrutschen kostet ganze Aufgabenblöcke.<\/li><li>Behalte für jeden Schreibtext die letzten Minuten zum Überarbeiten frei, in jedem Fall.<\/li><\/ul>\n<div class=\"walk\"><h4>Schritt für Schritt: Die Zeit im Schreibteil einteilen<\/h4><div class=\"task\">Du hast 120 Minuten für zwei Schreibaufgaben, eine zu 250 und eine zu 300 Wörtern.<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div><b class=\"e\">Gesamtzeit aufteilen:<\/b> Die längere Aufgabe bekommt etwas mehr, also etwa 55 und 65 Minuten.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div><b class=\"e\">Innerhalb jeder Aufgabe dritteln:<\/b> rund ein Fünftel planen, drei Fünftel schreiben, ein Fünftel überarbeiten. Bei 55 Minuten also etwa 11, 33 und 11.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div><b class=\"e\">Uhrzeiten notieren:<\/b> Schreibe dir auf das Blatt, wann du mit der ersten Aufgabe fertig sein musst. Eine Zeit auf dem Papier wirkt anders als eine Zeit im Kopf.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div><b class=\"e\">Reserve einplanen:<\/b> Wenn du fünf Minuten übrig hast, gehören sie in die Überarbeitung des schwächeren Textes, nicht in zusätzliche Sätze.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"modalperf","t":"Modalverben der Vergangenheit und Vermutungen","kl":"2","k":2,"a":"G","tag":"Fortgeschritten","goals":["_must have_, _can't have_, _might have_, _should have_ und _needn't have_ bilden und unterscheiden","Vermutungen über die Vergangenheit ausdrücken","Vorwürfe und Bedauern formulieren"],"ex":[{"type":"txt","a":["must have forgotten"],"q":"Drücke eine sichere Vermutung aus: <span class=\"la\">He did not answer. He <span class=\"gap\">___<\/span> (forget) about our meeting.<\/span> Setze drei Wörter ein.","s":"<span class=\"la\">must have forgotten<\/span>. Die sichere Vermutung über eine vergangene Handlung wird mit <span class=\"la\">must have<\/span> plus Past Participle gebildet."},{"type":"mc","q":"Welcher Satz drückt aus, dass du sicher bist, dass etwas <b class=\"e\">nicht<\/b> geschehen ist?","h":"Die Verneinung von <span class=\"la\">must<\/span> in dieser Bedeutung ist nicht <span class=\"la\">mustn't<\/span>.","s":"<span class=\"la\">can't have<\/span> ist die sichere negative Vermutung. <span class=\"la\">mustn't<\/span> drückt ein Verbot aus, <span class=\"la\">shouldn't have<\/span> einen Vorwurf.","o":["<span class=\"la\">She can't have seen us.<\/span>","<span class=\"la\">She mustn't have seen us.<\/span>","<span class=\"la\">She shouldn't have seen us.<\/span>","<span class=\"la\">She needn't have seen us.<\/span>"]},{"type":"txt","a":["should have asked"],"q":"Drücke Bedauern aus: <span class=\"la\">I did not ask for help. I <span class=\"gap\">___<\/span> for help.<\/span> Setze drei Wörter ein.","s":"<span class=\"la\">should have asked<\/span>. Diese Form bezeichnet, was richtig gewesen wäre, aber nicht geschah."},{"type":"mc","q":"Was bedeutet <span class=\"la\">We needn't have hurried<\/span>?","h":"Der Unterschied liegt darin, ob die Handlung geschehen ist.","s":"<span class=\"la\">needn't have done<\/span> heißt, dass die Handlung stattfand und überflüssig war. <span class=\"la\">didn't need to do<\/span> hieße, dass sie gar nicht stattfand.","o":["Wir haben uns beeilt, und es war unnötig.","Wir haben uns nicht beeilt, weil es unnötig war.","Wir durften uns nicht beeilen.","Wir sollten uns nicht beeilen."]},{"type":"txt","a":["might have","may have","could have"],"q":"Drücke eine unsichere Vermutung aus: <span class=\"la\">They are late. They <span class=\"gap\">___<\/span> missed the bus.<\/span> Setze zwei Wörter ein.","s":"<span class=\"la\">might have<\/span>, <span class=\"la\">may have<\/span> oder <span class=\"la\">could have<\/span> drücken Unsicherheit aus. Mit <span class=\"la\">must have<\/span> wärst du dir sicher."},{"type":"mc","q":"Welcher Satz drückt eine verpasste Möglichkeit aus?","s":"<span class=\"la\">could have<\/span> plus Past Participle bezeichnet, was möglich gewesen wäre, aber nicht geschah.","o":["<span class=\"la\">We could have won that match.<\/span>","<span class=\"la\">We can win that match.<\/span>","<span class=\"la\">We should win that match.<\/span>","<span class=\"la\">We must have won that match.<\/span>"]},{"type":"mc","q":"Welcher Satz ist richtig?","h":"Gemeint ist: Er ist sicher nicht zu Hause.","s":"Die sichere negative Vermutung über die Gegenwart heißt <span class=\"la\">can't be<\/span>. <span class=\"la\">mustn't be<\/span> wäre ein Verbot.","o":["<span class=\"la\">He can't be at home; his car is gone.<\/span>","<span class=\"la\">He mustn't be at home; his car is gone.<\/span>","<span class=\"la\">He needn't be at home; his car is gone.<\/span>","<span class=\"la\">He shouldn't be at home; his car is gone.<\/span>"]},{"type":"self","q":"Schreibe zu dieser Situation fünf Vermutungen unterschiedlicher Sicherheit: Deine Freundin antwortet seit zwei Tagen nicht auf Nachrichten.","s":"Ein mögliches Muster: <span class=\"la\">She might have lost her phone. She may be on holiday without signal. She can't have seen my messages, otherwise she would have replied. She must be very busy. I should have called instead of texting.<\/span> Achte darauf, dass jede Form eine andere Sicherheit ausdrückt; genau das prüft dieses Kapitel."}],"gen":["tense","irr"],"html":"<h3>Die Formen<\/h3>\n<div class=\"formula\"><b class=\"e\">Modalverb + have + Past Participle<\/b><\/div>\n<div class=\"formula\"><span class=\"la\">She <b class=\"e\">must have<\/b> forgotten.<\/span> · <span class=\"la\">He <b class=\"e\">can't have<\/b> seen us.<\/span> · <span class=\"la\">They <b class=\"e\">might have<\/b> left already.<\/span><\/div>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Form<\/th><th>Bedeutung<\/th><th>Beispiel<\/th><\/tr><tr><td><span class=\"la\">must have<\/span><\/td><td>sichere Vermutung, dass etwas war<\/td><td><span class=\"la\">The light is on; she must have come home.<\/span><\/td><\/tr><tr><td><span class=\"la\">can't have / couldn't have<\/span><\/td><td>sichere Vermutung, dass etwas nicht war<\/td><td><span class=\"la\">He can't have known about it.<\/span><\/td><\/tr><tr><td><span class=\"la\">might have / may have / could have<\/span><\/td><td>unsichere Vermutung<\/td><td><span class=\"la\">They might have missed the train.<\/span><\/td><\/tr><tr><td><span class=\"la\">should have<\/span><\/td><td>Vorwurf oder Bedauern<\/td><td><span class=\"la\">I should have asked earlier.<\/span><\/td><\/tr><tr><td><span class=\"la\">shouldn't have<\/span><\/td><td>etwas war ein Fehler<\/td><td><span class=\"la\">You shouldn't have said that.<\/span><\/td><\/tr><tr><td><span class=\"la\">needn't have<\/span><\/td><td>man tat etwas, das unnötig war<\/td><td><span class=\"la\">We needn't have hurried; the film started late.<\/span><\/td><\/tr><tr><td><span class=\"la\">didn't need to<\/span><\/td><td>man tat es nicht, weil es unnötig war<\/td><td><span class=\"la\">We didn't need to hurry, so we walked.<\/span><\/td><\/tr><\/table><\/div>\n<div class=\"note\"><b class=\"lab\">Merke<\/b>Der feine Unterschied zwischen <span class=\"la\">needn't have done<\/span> und <span class=\"la\">didn't need to do<\/span> ist eine beliebte Prüfungsfrage. Im ersten Fall ist die Handlung geschehen und war überflüssig, im zweiten ist sie gar nicht geschehen.<\/div>\n<h3>Vermutungen über die Gegenwart<\/h3>\n<p>Dasselbe Muster ohne <span class=\"la\">have<\/span>:<\/p>\n<div class=\"formula\"><span class=\"la\">She <b class=\"e\">must be<\/b> at home.<\/span> · <span class=\"la\">He <b class=\"e\">can't be<\/b> serious.<\/span> · <span class=\"la\">They <b class=\"e\">might be<\/b> waiting outside.<\/span><\/div>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>Die Verneinung der sicheren Vermutung ist <b class=\"e\">nicht<\/b> <span class=\"la\">mustn't<\/span>, sondern <span class=\"la\">can't<\/span>. <span class=\"la\">He mustn't be at home<\/span> hieße, er dürfe nicht zu Hause sein. Gemeint ist <span class=\"la\">He can't be at home<\/span>.<\/div>\n<h3>Bedauern und Vorwurf<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Richtung<\/th><th>Form<\/th><th>Beispiel<\/th><\/tr><tr><td>eigenes Bedauern<\/td><td><span class=\"la\">should have<\/span><\/td><td><span class=\"la\">I should have studied more.<\/span><\/td><\/tr><tr><td>Vorwurf an andere<\/td><td><span class=\"la\">shouldn't have<\/span><\/td><td><span class=\"la\">You shouldn't have told her.<\/span><\/td><\/tr><tr><td>verpasste Möglichkeit<\/td><td><span class=\"la\">could have<\/span><\/td><td><span class=\"la\">We could have won that match.<\/span><\/td><\/tr><\/table><\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Eine Vermutung formulieren<\/h4><div class=\"task\">Das Licht brennt, die Schuhe stehen im Flur. Drücke deine Vermutung aus.<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div><b class=\"e\">Wie sicher bist du?<\/b> Zwei Hinweise sprechen dafür, also eine sichere Vermutung.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div><b class=\"e\">Form wählen:<\/b> Sichere Vermutung über die Vergangenheit heißt <span class=\"la\">must have<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div><b class=\"e\">Satz bilden:<\/b> <span class=\"la\">She must have come home already.<\/span><\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div><b class=\"e\">Gegenprobe:<\/b> Wäre es unsicher, hieße es <span class=\"la\">she might have come home<\/span>; wärst du sicher, dass sie nicht da ist, <span class=\"la\">she can't have come home<\/span>.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"participle","t":"Partizipien und Verkürzungen","kl":"2","k":2,"a":"G","tag":"Fortgeschritten","goals":["Partizipialkonstruktionen verstehen und bilden","Relativsätze und Nebensätze verkürzen","_-ing_ und _-ed_ als Adjektive unterscheiden","den Satzbau damit abwechslungsreicher machen"],"ex":[{"type":"txt","a":["waiting"],"q":"Verkürze: <span class=\"la\">The woman who is waiting at the door is my aunt.<\/span> → <span class=\"la\">The woman <span class=\"gap\">___<\/span> at the door is my aunt.<\/span>","s":"Aktiv und gleichzeitig verlangt das Present Participle: <span class=\"la\">waiting<\/span>."},{"type":"txt","a":["written"],"q":"Verkürze: <span class=\"la\">The report which was written last year is out of date.<\/span> → <span class=\"la\">The report <span class=\"gap\">___<\/span> last year is out of date.<\/span>","s":"Passiv und abgeschlossen verlangt das Past Participle: <span class=\"la\">written<\/span>."},{"type":"mc","q":"Welcher Satz ist richtig?","h":"Beide Satzteile brauchen dasselbe Subjekt.","s":"Nur im ersten Satz gehört das Gehen zu demselben Subjekt wie der Hauptsatz. In den übrigen Fassungen geht der Regen beziehungsweise der Regenschirm nach Hause.","o":["<span class=\"la\">Walking home, I noticed that it had started to rain.<\/span>","<span class=\"la\">Walking home, the rain started.<\/span>","<span class=\"la\">Walking home, it began to rain on me.<\/span>","<span class=\"la\">Walking home, my umbrella was forgotten.<\/span>"]},{"type":"mc","q":"Welche Fassung ist richtig, wenn dir langweilig ist?","h":"Wer empfängt das Gefühl?","s":"<span class=\"la\">bored<\/span> beschreibt dein Gefühl, <span class=\"la\">boring<\/span> beschreibt die Wirkung, die du auf andere hast. Diese Verwechslung gehört zu den bekanntesten Fehlern überhaupt.","o":["<span class=\"la\">I am bored.<\/span>","<span class=\"la\">I am boring.<\/span>","<span class=\"la\">I am being bored.<\/span>","<span class=\"la\">I have boring.<\/span>"]},{"type":"txt","a":["Having finished","Having completed"],"q":"Verkürze mit einer Partizipialkonstruktion: <span class=\"la\">After she had finished her homework, she went out.<\/span> → <span class=\"gap\">___<\/span> her homework, she went out._ Setze zwei Wörter ein.","s":"<span class=\"la\">Having finished<\/span>. Die Perfektform des Partizips drückt aus, dass die Handlung der anderen vorausging."},{"type":"mc","q":"Welches Adjektiv passt? <span class=\"la\">The results were <span class=\"gap\">___<\/span>.<\/span> Gemeint ist: Die Ergebnisse haben alle überrascht.","s":"Die Ergebnisse gehen die Wirkung aus, also <span class=\"la\">-ing<\/span>. <span class=\"la\">surprised<\/span> wären Personen, die überrascht wurden.","o":["<span class=\"la\">surprising<\/span>","<span class=\"la\">surprised<\/span>","<span class=\"la\">surprise<\/span>","<span class=\"la\">surprisingly<\/span>"]},{"type":"mc","q":"Welche Verkürzung ist richtig? <span class=\"la\">Because he had missed the train, he arrived late.<\/span>","h":"Die eine Handlung lag vor der anderen.","s":"Bei Vorzeitigkeit steht <span class=\"la\">having<\/span> plus Past Participle. Das einfache <span class=\"la\">-ing<\/span> würde Gleichzeitigkeit ausdrücken.","o":["<span class=\"la\">Having missed the train, he arrived late.<\/span>","<span class=\"la\">Missing the train, he arrived late.<\/span>","<span class=\"la\">Missed the train, he arrived late.<\/span>","<span class=\"la\">To miss the train, he arrived late.<\/span>"]},{"type":"self","q":"Nimm fünf Sätze aus einem eigenen Text, die mit <span class=\"la\">who<\/span>, <span class=\"la\">which<\/span> oder <span class=\"la\">because<\/span> beginnen, und verkürze drei davon mit einer Partizipialkonstruktion.","s":"Prüfe bei jeder Verkürzung zwei Dinge: Haben beide Teile dasselbe Subjekt? Und ist die Beziehung aktiv oder passiv, gleichzeitig oder vorzeitig? Verkürzungen sind das wirksamste Mittel, einen Text erwachsener klingen zu lassen, aber sie sind auch die Stelle, an der sich der häufigste Stilfehler des Englischen einschleicht."}],"gen":["tense","wf"],"html":"<h3>Die beiden Partizipien<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Form<\/th><th>Bedeutung<\/th><th>Beispiel<\/th><\/tr><tr><td>Present Participle <span class=\"la\">-ing<\/span><\/td><td>aktiv, gleichzeitig<\/td><td><span class=\"la\">the man waiting outside<\/span> (der wartet)<\/td><\/tr><tr><td>Past Participle <span class=\"la\">-ed<\/span> / 3. Form<\/td><td>passiv, abgeschlossen<\/td><td><span class=\"la\">the letter written yesterday<\/span> (der geschrieben wurde)<\/td><\/tr><\/table><\/div>\n<h3>Relativsätze verkürzen<\/h3>\n<div class=\"formula\"><span class=\"la\">The man who is waiting outside<\/span> → <span class=\"la\">The man <b class=\"e\">waiting<\/b> outside<\/span><\/div>\n<div class=\"formula\"><span class=\"la\">The letter which was written yesterday<\/span> → <span class=\"la\">The letter <b class=\"e\">written<\/b> yesterday<\/span><\/div>\n<p>Diese Verkürzung ist ein einfaches und wirksames Mittel für das Kriterium Spektrum, weil sie den Satzbau variiert, ohne Fehler zu riskieren.<\/p>\n<h3>Nebensätze verkürzen<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Nebensatz<\/th><th>Verkürzung<\/th><\/tr><tr><td><span class=\"la\">While I was walking home, I met her.<\/span><\/td><td><span class=\"la\">Walking home, I met her.<\/span><\/td><\/tr><tr><td><span class=\"la\">Because he had lost his keys, he waited outside.<\/span><\/td><td><span class=\"la\">Having lost his keys, he waited outside.<\/span><\/td><\/tr><tr><td><span class=\"la\">After the house had been sold, the family moved.<\/span><\/td><td><span class=\"la\">Having been sold, the house …<\/span><\/td><\/tr><\/table><\/div>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>Die Verkürzung ist nur erlaubt, wenn beide Teile <b class=\"e\">dasselbe Subjekt<\/b> haben. Falsch: <span class=\"la\">Walking home, the rain started.<\/span> Der Regen ging nicht nach Hause. Richtig: <span class=\"la\">While I was walking home, it started to rain.<\/span><\/div>\n<h3>-ing oder -ed als Adjektiv?<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th><span class=\"la\">-ing<\/span> beschreibt die Ursache<\/th><th><span class=\"la\">-ed<\/span> beschreibt das Gefühl<\/th><\/tr><tr><td><span class=\"la\">an interesting book<\/span><\/td><td><span class=\"la\">an interested reader<\/span><\/td><\/tr><tr><td><span class=\"la\">a boring lesson<\/span><\/td><td><span class=\"la\">a bored student<\/span><\/td><\/tr><tr><td><span class=\"la\">surprising news<\/span><\/td><td><span class=\"la\">a surprised teacher<\/span><\/td><\/tr><tr><td><span class=\"la\">frightening noise<\/span><\/td><td><span class=\"la\">a frightened child<\/span><\/td><\/tr><\/table><\/div>\n<div class=\"note\"><b class=\"lab\">Merke<\/b>Die Eselsbrücke: Was die Wirkung ausgeht, bekommt <span class=\"la\">-ing<\/span>; wer sie empfängt, bekommt <span class=\"la\">-ed<\/span>. <span class=\"la\">I am boring<\/span> heißt: Ich bin langweilig. <span class=\"la\">I am bored<\/span> heißt: Mir ist langweilig.<\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Einen Relativsatz verkürzen<\/h4><div class=\"task\">Verkürze: <span class=\"la\">The students who are taking part in the exchange will meet on Friday.<\/span><\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div><b class=\"e\">Prüfen, ob die Verkürzung möglich ist:<\/b> Das Relativpronomen ist Subjekt des Nebensatzes, also ja.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div><b class=\"e\">Relativpronomen und Hilfsverb streichen:<\/b> <span class=\"la\">who are<\/span> fällt weg.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div><b class=\"e\">Partizip wählen:<\/b> Die Handlung ist aktiv, also <span class=\"la\">-ing<\/span>: <span class=\"la\">taking<\/span>.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Ergebnis: <span class=\"la\">The students taking part in the exchange will meet on Friday.<\/span> Sechs Wörter wurden zu vier, der Satz wirkt dichter.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"zahlen","t":"Zahlen, Daten, Maße und Mengen","kl":"2","k":2,"a":"G","tag":"Basis","goals":["Zahlen, Daten und Uhrzeiten korrekt schreiben und sprechen","Prozentangaben und Bruchteile formulieren","britische und amerikanische Schreibweisen unterscheiden","Maße richtig anschließen"],"ex":[{"type":"txt","a":["half past seven","7.30","seven thirty"],"q":"Wie sagt man 7.30 Uhr auf Englisch? Schreibe die übliche britische Form.","s":"<span class=\"la\">half past seven<\/span>. Die deutsche Denkweise „halb acht“ führt zu <span class=\"la\">half eight<\/span>, was im Englischen etwas anderes bedeutet, nämlich umgangssprachlich halb neun."},{"type":"mc","q":"Was bedeutet das britische Datum <span class=\"la\">12/03/2026<\/span>?","s":"Im britischen Englisch steht der Tag zuerst. Im amerikanischen wäre dasselbe Datum der 3. Dezember.","o":["12. März 2026","3. Dezember 2026","12. Dezember 2026","3. März 2026"]},{"type":"txt","a":["a ten-year-old boy","ten-year-old"],"q":"Wie heißt „ein zehnjähriger Junge“ auf Englisch?","s":"<span class=\"la\">a ten-year-old boy<\/span>. Im Attribut steht der Singular, und die Teile werden mit Bindestrichen verbunden."},{"type":"mc","q":"Welche Zahl bedeutet <span class=\"la\">1,250.75<\/span> im Englischen?","h":"Komma und Punkt haben die umgekehrte Funktion.","s":"Im Englischen trennt das Komma die Tausender und der Punkt die Dezimalstellen. Im Deutschen ist es umgekehrt, weshalb Zahlen beim Übertragen besonders sorgfältig geprüft werden müssen.","o":["tausendzweihundertfünfzig Komma fünfundsiebzig","eins Komma zweihundertfünfzig","eine Million zweihundertfünfzigtausend","zwölfhundertfünfzigtausend"]},{"type":"txt","a":["three thousand"],"q":"Setze die richtige Form ein: <span class=\"la\">More than <span class=\"gap\">___<\/span> people attended.<\/span> Gemeint sind 3000.","h":"Nach einer bestimmten Zahl bleibt das Zahlwort im Singular.","s":"<span class=\"la\">three thousand people<\/span>. Mit unbestimmter Menge dagegen: <span class=\"la\">thousands of people<\/span>."},{"type":"mc","q":"Welcher Satz ist richtig?","h":"Das Verb richtet sich nach dem Bezugswort.","s":"<span class=\"la\">students<\/span> ist Plural, deshalb steht <span class=\"la\">are<\/span>. Bei einem unzählbaren Bezugswort wie <span class=\"la\">money<\/span> stünde dagegen <span class=\"la\">is<\/span>.","o":["<span class=\"la\">Fifty per cent of the students are in favour.<\/span>","<span class=\"la\">Fifty per cent of the students is in favour.<\/span>","<span class=\"la\">Fifty per cent of the student are in favour.<\/span>","<span class=\"la\">The fifty per cent of students is in favour.<\/span>"]},{"type":"mc","q":"Wie drückst du 33 Prozent in einem Report am besten aus?","s":"<span class=\"la\">one in three<\/span> oder <span class=\"la\">a third<\/span> sind die üblichen Formulierungen. Die nackte Zahl ohne Bezug und vage Angaben wie <span class=\"la\">a lot<\/span> passen nicht in einen Bericht.","o":["<span class=\"la\">one in three<\/span>","<span class=\"la\">thirty-three<\/span>","<span class=\"la\">a lot<\/span>","<span class=\"la\">the third part<\/span>"]},{"type":"self","q":"Schreibe fünf Sätze mit Zahlenangaben über deine Schule: eine Prozentangabe, ein Datum, eine Uhrzeit, eine Maßangabe als Attribut und eine große Zahl.","s":"Ein mögliches Muster: <span class=\"la\">About a quarter of our students come by train. The school year started on 7 September. Lessons begin at a quarter to eight. We have a four-week summer break in July. The building was renovated for two million euros.<\/span> Prüfe besonders die Maßangabe im Attribut und die Zeichensetzung bei der großen Zahl."}],"gen":["vok","wf"],"html":"<h3>Zahlen<\/h3>\n<ul><li>Große Zahlen mit <span class=\"la\">and<\/span> im britischen Englisch: <span class=\"la\">two hundred <b class=\"e\">and<\/b> forty-five<\/span><\/li><li>Keine Pluralform bei <span class=\"la\">hundred, thousand, million<\/span> nach einer Zahl: <span class=\"la\">three thousand people<\/span>, aber <span class=\"la\">thousands of people<\/span><\/li><li>Komma als Tausendertrennzeichen, Punkt als Dezimalzeichen: <span class=\"la\">1,250.75<\/span><\/li><\/ul>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>Im Deutschen ist es genau umgekehrt: 1.250,75. Diese Verwechslung verändert in einem Report ganze Aussagen.<\/div>\n<h3>Daten<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Schreibweise<\/th><th>Britisch<\/th><th>Amerikanisch<\/th><\/tr><tr><td>Ziffern<\/td><td><span class=\"la\">12/03/2026<\/span> (Tag zuerst)<\/td><td><span class=\"la\">03/12/2026<\/span> (Monat zuerst)<\/td><\/tr><tr><td>ausgeschrieben<\/td><td><span class=\"la\">12 March 2026<\/span><\/td><td><span class=\"la\">March 12, 2026<\/span><\/td><\/tr><tr><td>gesprochen<\/td><td><span class=\"la\">the twelfth of March<\/span><\/td><td><span class=\"la\">March twelfth<\/span><\/td><\/tr><\/table><\/div>\n<div class=\"note t\"><b class=\"lab\">Tipp<\/b>In internationalen Texten schreibt man das Datum sicherheitshalber aus. <span class=\"la\">12/03<\/span> ist je nach Land der 12. März oder der 3. Dezember.<\/div>\n<h3>Uhrzeiten<\/h3>\n<div class=\"formula\"><span class=\"la\">7.15<\/span> → <span class=\"la\">quarter past seven<\/span> · <span class=\"la\">7.30<\/span> → <span class=\"la\">half past seven<\/span> · <span class=\"la\">7.45<\/span> → <span class=\"la\">quarter to eight<\/span> · <span class=\"la\">7.20<\/span> → <span class=\"la\">twenty past seven<\/span><\/div>\n<p>Im Alltag auch einfach: <span class=\"la\">seven fifteen<\/span>. Die Zusätze <span class=\"la\">a.m.<\/span> und <span class=\"la\">p.m.<\/span> ersetzen die Angabe <span class=\"la\">o'clock<\/span>, nicht umgekehrt.<\/p>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>„Halb acht“ heißt auf Englisch <span class=\"la\">half past seven<\/span>, nicht <span class=\"la\">half eight<\/span>. Die englische Angabe geht von der vollen Stunde aus, die deutsche auf sie zu.<\/div>\n<h3>Prozent und Bruchteile<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Zahl<\/th><th>Formulierung<\/th><\/tr><tr><td>50 %<\/td><td><span class=\"la\">half, fifty per cent<\/span><\/td><\/tr><tr><td>33 %<\/td><td><span class=\"la\">a third, one in three<\/span><\/td><\/tr><tr><td>25 %<\/td><td><span class=\"la\">a quarter<\/span><\/td><\/tr><tr><td>75 %<\/td><td><span class=\"la\">three quarters<\/span><\/td><\/tr><tr><td>0,5<\/td><td><span class=\"la\">nought point five<\/span> (britisch)<\/td><\/tr><\/table><\/div>\n<p><span class=\"la\">per cent<\/span> schreibt man britisch meist getrennt, amerikanisch <span class=\"la\">percent<\/span>. Das Verb richtet sich nach dem Bezugswort: <span class=\"la\">Fifty per cent of the students <b class=\"e\">are<\/b> …<\/span>, aber <span class=\"la\">Fifty per cent of the money <b class=\"e\">is<\/b> …<\/span><\/p>\n<h3>Maße und Mengen<\/h3>\n<div class=\"formula\"><span class=\"la\">a two-litre bottle<\/span> · <span class=\"la\">a five-kilometre run<\/span> · <span class=\"la\">a three-hour meeting<\/span> · <span class=\"la\">a ten-year-old boy<\/span><\/div>\n<p>Im Attribut steht der <b class=\"e\">Singular<\/b> und die Teile werden mit Bindestrichen verbunden. Als Aussage dagegen: <span class=\"la\">The meeting lasted three hours.<\/span><\/p>\n<div class=\"walk\"><h4>Schritt für Schritt: Eine Maßangabe richtig anschließen<\/h4><div class=\"task\">Bilde einen Ausdruck für „eine Besprechung von drei Stunden“ als Attribut.<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div><b class=\"e\">Attribut oder Aussage?<\/b> Gesucht ist ein Ausdruck vor dem Substantiv, also ein Attribut.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div><b class=\"e\">Singular verwenden:<\/b> <span class=\"la\">three hour<\/span>, nicht <span class=\"la\">three hours<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div><b class=\"e\">Bindestriche setzen:<\/b> <span class=\"la\">three-hour<\/span>.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Ergebnis: <span class=\"la\">a three-hour meeting<\/span>. Als Aussage hieße es dagegen <span class=\"la\">The meeting lasted three hours.<\/span><\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"topic1","t":"Themenwortschatz I: Umwelt, Gesundheit, Reisen","kl":"2","k":2,"a":"W","tag":"Aufbau","goals":["den Wortschatz dreier Prüfungsthemen beherrschen","zu jedem Thema Argumente auf beiden Seiten haben","themenspezifische Wendungen statt allgemeiner Wörter verwenden"],"ex":[{"type":"mc","q":"Welches Wort passt? <span class=\"la\">The hotel calls itself <span class=\"gap\">___<\/span>: it runs on solar power and buys everything from farms in the valley.<\/span>","h":"Zwei der Wörter gibt es im Umweltwortschatz, sie beschreiben aber nicht einen ganzen Betrieb.","s":"<span class=\"la\">sustainable<\/span> heißt nachhaltig und bezeichnet eine Wirtschaftsweise, die auf Dauer tragfähig ist. <span class=\"la\">renewable<\/span> bezieht sich auf Energiequellen, <span class=\"la\">profitable<\/span> auf den Gewinn und <span class=\"la\">disposable<\/span> auf Einwegprodukte.","o":["sustainable","renewable","profitable","disposable"]},{"type":"txt","a":["landfill"],"q":"Wie heißt die Mülldeponie auf Englisch?","s":"<span class=\"la\">landfill<\/span>. Das Wort kommt in Texten über Abfallvermeidung regelmäßig vor: <span class=\"la\">Most of this waste ends up in landfill.<\/span>"},{"type":"mc","q":"Welche Wendung bedeutet „reduzieren“?","s":"<span class=\"la\">cut down on something<\/span> heißt, weniger davon zu verbrauchen. <span class=\"la\">cut off<\/span> hieße abschneiden, <span class=\"la\">cut up<\/span> zerschneiden.","o":["<span class=\"la\">to cut down on<\/span>","<span class=\"la\">to cut off<\/span>","<span class=\"la\">to cut out of<\/span>","<span class=\"la\">to cut up<\/span>"]},{"type":"txt","a":["a balanced diet"],"q":"Wie heißt „ausgewogene Ernährung“ auf Englisch? Drei Wörter.","s":"<span class=\"la\">a balanced diet<\/span>. Beachte, dass <span class=\"la\">diet<\/span> im Englischen zunächst die Ernährungsweise bezeichnet und nicht nur eine Schlankheitskur."},{"type":"mc","q":"Welches Wort passt? <span class=\"la\">Office workers often have a <span class=\"gap\">___<\/span> lifestyle and have to build movement into their day on purpose.<\/span>","h":"Alle vier Wörter gibt es; gesucht ist das, welches das viele Sitzen beschreibt.","s":"<span class=\"la\">sedentary<\/span> heißt sitzend und beschreibt Lebensweise und Arbeit. <span class=\"la\">stationary<\/span> heißt unbeweglich im Sinn von stillstehend, <span class=\"la\">sedate<\/span> gesetzt, ruhig im Wesen, <span class=\"la\">settled<\/span> sesshaft oder geklärt.","o":["sedentary","stationary","sedate","settled"]},{"type":"txt","a":["to broaden your horizons","broaden your horizons"],"q":"Wie lautet die Wendung „den Horizont erweitern“ auf Englisch?","s":"<span class=\"la\">to broaden your horizons<\/span>. Beachte den Plural <span class=\"la\">horizons<\/span>, der im Deutschen nicht steht."},{"type":"mc","q":"Welche Wendung passt? <span class=\"la\">We spent the last three days <span class=\"gap\">___<\/span>, in villages that the buses do not even reach.<\/span>","h":"Alle vier sind geläufige Wendungen, nur eine beschreibt einen Ort.","s":"<span class=\"la\">off the beaten track<\/span> heißt abseits der ausgetretenen Pfade. <span class=\"la\">out of the blue<\/span> heißt völlig unerwartet, <span class=\"la\">over the moon<\/span> überglücklich, <span class=\"la\">under the weather<\/span> nicht ganz wohlauf.","o":["off the beaten track","out of the blue","over the moon","under the weather"]},{"type":"self","q":"Wähle eines der drei Themen und schreibe vier Sätze: eine Behauptung, ein Beispiel, ein Gegenargument und eine eigene Folgerung. Verwende dabei mindestens fünf Wörter aus der Tabelle.","s":"Prüfe am Ende, ob du die Fachwörter wirklich eingesetzt oder sie durch allgemeine Wörter ersetzt hast. Der Unterschied zwischen <span class=\"la\">it is bad for the environment<\/span> und <span class=\"la\">it increases emissions and ends up in landfill<\/span> entscheidet beim Kriterium Spektrum, und er kostet nur zwei Vokabeln."}],"gen":["vok","coll"],"html":"<h3>Umwelt und Nachhaltigkeit<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Englisch<\/th><th>Deutsch<\/th><\/tr><tr><td><span class=\"la\">sustainable, sustainability<\/span><\/td><td>nachhaltig, Nachhaltigkeit<\/td><\/tr><tr><td><span class=\"la\">renewable energy<\/span><\/td><td>erneuerbare Energie<\/td><\/tr><tr><td><span class=\"la\">carbon footprint<\/span><\/td><td>CO2-Bilanz<\/td><\/tr><tr><td><span class=\"la\">emissions<\/span><\/td><td>Emissionen<\/td><\/tr><tr><td><span class=\"la\">single-use plastic<\/span><\/td><td>Einwegplastik<\/td><\/tr><tr><td><span class=\"la\">to cut down on<\/span><\/td><td>reduzieren<\/td><\/tr><tr><td><span class=\"la\">waste, landfill<\/span><\/td><td>Abfall, Deponie<\/td><\/tr><tr><td><span class=\"la\">to recycle, recycling rate<\/span><\/td><td>wiederverwerten, Recyclingquote<\/td><\/tr><tr><td><span class=\"la\">climate targets<\/span><\/td><td>Klimaziele<\/td><\/tr><tr><td><span class=\"la\">endangered species<\/span><\/td><td>gefährdete Arten<\/td><\/tr><tr><td><span class=\"la\">public transport<\/span><\/td><td>öffentlicher Verkehr<\/td><\/tr><tr><td><span class=\"la\">to raise awareness<\/span><\/td><td>Bewusstsein schaffen<\/td><\/tr><\/table><\/div>\n<div class=\"formula\">Argumente dafür: <span class=\"la\">Small changes add up. Individual action creates political pressure.<\/span><\/div>\n<div class=\"formula\">Argumente dagegen: <span class=\"la\">Without regulation, individual behaviour has little effect. The responsibility lies with industry.<\/span><\/div>\n<h3>Gesundheit und Lebensstil<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Englisch<\/th><th>Deutsch<\/th><\/tr><tr><td><span class=\"la\">a balanced diet<\/span><\/td><td>ausgewogene Ernährung<\/td><\/tr><tr><td><span class=\"la\">processed food<\/span><\/td><td>verarbeitete Lebensmittel<\/td><\/tr><tr><td><span class=\"la\">to work out, to take up a sport<\/span><\/td><td>trainieren, mit einem Sport beginnen<\/td><\/tr><tr><td><span class=\"la\">sedentary lifestyle<\/span><\/td><td>bewegungsarmer Lebensstil<\/td><\/tr><tr><td><span class=\"la\">sleep deprivation<\/span><\/td><td>Schlafmangel<\/td><\/tr><tr><td><span class=\"la\">well-being<\/span><\/td><td>Wohlbefinden<\/td><\/tr><tr><td><span class=\"la\">to deal with stress<\/span><\/td><td>mit Stress umgehen<\/td><\/tr><tr><td><span class=\"la\">prevention<\/span><\/td><td>Vorbeugung<\/td><\/tr><tr><td><span class=\"la\">to cut down on sugar<\/span><\/td><td>Zucker reduzieren<\/td><\/tr><tr><td><span class=\"la\">affordable<\/span><\/td><td>leistbar<\/td><\/tr><\/table><\/div>\n<div class=\"formula\">Argumente dafür: <span class=\"la\">Schools shape habits that last a lifetime.<\/span><\/div>\n<div class=\"formula\">Argumente dagegen: <span class=\"la\">Compulsory exercise can put people off sport for good.<\/span><\/div>\n<h3>Reisen und Ausland<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Englisch<\/th><th>Deutsch<\/th><\/tr><tr><td><span class=\"la\">accommodation<\/span><\/td><td>Unterkunft<\/td><\/tr><tr><td><span class=\"la\">host family<\/span><\/td><td>Gastfamilie<\/td><\/tr><tr><td><span class=\"la\">culture shock<\/span><\/td><td>Kulturschock<\/td><\/tr><tr><td><span class=\"la\">to broaden your horizons<\/span><\/td><td>den Horizont erweitern<\/td><\/tr><tr><td><span class=\"la\">overtourism<\/span><\/td><td>Massentourismus<\/td><\/tr><tr><td><span class=\"la\">off the beaten track<\/span><\/td><td>abseits der ausgetretenen Pfade<\/td><\/tr><tr><td><span class=\"la\">landmark<\/span><\/td><td>Wahrzeichen<\/td><\/tr><tr><td><span class=\"la\">itinerary<\/span><\/td><td>Reiseplan<\/td><\/tr><tr><td><span class=\"la\">to settle in<\/span><\/td><td>sich einleben<\/td><\/tr><tr><td><span class=\"la\">homesickness<\/span><\/td><td>Heimweh<\/td><\/tr><\/table><\/div>\n<div class=\"formula\">Argumente dafür: <span class=\"la\">Travel breaks down prejudice faster than any lesson.<\/span><\/div>\n<div class=\"formula\">Argumente dagegen: <span class=\"la\">Mass tourism damages the very places it makes popular.<\/span><\/div>\n<div class=\"note t\"><b class=\"lab\">Tipp<\/b>Lerne zu jedem Thema nicht nur Wörter, sondern drei fertige Sätze: eine Behauptung, ein Gegenargument und ein Beispiel. Damit kannst du in jeder Textsorte und in der mündlichen Prüfung sofort beginnen.<\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Vom Wort zum Argument<\/h4><div class=\"task\">Mach aus dem Wort <span class=\"la\">carbon footprint<\/span> ein vollständiges Argument.<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div><b class=\"e\">Behauptung bilden:<\/b> <span class=\"la\">Everyone talks about their carbon footprint.<\/span><\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div><b class=\"e\">Begründung anfügen:<\/b> <span class=\"la\">The idea is useful because it makes an abstract problem personal.<\/span><\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div><b class=\"e\">Einschränkung nennen:<\/b> <span class=\"la\">Critics point out that the term was promoted by the oil industry to shift responsibility onto individuals.<\/span><\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div><b class=\"e\">Folgerung:<\/b> <span class=\"la\">Both can be true: the figure helps us see our habits, but it should not end the discussion about regulation.<\/span> Aus einem Wort sind vier verwendbare Sätze geworden.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"topic2","t":"Themenwortschatz II: Schule, Arbeit, Medien, Gesellschaft","kl":"2","k":2,"a":"W","tag":"Aufbau","goals":["den Wortschatz der vier übrigen Prüfungsthemen beherrschen","Argumente auf beiden Seiten bereithalten","über Bildung, Beruf, Medien und Gesellschaft präzise schreiben"],"ex":[{"type":"mc","q":"Welcher Begriff passt? <span class=\"la\">Many teenagers take up smoking because of <span class=\"gap\">___<\/span> rather than out of curiosity.<\/span>","h":"Alle vier Begriffe gibt es; gesucht ist der aus dem Bereich Jugend und Gruppe.","s":"<span class=\"la\">peer pressure<\/span> ist der Druck durch Gleichaltrige. Eine <span class=\"la\">pressure group<\/span> ist eine Interessenvertretung, <span class=\"la\">peer review<\/span> die Begutachtung durch Fachkollegen.","o":["peer pressure","pressure group","peer review","blood pressure"]},{"type":"txt","a":["apprenticeship"],"q":"Wie heißt die Lehre, also die betriebliche Berufsausbildung, auf Englisch?","s":"<span class=\"la\">apprenticeship<\/span>. Die auszubildende Person heißt <span class=\"la\">apprentice<\/span>."},{"type":"mc","q":"Welcher Begriff passt? <span class=\"la\">The paper was criticised for its <span class=\"gap\">___<\/span> against the smaller parties, whose events were simply not reported.<\/span>","h":"Gesucht ist das Wort für die einseitige Haltung selbst, nicht für die Berichterstattung.","s":"<span class=\"la\">bias<\/span> ist die Voreingenommenheit. <span class=\"la\">coverage<\/span> ist die Berichterstattung, <span class=\"la\">balance<\/span> deren Ausgewogenheit und <span class=\"la\">source<\/span> die Quelle.","o":["bias","balance","coverage","source"]},{"type":"txt","a":["work-life balance"],"q":"Wie heißt der Ausgleich zwischen Arbeit und Privatleben auf Englisch? Drei Wörter mit Bindestrichen.","s":"<span class=\"la\">work-life balance<\/span>. Der Ausdruck gehört zum Grundwortschatz jedes Textes über Arbeit."},{"type":"mc","q":"Was ist eine <span class=\"la\">echo chamber<\/span> im Zusammenhang mit sozialen Medien?","s":"Die <span class=\"la\">echo chamber<\/span> beschreibt, dass Algorithmen bevorzugt zeigen, was zur bisherigen Nutzung passt, wodurch die eigene Sicht verstärkt wird.","o":["ein Umfeld, in dem man nur Meinungen hört, die man ohnehin teilt","ein Raum für Videoaufnahmen","eine Gruppe mit besonders lauten Mitgliedern","ein Algorithmus zur Übersetzung"]},{"type":"txt","a":["voluntary work","volunteering"],"q":"Wie heißt das Ehrenamt, also unbezahlte freiwillige Arbeit, auf Englisch?","s":"<span class=\"la\">voluntary work<\/span> oder <span class=\"la\">volunteering<\/span>. Die Person heißt <span class=\"la\">volunteer<\/span>."},{"type":"mc","q":"Welches Wort passt in einen Text über soziale Unterschiede?","h":"Nur eine der Formen ist das gebräuchliche Wort.","s":"<span class=\"la\">inequality<\/span> ist der übliche Begriff für Ungleichheit. <span class=\"la\">inequity<\/span> gibt es zwar, es ist aber selten und bezeichnet Ungerechtigkeit im engeren Sinn.","o":["<span class=\"la\">inequality<\/span>","<span class=\"la\">inequity<\/span>","<span class=\"la\">unequality<\/span>","<span class=\"la\">nonequality<\/span>"]},{"type":"self","q":"Wähle zwei der vier Themen und schreibe zu jedem die vier Zeilen aus dem Schritt-für-Schritt-Abschnitt: Fachwörter, Behauptung, Gegenargument, eigenes Beispiel.","s":"Wenn du das für alle sieben Themen dieses Kurses machst, hast du eine Seite, mit der du jede Schreibaufgabe und jede mündliche Prüfung beginnen kannst. Das eigene Beispiel ist dabei der wertvollste Teil, weil es sich nicht aus einer Liste lernen lässt und in der Prüfung sofort auffällt."}],"gen":["vok","coll"],"html":"<h3>Schule und Bildung<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Englisch<\/th><th>Deutsch<\/th><\/tr><tr><td><span class=\"la\">compulsory subject<\/span><\/td><td>Pflichtfach<\/td><\/tr><tr><td><span class=\"la\">curriculum<\/span><\/td><td>Lehrplan<\/td><\/tr><tr><td><span class=\"la\">to revise<\/span><\/td><td>wiederholen, lernen<\/td><\/tr><tr><td><span class=\"la\">marks, grades<\/span><\/td><td>Noten<\/td><\/tr><tr><td><span class=\"la\">tuition fees<\/span><\/td><td>Studiengebühren<\/td><\/tr><tr><td><span class=\"la\">to graduate, degree<\/span><\/td><td>abschließen, akademischer Abschluss<\/td><\/tr><tr><td><span class=\"la\">attendance<\/span><\/td><td>Anwesenheit<\/td><\/tr><tr><td><span class=\"la\">peer pressure<\/span><\/td><td>Gruppendruck<\/td><\/tr><tr><td><span class=\"la\">extracurricular activities<\/span><\/td><td>außerschulische Angebote<\/td><\/tr><tr><td><span class=\"la\">lifelong learning<\/span><\/td><td>lebenslanges Lernen<\/td><\/tr><\/table><\/div>\n<div class=\"formula\">Dafür: <span class=\"la\">Marks make performance comparable and give feedback.<\/span><\/div>\n<div class=\"formula\">Dagegen: <span class=\"la\">They measure a narrow range of abilities and create pressure.<\/span><\/div>\n<h3>Arbeit und Beruf<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Englisch<\/th><th>Deutsch<\/th><\/tr><tr><td><span class=\"la\">apprenticeship<\/span><\/td><td>Lehre<\/td><\/tr><tr><td><span class=\"la\">to apply for, application<\/span><\/td><td>sich bewerben um, Bewerbung<\/td><\/tr><tr><td><span class=\"la\">job interview<\/span><\/td><td>Vorstellungsgespräch<\/td><\/tr><tr><td><span class=\"la\">salary, wage<\/span><\/td><td>Gehalt, Lohn<\/td><\/tr><tr><td><span class=\"la\">work-life balance<\/span><\/td><td>Ausgleich von Arbeit und Leben<\/td><\/tr><tr><td><span class=\"la\">remote work<\/span><\/td><td>Arbeit von zu Hause<\/td><\/tr><tr><td><span class=\"la\">promotion<\/span><\/td><td>Beförderung<\/td><\/tr><tr><td><span class=\"la\">unemployment<\/span><\/td><td>Arbeitslosigkeit<\/td><\/tr><tr><td><span class=\"la\">skills, qualifications<\/span><\/td><td>Fähigkeiten, Qualifikationen<\/td><\/tr><tr><td><span class=\"la\">gap year<\/span><\/td><td>Jahr zwischen Schule und Studium<\/td><\/tr><\/table><\/div>\n<div class=\"formula\">Dafür: <span class=\"la\">A gap year brings experience and clarity.<\/span><\/div>\n<div class=\"formula\">Dagegen: <span class=\"la\">It costs time and makes it harder to get back into studying.<\/span><\/div>\n<h3>Medien und Digitales<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Englisch<\/th><th>Deutsch<\/th><\/tr><tr><td><span class=\"la\">coverage<\/span><\/td><td>Berichterstattung<\/td><\/tr><tr><td><span class=\"la\">source, reliable source<\/span><\/td><td>Quelle, verlässliche Quelle<\/td><\/tr><tr><td><span class=\"la\">bias<\/span><\/td><td>Voreingenommenheit<\/td><\/tr><tr><td><span class=\"la\">to fact-check<\/span><\/td><td>auf Richtigkeit prüfen<\/td><\/tr><tr><td><span class=\"la\">misleading<\/span><\/td><td>irreführend<\/td><\/tr><tr><td><span class=\"la\">privacy settings<\/span><\/td><td>Privatsphäre-Einstellungen<\/td><\/tr><tr><td><span class=\"la\">screen time<\/span><\/td><td>Bildschirmzeit<\/td><\/tr><tr><td><span class=\"la\">algorithm, echo chamber<\/span><\/td><td>Algorithmus, Echokammer<\/td><\/tr><tr><td><span class=\"la\">subscription<\/span><\/td><td>Abonnement<\/td><\/tr><tr><td><span class=\"la\">to go viral<\/span><\/td><td>sich rasch verbreiten<\/td><\/tr><\/table><\/div>\n<div class=\"formula\">Dafür: <span class=\"la\">Social media keeps friendships alive across distances.<\/span><\/div>\n<div class=\"formula\">Dagegen: <span class=\"la\">It is built to hold attention, not to inform.<\/span><\/div>\n<h3>Gesellschaft<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Englisch<\/th><th>Deutsch<\/th><\/tr><tr><td><span class=\"la\">equality, inequality<\/span><\/td><td>Gleichheit, Ungleichheit<\/td><\/tr><tr><td><span class=\"la\">poverty<\/span><\/td><td>Armut<\/td><\/tr><tr><td><span class=\"la\">diversity<\/span><\/td><td>Vielfalt<\/td><\/tr><tr><td><span class=\"la\">prejudice<\/span><\/td><td>Vorurteil<\/td><\/tr><tr><td><span class=\"la\">volunteer, voluntary work<\/span><\/td><td>Freiwilliger, Ehrenamt<\/td><\/tr><tr><td><span class=\"la\">welfare<\/span><\/td><td>Sozialleistungen<\/td><\/tr><tr><td><span class=\"la\">minority<\/span><\/td><td>Minderheit<\/td><\/tr><tr><td><span class=\"la\">generation gap<\/span><\/td><td>Generationenkluft<\/td><\/tr><tr><td><span class=\"la\">to integrate<\/span><\/td><td>eingliedern<\/td><\/tr><tr><td><span class=\"la\">civil rights<\/span><\/td><td>Bürgerrechte<\/td><\/tr><\/table><\/div>\n<div class=\"note t\"><b class=\"lab\">Tipp<\/b>Für die Prüfung genügt pro Thema ein Dutzend Wörter, wenn du sie wirklich verwenden kannst. Zwei Dutzend, die du nur wiedererkennst, nützen weniger.<\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Ein Thema vorbereiten<\/h4><div class=\"task\">Bereite das Thema „Noten“ in vier Zeilen vor.<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div><b class=\"e\">Fachwörter:<\/b> <span class=\"la\">marks, assessment, performance, pressure, feedback<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div><b class=\"e\">Behauptung:<\/b> <span class=\"la\">Marks are a rough instrument, but they are the only comparable one we have.<\/span><\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div><b class=\"e\">Gegenargument:<\/b> <span class=\"la\">Critics say they measure memory rather than understanding.<\/span><\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div><b class=\"e\">Eigenes Beispiel:<\/b> <span class=\"la\">In my own experience, the subjects I learnt most in were the ones where feedback came in words rather than numbers.<\/span> Mehr brauchst du pro Thema nicht.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"idioms","t":"Redewendungen und feste Wendungen","kl":"2","k":2,"a":"W","tag":"Fortgeschritten","goals":["die gebräuchlichsten Redewendungen verstehen und sparsam einsetzen","feste Wendungen für Schreiben und Sprechen bereithalten","erkennen, wo eine Redewendung passt und wo sie stört"],"ex":[{"type":"mc","q":"Welche Wendung passt? <span class=\"la\">We have only heard one side of the story so far, so let us not <span class=\"gap\">___<\/span>.<\/span>","h":"Alle vier Wendungen gibt es; gesucht ist die für das zu schnelle Urteilen.","s":"<span class=\"la\">jump to conclusions<\/span> heißt voreilige Schlüsse ziehen. <span class=\"la\">beat about the bush<\/span> heißt um den heißen Brei reden, <span class=\"la\">split hairs<\/span> Haarspalterei betreiben, <span class=\"la\">draw the line<\/span> eine Grenze ziehen.","o":["jump to conclusions","beat about the bush","split hairs","draw the line"]},{"type":"txt","a":["to have a point","have a point"],"q":"Wie sagst du auf Englisch, dass jemand in einem Punkt recht hat? Nenne die Wendung.","s":"<span class=\"la\">to have a point<\/span>. In der Diskussion: <span class=\"la\">You have a point, but …<\/span> Damit erkennst du das Gegenüber an und leitest zugleich den Einwand ein."},{"type":"mc","q":"Welche Wendung passt? <span class=\"la\">Do not apologise for being nervous before the exam. We are all <span class=\"gap\">___<\/span> today.<\/span>","h":"Zwei der Wendungen klingen ähnlich, bedeuten aber Verschiedenes.","s":"<span class=\"la\">in the same boat<\/span> heißt in derselben Lage. <span class=\"la\">on the same page<\/span> heißt einer Meinung sein, <span class=\"la\">in the dark<\/span> nicht eingeweiht, <span class=\"la\">out of the question<\/span> ausgeschlossen.","o":["in the same boat","on the same page","in the dark","out of the question"]},{"type":"mc","q":"Welche Wendung passt in einen Essay am besten?","h":"Register prüfen.","s":"<span class=\"la\">It goes without saying that<\/span> gehört zum schriftlichen Register. Die übrigen drei sind gesprochene Umgangssprache.","o":["<span class=\"la\">It goes without saying that access to education matters.<\/span>","<span class=\"la\">At the end of the day, education is cool.<\/span>","<span class=\"la\">Education rocks, to be honest.<\/span>","<span class=\"la\">Education is the bomb.<\/span>"]},{"type":"txt","a":["none of my business"],"q":"Wie heißt „das ist nicht mein Bier“ auf Englisch? Vier Wörter nach <span class=\"la\">it is<\/span>.","s":"<span class=\"la\">It is none of my business.<\/span> Die wörtliche Übersetzung mit <span class=\"la\">beer<\/span> ergibt im Englischen keinen Sinn."},{"type":"mc","q":"Welche Wendung passt? <span class=\"la\">Since she moved to Graz we only see each other <span class=\"gap\">___<\/span>.<\/span>","h":"Gesucht ist eine Angabe der Häufigkeit.","s":"<span class=\"la\">once in a blue moon<\/span> heißt äußerst selten. <span class=\"la\">at short notice<\/span> heißt kurzfristig, <span class=\"la\">in no time<\/span> im Nu, <span class=\"la\">on the spot<\/span> auf der Stelle.","o":["once in a blue moon","at short notice","in no time","on the spot"]},{"type":"mc","q":"Wie viele Redewendungen gehören in einen Aufsatz von 300 Wörtern?","h":"Wirkung entsteht durch Sparsamkeit.","s":"Eine treffende Wendung hebt den Text, fünf wirken wie eine Sammlung. Ganz zu verzichten ist allerdings auch nicht nötig, weil feste Wendungen zum natürlichen Englisch gehören.","o":["eine, höchstens zwei, und zwar passende","so viele wie möglich","mindestens fünf","keine, sie sind immer falsch"]},{"type":"self","q":"Wähle fünf Wendungen aus diesem Kapitel, die dir gefallen, und schreibe zu jeder einen Satz aus deinem eigenen Leben.","s":"Wendungen bleiben nur haften, wenn sie an einer eigenen Erinnerung hängen. Prüfe bei jedem Satz, ob die Wendung wirklich passt oder ob du sie nur untergebracht hast; genau dieser Unterschied entscheidet später in der Prüfung."}],"gen":["phr","coll"],"html":"<h3>Wozu Redewendungen gut sind<\/h3>\n<p>Eine passende Wendung an der richtigen Stelle hebt einen Text deutlich. Drei oder vier davon in einem Aufsatz wirken dagegen wie Zierrat. Die Regel lautet: <b class=\"e\">eine pro Text, und zwar die, die wirklich passt<\/b>.<\/p>\n<h3>Wendungen für Argumentation und Gespräch<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Wendung<\/th><th>Bedeutung<\/th><\/tr><tr><td><span class=\"la\">to be on the safe side<\/span><\/td><td>sicherheitshalber<\/td><\/tr><tr><td><span class=\"la\">to make a long story short<\/span><\/td><td>kurz gesagt<\/td><\/tr><tr><td><span class=\"la\">it is a matter of<\/span><\/td><td>es ist eine Frage von<\/td><\/tr><tr><td><span class=\"la\">to have a point<\/span><\/td><td>recht haben in einem Punkt<\/td><\/tr><tr><td><span class=\"la\">to be beside the point<\/span><\/td><td>am Thema vorbei<\/td><\/tr><tr><td><span class=\"la\">to jump to conclusions<\/span><\/td><td>voreilige Schlüsse ziehen<\/td><\/tr><tr><td><span class=\"la\">to take something for granted<\/span><\/td><td>als selbstverständlich hinnehmen<\/td><\/tr><tr><td><span class=\"la\">to keep an open mind<\/span><\/td><td>unvoreingenommen bleiben<\/td><\/tr><tr><td><span class=\"la\">the bottom line is<\/span><\/td><td>unter dem Strich<\/td><\/tr><tr><td><span class=\"la\">easier said than done<\/span><\/td><td>leichter gesagt als getan<\/td><\/tr><\/table><\/div>\n<h3>Wendungen mit Körperteilen und Alltagsbildern<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Wendung<\/th><th>Bedeutung<\/th><\/tr><tr><td><span class=\"la\">to keep an eye on<\/span><\/td><td>im Auge behalten<\/td><\/tr><tr><td><span class=\"la\">to give somebody a hand<\/span><\/td><td>jemandem helfen<\/td><\/tr><tr><td><span class=\"la\">to get cold feet<\/span><\/td><td>kalte Füße bekommen, zurückschrecken<\/td><\/tr><tr><td><span class=\"la\">to be in the same boat<\/span><\/td><td>in derselben Lage sein<\/td><\/tr><tr><td><span class=\"la\">to break the ice<\/span><\/td><td>das Eis brechen<\/td><\/tr><tr><td><span class=\"la\">to cost an arm and a leg<\/span><\/td><td>sehr teuer sein<\/td><\/tr><tr><td><span class=\"la\">once in a blue moon<\/span><\/td><td>sehr selten<\/td><\/tr><tr><td><span class=\"la\">to be under the weather<\/span><\/td><td>sich nicht wohlfühlen<\/td><\/tr><\/table><\/div>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>Falsch übersetzte Redewendungen sind auffälliger als einfache Sprache. <span class=\"la\">It is not my beer<\/span> existiert im Englischen nicht; gemeint ist <span class=\"la\">It is none of my business<\/span>. Wenn du eine Wendung nicht sicher kennst, sag es einfach.<\/div>\n<h3>Wendungen, die in Prüfungstexte gehören<\/h3>\n<div class=\"formula\"><span class=\"la\">It is worth mentioning that … · There is no doubt that … · It goes without saying that … · This raises the question whether … · As far as I am concerned, … · All things considered, …<\/span><\/div>\n<div class=\"note t\"><b class=\"lab\">Tipp<\/b>Die letzten sechs sind nützlicher als alle Bilder zusammen, weil sie in jeder Textsorte funktionieren und das Register heben, ohne aufzufallen.<\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Eine Wendung richtig einsetzen<\/h4><div class=\"task\">Du willst sagen, dass dein Gegenüber in einem Punkt recht hat, du aber trotzdem widersprichst.<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div><b class=\"e\">Wendung wählen:<\/b> <span class=\"la\">You have a point<\/span> erkennt an, ohne zuzustimmen.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div><b class=\"e\">Einschränkung anschließen:<\/b> <span class=\"la\">You have a point about the costs.<\/span><\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div><b class=\"e\">Eigene Position:<\/b> <span class=\"la\">However, that is beside the point if the building is unsafe.<\/span><\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Zwei Wendungen in zwei Sätzen genügen völlig. Eine dritte im selben Absatz würde den Text überladen.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"spelling","t":"Rechtschreibung, Zeichensetzung und BE gegen AE","kl":"4","k":4,"a":"U","tag":"Aufbau","goals":["die häufigsten Rechtschreibfallen vermeiden","die englische Zeichensetzung von der deutschen unterscheiden","britisches und amerikanisches Englisch konsequent trennen","den Apostroph richtig setzen"],"ex":[{"type":"txt","a":["receive"],"q":"Schreibe das Wort richtig: <span class=\"la\">recieve<\/span>.","s":"<span class=\"la\">receive<\/span>. Nach c steht ei, in den meisten übrigen Fällen ie: <span class=\"la\">believe, achieve, relief<\/span>."},{"type":"txt","a":["separate"],"q":"Schreibe das Wort richtig: <span class=\"la\">seperate<\/span>.","s":"<span class=\"la\">separate<\/span>. Merkhilfe: In der Mitte steckt <span class=\"la\">par<\/span> wie in <span class=\"la\">parade<\/span>."},{"type":"mc","q":"Welcher Satz ist richtig?","h":"Probe mit <span class=\"la\">it is<\/span>.","s":"<span class=\"la\">It's<\/span> ist die Kurzform von <span class=\"la\">it is<\/span>, <span class=\"la\">its<\/span> bezeichnet den Besitz. Im richtigen Satz kommen beide Formen je einmal korrekt vor.","o":["<span class=\"la\">It's a pity that the school lost its funding.<\/span>","<span class=\"la\">Its a pity that the school lost it's funding.<\/span>","<span class=\"la\">It's a pity that the school lost it's funding.<\/span>","<span class=\"la\">Its a pity that the school lost its funding.<\/span>"]},{"type":"mc","q":"Welche Schreibung ist durchgehend britisch?","h":"Entscheidend ist die Einheitlichkeit.","s":"Die erste Reihe ist durchgehend britisch, die zweite durchgehend amerikanisch. Beide sind richtig; die gemischten Reihen sind es nicht.","o":["<span class=\"la\">colour, centre, organise, travelled<\/span>","<span class=\"la\">color, center, organize, traveled<\/span>","<span class=\"la\">colour, center, organise, traveled<\/span>","<span class=\"la\">color, centre, organize, travelled<\/span>"]},{"type":"txt","a":["the students' books","the students books"],"q":"Setze den Apostroph richtig: die Bücher mehrerer Schüler.","s":"<span class=\"la\">the students' books<\/span>. Beim Plural auf s steht der Apostroph hinter dem s. Bei unregelmäßigem Plural dagegen: <span class=\"la\">the children's books<\/span>."},{"type":"mc","q":"In welchem Satz steht ein überflüssiges Komma?","h":"Eine deutsche Regel wurde übertragen.","s":"Vor <span class=\"la\">that<\/span> steht im Englischen kein Komma. In den übrigen drei Sätzen ist das Komma richtig, weil jeweils ein Nebensatz vorangestellt ist.","o":["<span class=\"la\">I think, that we should wait.<\/span>","<span class=\"la\">Although it was late, we kept going.<\/span>","<span class=\"la\">When the bell rang, everybody stood up.<\/span>","<span class=\"la\">If you ask me, this is a mistake.<\/span>"]},{"type":"mc","q":"Welche Form ist richtig?","h":"Der Apostroph zeigt Besitz oder eine Kurzform an, nie den Plural.","s":"Der Plural steht ohne Apostroph. Der sogenannte Apostroph im Plural gilt im Englischen als ebenso falsch wie im Deutschen.","o":["<span class=\"la\">two cars<\/span>","<span class=\"la\">two car's<\/span>","<span class=\"la\">two cars'<\/span>","<span class=\"la\">two car´s<\/span>"]},{"type":"self","q":"Nimm einen eigenen Text und prüfe ihn nur auf drei Dinge: Apostrophe, Kommas vor <span class=\"la\">that<\/span>, Einheitlichkeit von britischer und amerikanischer Schreibung. Zähle die Treffer.","s":"Diese drei Prüfungen dauern zusammen zwei Minuten und betreffen Fehler, die in jeder Arbeit vorkommen. Wenn du mehr als zwei Treffer hast, gehört der betreffende Punkt in deine persönliche Fehlerliste."}],"gen":["wf","ff"],"html":"<h3>Rechtschreibfallen<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>oft falsch<\/th><th>richtig<\/th><th>Merkhilfe<\/th><\/tr><tr><td><span class=\"la\">recieve<\/span><\/td><td><span class=\"la\">receive<\/span><\/td><td>nach c steht ei<\/td><\/tr><tr><td><span class=\"la\">seperate<\/span><\/td><td><span class=\"la\">separate<\/span><\/td><td>es gibt ein <span class=\"la\">par<\/span> darin<\/td><\/tr><tr><td><span class=\"la\">definitly<\/span><\/td><td><span class=\"la\">definitely<\/span><\/td><td>von <span class=\"la\">finite<\/span><\/td><\/tr><tr><td><span class=\"la\">accomodation<\/span><\/td><td><span class=\"la\">accommodation<\/span><\/td><td>zweimal m<\/td><\/tr><tr><td><span class=\"la\">neccessary<\/span><\/td><td><span class=\"la\">necessary<\/span><\/td><td>ein c, zwei s<\/td><\/tr><tr><td><span class=\"la\">occured<\/span><\/td><td><span class=\"la\">occurred<\/span><\/td><td>zwei r<\/td><\/tr><tr><td><span class=\"la\">wich<\/span><\/td><td><span class=\"la\">which<\/span><\/td><td><\/td><\/tr><tr><td><span class=\"la\">beginn<\/span><\/td><td><span class=\"la\">begin<\/span><\/td><td><\/td><\/tr><tr><td><span class=\"la\">wether<\/span><\/td><td><span class=\"la\">whether<\/span><\/td><td><\/td><\/tr><tr><td><span class=\"la\">their / there / they're<\/span><\/td><td>je nach Bedeutung<\/td><td>Besitz, Ort, Kurzform<\/td><\/tr><tr><td><span class=\"la\">its / it's<\/span><\/td><td>Besitz ohne Apostroph<\/td><td><span class=\"la\">it's<\/span> heißt nur <span class=\"la\">it is<\/span><\/td><\/tr><\/table><\/div>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b><span class=\"la\">its<\/span> und <span class=\"la\">it's<\/span> ist der häufigste Apostrophfehler des Englischen. <span class=\"la\">It's<\/span> ist immer die Kurzform von <span class=\"la\">it is<\/span> oder <span class=\"la\">it has<\/span>. Besitz schreibt sich <span class=\"la\">its<\/span>, ohne Apostroph, genau wie <span class=\"la\">his<\/span> und <span class=\"la\">hers<\/span>.<\/div>\n<h3>Der Apostroph<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Fall<\/th><th>Beispiel<\/th><\/tr><tr><td>Besitz Singular<\/td><td><span class=\"la\">the student's book<\/span><\/td><\/tr><tr><td>Besitz Plural auf s<\/td><td><span class=\"la\">the students' books<\/span><\/td><\/tr><tr><td>unregelmäßiger Plural<\/td><td><span class=\"la\">the children's books<\/span><\/td><\/tr><tr><td>Kurzform<\/td><td><span class=\"la\">don't, it's, she's<\/span><\/td><\/tr><tr><td><b class=\"e\">kein<\/b> Apostroph<\/td><td>Plural: <span class=\"la\">two cars<\/span>, nicht <span class=\"la\">two car's<\/span><\/td><\/tr><\/table><\/div>\n<h3>Zeichensetzung: die vier Unterschiede zum Deutschen<\/h3>\n<ul><li>^Kein Komma vor <span class=\"la\">that<\/span>:_ <span class=\"la\">I think that she is right.<\/span><\/li><li>^Kein Komma vor Infinitivgruppen:_ <span class=\"la\">She left early to catch the train.<\/span><\/li><li>^Komma nach vorangestelltem Nebensatz:_ <span class=\"la\">Although it was late, we kept going.<\/span> Steht er hinten, entfällt es meist.<\/li><li>^Anführungszeichen:<span class=\"la\"> <\/span>„…“<span class=\"la\"> im Deutschen, <\/span>\"…\"<span class=\"la\"> oder <\/span>'…'_ im Englischen; der Punkt steht im amerikanischen Englisch innerhalb der Anführungszeichen.<\/li><\/ul>\n<h3>Britisch oder amerikanisch<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>britisch<\/th><th>amerikanisch<\/th><\/tr><tr><td><span class=\"la\">colour, favourite, behaviour<\/span><\/td><td><span class=\"la\">color, favorite, behavior<\/span><\/td><\/tr><tr><td><span class=\"la\">centre, theatre<\/span><\/td><td><span class=\"la\">center, theater<\/span><\/td><\/tr><tr><td><span class=\"la\">realise, organise<\/span><\/td><td><span class=\"la\">realize, organize<\/span><\/td><\/tr><tr><td><span class=\"la\">travelled, cancelled<\/span><\/td><td><span class=\"la\">traveled, canceled<\/span><\/td><\/tr><tr><td><span class=\"la\">programme<\/span> (außer Computer)<\/td><td><span class=\"la\">program<\/span><\/td><\/tr><tr><td><span class=\"la\">autumn, holiday, flat, lift<\/span><\/td><td><span class=\"la\">fall, vacation, apartment, elevator<\/span><\/td><\/tr><\/table><\/div>\n<div class=\"note\"><b class=\"lab\">Merke<\/b>Beide Varianten sind richtig. Falsch ist nur das Mischen. Entscheide dich am Anfang der Arbeit für eine und bleib dabei; am leichtesten fällt das mit der Variante, die im Unterricht verwendet wird.<\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Einen Apostroph prüfen<\/h4><div class=\"task\">Prüfe: <span class=\"la\">Its a long way to the station, and the school lost it's funding.<\/span><\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div><b class=\"e\">Erste Stelle:<\/b> Gemeint ist <span class=\"la\">it is<\/span>. Kurzformen bekommen einen Apostroph: <span class=\"la\">It's a long way.<\/span><\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div><b class=\"e\">Zweite Stelle:<\/b> Gemeint ist der Besitz der Schule, also keine Kurzform: <span class=\"la\">its funding<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Die Probe funktioniert immer: Setze <span class=\"la\">it is<\/span> ein. Ergibt der Satz Sinn, schreibt man <span class=\"la\">it's<\/span>; ergibt er keinen, schreibt man <span class=\"la\">its<\/span>.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Ergebnis: <span class=\"la\">It's a long way to the station, and the school lost its funding.<\/span><\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"satzbau","t":"Satzbau variieren","kl":"4","k":4,"a":"U","tag":"Fortgeschritten","goals":["einfache, zusammengesetzte und komplexe Sätze bewusst mischen","Satzanfänge variieren","Nominalstil vermeiden","Sätze gezielt kürzen oder verbinden"],"ex":[{"type":"mc","q":"Welcher Satz ist am besten formuliert?","h":"Das Englische bevorzugt Verben.","s":"Die erste Fassung ist am direktesten. Die übrigen verwandeln die Handlung in ein Substantiv und brauchen dafür zusätzliche Hilfsverben.","o":["<span class=\"la\">They discussed the costs for an hour.<\/span>","<span class=\"la\">There was a discussion about the costs for an hour.<\/span>","<span class=\"la\">The discussion of the costs took place for an hour.<\/span>","<span class=\"la\">A discussion concerning the costs was had for an hour.<\/span>"]},{"type":"txt","a":["because"],"q":"Ersetze <span class=\"la\">due to the fact that<\/span> durch ein einzelnes Wort.","s":"<span class=\"la\">because<\/span>. Die lange Wendung sagt nichts Zusätzliches und kostet vier Wörter."},{"type":"mc","q":"Welche Satzanfänge zeigen Abwechslung?","s":"Die erste Reihe mischt Nebensatz, Adverbiale, Partizip und Subjekt. Für das Kriterium Spektrum ist genau diese Mischung gemeint.","o":["<span class=\"la\">Although … / In most cases … / Having read … / The school …<\/span>","<span class=\"la\">The school … / The school … / The students … / The teachers …<\/span>","<span class=\"la\">I think … / I think … / I believe … / I think …<\/span>","<span class=\"la\">And … / And … / But … / And …<\/span>"]},{"type":"txt","a":["the approved plan"],"q":"Verkürze: <span class=\"la\">the plan which was approved<\/span> → <span class=\"gap\">___<\/span>. Drei Wörter.","s":"<span class=\"la\">the approved plan<\/span>. Das Past Participle ersetzt den ganzen Relativsatz."},{"type":"mc","q":"Wann ist ein sehr kurzer Satz besonders wirksam?","h":"Wirkung entsteht durch Kontrast.","s":"Der kurze Satz fällt auf, weil er sich von seiner Umgebung abhebt. Wer nur kurze Sätze schreibt, verliert diesen Effekt sofort.","o":["nach mehreren langen Sätzen, als Betonung","am Anfang jedes Absatzes","nur in Dialogen","nie, kurze Sätze wirken einfach"]},{"type":"mc","q":"Welche Fassung vermeidet den Nominalstil?","s":"Die erste Fassung benützt zwei Verben und ist um die Hälfte kürzer als die übrigen, ohne etwas wegzulassen.","o":["<span class=\"la\">The committee decided to postpone the opening.<\/span>","<span class=\"la\">The decision of the committee was the postponement of the opening.<\/span>","<span class=\"la\">A postponement of the opening was the committee's decision.<\/span>","<span class=\"la\">The committee's decision concerned the opening's postponement.<\/span>"]},{"type":"txt","a":["Having read"],"q":"Beginne den Satz mit einem Partizip: <span class=\"la\">After I had read the report, I changed my mind.<\/span> → <span class=\"gap\">___<\/span> the report, I changed my mind._ Zwei Wörter.","s":"<span class=\"la\">Having read<\/span>. Die Perfektform zeigt an, dass das Lesen vor dem Meinungswechsel lag."},{"type":"self","q":"Nimm einen eigenen Text von 200 Wörtern und schreibe nur die ersten drei Wörter jedes Satzes untereinander. Ändere dann drei Satzanfänge.","s":"Diese Übung deckt in dreißig Sekunden auf, was beim Lesen kaum auffällt. Erfahrungsgemäß beginnen in ungeübten Texten mehr als die Hälfte der Sätze mit dem Subjekt oder mit <span class=\"la\">I<\/span>. Drei geänderte Anfänge genügen, um den Eindruck deutlich zu verbessern."}],"gen":["wf","coll"],"html":"<h3>Drei Satztypen<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Typ<\/th><th>Aufbau<\/th><th>Beispiel<\/th><\/tr><tr><td>einfach<\/td><td>ein Hauptsatz<\/td><td><span class=\"la\">The library closed in March.<\/span><\/td><\/tr><tr><td>zusammengesetzt<\/td><td>zwei Hauptsätze<\/td><td><span class=\"la\">The library closed in March, and nobody protested.<\/span><\/td><\/tr><tr><td>komplex<\/td><td>Haupt- und Nebensatz<\/td><td><span class=\"la\">When the library closed in March, nobody protested.<\/span><\/td><\/tr><\/table><\/div>\n<p>Ein guter Text mischt alle drei. Wer nur komplexe Sätze schreibt, wirkt schwerfällig; wer nur einfache schreibt, wirkt abgehackt. Der kurze Satz nach drei langen ist das wirksamste Betonungsmittel, das die Sprache kennt.<\/p>\n<h3>Satzanfänge variieren<\/h3>\n<p>Nicht jeder Satz muss mit dem Subjekt beginnen:<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Anfang<\/th><th>Beispiel<\/th><\/tr><tr><td>Adverbiale<\/td><td><span class=\"la\">In most schools, the day starts at eight.<\/span><\/td><\/tr><tr><td>Partizip<\/td><td><span class=\"la\">Having read the report, I changed my mind.<\/span><\/td><\/tr><tr><td>Nebensatz<\/td><td><span class=\"la\">Although the plan sounds simple, it is not.<\/span><\/td><\/tr><tr><td>Infinitiv<\/td><td><span class=\"la\">To understand the problem, you need the figures.<\/span><\/td><\/tr><tr><td>Präpositionalausdruck<\/td><td><span class=\"la\">Despite the cost, the project went ahead.<\/span><\/td><\/tr><\/table><\/div>\n<div class=\"note t\"><b class=\"lab\">Tipp<\/b>Prüfe einen eigenen Text, indem du nur die ersten drei Wörter jedes Satzes untereinander schreibst. Wenn dort fünfmal <span class=\"la\">I think<\/span> oder <span class=\"la\">The school<\/span> steht, weißt du sofort, woran du arbeiten musst.<\/div>\n<h3>Nominalstil vermeiden<\/h3>\n<p>Das Englische bevorzugt Verben, wo das Deutsche gern Substantive nimmt:<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>schwerfällig<\/th><th>besser<\/th><\/tr><tr><td><span class=\"la\">The implementation of the plan took place in May.<\/span><\/td><td><span class=\"la\">The plan was implemented in May.<\/span><\/td><\/tr><tr><td><span class=\"la\">There was a discussion about the costs.<\/span><\/td><td><span class=\"la\">They discussed the costs.<\/span><\/td><\/tr><tr><td><span class=\"la\">We came to the conclusion that …<\/span><\/td><td><span class=\"la\">We concluded that …<\/span><\/td><\/tr><\/table><\/div>\n<h3>Verbinden und kürzen<\/h3>\n<div class=\"formula\">Zwei Sätze verbinden: <span class=\"la\">The town has one library. It closes at four.<\/span> → <span class=\"la\">The town's only library closes at four.<\/span><\/div>\n<div class=\"formula\">Relativsatz verkürzen: <span class=\"la\">the plan which was approved<\/span> → <span class=\"la\">the approved plan<\/span><\/div>\n<div class=\"formula\">Überflüssiges streichen: <span class=\"la\">due to the fact that<\/span> → <span class=\"la\">because<\/span><\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Einen Absatz rhythmisch gestalten<\/h4><div class=\"task\">Drei gleich lange Sätze: <span class=\"la\">Our school introduced a phone ban in September. Many students were against it at first. The atmosphere in the breaks has changed since then.<\/span><\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div><b class=\"e\">Ersten und zweiten verbinden, mit Nebensatz:<\/b> <span class=\"la\">When our school introduced a phone ban in September, most of us were against it.<\/span><\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div><b class=\"e\">Dritten kurz lassen, für die Betonung:<\/b> <span class=\"la\">The breaks are different now.<\/span><\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div><b class=\"e\">Einen Satz mit anderem Anfang ergänzen:<\/b> <span class=\"la\">Not better, not worse, just different.<\/span><\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Ergebnis: ein langer, ein kurzer, ein sehr kurzer Satz. Derselbe Inhalt, deutlich mehr Wirkung.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"ueberarbeiten","t":"Überarbeiten: die Checkliste","kl":"3","k":3,"a":"T","tag":"Fortgeschritten","goals":["einen fertigen Text systematisch prüfen","nach Kriterien statt nach Gefühl überarbeiten","in wenigen Minuten den größten Gewinn erzielen","eigene Texte ehrlich einschätzen"],"ex":[{"type":"mc","q":"Womit beginnt die Überarbeitung?","h":"Welches Kriterium wiegt am schwersten, wenn es verfehlt ist?","s":"Erst wird geprüft, ob die Aufgabe erfüllt ist. Wer mit der Grammatik beginnt, poliert möglicherweise Sätze, die gar nicht zur Aufgabe gehören.","o":["mit der Prüfung, ob alle Bullet Points behandelt sind","mit der Grammatik","mit der Rechtschreibung","mit der Überschrift"]},{"type":"mc","q":"Warum findet bloßes Durchlesen so wenig?","s":"Der eigene Text wird aus der Erinnerung ergänzt. Getrennte Durchgänge mit jeweils einem einzigen Prüfauftrag umgehen dieses Problem.","o":["weil man liest, was man gemeint hat, statt was dasteht","weil man zu schnell liest","weil der Text zu lang ist","weil man die Regeln nicht kennt"]},{"type":"mc","q":"Du hast nu
