ass=\"la\">phone<\/span> ohne <span class=\"la\">to<\/span> (<span class=\"la\">phone your mother<\/span>). Umgekehrt braucht <span class=\"la\">listen<\/span> immer ein <span class=\"la\">to<\/span>.<\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Eine feste Verbindung erschließen<\/h4><div class=\"task\">Welche Präposition fehlt? <span class=\"la\">The result depends <span class=\"gap\">___<\/span> several factors.<\/span><\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Prüfe zuerst, ob du die Verbindung kennst. Bei <span class=\"la\">depend<\/span> lautet sie <span class=\"la\">depend on<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Lass dich nicht vom Deutschen leiten: „abhängen von“ legt <span class=\"la\">from<\/span> nahe, das ist aber falsch.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Merke dir die Verbindung als Ganzes, am besten in einem Beispielsatz: <span class=\"la\">It depends on you.<\/span><\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Ergebnis: <span class=\"la\">The result depends on several factors.<\/span> Bei festen Verbindungen hilft kein Nachdenken, nur das Lernen in ganzen Wendungen.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"wortbildung","t":"Wortbildung: Vorsilben, Nachsilben, Wortfamilien","kl":"2","k":2,"a":"W","tag":"Basis","goals":["aus einem Wort die anderen Wortarten derselben Familie bilden","die wichtigsten Vor- und Nachsilben samt Bedeutung kennen","die Verneinungsvorsilben richtig zuordnen","die Aufgaben des Formats „word formation“ zügig lösen"],"ex":[{"type":"txt","a":["decision"],"q":"Bilde die passende Form: <span class=\"la\">Her <span class=\"gap\">___<\/span> (decide) surprised everyone.<\/span>","s":"Nach einem Possessivbegleiter steht ein Substantiv: <span class=\"la\">decision<\/span>."},{"type":"txt","a":["successful"],"q":"Bilde die passende Form: <span class=\"la\">The project was very <span class=\"gap\">___<\/span> (success).<\/span>","h":"Nach <span class=\"la\">was<\/span> steht meist ein Adjektiv.","s":"Nach einer Form von <span class=\"la\">be<\/span> steht das Adjektiv: <span class=\"la\">successful<\/span>. Die Wortfamilie lautet <span class=\"la\">success – successful – successfully – succeed<\/span>."},{"type":"txt","a":["carefully"],"q":"Bilde die passende Form: <span class=\"la\">He opened the box <span class=\"gap\">___<\/span> (care).<\/span>","s":"Beschrieben wird das Öffnen, also ein Verb. Dafür steht das Adverb <span class=\"la\">carefully<\/span>."},{"type":"mc","q":"Wie lautet das Gegenteil von <span class=\"la\">patient<\/span>?","h":"Vor welchem Anfangsbuchstaben steht <span class=\"la\">im-<\/span>?","s":"Vor m und p steht <span class=\"la\">im-<\/span>: <span class=\"la\">impatient, impossible, immature<\/span>. <span class=\"la\">inpatient<\/span> gibt es zwar als Wort, es bezeichnet aber eine stationäre Patientin.","o":["<span class=\"la\">impatient<\/span>","<span class=\"la\">unpatient<\/span>","<span class=\"la\">inpatient<\/span>","<span class=\"la\">dispatient<\/span>"]},{"type":"mc","q":"Wie lautet das Gegenteil von <span class=\"la\">responsible<\/span>?","s":"Vor r wird die Vorsilbe zu <span class=\"la\">ir-<\/span>: <span class=\"la\">irresponsible, irregular, irrelevant<\/span>.","o":["<span class=\"la\">irresponsible<\/span>","<span class=\"la\">unresponsible<\/span>","<span class=\"la\">disresponsible<\/span>","<span class=\"la\">inresponsible<\/span>"]},{"type":"txt","a":["strength"],"q":"Bilde das Substantiv zu <span class=\"la\">strong<\/span>.","h":"Der Stamm ändert sich.","s":"<span class=\"la\">strong – strength<\/span>. Zur selben Gruppe gehören <span class=\"la\">long – length<\/span>, <span class=\"la\">wide – width<\/span> und <span class=\"la\">deep – depth<\/span>."},{"type":"txt","a":["employee"],"q":"Bilde das Substantiv, das die angestellte Person bezeichnet: <span class=\"la\">employ<\/span> → <span class=\"gap\">___<\/span>.","h":"Zwei Personenbezeichnungen sind möglich; gesucht ist die, der etwas geschieht.","s":"<span class=\"la\">employee<\/span> ist die Arbeitnehmerin, <span class=\"la\">employer<\/span> die Arbeitgeberin. Die Endung <span class=\"la\">-ee<\/span> bezeichnet die Person, an der die Handlung geschieht, wie in <span class=\"la\">trainee<\/span> und <span class=\"la\">interviewee<\/span>."},{"type":"mc","q":"Welche Reihe ist vollständig richtig?","h":"Achte auf die Substantivform.","s":"Das Verb lautet <span class=\"la\">analyse<\/span> (amerikanisch <span class=\"la\">analyze<\/span>), das Substantiv <span class=\"la\">analysis<\/span> mit dem Plural <span class=\"la\">analyses<\/span>, das Adjektiv <span class=\"la\">analytical<\/span>.","o":["<span class=\"la\">analyse – analysis – analytical<\/span>","<span class=\"la\">analyse – analyse – analytic<\/span>","<span class=\"la\">analysis – analysing – analysable<\/span>","<span class=\"la\">analyse – analysation – analysed<\/span>"]},{"type":"txt","a":["pronunciation"],"q":"Bilde das Substantiv zu <span class=\"la\">pronounce<\/span>.","h":"Achtung, die Schreibung ändert sich mehr als erwartet.","s":"<span class=\"la\">pronounce<\/span>, aber <span class=\"la\">pronunciation<\/span> ohne o in der zweiten Silbe. Diese Schreibung wird in Prüfungen gern geprüft."},{"type":"self","q":"Bilde zu diesen fünf Wörtern jeweils die vollständige Familie aus Verb, Substantiv, Adjektiv und, wo möglich, Adverb: <span class=\"la\">decide, succeed, create, inform, differ<\/span>.","s":"<span class=\"la\">decide – decision – decisive – decisively<\/span>; <span class=\"la\">succeed – success – successful – successfully<\/span>; <span class=\"la\">create – creation / creativity – creative – creatively<\/span>; <span class=\"la\">inform – information – informative – informatively<\/span>; <span class=\"la\">differ – difference – different – differently<\/span>. Wer diese fünf Familien beherrscht, löst einen großen Teil der Prüfungsaufgaben allein durch Analogie."}],"gen":["wf","ff"],"html":"<h3>Warum das ein Prüfungsthema ist<\/h3>\n<p>Im Teil <span class=\"la\">Language in Use<\/span> kommt regelmäßig eine Aufgabe vor, in der ein Wort in Klammern steht und du die passende Form bilden musst. Dafür brauchst du zweierlei: ein Gefühl dafür, welche Wortart die Lücke verlangt, und die Kenntnis der üblichen Endungen.<\/p>\n<h3>Die Wortart der Lücke bestimmen<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Davor steht<\/th><th>Gesucht ist meist<\/th><\/tr><tr><td>Artikel, Adjektiv, Possessivbegleiter<\/td><td>Substantiv: <span class=\"la\">the decision, a careful decision, his decision<\/span><\/td><\/tr><tr><td>Form von <span class=\"la\">be<\/span>, <span class=\"la\">seem<\/span>, <span class=\"la\">look<\/span><\/td><td>Adjektiv: <span class=\"la\">it was successful<\/span><\/td><\/tr><tr><td>Substantiv, mit Artikel davor<\/td><td>Adjektiv: <span class=\"la\">a successful attempt<\/span><\/td><\/tr><tr><td>Vollverb<\/td><td>Adverb: <span class=\"la\">she reacted calmly<\/span><\/td><\/tr><tr><td><span class=\"la\">to<\/span> oder Subjekt am Satzanfang<\/td><td>Verb: <span class=\"la\">to modernise, they modernised<\/span><\/td><\/tr><\/table><\/div>\n<div class=\"note t\"><b class=\"lab\">Tipp<\/b>Lies immer den ganzen Satz, bevor du etwas einsetzt. Die Lücke verrät ihre Wortart fast nie durch sich selbst, sondern durch das, was links und rechts davon steht.<\/div>\n<h3>Nachsilben für Substantive<\/h3>\n<div class=\"formula\"><span class=\"la\">-tion / -sion<\/span>: <span class=\"la\">decide – decision, inform – information<\/span><\/div>\n<div class=\"formula\"><span class=\"la\">-ment<\/span>: <span class=\"la\">develop – development, agree – agreement<\/span><\/div>\n<div class=\"formula\"><span class=\"la\">-ness<\/span>: <span class=\"la\">happy – happiness, dark – darkness<\/span><\/div>\n<div class=\"formula\"><span class=\"la\">-ity<\/span>: <span class=\"la\">able – ability, responsible – responsibility<\/span><\/div>\n<div class=\"formula\"><span class=\"la\">-ance / -ence<\/span>: <span class=\"la\">appear – appearance, differ – difference<\/span><\/div>\n<div class=\"formula\"><span class=\"la\">-ship<\/span>: <span class=\"la\">friend – friendship, member – membership<\/span><\/div>\n<div class=\"formula\"><span class=\"la\">-hood<\/span>: <span class=\"la\">child – childhood, neighbour – neighbourhood<\/span><\/div>\n<div class=\"formula\"><span class=\"la\">-dom<\/span>: <span class=\"la\">free – freedom, wise – wisdom<\/span><\/div>\n<div class=\"formula\"><span class=\"la\">-th<\/span>: <span class=\"la\">grow – growth, warm – warmth, wide – width<\/span><\/div>\n<p>Für Personen: <span class=\"la\">-er<\/span> (<span class=\"la\">teacher<\/span>), <span class=\"la\">-or<\/span> (<span class=\"la\">actor<\/span>), <span class=\"la\">-ist<\/span> (<span class=\"la\">journalist<\/span>), <span class=\"la\">-ant<\/span> (<span class=\"la\">assistant<\/span>), <span class=\"la\">-ee<\/span> (<span class=\"la\">employee<\/span>, die Person, der etwas geschieht).<\/p>\n<h3>Nachsilben für Adjektive<\/h3>\n<div class=\"formula\"><span class=\"la\">-ful<\/span> (voll von) gegen <span class=\"la\">-less<\/span> (ohne): <span class=\"la\">careful – careless, hopeful – hopeless<\/span><\/div>\n<div class=\"formula\"><span class=\"la\">-able / -ible<\/span> (machbar): <span class=\"la\">comfortable, responsible, visible<\/span><\/div>\n<div class=\"formula\"><span class=\"la\">-ive<\/span>: <span class=\"la\">create – creative, act – active<\/span><\/div>\n<div class=\"formula\"><span class=\"la\">-ous<\/span>: <span class=\"la\">danger – dangerous, fame – famous<\/span><\/div>\n<div class=\"formula\"><span class=\"la\">-al<\/span>: <span class=\"la\">nature – natural, music – musical<\/span><\/div>\n<div class=\"formula\"><span class=\"la\">-y<\/span>: <span class=\"la\">sun – sunny, noise – noisy<\/span><\/div>\n<h3>Verneinungsvorsilben<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Vorsilbe<\/th><th>Wann<\/th><th>Beispiele<\/th><\/tr><tr><td><span class=\"la\">im-<\/span><\/td><td>vor m und p<\/td><td><span class=\"la\">impossible, impatient, immature<\/span><\/td><\/tr><tr><td><span class=\"la\">il-<\/span><\/td><td>vor l<\/td><td><span class=\"la\">illegal, illogical, illiterate<\/span><\/td><\/tr><tr><td><span class=\"la\">ir-<\/span><\/td><td>vor r<\/td><td><span class=\"la\">irregular, irresponsible, irrelevant<\/span><\/td><\/tr><tr><td><span class=\"la\">in-<\/span><\/td><td>vor den meisten übrigen<\/td><td><span class=\"la\">incorrect, invisible, independent<\/span><\/td><\/tr><tr><td><span class=\"la\">un-<\/span><\/td><td>sehr häufig, auch bei Partizipien<\/td><td><span class=\"la\">unhappy, unfair, unexpected<\/span><\/td><\/tr><tr><td><span class=\"la\">dis-<\/span><\/td><td>oft bei Verben<\/td><td><span class=\"la\">disagree, dishonest, disappear<\/span><\/td><\/tr><tr><td><span class=\"la\">mis-<\/span><\/td><td>„falsch“<\/td><td><span class=\"la\">misunderstand, misinterpret<\/span><\/td><\/tr><\/table><\/div>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>Es gibt keine Regel, die zwischen <span class=\"la\">un-<\/span>, <span class=\"la\">in-<\/span> und <span class=\"la\">dis-<\/span> sicher entscheidet. Die Lautregel gilt nur für <span class=\"la\">im-<\/span>, <span class=\"la\">il-<\/span> und <span class=\"la\">ir-<\/span>. Alles andere lernst du am Wort.<\/div>\n<h3>Weitere Vorsilben<\/h3>\n<div class=\"formula\"><span class=\"la\">re-<\/span> (wieder): <span class=\"la\">rebuild, rewrite<\/span> · <span class=\"la\">over-<\/span> (zu viel): <span class=\"la\">overestimate, overcrowded<\/span> · <span class=\"la\">under-<\/span> (zu wenig): <span class=\"la\">underestimate, underpaid<\/span> · <span class=\"la\">pre-<\/span> (vorher): <span class=\"la\">preview<\/span> · <span class=\"la\">co-<\/span> (mit): <span class=\"la\">cooperate<\/span> · <span class=\"la\">ex-<\/span> (ehemals): <span class=\"la\">ex-partner<\/span><\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Eine Wortbildungsaufgabe lösen<\/h4><div class=\"task\"><span class=\"la\">Her <span class=\"gap\">___<\/span> (decide) came as a surprise to everyone.<\/span><\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Schau nach links: Davor steht <span class=\"la\">her<\/span>, ein Possessivbegleiter. Danach kann nur ein Substantiv stehen.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Suche die Substantivform von <span class=\"la\">decide<\/span>. Die übliche Endung ist <span class=\"la\">-sion<\/span> oder <span class=\"la\">-tion<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Prüfe die Schreibung: <span class=\"la\">decide<\/span> verliert das d nicht, sondern wird zu <span class=\"la\">decision<\/span>.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Ergebnis: <span class=\"la\">Her decision came as a surprise.<\/span> Die Probe: Setze das Wort allein vor ein Verb; wenn es als Subjekt funktioniert, ist es ein Substantiv.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"phrasal","t":"Phrasal Verbs","kl":"2","k":2,"a":"W","tag":"Aufbau","goals":["Phrasal Verbs verstehen und selbst verwenden","die trennbaren von den untrennbaren unterscheiden","die Stellung des Pronomens beherrschen","die hundert häufigsten in Gruppen lernen"],"ex":[{"type":"mc","q":"Was bedeutet <span class=\"la\">They called off the match<\/span>?","h":"Zwei der Antworten liegen nah beieinander; achte auf den Unterschied zwischen absagen und verschieben.","s":"<span class=\"la\">call off<\/span> heißt absagen. Verschieben wäre <span class=\"la\">put off<\/span> oder <span class=\"la\">postpone<\/span>.","o":["Sie sagten das Spiel ab.","Sie riefen beim Spiel an.","Sie verschoben das Spiel.","Sie beendeten das Spiel vorzeitig."]},{"type":"txt","a":["turn it down","turn it off"],"q":"Ersetze das Objekt durch ein Pronomen: <span class=\"la\">Please turn down the radio.<\/span> → <span class=\"la\">Please <span class=\"gap\">___<\/span>.<\/span> Setze drei Wörter ein.","h":"Bei trennbaren Verben hat das Pronomen einen festen Platz.","s":"Richtig ist <span class=\"la\">turn it down<\/span>. Das Pronomen steht zwischen Verb und Partikel, niemals dahinter."},{"type":"mc","q":"Welcher Satz ist richtig?","h":"<span class=\"la\">look after<\/span> gehört zu den untrennbaren Verbindungen.","s":"Verben mit Präposition sind untrennbar; das Objekt folgt immer nach der Partikel, auch wenn es ein Pronomen ist.","o":["<span class=\"la\">I will look after them while you are away.<\/span>","<span class=\"la\">I will look them after while you are away.<\/span>","<span class=\"la\">I will after look them while you are away.<\/span>","<span class=\"la\">I will look after while you are away them.<\/span>"]},{"type":"txt","a":["ran out of","have run out of"],"q":"Setze das passende Phrasal Verb ein: <span class=\"la\">We <span class=\"gap\">___<\/span> milk, so I will go shopping.<\/span> Gemeint ist: Die Milch ist uns ausgegangen.","s":"<span class=\"la\">run out of something<\/span> heißt, dass der Vorrat zu Ende ist. In der Vergangenheit <span class=\"la\">ran out of<\/span>, im Present Perfect <span class=\"la\">have run out of<\/span>."},{"type":"mc","q":"Welches Phrasal Verb passt in einen förmlichen Report am wenigsten?","h":"Eines der vier gehört in die Umgangssprache.","s":"<span class=\"la\">kick off<\/span> ist deutlich informell und passt besser in einen Blog als in einen Report. Die übrigen drei sind in formellen Texten gebräuchlich.","o":["<span class=\"la\">The committee kicked off the project in March.<\/span>","<span class=\"la\">The committee carried out a survey.<\/span>","<span class=\"la\">The committee set up a working group.<\/span>","<span class=\"la\">The committee looked into the complaints.<\/span>"]},{"type":"txt","a":["gave up","has given up","had given up"],"q":"Setze ein: <span class=\"la\">She <span class=\"gap\">___<\/span> smoking two years ago.<\/span>","s":"<span class=\"la\">give up<\/span> heißt aufhören mit etwas. Wegen <span class=\"la\">two years ago<\/span> steht hier das Simple Past: <span class=\"la\">gave up<\/span>."},{"type":"mc","q":"Was bedeutet <span class=\"la\">He takes after his mother<\/span>?","s":"<span class=\"la\">take after somebody<\/span> heißt, jemandem ähneln, meist innerhalb der Familie. Sich kümmern wäre <span class=\"la\">look after<\/span>.","o":["Er ähnelt seiner Mutter.","Er kümmert sich um seine Mutter.","Er folgt seiner Mutter nach.","Er übernimmt ihre Aufgaben."]},{"type":"txt","a":["put off","postponed","put it off"],"q":"Ersetze durch ein Phrasal Verb: <span class=\"la\">The meeting was postponed until Monday.<\/span> → <span class=\"la\">The meeting was <span class=\"gap\">___<\/span> until Monday.<\/span>","s":"<span class=\"la\">put off<\/span> ist die alltägliche Entsprechung von <span class=\"la\">postpone<\/span>. Beachte, dass auch die passive Form möglich ist: <span class=\"la\">was put off<\/span>."},{"type":"self","q":"Schreibe sechs Sätze über deine Woche, in denen je ein Phrasal Verb aus dieser Liste vorkommt: <span class=\"la\">get up, find out, run out of, put off, look forward to, sort out<\/span>.","s":"Ein mögliches Muster: <span class=\"la\">I got up late on Monday. I found out that the test had been moved. We ran out of printer paper at school. I put off my homework until Sunday, which was a mistake. I am looking forward to the long weekend. I still have to sort out my notes.<\/span> Achte darauf, dass du jedes Verb in einer Zeitform verwendest, die zum Satz passt."}],"gen":["phr","coll"],"html":"<h3>Was ein Phrasal Verb ist<\/h3>\n<p>Ein Verb und eine Partikel ergeben zusammen eine neue Bedeutung, die man dem Verb allein nicht ansieht: <span class=\"la\">give<\/span> heißt geben, <span class=\"la\">give up<\/span> heißt aufhören. Diese Verbindungen sind der Kern des natürlichen Englisch und lassen sich nicht umgehen, weil die förmlichen Entsprechungen oft gestelzt klingen.<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Phrasal Verb<\/th><th>förmliche Entsprechung<\/th><th>Register<\/th><\/tr><tr><td><span class=\"la\">find out<\/span><\/td><td><span class=\"la\">discover<\/span><\/td><td>alltäglich gegen formell<\/td><\/tr><tr><td><span class=\"la\">put off<\/span><\/td><td><span class=\"la\">postpone<\/span><\/td><td><\/td><\/tr><tr><td><span class=\"la\">carry out<\/span><\/td><td><span class=\"la\">conduct<\/span><\/td><td><\/td><\/tr><tr><td><span class=\"la\">set up<\/span><\/td><td><span class=\"la\">establish<\/span><\/td><td><\/td><\/tr><tr><td><span class=\"la\">look into<\/span><\/td><td><span class=\"la\">investigate<\/span><\/td><td><\/td><\/tr><tr><td><span class=\"la\">give up<\/span><\/td><td><span class=\"la\">abandon<\/span><\/td><td><\/td><\/tr><\/table><\/div>\n<div class=\"note t\"><b class=\"lab\">Tipp<\/b>Für die Textsorten gilt: In Blog comment, E-Mail an Bekannte und Erzählung sind Phrasal Verbs genau richtig. In einem förmlichen Brief oder einem Report wirkt die lateinische Entsprechung passender.<\/div>\n<h3>Trennbar oder nicht?<\/h3>\n<ul><li><b class=\"e\">Trennbar:<\/b> Das Objekt kann zwischen Verb und Partikel stehen. <span class=\"la\">Turn the radio on.<\/span> oder <span class=\"la\">Turn on the radio.<\/span><\/li><li><b class=\"e\">Pronomen müssen<\/b> dazwischenstehen: <span class=\"la\">Turn it on.<\/span> Niemals <span class=\"la\">Turn on it.<\/span><\/li><li><b class=\"e\">Untrennbar:<\/b> Bei Verben mit Präposition bleibt alles zusammen: <span class=\"la\">look after the children<\/span>, <span class=\"la\">look after them<\/span>, niemals <span class=\"la\">look them after<\/span>.<\/li><\/ul>\n<div class=\"note\"><b class=\"lab\">Merke<\/b>Die Faustregel lautet: Ist das Objekt ein Pronomen und das Verb trennbar, steht das Pronomen in der Mitte. Dieser eine Satz entscheidet die meisten Prüfungsaufgaben zu diesem Thema.<\/div>\n<h3>Gruppen, die sich zusammen lernen lassen<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Partikel<\/th><th>Grundbedeutung<\/th><th>Beispiele<\/th><\/tr><tr><td><span class=\"la\">up<\/span><\/td><td>vollständig, aufwärts<\/td><td><span class=\"la\">give up, set up, bring up, make up, turn up<\/span><\/td><\/tr><tr><td><span class=\"la\">down<\/span><\/td><td>verringern, niederschreiben<\/td><td><span class=\"la\">cut down on, turn down, write down, break down<\/span><\/td><\/tr><tr><td><span class=\"la\">out<\/span><\/td><td>heraus, zu Ende<\/td><td><span class=\"la\">find out, carry out, run out of, hand out, sort out<\/span><\/td><\/tr><tr><td><span class=\"la\">on<\/span><\/td><td>weiter<\/td><td><span class=\"la\">carry on, go on, get on with<\/span><\/td><\/tr><tr><td><span class=\"la\">off<\/span><\/td><td>weg, abgetrennt<\/td><td><span class=\"la\">take off, call off, put off, set off<\/span><\/td><\/tr><tr><td><span class=\"la\">in<\/span><\/td><td>hinein, eintragen<\/td><td><span class=\"la\">fill in, give in, check in<\/span><\/td><\/tr><tr><td><span class=\"la\">after / into / over<\/span><\/td><td>Richtung<\/td><td><span class=\"la\">look after, look into, go over, take after<\/span><\/td><\/tr><\/table><\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Die Stellung des Objekts<\/h4><div class=\"task\">Ersetze das Objekt durch ein Pronomen: <span class=\"la\">Could you turn down the music?<\/span><\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Prüfe, ob das Verb trennbar ist. <span class=\"la\">turn down<\/span> ist trennbar, man kann sagen <span class=\"la\">turn the music down<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Ersetze <span class=\"la\">the music<\/span> durch <span class=\"la\">it<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Bei trennbaren Verben muss das Pronomen zwischen Verb und Partikel stehen.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Ergebnis: <span class=\"la\">Could you turn it down?<\/span> Die Fassung <span class=\"la\">turn down it<\/span> ist falsch, auch wenn sie der Wortstellung des Ausgangssatzes folgt.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"collocations","t":"Kollokationen und feste Wendungen","kl":"2","k":2,"a":"W","tag":"Aufbau","goals":["die häufigsten Verb-Substantiv-Verbindungen kennen","_make_, _do_, _take_, _have_ und _get_ richtig verteilen","Verstärkungen passend wählen","Wortschatz künftig in Wendungen statt in Einzelwörtern lernen"],"ex":[{"type":"txt","a":["do"],"q":"Setze ein: <span class=\"la\">I have to <span class=\"gap\">___<\/span> my homework before dinner.<\/span>","s":"<span class=\"la\">do homework<\/span>. Mit <span class=\"la\">make<\/span> ist es immer falsch, obwohl das Deutsche „Hausaufgaben machen“ sagt."},{"type":"txt","a":["take"],"q":"Setze ein: <span class=\"la\">Could you <span class=\"gap\">___<\/span> a photo of us?<\/span>","s":"<span class=\"la\">take a photo<\/span>. Im Deutschen macht man ein Foto, im Englischen nimmt man es."},{"type":"mc","q":"Welcher Satz ist richtig?","s":"<span class=\"la\">do sport<\/span> ist die feste Verbindung. <span class=\"la\">make sport<\/span> ist eine direkte Übertragung aus dem Deutschen und sofort als Fehler erkennbar.","o":["<span class=\"la\">My brother does a lot of sport.<\/span>","<span class=\"la\">My brother makes a lot of sport.<\/span>","<span class=\"la\">My brother takes a lot of sport.<\/span>","<span class=\"la\">My brother has a lot of sport.<\/span>"]},{"type":"txt","a":["made"],"q":"Setze ein, Vergangenheit: <span class=\"la\">We <span class= class=\"plain\"><tr><th>have<\/th><th>get<\/th><\/tr><tr><td><span class=\"la\">breakfast, a shower, a party, fun, a look, an idea, a problem, time<\/span><\/td><td><span class=\"la\">a job, married, dressed, lost, better, in touch, ready, home<\/span><\/td><\/tr><\/table><\/div>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>Die drei häufigsten Fehler deutschsprachiger Lernender in diesem Bereich: <span class=\"la\">make sport<\/span> statt <span class=\"la\">do sport<\/span>, <span class=\"la\">make a photo<\/span> statt <span class=\"la\">take a photo<\/span> und <span class=\"la\">make homework<\/span> statt <span class=\"la\">do homework<\/span>. Wer nur diese drei ausräumt, hat schon viel gewonnen.<\/div>\n<h3>Verstärkungen passend wählen<\/h3>\n<p>Nicht jedes Verstärkungswort passt zu jedem Adjektiv:<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th><\/th><th>passt zu<\/th><th>Beispiel<\/th><\/tr><tr><td><span class=\"la\">very<\/span><\/td><td>normalen Adjektiven<\/td><td><span class=\"la\">very interesting, very tired<\/span><\/td><\/tr><tr><td><span class=\"la\">absolutely, completely<\/span><\/td><td>extremen Adjektiven<\/td><td><span class=\"la\">absolutely exhausted, completely wrong<\/span><\/td><\/tr><tr><td><span class=\"la\">highly<\/span><\/td><td>gehobenem Wortschatz<\/td><td><span class=\"la\">highly likely, highly recommended<\/span><\/td><\/tr><tr><td><span class=\"la\">deeply<\/span><\/td><td>Gefühlen<\/td><td><span class=\"la\">deeply disappointed, deeply moved<\/span><\/td><\/tr><tr><td><span class=\"la\">heavily<\/span><\/td><td>Mengen<\/td><td><span class=\"la\">heavily criticised, it rained heavily<\/span><\/td><\/tr><\/table><\/div>\n<div class=\"note\"><b class=\"lab\">Merke<\/b><span class=\"la\">very exhausted<\/span> klingt falsch, weil <span class=\"la\">exhausted<\/span> bereits den höchsten Grad bezeichnet. Extreme Adjektive verstärkt man mit <span class=\"la\">absolutely<\/span>: <span class=\"la\">absolutely exhausted, absolutely delicious, absolutely terrible<\/span>.<\/div>\n<h3>Nützliche Wendungen für die Prüfung<\/h3>\n<div class=\"formula\"><span class=\"la\">to make up your mind<\/span> (sich entscheiden) · <span class=\"la\">to keep in touch<\/span> (in Kontakt bleiben) · <span class=\"la\">to take something into account<\/span> (berücksichtigen) · <span class=\"la\">to bear in mind<\/span> (bedenken) · <span class=\"la\">to make the most of<\/span> (das Beste machen aus) · <span class=\"la\">to pay attention to<\/span> (achten auf) · <span class=\"la\">to come to a conclusion<\/span> (zu einem Schluss kommen)<\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Das richtige Verb finden<\/h4><div class=\"task\"><span class=\"la\">She has to <span class=\"gap\">___<\/span> an important decision today.<\/span><\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Prüfe, ob du die Verbindung kennst. Bei <span class=\"la\">decision<\/span> lautet sie immer <span class=\"la\">make a decision<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Die Probe über das Deutsche hilft hier nicht: „eine Entscheidung treffen“ legt eher <span class=\"la\">take<\/span> nahe, und im britischen Englisch ist <span class=\"la\">take a decision<\/span> tatsächlich möglich, aber <span class=\"la\">make<\/span> ist die Normalform.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Setze ein: <span class=\"la\">She has to make an important decision today.<\/span><\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Lerne künftig nicht <span class=\"la\">decision<\/span> allein, sondern <span class=\"la\">make a decision<\/span>. Das ist der eigentliche Lernschritt.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"falsefriends","t":"False Friends und typische Interferenzfehler","kl":"2","k":2,"a":"W","tag":"Aufbau","goals":["die gefährlich >Miete, mieten<\/td><td>Rente<\/td><td><span class=\"la\">pension<\/span><\/td><\/tr><tr><td><span class=\"la\">note<\/span><\/td><td>Notiz, Anmerkung<\/td><td>Note (Schule)<\/td><td><span class=\"la\">mark, grade<\/span><\/td><\/tr><tr><td><span class=\"la\">menu<\/span><\/td><td>Speisekarte<\/td><td>Menü<\/td><td><span class=\"la\">set meal<\/span><\/td><\/tr><tr><td><span class=\"la\">curse<\/span><\/td><td>Fluch<\/td><td>Kurs<\/td><td><span class=\"la\">course<\/span><\/td><\/tr><tr><td><span class=\"la\">bald<\/span><\/td><td>kahl<\/td><td>bald<\/td><td><span class=\"la\">soon<\/span><\/td><\/tr><tr><td><span class=\"la\">also<\/span><\/td><td>auch<\/td><td>also<\/td><td><span class=\"la\">so, therefore<\/span><\/td><\/tr><tr><td><span class=\"la\">concurrence<\/span><\/td><td>Übereinstimmung<\/td><td>Konkurrenz<\/td><td><span class=\"la\">competition<\/span><\/td><\/tr><tr><td><span class=\"la\">serious<\/span><\/td><td>ernst<\/td><td>seriös<\/td><td><span class=\"la\">reputable, respectable<\/span><\/td><\/tr><\/table><\/div>\n<div class=\"note\"><b class=\"lab\">Merke<\/b>Die drei Wörter, die Prüfungsarbeiten am häufigsten verderben, sind <span class=\"la\">become<\/span>, <span class=\"la\">eventually<\/span> und <span class=\"la\">actually<\/span>. Präge sie dir mit einem Beispielsatz ein: <span class=\"la\">I got a letter. Eventually they agreed. Actually, I disagree.<\/span><\/div>\n<h3>Interferenzfehler, die keine falschen Freunde sind<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Falsch<\/th><th>Richtig<\/th><th>Grund<\/th><\/tr><tr><td><span class=\"la\">I am agree.<\/span><\/td><td><span class=\"la\">I agree.<\/span><\/td><td><span class=\"la\">agree<\/span> ist ein Vollverb<\/td><\/tr><tr><td><span class=\"la\">informations<\/span><\/td><td><span class=\"la\">information<\/span><\/td><td>unzählbar<\/td><\/tr><tr><td><span class=\"la\">It gives many problems.<\/span><\/td><td><span class=\"la\">There are many problems.<\/span><\/td><td>„es gibt“<\/td><\/tr><tr><td><span class=\"la\">since three years<\/span><\/td><td><span class=\"la\">for three years<\/span><\/td><td>Dauer mit <span class=\"la\">for<\/span><\/td><\/tr><tr><td><span class=\"la\">I have seen him yesterday.<\/span><\/td><td><span class=\"la\">I saw him yesterday.<\/span><\/td><td>abgeschlossene Zeit<\/td><\/tr><tr><td><span class=\"la\">in the television<\/span><\/td><td><span class=\"la\">on television<\/span><\/td><td>feste Wendung<\/td><\/tr><tr><td><span class=\"la\">a good idea, no?<\/span><\/td><td><span class=\"la\">a good idea, isn't it?<\/span><\/td><td>Question Tag<\/td><\/tr><tr><td><span class=\"la\">we discussed about it<\/span><\/td><td><span class=\"la\">we discussed it<\/span><\/td><td>ohne Präposition<\/td><\/tr><tr><td><span class=\"la\">make a party<\/span><\/td><td><span class=\"la\">have a party<\/span><\/td><td>Kollokation<\/td><\/tr><tr><td><span class=\"la\">until now I have never …<\/span><\/td><td><span class=\"la\">so far I have never …<\/span><\/td><td><span class=\"la\">until now<\/span> klingt nach Abschluss<\/td><\/tr><\/table><\/div>\n<div class=\"note t\"><b class=\"lab\">Tipp<\/b>Wenn du dir bei einem Wort unsicher bist, das verdächtig deutsch aussieht, nimm das weniger ähnliche Wort. Bei <span class=\"la\">eventually<\/span> und <span class=\"la\">possibly<\/span> ist fast immer <span class=\"la\">possibly<\/span> gemeint, und bei <span class=\"la\">become<\/span> und <span class=\"la\">get<\/span> fast immer <span class=\"la\">get<\/span>.<\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Einen Interferenzfehler finden<\/h4><div class=\"task\">Finde und korrigiere den Fehler: <span class=\"la\">I am living in Austria since five years.<\/span><\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Prüfe die Zeitform: <span class=\"la\">since<\/span> verbindet den Anfangspunkt mit jetzt, das verlangt das Present Perfect, nicht das Present Progressive.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Prüfe die Präposition: <span class=\"la\">five years<\/span> ist eine Dauer, keine Anfangsangabe. Dauer verlangt <span class=\"la\">for<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Beide Fehler stammen aus dem deutschen Satz „Ich wohne seit fünf Jahren in Österreich“, in dem Präsens und „seit“ stehen.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Richtig: <span class=\"la\">I have lived in Austria for five years.<\/span> oder <span class=\"la\">… since 2021.<\/span><\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"schreiben","t":"Die Schreibaufgabe verstehen und bewerten lernen","kl":"3","k":3,"a":"T","tag":"Basis","goals":["den Aufbau einer Schreibaufgabe der Reifeprüfung erkennen","die vier Beurteilungskriterien und ihre Bedeutung für deinen Text kennen","die Bullet Points vollständig abarbeiten","Zeit und Wortzahl einteilen"],"ex":[{"type":"mc","q":"Du hast einen sprachlich sehr guten Text geschrieben, aber einen der drei Bullet Points vergessen. Was folgt daraus?","h":"Welches Kriterium misst, ob die Aufgabe erfüllt wurde?","s":"Die Bullet Points sind der Kern des Kriteriums EA. Weil alle vier Kriterien gleich zählen, lässt sich ein fehlender Punkt auch durch hervorragende Sprache nicht ausgleichen.","o":["Das Kriterium Erfüllung der Aufgabenstellung kann nicht positiv sein.","Der Fehler wird durch die gute Sprache ausgeglichen.","Es werden nur wenige Punkte abgezogen, weil drei Viertel vorhanden sind.","Das betrifft nur das Kriterium Aufbau und Layout."]},{"type":"mc","q":"Die Angabe verlangt 250 Wörter. Wie viele sind unbedenklich?","h":"Üblich ist eine Toleranz von etwa zehn Prozent.","s":"Rund zehn Prozent Abweichung bleiben folgenlos. Viel längere Texte bringen keine Vorteile, kosten aber Zeit und erzeugen zusätzliche Fehler.","o":["ungefähr 225 bis 275","genau 250","mindestens 300, mehr ist immer besser","150 reichen, wenn alle Punkte vorkommen"]},{"type":"mc","q":"Was gehört in die letzten sieben Minuten einer Schreibaufgabe?","h":"Was bringt in kurzer Zeit die meisten Punkte?","s":"Das Abhaken sichert das wichtigste Kriterium, die persönliche Fehlerliste das Kriterium Sprachrichtigkeit. Beides zusammen dauert wenige Minuten und wirkt sich auf zwei von vier Kriterien aus.","o":["Die Bullet Points abhaken und die eigene Fehlerliste durchgehen.","Den Text noch einmal vollständig neu schreiben.","Weitere Argumente ergänzen.","Die Überschrift verschönern."]},{"type":"txt","a":["that"],"q":"Finde den Fehler und schreibe das Wort auf, vor dem das überflüssige Komma steht: <span class=\"la\">I think, that we should start earlier.<\/span>","s":"Vor <span class=\"la\">that<\/span> steht im Englischen kein Komma. Der Satz lautet richtig: <span class=\"la\">I think that we should start earlier.<\/span>"},{"type":"mc","q":"Welche Reihenfolge der Arbeitsschritte ist sinnvoll?","s":"Wer ohne Plan beginnt, merkt meist in der Mitte, dass ein Bullet Point nicht hineinpasst, und verliert dann Zeit mit Umbauten. Acht Minuten Planung sparen regelmäßig zwanzig Minuten Reparatur.","o":["Angabe auswerten, Stichworte sammeln, schreiben, überarbeiten","schreiben, Angabe prüfen, überarbeiten","Stichworte sammeln, schreiben, Angabe prüfen","Angabe lesen, sofort schreiben, am Ende Stichworte ergänzen"]},{"type":"mc","q":"Was bedeutet der Operator <span class=\"la\">discuss<\/span> in einem Bullet Point?","h":"Ein Operator sagt, welche Denkleistung verlangt ist.","s":"<span class=\"la\">discuss<\/span> verlangt die Auseinandersetzung mit mindestens zwei Sichtweisen und einen eigenen Schluss. Reine Beschreibung wäre <span class=\"la\">describe<\/span>, reine Meinung wäre <span class=\"la\">give your opinion<\/span>.","o":["Beide Seiten darstellen und dann zu einer begründeten Position kommen.","Die eigene Meinung ausführlich darlegen.","Den Sachverhalt genau beschreiben.","Vor- und Nachteile auflisten, ohne zu werten."]},{"type":"self","q":"Nimm eine beliebige Schreibaufgabe aus deinem Unterricht und erstelle nur den Plan: Rahmen, Textsorte, Adressat, die nummerierten Bullet Points mit je zwei Stichworten und die geplante Wortzahl pro Abschnitt. Schreibe den Text nicht.","s":"Der Plan sollte auf eine halbe Seite passen und in acht Minuten entstehen. Wenn du zu einem Bullet Point keine zwei Stichworte findest, ist das ein Warnsignal: Genau dieser Punkt wird im Text zu kurz kommen. Lieber jetzt zwei Minuten nachdenken als später einen Absatz streichen."}],"gen":["wf","coll"],"html":"<h3>Wie eine Aufgabe aussieht<\/h3>\n<p>Jede Schreibaufgabe besteht aus drei Teilen, und jeder davon entscheidet mit über die Note:<\/p>\n<ul><li>der <b class=\"e\">situative Rahmen<\/b>: wer schreibt an wen, warum und wo erscheint der Text<\/li><li>die <b class=\"e\">Textsorte<\/b> mit der geforderten <b class=\"e\">Wortzahl<\/b><\/li><li>drei bis vier <b class=\"e\">Bullet Points<\/b>, die du alle behandeln musst<\/li><\/ul>\n<div class=\"note\"><b class=\"lab\">Merke<\/b>Die Bullet Points sind keine Anregungen, sondern Vorgaben. Ein Text, der einen Punkt auslässt, kann im wichtigsten Kriterium nicht positiv sein, mag er sprachlich noch so gut sein.<\/div>\n<h3>Die vier Beurteilungskriterien<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Kürzel<\/th><th>Kriterium<\/th><th>Was dein Text dafür braucht<\/th><\/tr><tr><td><b class=\"e\">EA<\/b><\/td><td>Erfüllung der Aufgabenstellung<\/td><td>alle Bullet Points, die richtige Textsorte, der passende Adressat, die Wortzahl<\/td><\/tr><tr><td><b class=\"e\">OL<\/b><\/td><td>Aufbau und Layout<\/td><td>erkennbare Gliederung, Absätze, Verknüpfungen, textsortentypische Elemente wie Überschrift oder Anrede<\/td><\/tr><tr><td><b class=\"e\">SGS<\/b><\/td><td>Spektrum sprachlicher Mittel<\/td><td>abwechslungsreicher Wortschatz, verschiedene Satzbaumuster<\/td><\/tr><tr><td><b class=\"e\">RGS<\/b><\/td><td>Sprachrichtigkeit<\/td><td>Grammatik, Wortschatz, Rechtschreibung, Zeichensetzung<\/td><\/tr><\/table><\/div>\n<p>Alle vier zählen gleich viel. Daraus folgt eine unangenehme, aber nützliche Erkenntnis: Ein fehlerfreier Text, der die Aufgabe verfehlt, ist schlechter als ein Text mit einigen Fehlern, der alles abdeckt.<\/p>\n<h3>Die Wortzahl<\/h3>\n<p>Üblich sind Vorgaben wie „ungefähr 250 Wörter“. Eine Abweichung um etwa zehn Prozent nach oben oder unten bleibt folgenlos. Deutlich zu kurze Texte verlieren jedoch Punkte, weil sie die Aufgabe nicht ausführen können.<\/p>\n<div class=\"note t\"><b class=\"lab\">Tipp<\/b>Zähle nicht jedes Wort. Zähle einmal zu Hause, wie viele Wörter in eine deiner handschriftlichen Zeilen passen, und rechne in der Prüfung mit Zeilen. Das spart mehrere Minuten.<\/div>\n<h3>Zeitplan für eine Aufgabe von 250 Wörtern<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Minuten<\/th><th>Schritt<\/th><\/tr><tr><td>5<\/td><td>Angabe lesen, Rahmen und Adressat markieren, Bullet Points nummerieren<\/td><\/tr><tr><td>8<\/td><td>Stichworte sammeln, zu jedem Bullet Point zwei Gedanken<\/td><\/tr><tr><td>25<\/td><td>schreiben<\/td><\/tr><tr><td>7<\/td><td>überarbeiten: Bullet Points abhaken, dann gezielt auf eigene Fehler prüfen<\/td><\/tr><\/table><\/div>\n<h3>Die Überarbeitung<\/h3>\n<p>In den letzten Minuten suchst du nicht „nach Fehlern“, sondern nach <b class=\"e\">deinen<\/b> Fehlern. Lege dir dafür eine persönliche Liste an, die meist nur vier bis sechs Punkte umfasst, etwa: drittes s, Present Perfect mit <span class=\"la\">since<\/span>, Artikel bei allgemeinen Aussagen, Komma vor <span class=\"la\">that<\/span>. Diese Liste gehst du nacheinander durch.<\/p>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>Das Komma vor <span class=\"la\">that<\/span> gibt es im Englischen nicht: <span class=\"la\">I think that he is right<\/span>, ohne Komma. Das ist einer der häufigsten Fehler, die aus dem Deutschen übertragen werden.<\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Eine Angabe auswerten<\/h4><div class=\"task\"><span class=\"la\">You recently spent a week at a partner school in Ireland. Write an article for your school magazine (250 words) in which you: describe what surprised you most, compare the two schools, explain what your school could learn from the visit.<\/span><\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Markiere den Rahmen: Leserschaft ist die Schulgemeinschaft, Textsorte ist ein Artikel, also mit Überschrift und lebendigem Einstieg, Register halbformell.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Nummeriere die Bullet Points: eins beschreiben, zwei vergleichen, drei erklären. Drei Punkte, also drei Abschnitte im Hauptteil.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Beachte die Operatoren: <span class=\"la\">describe<\/span> verlangt Einzelheiten, <span class=\"la\">compare<\/span> verlangt beide Seiten in einem Zug, <span class=\"la\">explain<\/span> verlangt Begründungen.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Plane die Wortzahl: Einleitung 35, drei Abschnitte zu je 60, Schluss 35. So weißt du beim Schreiben jederzeit, ob du im Plan liegst.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"article","t":"Textsorte: Article","kl":"3","k":3,"a":"T","tag":"Aufbau","goals":["einen Artikel für eine Schüler- oder Online-Zeitung schreiben","Überschrift, Einstieg und Schluss gestalten","das halbformelle Register treffen","Leserbezug herstellen, ohne ins Plaudern zu geraten"],"ex":[{"type":"mc","q":"Welche Überschrift passt am besten zu einem Artikel über eine Austauschwoche?","h":"Kurz, konkret, neugierig machend.","s":"Die erste Fassung nennt das Thema und verspricht etwas. Die zweite ist ein Satz und nimmt alles vorweg, die dritte sagt zu wenig, die vierte ist kein Text, sondern ein Ausruf.","o":["<span class=\"la\">A week in Ireland: what I did not expect<\/span>","<span class=\"la\">In this article I will tell you about my week in Ireland.<\/span>","<span class=\"la\">My exchange.<\/span>","<span class=\"la\">IRELAND!!!<\/span>"]},{"type":"mc","q":"Welcher Einstieg ist für einen Artikel am wirksamsten?","h":"Der Einstieg soll die Leserschaft hineinziehen, nicht den Text ankündigen.","s":"Eine Frage, die die Leserschaft betrifft, zieht sofort. Ankündigungen und Vorstellungen kosten Wörter, ohne etwas zu liefern.","o":["<span class=\"la\">Have you ever had to introduce yourself in a language you barely speak?<\/span>","<span class=\"la\">I would like to write about my exchange week.<\/span>","<span class=\"la\">My name is Anna and I am seventeen years old.<\/span>","<span class=\"la\">This article is about schools in Ireland.<\/span>"]},{"type":"mc","q":"Welches Register passt zum Article?","s":"Der Artikel wendet sich an eine Gruppe, die man nicht persönlich kennt, aber die einem nahesteht. Daher die Mischung aus Lebendigkeit und Sorgfalt.","o":["halbformell mit direkter Ansprache","streng formell wie ein Geschäftsbrief","umgangssprachlich mit Abkürzungen wie <span class=\"la\">gonna<\/span>","wissenschaftlich mit Fußnoten"]},{"type":"txt","a":["topic sentence"],"q":"Wie heißt der Satz, der am Anfang eines Abschnitts dessen Hauptgedanken ankündigt? Antworte auf Englisch, zwei Wörter.","s":"Der <span class=\"la\">topic sentence<\/span> ist das wirksamste Mittel für einen klaren Aufbau. Alles Weitere im Abschnitt stützt ihn oder führt ihn aus."},{"type":"mc","q":"Welcher Schluss passt zu einem Artikel?","h":"Ein guter Schluss bringt etwas Neues, ohne ein neues Thema zu eröffnen.","s":"Ein Appell oder eine offene Frage lässt die Leserschaft mit einem Gedanken zurück. Zusammenfassungen des eigenen Vorgehens sind Füllmaterial.","o":["<span class=\"la\">Maybe it is time we asked our own teachers about longer lessons.<\/span>","<span class=\"la\">To sum up, I have written about three points.<\/span>","<span class=\"la\">That is all, thank you for reading my article.<\/span>","<span class=\"la\">Finally I would like to repeat my introduction.<\/span>"]},{"type":"mc","q":"In welchem Satz ist das Register für einen Artikel <b class=\"e\">unpassend<\/b>?","h":"Eine Fassung rutscht in die Umgangssprache.","s":"<span class=\"la\">totally insane<\/span> gehört in ein Gespräch unter Freunden. Die übrigen Wendungen sind lebendig und trotzdem für eine Schülerzeitung angemessen.","o":["<span class=\"la\">Honestly, the whole thing was totally insane.<\/span>","<span class=\"la\">Honestly, I had not expected that at all.<\/span>","<span class=\"la\">To be fair, the timetable took some getting used to.<\/span>","<span class=\"la\">I have to admit that I was wrong about this.<\/span>"]},{"type":"self","q":"Schreibe die Überschrift, den Einstieg (zwei bis drei Sätze) und den Schluss (zwei Sätze) für einen Artikel zum Thema „Should mobile phones be banned at school?“. Den Hauptteil lässt du weg.","s":"Ein mögliches Muster. Überschrift: <span class=\"la\">Phones off, heads up: would it really help?<\/span> Einstieg: <span class=\"la\">Picture the first break of the day. Twenty students in a corridor, and not a single conversation. Our school is discussing a phone ban, and for once the discussion is worth having.<\/span> Schluss: <span class=\"la\">A ban would change the corridors, but not the habit behind them. Perhaps the better question is what we would do with the time we got back.<\/span> Achte darauf, dass dein Schluss nicht nur wiederholt, was im Einstieg steht."}],"gen":["coll","phr"],"html":"<h3>Der Rahmen<\/h3>\n<p>Ein <span class=\"la\">article<\/span> erscheint in einer Schülerzeitung, auf einer Schulwebsite oder in einer Jugendzeitschrift. Die Leserschaft ist eine Gruppe, die du nicht persönlich kennst, die dir aber nahesteht. Daraus folgt das Register: <b class=\"e\">halbformell<\/b>, lebendig, mit direkter Ansprache, aber ohne Chat-Sprache.<\/p>\n<h3>Aufbau<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Teil<\/th><th>Aufgabe<\/th><th>Umfang bei 250 Wörtern<\/th><\/tr><tr><td>Überschrift<\/td><td>neugierig machen, Thema nennen<\/td><td>3 bis 8 Wörter<\/td><\/tr><tr><td>Einstieg<\/td><td>Frage, kurze Szene, überraschende Zahl<\/td><td>ca. 40 Wörter<\/td><\/tr><tr><td>Hauptteil<\/td><td>je ein Abschnitt pro Bullet Point<\/td><td>ca. 170 Wörter<\/td><\/tr><tr><td>Schluss<\/td><td>Bilanz, Appell oder offene Frage<\/td><td>ca. 40 Wörter<\/td><\/tr><\/table><\/div>\n<h3>Die Überschrift<\/h3>\n<p>Gute Überschriften sind kurz und konkret. Drei Muster, die fast immer funktionieren:<\/p>\n<div class=\"formula\">Frage: <span class=\"la\">Why does nobody talk about this?<\/span><\/div>\n<div class=\"formula\">Doppelpunkt: <span class=\"la\">A week in Ireland: what I did not expect<\/span><\/div>\n<div class=\"formula\">Widerspruch: <span class=\"la\">More screens, less time<\/span><\/div>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>Eine Überschrift ist kein Satz mit Punkt und keine Zusammenfassung. <span class=\"la\">In this article I will write about my exchange week in Ireland<\/span> ist beides und deshalb schwach.<\/div>\n<h3>Einstiege, die ziehen<\/h3>\n<div class=\"formula\">Frage an die Leserschaft: <span class=\"la\">Have you ever shared a classroom with thirty strangers?<\/span><\/div>\n<div class=\"formula\">Szene: <span class=\"la\">It was seven in the morning and already raining sideways.<\/span><\/div>\n<div class=\"formula\">Zahl: <span class=\"la\">Three out of four students at our school say they sleep less than seven hours.<\/span><\/div>\n<div class=\"formula\">Widerspruch: <span class=\"la\">Everyone told me Irish schools were stricter. They were not.<\/span><\/div>\n<h3>Sprache des Artikels<\/h3>\n<ul><li>Direkte Ansprache ist erlaubt und erwünscht: <span class=\"la\">you might think, imagine, let me tell you<\/span>.<\/li><li>Rhetorische Fragen gliedern den Text: <span class=\"la\">So what can we learn from this?<\/span><\/li><li>Persönliche Beispiele machen abstrakte Punkte greifbar.<\/li><li>Vermeide Chat-Sprache, Abkürzungen und Ausrufezeichen in Serie.<\/li><\/ul>\n<div class=\"note t\"><b class=\"lab\">Tipp<\/b>Jeder Abschnitt des Hauptteils bekommt einen eigenen Gedanken und beginnt mit einem Satz, der diesen Gedanken ankündigt. Dieser Satz heißt <span class=\"la\">topic sentence<\/span> und ist das wirksamste Mittel für das Kriterium Aufbau.<\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Einen Hauptteilabschnitt bauen<\/h4><div class=\"task\">Bullet Point: <span class=\"la\">compare the two schools<\/span>. Schreibe den Abschnitt in vier Sätzen.<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div><b class=\"e\">Topic sentence:<\/b> Nenne den Vergleichspunkt. <span class=\"la\">The biggest difference was not the building but the timetable.<\/span><\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div><b class=\"e\">Erste Seite:<\/b> <span class=\"la\">At home we have eight lessons that all look the same.<\/span><\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div><b class=\"e\">Zweite Seite:<\/b> <span class=\"la\">In Ireland the day was split into longer blocks, which meant fewer subjects but more time for each.<\/span><\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div><b class=\"e\">Folgerung:<\/b> <span class=\"la\">After a week I stopped checking the clock, and that surprised me more than anything else.<\/span> Vier Sätze, ein Gedanke, ein klarer Abschluss.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"blogcomment","t":"Textsorte: Blog comment","kl":"3","k":3,"a":"T","tag":"Aufbau","goals":["auf einen fremden Beitrag angemessen reagieren","eine eigene Position begründen","persönlich schreiben, ohne unhöflich zu werden","die Unterschiede zum Article kennen"],"ex":[{"type":"mc","q":"Womit beginnt ein Blog comment?","h":"Die Textsorte heißt Kommentar, nicht Artikel.","s":"Der Bezug auf den Ausgangsbeitrag ist das Erkennungsmerkmal der Textsorte. Eine Überschrift gehört zum Artikel, eine förmliche Anrede zum Brief.","o":["mit einem Bezug auf den gelesenen Beitrag","mit einer Überschrift","mit einer förmlichen Anrede wie <span class=\"la\">Dear Sir or Madam<\/span>","mit der eigenen Lebensgeschichte"]},{"type":"mc","q":"Welche Formulierung des Widerspruchs ist für einen Blog comment am besten?","h":"Höflichkeit und Stärke des Arguments hängen zusammen.","s":"Höflicher Widerspruch mit angekündigter Begründung wirkt überzeugender und erfüllt zugleich die Erwartung an das Register. Persönliche Angriffe kosten Punkte.","o":["<span class=\"la\">I am afraid I have to disagree, and here is why.<\/span>","<span class=\"la\">That is complete nonsense.<\/span>","<span class=\"la\">You obviously have no idea what you are talking about.<\/span>","<span class=\"la\">Everybody knows that this is wrong.<\/span>"]},{"type":"mc","q":"Was unterscheidet den Blog comment vom Article am deutlichsten?","s":"Der Bezug auf einen konkreten Ausgangstext ist das entscheidende Merkmal. Beide Textsorten dürfen persönlich sein und brauchen eine Gliederung.","o":["Der Kommentar antwortet auf einen bestimmten Text, der Artikel informiert allgemein.","Der Kommentar ist immer kürzer.","Der Artikel ist persönlicher.","Der Kommentar braucht keine Gliederung."]},{"type":"txt","a":["I see your point","I take your point"],"q":"Ergänze eine Wendung für höfliches Differenzieren: <span class=\"gap\">___<\/span>, but I think the situation is more complicated._ Setze vier Wörter ein.","s":"<span class=\"la\">I see your point<\/span> ist die gebräuchlichste Wendung dafür. Sie erkennt das Gegenüber an und leitet trotzdem zum eigenen Einwand über."},{"type":"mc","q":"Welcher Schluss passt zu einem Blog comment?","h":"Der Kommentar steht in einem Gespräch mit anderen Leserinnen.","s":"Eine Frage an die anderen Leserinnen setzt das Gespräch fort und passt genau zur Textsorte. Die übrigen Schlüsse behandeln den Kommentar wie einen Brief oder einen Aufsatz.","o":["<span class=\"la\">What do the rest of you think? Has anyone here actually worn a uniform?<\/span>","<span class=\"la\">Thank you for reading my comment, goodbye.<\/span>","<span class=\"la\">To sum up, I have mentioned three arguments.<\/span>","<span class=\"la\">I hope you will publish my comment.<\/span>"]},{"type":"mc","q":"Welche Aussage über das persönliche Beispiel stimmt?","s":"Der Kommentar lebt von der persönlichen Perspektive. Das Beispiel ersetzt allerdings nicht das Argument, sondern stützt es.","o":["Es macht die Argumentation glaubwürdig und gehört zur Textsorte.","Es ist unwissenschaftlich und sollte vermieden werden.","Es ersetzt die Argumente.","Es gehört nur in den Schluss."]},{"type":"self","q":"Lies den folgenden Ausgangsgedanken und schreibe einen Blog comment von ungefähr 120 Wörtern: „Homework should be abolished because it increases inequality between students.“","s":"Prüfe deinen Text an vier Punkten: Beginnt er mit einem Bezug auf diesen Gedanken? Steht deine Position in einem einzigen klaren Satz? Hast du mindestens zwei Argumente, jedes mit einem Beispiel? Endet er mit einer Frage oder einem Appell? Wenn du alle vier mit Ja beantworten kannst, ist die Textsorte erfüllt, unabhängig davon, welche Meinung du vertrittst."}],"gen":["phr","coll"],"html":"<h3>Der Rahmen<\/h3>\n<p>Ein <span class=\"la\">blog comment<\/span> ist eine Antwort auf einen Beitrag, den du gelesen hast. Deshalb beginnt er fast immer mit einem Bezug darauf. Die Leserschaft sind die anderen Leserinnen des Blogs und die Verfasserin des Beitrags. Das Register ist <b class=\"e\">persönlich und direkt<\/b>, aber höflich.<\/p>\n<h3>Aufbau<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Teil<\/th><th>Aufgabe<\/th><\/tr><tr><td>Bezug<\/td><td>auf den Beitrag eingehen: zustimmen, widersprechen, differenzieren<\/td><\/tr><tr><td>Position<\/td><td>die eigene Sicht in einem Satz<\/td><\/tr><tr><td>Begründung<\/td><td>zwei bis drei Argumente, jedes mit Beispiel<\/td><\/tr><tr><td>Erfahrung<\/td><td>ein persönliches Erlebnis, das die Sache greifbar macht<\/td><\/tr><tr><td>Schluss<\/td><td>Zusammenfassung, Frage an die anderen oder Appell<\/td><\/tr><\/table><\/div>\n<div class=\"note\"><b class=\"lab\">Merke<\/b>Der Unterschied zum Article in einem Satz: Der Artikel informiert eine Leserschaft über ein Thema, der Kommentar antwortet einer Person auf einen Text. Wer den Bezug zum Ausgangsbeitrag vergisst, schreibt in Wahrheit einen Artikel und verfehlt die Textsorte.<\/div>\n<h3>Redemittel für den Bezug<\/h3>\n<div class=\"formula\"><span class=\"la\">I have just read your post on … and it made me think.<\/span><\/div>\n<div class=\"formula\"><span class=\"la\">Thanks for raising this topic. I agree with most of what you say, but …<\/span><\/div>\n<div class=\"formula\"><span class=\"la\">I see your point about …, however, I would add that …<\/span><\/div>\n<div class=\"formula\"><span class=\"la\">Reading your article, I kept thinking about my own experience.<\/span><\/div>\n<h3>Zustimmen, widersprechen, differenzieren<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Haltung<\/th><th>Wendungen<\/th><\/tr><tr><td>Zustimmung<\/td><td><span class=\"la\">You are absolutely right that … · This is exactly what I have noticed, too.<\/span><\/td><\/tr><tr><td>Widerspruch<\/td><td><span class=\"la\">I am afraid I see this differently. · I am not convinced that …<\/span><\/td><\/tr><tr><td>Differenzierung<\/td><td><span class=\"la\">You have a point, but it depends on … · This may be true for …, yet in my experience …<\/span><\/td><\/tr><\/table><\/div>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>Höflichkeit ist hier ein Bewertungsfaktor. <span class=\"la\">That is nonsense<\/span> ist nicht nur unhöflich, sondern schwächt auch das Argument. <span class=\"la\">I am not convinced, because …<\/span> sagt dasselbe und wirkt stärker.<\/div>\n<h3>Typische Fehler<\/h3>\n<ul><li>Der Kommentar vergisst den Bezug und beginnt wie ein Aufsatz.<\/li><li>Die Position bleibt unklar, weil zu viele Seiten abgewogen werden.<\/li><li>Das persönliche Beispiel fehlt, obwohl es die Textsorte besonders schätzt.<\/li><li>Der Ton wird im Widerspruch zu scharf.<\/li><\/ul>\n<div class=\"walk\"><h4>Schritt für Schritt: Einen Kommentar beginnen<\/h4><div class=\"task\">Der Beitrag behauptet, Schuluniformen würden Mobbing verhindern. Du siehst das anders. Schreibe die ersten drei Sätze.<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div><b class=\"e\">Bezug:<\/b> Zeige, dass du den Beitrag gelesen hast, und nimm einen konkreten Gedanken daraus auf. <span class=\"la\">I have just read your post about school uniforms, and your point about pressure to wear the right brands stayed with me.<\/span><\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div><b class=\"e\">Teilweise Zustimmung:<\/b> Das macht den Widerspruch stärker, nicht schwächer. <span class=\"la\">You are right that clothes can create a divide.<\/span><\/div><\/div><div class=\"wstep final\"><div class=\"n\">3<\/div><div><b class=\"e\">Eigene Position:<\/b> Ein klarer Satz, höflich formuliert. <span class=\"la\">Still, I am not convinced that uniforms solve the problem; in my experience they simply move it somewhere else.<\/span><\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"email","t":"Textsorte: Email und Letter","kl":"3","k":3,"a":"T","tag":"Aufbau","goals":["förmliche und halbförmliche E-Mails schreiben","Anrede und Grußformel richtig zuordnen","höflich bitten, sich beschweren und sich bedanken","die Unterschiede im Register sicher treffen"],"ex":[{"type":"mc","q":"Du schreibst an <span class=\"la\">Dear Sir or Madam<\/span>. Welche Grußformel gehört dazu?","h":"Kennst du den Namen der Person?","s":"Ohne Namen steht im britischen Englisch <span class=\"la\">Yours faithfully<\/span>. Mit Namen in der Anrede steht <span class=\"la\">Yours sincerely<\/span>.","o":["<span class=\"la\">Yours faithfully,<\/span>","<span class=\"la\">Yours sincerely,<\/span>","<span class=\"la\">Best wishes,<\/span>","<span class=\"la\">Yours truly,<\/span>"]},{"type":"mc","q":"Welche Fassung ist in einer förmlichen E-Mail am besten?","h":"Höflichkeit entsteht durch indirekte Formulierung.","s":"Die erste Fassung ist die Standardwendung für Bitten im förmlichen Schriftverkehr. Abkürzungen wie <span class=\"la\">info<\/span> und <span class=\"la\">asap<\/span> gehören nicht in eine förmliche Mail.","o":["<span class=\"la\">I would be grateful if you could send me further information.<\/span>","<span class=\"la\">Send me more information.<\/span>","<span class=\"la\">I want more information about this.<\/span>","<span class=\"la\">Please send info asap.<\/span>"]},{"type":"txt","a":["hearing"],"q":"Ergänze: <span class=\"la\">I look forward to <span class=\"gap\">___<\/span> from you.<\/span>","s":"Nach <span class=\"la\">look forward to<\/span> steht die <span class=\"la\">-ing<\/span>-Form: <span class=\"la\">hearing<\/span>. Das <span class=\"la\">to<\/span> ist hier eine Präposition, kein Infinitivzeichen."},{"type":"mc","q":"Welcher Betreff ist am besten?","s":"Ein Betreff nennt knapp den Gegenstand des Schreibens. Alles andere kostet die Empfängerin Zeit und wirkt unprofessionell.","o":["<span class=\"la\">Application for the summer language course<\/span>","<span class=\"la\">Hello<\/span>","<span class=\"la\">I have a question about something important<\/span>","<span class=\"la\">URGENT!!! Please read<\/span>"]},{"type":"mc","q":"In welchem Satz ist das Register <b class=\"e\">falsch<\/b> für eine förmliche E-Mail?","h":"Zwei Merkmale verraten die Umgangssprache.","s":"Die Kurzform <span class=\"la\">I'm<\/span> und die Abkürzung <span class=\"la\">cos<\/span> gehören in eine Nachricht an Freunde. In förmlichen Texten werden Kurzformen ausgeschrieben.","o":["<span class=\"la\">I'm writing cos I didn't get the confirmation.<\/span>","<span class=\"la\">I am writing because I have not received the confirmation.<\/span>","<span class=\"la\">Unfortunately, I have not received the confirmation yet.<\/span>","<span class=\"la\">I am afraid the confirmation has not arrived.<\/span>"]},{"type":"txt","a":["Could you","Would you"],"q":"Mache die Aufforderung höflich: <span class=\"la\">Send me the timetable.<\/span> → <span class=\"gap\">___<\/span> send me the timetable, please?_ Setze zwei Wörter ein.","s":"<span class=\"la\">Could you send me the timetable, please?<\/span> Die Frageform mit <span class=\"la\">could<\/span> ist die gebräuchlichste Höflichkeitsform im Englischen."},{"type":"mc","q":"Wie geht es nach der Anrede <span class=\"la\">Dear Ms Brown,<\/span> weiter?","h":"Im britischen Englisch folgt auf die Anrede ein Komma.","s":"Nach der Anrede mit Komma beginnt der Text in der nächsten Zeile, und zwar großgeschrieben, wenn ein neuer Satz beginnt. Der Doppelpunkt nach der Anrede ist amerikanisch.","o":["mit kleinem Anfangsbuchstaben in der nächsten Zeile, weil der Satz dort beginnt","mit einem Doppelpunkt statt des Kommas","mit einer Leerzeile und dann großgeschrieben, immer mit <span class=\"la\">I<\/span>","mit der Wiederholung der Anrede"]},{"type":"self","q":"Schreibe eine förmliche E-Mail von ungefähr 150 Wörtern an eine Sprachschule in Irland, in der du dich nach einem zweiwöchigen Kurs im Sommer erkundigst: Frage nach Preis, Unterkunft und Niveau.","s":"Prüfe am Ende fünf Dinge: Betreff vorhanden und sachlich, Anrede und Grußformel passend zueinander, Grund des Schreibens im ersten Satz, drei Fragen klar erkennbar und höflich formuliert, keine Kurzformen. Diese fünf Punkte entscheiden bei dieser Textsorte den größten Teil der Bewertung."}],"gen":["coll","prep"],"html":"<h3>Förmlich oder halbförmlich?<\/h3>\n<p>Der Rahmen der Angabe entscheidet. Schreibst du an eine Behörde, eine Schulleitung, eine Firma oder eine unbekannte Person, ist der Ton <b class=\"e\">förmlich<\/b>. Schreibst du an eine Gastfamilie, eine Austauschpartnerin oder eine Lehrkraft, die du kennst, ist er <b class=\"e\">halbförmlich<\/b>.<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th><\/th><th>förmlich<\/th><th>halbförmlich<\/th><\/tr><tr><td>Anrede<\/td><td><span class=\"la\">Dear Sir or Madam, / Dear Ms Brown,<\/span><\/td><td><span class=\"la\">Dear Anna,<\/span><\/td><\/tr><tr><td>Einstieg<\/td><td><span class=\"la\">I am writing to …<\/span><\/td><td><span class=\"la\">I hope you are well. I am writing because …<\/span><\/td><\/tr><tr><td>Bitte<\/td><td><span class=\"la\">I would be grateful if you could …<\/span><\/td><td><span class=\"la\">Could you please …?<\/span><\/td><\/tr><tr><td>Kurzformen<\/td><td>keine: <span class=\"la\">I am, do not<\/span><\/td><td>erlaubt: <span class=\"la\">I'm, don't<\/span><\/td><\/tr><tr><td>Grußformel<\/td><td><span class=\"la\">Yours faithfully<\/span> / <span class=\"la\">Yours sincerely<\/span><\/td><td><span class=\"la\">Best wishes, All the best<\/span><\/td><\/tr><\/table><\/div>\n<div class=\"note\"><b class=\"lab\">Merke<\/b>Die britische Regel für die Grußformel: Kennst du den Namen, steht <span class=\"la\">Yours sincerely<\/span>; kennst du ihn nicht, steht <span class=\"la\">Yours faithfully<\/span>. Eselsbrücke: Zwei Mal s gehören zusammen, <span class=\"la\">Sir<\/span> ohne Namen geht mit <span class=\"la\">faithfully<\/span>.<\/div>\n<h3>Aufbau einer förmlichen E-Mail<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Teil<\/th><th>Inhalt<\/th><\/tr><tr><td>Betreff<\/td><td>kurz und sachlich: <span class=\"la\">Application for the summer programme<\/span><\/td><\/tr><tr><td>Anrede<\/td><td><span class=\"la\">Dear Ms Brown,<\/span> mit Komma, danach klein weiter<\/td><\/tr><tr><td>Einleitung<\/td><td>Grund des Schreibens in einem Satz<\/td><\/tr><tr><td>Hauptteil<\/td><td>ein Absatz je Bullet Point<\/td><\/tr><tr><td>Schluss<\/td><td>gewünschte Handlung, Dank, Ausblick<\/td><\/tr><tr><td>Grußformel<\/td><td><span class=\"la\">Yours sincerely,<\/span> und der eigene Name<\/td><\/tr><\/table><\/div>\n<h3>Nützliche Wendungen<\/h3>\n<div class=\"formula\">Grund nennen: <span class=\"la\">I am writing to enquire about … / to apply for … / to complain about …<\/span><\/div>\n<div class=\"formula\">Bitten: <span class=\"la\">I would be grateful if you could … · Could you possibly … · I would appreciate it if …<\/span><\/div>\n<div class=\"formula\">Beschwerde: <span class=\"la\">Unfortunately, the room was not as described. · I am afraid there has been a misunderstanding.<\/span><\/div>\n<div class=\"formula\">Bezug: <span class=\"la\">With reference to your email of 3 May … · Thank you for your message.<\/span><\/div>\n<div class=\"formula\">Schluss: <span class=\"la\">I look forward to hearing from you. · Please do not hesitate to contact me.<\/span><\/div>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b><span class=\"la\">I look forward to hearing from you<\/span> steht mit der <span class=\"la\">-ing<\/span>-Form, weil <span class=\"la\">to<\/span> hier eine Präposition ist. <span class=\"la\">I look forward to hear<\/span> ist falsch und fällt in einer Prüfung sofort auf.<\/div>\n<h3>Höflichkeit ist Grammatik<\/h3>\n<p>Im Englischen wird Höflichkeit weniger durch Wörter wie „bitte“ erzeugt als durch indirekte Konstruktionen:<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>direkt<\/th><th>höflich<\/th><\/tr><tr><td><span class=\"la\">Send me the form.<\/span><\/td><td><span class=\"la\">Could you send me the form, please?<\/span><\/td><\/tr><tr><td><span class=\"la\">I want information about …<\/span><\/td><td><span class=\"la\">I would like to ask for information about …<\/span><\/td><\/tr><tr><td><span class=\"la\">You made a mistake.<\/span><\/td><td><span class=\"la\">There seems to be a mistake in the booking.<\/span><\/td><\/tr><tr><td><span class=\"la\">Answer quickly.<\/span><\/td><td><span class=\"la\">I would appreciate a reply at your earliest convenience.<\/span><\/td><\/tr><\/table><\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Eine Beschwerde höflich formulieren<\/h4><div class=\"task\">Du hast ein Zimmer gebucht, das deutlich kleiner war als beschrieben, und willst dich beschweren.<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div><b class=\"e\">Sachlich beginnen, nicht anklagen:<\/b> <span class=\"la\">I am writing with regard to my stay at your hotel from 3 to 6 May.<\/span><\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div><b class=\"e\">Das Problem nennen, unpersönlich formuliert:<\/b> <span class=\"la\">Unfortunately, the room did not match the description on your website.<\/span><\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div><b class=\"e\">Belegen, kurz und konkret:<\/b> <span class=\"la\">The advertisement mentioned a balcony and a view of the park; the room had neither.<\/span><\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div><b class=\"e\">Eine klare Forderung stellen:<\/b> <span class=\"la\">I would therefore be grateful if you could refund part of the amount.<\/span> Höflich heißt nicht unbestimmt: Die Forderung muss deutlich dastehen.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"letter","t":"Textsorte: Letter to the editor","kl":"3","k":3,"a":"T","tag":"Aufbau","goals":["auf einen Zeitungsartikel reagieren","eine Position klar und sachlich vertreten","förmlich und trotzdem engagiert schreiben","die Argumentation gliedern"],"ex":[{"type":"mc","q":"Womit beginnt ein Letter to the editor nach der Anrede?","h":"Die Leserschaft muss wissen, worauf du antwortest.","s":"Ohne Bezug weiß niemand, worum es geht. Titel und Datum des Artikels gehören in den ersten Satz.","o":["mit dem Bezug auf den Artikel samt Titel und Datum","mit der eigenen Lebensgeschichte","mit der Frage, wie es der Redaktion geht","mit dem stärksten Argument"]},{"type":"mc","q":"Welche Anrede und welche Grußformel gehören zusammen?","s":"Ohne Namen steht <span class=\"la\">Yours faithfully<\/span>. <span class=\"la\">Best wishes<\/span> und <span class=\"la\">Love<\/span> gehören in persönliche Briefe.","o":["<span class=\"la\">Dear Sir or Madam,<\/span> und <span class=\"la\">Yours faithfully,<\/span>","<span class=\"la\">Dear Sir or Madam,<\/span> und <span class=\"la\">Best wishes,<\/span>","<span class=\"la\">Hi there,<\/span> und <span class=\"la\">Yours sincerely,<\/span>","<span class=\"la\">Dear editor,<\/span> und <span class=\"la\">Love,<\/span>"]},{"type":"mc","q":"Welcher Satz entkräftet ein Gegenargument am besten?","h":"Das Gegenargument zuerst ernst nehmen.","s":"Das Muster <span class=\"la\">admittedly … however<\/span> zeigt, dass du die andere Seite verstanden hast, und macht deine eigene Position dadurch stärker. Blankes Abstreiten wirkt schwächer.","o":["<span class=\"la\">Admittedly, phones can be distracting. However, the distraction does not disappear with the phone.<\/span>","<span class=\"la\">Some people say phones are distracting, but they are wrong.<\/span>","<span class=\"la\">Phones are not distracting at all.<\/span>","<span class=\"la\">I do not agree with people who think phones are distracting.<\/span>"]},{"type":"txt","a":["Yours faithfully"],"q":"Welche Grußformel steht nach <span class=\"la\">Dear Sir or Madam<\/span>? Antworte auf Englisch, zwei Wörter.","s":"<span class=\"la\">Yours faithfully<\/span> im britischen Englisch. Mit Namen in der Anrede stünde <span class=\"la\">Yours sincerely<\/span>."},{"type":"mc","q":"Welche Verknüpfung passt in einen Leserbrief am besten?","s":"<span class=\"la\">Furthermore<\/span> gehört zum gehobenen Register des Leserbriefs. Die übrigen Fassungen sind gesprochene Sprache.","o":["<span class=\"la\">Furthermore, the figures from our own school point in the same direction.<\/span>","<span class=\"la\">And another thing, the figures are also like that.<\/span>","<span class=\"la\">Plus, our school has figures too.<\/span>","<span class=\"la\">Also the figures, yeah.<\/span>"]},{"type":"mc","q":"Was gehört <b class=\"e\">nicht<\/b> in einen Letter to the editor?","h":"Eine Fassung stammt aus einer anderen Textsorte.","s":"Die Frage nach dem Befinden gehört in den persönlichen Brief. Der Leserbrief ist förmlich und sachbezogen.","o":["<span class=\"la\">How are you? I hope you are doing well.<\/span>","<span class=\"la\">I am writing in response to your article of 12 March.<\/span>","<span class=\"la\">In my view, the proposal goes too far.<\/span>","<span class=\"la\">I would urge the city council to reconsider.<\/span>"]},{"type":"txt","a":["It is high time"],"q":"Ergänze den Appell: <span class=\"gap\">___<\/span> the city invested in safer cycle paths._ Setze vier Wörter ein, die „es ist höchste Zeit“ bedeuten.","s":"<span class=\"la\">It is high time<\/span> – danach steht das Simple Past, obwohl die Gegenwart gemeint ist: <span class=\"la\">It is high time the city invested …<\/span>"},{"type":"self","q":"Schreibe einen Leserbrief von ungefähr 200 Wörtern zu diesem Artikel: „Our town plans to close the public library and move all services online.“ Nimm Stellung und baue ein Gegenargument ein.","s":"Prüfe am Ende: Steht der Bezug auf den Artikel im ersten Satz? Steht deine Position in einem einzigen Satz? Hast du mindestens zwei eigene Argumente mit Beleg? Hast du ein Gegenargument genannt und entkräftet, etwa mit <span class=\"la\">admittedly … however<\/span>? Endet der Brief mit einer Forderung und der richtigen Grußformel? Wer diese fünf Punkte abhakt, hat die Textsorte erfüllt."}],"gen":["coll","wf"],"html":"<h3>Der Rahmen<\/h3>\n<p>Der Leserbrief antwortet auf einen <b class=\"e\">Artikel in einer Zeitung<\/b> und richtet sich an die Redaktion, gelesen wird er aber von der Öffentlichkeit. Daraus folgt ein eigener Ton: <b class=\"e\">förmlicher als der Blog comment<\/b>, aber mit erkennbarer Haltung.<\/p>\n<h3>Aufbau<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Teil<\/th><th>Inhalt<\/th><th>Beispiel<\/th><\/tr><tr><td>Anrede<\/td><td><span class=\"la\">Dear Sir or Madam,<\/span><\/td><td><\/td><\/tr><tr><td>Bezug<\/td><td>Artikel mit Titel und Datum nennen<\/td><td><span class=\"la\">I am writing in response to your article „Phones out of the classroom“ of 12 March.<\/span><\/td><\/tr><tr><td>Position<\/td><td>eigene Haltung in einem Satz<\/td><td><span class=\"la\">While I share your concern, I believe a ban is the wrong answer.<\/span><\/td><\/tr><tr><td>Argumente<\/td><td>zwei bis drei, je ein Absatz, mit Beleg<\/td><td><\/td><\/tr><tr><td>Gegenargument<\/td><td>eines nennen und entkräften<\/td><td><span class=\"la\">Admittedly, … However, …<\/span><\/td><\/tr><tr><td>Schluss<\/td><td>Forderung oder Appell<\/td><td><span class=\"la\">What schools need is not a ban but a clear agreement.<\/span><\/td><\/tr><tr><td>Grußformel<\/td><td><span class=\"la\">Yours faithfully,<\/span> plus Name<\/td><td><\/td><\/tr><\/table><\/div>\n<div class=\"note\"><b class=\"lab\">Merke<\/b>Das Gegenargument gehört in einen guten Leserbrief. Wer die andere Seite ernst nimmt und widerlegt, wirkt überzeugender als wer sie verschweigt.<\/div>\n<h3>Sprache<\/h3>\n<ul><li>sachlich, aber nicht blass: <span class=\"la\">It is hard to see how … · The figures tell a different story.<\/span><\/li><li>keine Beschimpfungen, keine Ausrufezeichen<\/li><li>Belege statt Behauptungen: Zahlen, Beispiele, eigene Beobachtung<\/li><li>gehobene Verknüpfungen: <span class=\"la\">moreover, furthermore, nevertheless, consequently, in contrast<\/span><\/li><\/ul>\n<h3>Redemittel<\/h3>\n<div class=\"formula\">Bezug: <span class=\"la\">With reference to your article … · Your recent report on … raises an important question.<\/span><\/div>\n<div class=\"formula\">Position: <span class=\"la\">In my view, … · I would like to take a different view.<\/span><\/div>\n<div class=\"formula\">Argument: <span class=\"la\">The main reason for this is … · This is borne out by …<\/span><\/div>\n<div class=\"formula\">Gegenargument: <span class=\"la\">Admittedly, … Nevertheless, … · It is often argued that …, yet …<\/span><\/div>\n<div class=\"formula\">Appell: <span class=\"la\">I would urge the authorities to … · It is high time that …<\/span><\/div>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>Der Leserbrief wird oft mit dem persönlichen Brief verwechselt. Er beginnt nicht mit <span class=\"la\">How are you?<\/span>, erzählt nicht von der eigenen Familie und endet nicht mit <span class=\"la\">Best wishes<\/span>.<\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Ein Gegenargument einbauen<\/h4><div class=\"task\">Deine Position: Ein Handyverbot an Schulen ist der falsche Weg. Baue das stärkste Gegenargument ein und entkräfte es.<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div><b class=\"e\">Gegenargument ernst nennen:<\/b> <span class=\"la\">Admittedly, phones can be a serious distraction, and teachers are right to complain about them.<\/span><\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div><b class=\"e\">Einschränken statt leugnen:<\/b> <span class=\"la\">However, the problem is not the device itself but the fact that nobody has ever taught us how to handle it.<\/span><\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div><b class=\"e\">Eigenes Argument anschließen:<\/b> <span class=\"la\">A ban removes the symptom for six hours a day and leaves the habit untouched.<\/span><\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div><b class=\"e\">Folgerung:<\/b> <span class=\"la\">What we need is a rule we have helped to write, not one imposed on us.<\/span> Dieses Muster aus <span class=\"la\">admittedly<\/span> und <span class=\"la\">however<\/span> trägt jeden Leserbrief.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"report","t":"Textsorte: Report","kl":"3","k":3,"a":"T","tag":"Aufbau","goals":["einen sachlichen Bericht mit Überschriften gliedern","Daten versprachlichen","neutral und unpersönlich formulieren","Empfehlungen aussprechen"],"ex":[{"type":"mc","q":"Welcher Satz passt in einen Report?","h":"Der Report ist unpersönlich.","s":"Die unpersönliche Passivkonstruktion ist das Kennzeichen dieser Textsorte. Die ich-Form, Ausrufe und pauschale Behauptungen gehören in andere Textsorten.","o":["<span class=\"la\">It was found that most students use the bus.<\/span>","<span class=\"la\">I found out that most students use the bus.<\/span>","<span class=\"la\">You will not believe how many students use the bus!<\/span>","<span class=\"la\">Everyone knows that students use the bus.<\/span>"]},{"type":"txt","a":["Recommendations"],"q":"Wie lautet die übliche Überschrift des letzten Abschnitts, in dem Vorschläge stehen? Antworte auf Englisch, ein Wort.","s":"<span class=\"la\">Recommendations<\/span>. Die übliche Gliederung lautet <span class=\"la\">Introduction<\/span>, <span class=\"la\">Findings<\/span>, <span class=\"la\">Conclusion<\/span>, <span class=\"la\">Recommendations<\/span>."},{"type":"mc","q":"Wie versprachlichst du 78 Prozent am besten?","s":"Anteile werden in Berichten als Bruchteile ausgedrückt. <span class=\"la\">Some<\/span> und <span class=\"la\">a few<\/span> sind zu vage, und die nackte Zahl ohne Bezug ist missverständlich.","o":["<span class=\"la\">more than three quarters<\/span>","<span class=\"la\">some people<\/span>","<span class=\"la\">78 of them<\/span>","<span class=\"la\">a few<\/span>"]},{"type":"mc","q":"Welche Empfehlung ist brauchbar?","h":"Konkret und umsetzbar.","s":"Nur die erste Fassung sagt, was genau geschehen soll. Die übrigen sind Bewertungen, mit denen eine Schulleitung nichts anfangen kann.","o":["<span class=\"la\">It is recommended that the canteen offer a hot vegetarian dish every day.<\/span>","<span class=\"la\">The canteen should be better.<\/span>","<span class=\"la\">Something has to change in the canteen.<\/span>","<span class=\"la\">The canteen is a disaster.<\/span>"]},{"type":"mc","q":"Was unterscheidet den Report vom Article am deutlichsten?","s":"Unpersönlicher Stil und Zwischenüberschriften sind die beiden Erkennungsmerkmale. Eine Anrede hat der Report nicht, das wäre ein Brief.","o":["Der Report ist unpersönlich und verwendet Zwischenüberschriften.","Der Report ist kürzer.","Der Artikel ist sachlicher.","Der Report braucht eine Anrede."]},{"type":"txt","a":["was carried out","was conducted"],"q":"Ergänze im Passiv: <span class=\"la\">A survey <span class=\"gap\">___<\/span> among 120 students in April.<\/span>","s":"<span class=\"la\">was carried out<\/span> oder <span class=\"la\">was conducted<\/span>. Das Passiv rückt die Untersuchung in den Mittelpunkt und lässt offen, wer sie durchgeführt hat."},{"type":"mc","q":"Welche Formulierung verallgemeinert angemessen vorsichtig?","h":"Vorsichtige Verallgemeinerung ist ein Merkmal der Textsorte.","s":"<span class=\"la\">tend to<\/span> gibt eine Tendenz an, ohne mehr zu behaupten, als die Daten hergeben. Absolute Aussagen wie <span class=\"la\">all<\/span> und <span class=\"la\">nobody<\/span> sind in einem Bericht fast immer falsch.","o":["<span class=\"la\">Students tend to prefer later starting times.<\/span>","<span class=\"la\">All students want later starting times.<\/span>","<span class=\"la\">Students obviously want later starting times.<\/span>","<span class=\"la\">Nobody likes early starting times.<\/span>"]},{"type":"self","q":"Schreibe den Abschnitt <span class=\"la\">Findings<\/span> eines Reports über die Mediennutzung an deiner Schule, ungefähr 100 Wörter, mit zwei Unterüberschrifte
