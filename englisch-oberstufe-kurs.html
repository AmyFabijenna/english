n und mindestens drei versprachlichten Zahlen. Die Zahlen darfst du erfinden.","s":"Prüfe am Ende: Steht in jedem Absatz genau ein Thema? Ist jede Zahl als Bruchteil oder Anteil ausgedrückt und nicht nur als nackte Prozentzahl? Kommt die ich-Form vor, und wenn ja, lässt sie sich durch eine unpersönliche Wendung ersetzen? Der Report ist die Textsorte, bei der sich Überarbeiten am meisten lohnt, weil der Ton so leicht abrutscht."}],"gen":["coll","wf"],"html":"<h3>Der Rahmen<\/h3>\n<p>Ein <span class=\"la\">report<\/span> wird für eine bestimmte Stelle geschrieben, die auf seiner Grundlage etwas entscheidet: die Schulleitung, ein Komitee, eine Organisation. Das Register ist <b class=\"e\">förmlich und unpersönlich<\/b>, der Zweck ist Information, nicht Unterhaltung.<\/p>\n<h3>Aufbau mit Zwischenüberschriften<\/h3>\n<p>Der Report ist die einzige Textsorte, in der Zwischenüberschriften ausdrücklich erwünscht sind.<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Abschnitt<\/th><th>Inhalt<\/th><\/tr><tr><td><span class=\"la\">Introduction<\/span><\/td><td>Zweck des Berichts und Herkunft der Informationen<\/td><\/tr><tr><td><span class=\"la\">Findings<\/span><\/td><td>die Ergebnisse, nach Themen gegliedert, oft mit zwei Unterüberschriften<\/td><\/tr><tr><td><span class=\"la\">Conclusion<\/span><\/td><td>Zusammenfassung der wichtigsten Punkte<\/td><\/tr><tr><td><span class=\"la\">Recommendations<\/span><\/td><td>konkrete Vorschläge, nummeriert oder als Liste<\/td><\/tr><\/table><\/div>\n<h3>Sprache des Reports<\/h3>\n<ul><li>unpersönlich statt ich-bezogen: <span class=\"la\">It was found that … · The majority of students reported that …<\/span><\/li><li>Passiv, wo die handelnde Person nicht wichtig ist: <span class=\"la\">A survey was carried out among 120 students.<\/span><\/li><li>vorsichtige Verallgemeinerungen: <span class=\"la\">tend to, appear to, on the whole, in most cases<\/span><\/li><li>keine Ausrufezeichen, keine rhetorischen Fragen, keine persönlichen Geschichten<\/li><\/ul>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>Der häufigste Fehler bei dieser Textsorte ist der falsche Ton. <span class=\"la\">I think the canteen is terrible<\/span> gehört in einen Kommentar. Im Report heißt derselbe Inhalt: <span class=\"la\">Satisfaction with the canteen was low, with only 18 per cent rating the food as good.<\/span><\/div>\n<h3>Zahlen versprachlichen<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Anteil<\/th><th>Formulierung<\/th><\/tr><tr><td>78 %<\/td><td><span class=\"la\">more than three quarters<\/span><\/td><\/tr><tr><td>52 %<\/td><td><span class=\"la\">just over half<\/span><\/td><\/tr><tr><td>48 %<\/td><td><span class=\"la\">just under half<\/span><\/td><\/tr><tr><td>33 %<\/td><td><span class=\"la\">one in three<\/span><\/td><\/tr><tr><td>25 %<\/td><td><span class=\"la\">a quarter<\/span><\/td><\/tr><tr><td>9 %<\/td><td><span class=\"la\">a small minority<\/span><\/td><\/tr><\/table><\/div>\n<div class=\"formula\"><span class=\"la\">The figures show that … · A clear majority of respondents … · Opinions were divided on … · The most frequently mentioned problem was …<\/span><\/div>\n<h3>Empfehlungen formulieren<\/h3>\n<div class=\"formula\"><span class=\"la\">It is recommended that the canteen offer a vegetarian option every day.<\/span><\/div>\n<div class=\"formula\"><span class=\"la\">The school should consider extending the lunch break.<\/span><\/div>\n<div class=\"formula\"><span class=\"la\">A further survey would be useful in order to …<\/span><\/div>\n<div class=\"note\"><b class=\"lab\">Merke<\/b>Empfehlungen müssen konkret und umsetzbar sein. <span class=\"la\">The school should do something about the canteen<\/span> ist keine Empfehlung, sondern eine Klage.<\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Einen Findings-Abschnitt schreiben<\/h4><div class=\"task\">Ergebnis: 62 Prozent finden die Mittagspause zu kurz, 30 Prozent finden das Essen zu teuer.<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div><b class=\"e\">Unterüberschrift setzen:<\/b> <span class=\"la\">Length of the lunch break<\/span><\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div><b class=\"e\">Ergebnis unpersönlich nennen, mit Zahl:<\/b> <span class=\"la\">Almost two thirds of the students surveyed felt that the current break of twenty minutes is too short.<\/span><\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div><b class=\"e\">Erläutern, was daraus folgt:<\/b> <span class=\"la\">Many of them said that they therefore buy food outside the school instead of using the canteen.<\/span><\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div><b class=\"e\">Zweites Ergebnis in einen eigenen Abschnitt:<\/b> <span class=\"la\">Prices. Just under a third considered the food too expensive.<\/span> Je ein Gedanke pro Abschnitt, jeder mit Zahl.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"essay","t":"Textsorte: Opinion essay und For-and-against essay","kl":"3","k":3,"a":"T","tag":"Fortgeschritten","goals":["die beiden Essaytypen unterscheiden","eine These formulieren und durchhalten","Argumente ordnen und belegen","einen Schluss schreiben, der mehr ist als eine Wiederholung"],"ex":[{"type":"mc","q":"Der Auftrag lautet <span class=\"la\">Discuss the advantages and disadvantages of online learning<\/span>. Wo steht deine eigene Meinung?","h":"Welcher Essaytyp ist das?","s":"Beim For-and-against essay werden zuerst beide Seiten dargestellt; die eigene Position gehört in den Schluss. Beim Opinion essay wäre es umgekehrt.","o":["erst im Schluss, als abwägendes Fazit","in der Einleitung als These","in jedem Absatz","gar nicht"]},{"type":"mc","q":"Welcher Satz ist ein brauchbarer topic sentence?","h":"Ein topic sentence nennt den Gedanken des Absatzes, nicht den Plan des Textes.","s":"Der erste Satz sagt, worum es im Absatz geht, und nimmt die Richtung vorweg. Ankündigungen des eigenen Vorgehens kosten Wörter, ohne etwas zu sagen.","o":["<span class=\"la\">The strongest argument against a ban is that it treats a symptom, not a cause.<\/span>","<span class=\"la\">Now I will write about the arguments against a ban.<\/span>","<span class=\"la\">There are many arguments.<\/span>","<span class=\"la\">Secondly.<\/span>"]},{"type":"mc","q":"Welcher Schluss ist am stärksten?","h":"Ein guter Schluss wägt ab und sagt etwas, das vorher noch nicht dastand.","s":"Die erste Fassung zieht eine Bilanz und knüpft eine Bedingung daran. Die übrigen fassen entweder das eigene Vorgehen zusammen oder sagen eine Selbstverständlichkeit.","o":["<span class=\"la\">On balance, the benefits outweigh the risks, provided that schools teach students how to use these tools.<\/span>","<span class=\"la\">To sum up, I have written about three arguments.<\/span>","<span class=\"la\">In conclusion, social media has advantages and disadvantages.<\/span>","<span class=\"la\">So that is my opinion about social media.<\/span>"]},{"type":"txt","a":["However","Nevertheless"],"q":"Ergänze die Entkräftung: <span class=\"la\">It is often claimed that screens ruin concentration. <span class=\"gap\">___<\/span>, the same was said about television.<\/span> Setze ein Wort ein.","s":"<span class=\"la\">However<\/span> oder <span class=\"la\">Nevertheless<\/span> leitet die Entkräftung ein. Beide stehen am Satzanfang mit Komma dahinter."},{"type":"mc","q":"Was ist der Unterschied zwischen <span class=\"la\">Admittedly<\/span> und <span class=\"la\">Moreover<\/span>?","s":"<span class=\"la\">Admittedly<\/span> gehört zur Behandlung des Gegenarguments, <span class=\"la\">Moreover<\/span> zur eigenen Argumentation. Wer die beiden verwechselt, verwirrt den Gedankengang.","o":["<span class=\"la\">Admittedly<\/span> räumt etwas ein, <span class=\"la\">Moreover<\/span> fügt ein weiteres Argument hinzu.","Beide fügen Argumente hinzu.","<span class=\"la\">Admittedly<\/span> fügt hinzu, <span class=\"la\">Moreover<\/span> räumt ein.","Beide leiten den Schluss ein."]},{"type":"mc","q":"Welche Variante von <span class=\"la\">I think<\/span> passt in einen Essay am wenigsten?","h":"Eine Fassung ist gesprochene Sprache.","s":"<span class=\"la\">I guess<\/span> ist umgangssprachlich und schwächt die Aussage. Die übrigen drei gehören zum schriftlichen Register.","o":["<span class=\"la\">I guess<\/span>","<span class=\"la\">In my view<\/span>","<span class=\"la\">To my mind<\/span>","<span class=\"la\">I am convinced that<\/span>"]},{"type":"txt","a":["On balance","Taking everything into account"],"q":"Ergänze eine Wendung für die abwägende Bilanz am Schluss: <span class=\"gap\">___<\/span>, the advantages are greater._ Setze zwei Wörter ein.","s":"<span class=\"la\">On balance<\/span> ist die knappste Form. Länger wäre <span class=\"la\">Taking everything into account<\/span> oder <span class=\"la\">All things considered<\/span>."},{"type":"self","q":"Schreibe die Einleitung (ungefähr 45 Wörter) und einen vollständigen Argumentabsatz (ungefähr 65 Wörter) zu dieser Aufgabe: <span class=\"la\">Some people say that students should do voluntary work before starting university. To what extent do you agree?<\/span>","s":"Prüfe die Einleitung: Nennt sie das Thema und deine These, ohne schon zu argumentieren? Prüfe den Absatz am Vierschritt: Steht im ersten Satz die Behauptung? Folgt eine Begründung, dann ein Beispiel, dann eine Folgerung? Wenn ein Schritt fehlt, merkt man es sofort daran, dass der Absatz entweder behauptend oder erzählend wirkt."}],"gen":["coll","wf"],"html":"<h3>Zwei Typen, zwei Aufbauten<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th><\/th><th>Opinion essay<\/th><th>For-and-against essay<\/th><\/tr><tr><td>Auftrag<\/td><td><span class=\"la\">give your opinion<\/span>, <span class=\"la\">to what extent do you agree<\/span><\/td><td><span class=\"la\">discuss the advantages and disadvantages<\/span><\/td><\/tr><tr><td>Haltung<\/td><td>von Anfang an klar<\/td><td>erst im Schluss<\/td><\/tr><tr><td>Aufbau<\/td><td>These, Argumente, Gegenargument entkräften, Schluss<\/td><td>Vorteile, Nachteile, abwägender Schluss<\/td><\/tr><\/table><\/div>\n<div class=\"note\"><b class=\"lab\">Merke<\/b>Der häufigste Aufbaufehler: ein For-and-against essay, der schon in der Einleitung Partei ergreift, oder ein Opinion essay, der die eigene Meinung erst im letzten Satz verrät. Lies den Auftrag und entscheide zuerst, welcher der beiden Typen gefragt ist.<\/div>\n<h3>Der Aufbau im Einzelnen<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Teil<\/th><th>Opinion essay<\/th><th>Umfang bei 300 Wörtern<\/th><\/tr><tr><td>Einleitung<\/td><td>Thema vorstellen, These nennen<\/td><td>45<\/td><\/tr><tr><td>Argument 1<\/td><td>stärkstes Argument, mit Beispiel<\/td><td>65<\/td><\/tr><tr><td>Argument 2<\/td><td>zweites Argument, mit Beleg<\/td><td>65<\/td><\/tr><tr><td>Gegenargument<\/td><td>nennen und entkräften<\/td><td>60<\/td><\/tr><tr><td>Schluss<\/td><td>These bekräftigen, Ausblick<\/td><td>45<\/td><\/tr><\/table><\/div>\n<h3>Jeder Absatz nach demselben Muster<\/h3>\n<div class=\"formula\"><b class=\"e\">Behauptung<\/b> (topic sentence) – <b class=\"e\">Begründung<\/b> – <b class=\"e\">Beispiel<\/b> – <b class=\"e\">Folgerung<\/b><\/div>\n<p><span class=\"la\">The strongest argument for later school hours is sleep. Teenagers' body clocks shift during puberty, which makes early mornings particularly hard on them. In our own class, half of us arrive without having had breakfast. If lessons started an hour later, that hour would not be lost; it would simply be used for sleeping instead of commuting.<\/span><\/p>\n<h3>Redemittel<\/h3>\n<div class=\"formula\">These: <span class=\"la\">In my view, … · This essay argues that … · There are strong reasons to believe that …<\/span><\/div>\n<div class=\"formula\">Argument: <span class=\"la\">The main reason for this is … · A further point in favour of … · Research suggests that …<\/span><\/div>\n<div class=\"formula\">Gegenargument: <span class=\"la\">It is often claimed that … · Admittedly, … · Critics argue that …<\/span><\/div>\n<div class=\"formula\">Entkräftung: <span class=\"la\">However, this overlooks the fact that … · This argument does not hold because …<\/span><\/div>\n<div class=\"formula\">Abwägen: <span class=\"la\">While it is true that …, it is equally true that …<\/span><\/div>\n<div class=\"formula\">Schluss: <span class=\"la\">On balance, … · Taking everything into account, … · The evidence suggests that …<\/span><\/div>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>Vermeide <span class=\"la\">I think<\/span> in jedem zweiten Satz. Für das Kriterium Spektrum ist Abwechslung entscheidend: <span class=\"la\">in my view, to my mind, it seems to me, I am convinced that, from my point of view<\/span>.<\/div>\n<h3>Was einen schwachen Essay verrät<\/h3>\n<ul><li>Argumente, die nur behauptet und nie belegt werden<\/li><li>ein Schluss, der die Einleitung mit anderen Worten wiederholt<\/li><li>Absätze mit mehr als einem Gedanken<\/li><li>Aufzählungen statt Gedankenführung: <span class=\"la\">Firstly … Secondly … Thirdly …<\/span> ohne Verbindung dazwischen<\/li><\/ul>\n<div class=\"walk\"><h4>Schritt für Schritt: Einen Absatz nach dem Vierschritt bauen<\/h4><div class=\"task\">Behauptung: Soziale Medien schaden der Konzentrationsfähigkeit.<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div><b class=\"e\">Behauptung:<\/b> <span class=\"la\">The most serious effect of social media is what it does to our attention.<\/span><\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div><b class=\"e\">Begründung:<\/b> <span class=\"la\">Platforms are designed to interrupt; every notification trains us to switch tasks.<\/span><\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div><b class=\"e\">Beispiel:<\/b> <span class=\"la\">When I tried to read a chapter without my phone last week, I reached for it eleven times in forty minutes.<\/span><\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div><b class=\"e\">Folgerung:<\/b> <span class=\"la\">If a single chapter is that hard, it is worth asking what happens to longer, slower kinds of thinking.<\/span> Vier Sätze, ein Gedanke, kein Füllmaterial.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"summary","t":"Textsorte: Summary","kl":"3","k":3,"a":"T","tag":"Fortgeschritten","goals":["einen Text auf seinen Kern reduzieren","in eigenen Worten formulieren","die typischen Fallen der Zusammenfassung vermeiden","das geforderte Verhältnis von Länge und Inhalt treffen"],"ex":[{"type":"mc","q":"Was gehört <b class=\"e\">nicht<\/b> in eine Summary?","h":"Zusammenfassen und Stellung nehmen sind zwei verschiedene Aufträge.","s":"Die eigene Meinung gehört in Kommentar, Essay oder Leserbrief. Die Summary bleibt beim Text.","o":["die eigene Bewertung des Textes","die Hauptaussage","der Standpunkt des Autors","der Aufbau des Gedankengangs"]},{"type":"mc","q":"Welcher erste Satz einer Summary ist am besten?","h":"Textsorte, Thema und Kernaussage in einem Satz.","s":"Der erste Satz muss das Wichtigste bereits enthalten. Ankündigungen und allgemeine Einstiege verschenken den wertvollsten Satz des Textes.","o":["<span class=\"la\">The article „Phones out of the classroom“ argues that phones should be banned because they harm concentration.<\/span>","<span class=\"la\">This text is very interesting and about phones.<\/span>","<span class=\"la\">I am going to summarise an article about phones at school.<\/span>","<span class=\"la\">Phones are a big problem nowadays.<\/span>"]},{"type":"txt","a":["argues","claims","points out","suggests"],"q":"Ergänze ein Verb der Redewiedergabe: <span class=\"la\">The author <span class=\"gap\">___<\/span> that the problem has been exaggerated.<\/span>","s":"Möglich sind unter anderem <span class=\"la\">argues<\/span>, <span class=\"la\">claims<\/span>, <span class=\"la\">points out<\/span> und <span class=\"la\">suggests<\/span>. Solche Verben machen deutlich, dass es sich um die Position des Autors handelt und nicht um deine."},{"type":"mc","q":"Wie lang soll eine Summary ungefähr sein?","s":"Ein Viertel bis ein Drittel ist der übliche Rahmen, sofern die Angabe nichts anderes vorgibt. Entscheidend ist aber immer die Wortzahl in der Aufgabenstellung.","o":["etwa ein Viertel bis ein Drittel des Originals","ungefähr gleich lang wie das Original","höchstens drei Sätze, unabhängig vom Original","mindestens die Hälfte"]},{"type":"mc","q":"Welche Umformulierung ist am besten?","h":"In eigenen Worten heißt: anderer Wortschatz, gleiche Bedeutung.","s":"<span class=\"la\">harms<\/span> sagt dasselbe mit eigenen Mitteln. Die zweite und dritte Fassung tauschen nur ein Wort aus, die vierte verliert die negative Bedeutung.","o":["<span class=\"la\">has a detrimental effect on<\/span> → <span class=\"la\">harms<\/span>","<span class=\"la\">has a detrimental effect on<\/span> → <span class=\"la\">has a detrimental influence on<\/span>","<span class=\"la\">has a detrimental effect on<\/span> → <span class=\"la\">is detrimental for<\/span>","<span class=\"la\">has a detrimental effect on<\/span> → <span class=\"la\">has an effect on<\/span>"]},{"type":"mc","q":"Du hast die Hälfte der Zeit verbraucht und erst die Hälfte des Textes zusammengefasst. Was tust du?","h":"Eine Summary, die den Schluss des Originals auslässt, verfehlt die Aufgabe.","s":"Besser der ganze Text knapp als der halbe ausführlich. Wer das Ende weglässt, verliert beim wichtigsten Kriterium, weil die Kernaussage oft dort steht.","o":["Die restlichen Abschnitte in Stichworten erfassen und stark verdichtet schreiben.","Weiterschreiben wie bisher und das Ende weglassen.","Noch einmal von vorne beginnen und kürzen.","Den Schlussteil wörtlich übernehmen."]},{"type":"self","q":"Nimm einen Zeitungsartikel von ungefähr 500 Wörtern und fasse ihn in 120 bis 150 Wörtern zusammen. Markiere danach alle Stellen, an denen du Wörter des Originals übernommen hast.","s":"Zwei Prüfungen: Enthält dein erster Satz Textsorte, Thema und Kernaussage? Und wie viele markierte Stellen gibt es? Einzelne Fachwörter sind unvermeidlich, ganze Wendungen nicht. Wenn du mehr als drei Wendungen markieren musst, formuliere diese Stellen noch einmal neu, bevor du mit dem nächsten Text weitermachst."}],"gen":["wf","coll"],"html":"<h3>Was eine Summary leistet<\/h3>\n<p>Eine Zusammenfassung gibt den <b class=\"e\">Inhalt eines Textes<\/b> so wieder, dass jemand, der ihn nicht gelesen hat, weiß, worum es geht. Sie enthält keine eigene Meinung, keine Beispiele aus dem Original und keine wörtlichen Übernahmen.<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>gehört hinein<\/th><th>bleibt draußen<\/th><\/tr><tr><td>Hauptaussage und Hauptargumente<\/td><td>Einzelbeispiele, Zitate<\/td><\/tr><tr><td>Standpunkt des Autors, als solcher benannt<\/td><td>die eigene Meinung<\/td><\/tr><tr><td>Struktur des Gedankengangs<\/td><td>Wiederholungen, Ausschmückungen<\/td><\/tr><\/table><\/div>\n<div class=\"note\"><b class=\"lab\">Merke<\/b>Die Faustregel: Eine Summary ist etwa ein Viertel bis ein Drittel so lang wie das Original und verwendet höchstens einzelne unvermeidliche Fachwörter wörtlich.<\/div>\n<h3>Die vier Arbeitsschritte<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Schritt<\/th><th>Was du tust<\/th><\/tr><tr><td>1 Lesen<\/td><td>Den Text einmal ganz lesen, ohne zu markieren<\/td><\/tr><tr><td>2 Gliedern<\/td><td>Abschnitte abgrenzen und jedem in Stichworten einen Inhalt zuordnen<\/td><\/tr><tr><td>3 Verdichten<\/td><td>Zu jedem Abschnitt einen Satz formulieren, in eigenen Worten<\/td><\/tr><tr><td>4 Verbinden<\/td><td>Die Sätze zu einem Text verknüpfen und den Kern an den Anfang stellen<\/td><\/tr><\/table><\/div>\n<h3>Der erste Satz<\/h3>\n<p>Er nennt Textsorte, Thema und Kernaussage:<\/p>\n<div class=\"formula\"><span class=\"la\">The article „Phones out of the classroom“ argues that mobile phones should be banned from schools because they damage concentration.<\/span><\/div>\n<h3>Sprachliche Mittel<\/h3>\n<div class=\"formula\">Redewiedergabe: <span class=\"la\">The author claims / points out / argues / suggests / warns that …<\/span><\/div>\n<div class=\"formula\">Gliederung: <span class=\"la\">The text first describes …, then goes on to … and finally concludes that …<\/span><\/div>\n<div class=\"formula\">Verdichtung: <span class=\"la\">Several examples illustrate …<\/span> statt die Beispiele einzeln zu nennen<\/div>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>Drei Fallen: die eigene Meinung einschmuggeln, ganze Wendungen des Originals übernehmen und nur den Anfang zusammenfassen, weil die Zeit knapp wurde. Gegen die dritte hilft, zuerst alle Abschnitte in Stichworten zu erfassen und erst dann zu schreiben.<\/div>\n<h3>In eigenen Worten formulieren<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Original<\/th><th>Umformulierung<\/th><\/tr><tr><td><span class=\"la\">an increasing number of young people<\/span><\/td><td><span class=\"la\">more and more teenagers<\/span><\/td><\/tr><tr><td><span class=\"la\">has a detrimental effect on<\/span><\/td><td><span class=\"la\">harms<\/span><\/td><\/tr><tr><td><span class=\"la\">it is of crucial importance<\/span><\/td><td><span class=\"la\">it matters a great deal<\/span><\/td><\/tr><tr><td><span class=\"la\">numerous studies have demonstrated<\/span><\/td><td><span class=\"la\">research shows<\/span><\/td><\/tr><\/table><\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Einen Abschnitt verdichten<\/h4><div class=\"task\">Abschnitt: Der Autor schildert drei Schulen, die Handys verboten haben, berichtet von sinkenden Konfliktzahlen und zitiert einen Direktor, der von „ruhigeren Gängen“ spricht.<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div><b class=\"e\">Kern suchen:<\/b> Worin stimmen die drei Schulen überein? In der Beobachtung, dass es ruhiger wurde.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div><b class=\"e\">Beispiele zusammenfassen statt aufzählen:<\/b> Aus drei Schulen wird <span class=\"la\">schools which have introduced such bans<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div><b class=\"e\">Zitat weglassen oder in eigene Worte fassen:<\/b> Statt der wörtlichen Rede genügt die Aussage.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div><b class=\"e\">Ein Satz:<\/b> <span class=\"la\">Schools that have introduced bans report fewer conflicts and a calmer atmosphere.<\/span> Aus einem ganzen Abschnitt wird ein Satz; genau das ist die Leistung dieser Textsorte.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"textsorten","t":"Leaflet, Review und die übrigen Textsorten","kl":"3","k":3,"a":"T","tag":"Fortgeschritten","goals":["die selteneren Textsorten erkennen und bedienen","Leaflet und Review gestalten","die Merkmale aller Textsorten in einer Übersicht behalten","bei einer unbekannten Angabe die richtige Form ableiten"],"ex":[{"type":"mc","q":"In welcher Textsorte sind Aufzählungspunkte und Imperative angebracht?","h":"Welcher Text wird überflogen statt gelesen?","s":"Das Leaflet ist auf schnelles Erfassen angelegt. In Essay, Report und Summary wären Aufzählungspunkte ein Stilbruch.","o":["Leaflet","Essay","Report","Summary"]},{"type":"mc","q":"Was gehört in eine Review <b class=\"e\">nicht<\/b>?","s":"Wer das Ende verrät, nimmt der Leserschaft genau das, wofür sie die Besprechung liest. Alles andere gehört zur Textsorte.","o":["die Auflösung des Endes","eine begründete Bewertung","eine knappe Inhaltsangabe","eine Empfehlung für eine bestimmte Zielgruppe"]},{"type":"mc","q":"Du sollst an die Schulleitung über eine Umfrage berichten. Welche Textsorte ist das?","h":"Wer liest, und was soll danach geschehen?","s":"Eine Stelle, die auf Grundlage des Textes entscheidet, plus Daten plus Empfehlungen: Das ist ein Report, mit Zwischenüberschriften und unpersönlichem Stil.","o":["Report","Article","Blog comment","Review"]},{"type":"mc","q":"Welche Textsorte verlangt den Verzicht auf die eigene Meinung?","s":"Die Summary gibt nur den fremden Text wieder. In den drei anderen Textsorten ist die eigene Position ausdrücklich gefragt.","o":["Summary","Essay","Letter to the editor","Blog comment"]},{"type":"txt","a":["Review","review"],"q":"Wie heißt die Textsorte, in der ein Film oder ein Buch bewertet wird? Antworte auf Englisch.","s":"Die <span class=\"la\">review<\/span> verbindet eine knappe Inhaltsangabe mit einer begründeten Bewertung und einer Empfehlung."},{"type":"mc","q":"Welcher Satz passt in eine Review?","h":"Bewertung plus Begründung.","s":"Die erste Fassung bewertet in beide Richtungen und begründet. Pauschale Urteile ohne Begründung und Nacherzählungen verfehlen die Textsorte.","o":["<span class=\"la\">The plot is predictable, but the two leads make it worth watching.<\/span>","<span class=\"la\">The film was good.<\/span>","<span class=\"la\">I will now tell you the whole story.<\/span>","<span class=\"la\">Everyone should watch this film.<\/span>"]},{"type":"mc","q":"Die Angabe nennt eine Textsorte, die du nicht kennst. Was tust du zuerst?","s":"Adressat, Zweck und Nähe bestimmen jede Textsorte. Wer diese drei Fragen beantwortet, trifft Register und Aufbau auch bei einer unbekannten Bezeichnung.","o":["Du bestimmst Adressat, Zweck und Nähe und leitest daraus Register und Aufbau ab.","Du schreibst einen Essay, der passt immer.","Du fragst die Aufsichtsperson nach der Textsorte.","Du schreibst eine Liste der Bullet Points ohne Text."]},{"type":"self","q":"Erstelle für dich eine einseitige Übersicht aller neun Textsorten mit je drei Stichworten: Adressat, Register, Erkennungsmerkmal. Schreibe sie von Hand.","s":"Das Abschreiben ist hier der eigentliche Lerneffekt, weil du die Unterschiede beim Formulieren bemerkst. Hänge das Blatt an deinen Arbeitsplatz und ergänze es, sobald dir in einer Übung ein typisches Merkmal auffällt, etwa eine Wendung, die nur in einer Textsorte vorkommt."}],"gen":["coll","phr"],"html":"<h3>Leaflet<\/h3>\n<p>Ein <span class=\"la\">leaflet<\/span> wirbt oder informiert und wird überflogen, nicht gelesen. Daraus folgt alles Weitere:<\/p>\n<ul><li><b class=\"e\">Zwischenüberschriften<\/b> und kurze Blöcke<\/li><li><b class=\"e\">direkte Ansprache<\/b>: <span class=\"la\">Come and see for yourself!<\/span><\/li><li><b class=\"e\">Imperative<\/b>: <span class=\"la\">Book now. Bring a friend. Don't miss …<\/span><\/li><li><b class=\"e\">Aufzählungen<\/b> statt langer Sätze<\/li><li><b class=\"e\">praktische Angaben<\/b> am Schluss: Ort, Zeit, Preis, Kontakt<\/li><\/ul>\n<div class=\"note\"><b class=\"lab\">Merke<\/b>Das Leaflet ist die einzige Textsorte, in der Aufzählungspunkte und Ausrufezeichen ausdrücklich erlaubt sind. In allen anderen gelten sie als Stilbruch.<\/div>\n<h3>Review<\/h3>\n<p>Eine <span class=\"la\">review<\/span> bewertet ein Buch, einen Film, ein Lokal oder eine Veranstaltung für Leserinnen, die noch unentschlossen sind.<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Teil<\/th><th>Inhalt<\/th><\/tr><tr><td>Einstieg<\/td><td>Was wird besprochen, und warum lohnt es sich, weiterzulesen?<\/td><\/tr><tr><td>Inhalt<\/td><td>kurz, <b class=\"e\">ohne das Ende zu verraten<\/b><\/td><\/tr><tr><td>Bewertung<\/td><td>was gelungen ist, was nicht, jeweils mit Begründung<\/td><\/tr><tr><td>Empfehlung<\/td><td>für wen geeignet, für wen nicht<\/td><\/tr><\/table><\/div>\n<div class=\"formula\"><span class=\"la\">The film is at its best when it slows down. · The plot is predictable, yet the two main characters make up for it. · If you liked …, you will probably enjoy this.<\/span><\/div>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>Eine Review, die nur den Inhalt nacherzählt, verfehlt die Textsorte. Mindestens die Hälfte gehört der Bewertung, und jede Bewertung braucht eine Begründung.<\/div>\n<h3>Die Übersicht aller Textsorten<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Textsorte<\/th><th>Adressat<\/th><th>Register<\/th><th>Erkennungsmerkmal<\/th><\/tr><tr><td>Article<\/td><td>Leserschaft einer Zeitung<\/td><td>halbformell<\/td><td>Überschrift, lebendiger Einstieg<\/td><\/tr><tr><td>Blog comment<\/td><td>Verfasserin und Leserinnen<\/td><td>persönlich<\/td><td>Bezug auf den Beitrag<\/td><\/tr><tr><td>Email / Letter<\/td><td>eine bestimmte Person oder Stelle<\/td><td>formell bis halbformell<\/td><td>Anrede, Grußformel<\/td><\/tr><tr><td>Letter to the editor<\/td><td>Redaktion und Öffentlichkeit<\/td><td>formell<\/td><td>Bezug auf einen Artikel<\/td><\/tr><tr><td>Report<\/td><td>auftraggebende Stelle<\/td><td>formell, unpersönlich<\/td><td>Zwischenüberschriften, Empfehlungen<\/td><\/tr><tr><td>Essay<\/td><td>allgemeine gebildete Leserschaft<\/td><td>formell<\/td><td>These und Argumentation<\/td><\/tr><tr><td>Summary<\/td><td>wer den Text nicht kennt<\/td><td>neutral<\/td><td>keine eigene Meinung<\/td><\/tr><tr><td>Leaflet<\/td><td>Publikum, das überfliegt<\/td><td>werbend<\/td><td>Imperative, Aufzählungen<\/td><\/tr><tr><td>Review<\/td><td>unentschlossene Leserschaft<\/td><td>halbformell<\/td><td>Bewertung mit Begründung<\/td><\/tr><\/table><\/div>\n<h3>Wenn du die Textsorte nicht kennst<\/h3>\n<p>Leite sie aus drei Fragen ab: Wer liest das? Was soll die lesende Person danach tun oder wissen? Wie nah stehe ich ihr? Daraus ergeben sich Register, Aufbau und Anrede fast von selbst.<\/p>\n<div class=\"walk\"><h4>Schritt für Schritt: Ein Leaflet gliedern<\/h4><div class=\"task\">Werbe für den Tag der offenen Tür an deiner Schule.<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div><b class=\"e\">Titel, der etwas verspricht:<\/b> <span class=\"la\">Open Day: see what happens behind our doors<\/span><\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div><b class=\"e\">Kurze Blöcke mit Zwischenüberschriften:<\/b> <span class=\"la\">What you can try · Who you can talk to · How to get here<\/span><\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div><b class=\"e\">Direkte Ansprache und Imperative:<\/b> <span class=\"la\">Build a robot in ten minutes. Ask our students anything.<\/span><\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div><b class=\"e\">Praktische Angaben am Schluss:<\/b> <span class=\"la\">Saturday 14 March, 9 a.m. to 1 p.m., free entry, no registration needed.<\/span> Wer das Blatt überfliegt, muss in zehn Sekunden wissen, ob er kommt.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"liu","t":"Language in Use: die vier Aufgabenformate","kl":"4","k":4,"a":"U","tag":"Basis","goals":["die vier Formate des Prüfungsteils erkennen","bei jedem die richtige Lesetechnik anwenden","typische Stolperstellen vermeiden","die Zeit sinnvoll einteilen"],"ex":[{"type":"mc","q":"Welche Technik passt zum banked gap fill?","h":"Es bleiben mehr Wörter übrig, als Lücken da sind.","s":"Weil die Liste Ablenkungen enthält, ist das Ausschließen nach Wortarten der schnellste Weg. Die Bedeutung entscheidet erst im zweiten Schritt.","o":["zuerst die Wortart jeder Lücke bestimmen, dann die Liste danach sortieren","die Lücken der Reihe nach füllen, ohne die Liste vorher zu lesen","die Liste auswendig lernen und dann den Text lesen","zuerst alle Wörter übersetzen"]},{"type":"txt","a":["of"],"q":"Open gap fill: <span class=\"la\">In spite <span class=\"gap\">___<\/span> the rain, the match went ahead.<\/span>","s":"<span class=\"la\">in spite of<\/span> ist eine feste Wendung. Beachte: <span class=\"la\">despite<\/span> steht ohne <span class=\"la\">of<\/span>."},{"type":"txt","a":["whose"],"q":"Open gap fill: <span class=\"la\">That is the woman <span class=\"gap\">___<\/span> car was stolen last week.<\/span>","h":"Gesucht ist ein Relativpronomen, das Besitz ausdrückt.","s":"<span class=\"la\">whose<\/span> verbindet die Person mit ihrem Besitz. <span class=\"la\">who's<\/span> wäre die Kurzform von <span class=\"la\">who is<\/span> und hier falsch."},{"type":"txt","a":["but"],"q":"Open gap fill: <span class=\"la\">Not only did he arrive late, <span class=\"gap\">___<\/span> he also forgot the tickets.<\/span>","s":"Die feste Verbindung lautet <span class=\"la\">not only … but also<\/span>. Beachte außerdem die Inversion nach <span class=\"la\">not only<\/span> am Satzanfang."},{"type":"txt","a":["impossible"],"q":"Word formation: <span class=\"la\">It was <span class=\"gap\">___<\/span> (possible) to reach anyone at that hour.<\/span>","h":"Prüfe, ob der Satz eine Verneinung verlangt.","s":"<span class=\"la\">impossible<\/span>. Vor p steht die Vorsilbe <span class=\"la\">im-<\/span>. Wer nur <span class=\"la\">possible<\/span> einsetzt, bildet die Wortart richtig und dreht die Aussage um."},{"type":"txt","a":["did"],"q":"Editing: Welches Wort ist in dieser Zeile überflüssig? <span class=\"la\">She did not went to the meeting yesterday.<\/span> Schreibe das überflüssige Wort auf, oder wenn das nicht geht, die falsche Form.","h":"Zwei Signale der Vergangenheit stehen im selben Satz.","s":"Richtig wäre <span class=\"la\">She did not go<\/span>. Die Vergangenheit steckt bereits in <span class=\"la\">did<\/span>, deshalb muss das Vollverb in der Grundform stehen."},{"type":"mc","q":"Welche Zeile enthält einen Editing-Fehler?","h":"Ein Verb steht ohne Präposition.","s":"<span class=\"la\">discuss<\/span> steht ohne <span class=\"la\">about<\/span>. <span class=\"la\">talk<\/span> und <span class=\"la\">argue<\/span> dagegen verlangen es, deshalb sind diese Zeilen richtig.","o":["<span class=\"la\">We discussed about the proposal for an hour.<\/span>","<span class=\"la\">We discussed the proposal for an hour.<\/span>","<span class=\"la\">We talked about the proposal for an hour.<\/span>","<span class=\"la\">We argued about the proposal for an hour.<\/span>"]},{"type":"self","q":"Nimm eine Seite aus einem englischen Text und streiche zehn Funktionswörter heraus. Lege das Blatt einen Tag weg und fülle die Lücken dann selbst.","s":"Diese Übung ahmt das open gap fill genau nach und zeigt dir, welche Wortarten dir fehlen. Wenn du bei Präpositionen hängst, übe die festen Verbindungen; wenn du bei Relativpronomen hängst, wiederhole das Kapitel dazu. Die eigene Fehlerverteilung ist wertvoller als jede allgemeine Regel."}],"gen":["wf","prep"],"html":"<h3>Die vier Formate<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Format<\/th><th>Was du bekommst<\/th><th>Was du tust<\/th><\/tr><tr><td>Banked gap fill<\/td><td>ein Text mit Lücken und eine Wortliste<\/td><td>Für jede Lücke ein Wort aus der Liste wählen; es bleiben mehr Wörter übrig als Lücken<\/td><\/tr><tr><td>Open gap fill<\/td><td>ein Text mit Lücken ohne Vorgaben<\/td><td>Selbst ein Wort einsetzen, meist ein Funktionswort<\/td><\/tr><tr><td>Word formation<\/td><td>ein Text mit Lücken, daneben ein Grundwort<\/td><td>Die passende abgeleitete Form bilden<\/td><\/tr><tr><td>Editing<\/td><td>ein Text, in dem Zeilen Fehler enthalten<\/td><td>Das überflüssige oder falsche Wort finden<\/td><\/tr><\/table><\/div>\n<h3>Banked gap fill<\/h3>\n<p>Die Liste enthält mehr Wörter als Lücken, oft doppelt so viele. Deshalb ist Ausschließen die wirksamste Technik.<\/p>\n<ul><li>Bestimme zuerst die <b class=\"e\">Wortart<\/b> jeder Lücke, nicht die Bedeutung.<\/li><li>Sortiere die Liste nach Wortarten vor.<\/li><li>Beginne mit den Lücken, bei denen nur ein Wort in Frage kommt.<\/li><li>Beachte feste Verbindungen: Steht vor der Lücke <span class=\"la\">depend<\/span>, heißt das Wort <span class=\"la\">on<\/span>.<\/li><\/ul>\n<h3>Open gap fill<\/h3>\n<p>Hier fehlen fast immer <b class=\"e\">Funktionswörter<\/b>: Artikel, Präpositionen, Hilfsverben, Relativpronomen, Konjunktionen, Teile fester Wendungen.<\/p>\n<div class=\"formula\"><span class=\"la\">in spite <span class=\"gap\">___<\/span> the weather<\/span> → <span class=\"la\">of<\/span> · <span class=\"la\">the man <span class=\"gap\">___<\/span> car was stolen<\/span> → <span class=\"la\">whose<\/span> · <span class=\"la\">not only … <span class=\"gap\">___<\/span> also<\/span> → <span class=\"la\">but<\/span><\/div>\n<div class=\"note t\"><b class=\"lab\">Tipp<\/b>Wenn dir nichts einfällt, prüfe die Reihenfolge: Hilfsverb? Präposition? Relativpronomen? Artikel? Diese vier decken den größten Teil aller Lücken ab.<\/div>\n<h3>Word formation<\/h3>\n<p>Bestimme zuerst die Wortart der Lücke aus ihrer Umgebung, dann die Endung. Prüfe zum Schluss zwei Dinge, die oft vergessen werden: Braucht das Wort eine <b class=\"e\">Verneinungsvorsilbe<\/b>? Muss es im <b class=\"e\">Plural<\/b> stehen?<\/p>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>In jeder Prüfung gibt es mindestens eine Lücke, bei der die Verneinung nötig ist: <span class=\"la\">It was … (possible) to find a solution.<\/span> Wer nur <span class=\"la\">possible<\/span> einsetzt, hat die Form richtig gebildet und den Satz zerstört.<\/div>\n<h3>Editing<\/h3>\n<p>Jede Zeile enthält entweder ein überflüssiges Wort oder keines. Gesucht sind meist:<\/p>\n<ul><li>doppelte Hilfsverben: <span class=\"la\">she did went<\/span><\/li><li>überflüssige Präpositionen: <span class=\"la\">discuss about<\/span><\/li><li>doppelte Verneinung: <span class=\"la\">did not say nothing<\/span><\/li><li>falsche Artikel: <span class=\"la\">the life is hard<\/span><\/li><li>überflüssige Pronomen: <span class=\"la\">the book which I read it<\/span><\/li><\/ul>\n<div class=\"walk\"><h4>Schritt für Schritt: Eine Lücke im open gap fill lösen<\/h4><div class=\"task\"><span class=\"la\">She succeeded <span class=\"gap\">___<\/span> convincing the whole committee.<\/span><\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Bestimme die Wortart: Nach der Lücke steht eine <span class=\"la\">-ing<\/span>-Form, also ist eine Präposition zu erwarten.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Prüfe die feste Verbindung: <span class=\"la\">succeed in doing something<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Lass dich nicht vom Deutschen leiten: „Erfolg haben mit“ legt <span class=\"la\">with<\/span> nahe, das ist aber falsch.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Ergebnis: <span class=\"la\">She succeeded in convincing the whole committee.<\/span> Bei diesem Format entscheidet fast immer die feste Verbindung, nicht die Bedeutung.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"linking","t":"Verknüpfen: Konnektoren und Textfluss","kl":"4","k":4,"a":"U","tag":"Aufbau","goals":["Sätze und Absätze sinnvoll verbinden","die Konnektoren nach Bedeutung ordnen","die Zeichensetzung bei Konnektoren beherrschen","Wiederholungen durch Verweise vermeiden"],"ex":[{"type":"mc","q":"Welcher Satz ist richtig?","h":"Nach <span class=\"la\">despite<\/span> steht kein Satz.","s":"<span class=\"la\">despite<\/span> ist eine Präposition und verlangt ein Substantiv oder eine <span class=\"la\">-ing<\/span>-Form. <span class=\"la\">in spite of<\/span> bedeutet dasselbe, hat aber das <span class=\"la\">of<\/span>.","o":["<span class=\"la\">Despite the heavy rain, we went for a walk.<\/span>","<span class=\"la\">Despite it rained heavily, we went for a walk.<\/span>","<span class=\"la\">Despite of the rain, we went for a walk.<\/span>","<span class=\"la\">Despite that it rained, we went for a walk.<\/span>"]},{"type":"mc","q":"Welche Fassung verbindet richtig?","h":"Achte auf Punkt und Komma.","s":"<span class=\"la\">however<\/span> als Satzadverb beginnt einen neuen Satz und bekommt ein Komma hinter sich. Mit einem Komma davor würde man zwei Hauptsätze falsch verbinden.","o":["<span class=\"la\">It was late. However, we kept going.<\/span>","<span class=\"la\">It was late, however we kept going.<\/span>","<span class=\"la\">It was late however, we kept going.<\/span>","<span class=\"la\">It was late. However we kept going.<\/span>"]},{"type":"txt","a":["whereas","while"],"q":"Verbinde mit einem Wort des Gegensatzes: <span class=\"la\">My sister likes maths, <span class=\"gap\">___<\/span> I prefer languages.<\/span>","s":"<span class=\"la\">whereas<\/span> oder <span class=\"la\">while<\/span> stellen zwei Sachverhalte einander gegenüber. Beide leiten einen Nebensatz ein."},{"type":"mc","q":"Welcher Konnektor drückt eine Folge aus?","s":"<span class=\"la\">consequently<\/span> bezeichnet die Folge. <span class=\"la\">nevertheless<\/span> ist Gegensatz, <span class=\"la\">moreover<\/span> Hinzufügung, <span class=\"la\">for instance<\/span> Beispiel.","o":["<span class=\"la\">consequently<\/span>","<span class=\"la\">nevertheless<\/span>","<span class=\"la\">moreover<\/span>","<span class=\"la\">for instance<\/span>"]},{"type":"txt","a":["because of","due to","owing to"],"q":"Setze eine Präposition des Grundes ein: <span class=\"la\">The match was cancelled <span class=\"gap\">___<\/span> the storm.<\/span>","h":"Nach der Lücke steht ein Substantiv.","s":"<span class=\"la\">because of<\/span>, <span class=\"la\">due to<\/span> oder <span class=\"la\">owing to<\/span> stehen vor Substantiven. Vor einem ganzen Satz stünde <span class=\"la\">because<\/span>."},{"type":"mc","q":"Welcher Satz ist richtig?","h":"Eine deutsche Kommaregel gilt hier nicht.","s":"Vor <span class=\"la\">that<\/span> steht im Englischen kein Komma. Dieser Fehler stammt direkt aus der deutschen Zeichensetzung und kommt in fast jeder Arbeit vor.","o":["<span class=\"la\">I think that she is right.<\/span>","<span class=\"la\">I think, that she is right.<\/span>","<span class=\"la\">I think ,that she is right.<\/span>","<span class=\"la\">I think that, she is right.<\/span>"]},{"type":"mc","q":"Welcher Absatzanfang verknüpft am besten mit dem vorigen Absatz über fehlendes Frühstück?","h":"Ein Verweis greift ein Wort des vorigen Absatzes auf.","s":"<span class=\"la\">This lack of energy<\/span> nimmt den vorigen Gedanken auf und führt ihn weiter. Ankündigungen des eigenen Vorgehens leisten das nicht.","o":["<span class=\"la\">This lack of energy is also visible in the afternoon.<\/span>","<span class=\"la\">Now I will write about the afternoon.<\/span>","<span class=\"la\">The afternoon is another topic.<\/span>","<span class=\"la\">Afternoon.<\/span>"]},{"type":"self","q":"Nimm einen eigenen Text von ungefähr 200 Wörtern und unterstreiche alle Konnektoren. Ersetze dann drei davon durch Konnektoren einer anderen Bauweise.","s":"Wer nur <span class=\"la\">and<\/span>, <span class=\"la\">but<\/span> und <span class=\"la\">because<\/span> findet, hat beim Kriterium Spektrum Luft nach oben. Nimm dir für den nächsten Text drei neue Konnektoren vor, einen aus jeder Bauweise, und benütze sie bewusst. Mehr als drei auf einmal lernt niemand."}],"gen":["wf","coll"],"html":"<h3>Warum das ein eigenes Kapitel verdient<\/h3>\n<p>Das Kriterium Aufbau misst, ob die Teile deines Textes erkennbar zusammenhängen. Dafür gibt es zwei Mittel: Konnektoren und Verweise. Beide kosten wenig Platz und wirken sofort.<\/p>\n<h3>Konnektoren nach Bedeutung<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Bedeutung<\/th><th>Wörter<\/th><\/tr><tr><td>hinzufügen<\/td><td><span class=\"la\">moreover, furthermore, in addition, what is more, besides<\/span><\/td><\/tr><tr><td>Gegensatz<\/td><td><span class=\"la\">however, nevertheless, on the other hand, whereas, while, yet<\/span><\/td><\/tr><tr><td>Grund<\/td><td><span class=\"la\">because, since, as, due to, owing to<\/span><\/td><\/tr><tr><td>Folge<\/td><td><span class=\"la\">therefore, consequently, as a result, thus, so<\/span><\/td><\/tr><tr><td>Beispiel<\/td><td><span class=\"la\">for instance, for example, such as, to illustrate<\/span><\/td><\/tr><tr><td>Einschränkung<\/td><td><span class=\"la\">although, even though, despite, in spite of, admittedly<\/span><\/td><\/tr><tr><td>Reihenfolge<\/td><td><span class=\"la\">first of all, then, after that, finally<\/span><\/td><\/tr><tr><td>Zusammenfassung<\/td><td><span class=\"la\">on the whole, in short, all in all, to sum up<\/span><\/td><\/tr><\/table><\/div>\n<h3>Die drei Bauweisen<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Typ<\/th><th>Beispiele<\/th><th>Satzbau<\/th><\/tr><tr><td>Konjunktion<\/td><td><span class=\"la\">although, because, while, whereas<\/span><\/td><td>verbindet zwei Teile in einem Satz: <span class=\"la\">Although it rained, we went out.<\/span><\/td><\/tr><tr><td>Satzadverb<\/td><td><span class=\"la\">however, therefore, moreover<\/span><\/td><td>steht meist am Anfang eines neuen Satzes, mit Komma: <span class=\"la\">It rained. However, we went out.<\/span><\/td><\/tr><tr><td>Präposition<\/td><td><span class=\"la\">despite, in spite of, because of, due to<\/span><\/td><td>steht vor einem Substantiv oder einer <span class=\"la\">-ing<\/span>-Form: <span class=\"la\">Despite the rain, we went out.<\/span><\/td><\/tr><\/table><\/div>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>Die größte Fehlerquelle dieses Kapitels: <span class=\"la\">despite<\/span> und <span class=\"la\">in spite of<\/span> stehen <b class=\"e\">nie<\/b> vor einem ganzen Satz. Falsch: <span class=\"la\">Despite it rained.<\/span> Richtig: <span class=\"la\">Despite the rain<\/span> oder <span class=\"la\">Although it rained<\/span>.<\/div>\n<h3>Zeichensetzung<\/h3>\n<ul><li>Satzadverb am Satzanfang: Komma dahinter. <span class=\"la\">However, the figures tell a different story.<\/span><\/li><li>Nebensatz vorangestellt: Komma dahinter. <span class=\"la\">Although it was late, we kept going.<\/span><\/li><li>Nebensatz nachgestellt: meist kein Komma. <span class=\"la\">We kept going although it was late.<\/span><\/li><li>Vor <span class=\"la\">that<\/span> steht nie ein Komma.<\/li><\/ul>\n<h3>Verweise statt Wiederholung<\/h3>\n<p>Guter Textfluss entsteht auch dadurch, dass du Bekanntes nicht ständig wiederholst:<\/p>\n<div class=\"formula\"><span class=\"la\">this problem, such measures, the former … the latter, the issue mentioned above, that is why<\/span><\/div>\n<p><span class=\"la\">Many students arrive without breakfast. <b class=\"e\">This<\/b> affects their concentration in the first two lessons.<\/span><\/p>\n<div class=\"note t\"><b class=\"lab\">Tipp<\/b>Ein nützlicher Test für jeden Absatzanfang: Steht dort ein Wort, das zum vorigen Absatz zurückgreift? Wenn nicht, prüfe, ob eines fehlt. Das ist die billigste Verbesserung beim Kriterium Aufbau, die es gibt.<\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Zwei Sätze richtig verbinden<\/h4><div class=\"task\">Verbinde auf drei verschiedene Arten: <span class=\"la\">It was raining heavily.<\/span> + <span class=\"la\">They decided to walk.<\/span><\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div><b class=\"e\">Mit Konjunktion:<\/b> <span class=\"la\">Although it was raining heavily, they decided to walk.<\/span> Nebensatz vorangestellt, also Komma dahinter.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div><b class=\"e\">Mit Satzadverb:<\/b> <span class=\"la\">It was raining heavily. Nevertheless, they decided to walk.<\/span> Zwei Sätze, Komma nach dem Satzadverb.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div><b class=\"e\">Mit Präposition:<\/b> <span class=\"la\">Despite the heavy rain, they decided to walk.<\/span> Nach <span class=\"la\">despite<\/span> steht ein Substantiv, kein Satz.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Alle drei sagen dasselbe. Für das Kriterium Spektrum lohnt es sich, in einem Text alle drei Bauweisen zu verwenden.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"fehlerjagd","t":"Die häufigsten Fehler und wie du sie los wirst","kl":"4","k":4,"a":"U","tag":"Aufbau","goals":["die typischen Fehler deutschsprachiger Lernender erkennen und korrigieren","eine persönliche Fehlerliste anlegen","die eigene Arbeit gezielt überprüfen"],"ex":[{"type":"txt","a":["for"],"q":"Korrigiere die Präposition: <span class=\"la\">I have known her since three years.<\/span> Welches Wort gehört statt <span class=\"la\">since<\/span>?","s":"<span class=\"la\">for<\/span> steht bei einer Dauer, <span class=\"la\">since<\/span> bei einem Anfangspunkt. <span class=\"la\">since 2021<\/span>, aber <span class=\"la\">for three years<\/span>."},{"type":"txt","a":["are"],"q":"Korrigiere: <span class=\"la\">People is usually friendly here.<\/span> Welche Verbform gehört statt <span class=\"la\">is<\/span>?","s":"<span class=\"la\">people<\/span> ist ein Plural und steht mit <span class=\"la\">are<\/span>. Dasselbe gilt für <span class=\"la\">police<\/span>: <span class=\"la\">The police are investigating.<\/span>"},{"type":"mc","q":"Welcher Satz ist richtig?","h":"Dieses Verb verlangt eine bestimmte Konstruktion.","s":"<span class=\"la\">explain something to somebody<\/span>. Dasselbe Muster gilt für <span class=\"la\">describe<\/span> und <span class=\"la\">suggest<\/span>: <span class=\"la\">describe the room to me<\/span>, nicht <span class=\"la\">describe me the room<\/span>.","o":["<span class=\"la\">She explained the rule to me.<\/span>","<span class=\"la\">She explained me the rule.<\/span>","<span class=\"la\">She explained to me the rule.<\/span>","<span class=\"la\">She explained me about the rule.<\/span>"]},{"type":"txt","a":["ten-year-old","ten year old"],"q":"Korrigiere: <span class=\"la\">He is a 10 years old boy.<\/span> Wie lautet der Ausdruck vor <span class=\"la\">boy<\/span> richtig, Regel in fünf Wörtern.","s":"Zähle zuerst, welche Fehlerart am häufigsten vorkommt; sie gehört in die erste Zeile. Erfahrungsgemäß sind es bei deutschsprachigen Lernenden die Zeitformen mit <span class=\"la\">since<\/span> und <span class=\"la\">for<\/span>, das dritte s und die Kollokationen mit <span class=\"la\">make<\/span> und <span class=\"la\">do<\/span>. Prüfe diese Liste am Ende jeder Arbeit Zeile für Zeile, nicht aus dem Gedächtnis."}],"gen":["tense","coll","prep"],"html":"<h3>Die Liste<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Fehler<\/th><th>Richtig<\/th><th>Grund<\/th><\/tr><tr><td><span class=\"la\">I live here since 2019.<\/span><\/td><td><span class=\"la\">I have lived here since 2019.<\/span><\/td><td><span class=\"la\">since<\/span> verlangt das Present Perfect<\/td><\/tr><tr><td><span class=\"la\">I have seen him yesterday.<\/span><\/td><td><span class=\"la\">I saw him yesterday.<\/span><\/td><td>abgeschlossene Zeitangabe<\/td><\/tr><tr><td><span class=\"la\">Yesterday have I seen …<\/span><\/td><td><span class=\"la\">Yesterday I saw …<\/span><\/td><td>keine Inversion nach Zeitangabe<\/td><\/tr><tr><td><span class=\"la\">I am agree.<\/span><\/td><td><span class=\"la\">I agree.<\/span><\/td><td><span class=\"la\">agree<\/span> ist ein Vollverb<\/td><\/tr><tr><td><span class=\"la\">She don't know.<\/span><\/td><td><span class=\"la\">She doesn't know.<\/span><\/td><td>drittes s auch in der Verneinung<\/td><\/tr><tr><td><span class=\"la\">Does she lives here?<\/span><\/td><td><span class=\"la\">Does she live here?<\/span><\/td><td>nach <span class=\"la\">does<\/span> die Grundform<\/td><\/tr><tr><td><span class=\"la\">informations, advices<\/span><\/td><td><span class=\"la\">information, advice<\/span><\/td><td>unzählbar<\/td><\/tr><tr><td><span class=\"la\">The most people<\/span><\/td><td><span class=\"la\">Most people<\/span><\/td><td>kein Artikel bei allgemeinem <span class=\"la\">most<\/span><\/td><\/tr><tr><td><span class=\"la\">It gives a problem.<\/span><\/td><td><span class=\"la\">There is a problem.<\/span><\/td><td>„es gibt“<\/td><\/tr><tr><td><span class=\"la\">I become a present.<\/span><\/td><td><span class=\"la\">I get a present.<\/span><\/td><td>falscher Freund<\/td><\/tr><tr><td><span class=\"la\">We discussed about it.<\/span><\/td><td><span class=\"la\">We discussed it.<\/span><\/td><td>ohne Präposition<\/td><\/tr><tr><td><span class=\"la\">I look forward to see you.<\/span><\/td><td><span class=\"la\">I look forward to seeing you.<\/span><\/td><td><span class=\"la\">to<\/span> ist hier Präposition<\/td><\/tr><tr><td><span class=\"la\">He suggested me to go.<\/span><\/td><td><span class=\"la\">He suggested that I go.<\/span><\/td><td>kein Objekt plus Infinitiv<\/td><\/tr><tr><td><span class=\"la\">If I would have time …<\/span><\/td><td><span class=\"la\">If I had time …<\/span><\/td><td>kein <span class=\"la\">would<\/span> im if-Satz<\/td><\/tr><tr><td><span class=\"la\">I think, that …<\/span><\/td><td><span class=\"la\">I think that …<\/span><\/td><td>kein Komma vor <span class=\"la\">that<\/span><\/td><\/tr><tr><td><span class=\"la\">since two years<\/span><\/td><td><span class=\"la\">for two years<\/span><\/td><td>Dauer mit <span class=\"la\">for<\/span><\/td><\/tr><tr><td><span class=\"la\">in the television<\/span><\/td><td><span class=\"la\">on television<\/span><\/td><td>feste Wendung<\/td><\/tr><tr><td><span class=\"la\">make a photo<\/span><\/td><td><span class=\"la\">take a photo<\/span><\/td><td>Kollokation<\/td><\/tr><tr><td><span class=\"la\">make sport<\/span><\/td><td><span class=\"la\">do sport<\/span><\/td><td>Kollokation<\/td><\/tr><tr><td><span class=\"la\">People is friendly.<\/span><\/td><td><span class=\"la\">People are friendly.<\/span><\/td><td><span class=\"la\">people<\/span> ist Plural<\/td><\/tr><tr><td><span class=\"la\">The police is coming.<\/span><\/td><td><span class=\"la\">The police are coming.<\/span><\/td><td><span class=\"la\">police<\/span> ist Plural<\/td><\/tr><tr><td><span class=\"la\">a 10 years old boy<\/span><\/td><td><span class=\"la\">a ten-year-old boy<\/span><\/td><td>Singular im Attribut, mit Bindestrichen<\/td><\/tr><tr><td><span class=\"la\">Everybody have their ideas.<\/span><\/td><td><span class=\"la\">Everybody has their ideas.<\/span><\/td><td><span class=\"la\">everybody<\/span> ist Singular<\/td><\/tr><tr><td><span class=\"la\">I am living here since …<\/span><\/td><td><span class=\"la\">I have been living here since …<\/span><\/td><td>Zeitform<\/td><\/tr><tr><td><span class=\"la\">She explained me the rule.<\/span><\/td><td><span class=\"la\">She explained the rule to me.<\/span><\/td><td><span class=\"la\">explain<\/span> braucht <span class=\"la\">to<\/span><\/td><\/tr><\/table><\/div>\n<div class=\"note\"><b class=\"lab\">Merke<\/b>Diese fünfundzwanzig Fehler machen erfahrungsgemäß den größten Teil aller Abzüge beim Kriterium Sprachrichtigkeit aus. Wer sie beherrscht, hebt seine Note oft um eine Stufe, ohne ein einziges neues Wort zu lernen.<\/div>\n<h3>Die persönliche Fehlerliste<\/h3>\n<p>Nimm deine letzten drei korrigierten Arbeiten und notiere jeden Fehler in einer Tabelle mit drei Spalten: <b class=\"e\">falsch<\/b>, <b class=\"e\">richtig<\/b>, <b class=\"e\">Regel in fünf Wörtern<\/b>. Streiche nach jeder weiteren Arbeit, was nicht mehr vorkommt, und ergänze Neues. Mehr als sechs Zeilen soll die Liste nicht haben; sonst prüfst du sie am Ende der Schularbeit nicht mehr.<\/p>\n<div class=\"note t\"><b class=\"lab\">Tipp<\/b>Die Liste wird am Schluss jeder Arbeit Punkt für Punkt durchgegangen, nicht „im Kopf behalten“. Eine Liste, die man nicht abarbeitet, ist eine Sammlung, keine Methode.<\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Einen Satz systematisch prüfen<\/h4><div class=\"task\">Prüfe: <span class=\"la\">Since two years I am living in Vienna and I have seen many interesting things last month.<\/span><\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div><b class=\"e\">Zeitangabe:<\/b> <span class=\"la\">two years<\/span> ist eine Dauer, also <span class=\"la\">for<\/span>, nicht <span class=\"la\">since<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div><b class=\"e\">Zeitform eins:<\/b> Dauer bis jetzt verlangt das Present Perfect: <span class=\"la\">I have been living<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div><b class=\"e\">Zeitform zwei:<\/b> <span class=\"la\">last month<\/span> ist abgeschlossen, also Simple Past: <span class=\"la\">I saw<\/span>.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Ergebnis: <span class=\"la\">I have been living in Vienna for two years, and I saw a lot of interesting things last month.<\/span> Drei Fehler in einem Satz, alle drei aus derselben Quelle: der Übertragung aus dem Deutschen.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"register","t":"Register und Präzision","kl":"4","k":4,"a":"U","tag":"Fortgeschritten","goals":["zwischen formell, neutral und informell sicher wechseln","blasse Wörter durch genaue ersetzen","Füllwörter streichen","den Ton einer Textsorte konsequent durchhalten"],"ex":[{"type":"mc","q":"Welche Fassung passt in einen förmlichen Report?","h":"Achte auf Mengenangabe und Wortwahl.","s":"<span class=\"la\">a considerable number of<\/span> ist die förmliche Mengenangabe. <span class=\"la\">loads of<\/span>, <span class=\"la\">tons of<\/span> und <span class=\"la\">a lot of<\/span> gehören in informelle Texte.","o":["<span class=\"la\">A considerable number of students reported difficulties.<\/span>","<span class=\"la\">Loads of students said it was tricky.<\/span>","<span class=\"la\">Tons of kids had problems with it.<\/span>","<span class=\"la\">A lot of students found it pretty hard.<\/span>"]},{"type":"mc","q":"Welche Fassung ist am präzisesten?","h":"Ein genaues Wort schlägt jede Verstärkung.","s":"<span class=\"la\">disappointing<\/span> sagt in einem Wort, was die anderen Fassungen umschreiben. Präzision entsteht durch Wortwahl, nicht durch Verstärkung.","o":["<span class=\"la\">The results were disappointing.<\/span>","<span class=\"la\">The results were very bad.<\/span>","<span class=\"la\">The results were not so good.<\/span>","<span class=\"la\">The results were really not great.<\/span>"]},{"type":"txt","a":["crucial","essential","vital"],"q":"Ersetze <span class=\"la\">very important<\/span> durch ein einzelnes Adjektiv.","s":"<span class=\"la\">crucial<\/span>, <span class=\"la\">essential<\/span> oder <span class=\"la\">vital<\/span>. Alle drei bezeichnen den höchsten Grad der Wichtigkeit und brauchen deshalb keine Verstärkung mehr."},{"type":"mc","q":"Welcher Schluss passt zu einer förmlichen Beschwerde-E-Mail?","h":"Der Ton darf am Schluss nicht kippen.","s":"Der Registerwechsel am Textende ist ein häufiger Fehler. Grußformel und Schlusssatz müssen zum Rest des Briefes passen.","o":["<span class=\"la\">I look forward to your reply. Yours sincerely, …<\/span>","<span class=\"la\">Thanks a lot, see you! …<\/span>","<span class=\"la\">Cheers, …<\/span>","<span class=\"la\">Bye for now, …<\/span>"]},{"type":"mc","q":"Welcher Satz enthält die meisten Füllwörter?","s":"<span class=\"la\">I personally think<\/span>, <span class=\"la\">in my opinion<\/span> und <span class=\"la\">actually<\/span> sagen dreimal dasselbe. Der Satz schrumpft ohne Verlust auf die Hälfte.","o":["<span class=\"la\">I personally think that in my opinion it is actually quite important.<\/span>","<span class=\"la\">In my opinion, this matters.<\/span>","<span class=\"la\">I believe this is important.<\/span>","<span class=\"la\">This seems important to me.<\/span>"]},{"type":"txt","a":["do not","cannot","will not"],"q":"Schreibe die Kurzform <span class=\"la\">don't<\/span> für einen förmlichen Text aus.","s":"<span class=\"la\">do not<\/span>. In förmlichen Texten werden Kurzformen aufgelöst; in Blog comment, persönlicher E-Mail und Article sind sie dagegen völlig in Ordnung."},{"type":"mc","q":"Welches Verb ersetzt <span class=\"la\">say<\/span> in <span class=\"la\">The author says that the figures are misleading<\/span> am besten?","h":"Gesucht ist ein Verb der Redewiedergabe mit <span class=\"la\">that<\/span>.","s":"<span class=\"la\">argues<\/span> passt, weil der Autor eine Position vertritt. <span class=\"la\">tell<\/span> braucht ein persönliches Objekt, <span class=\"la\">speak<\/span> und <span class=\"la\">talk<\/span> stehen nicht mit <span class=\"la\">that<\/span>.","o":["<span class=\"la\">argues<\/span>","<span class=\"la\">tells<\/span>","<span class=\"la\">speaks<\/span>","<span class=\"la\">talks<\/span>"]},{"type":"self","q":"Nimm einen eigenen Text und streiche alle Füllwörter. Ersetze dann genau drei blasse Wörter durch genaue. Zähle, wie viele Wörter du gespart hast.","s":"Erfahrungsgemäß lassen sich zehn bis fünfzehn Prozent eines Textes streichen, ohne dass Inhalt verlorengeht. Der gewonnene Platz steht für ein weiteres Argument oder ein Beispiel zur Verfügung, und beides zählt mehr als jedes Füllwort."}],"gen":["wf","ff"],"html":"<h3>Die drei Register<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th><\/th><th>informell<\/th><th>neutral<\/th><th>formell<\/th><\/tr><tr><td>Wortwahl<\/td><td><span class=\"la\">kids, stuff, a lot of<\/span><\/td><td><span class=\"la\">children, things, many<\/span><\/td><td><span class=\"la\">young people, aspects, numerous<\/span><\/td><\/tr><tr><td>Verben<\/td><td>Phrasal Verbs: <span class=\"la\">find out, put off<\/span><\/td><td>gemischt<\/td><td>lateinisch: <span class=\"la\">discover, postpone<\/span><\/td><\/tr><tr><td>Kurzformen<\/td><td><span class=\"la\">don't, I'm<\/span><\/td><td>je nach Text<\/td><td>ausgeschrieben<\/td><\/tr><tr><td>Anrede<\/td><td><span class=\"la\">Hi Anna<\/span><\/td><td><span class=\"la\">Dear Anna<\/span><\/td><td><span class=\"la\">Dear Ms Brown<\/span><\/td><\/tr><tr><td>Fragen<\/td><td>rhetorische Fragen<\/td><td>sparsam<\/td><td>kaum<\/td><\/tr><tr><td>Ich-Form<\/td><td>häufig<\/td><td>möglich<\/td><td>oft unpersönlich<\/td><\/tr><\/table><\/div>\n<div class=\"note\"><b class=\"lab\">Merke<\/b>Entscheidend ist nicht, welches Register „besser“ ist, sondern ob es zur Textsorte passt. Ein formeller Blog comment wirkt genauso falsch wie eine umgangssprachliche Beschwerde-E-Mail.<\/div>\n<h3>Blasse Wörter ersetzen<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>blass<\/th><th>genauer<\/th><\/tr><tr><td><span class=\"la\">very good<\/span><\/td><td><span class=\"la\">excellent, outstanding, impressive<\/span><\/td><\/tr><tr><td><span class=\"la\">very bad<\/span><\/td><td><span class=\"la\">poor, disappointing, inadequate<\/span><\/td><\/tr><tr><td><span class=\"la\">very big<\/span><\/td><td><span class=\"la\">enormous, substantial, considerable<\/span><\/td><\/tr><tr><td><span class=\"la\">very important<\/span><\/td><td><span class=\"la\">crucial, essential, vital<\/span><\/td><\/tr><tr><td><span class=\"la\">nice<\/span><\/td><td><span class=\"la\">pleasant, welcoming, thoughtful<\/span><\/td><\/tr><tr><td><span class=\"la\">things<\/span><\/td><td><span class=\"la\">aspects, issues, factors, features<\/span><\/td><\/tr><tr><td><span class=\"la\">get<\/span><\/td><td><span class=\"la\">receive, obtain, become, achieve<\/span><\/td><\/tr><tr><td><span class=\"la\">a lot of<\/span><\/td><td><span class=\"la\">a great deal of, numerous, considerable<\/span><\/td><\/tr><tr><td><span class=\"la\">say<\/span><\/td><td><span class=\"la\">claim, point out, argue, admit, warn<\/span><\/td><\/tr><\/table><\/div>\n<div class=\"note t\"><b class=\"lab\">Tipp<\/b>Nimm dir pro Text drei dieser Ersetzungen vor, nicht dreißig. Ein Text, in dem jedes zweite Wort gehoben klingt, wirkt gestelzt und enthält mehr Fehler als einer mit drei gezielten Verbesserungen.<\/div>\n<h3>Füllwörter streichen<\/h3>\n<div class=\"formula\"><span class=\"la\">I personally think that in my opinion it is actually quite important that …<\/span><\/div>\n<p>Dieser Satz enthält drei Verdopplungen. Knapp: <span class=\"la\">In my opinion, it matters that …<\/span><\/p>\n<p>Zu den üblichen Verdächtigen gehören <span class=\"la\">really, actually, basically, just, very, quite, I personally think<\/span>.<\/p>\n<h3>Den Ton durchhalten<\/h3>\n<p>Ein Text darf nicht in der Mitte das Register wechseln. Besonders häufig passiert das am Schluss, wenn die Konzentration nachlässt: Ein förmlicher Brief endet dann plötzlich mit <span class=\"la\">Thanks a lot, see you!<\/span><\/p>\n<div class=\"walk\"><h4>Schritt für Schritt: Einen Satz ins formelle Register heben<\/h4><div class=\"task\"><span class=\"la\">We found out that lots of kids don't get enough sleep, which is really bad.<\/span><\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div><b class=\"e\">Phrasal Verb ersetzen:<\/b> <span class=\"la\">found out<\/span> wird zu <span class=\"la\">discovered<\/span> oder <span class=\"la\">established<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div><b class=\"e\">Umgangssprache ersetzen:<\/b> <span class=\"la\">lots of kids<\/span> wird zu <span class=\"la\">a considerable number of young people<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div><b class=\"e\">Kurzform auflösen und Verb präzisieren:<\/b> <span class=\"la\">don't get<\/span> wird zu <span class=\"la\">do not get<\/span>.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div><b class=\"e\">Blasse Wertung ersetzen:<\/b> <span class=\"la\">really bad<\/span> wird zu <span class=\"la\">a serious concern<\/span>. Ergebnis: <span class=\"la\">We discovered that a considerable number of young people do not get enough sleep, which is a serious concern.<\/span><\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"reading","t":"Reading: Formate und Strategie","kl":"4","k":4,"a":"P","tag":"Basis","goals":["die Aufgabenformate des Leseteils erkennen","zu jedem die passende Technik anwenden","mit unbekannten Wörtern umgehen","die Zeit über vier Texte verteilen"],"ex":[{"type":"mc","q":"Eine Antwortmöglichkeit enthält mehrere Wörter aus dem Text. Was folgt daraus?","h":"Wörtliche Übereinstimmung ist eine beliebte Falle.","s":"Übereinstimmende Wörter sagen nichts über die Richtigkeit. Die richtige Antwort formuliert den Inhalt oft gerade mit anderen Wörtern.","o":["nichts; entscheidend ist, ob die Aussage mit dem Text übereinstimmt","dass sie wahrscheinlich richtig ist","dass sie sicher falsch ist","dass der Text an dieser Stelle schwer ist"]},{"type":"mc","q":"Der Text sagt nichts darüber, ob die Schule eine Bibliothek hat. In der Aufgabe steht: <span class=\"la\">The school has a library.<\/span> Wie entscheidest du?","h":"Weltwissen zählt hier nicht.","s":"<span class=\"la\">Not given<\/span> bedeutet, dass der Text dazu keine Aussage macht. Was wahrscheinlich ist, spielt keine Rolle.","o":["not given","true","false","true, weil fast jede Schule eine hat"]},{"type":"mc","q":"Welche Reihenfolge ist beim Matching am sinnvollsten?","s":"Wer die Vorgaben kennt, erkennt beim Lesen sofort, wohin ein Abschnitt gehört. Umgekehrt müsste man den Text mehrmals lesen.","o":["alle Vorgaben lesen, dann den Text abschnittweise zuordnen","den Text ganz lesen, dann die Vorgaben","die Vorgaben der Reihe nach im Text suchen","mit der letzten Vorgabe beginnen"]},{"type":"mc","q":"Du kennst ein Wort im Text nicht. Was tust du zuerst?","h":"Ein Wörterbuch ist in diesem Prüfungsteil nicht vorgesehen.","s":"Wortart und Umgebung genügen meist, um die Aufgabe zu lösen, auch wenn die genaue Bedeutung offenbleibt. Das Raten über das Deutsche führt bei falschen Freunden in die Irre.","o":["die Wortart bestimmen und die Umgebung lesen","im Wörterbuch nachschlagen","die Aufgabe überspringen","das Wort aus dem Deutschen erraten"]},{"type":"txt","a":["not given","Not given"],"q":"Wie lautet die dritte Antwortmöglichkeit neben <span class=\"la\">true<\/span> und <span class=\"la\">false<\/span> in diesem Format? Antworte auf Englisch.","s":"<span class=\"la\">Not given<\/span>. Diese Kategorie trennt, was im Text steht, von dem, was plausibel wäre, und genau darauf zielt das Format."},{"type":"mc","q":"Wie lang soll eine Short answer sein?","s":"Gefragt ist die Information, nicht ein schöner Satz. Jede zusätzliche Formulierung kostet Zeit und kann Fehler enthalten.","o":["so kurz wie möglich, am besten mit den Wörtern des Textes","ein vollständiger Satz","mindestens zwei Sätze","so ausführlich wie möglich"]},{"type":"self","q":"Nimm einen englischen Zeitungsartikel, lies nur Titel und ersten Absatz und schreibe drei Fragen auf, die der Text deiner Vermutung nach beantwortet. Lies dann den ganzen Text und prüfe, wie viele davon tatsächlich beantwortet werden.","s":"Diese Übung trainiert genau die Fähigkeit, auf die der Leseteil zielt: zwischen dem zu unterscheiden, was ein Text sagt, und dem, was man erwartet. Wer bemerkt, wie oft die eigene Erwartung danebenliegt, wird im Prüfungsteil deutlich vorsichtiger und dadurch besser."}],"gen":["vok","wf"],"html":"<h3>Die Formate<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Format<\/th><th>Aufgabe<\/th><th>Technik<\/th><\/tr><tr><td>Multiple choice<\/td><td>aus vier Antworten eine wählen<\/td><td>zuerst die Frage, dann die Stelle im Text suchen<\/td><\/tr><tr><td>Matching<\/td><td>Überschriften, Personen oder Aussagen zuordnen<\/td><td>zuerst alle Vorgaben lesen, dann Abschnitt für Abschnitt<\/td><\/tr><tr><td>True / False mit Belegstelle<\/td><td>entscheiden und die Textstelle angeben<\/td><td>die Belegstelle entscheidet, nicht das Gefühl<\/td><\/tr><tr><td>Short answer<\/td><td>in wenigen Wörtern antworten<\/td><td>so kurz wie möglich, mit Wörtern aus dem Text<\/td><\/tr><tr><td>Gap filling mit Sätzen<\/td><td>herausgenommene Sätze einsetzen<\/td><td>auf Verweiswörter vor und nach der Lücke achten<\/td><\/tr><\/table><\/div>\n<div class=\"note\"><b class=\"lab\">Merke<\/b>Der wichtigste Grundsatz des ganzen Prüfungsteils: Die Antwort steht im Text. Gefragt ist nicht, was du über das Thema weißt oder für wahrscheinlich hältst, sondern was dort geschrieben steht.<\/div>\n<h3>Die Arbeitsschritte<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Schritt<\/th><th>Was du tust<\/th><th>Zeit bei vier Texten<\/th><\/tr><tr><td>1<\/td><td>Titel und Untertitel lesen, Thema erfassen<\/td><td>1 Minute<\/td><\/tr><tr><td>2<\/td><td>Aufgaben lesen und Schlüsselwörter markieren<\/td><td>3 Minuten<\/td><\/tr><tr><td>3<\/td><td>Text überfliegen, Abschnitte grob zuordnen<\/td><td>3 Minuten<\/td><\/tr><tr><td>4<\/td><td>Aufgaben der Reihe nach lösen, Belegstellen markieren<\/td><td>25 Minuten<\/td><\/tr><tr><td>5<\/td><td>Antworten übertragen und auf Rechtschreibung prüfen<\/td><td>5 Minuten<\/td><\/tr><\/table><\/div>\n<h3>Mit unbekannten Wörtern umgehen<\/h3>\n<ul><li><b class=\"e\">Wortart bestimmen:<\/b> Steht ein Artikel davor? Eine Endung dahinter?<\/li><li><b class=\"e\">Wortfamilie nützen:<\/b> <span class=\"la\">unmistakably<\/span> enthält <span class=\"la\">mistake<\/span>.<\/li><li><b class=\"e\">Umgebung lesen:<\/b> Oft erklärt der nächste Satz das Wort.<\/li><li><b class=\"e\">Weiterlesen:<\/b> Für die meisten Aufgaben brauchst du das Wort gar nicht.<\/li><\/ul>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>Die häufigste Falle bei Multiple choice heißt Teilwahrheit: Eine Antwort enthält Wörter aus dem Text, sagt aber etwas anderes aus als dieser. Prüfe deshalb nicht, ob die Wörter vorkommen, sondern ob die Aussage stimmt.<\/div>\n<h3>True, False oder not given<\/h3>\n<p>Dieses Format verlangt eine saubere Trennung:<\/p>\n<ul><li><b class=\"e\">True:<\/b> Der Text sagt es.<\/li><li><b class=\"e\">False:<\/b> Der Text sagt das Gegenteil.<\/li><li><b class=\"e\">Not given:<\/b> Der Text sagt dazu nichts, auch wenn es plausibel klingt.<\/li><\/ul>\n<div class=\"note t\"><b class=\"lab\">Tipp<\/b>Beim Short answer gilt: so wenige Wörter wie möglich, am besten die des Textes. Ganze Sätze kosten Zeit und bringen keine zusätzlichen Punkte, können aber Fehler enthalten.<\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Eine Multiple-choice-Aufgabe lösen<\/h4><div class=\"task\">Frage: <span class=\"la\">Why did the author decide to stop cycling to work?<\/span> Antwortmöglichkeiten unter anderem: <span class=\"la\">because the route was dangerous<\/span> und <span class=\"la\">because her bike was stolen<\/span>.<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div><b class=\"e\">Schlüsselwörter markieren:<\/b> <span class=\"la\">stop cycling<\/span> und <span class=\"la\">why<\/span>. Gesucht ist ein Grund.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div><b class=\"e\">Stelle finden:<\/b> Suche im Text nach dem Moment, in dem vom Aufhören die Rede ist, nicht nach dem Wort <span class=\"la\">dangerous<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div><b class=\"e\">Beide Antworten an der Stelle prüfen:<\/b> Vielleicht steht dort, dass die Strecke gefährlich sei, der Entschluss aber nach dem Diebstahl fiel.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div><b class=\"e\">Entscheiden, was der Text sagt, nicht was naheliegt:<\/b> Die Antwort ist die, die der Text als Grund nennt. Markiere die Zeile, damit du beim Übertragen nicht ins Zweifeln kommst.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"listening","t":"Listening: Formate und Strategie","kl":"4","k":4,"a":"P","tag":"Basis","goals":["die Hörformate kennen","die Pausen vor dem Hören nützen","beim zweiten Hören gezielt ergänzen","mit Unverstandenem umgehen, ohne den Faden zu verlieren"],"ex":[{"type":"mc","q":"Was tust du beim ersten Hören mit einer Lücke, bei der du unsicher bist?","h":"Was kostet mehr: eine offene Lücke oder drei verpasste?","s":"Wer stehen bleibt, verliert die folgenden Aufgaben. Der zweite Durchgang ist genau für die offenen Stellen da.","o":["einen Strich machen und weiterhören","so lange nachdenken, bis dir die Antwort einfällt","irgendetwas eintragen und nicht mehr hinsehen","zurückspulen"]},{"type":"mc","q":"Im Text heißt es: <span class=\"la\">We will meet at six … actually, let us make it half past six.<\/span> Welche Zeit trägst du ein?","h":"Selbstkorrekturen sind ein beliebtes Mittel dieser Prüfungsform.","s":"Es gilt die zuletzt bestätigte Angabe. Solche Korrekturen prüfen, ob du bis zum Ende zuhörst.","o":["half past six","six","beides","keine, weil der Text sich widerspricht"]},{"type":"mc","q":"Die Aufgabe fragt nach etwas <span class=\"la\">cheap<\/span>, der Text sagt <span class=\"la\">affordable<\/span>. Was bedeutet das?","h":"Aufgaben wiederholen selten die Wörter des Hörtextes.","s":"Aufgaben arbeiten absichtlich mit Synonymen. Wer nur auf das Wort der Aufgabe wartet, hört an der Antwort vorbei.","o":["Das ist dieselbe Information, nur mit anderem Wort.","Es handelt sich um eine andere Sache.","Der Text passt nicht zur Aufgabe.","Du musst auf das Wort <span class=\"la\">cheap<\/span> warten."]},{"type":"txt","a":["thirty","30"],"q":"Du hörst eine Zahl, die wie <span class=\"la\">thirteen<\/span> oder <span class=\"la\">thirty<\/span> klingt, und die Betonung liegt deutlich auf der ersten Silbe und das Wort endet weich. Welche Zahl ist es?","s":"<span class=\"la\">thirty<\/span> wird auf der ersten Silbe betont, <span class=\"la\">thirteen<\/span> auf der zweiten. Diese Unterscheidung lohnt sich zu üben, weil Zahlen in fast jedem Hörtext vorkommen."},{"type":"mc","q":"Wofür ist die Pause vor dem Hören da?","s":"Wer weiß, worauf er wartet, hört die Antwort. Wer die Aufgaben erst beim Hören liest, hört den Text zwar, erkennt die Antworten aber nicht als solche.","o":["Aufgaben lesen, Schlüsselwörter markieren und Erwartungen bilden","zum Ausruhen","um die vorherige Aufgabe fertig zu machen","um das Thema zu recherchieren"]},{"type":"mc","q":"Bei <span class=\"la\">note completion<\/span> sind meist wie viele Wörter gefragt?","s":"Die Angabe nennt die erlaubte Wortzahl, üblich sind ein bis drei Wörter. Mehr Wörter als erlaubt machen eine inhaltlich richtige Antwort ungültig.","o":["ein bis drei, oft wörtlich aus dem Hörtext","ein vollständiger Satz","mindestens fünf","beliebig viele"]},{"type":"self","q":"Höre dir eine englische Nachrichtensendung von drei Minuten zweimal an. Schreibe beim ersten Mal nur Stichworte, beim zweiten Mal ergänze. Zähle danach, wie viele Angaben du erst im zweiten Durchgang ergänzen konntest.","s":"Das Ergebnis dieser Übung ist meist überraschend: Der zweite Durchgang bringt deutlich mehr, als man erwartet, sofern man im ersten nicht hängen geblieben ist. Genau darauf beruht die Strategie für die Prüfung."}],"gen":["vok","ff"],"html":"<h3>Der Ablauf<\/h3>\n<p>Jeder Hörtext wird <b class=\"e\">zweimal<\/b> abgespielt. Davor hast du Zeit, die Aufgaben zu lesen. Diese Zeit ist der wichtigste Teil des ganzen Prüfungsteils, weil du nur so weißt, worauf du hören musst.<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Phase<\/th><th>Was du tust<\/th><\/tr><tr><td>vor dem ersten Hören<\/td><td>Aufgaben lesen, Schlüsselwörter markieren, Erwartungen bilden<\/td><\/tr><tr><td>erstes Hören<\/td><td>die sicheren Antworten eintragen, Lücken mit einem Strich markieren<\/td><\/tr><tr><td>zwischen den Durchgängen<\/td><td>die offenen Stellen heraussuchen<\/td><\/tr><tr><td>zweites Hören<\/td><td>gezielt auf die offenen Stellen hören<\/td><\/tr><tr><td>danach<\/td><td>Rechtschreibung und Vollständigkeit prüfen<\/td><\/tr><\/table><\/div>\n<div class=\"note\"><b class=\"lab\">Merke<\/b>Beim ersten Hören werden nicht alle Lücken gefüllt. Wer das versucht, verliert beim Nachdenken über eine Lücke den Anschluss und damit die drei folgenden.<\/div>\n<h3>Die Formate<\/h3>\n<ul><li><b class=\"e\">Multiple choice:<\/b> Achte auf die Antwort, die der Sprecher <b class=\"e\">zuletzt<\/b> bestätigt; oft werden Alternativen zuerst genannt und dann verworfen.<\/li><li><b class=\"e\">Note completion:<\/b> Gefragt sind meist ein bis drei Wörter, häufig genau die des Hörtextes. Achte auf die Grammatik der Lücke: Singular oder Plural, Zahl oder Wort.<\/li><li><b class=\"e\">Matching:<\/b> Sprecher und Aussagen zuordnen; achte auf Haltung und Bewertung, nicht nur auf das Thema.<\/li><li><b class=\"e\">True / False:<\/b> wie beim Lesen, nur ohne die Möglichkeit, zurückzublättern.<\/li><\/ul>\n<h3>Typische Fallen<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Falle<\/th><th>Beispiel<\/th><\/tr><tr><td>Korrektur im Text<\/td><td><span class=\"la\">We will meet at six … actually, let us make it half past six.<\/span><\/td><\/tr><tr><td>Verneinung<\/td><td><span class=\"la\">He did not say he was coming.<\/span><\/td><\/tr><tr><td>Zahl- und Buchstabenangaben<\/td><td>Postleitzahlen, Preise, Namen werden buchstabiert<\/td><\/tr><tr><td>Synonyme<\/td><td>Die Aufgabe sagt <span class=\"la\">cheap<\/span>, der Text sagt <span class=\"la\">affordable<\/span><\/td><\/tr><\/table><\/div>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>Zahlenangaben sind die häufigste Fehlerquelle. <span class=\"la\">Thirteen<\/span> und <span class=\"la\">thirty<\/span> klingen ähnlich; achte auf die Betonung: <span class=\"la\">THIRteen<\/span> gegen <span class=\"la\">THIRty<\/span>. Schreibe Zahlen beim ersten Hören als Ziffern auf, die Form prüfst du später.<\/div>\n<h3>Wenn du etwas nicht verstanden hast<\/h3>\n<p>Mach einen Strich und hör weiter. Der häufigste Totalverlust entsteht nicht durch eine schwierige Stelle, sondern dadurch, dass jemand an ihr hängen bleibt.<\/p>\n<div class=\"walk\"><h4>Schritt
