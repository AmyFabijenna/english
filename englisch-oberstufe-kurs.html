r noch drei Minuten. Was prüfst du?","h":"Was wirkt in kurzer Zeit auf die meisten Kriterien?","s":"Diese beiden Prüfungen betreffen zwei der vier Kriterien und dauern zusammen drei Minuten. Das vollständige Korrekturlesen wäre in dieser Zeit ohnehin nicht zu schaffen.","o":["Bullet Points und die persönliche Fehlerliste","die Rechtschreibung des ganzen Textes","ob die Überschrift gut klingt","ob der Text lang genug ist"]},{"type":"txt","a":["one","a single","einen"],"q":"Wie viele Gedanken gehören in einen Absatz? Antworte mit einer Zahl.","s":"Einer. Sobald ein zweiter Gedanke beginnt, beginnt ein neuer Absatz. Diese Regel macht den Aufbau ohne weiteres Zutun erkennbar."},{"type":"mc","q":"Was ist ein gutes Zeichen für den Schluss eines Textes?","s":"Ein Schluss, der nur wiederholt, ist verschenkter Platz. Eine Bilanz, ein Ausblick oder eine offene Frage bringt etwas Neues, ohne ein neues Thema zu eröffnen.","o":["Er sagt etwas, das nicht schon in der Einleitung stand.","Er wiederholt die Einleitung mit anderen Worten.","Er fasst zusammen, was der Text behandelt hat.","Er kündigt an, was man noch sagen könnte."]},{"type":"mc","q":"Wie lange sollte ein Übungstext liegen, bevor du ihn überarbeitest?","h":"Man erinnert sich an das Gemeinte.","s":"Ein Tag Abstand genügt, um den eigenen Text wie einen fremden zu lesen. In der Prüfung ist das nicht möglich, deshalb ersetzt dort die Checkliste den Abstand.","o":["idealerweise einen Tag","möglichst sofort","eine Woche","das ist gleichgültig"]},{"type":"self","q":"Nimm deinen letzten Übungstext und mache die vier Durchgänge mit der Uhr: eine, zwei, zwei und zwei Minuten. Notiere nach jedem Durchgang, was du gefunden hast.","s":"Vergleiche am Ende die vier Listen. Bei den meisten Lernenden ist der zweite Durchgang der ertragreichste, obwohl er am seltensten gemacht wird: Absätze und Verknüpfungen fallen beim Schreiben nicht auf, verbessern das Kriterium Aufbau aber sofort und ohne Risiko."}],"gen":["coll","wf"],"html":"<h3>Warum nach Kriterien überarbeitet wird<\/h3>\n<p>„Den Text noch einmal durchlesen“ findet fast nichts, weil man liest, was man gemeint hat. Wer dagegen vier getrennte Durchgänge macht und in jedem nur auf eine Sache achtet, findet deutlich mehr in kürzerer Zeit.<\/p>\n<h3>Die vier Durchgänge<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Durchgang<\/th><th>Dauer<\/th><th>Worauf du achtest<\/th><\/tr><tr><td>1 Aufgabe<\/td><td>1 Minute<\/td><td>Sind alle Bullet Points behandelt? Stimmt die Textsorte? Stimmt der Adressat? Wortzahl ungefähr erreicht?<\/td><\/tr><tr><td>2 Aufbau<\/td><td>2 Minuten<\/td><td>Gibt es Absätze? Beginnt jeder mit einem erkennbaren Gedanken? Gibt es Verknüpfungen zwischen den Absätzen?<\/td><\/tr><tr><td>3 Sprache<\/td><td>2 Minuten<\/td><td>Variieren Satzanfänge und Satzlängen? Gibt es blasse Wörter und Füllwörter? Passt das Register durchgehend?<\/td><\/tr><tr><td>4 Richtigkeit<\/td><td>2 Minuten<\/td><td>Deine persönliche Fehlerliste, Punkt für Punkt<\/td><\/tr><\/table><\/div>\n<div class=\"note\"><b class=\"lab\">Merke<\/b>Die Reihenfolge ist nicht beliebig. Wer mit der Grammatik beginnt, verbessert Sätze, die er vielleicht streichen müsste. Der erste Durchgang entscheidet über das wichtigste Kriterium, der letzte über das am leichtesten zu rettende.<\/div>\n<h3>Die Checkliste in Fragen<\/h3>\n<ul><li>Habe ich jeden Bullet Point mit mehr als einem Satz behandelt?<\/li><li>Beginnt mein Text mit etwas anderem als einer Ankündigung?<\/li><li>Hat jeder Absatz genau einen Gedanken?<\/li><li>Steht am Ende etwas, das nicht schon am Anfang stand?<\/li><li>Habe ich dreimal <span class=\"la\">I think<\/span> geschrieben?<\/li><li>Steht irgendwo ein Komma vor <span class=\"la\">that<\/span>?<\/li><li>Stimmt das Register vom ersten bis zum letzten Satz?<\/li><\/ul>\n<h3>Selbsteinschätzung nach den vier Kriterien<\/h3>\n<p>Gib dir nach jedem Übungstext selbst Punkte von null bis zehn in den vier Kriterien und notiere zu jedem einen Satz, warum. Nach fünf Texten erkennst du dein Muster: Fast alle Lernenden sind in zwei Kriterien stabil und verlieren immer in denselben beiden.<\/p>\n<div class=\"note t\"><b class=\"lab\">Tipp<\/b>Lass einen Übungstext einen Tag liegen, bevor du ihn überarbeitest. Was man selbst geschrieben hat, liest man am selben Tag nicht, sondern erinnert es.<\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Ein Text, vier Durchgänge<\/h4><div class=\"task\">Dein Text behandelt drei Bullet Points, hat 240 von 250 Wörtern und ist in einem Block geschrieben.<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div><b class=\"e\">Durchgang 1:<\/b> Bullet Points abhaken. Der dritte kommt nur in einem Nebensatz vor, also zwei Sätze ergänzen, notfalls an anderer Stelle kürzen.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div><b class=\"e\">Durchgang 2:<\/b> Der Block wird in vier Absätze geteilt: Einleitung, drei Gedanken. Zwischen Absatz zwei und drei fehlt eine Verknüpfung, also ein Wort wie <span class=\"la\">Moreover<\/span> oder ein Rückverweis einfügen.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div><b class=\"e\">Durchgang 3:<\/b> Drei Sätze beginnen mit <span class=\"la\">I think<\/span>. Zwei davon werden umformuliert, einer gestrichen.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div><b class=\"e\">Durchgang 4:<\/b> Die persönliche Fehlerliste: drittes s, <span class=\"la\">since<\/span> und <span class=\"la\">for<\/span>, Komma vor <span class=\"la\">that<\/span>. Gefunden werden zwei Fehler in zwei Minuten.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"speaking","t":"Sprechen: die mündliche Prüfung in Kürze","kl":"4","k":4,"a":"P","tag":"Fortgeschritten","goals":["wissen, wie die mündliche Prüfung in Englisch abläuft","den Unterschied zwischen monologischem und dialogischem Teil kennen","den Übergang vom Schreiben zum Sprechen schaffen"],"ex":[{"type":"mc","q":"Woraus besteht die mündliche Prüfung?","s":"Eine Aufgabenstellung zu einem Themenbereich, aufgeteilt in zwei gleich gewichtete Teile.","o":["aus einem monologischen und einem dialogischen Teil zum selben Themenbereich","nur aus einem Gespräch mit der Prüferin","aus einer Übersetzung und einem Gespräch","aus drei kurzen Aufgaben zu drei Themen"]},{"type":"mc","q":"Welche Hilfsmittel sind in der Vorbereitungszeit zugelassen?","h":"Das ist anders als bei der Klausur.","s":"In den lebenden Fremdsprachen sind für die mündliche Prüfung keine Hilfsmittel vorgesehen. Deshalb lohnt sich das Üben von Umschreibungen.","o":["keine","ein einsprachiges Wörterbuch","ein zweisprachiges Wörterbuch","die eigene Mitschrift"]},{"type":"mc","q":"Was muss im dialogischen Teil auf B2 am Ende stehen?","h":"Die Aufgabe ist ergebnisorientiert.","s":"Ohne ausgesprochene Entscheidung ist die Aufgabenstellung im dialogischen Teil nicht erfüllt, und genau dieses Kriterium muss in beiden Teilen positiv sein.","o":["eine gemeinsame Entscheidung","eine Zusammenfassung des Monologs","eine Liste von Vor- und Nachteilen","eine Übersetzung"]},{"type":"mc","q":"Dir fehlt beim Sprechen ein Wort. Was ist am besten?","s":"Umschreiben zeigt Kompetenz und hält den Redefluss aufrecht. Pausen und deutsche Wörter kosten direkt bei zwei Kriterien.","o":["umschreiben und weitersprechen","stehen bleiben und überlegen","das deutsche Wort verwenden","den Satz abbrechen"]},{"type":"txt","a":["B2"],"q":"Auf welchem Niveau wird in der ersten lebenden Fremdsprache mündlich geprüft?","s":"B2. Das entspricht der Fähigkeit, zusammenhängend zu sprechen, zu argumentieren und ein Gespräch aktiv zu führen."},{"type":"mc","q":"Wie unterscheidet sich ein guter gesprochener Satz von einem guten geschriebenen?","s":"Beim Sprechen gibt es keine zweite Fassung. Kürzere Sätze lassen sich zu Ende bringen, und genau das misst das Kriterium Flüssigkeit.","o":["Er ist kürzer und weniger verschachtelt.","Er ist länger, weil man mehr Zeit hat.","Er enthält mehr Fachwörter.","Es gibt keinen Unterschied."]},{"type":"self","q":"Nimm eines der sieben Themen aus den Wortschatzkapiteln und sprich zwei Minuten darüber, ohne etwas aufzuschreiben. Nimm dich auf und höre einmal hinein.","s":"Achte beim Hören auf drei Dinge: Wie oft hast du neu angesetzt? Wie viele Fachwörter aus dem Thema sind vorgekommen? Hast du einen erkennbaren Schluss gesprochen oder bist du versandet? Diese drei Beobachtungen sagen mehr über deinen Stand als jede Selbsteinschätzung."}],"gen":["vok","coll","phr"],"html":"<h3>Der Aufbau in zwei Sätzen<\/h3>\n<p>Die mündliche Reifeprüfung in der ersten lebenden Fremdsprache besteht aus einer Aufgabenstellung zu einem Themenbereich, die in einen <b class=\"e\">monologischen<\/b> und einen <b class=\"e\">dialogischen<\/b> Teil zerfällt. Geprüft wird auf Niveau <b class=\"e\">B2<\/b>, und beide Teile zählen gleich viel.<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Teil<\/th><th>Dauer (Empfehlung B2)<\/th><th>Aufbau<\/th><\/tr><tr><td>monologisch<\/td><td>etwa 5 Minuten<\/td><td>ein Impuls, meist eine Grafik oder ein Bild, dazu drei Unterpunkte mit Operatoren<\/td><\/tr><tr><td>dialogisch<\/td><td>etwa 10 Minuten<\/td><td>ein situativer Kontext mit fünf Inhaltspunkten, ergebnisorientiert<\/td><\/tr><\/table><\/div>\n<p>Die Vorbereitungszeit beträgt mindestens 15 Minuten, und zwar <b class=\"e\">ohne Hilfsmittel<\/b>: Ein Wörterbuch ist nicht zugelassen.<\/p>\n<div class=\"note\"><b class=\"lab\">Merke<\/b>Beurteilt wird nach vier gleich gewichteten Kriterien: Erfüllung der Aufgabenstellung, Flüssigkeit und Interaktion, Spektrum und Richtigkeit gesprochener Sprache. Für eine positive Gesamtbeurteilung muss das erste in <b class=\"e\">beiden<\/b> Teilen positiv sein.<\/div>\n<h3>Was du aus diesem Kurs mitnimmst<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Aus diesem Kurs<\/th><th>Im Sprechen<\/th><\/tr><tr><td>Themenwortschatz<\/td><td>die Fachwörter, die dein Sprechen über das Alltagsniveau heben<\/td><\/tr><tr><td>Redemittel der Textsorten<\/td><td>Gliederungssignale für den Monolog<\/td><\/tr><tr><td>Konnektoren<\/td><td>der hörbare rote Faden<\/td><\/tr><tr><td>Fehlerliste<\/td><td>die Fehler, auf die du beim Sprechen besonders achtest<\/td><\/tr><\/table><\/div>\n<h3>Der Unterschied zum Schreiben<\/h3>\n<ul><li>Beim Sprechen gibt es keine Überarbeitung. Deshalb gilt: <b class=\"e\">einfacher formulieren als beim Schreiben<\/b>, dafür ohne Abbruch.<\/li><li>Selbstkorrektur ist erlaubt und zählt positiv: kurz verbessern und weitersprechen.<\/li><li>Fehlt ein Wort, wird umschrieben: <span class=\"la\">it's the thing you use to …<\/span> Das ist eine Kompetenz, kein Mangel.<\/li><\/ul>\n<div class=\"note t\"><b class=\"lab\">Tipp<\/b>Die mündliche Prüfung hat eine eigene Seite in dieser Reihe, mit Ablauf, Bewertungsraster, Redemitteln für beide Teile und einer Simulation. Dieses Kapitel ist nur die Brücke dorthin.<\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Vom geschriebenen zum gesprochenen Satz<\/h4><div class=\"task\">Du hast geschrieben: <span class=\"la\">The most striking figure in this chart is the one concerning the amount of time spent on screens by the youngest age group.<\/span><\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div><b class=\"e\">Problem erkennen:<\/b> Dieser Satz ist für das Sprechen zu lang; mitten darin verliert man den Faden.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div><b class=\"e\">Zerlegen:<\/b> <span class=\"la\">Look at the youngest group. They spend far more time on screens than I expected.<\/span><\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div><b class=\"e\">Prüfen:<\/b> Beide Sätze sind vollständig und einfach, der Inhalt bleibt gleich.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div><b class=\"e\">Merken:<\/b> Geschriebene Sätze werden gesprochen kürzer. Die Verbindungswörter bleiben, die Verschachtelung geht.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"}]};

const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[.,;:!?"„“()]/g,' ').replace(/\s+/g,' ').trim();
function check(e,val){
  if(e.type==='num'){const x=Number(String(val).trim().replace(/\./g,'').replace(',','.'));if(String(val).trim()===''||isNaN(x))return null;return Math.abs(x-e.a)<0.001}
  const v=norm(val);if(!v)return null;return e.a.some(a=>norm(a)===v);
}
const ansText=e=>e.type==='num'?String(e.a):e.a[0];

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function exHTML(e,label){
  let h='<div class="nr">'+label+'</div><div class="q">'+e.q+'</div>';
  if(e.type==='mc'){h+='<div class="opts">'+shuffle(e.o.map((o,i)=>[o,i])).map(([o,i])=>'<button class="opt" data-i="'+i+'">'+o+'</button>').join('')+'</div>'}
  else if(e.type==='self'){h+='<div class="row"><button class="ghost show">Musterlösung zeigen</button></div>'}
  else{h+='<div class="row"><input type="text" placeholder="deine Antwort" autocomplete="off" autocapitalize="off" spellcheck="false"> <button class="chk">Prüfen</button><button class="ghost show" style="display:none">Lösung zeigen</button></div>'}
  return h+'<div class="fb"></div>';
}
function wireEx(box,e,onOk){
  const fb=box.querySelector('.fb');let tries=0;
  const show=(cls,head,body)=>{fb.className='fb show '+cls;fb.innerHTML='<b class="h">'+head+'</b>'+body};
  const sol=()=>'<div>'+e.s+'</div>';
  const good=()=>{box.classList.remove('no');box.classList.add('ok');show('good','Richtig!',sol());onOk&&onOk()};
  if(e.type==='mc'){
    box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      if(box.dataset.fin)return;
      if(+b.dataset.i===0){b.classList.add('right');box.dataset.fin=1;if(tries===0)good();else show('good','Jetzt stimmt es.',sol())}
      else{b.classList.add('wrong');b.disabled=true;tries++;box.classList.add('no');
        if(tries===1&&e.o.length>2)show('hint','Noch nicht.',e.h?('Tipp: '+e.h):'Lies die Angabe noch einmal genau und versuche es erneut.');
        else{box.dataset.fin=1;box.querySelector('.opt[data-i="0"]').classList.add('right');show('bad','Die richtige Antwort ist markiert.',sol())}}
    });
  }else if(e.type==='self'){
    box.querySelector('.show').onclick=()=>{show('good','Musterlösung',sol()+'<div class="row"><button class="petrol yes">Sinngemäß hatte ich das auch</button><button class="ghost nope">Noch nicht ganz</button></div>');
      fb.querySelector('.yes').onclick=()=>{box.classList.add('ok');onOk&&onOk();fb.querySelector('.row').remove()};
      fb.querySelector('.nope').onclick=()=>{fb.querySelector('.row').innerHTML='Kein Problem. Vergleiche Wort für Wort mit der Musterlösung, markiere die Stelle, an der du abgewichen bist, und versuche den Satz morgen noch einmal.'}};
  }else{
    const inp=box.querySelector('input'),sb=box.querySelector('.show');
    const go=()=>{
      const r=check(e,inp.value);
      if(r===null){show('hint','Noch keine Eingabe.',e.type==='num'?'Gib eine Zahl ein.':'Tippe deine Antwort ins Feld. Groß- und Kleinschreibung und Längenzeichen spielen keine Rolle.');return}
      if(r){if(box.dataset.shown)show('good','Stimmt.',sol());else good();return}
      tries++;box.classList.add('no');sb.style.display='';
      show(tries===1&&e.h?'hint':'bad','Noch nicht richtig.',tries===1&&e.h?('Tipp: '+e.h):(e.type==='num'?'Überlege noch einmal – oder sieh dir die Lösung an.':'Prüfe Stamm und Endung noch einmal – oder sieh dir die Lösung an und bilde die Form danach selbst.'));
    };
    box.querySelector('.chk').onclick=go;inp.onkeydown=ev=>{if(ev.key==='Enter')go()};
    sb.onclick=()=>{box.dataset.shown=1;show('bad','Lösung: '+ansText(e),sol())};
  }
}

/* Zeiten: Satz mit Lücke | zulässige Antworten | Erklärung */
const TENSEQ=P(`I ___ (live) in Vienna since 2019.|have lived;have been living;'ve lived;'ve been living|Mit „since“ und „for“ steht das Present Perfect, weil die Handlung in der Vergangenheit begann und bis jetzt andauert. Im Deutschen steht hier Präsens, und genau daraus entsteht der häufigste Fehler.
She ___ (not / finish) her project yet.|has not finished;hasn't finished;has not yet finished|„yet“ in der Verneinung verlangt das Present Perfect: Es geht um den Stand jetzt, nicht um einen Zeitpunkt in der Vergangenheit.
When I ___ (arrive), the meeting had already started.|arrived|Zwei Handlungen in der Vergangenheit: Die frühere steht im Past Perfect, die spätere im Simple Past.
They ___ (watch) a film when the power went out.|were watching|Die laufende Handlung im Hintergrund steht im Past Progressive, das plötzliche Ereignis im Simple Past.
By next June I ___ (finish) school.|will have finished;'ll have finished|„By + Zeitpunkt in der Zukunft“ verlangt das Future Perfect: zu diesem Zeitpunkt abgeschlossen.
Look at those clouds! It ___ (rain).|is going to rain;'s going to rain|Sichtbare Anzeichen in der Gegenwart verlangen „going to“, nicht „will“.
Water ___ (boil) at 100 degrees.|boils|Allgemeingültige Tatsachen stehen im Simple Present.
I ___ (see) him yesterday at the station.|saw|Ein abgeschlossener Zeitpunkt in der Vergangenheit („yesterday“) verlangt das Simple Past, auch wenn im Deutschen Perfekt steht.
He ___ (work) here for ten years before he moved to Berlin.|had worked;had been working|Vorzeitig zu einer anderen Vergangenheit: Past Perfect.
Our train ___ (leave) at 7.45 tomorrow morning.|leaves;is leaving|Fahrpläne stehen im Simple Present, feste persönliche Pläne im Present Progressive. Beides ist hier richtig.
This time next week I ___ (lie) on a beach.|will be lying;'ll be lying|„This time next week“ beschreibt einen Verlauf in der Zukunft: Future Progressive.
She ___ (always / complain) about the weather.|is always complaining;'s always complaining|Present Progressive mit „always“ drückt Ärger über eine Gewohnheit aus.
I ___ (know) her since primary school.|have known;'ve known|Zustandsverben wie „know“ stehen nicht in der Verlaufsform: „have known“, nicht „have been knowing“.
How long ___ (you / wait)?|have you been waiting;have you waited|Die Frage nach der Dauer bis jetzt verlangt das Present Perfect, meist in der Verlaufsform.
If it ___ (rain) tomorrow, we will stay at home.|rains|Im if-Satz des Conditional I steht das Simple Present, nie „will“.
If I ___ (have) more time, I would read more.|had|Conditional II: Simple Past im if-Satz, „would“ nur im Hauptsatz.
If she had studied harder, she ___ (pass) the exam.|would have passed;'d have passed|Conditional III für den unmöglichen Rückblick: „would have“ plus Past Participle.
The house ___ (build) in 1890.|was built|Passiv im Simple Past: „was“ plus Past Participle.
The results ___ (publish) next week.|will be published;are going to be published|Passiv im Futur: „will be“ plus Past Participle.
Our school ___ (renovate) at the moment.|is being renovated|Passiv im Present Progressive: „is being“ plus Past Participle.
I ___ (not / sleep) well last night.|did not sleep;didn't sleep|Verneinung im Simple Past mit „did not“ plus Grundform.
___ (you / ever / be) to Ireland?|Have you ever been|„ever“ in der Frage nach Lebenserfahrung verlangt das Present Perfect.
He said he ___ (call) me the next day.|would call;'d call|In der indirekten Rede wird „will“ zu „would“.
When I was a child, we ___ (spend) every summer at the lake.|spent;used to spend;would spend|Wiederholte Handlungen in der Vergangenheit: Simple Past oder „used to“.
Before she moved here, she ___ (never / live) in a city.|had never lived|Vorzeitigkeit in der Vergangenheit: Past Perfect.
The film ___ (already / start) when we got to the cinema.|had already started|Die frühere der beiden Vergangenheiten steht im Past Perfect.
I ___ (study) French for two years now.|have been studying;have studied;'ve been studying|„for … now“ beschreibt die Dauer bis jetzt: Present Perfect, meist in der Verlaufsform.
She ___ (not / speak) to me since the argument.|has not spoken;hasn't spoken|„since“ verlangt das Present Perfect.
Don't phone at eight, we ___ (have) dinner then.|will be having;'ll be having;are having|Ein Verlauf zu einem Zeitpunkt in der Zukunft: Future Progressive oder, als Plan, Present Progressive.
He ___ (live) in Graz for years before he found that job.|had lived;had been living|Past Perfect für das, was der anderen Vergangenheit vorausgeht.
Listen! Somebody ___ (knock) at the door.|is knocking;'s knocking|„Listen!“ zeigt den Vorgang jetzt an: Present Progressive.
My sister ___ (not / like) coffee.|does not like;doesn't like|Gewohnheit beziehungsweise Zustand in der Gegenwart: Simple Present.
The letter ___ (write) by my grandmother.|was written|Passiv im Simple Past.
We ___ (know) each other for ages.|have known;'ve known|Dauer bis jetzt und ein Zustandsverb: Present Perfect ohne Verlaufsform.
While I ___ (cook), the phone rang.|was cooking|Der laufende Hintergrund steht im Past Progressive.
She ___ (just / arrive).|has just arrived;'s just arrived|„just“ für das eben Geschehene verlangt das Present Perfect.
By the time we arrived, they ___ (leave).|had left|Past Perfect, weil das Weggehen vor dem Ankommen lag.
This book ___ (translate) into forty languages so far.|has been translated|Passiv im Present Perfect: „has been“ plus Past Participle.
I wish I ___ (can) help you.|could|Nach „I wish“ steht die Vergangenheitsform, bei „can“ also „could“.

There is strong ___ between the two supermarkets in our town.|competition|concurrence;concurrency;competence|„concurrence“ heißt Übereinstimmung. Konkurrenz im wirtschaftlichen Sinn heißt „competition“.

The course was really useful; the handouts were especially ___.|handy|handful;handed;handsome|Hier passt „handy“ tatsächlich: Es heißt praktisch, nützlich. Genau diese Bedeutung macht es als falschen Freund so gefährlich.

const PHRQ2=P(`The match was ___ altogether; it will not be replayed this season.|called off|put off;taken off;set off|„call off“ heißt endgültig absagen. „put off“ wäre nur verschoben, „take off“ abheben, „set off“ aufbrechen.

I cannot ___ this noise from the building site any longer.|put up with|put up;put off;put down|„put up with something“ heißt etwas ertragen. „put up“ allein heißt aufstellen oder unterbringen, „put down“ absetzen.

const GEN={
irr:{n:'Unregelmäßige Verben',f(){const v=pick(IRR),p=ri(0,1);

  s:'Die drei Formen lauten '+L(v[0]+' – '+v[1]+' – '+v[2])+' ('+v[3]+').'}}},
tense:{n:'Zeiten einsetzen',f(){const q=pick(TENSEQ);
  return{type:'txt',q:'Setze die richtige Form ein: '+L(q[0]),a:q[1].split(';'),s:q[2]+' Richtig ist '+L(q[1].split(';')[0])+'.'}}},
prep:{n:'Präpositionen',f(){const q=pick(PREPQ);
  return{type:'txt',q:'Welche Präposition fehlt? '+L(q[0]),a:q[1].split(';'),s:q[2]}}},
wf:{n:'Wortbildung',f(){const q=pick(WFQ);
  return{type:'txt',q:q[0],a:q[1].split(';'),s:q[2]}}},
coll:{n:'Kollokationen',f(){const q=pick(COLLQ);
  return{type:'txt',q:'Welches Verb passt? '+L(q[0]),a:q[1].split(';'),s:q[2]}}},
rep:{n:'Indirekte Rede',f(){const q=pick(REPQ);
  return{type:'txt',q:'Gib in der indirekten Rede wieder: '+L(q[0]),a:q[1].split(';'),s:q[2]+' Richtig ist: '+L(q[1].split(';')[0])+'.'}}},
phr:{n:'Phrasal Verbs im Kontext',f(){const q=pick(PHRQ2);
  return{type:'mc',q:'Welches Phrasal Verb passt? '+L(q[0]),o:[q[1]].concat(q[2].split(';')),s:q[3]}}},
ff:{n:'False Friends im Kontext',f(){const q=pick(FFQ2);
  return{type:'mc',q:'Welches Wort passt? '+L(q[0]),o:[q[1]].concat(q[2].split(';')),s:q[3]}}},
pass:{n:'Passiv bilden',f(){const v=pick(PASSV),t=pick(PASST),pl=/s$/.test(v[3]);
  const act={'Simple Present':'They '+t[1]+v[0]+' ','Simple Past':'They '+v[1]+' ','Present Perfect':'They have '+t[1]+v[2]+' ','will-Future':'They will '+v[0]+' '}[t[0]]+v[3]+'.';
  const be={'Simple Present':(pl?'are ':'is ')+t[1],'Simple Past':pl?'were ':'was ','Present Perfect':(pl?'have ':'has ')+t[1]+'been ','will-Future':'will be '}[t[0]];
  const sol=v[3].charAt(0).toUpperCase()+v[3].slice(1)+' '+be+v[2]+'.';
  return{type:'txt',q:'Setze ins Passiv (ohne „by“-Angabe), '+t[0]+': '+L(act),a:[sol,sol.replace(/\.$/,'')],

cond:{n:'If-Sätze',f(){const q=pick(CONDQ);

ginf:{n:'Gerund oder Infinitiv',f(){const q=pick(GINFQ);

vok:{n:'Wortschatz im Kontext',f(){const q=pick(LEXQ);

function mix(){
  const sets=[['Alles gemischt',Object.keys(GEN)],['Verben und Zeiten',['irr','tense','pass','rep']],['Wortschatz',['vok','phr','coll','ff']],['Wortbildung',['wf']],['Präpositionen',['prep']],['Unregelmäßige Verben',['irr']]];
  $('#main').innerHTML='<div class="chead cG"><span class="tag">Training</span><h2 style="margin-top:.5em">Grammatik- und Wortschatztrainer</h2><p style="margin:0">Hier entstehen laufend neue Aufgaben. Wähle, was du üben willst. Wenn du zehn Aufgaben hintereinander ohne Fehler schaffst, sitzt der Bereich.</p></div><div class="row" id="mixsel" style="margin-bottom:18px">'+sets.map((s,i)=>'<button class="'+(i?'ghost':'')+'" data-i="'+i+'">'+s[0]+'</button>').join('')+'</div><div class="cG" id="mixhost"></div>';
  const start=i=>{$('#mixhost').innerHTML='';genBox(sets[i][1],$('#mixhost'),sets[i][0]);$$('#mixsel button').forEach((b,j)=>b.className=j===i?'':'ghost')};
  $$('#mixsel button').forEach(b=>b.onclick=()=>start(+b.dataset.i));start(0);
}
function chapter(c){
  const prev=CH[c.i-1],next=CH[c.i+1];
  let h='<div class="c'+c.a+'"><div class="chead"><span class="tag">'+AREAS[c.a]+'</span><span class="tag">'+c.tag+'</span><h2 style="margin-top:.5em">'+c.t+'</h2><b>Das kannst du nach diesem Kapitel:</b><ul class="goals">'+c.goals.map(g=>'<li>'+g+'</li>').join('')+'</ul></div>';
  h+=c.html;
  h+='<h3 id="ueb">Übungen</h3><p>Groß- und Kleinschreibung spielt beim Eintippen keine Rolle, Kurzformen wie <span class="la">don’t</span> sind erlaubt. Wo mehrere Lösungen richtig sind, wird jede davon anerkannt. Bei den offenen Aufgaben schreibst du zuerst selbst und vergleichst dann mit der Musterlösung.</p><div id="exhost"></div>';
  if(c.gen.length)h+='<h3>Endlos-Training</h3><p>Immer neue Aufgaben nach demselben Muster. Übe so lange weiter, bis du nicht mehr überlegen musst.</p><div id="genhost"></div>';
  h+='<div class="navrow">'+(prev?'<a href="#'+prev.id+'"><button class="ghost">← '+prev.t+'</button></a>':'<span></span>')+(next?'<a href="#'+next.id+'"><button>'+next.t+' →</button></a>':'<a href="#"><button>Zur Startseite</button></a>')+'</div></div>';
  $('#main').innerHTML=h;
  $$('.walk').forEach(w=>{const st=[...w.querySelectorAll('.wstep')],b=w.querySelector('.nxt'),all=w.querySelector('.all');let i=0;
    const upd=()=>{b.disabled=i>=st.length;b.textContent=i>=st.length?'Fertig':(i===0?'Ersten Schritt zeigen':'Nächster Schritt');if(i>=st.length)all.style.display='none'};
    b.onclick=()=>{if(i<st.length){st[i++].classList.add('show');upd()}};all.onclick=()=>{st.forEach(s=>s.classList.add('show'));i=st.length;upd()};upd()});
  const host=$('#exhost');
  c.ex.forEach((e,i)=>{const box=document.createElement('div');box.className='ex'+(ST.ok[c.id+'_'+i]?' ok':'');box.innerHTML=exHTML(e,'Aufgabe '+(i+1)+(ST.ok[c.id+'_'+i]?' · schon gelöst ✓':''));host.appendChild(box);wireEx(box,e,()=>{ST.ok[c.id+'_'+i]=1;save();progress()})});
  if(c.gen.length)genBox(c.gen,$('#genhost'));
}
function route(){
  const id=location.hash.slice(1);
  if(id==='mix')mix();else if(BYID[id])chapter(BYID[id]);else home();
  $$('aside a.ch').forEach(a=>a.classList.toggle('on',a.dataset.id===id));
  const on=$('aside a.ch.on');if(on&&on.scrollIntoView)on.scrollIntoView({block:'nearest'});
  progress();window.scrollTo(0,0);
}
sidebar();window.addEventListener('hashchange',route);$('#menuBtn').onclick=()=>$('#side').classList.toggle('open');route();

</script>
</body>
