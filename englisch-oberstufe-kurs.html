a\">worked<\/span><\/td><td>Past Perfect <span class=\"la\">had worked<\/span><\/td><\/tr><tr><td>Present Perfect <span class=\"la\">has worked<\/span><\/td><td>Past Perfect <span class=\"la\">had worked<\/span><\/td><\/tr><tr><td>Past Perfect <span class=\"la\">had worked<\/span><\/td><td>bleibt <span class=\"la\">had worked<\/span><\/td><\/tr><tr><td><span class=\"la\">will<\/span><\/td><td><span class=\"la\">would<\/span><\/td><\/tr><tr><td><span class=\"la\">can<\/span><\/td><td><span class=\"la\">could<\/span><\/td><\/tr><tr><td><span class=\"la\">may<\/span><\/td><td><span class=\"la\">might<\/span><\/td><\/tr><tr><td><span class=\"la\">must<\/span><\/td><td><span class=\"la\">had to<\/span><\/td><\/tr><\/table><\/div>\n<p>Mit verschoben werden auch die <b>Personen<\/b>, die <b>Orte<\/b> und die <b>Zeiten<\/b>:<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th><span class=\"la\">I, my<\/span><\/th><th><span class=\"la\">he/she, his/her<\/span><\/th><\/tr><tr><td><span class=\"la\">here<\/span><\/td><td><span class=\"la\">there<\/span><\/td><\/tr><tr><td><span class=\"la\">this<\/span><\/td><td><span class=\"la\">that<\/span><\/td><\/tr><tr><td><span class=\"la\">now<\/span><\/td><td><span class=\"la\">then<\/span><\/td><\/tr><tr><td><span class=\"la\">today<\/span><\/td><td><span class=\"la\">that day<\/span><\/td><\/tr><tr><td><span class=\"la\">tomorrow<\/span><\/td><td><span class=\"la\">the next day<\/span><\/td><\/tr><tr><td><span class=\"la\">yesterday<\/span><\/td><td><span class=\"la\">the day before<\/span><\/td><\/tr><tr><td><span class=\"la\">last week<\/span><\/td><td><span class=\"la\">the week before<\/span><\/td><\/tr><tr><td><span class=\"la\">next year<\/span><\/td><td><span class=\"la\">the following year<\/span><\/td><\/tr><tr><td><span class=\"la\">ago<\/span><\/td><td><span class=\"la\">before<\/span><\/td><\/tr><\/table><\/div>\n<div class=\"formula\"><span class=\"la\">She said: „I saw him here yesterday.“<\/span> → <span class=\"la\">She said that she <b class=\"e\">had seen<\/b> him <b class=\"e\">there the day before<\/b>.<\/span><\/div>\n<div class=\"note t\"><b class=\"lab\">Tipp<\/b>Das Wort <span class=\"la\">that<\/span> kann immer wegfallen: <span class=\"la\">She said she was tired<\/span> ist genauso richtig wie <span class=\"la\">She said that she was tired<\/span>. In gesprochener Sprache lässt man es meist weg.<\/div>\n<h3>Fragen in der indirekten Rede<\/h3>\n<p>Hier passieren zwei Dinge auf einmal: Die Zeiten verschieben sich, und die <b>Fragestellung verschwindet<\/b>. Es gibt keine Umstellung und kein <span class=\"la\">do<\/span> mehr.<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Art der Frage<\/th><th>Anschluss<\/th><th>Beispiel<\/th><\/tr><tr><td>mit Fragewort<\/td><td>das Fragewort bleibt<\/td><td><span class=\"la\">She asked: „Where do you live?“<\/span> → <span class=\"la\">She asked <b class=\"e\">where I lived<\/b>.<\/span><\/td><\/tr><tr><td>Entscheidungsfrage<\/td><td><span class=\"la\">if<\/span> oder <span class=\"la\">whether<\/span><\/td><td><span class=\"la\">He asked: „Are you coming?“<\/span> → <span class=\"la\">He asked <b class=\"e\">if I was coming<\/b>.<\/span><\/td><\/tr><\/table><\/div>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>Nach dem Fragewort folgt die <b>normale Satzstellung<\/b>: Subjekt, dann Prädikat. <span class=\"la\">She asked where did I live<\/span> ist falsch, auch wenn die direkte Frage so lautete.<\/div>\n<h3>Aufforderungen und Bitten<\/h3>\n<p>Diese werden mit dem <b>Infinitiv mit <span class=\"la\">to<\/span><\/b> wiedergegeben:<\/p>\n<div class=\"formula\"><span class=\"la\">„Open the window.“<\/span> → <span class=\"la\">She told me <b class=\"e\">to open<\/b> the window.<\/span><\/div>\n<div class=\"formula\"><span class=\"la\">„Don't be late!“<\/span> → <span class=\"la\">She told me <b class=\"e\">not to be<\/b> late.<\/span><\/div>\n<div class=\"formula\"><span class=\"la\">„Could you help me, please?“<\/span> → <span class=\"la\">She asked me <b class=\"e\">to help<\/b> her.<\/span><\/div>\n<p><span class=\"la\">tell<\/span> verwendet man bei Aufforderungen, <span class=\"la\">ask<\/span> bei Bitten. Beide brauchen ein Objekt: <span class=\"la\">told <b class=\"e\">me<\/b> to …<\/span>, nicht <span class=\"la\">told to …<\/span><\/p>\n<h3>Wann nicht verschoben wird<\/h3>\n<ul><li>wenn die Aussage <b>immer noch gilt<\/b>: <span class=\"la\">He said that water boils at 100 °C.<\/span><\/li><li>wenn das einleitende Verb im <b>Präsens<\/b> steht: <span class=\"la\">She says she is tired.<\/span><\/li><li>bei Typ-2- und Typ-3-If-Sätzen, die schon in der Vergangenheit stehen.<\/li><\/ul>\n<div class=\"walk\"><h4>Schritt für Schritt: Eine Aussage vollständig umformen<\/h4><div class=\"task\">Gib wieder: <span class=\"la\">Tom said: „I will call you tomorrow, I promise.“<\/span><\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Zuerst das einleitende Verb: <span class=\"la\">said<\/span> steht in der Vergangenheit, also wird verschoben.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Die Zeitform: <span class=\"la\">will<\/span> wird zu <b><span class=\"la\">would<\/span><\/b>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Die Personen: <span class=\"la\">I<\/span> ist Tom, also <span class=\"la\">he<\/span>. <span class=\"la\">you<\/span> ist die sprechende Person, also <span class=\"la\">me<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div>Die Zeitangabe: <span class=\"la\">tomorrow<\/span> wird zu <b><span class=\"la\">the next day<\/span><\/b>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">5<\/div><div>Zusammensetzen: <span class=\"la\">Tom said that <b class=\"e\">he would call me the next day<\/b>.<\/span><\/div><\/div><div class=\"wstep final\"><div class=\"n\">6<\/div><div>Der Zusatz <span class=\"la\">I promise<\/span> wird zu <span class=\"la\">he promised<\/span> oder entfällt, weil das Versprechen schon im Hauptsatz steckt: <span class=\"la\">Tom promised to call me the next day.<\/span><\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"modals","t":"Modalverben und ihre Ersatzformen","kl":"2","k":2,"a":"G","tag":"Aufbau","goals":["die Bedeutungen der Modalverben sicher unterscheiden","Ersatzformen für die Zeiten bilden, in denen das Modalverb fehlt","Vermutungen über die Vergangenheit ausdrücken","den Unterschied zwischen _mustn't_ und _needn't_ beherrschen"],"ex":[{"type":"txt","a":["had to"],"q":"Setze die Ersatzform ein: <span class=\"la\">Yesterday we <span class=\"gap\">___<\/span> (must) wait for over an hour.<\/span>","h":"<span class=\"la\">must<\/span> hat keine Vergangenheitsform.","s":"<span class=\"la\">had to<\/span>. Die Vergangenheit von <span class=\"la\">must<\/span> wird immer mit <span class=\"la\">had to<\/span> gebildet. <span class=\"la\">musted<\/span> gibt es nicht."},{"type":"txt","a":["will be able to","'ll be able to"],"q":"Setze die Ersatzform ein: <span class=\"la\">After the course you <span class=\"gap\">___<\/span> (can) read simple texts.<\/span>","h":"<span class=\"la\">can<\/span> hat keine Zukunftsform.","s":"<span class=\"la\">will be able to<\/span>. <span class=\"la\">can<\/span> kann nicht hinter <span class=\"la\">will<\/span> stehen; die Ersatzform ist <span class=\"la\">be able to<\/span>. Dasselbe gilt für <span class=\"la\">must<\/span>: <span class=\"la\">will have to<\/span>."},{"type":"txt","a":["mustn't","must not"],"q":"Setze ein: <span class=\"la\">You <span class=\"gap\">___<\/span> use your phone during the test.<\/span> ~Verbot~","h":"Verbot oder Nicht-Notwendigkeit?","s":"<span class=\"la\">mustn't<\/span>. Ein Verbot drückt man mit <span class=\"la\">mustn't<\/span> aus. <span class=\"la\">don't have to<\/span> hieße, dass es erlaubt, aber nicht nötig wäre."},{"type":"txt","a":["don't have to","do not have to","needn't","need not"],"q":"Setze ein: <span class=\"la\">It's Saturday, you <span class=\"gap\">___<\/span> get up early.<\/span> ~nicht nötig~","h":"Hier ist nichts verboten.","s":"<span class=\"la\">don't have to<\/span> oder <span class=\"la\">needn't<\/span>. Beide drücken aus, dass etwas nicht nötig ist. <span class=\"la\">mustn't<\/span> wäre ein Verbot und damit sinnentstellend."},{"type":"mc","q":"<span class=\"la\">The lights are off. They <span class=\"gap\">___<\/span> home already.<\/span>","h":"Wie sicher bist du dir, und wann war es?","s":"<span class=\"la\">must have<\/span> plus Past Participle drückt eine starke Vermutung über die Vergangenheit aus. <span class=\"la\">should have gone<\/span> hieße, sie hätten gehen sollen, es aber nicht getan.","o":["<span class=\"la\">must have gone<\/span>","<span class=\"la\">must go<\/span>","<span class=\"la\">should have gone<\/span>","<span class=\"la\">can have gone<\/span>"]},{"type":"mc","q":"Was bedeutet <span class=\"la\">You needn't have cooked, we ate on the way<\/span>?","h":"<span class=\"la\">needn't have<\/span> bezieht sich immer auf etwas, das geschehen ist.","s":"<span class=\"la\">needn't have done<\/span> heißt: Es ist geschehen, war aber unnötig. <span class=\"la\">didn't need to do<\/span> hieße dagegen, dass es nicht nötig war und deshalb auch nicht gemacht wurde.","o":["Du hast gekocht, obwohl es nicht nötig gewesen wäre.","Du hättest kochen sollen, hast es aber nicht getan.","Du darfst nicht kochen.","Du musst nicht kochen."]},{"type":"mc","q":"In welchem Satz passt <span class=\"la\">have to<\/span> besser als <span class=\"la\">must<\/span>?","h":"Woher kommt die Verpflichtung?","s":"Eine Vorschrift, die von außen kommt, drückt man mit <span class=\"la\">have to<\/span> aus. Die anderen drei Sätze beschreiben Vorsätze, die sich die sprechende Person selbst auferlegt, und dafür steht <span class=\"la\">must<\/span>.","o":["<span class=\"la\">Students have to wear a name badge in the lab.<\/span>","<span class=\"la\">I must remember to call my grandmother.<\/span>","<span class=\"la\">I must stop checking my phone so often.<\/span>","<span class=\"la\">We must be more careful with that.<\/span>"]},{"type":"txt","a":["should have told","should've told"],"q":"Setze ein: <span class=\"la\">You <span class=\"gap\">___<\/span> (should tell) me earlier — I could have helped.<\/span>","h":"Etwas, das hätte geschehen sollen, aber nicht geschah.","s":"<span class=\"la\">should have told<\/span>. Modalverb plus <span class=\"la\">have<\/span> plus Past Participle. Diese Form drückt einen Vorwurf oder ein Bedauern über die Vergangenheit aus."},{"type":"self","q":"Schreibe acht Sätze über die Regeln an deiner Schule: zwei mit <span class=\"la\">have to<\/span>, zwei mit <span class=\"la\">mustn't<\/span>, zwei mit <span class=\"la\">don't have to<\/span> und zwei mit <span class=\"la\">should<\/span>. Achte darauf, dass der Unterschied zwischen <span class=\"la\">mustn't<\/span> und <span class=\"la\">don't have to<\/span> im Inhalt wirklich sichtbar wird.","s":"Musterlösung: <span class=\"la\">We have to be in the classroom by eight. We have to bring our own sports kit. You mustn't leave the building during lessons. You mustn't use your phone in class. You don't have to buy the book, the library has copies. You don't have to attend the extra course. You should ask if something is unclear. You should hand in your work on time.<\/span> Prüfe: Steht hinter jedem <span class=\"la\">mustn't<\/span> wirklich etwas Verbotenes und hinter jedem <span class=\"la\">don't have to<\/span> etwas Freiwilliges?"}],"gen":["tense","irr"],"html":"<h3>Was Modalverben besonders macht<\/h3>\n<p>Modalverben haben drei Eigenheiten: Sie bekommen in der dritten Person Singular <b>kein -s<\/b>, sie stehen <b>ohne <span class=\"la\">to<\/span><\/b> vor dem Vollverb, und sie bilden Frage und Verneinung <b>ohne <span class=\"la\">do<\/span><\/b>.<\/p>\n<div class=\"formula\"><span class=\"la\">She <b class=\"e\">can<\/b> swim.<\/span> · <span class=\"la\">She <b class=\"e\">cannot<\/b> swim.<\/span> · <span class=\"la\"><b class=\"e\">Can<\/b> she swim?<\/span><\/div>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Modalverb<\/th><th>Bedeutung<\/th><th>Beispiel<\/th><\/tr><tr><td><span class=\"la\">can<\/span><\/td><td>Fähigkeit, Erlaubnis, Möglichkeit<\/td><td><span class=\"la\">I can speak Italian.<\/span><\/td><\/tr><tr><td><span class=\"la\">could<\/span><\/td><td>Fähigkeit in der Vergangenheit, höfliche Bitte, Möglichkeit<\/td><td><span class=\"la\">Could you help me?<\/span><\/td><\/tr><tr><td><span class=\"la\">may<\/span><\/td><td>Erlaubnis (formell), Möglichkeit<\/td><td><span class=\"la\">You may leave now.<\/span><\/td><\/tr><tr><td><span class=\"la\">might<\/span><\/td><td>geringere Möglichkeit<\/td><td><span class=\"la\">It might rain later.<\/span><\/td><\/tr><tr><td><span class=\"la\">must<\/span><\/td><td>Verpflichtung von innen, starke Vermutung<\/td><td><span class=\"la\">I must finish this today.<\/span><\/td><\/tr><tr><td><span class=\"la\">mustn't<\/span><\/td><td>Verbot<\/td><td><span class=\"la\">You mustn't park here.<\/span><\/td><\/tr><tr><td><span class=\"la\">have to<\/span><\/td><td>Verpflichtung von außen<\/td><td><span class=\"la\">I have to wear a uniform.<\/span><\/td><\/tr><tr><td><span class=\"la\">needn't / don't have to<\/span><\/td><td>nicht nötig<\/td><td><span class=\"la\">You needn't come.<\/span><\/td><\/tr><tr><td><span class=\"la\">should / ought to<\/span><\/td><td>Rat, Erwartung<\/td><td><span class=\"la\">You should see a doctor.<\/span><\/td><\/tr><tr><td><span class=\"la\">will / would<\/span><\/td><td>Bereitschaft, Gewohnheit, Höflichkeit<\/td><td><span class=\"la\">Would you mind waiting?<\/span><\/td><\/tr><\/table><\/div>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b><b><span class=\"la\">mustn't<\/span> und <span class=\"la\">needn't<\/span> sind nicht dasselbe.<\/b> <span class=\"la\">You mustn't tell him<\/span> heißt: Du darfst es ihm auf keinen Fall sagen. <span class=\"la\">You needn't tell him<\/span> heißt: Du musst es ihm nicht sagen, kannst aber. Im Deutschen verführt „du musst nicht“ zur Verwechslung.<\/div>\n<h3>must oder have to?<\/h3>\n<ul><li><b><span class=\"la\">must<\/span><\/b> kommt von der sprechenden Person selbst: <span class=\"la\">I must stop eating so much sugar.<\/span><\/li><li><b><span class=\"la\">have to<\/span><\/b> kommt von außen, von einer Regel oder Umständen: <span class=\"la\">We have to be there at eight.<\/span><\/li><\/ul>\n<p>In der Verneinung trennen sich die beiden endgültig: <span class=\"la\">mustn't<\/span> ist ein Verbot, <span class=\"la\">don't have to<\/span> bedeutet, dass es nicht nötig ist.<\/p>\n<h3>Ersatzformen: wo das Modalverb fehlt<\/h3>\n<p>Modalverben haben keinen Infinitiv und kein Past Participle. Für die übrigen Zeiten brauchst du Ersatzformen:<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Bedeutung<\/th><th>Gegenwart<\/th><th>Vergangenheit<\/th><th>Zukunft<\/th><\/tr><tr><td>Fähigkeit<\/td><td><span class=\"la\">can<\/span><\/td><td><span class=\"la\">could<\/span> / <span class=\"la\">was able to<\/span><\/td><td><span class=\"la\">will be able to<\/span><\/td><\/tr><tr><td>Verpflichtung<\/td><td><span class=\"la\">must<\/span> / <span class=\"la\">have to<\/span><\/td><td><span class=\"la\">had to<\/span><\/td><td><span class=\"la\">will have to<\/span><\/td><\/tr><tr><td>Erlaubnis<\/td><td><span class=\"la\">may<\/span> / <span class=\"la\">can<\/span><\/td><td><span class=\"la\">was allowed to<\/span><\/td><td><span class=\"la\">will be allowed to<\/span><\/td><\/tr><\/table><\/div>\n<div class=\"note t\"><b class=\"lab\">Tipp<\/b><span class=\"la\">could<\/span> und <span class=\"la\">was able to<\/span> unterscheiden sich fein: <span class=\"la\">could<\/span> beschreibt eine allgemeine Fähigkeit (<span class=\"la\">I could swim when I was five<\/span>), <span class=\"la\">was able to<\/span> den einzelnen geglückten Fall (<span class=\"la\">The exit was blocked, but we were able to get out<\/span>).<\/div>\n<h3>Vermutungen über die Vergangenheit<\/h3>\n<p>Mit <b>Modalverb + <span class=\"la\">have<\/span> + Past Participle<\/b> sagst du, wie sicher du dir über etwas Vergangenes bist:<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Form<\/th><th>Grad der Sicherheit<\/th><th>Beispiel<\/th><\/tr><tr><td><span class=\"la\">must have<\/span><\/td><td>fast sicher, dass es so war<\/td><td><span class=\"la\">She must have missed the bus.<\/span><\/td><\/tr><tr><td><span class=\"la\">can't have / couldn't have<\/span><\/td><td>fast sicher, dass es nicht so war<\/td><td><span class=\"la\">He can't have seen us.<\/span><\/td><\/tr><tr><td><span class=\"la\">may / might have<\/span><\/td><td>möglich<\/td><td><span class=\"la\">They might have forgotten.<\/span><\/td><\/tr><tr><td><span class=\"la\">should have<\/span><\/td><td>hätte sein sollen, war aber nicht<\/td><td><span class=\"la\">You should have told me.<\/span><\/td><\/tr><tr><td><span class=\"la\">needn't have<\/span><\/td><td>war nicht nötig, wurde aber getan<\/td><td><span class=\"la\">You needn't have waited.<\/span><\/td><\/tr><\/table><\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Eine Vermutung über die Vergangenheit bilden<\/h4><div class=\"task\">Drücke aus: „Sie hat den Bus bestimmt verpasst, deshalb ist sie zu spät.“<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Zuerst der Grad der Sicherheit: „bestimmt“ heißt, du bist dir fast sicher, dass es so war.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Dafür steht <b><span class=\"la\">must have<\/span><\/b>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Danach folgt immer das <b>Past Participle<\/b>: <span class=\"la\">missed<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div>Ergebnis: <span class=\"la\">She <b class=\"e\">must have missed<\/b> the bus.<\/span><\/div><\/div><div class=\"wstep final\"><div class=\"n\">5<\/div><div>Gegenprobe: Wärest du dir sicher, dass es <b class=\"e\">nicht<\/b> so war, hieße es <span class=\"la\">She <b class=\"e\">can't have<\/b> missed the bus<\/span>. Wäre es bloß möglich, hieße es <span class=\"la\">She <b class=\"e\">might have<\/b> missed the bus<\/span>. Dieselbe Konstruktion, drei Grade der Sicherheit.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"ginf","t":"Gerund und Infinitiv","kl":"2","k":2,"a":"G","tag":"Aufbau","goals":["entscheiden, ob nach einem Verb die _-ing_-Form oder der Infinitiv steht","die Verben kennen, bei denen beides möglich ist und die Bedeutung sich ändert","die _-ing_-Form nach Präpositionen sicher anwenden","Gerundien als Subjekt verwenden"],"ex":[{"type":"txt","a":["watching"],"q":"Setze ein: <span class=\"la\">I don't mind <span class=\"gap\">___<\/span> (watch) the film again.<\/span>","h":"<span class=\"la\">mind<\/span> gehört zur <span class=\"la\">-ing<\/span>-Gruppe.","s":"<span class=\"la\">watching<\/span>. Nach <span class=\"la\">mind, enjoy, avoid, finish, keep, suggest<\/span> steht immer die <span class=\"la\">-ing<\/span>-Form."},{"type":"txt","a":["to help"],"q":"Setze ein: <span class=\"la\">She offered <span class=\"gap\">___<\/span> (help) me with the project.<\/span>","h":"<span class=\"la\">offer<\/span> gehört zur Infinitivgruppe.","s":"<span class=\"la\">to help<\/span>. Verben der Absicht und des Entschlusses nehmen den Infinitiv mit <span class=\"la\">to<\/span>: <span class=\"la\">offer, decide, promise, refuse, agree<\/span>."},{"type":"txt","a":["seeing"],"q":"Setze ein: <span class=\"la\">I am looking forward to <span class=\"gap\">___<\/span> (see) you next week.<\/span>","h":"Was für ein <span class=\"la\">to<\/span> ist das hier?","s":"<span class=\"la\">seeing<\/span>. Das <span class=\"la\">to<\/span> in <span class=\"la\">look forward to<\/span> ist eine Präposition, kein Infinitivzeichen. Nach Präpositionen steht immer die <span class=\"la\">-ing<\/span>-Form."},{"type":"txt","a":["locking"],"q":"Setze ein: <span class=\"la\">I clearly remember <span class=\"gap\">___<\/span> (lock) the door before we left.<\/span>","h":"Erinnerung an etwas Getanes oder Vorsatz?","s":"<span class=\"la\">locking<\/span>. <span class=\"la\">remember doing<\/span> heißt, dass man sich an eine ausgeführte Handlung erinnert. <span class=\"la\">remember to lock<\/span> hieße dagegen: Denk daran, es zu tun."},{"type":"mc","q":"Was bedeutet <span class=\"la\">He stopped to talk to his neighbour<\/span>?","h":"Der Infinitiv gibt hier den Zweck an.","s":"<span class=\"la\">stop to do<\/span> heißt: anhalten, um etwas zu tun. <span class=\"la\">stop doing<\/span> heißt: etwas aufgeben. Dieses Paar ist in Prüfungen besonders beliebt, weil der Unterschied im Deutschen völlig verschieden klingt.","o":["Er blieb stehen, um mit seinem Nachbarn zu reden.","Er hörte auf, mit seinem Nachbarn zu reden.","Er sprach weiter mit seinem Nachbarn.","Er vermied es, mit seinem Nachbarn zu reden."]},{"type":"mc","q":"Welcher Satz ist richtig?","h":"<span class=\"la\">suggest<\/span> nimmt nie Objekt plus Infinitiv.","s":"Nach <span class=\"la\">suggest<\/span> steht die <span class=\"la\">-ing<\/span>-Form oder ein <span class=\"la\">that<\/span>-Satz: <span class=\"la\">She suggested that we go by train.<\/span> Die Konstruktion mit Objekt und Infinitiv gibt es bei diesem Verb nicht.","o":["<span class=\"la\">She suggested going by train.<\/span>","<span class=\"la\">She suggested me to go by train.<\/span>","<span class=\"la\">She suggested to go by train.<\/span>","<span class=\"la\">She suggested me going by train.<\/span>"]},{"type":"mc","q":"<span class=\"la\">My parents made me <span class=\"gap\">___<\/span> my room before I went out.<\/span>","h":"<span class=\"la\">make<\/span> und <span class=\"la\">let<\/span> gehören zu einer eigenen Gruppe.","s":"Nach <span class=\"la\">make<\/span> und <span class=\"la\">let<\/span> steht der Infinitiv ohne <span class=\"la\">to<\/span>. Im Passiv kehrt das <span class=\"la\">to<\/span> allerdings zurück: <span class=\"la\">I was made to tidy my room.<\/span>","o":["<span class=\"la\">tidy<\/span>","<span class=\"la\">to tidy<\/span>","<span class=\"la\">tidying<\/span>","<span class=\"la\">tidied<\/span>"]},{"type":"txt","a":["Learning"],"q":"Setze ein: <span class=\"gap\">___<\/span> (learn) a language takes time and patience.","h":"Am Satzanfang steht das Gerund.","s":"<span class=\"la\">Learning<\/span>. Als Subjekt steht die <span class=\"la\">-ing<\/span>-Form. Alternativ ginge <span class=\"la\">It takes time and patience to learn a language.<\/span>"},{"type":"self","q":"Schreibe zehn Sätze über dich, in denen jeweils zwei Verben aufeinandertreffen: fünf mit der <span class=\"la\">-ing<\/span>-Form und fünf mit dem Infinitiv. Verwende dabei mindestens ein Paar aus Gruppe 5 in beiden Bedeutungen.","s":"Musterlösung unter anderem: <span class=\"la\">I enjoy listening to podcasts on my way to school. I have decided to take Spanish next year. I keep forgetting to charge my headphones. I will never forget visiting Rome for the first time.<\/span> Die letzten beiden Sätze zeigen das Paar <span class=\"la\">forget<\/span> in beiden Bedeutungen: einmal etwas Versäumtes, einmal eine unvergessliche Erfahrung."}],"gen":["ginf","prep"],"html":"<h3>Zwei Formen, ein Platz im Satz<\/h3>\n<p>Wenn in einem Satz zwei Verben aufeinandertreffen, steht das zweite entweder als <b>Gerund<\/b> (<span class=\"la\">-ing<\/span>) oder als <b>Infinitiv<\/b> (<span class=\"la\">to do<\/span>). Welches von beiden, hängt vom ersten Verb ab, und dafür gibt es keine durchgehende Regel — aber verlässliche Gruppen.<\/p>\n<h3>Gruppe 1: immer -ing<\/h3>\n<p><span class=\"la\">enjoy, avoid, finish, mind, practise, risk, suggest, admit, deny, imagine, keep, consider, miss, can't help, can't stand, give up, look forward to, be used to<\/span><\/p>\n<div class=\"formula\"><span class=\"la\">She <b class=\"e\">enjoys cooking<\/b>.<\/span> · <span class=\"la\">We <b class=\"e\">finished painting<\/b> the room.<\/span><\/div>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b><span class=\"la\">suggest<\/span> steht niemals mit Objekt und Infinitiv. <span class=\"la\">He suggested me to come<\/span> ist falsch. Richtig: <span class=\"la\">He suggested <b class=\"e\">coming<\/b><\/span> oder <span class=\"la\">He suggested <b class=\"e\">that I come<\/b>.<\/span><\/div>\n<h3>Gruppe 2: immer Infinitiv mit to<\/h3>\n<p><span class=\"la\">decide, hope, promise, refuse, manage, afford, offer, agree, learn, expect, seem, want, plan, pretend, fail, tend<\/span><\/p>\n<div class=\"formula\"><span class=\"la\">They <b class=\"e\">decided to leave<\/b> early.<\/span> · <span class=\"la\">I can't <b class=\"e\">afford to buy<\/b> a new one.<\/span><\/div>\n<h3>Gruppe 3: Infinitiv ohne to<\/h3>\n<p>Nach den Modalverben und nach <span class=\"la\">let<\/span> und <span class=\"la\">make<\/span>:<\/p>\n<div class=\"formula\"><span class=\"la\">She <b class=\"e\">let me go<\/b>.<\/span> · <span class=\"la\">They <b class=\"e\">made him wait<\/b>.<\/span> · <span class=\"la\">You <b class=\"e\">must leave<\/b>.<\/span><\/div>\n<div class=\"note t\"><b class=\"lab\">Tipp<\/b>Im Passiv kehrt das <span class=\"la\">to<\/span> bei <span class=\"la\">make<\/span> zurück: <span class=\"la\">He <b class=\"e\">was made to wait<\/b>.<\/span><\/div>\n<h3>Gruppe 4: beides möglich, Bedeutung gleich<\/h3>\n<p><span class=\"la\">begin, start, continue, like, love, hate, prefer<\/span> — hier ist der Unterschied so klein, dass man ihn vernachlässigen kann:<\/p>\n<div class=\"formula\"><span class=\"la\">It started <b class=\"e\">raining<\/b>.<\/span> = <span class=\"la\">It started <b class=\"e\">to rain<\/b>.<\/span><\/div>\n<h3>Gruppe 5: beides möglich, Bedeutung verschieden<\/h3>\n<p>Diese Gruppe ist prüfungsrelevant, weil sich der Sinn vollständig ändert:<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Verb<\/th><th>mit <span class=\"la\">-ing<\/span><\/th><th>mit <span class=\"la\">to<\/span><\/th><\/tr><tr><td><span class=\"la\">remember<\/span><\/td><td><span class=\"la\">I remember <b class=\"e\">locking<\/b> the door.<\/span> ~ich erinnere mich, dass ich es tat~<\/td><td><span class=\"la\">Remember <b class=\"e\">to lock<\/b> the door.<\/span> ~denk daran, es zu tun~<\/td><\/tr><tr><td><span class=\"la\">forget<\/span><\/td><td><span class=\"la\">I'll never forget <b class=\"e\">seeing<\/b> the sea.<\/span> ~Erlebnis~<\/td><td><span class=\"la\">I forgot <b class=\"e\">to buy<\/b> milk.<\/span> ~versäumt~<\/td><\/tr><tr><td><span class=\"la\">stop<\/span><\/td><td><span class=\"la\">He stopped <b class=\"e\">smoking<\/b>.<\/span> ~gab es auf~<\/td><td><span class=\"la\">He stopped <b class=\"e\">to smoke<\/b>.<\/span> ~hielt an, um zu rauchen~<\/td><\/tr><tr><td><span class=\"la\">try<\/span><\/td><td><span class=\"la\">Try <b class=\"e\">adding<\/b> more salt.<\/span> ~probier es einmal so~<\/td><td><span class=\"la\">She tried <b class=\"e\">to open<\/b> the window.<\/span> ~bemühte sich~<\/td><\/tr><tr><td><span class=\"la\">regret<\/span><\/td><td><span class=\"la\">I regret <b class=\"e\">telling<\/b> her.<\/span> ~bereue es~<\/td><td><span class=\"la\">We regret <b class=\"e\">to inform<\/b> you …<\/span> ~bedauern, mitteilen zu müssen~<\/td><\/tr><tr><td><span class=\"la\">go on<\/span><\/td><td><span class=\"la\">She went on <b class=\"e\">talking<\/b>.<\/span> ~redete weiter~<\/td><td><span class=\"la\">She went on <b class=\"e\">to talk<\/b> about …<\/span> ~kam dann zu~<\/td><\/tr><\/table><\/div>\n<h3>Nach Präpositionen steht immer -ing<\/h3>\n<p>Das ist eine Regel ohne Ausnahme:<\/p>\n<div class=\"formula\"><span class=\"la\">She is good <b class=\"e\">at drawing<\/b>.<\/span> · <span class=\"la\">Thank you <b class=\"e\">for helping<\/b>.<\/span> · <span class=\"la\">Instead <b class=\"e\">of waiting<\/b>, we walked.<\/span><\/div>\n<p>Die Tücke liegt bei den Wendungen, die auf <span class=\"la\">to<\/span> enden. Dieses <span class=\"la\">to<\/span> ist eine Präposition, kein Infinitivzeichen:<\/p>\n<div class=\"formula\"><span class=\"la\">I am looking forward <b class=\"e\">to seeing<\/b> you.<\/span> · <span class=\"la\">I am used <b class=\"e\">to getting<\/b> up early.<\/span> · <span class=\"la\">She objects <b class=\"e\">to being<\/b> filmed.<\/span><\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Die richtige Form finden<\/h4><div class=\"task\">Setze ein: <span class=\"la\">I don't mind (wait), but I refuse (stand) in the rain for an hour.<\/span><\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Erstes Verb: <span class=\"la\">mind<\/span>. Es gehört zur Gruppe, nach der immer die <b><span class=\"la\">-ing<\/span>-Form<\/b> steht: <span class=\"la\">waiting<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Zweites Verb: <span class=\"la\">refuse<\/span>. Es gehört zur Gruppe mit dem <b>Infinitiv mit <span class=\"la\">to<\/span><\/b>: <span class=\"la\">to stand<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Ergebnis: <span class=\"la\">I don't mind <b class=\"e\">waiting<\/b>, but I refuse <b class=\"e\">to stand<\/b> in the rain for an hour.<\/span><\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Merkhilfe: Verben des Gefühls gegenüber einer Tätigkeit (<span class=\"la\">enjoy, mind, avoid, can't stand<\/span>) nehmen <span class=\"la\">-ing<\/span>; Verben der Absicht und Entscheidung (<span class=\"la\">decide, refuse, promise, plan<\/span>) nehmen den Infinitiv. Das erklärt etwa drei Viertel der Fälle.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>\n<h3>Das Gerund als Subjekt<\/h3>\n<p>Am Satzanfang steht die <span class=\"la\">-ing<\/span>-Form, nicht der Infinitiv:<\/p>\n<div class=\"formula\"><span class=\"la\"><b class=\"e\">Reading<\/b> in a foreign language takes practice.<\/span><\/div>\n<p>Der Infinitiv ist dort zwar möglich, klingt aber gehoben und wird meist mit <span class=\"la\">it<\/span> umgangen: <span class=\"la\"><b class=\"e\">It<\/b> takes practice <b class=\"e\">to read<\/b> in a foreign language.<\/span><\/p>"},{"id":"relative","t":"Relativsätze","kl":"2","k":2,"a":"G","tag":"Aufbau","goals":["notwendige und nicht notwendige Relativsätze unterscheiden und richtig zeichensetzen","das passende Relativpronomen wählen","den Relativsatz verkürzen","den contact clause erkennen und selbst verwenden"],"ex":[{"type":"txt","a":["who","that"],"q":"Setze das Relativpronomen ein: <span class=\"la\">The man <span class=\"gap\">___<\/span> lives next door is a vet.<\/span>","h":"Person, notwendiger Relativsatz.","s":"<span class=\"la\">who<\/span> oder <span class=\"la\">that<\/span>. Beide sind im notwendigen Relativsatz bei Personen möglich; <span class=\"la\">who<\/span> ist etwas gehobener."},{"type":"txt","a":["whose"],"q":"Setze ein: <span class=\"la\">That's the family <span class=\"gap\">___<\/span> house burnt down last year.<\/span>","h":"Es geht um Besitz.","s":"<span class=\"la\">whose<\/span>. Es steht für Personen und Dinge gleichermaßen und immer direkt vor dem Substantiv, das besessen wird."},{"type":"txt","a":["where"],"q":"Setze ein: <span class=\"la\">This is the café <span class=\"gap\">___<\/span> we first met.<\/span>","h":"Es geht um einen Ort.","s":"<span class=\"la\">where<\/span>. Möglich wäre auch <span class=\"la\">in which<\/span>, das aber deutlich formeller klingt. <span class=\"la\">which<\/span> allein wäre falsch, weil es dann ein Objekt sein müsste."},{"type":"txt","a":["who","which","that","–"],"q":"In welchem Satz kann das Pronomen entfallen? <span class=\"la\">The book <span class=\"gap\">___<\/span> I borrowed was fascinating.<\/span> Schreibe das Pronomen hin, das du streichen könntest.","h":"Folgt nach der Lücke ein neues Subjekt?","s":"Hier steht <span class=\"la\">which<\/span> oder <span class=\"la\">that<\/span>, und genau deshalb kann es auch wegfallen: Nach der Lücke folgt mit <span class=\"la\">I<\/span> ein neues Subjekt, das Pronomen ist also Objekt. <span class=\"la\">The book I borrowed was fascinating<\/span> ist die natürlichere Fassung."},{"type":"mc","q":"Welcher Satz ist richtig interpunktiert?","h":"Wie viele Cousins hat die sprechende Person vermutlich?","s":"Bei einer bestimmten, bereits bekannten Person liefert der Relativsatz nur eine Zusatzinformation und steht zwischen zwei Beistrichen. <span class=\"la\">that<\/span> ist im nicht notwendigen Relativsatz nicht erlaubt, und ein einzelner Beistrich ist immer falsch.","o":["<span class=\"la\">My cousin, who studies in Graz, is visiting us.<\/span>","<span class=\"la\">My cousin who studies in Graz is visiting us.<\/span>","<span class=\"la\">My cousin, that studies in Graz, is visiting us.<\/span>","<span class=\"la\">My cousin who studies in Graz, is visiting us.<\/span>"]},{"type":"mc","q":"Welche Verkürzung ist richtig? <span class=\"la\">The students who were chosen for the exchange met yesterday.<\/span>","h":"Der Relativsatz steht im Passiv.","s":"Ein Relativsatz im Passiv wird mit dem Past Participle verkürzt. Das Partizip Präsens stünde nur für einen Aktivsatz: <span class=\"la\">the students <b class=\"e\">choosing<\/b> a partner school<\/span>.","o":["<span class=\"la\">The students chosen for the exchange met yesterday.<\/span>","<span class=\"la\">The students choosing for the exchange met yesterday.<\/span>","<span class=\"la\">The students to choose for the exchange met yesterday.<\/span>","<span class=\"la\">The students having chosen for the exchange met yesterday.<\/span>"]},{"type":"mc","q":"<span class=\"la\">The school <span class=\"gap\">___<\/span> he went to has closed down.<\/span>","h":"Achte auf das <span class=\"la\">to<\/span> am Ende.","s":"Weil die Präposition <span class=\"la\">to<\/span> am Satzende steht, braucht es ein Pronomen für die Sache, also <span class=\"la\">which<\/span> oder <span class=\"la\">that<\/span>. Mit <span class=\"la\">where<\/span> müsste das <span class=\"la\">to<\/span> entfallen: <span class=\"la\">the school where he went<\/span>.","o":["<span class=\"la\">which<\/span>","<span class=\"la\">where<\/span>","<span class=\"la\">whose<\/span>","<span class=\"la\">when<\/span>"]},{"type":"txt","a":["The woman sitting next to me","the woman sitting next to me"],"q":"Verkürze den Relativsatz: <span class=\"la\">The woman who was sitting next to me<\/span> …","h":"Aktivsatz, also Partizip Präsens.","s":"<span class=\"la\">The woman sitting next to me<\/span>. Aus einem Relativsatz im Aktiv wird die <span class=\"la\">-ing<\/span>-Form. Diese Verkürzung macht Texte deutlich dichter und wirkt in der Matura sehr positiv."},{"type":"self","q":"Beschreibe vier Menschen aus deinem Umfeld in je einem Satz mit Relativsatz: zweimal notwendig, zweimal nicht notwendig. Setze die Beistriche bewusst und erkläre dir bei jedem Satz, warum sie dort stehen oder fehlen.","s":"Musterlösung: <span class=\"la\">My grandmother, who turned eighty last year, still goes swimming every week.<\/span> ~nicht notwendig, es gibt nur diese eine~ <span class=\"la\">The teacher who taught us in the first year has moved to another school.<\/span> ~notwendig, sie unterscheidet diese Lehrkraft von anderen~ <span class=\"la\">My neighbour, whose dog barks all night, works night shifts.<\/span> ~Einschub~ <span class=\"la\">The friend I share a desk with is learning Japanese.<\/span> ~contact clause, Pronomen weggelassen~"}],"gen":["tense","prep"],"html":"<h3>Zwei Arten von Relativsätzen<\/h3>\n<p>Der Unterschied ist nicht bloß eine Beistrichfrage, sondern verändert die Aussage.<\/p>\n<p><b>Notwendige Relativsätze<\/b> (<span class=\"la\">defining<\/span>) sagen, <b class=\"e\">welche<\/b> Person oder Sache gemeint ist. Ohne sie bliebe der Satz unklar. Sie stehen <b>ohne Beistrich<\/b>.<\/p>\n<div class=\"formula\"><span class=\"la\">The students <b class=\"e\">who missed the test<\/b> have to write it next week.<\/span><\/div>\n<p>~nur diese bestimmten Schülerinnen und Schüler~<\/p>\n<p><b>Nicht notwendige Relativsätze<\/b> (<span class=\"la\">non-defining<\/span>) liefern eine Zusatzinformation, die man auch weglassen könnte. Sie stehen <b>zwischen Beistrichen<\/b>.<\/p>\n<div class=\"formula\"><span class=\"la\">My brother, <b class=\"e\">who lives in Berlin<\/b>, is coming for Christmas.<\/span><\/div>\n<p>~ich habe nur einen Bruder; die Information ist ein Einschub~<\/p>\n<div class=\"note\"><b class=\"lab\">Merke<\/b>Der Unterschied kann den Sinn umdrehen: <span class=\"la\">The passengers who were sitting at the back were not injured<\/span> heißt, dass nur dieser Teil unverletzt blieb. <span class=\"la\">The passengers, who were sitting at the back, were not injured<\/span> heißt, dass alle hinten saßen und alle unverletzt blieben.<\/div>\n<h3>Die Relativpronomen<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Pronomen<\/th><th>für<\/th><th>Beispiel<\/th><\/tr><tr><td><span class=\"la\">who<\/span><\/td><td>Personen<\/td><td><span class=\"la\">the woman who called<\/span><\/td><\/tr><tr><td><span class=\"la\">which<\/span><\/td><td>Dinge und Tiere<\/td><td><span class=\"la\">the book which won the prize<\/span><\/td><\/tr><tr><td><span class=\"la\">that<\/span><\/td><td>Personen und Dinge, nur im notwendigen Satz<\/td><td><span class=\"la\">the book that won the prize<\/span><\/td><\/tr><tr><td><span class=\"la\">whose<\/span><\/td><td>Besitz, Personen wie Dinge<\/td><td><span class=\"la\">the man whose car was stolen<\/span><\/td><\/tr><tr><td><span class=\"la\">where<\/span><\/td><td>Ort<\/td><td><span class=\"la\">the town where I was born<\/span><\/td><\/tr><tr><td><span class=\"la\">when<\/span><\/td><td>Zeit<\/td><td><span class=\"la\">the day when we met<\/span><\/td><\/tr><tr><td><span class=\"la\">why<\/span><\/td><td>Grund<\/td><td><span class=\"la\">the reason why he left<\/span><\/td><\/tr><\/table><\/div>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b><span class=\"la\">that<\/span> darf im <b>nicht notwendigen<\/b> Relativsatz nicht stehen. <span class=\"la\">My brother, that lives in Berlin<\/span> ist falsch; dort muss <span class=\"la\">who<\/span> stehen. Umgekehrt ist <span class=\"la\">that<\/span> im notwendigen Satz oft die natürlichere Wahl.<\/div>\n<h3>Der contact clause: wenn das Pronomen wegfällt<\/h3>\n<p>Ist das Relativpronomen das <b>Objekt<\/b> des Relativsatzes, kann es einfach entfallen. Das kommt im Englischen sehr häufig vor und ist ein Kennzeichen flüssigen Stils.<\/p>\n<div class=\"formula\"><span class=\"la\">The film <b class=\"e\">(which) we saw<\/b> yesterday was brilliant.<\/span><\/div>\n<div class=\"formula\"><span class=\"la\">The woman <b class=\"e\">(whom) I met<\/b> at the station works at my school.<\/span><\/div>\n<p>Die Probe ist einfach: Folgt direkt nach dem Pronomen ein <b>neues Subjekt<\/b>, kann das Pronomen weg. Folgt ein Verb, muss es bleiben.<\/p>\n<ul><li><span class=\"la\">The book <b class=\"e\">that is<\/b> on the table …<\/span> → bleibt, denn es folgt ein Verb.<\/li><li><span class=\"la\">The book <b class=\"e\">that I bought<\/b> …<\/span> → kann weg, denn es folgt ein neues Subjekt.<\/li><\/ul>\n<h3>Präpositionen im Relativsatz<\/h3>\n<p>Umgangssprachlich wandert die Präposition ans Ende, formell steht sie vor dem Pronomen:<\/p>\n<div class=\"formula\"><span class=\"la\">the colleague <b class=\"e\">who<\/b> I work <b class=\"e\">with<\/b><\/span> ~normal~<\/div>\n<div class=\"formula\"><span class=\"la\">the colleague <b class=\"e\">with whom<\/b> I work<\/span> ~formell, in Reports und Essays~<\/div>\n<div class=\"note t\"><b class=\"lab\">Tipp<\/b>In der Matura-Textsorte Report oder Essay wirkt die formelle Variante angemessen, in einem Blog Comment oder einer informellen E-Mail gestelzt. Das Register entscheidet.<\/div>\n<h3>Relativsätze verkürzen<\/h3>\n<p>Zwei Möglichkeiten, die Texte deutlich dichter machen:<\/p>\n<ul><li><b>Partizip Präsens<\/b> statt Aktivsatz: <span class=\"la\">the man <b class=\"e\">who is waiting<\/b> outside<\/span> → <span class=\"la\">the man <b class=\"e\">waiting<\/b> outside<\/span><\/li><li><b>Partizip Perfekt<\/b> statt Passivsatz: <span class=\"la\">the books <b class=\"e\">which were written<\/b> in the 1920s<\/span> → <span class=\"la\">the books <b class=\"e\">written<\/b> in the 1920s<\/span><\/li><\/ul>\n<div class=\"walk\"><h4>Schritt für Schritt: Zwei Sätze zu einem verbinden<\/h4><div class=\"task\">Verbinde: <span class=\"la\">I spoke to a girl. Her brother is in my class.<\/span><\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Was ist das verbindende Element? Der Bruder gehört dem Mädchen. Es geht also um <b>Besitz<\/b>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Für Besitz steht das Relativpronomen <b><span class=\"la\">whose<\/span><\/b>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div><span class=\"la\">whose<\/span> ersetzt <span class=\"la\">her<\/span> und steht direkt vor dem Substantiv, zu dem es gehört: <span class=\"la\">whose brother<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div>Der Relativsatz rückt direkt hinter das Wort, auf das er sich bezieht: hinter <span class=\"la\">a girl<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">5<\/div><div>Ergebnis: <span class=\"la\">I spoke to a girl <b class=\"e\">whose brother is in my class<\/b>.<\/span><\/div><\/div><div class=\"wstep final\"><div class=\"n\">6<\/div><div>Beistrich oder nicht? <span class=\"la\">a girl<\/span> ist unbestimmt, der Satz sagt erst, welche gemeint ist. Also notwendig und ohne Beistrich.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"artikel","t":"Artikel, Mengenwörter und Plural","kl":"2","k":2,"a":"G","tag":"Aufbau","goals":["den bestimmten und unbestimmten Artikel richtig setzen und weglassen","zählbare und unzählbare Substantive unterscheiden","_some, any, much, many, few, little_ sicher verwenden","unregelmäßige Pluralformen kennen"],"ex":[{"type":"mc","q":"Welcher Satz ist richtig?","h":"Es geht um Hunde im Allgemeinen.","s":"Allgemeine Aussagen stehen im Englischen im Plural ohne Artikel. <span class=\"la\">The dogs<\/span> würde sich auf bestimmte Hunde beziehen, die vorher erwähnt wurden.","o":["<span class=\"la\">Dogs are usually friendly animals.<\/span>","<span class=\"la\">The dogs are usually friendly animals.<\/span>","<span class=\"la\">A dogs are usually friendly animals.<\/span>","<span class=\"la\">Dog is usually friendly animals.<\/span>"]},{"type":"txt","a":["much"],"q":"Setze ein: <span class=\"la\">We do not have <span class=\"gap\">___<\/span> time left.<\/span>","s":"<span class=\"la\">time<\/span> ist unzählbar, deshalb steht <span class=\"la\">much<\/span>. <span class=\"la\">Many<\/span> gehört zu zählbaren Substantiven."},{"type":"mc","q":"Was bedeutet <span class=\"la\">She has few friends in this town<\/span>?","h":"Achte darauf, dass kein <span class=\"la\">a<\/span> davorsteht.","s":"<span class=\"la\">few<\/span> ohne Artikel betont den Mangel. Mit <span class=\"la\">a few<\/span> wäre die Aussage neutral: ein paar Freunde.","o":["Sie hat kaum Freunde dort.","Sie hat einige Freunde dort.","Sie hat viele Freunde dort.","Sie hat genau zwei Freunde dort."]},{"type":"txt","a":["a piece of advice","some advice"],"q":"Ergänze so, dass der Satz richtig wird: <span class=\"la\">Can I give you <span class=\"gap\">___<\/span>?<\/span> Gemeint ist ein einzelner Ratschlag.","h":"<span class=\"la\">advice<\/span> ist unzählbar.","s":"Richtig ist <span class=\"la\">a piece of advice<\/span> oder allgemeiner <span class=\"la\">some advice<\/span>. <span class=\"la\">An advice<\/span> gibt es im Englischen nicht."},{"type":"mc","q":"In welchem Satz ist der Artikel <b class=\"e\">falsch<\/b>?","h":"Geht es um den Zweck oder um das Gebäude?","s":"Wer als Patient dort liegt, ist im britischen Englisch <span class=\"la\">in hospital<\/span> ohne Artikel. <span class=\"la\">In the hospital<\/span> wäre nur als Ortsangabe richtig, etwa für Besucher. Im amerikanischen Englisch steht allerdings auch beim Patienten <span class=\"la\">in the hospital<\/span>.","o":["<span class=\"la\">My brother is in the hospital with a broken leg.<\/span>","<span class=\"la\">My brother is in hospital with a broken leg.<\/span>","<span class=\"la\">I went to the hospital to visit him.<\/span>","<span class=\"la\">She works at a hospital in Vienna.<\/span>"]},{"type":"txt","a":["any"],"q":"Setze ein: <span class=\"la\">Is there <span class=\"gap\">___<\/span> milk in the fridge?<\/span>","s":"In echten Fragen und in der Verneinung steht <span class=\"la\">any<\/span>. <span class=\"la\">Some<\/span> stünde in einem Angebot: <span class=\"la\">Would you like some milk?<\/span>"},{"type":"mc","q":"Welcher Satz ist richtig?","h":"Die Endung täuscht.","s":"<span class=\"la\">news<\/span> ist trotz des s unzählbar und steht mit einem Verb im Singular. Dasselbe gilt für <span class=\"la\">mathematics<\/span> und <span class=\"la\">politics<\/span>.","o":["<span class=\"la\">The news is better than we expected.<\/span>","<span class=\"la\">The news are better than we expected.<\/span>","<span class=\"la\">The newses are better than we expected.<\/span>","<span class=\"la\">A news is better than we expected.<\/span>"]},{"type":"txt","a":["women","children"],"q":"Nenne eine unregelmäßige Pluralform: Der Plural von <span class=\"la\">woman<\/span> lautet <span class=\"gap\">___<\/span>.","s":"<span class=\"la\">woman – women<\/span>. Beachte, dass sich die Aussprache stärker ändert als die Schreibung. Weitere unregelmäßige Formen sind <span class=\"la\">child – children<\/span> und <span class=\"la\">person – people<\/span>."},{"type":"self","q":"Schreibe vier Sätze über deine Stadt: zwei allgemeine Aussagen ohne Artikel und zwei mit bestimmtem Artikel, und erkläre jeweils in einem Halbsatz, warum.","s":"Ein mögliches Muster: <span class=\"la\">Tourists come here all year round<\/span> (allgemein, Plural, kein Artikel). <span class=\"la\">Life is quieter in winter<\/span> (unzählbar, allgemein). <span class=\"la\">The old town is closed to traffic<\/span> (ein bestimmter Stadtteil). <span class=\"la\">The best view is from the castle<\/span> (Superlativ). Entscheidend ist, dass du in jedem Fall begründen kannst, welche der beiden Regeln greift."}],"gen":["prep","wf"],"html":"<h3>Wann steht kein Artikel?<\/h3>\n<p>Das Englische lässt den Artikel viel häufiger weg als das Deutsche. Ohne Artikel stehen:<\/p>\n<ul><li>Allgemeine Aussagen im Plural: <span class=\"la\">Dogs are loyal animals.<\/span> („Die Hunde sind …“ wäre falsch.)<\/li><li>Unzählbare Substantive allgemein: <span class=\"la\">Information is power. Music helps me concentrate.<\/span><\/li><li>Mahlzeiten, Fächer, Sprachen, Sportarten: <span class=\"la\">after breakfast, I study history, she speaks Russian, we play tennis.<\/span><\/li><li>Viele feste Wendungen mit Institutionen, wenn ihr Zweck gemeint ist: <span class=\"la\">go to school, be in hospital, go to bed, at university.<\/span><\/li><\/ul>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>Der Unterschied zwischen <span class=\"la\">go to school<\/span> und <span class=\"la\">go to the school<\/span>: Das erste heißt, zur Schule gehen, also Schüler sein; das zweite heißt, zum Schulgebäude gehen, etwa als Besucherin. Dasselbe Muster gilt für <span class=\"la\">hospital, prison, church<\/span> und <span class=\"la\">bed<\/span>.<\/div>\n<h3>Wann steht der bestimmte Artikel?<\/h3>\n<ul><li>Wenn klar ist, welches Exemplar gemeint ist: <span class=\"la\">Close the door, please.<\/span><\/li><li>Bei Superlativen und Ordnungszahlen: <span class=\"la\">the best film, the first time.<\/span><\/li><li>Bei Flüssen, Meeren, Gebirgen und Ländernamen im Plural: <span class=\"la\">the Danube, the Alps, the Netherlands, the USA.<\/span><\/li><li>Bei Nationalitätenadjektiven als Gruppe: <span class=\"la\">the French, the British.<\/span><\/li><\/ul>\n<div class=\"note t\"><b class=\"lab\">Tipp<\/b>Einzelne Berge, Seen und die meisten Länder stehen ohne Artikel: <span class=\"la\">Mount Everest, Lake Constance, Austria.<\/span> Merke dir die Gruppen, nicht die Einzelfälle.<\/div>\n<h3>Zählbar und unzählbar<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>unzählbar<\/th><th>zählbar als Einzelstück<\/th><\/tr><tr><td><span class=\"la\">information<\/span><\/td><td><span class=\"la\">a piece of information<\/span><\/td><\/tr><tr><td><span class=\"la\">advice<\/span><\/td><td><span class=\"la\">a piece of advice<\/span><\/td><\/tr><tr><td><span class=\"la\">furniture<\/span><\/td><td><span class=\"la\">a piece of furniture<\/span><\/td><\/tr><tr><td><span class=\"la\">news<\/span><\/td><td><span class=\"la\">an item of news<\/span><\/td><\/tr><tr><td><span class=\"la\">bread<\/span><\/td><td><span class=\"la\">a loaf of bread<\/span><\/td><\/tr><tr><td><span class=\"la\">luggage<\/span><\/td><td><span class=\"la\">a suitcase<\/span><\/td><\/tr><tr><td><span class=\"la\">work<\/span><\/td><td><span class=\"la\">a job<\/span><\/td><\/tr><\/table><\/div>\n<div class=\"note\"><b class=\"lab\">Merke<\/b><span class=\"la\">news<\/span> sieht aus wie ein Plural, ist aber Singular: <span class=\"la\">The news is good.<\/span> Ebenso <span class=\"la\">mathematics, physics, politics<\/span>.<\/div>\n<h3>Mengenwörter<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th><\/th><th>zählbar<\/th><th>unzählbar<\/th><\/tr><tr><td>viel(e)<\/td><td><span class=\"la\">many books<\/span><\/td><td><span class=\"la\">much time<\/span><\/td><\/tr><tr><td>wenig(e)<\/td><td><span class=\"la\">few friends<\/span><\/td><td><span class=\"la\">little money<\/span><\/td><\/tr><tr><td>ein paar / etwas<\/td><td><span class=\"la\">a few friends<\/span><\/td><td><span class=\"la\">a little money<\/span><\/td><\/tr><tr><td>in beiden Fällen<\/td><td><span class=\"la\">a lot of, lots of, plenty of, some, any<\/span><\/td><td><\/td><\/tr><\/table><\/div>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b><span class=\"la\">few<\/span> und <span class=\"la\">a few<\/span> sind nicht dasselbe. <span class=\"la\">I have few friends<\/span> klingt traurig und heißt „kaum Freunde“. <span class=\"la\">I have a few friends<\/span> heißt „ein paar Freunde“ und ist neutral bis positiv. Dasselbe gilt für <span class=\"la\">little<\/span> und <span class=\"la\">a little<\/span>.<\/div>\n<h3>some und any<\/h3>\n<ul><li><span class=\"la\">some<\/span> in Aussagesätzen und in Angeboten oder Bitten: <span class=\"la\">Would you like some tea?<\/span><\/li><li><span class=\"la\">any<\/span> in Verneinung und in echten Fragen: <span class=\"la\">Is there any milk left? We do not have any sugar.<\/span><\/li><li><span class=\"la\">any<\/span> in Aussagesätzen heißt „jeder beliebige“: <span class=\"la\">Any student can apply.<\/span><\/li><\/ul>\n<h3>Unregelmäßiger Plural<\/h3>\n<div class=\"formula\"><span class=\"la\">man – men · woman – women · child – children · person – people · foot – feet · tooth – teeth · mouse – mice · life – lives · leaf – leaves · knife – knives · analysis – analyses · phenomenon – phenomena<\/span><\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Artikel entscheiden<\/h4><div class=\"task\">Setze ein, wo nötig: <span class=\"la\">I love <span class=\"gap\">___<\/span> music, but <span class=\"gap\">___<\/span> music in that film was terrible.<\/span><\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Erste Lücke: Gemeint ist Musik allgemein. Allgemeine Aussagen mit unzählbaren Substantiven stehen ohne Artikel.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Also: <span class=\"la\">I love music.<\/span><\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Zweite Lücke: Gemeint ist genau die Musik aus diesem einen Film. Ein bestimmtes Exemplar verlangt den bestimmten Artikel.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Also: <span class=\"la\">the music in that film<\/span>. Die Faustregel lautet: allgemein ohne Artikel, bestimmt mit <span class=\"la\">the<\/span>.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"adjadv","t":"Adjektiv, Adverb und Steigerung","kl":"2","k":2,"a":"G","tag":"Aufbau","goals":["Adjektiv und Adverb sicher unterscheiden und bilden","die Steigerung regelmäßig und unregelmäßig bilden","Vergleichsstrukturen verwenden","die Verben kennen, nach denen das Adjektiv steht"],"ex":[{"type":"txt","a":["carefully"],"q":"Setze ein: <span class=\"la\">Please read the instructions <span class=\"gap\">___<\/span> (careful).<\/span>","s":"Beschrieben wird das Lesen, also ein Verb. Dafür steht das Adverb <span class=\"la\">carefully<\/span>."},{"type":"mc","q":"Welcher Satz ist richtig?","h":"<span class=\"la\">taste<\/span> gehört zu einer besonderen Verbgruppe.","s":"Nach Verben der Wahrnehmung wie <span class=\"la\">taste, smell, look, sound, feel<\/span> steht das Adjektiv, weil sie keinen Vorgang, sondern eine Eigenschaft beschreiben.","o":["<span class=\"la\">This cake tastes delicious.<\/span>","<span class=\"la\">This cake tastes deliciously.<\/span>","<span class=\"la\">This cake is tasting delicious.<\/span>","<span class=\"la\">This cake tastes well.<\/span>"]},{"type":"txt","a":["hardly"],"q":"Setze ein, Bedeutung „kaum“: <span class=\"la\">I could <span class=\"gap\">___<\/span> hear her.<\/span>","s":"<span class=\"la\">hardly<\/span> heißt „kaum“. <span class=\"la\">hard<\/span> als Adverb hieße „hart, intensiv“, was hier den Sinn umkehren würde."},{"type":"mc","q":"Was bedeutet <span class=\"la\">He hardly works<\/span>?","h":"Ein Wort, zwei völlig verschiedene Bedeutungen je nach Endung.","s":"<span class=\"la\">hardly<\/span> ist eine Verneinung und heißt „kaum“. <span class=\"la\">He works hard<\/span> hieße dagegen, dass er viel und angestrengt arbeitet.","o":["Er arbeitet kaum.","Er arbeitet schwer.","Er arbeitet gern.","Er arbeitet selten gut."]},{"type":"txt","a":["bigger"],"q":"Bilde den Komparativ: <span class=\"la\">Our new flat is <span class=\"gap\">___<\/span> (big) than the old one.<\/span>","s":"Einsilbige Wörter mit kurzem Vokal verdoppeln vor der Endung den Konsonanten: <span class=\"la\">big – bigger – the biggest<\/span>."},{"type":"mc","q":"Welcher Satz ist richtig?","h":"Zwei Dinge sind zu prüfen: die Steigerungsform und das Vergleichswort.","s":"Mehrsilbige Adjektive werden mit <span class=\"la\">more<\/span> gesteigert, und nach dem Komparativ steht <span class=\"la\">than<\/span>, niemals <span class=\"la\">as<\/span>.","o":["<span class=\"la\">This exercise is more difficult than the last one.<\/span>","<span class=\"la\">This exercise is difficulter than the last one.<\/span>","<span class=\"la\">This exercise is more difficult as the last one.<\/span>","<span class=\"la\">This exercise is the most difficult than the last one.<\/span>"]},{"type":"txt","a":["as good as"],"q":"Vervollständige mit einer Vergleichsstruktur: <span class=\"la\">The sequel is not <span class=\"gap\">___<\/span> the original.<\/span> Setze drei Wörter ein.","h":"Gleichheit wird mit einer Klammer ausgedrückt.","s":"Richtig ist <span class=\"la\">as good as<\/span>. Die verneinte Form <span class=\"la\">not as … as<\/span> drückt aus, dass etwas das Niveau des Vergleichsgegenstands nicht erreicht."},{"type":"mc","q":"Welche Fassung drückt eine parallele Steigerung aus?","h":"Diese Struktur braucht zweimal den bestimmten Artikel.","s":"Die Struktur lautet <span class=\"la\">the<\/span> plus Komparativ, Komma, <span class=\"la\">the<\/span> plus Komparativ. <span class=\"la\">easy<\/span> ist zweisilbig auf -y und bildet deshalb <span class=\"la\">easier<\/span>, nicht <span class=\"la\">more easy<\/span>.","o":["<span class=\"la\">The more you practise, the easier it gets.<\/span>","<span class=\"la\">More you practise, easier it gets.<\/span>","<span class=\"la\">The more you practise, the more easy it gets.<\/span>","<span class=\"la\">As more you practise, as easier it gets.<\/span>"]},{"type":"self","q":"Beschreibe in vier Sätzen zwei Orte, die du kennst, und vergleiche sie: einmal mit <span class=\"la\">as … as<\/span>, einmal mit einem Komparativ und <span class=\"la\">than<\/span>, einmal mit einem Superlativ, einmal mit <span class=\"la\">the … the …<\/span>.","s":"Ein mögliches Muster: <span class=\"la\">Wiener Neustadt is not as big as Vienna. The air is better than in the city centre. For me the main square is the nicest part of town. The longer I live here, the more I notice the small differences.<\/span> Prüfe beim Durchlesen, ob nach jedem Komparativ wirklich <span class=\"la\">than<\/span> steht."}],"gen":["wf","coll"],"html":"<h3>Adjektiv oder Adverb?<\/h3>\n<ul><li>Das <b class=\"e\">Adjektiv<\/b> beschreibt ein Substantiv: <span class=\"la\">a careful driver.<\/span><\/li><li>Das <b class=\"e\">Adverb<\/b> beschreibt ein Verb, ein Adjektiv oder ein anderes Adverb: <span class=\"la\">He drives carefully.<\/span><\/li><\/ul>\n<div class=\"formula\">Bildung: Adjektiv + <b class=\"e\">-ly<\/b> · <span class=\"la\">careful – carefully, quick – quickly, happy – happily, true – truly<\/span><\/div>\n<p>Nach diesen Verben steht aber das <b class=\"e\">Adjektiv<\/b>, weil sie einen Zustand beschreiben und nicht eine Tätigkeit: <span class=\"la\">be, become, seem, appear, look, feel, sound, smell, taste, stay, remain, get<\/span>.<\/p>\n<div class=\"formula\"><span class=\"la\">The soup tastes <b class=\"e\">good<\/b>.<\/span> (nicht <span class=\"la\">tastes well<\/span>) · <span class=\"la\">She looks <b class=\"e\">tired<\/b>.<\/span> · <span class=\"la\">That sounds <b class=\"e\">strange<\/b>.<\/span><\/div>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b><span class=\"la\">good<\/span> ist das Adjektiv, <span class=\"la\">well<\/span> das Adverb: <span class=\"la\">She is a good singer. She sings well.<\/span> In der Bedeutung „gesund“ ist <span class=\"la\">well<\/span> allerdings selbst ein Adjektiv: <span class=\"la\">I don't feel well.<\/span><\/div>\n<h3>Sonderformen<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Adjektiv<\/th><th>Adverb<\/th><th>Achtung<\/th><\/tr><tr><td><span class=\"la\">good<\/span><\/td><td><span class=\"la\">well<\/span><\/td><td><\/td><\/tr><tr><td><span class=\"la\">fast, hard, late, early, high<\/span><\/td><td>gleich<\/td><td>kein <span class=\"la\">-ly<\/span><\/td><\/tr><tr><td><span class=\"la\">hard<\/span><\/td><td><span class=\"la\">hardly<\/span><\/td><td><span class=\"la\">hardly<\/span> heißt „kaum“, nicht „hart“<\/td><\/tr><tr><td><span class=\"la\">late<\/span><\/td><td><span class=\"la\">lately<\/span><\/td><td><span class=\"la\">lately<\/span> heißt „in letzter Zeit“<\/td><\/tr><tr><td><span class=\"la\">near<\/span><\/td><td><span class=\"la\">nearly<\/span><\/td><td><span class=\"la\">nearly<\/span> heißt „fast“<\/td><\/tr><\/table><\/div>\n<div class=\"note\"><b class=\"lab\">Merke<\/b><span class=\"la\">He worked hard<\/span> heißt, er arbeitete schwer. <span class=\"la\">He hardly worked<\/span> heißt, er arbeitete kaum. Ein Buchstabe, das Gegenteil der Aussage.<\/div>\n<h3>Steigerung<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Art<\/th><th>Komparativ<\/th><th>Superlativ<\/th><\/tr><tr><td>einsilbig<\/td><td><span class=\"la\">-er<\/span>: <span class=\"la\">old – older<\/span><\/td><td><span class=\"la\">-est<\/span>: <span class=\"la\">the oldest<\/span><\/td><\/tr><tr><td>zweisilbig auf -y<\/td><td><span class=\"la\">-ier<\/span>: <span class=\"la\">happy – happier<\/span><\/td><td><span class=\"la\">-iest<\/span>: <span class=\"la\">the happiest<\/span><\/td><\/tr><tr><td>mehrsilbig<\/td><td><span class=\"la\">more<\/span>: <span class=\"la\">more difficult<\/span><\/td><td><span class=\"la\">the most difficult<\/span><\/td><\/tr><tr><td>unregelmäßig<\/td><td><span class=\"la\">good – better, bad – worse, much / many – more, little – less, far – further / farther<\/span><\/td><td><span class=\"la\">the best, the worst, the most, the least, the furthest<\/span><\/td><\/tr><\/table><\/div>\n<p>Schreibung: Einsilbige Wörter mit kurzem Vokal verdoppeln den Endkonsonanten: <span class=\"la\">big – bigger – the biggest, hot – hotter.<\/span><\/p>\n<h3>Vergleiche<\/h3>\n<div class=\"formula\"><span class=\"la\">as … as<\/span> für Gleichheit: <span class=\"la\">She is as tall as her brother.<\/span><\/div>\n<div class=\"formula\"><span class=\"la\">not as … as<\/span> für Ungleichheit: <span class=\"la\">This book is not as good as the first one.<\/span><\/div>\n<div class=\"formula\"><span class=\"la\">than<\/span> nach dem Komparativ: <span class=\"la\">It is colder than yesterday.<\/span><\/div>\n<div class=\"formula\"><span class=\"la\">the … the …<\/span> für parallele Steigerung: <span class=\"la\">The more you practise, the easier it gets.<\/span><\/div>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>Nach dem Komparativ steht im Englischen nie <span class=\"la\">as<\/span>, sondern immer <span class=\"la\">than<\/span>: <span class=\"la\">better than<\/span>, nicht <span class=\"la\">better as<\/span>. Das ist eine direkte Übertragung aus dem Deutschen.<\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Adjektiv oder Adverb entscheiden<\/h4><div class=\"task\">Setze ein: <span class=\"la\">She speaks English <span class=\"gap\">___<\/span> (perfect) and her accent sounds <span class=\"gap\">___<\/span> (natural).<\/span><\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Erste Lücke: Beschrieben wird, wie sie spricht, also das Verb. Verben werden vom Adverb beschrieben.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Also <span class=\"la\">perfectly<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Zweite Lücke: <span class=\"la\">sound<\/span> gehört zu den Verben des Zustands und der Wahrnehmung. Nach ihnen steht das Adjektiv.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Also <span class=\"la\">natural<\/span>. Ergebnis: <span class=\"la\">She speaks English perfectly and her accent sounds natural.<\/span><\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"wordorder","t":"Wortstellung, Fragen und Question Tags","kl":"2","k":2,"a":"G","tag":"Aufbau","goals":["die feste englische Satzstellung einhalten","Fragen mit und ohne Hilfsverb bilden","indirekte Fragen richtig bauen","Question Tags anhängen","die typischen Stellungsfehler aus dem Deutschen vermeiden"],"ex":[{"type":"mc","q":"Welcher Satz hat die richtige Wortstellung?","h":"Die Reihenfolge Subjekt–Verb bleibt im Englischen immer erhalten.","s":"Eine vorangestellte Zeitangabe ändert im Englischen nichts an der Stellung von Subjekt und Verb. Die dritte Fassung ist nicht völlig falsch, aber unidiomatisch: Zeitangaben stehen am Satzende oder ganz am Anfang.","o":["<span class=\"la\">Yesterday we went to the cinema.<\/span>","<span class=\"la\">Yesterday went we to the cinema.<\/span>","<span class=\"la\">We went yesterday to the cinema.<\/span>","<span class=\"la\">We yesterday went to the cinema.<\/span>"]},{"type":"txt","a":["often goes"],"q":"Setze die Wörter in die richtige Reihenfolge: <span class=\"la\">goes / often / She<span class=\"gap\">___<\/span> swimming.<\/span> Schreibe die zwei Wörter in der richtigen Folge.","s":"Richtig ist <span class=\"la\">She often goes swimming.<\/span> Häufigkeitsadverbien stehen vor dem Vollverb."},{"type":"mc","q":"Welcher Satz ist richtig?","h":"Bei <span class=\"la\">be<\/span> gilt eine andere Regel als beim Vollverb.","s":"Nach einer Form von <span class=\"la\">be<\/span> steht das Häufigkeitsadverb dahinter, beim Vollverb davor. Das ist der einzige Unterschied, den du dir merken musst.","o":["<span class=\"la\">She is never late for school.<\/span>","<span class=\"la\">She never is late for school.<\/span>","<span class=\"la\">She is late never for school.<\/span>","<span class=\"la\">Never she is late for school.<\/span>"]},{"type":"txt","a":["Who wrote","Who has written"],"q":"Bilde die Frage nach dem Subjekt: <span class=\"la\">Somebody wrote this letter.<\/span> → <span class=\"gap\">___<\/span> this letter?_ Setze zwei Wörter ein.","h":"Fragt man nach dem Subjekt, braucht man kein Hilfsverb.","s":"Richtig ist <span class=\"la\">Who wrote this letter?<\/span> Beim Fragen nach dem Subjekt entfällt <span class=\"la\">did<\/span>, und das Verb bleibt in der Vergangenheitsform."},{"type":"mc","q":"Welche indirekte Frage ist richtig?","h":"In der eingebetteten Frage gilt die Stellung des Aussagesatzes.","s":"Die indirekte Frage braucht kein <span class=\"la\">do<\/span>, und Subjekt und Verb stehen in der gewöhnlichen Reihenfolge.","o":["<span class=\"la\">I wonder where she lives.<\/span>","<span class=\"la\">I wonder where does she live.<\/span>","<span class=\"la\">I wonder where lives she.<\/span>","<span class=\"la\">I wonder where she does live.<\/span>"]},{"type":"txt","a":["aren't you","are you not"],"q":"Ergänze den Question Tag: <span class=\"la\">You are coming with us, <span class=\"gap\">___<\/span>?<\/span>","s":"Richtig ist <span class=\"la\">aren't you?<\/span> Positiver Satz, negativer Tag, mit dem Hilfsverb des Hauptsatzes."},{"type":"txt","a":["does she","doesn't she"],"q":"Ergänze den Question Tag: <span class=\"la\">She doesn't eat meat, <span class=\"gap\">___<\/span>?<\/span>","h":"Der Hauptsatz ist bereits verneint.","s":"Richtig ist <span class=\"la\">does she?<\/span> Nach einem verneinten Satz folgt ein positiver Tag."},{"type":"mc","q":"Welcher Question Tag gehört zu <span class=\"la\">Let's take a break<\/span>?","h":"Dieser Fall ist eine Ausnahme, die man lernen muss.","s":"Nach <span class=\"la\">let's<\/span> steht immer <span class=\"la\">shall we?<\/span>. Nach einem Imperativ steht dagegen <span class=\"la\">will you?<\/span>, etwa in <span class=\"la\">Close the door, will you?<\/span>","o":["<span class=\"la\">shall we?<\/span>","<span class=\"la\">don't we?<\/span>","<span class=\"la\">will you?<\/span>","<span class=\"la\">aren't we?<\/span>"]},{"type":"self","q":"Schreibe fünf Sätze über deinen Alltag, in denen jeweils ein Häufigkeitsadverb vorkommt, davon mindestens zwei mit einer Form von <span class=\"la\">be<\/span>.","s":"Ein mögliches Muster: <span class=\"la\">I usually get up at six. I am often tired in the first lesson. I never skip breakfast. My bus is sometimes late. I have already finished my homework for tomorrow.<\/span> Prüfe bei jedem Satz: vor dem Vollverb, aber nach <span class=\"la\">be<\/span> und nach Hilfsverben."}],"gen":["tense","coll"],"html":"<h3>Die Grundstellung<\/h3>\n<p>Das Englische hat eine feste Reihenfolge, die man sich als Formel merken kann:<\/p>\n<div class=\"formula\"><b class=\"e\">Subjekt – Prädikat – Objekt – Art – Ort – Zeit<\/b><\/div>\n<div class=\"formula\"><span class=\"la\">She <b class=\"e\">read<\/b> <b class=\"e\">the letter<\/b> <b class=\"e\">carefully<\/b> <b class=\"e\">in the kitchen<\/b> <b class=\"e\">yesterday<\/b>.<\/span><\/div>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>Im Deutschen darf die Zeitangabe an den Satzanfang und das Verb rückt an die zweite Stelle: „Gestern las sie den Brief.“ Im Englischen bleibt die Stellung Subjekt–Verb immer erhalten: <span class=\"la\">Yesterday she read the letter.<\/span> Niemals <span class=\"la\">Yesterday read she …<\/span><\/div>\n<h3>Die Stellung der Häufigkeitsadverbien<\/h3>\n<p><span class=\"la\">always, often, usually, sometimes, never, already, just<\/span> stehen <b class=\"e\">vor dem Vollverb<\/b>, aber <b class=\"e\">nach<\/b> einer Form von <span class=\"la\">be<\/span> und nach Hilfsverben:<\/p>\n<div class=\"formula\"><span class=\"la\">She <b class=\"e\">often<\/b> goes swimming.<\/span> · <span class=\"la\">She is <b class=\"e\">often<\/b> late.<\/span> · <span class=\"la\">I have <b class=\"e\">never<\/b> seen it.<\/span><\/div>\n<h3>Fragen<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Fragetyp<\/th><th>Bildung<\/th><th>Beispiel<\/th><\/tr><tr><td>Entscheidungsfrage<\/td><td>Hilfsverb vor Subjekt<\/td><td><span class=\"la\">Do you live here?<\/span><\/td><\/tr><tr><td>mit <span class=\"la\">be<\/span><\/td><td><span class=\"la\">be<\/span> vor Subjekt, kein <span class=\"la\">do<\/span><\/td><td><span class=\"la\">Are you ready?<\/span><\/td><\/tr><tr><td>Fragewort als Objekt<\/td><td>Fragewort + Hilfsverb + Subjekt<\/td><td><span class=\"la\">What did she say?<\/span><\/td><\/tr><tr><td>Fragewort als Subjekt<\/td><td>ohne <span class=\"la\">do<\/span>, normale Stellung<\/td><td><span class=\"la\">Who called you?<\/span><\/td><\/tr><\/table><\/div>\n<div class=\"note\"><b class=\"lab\">Merke<\/b>Der Unterschied zwischen <span class=\"la\">Who did you call?<\/span> und <span class=\"la\">Who called you?<\/span> liegt allein im <span class=\"la\">did<\/span>. Fragt man nach dem Subjekt, entfällt das Hilfsverb.<\/div>\n<h3>Indirekte Fragen<\/h3>\n<p>In eingebetteten Fragen gilt die <b class=\"e\">Aussagesatzstellung<\/b>, ohne <span class=\"la\">do<\/span> und ohne Fragezeichen am Nebensatz:<\/p>\n<div class=\"formula\">direkt: <span class=\"la\">Where does she live?<\/span><\/div>\n<div class=\"formula\">indirekt: <span class=\"la\">Could you tell me where she <b class=\"e\">lives<\/b>?<\/span> · <span class=\"la\">I wonder where she <b class=\"e\">lives<\/b>.<\/span><\/div>\n<h3>Question Tags<\/h3>\n<p>Die Regel in einem Satz: positiver Satz, negativer Tag und umgekehrt. Im Tag steht das Hilfsverb des Hauptsatzes, bei dessen Fehlen eine Form von <span class=\"la\">do<\/span>.<\/p>\n<div class=\"formula\"><span class=\"la\">You are coming, <b class=\"e\">aren't you<\/b>?<\/span> · <span class=\"la\">She doesn't drive, <b class=\"e\">does she<\/b>?<\/span> · <span class=\"la\">It was cold, <b class=\"e\">wasn't it<\/b>?<\/span><\/div>\n<p>Sonderfälle: <span class=\"la\">I am right, <b class=\"e\">aren't I<\/b>?<\/span> · <span class=\"la\">Let's go, <b class=\"e\">shall we<\/b>?<\/span> · <span class=\"la\">Open the window, <b class=\"e\">will you<\/b>?<\/span><\/p>\n<div class=\"walk\"><h4>Schritt für Schritt: Eine indirekte Frage bauen<\/h4><div class=\"task\">Mache aus <span class=\"la\">When does the exhibition open?<\/span> eine höfliche indirekte Frage mit <span class=\"la\">Could you tell me …<\/span><\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Nimm das Fragewort: <span class=\"la\">when<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Streiche das Hilfsverb <span class=\"la\">does<\/span>, es gehört nur zur direkten Frage.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Setze Subjekt und Verb in der Aussagesatzstellung, und gib dem Verb das dritte s zurück, das vorher im <span class=\"la\">does<\/span> steckte: <span class=\"la\">the exhibition opens<\/span>.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Ergebnis: <span class=\"la\">Could you tell me when the exhibition opens?<\/span> Das Fragezeichen steht am Ende des ganzen Satzes, weil der Hauptsatz eine Frage ist.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"praep","t":"Präpositionen der Zeit, des Ortes und nach Verben","kl":"2","k":2,"a":"G","tag":"Aufbau","goals":["_in, on, at_ bei Zeit und Ort sicher wählen","die Präpositionen der Bewegung verwenden","die festen Verbindungen von Verb, Adjektiv und Substantiv mit ihrer Präposition lernen","die deutschen Übertragungsfehler erkennen"],"ex":[{"type":"txt","a":["on"],"q":"Setze ein: <span class=\"la\">We always visit my grandmother <span class=\"gap\">___<\/span> Sundays.<\/span>","s":"Bei Wochentagen steht <span class=\"la\">on<\/span>. Bei Monaten und Jahren stünde <span class=\"la\">in<\/span>, bei Uhrzeiten <span class=\"la\">at<\/span>."},{"type":"txt","a":["at"],"q":"Setze ein: <span class=\"la\">The film starts <span class=\"gap\">___<\/span> eight o'clock.<\/span>","s":"Bei Uhrzeiten steht <span class=\"la\">at<\/span>, weil ein Zeitpunkt gemeint ist."},{"type":"mc","q":"Welcher Satz ist richtig?","h":"Ein Jahr ist ein längerer Zeitraum.","s":"Bei Jahreszahlen, Monaten und Jahreszeiten steht <span class=\"la\">in<\/span>.","o":["<span class=\"la\">She was born in 2008.<\/span>","<span class=\"la\">She was born on 2008.<\/span>","<span class=\"la\">She was born at 2008.<\/span>","<span class=\"la\">She was born of 2008.<\/span>"]},{"type":"txt","a":["in"],"q":"Setze ein: <span class=\"la\">I left my keys <span class=\"gap\">___<\/span> the car.<\/span>","s":"Beim Auto steht <span class=\"la\">in<\/span>, weil es ein geschlossener Raum ist, in dem man sitzt. Beim Bus oder Zug stünde <span class=\"la\">on<\/span>."},{"type":"mc","q":"Welcher Satz ist richtig?","h":"Dieses Verb steht ohne Präposition.","s":"<span class=\"la\">discuss something<\/span> steht ohne <span class=\"la\">about<\/span>, genau wie <span class=\"la\">answer<\/span>, <span class=\"la\">enter<\/span> und <span class=\"la\">marry<\/span>. Das deutsche „über etwas diskutieren“ führt hier regelmäßig in die Irre.","o":["<span class=\"la\">We discussed the problem for an hour.<\/span>","<span class=\"la\">We discussed about the problem for an hour.<\/span>","<span class=\"la\">We discussed on the problem for an hour.<\/span>","<span class=\"la\">We discussed over the problem for an hour.<\/span>"]},{"type":"txt","a":["for"],"q":"Setze ein: <span class=\"la\">She apologised <span class=\"gap\">___<\/span> being late.<\/span>","s":"<span class=\"la\">apologise for something<\/span>. Nach der Präposition steht die <span class=\"la\">-ing<\/span>-Form."},{"type":"txt","a":["of"],"q":"Setze ein: <span class=\"la\">I am not aware <span class=\"gap\">___<\/span> any problem.<\/span>","s":"<span class=\"la\">aware of<\/span> – sich einer Sache bewusst sein. Dieselbe Präposition steht bei <span class=\"la\">afraid of<\/span>, <span class=\"la\">proud of<\/span> und <span class=\"la\">capable of<\/span>."},{"type":"mc","q":"Welcher Satz ist richtig?","h":"Das <span class=\"la\">to<\/span> ist hier keine Infinitivpartikel.","s":"In <span class=\"la\">look forward to<\/span> ist <span class=\"la\">to<\/span> eine Präposition, deshalb folgt die <span class=\"la\">-ing<\/span>-Form. Dieselbe Falle steckt in <span class=\"la\">be used to doing<\/span> und <span class=\"la\">object to doing<\/span>.","o":["<span class=\"la\">I am looking forward to hearing from you.<\/span>","<span class=\"la\">I am looking forward to hear from you.<\/span>","<span class=\"la\">I am looking forward hearing from you.<\/span>","<span class=\"la\">I look forward for hearing from you.<\/span>"]},{"type":"self","q":"Schreibe acht Sätze über dich, in denen je eine dieser Verbindungen vorkommt: <span class=\"la\">interested in, good at, afraid of, depend on, look forward to, apologise for, agree with, responsible for<\/span>.","s":"Ein mögliches Muster: <span class=\"la\">I am interested in languages. I am quite good at explaining things. I am not afraid of speaking in public. My plans depend on the timetable. I am looking forward to the summer. I apologised for missing the meeting. I agree with my sister on most things. I am responsible for the younger group.<\/span> Lerne solche Sätze als Ganzes; die Präposition hängt sich an den Satz, nicht an die Regel."}],"gen":["prep","phr"],"html":"<h3>Zeit: in, on, at<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>at<\/th><th>Uhrzeiten, Feste, Ausdrücke<\/th><th><span class=\"la\">at 7 o'clock, at Christmas, at night, at the weekend<\/span><\/th><\/tr><tr><td>on<\/td><td>Tage und Daten<\/td><td><span class=\"la\">on Monday, on 3 May, on my birthday, on Friday morning<\/span><\/td><\/tr><tr><td>in<\/td><td>längere Zeiträume<\/td><td><span class=\"la\">in May, in 2026, in summer, in the morning, in two weeks<\/span><\/td><\/tr><\/table><\/div>\n<div class=\"note\"><b class=\"lab\">Merke<\/b>Die Eselsbrücke geht vom Kleinen zum Großen: <span class=\"la\">at<\/span> für den Punkt, <span class=\"la\">on<\/span> für den Tag, <span class=\"la\">in<\/span> für alles, was länger dauert. Ausnahmen sind <span class=\"la\">at night<\/span> und im amerikanischen Englisch <span class=\"la\">on the weekend<\/span>.<\/div>\n<h3>Ort: in, on, at<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>at<\/th><th>Punkt, Adresse, Veranstaltung<\/th><th><span class=\"la\">at the station, at 12 Baker Street, at a concert<\/span><\/th><\/tr><tr><td>on<\/td><td>Oberfläche, Linie<\/td><td><span class=\"la\">on the table, on the wall, on the bus, on page 12<\/span><\/td><\/tr><tr><td>in<\/td><td>geschlossener Raum, Gebiet<\/td><td><span class=\"la\">in the kitchen, in Vienna, in the car, in a book<\/span><\/td><\/tr><\/table><\/div>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>Beim Verkehrsmittel gilt: <span class=\"la\">on the bus, on the train, on the plane<\/span>, aber <span class=\"la\">in the car, in a taxi<\/span>. Die Regel dahinter: Wo man aufrecht gehen kann, steht <span class=\"la\">on<\/span>.<\/div>\n<h3>Bewegung<\/h3>\n<div class=\"formula\"><span class=\"la\">to<\/span> (Ziel) · <span class=\"la\">into<\/span> (hinein) · <span class=\"la\">onto<\/span> (hinauf) · <span class=\"la\">out of<\/span> (heraus) · <span class=\"la\">through<\/span> (hindurch) · <span class=\"la\">across<\/span> (hinüber) · <span class=\"la\">towards<\/span> (in Richtung)<\/div>\n<p>Ohne <span class=\"la\">to<\/span> stehen <span class=\"la\">home<\/span> und <span class=\"la\">abroad<\/span>: <span class=\"la\">I went home. She moved abroad.<\/span><\/p>\n<h3>Feste Verbindungen<\/h3>\n<p>Diese muss man als Paket lernen, weil sie sich nicht aus dem Deutschen ableiten lassen:<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Verb<\/th><th>Adjektiv<\/th><th>Substantiv<\/th><\/tr><tr><td><span class=\"la\">depend on, insist on, rely on<\/span><\/td><td><span class=\"la\">good at, bad at<\/span><\/td><td><span class=\"la\">a reason for<\/span><\/td><\/tr><tr><td><span class=\"la\">belong to, listen to, look forward to<\/span><\/td><td><span class=\"la\">interested in, successful in<\/span><\/td><td><span class=\"la\">an answer to<\/span><\/td><\/tr><tr><td><span class=\"la\">consist of, accuse of, remind of<\/span><\/td><td><span class=\"la\">afraid of, proud of, aware of<\/span><\/td><td><span class=\"la\">the cause of<\/span><\/td><\/tr><tr><td><span class=\"la\">apologise for, wait for, look for<\/span><\/td><td><span class=\"la\">responsible for, famous for<\/span><\/td><td><span class=\"la\">an increase in<\/span><\/td><\/tr><tr><td><span class=\"la\">agree with, deal with<\/span><\/td><td><span class=\"la\">satisfied with, popular with<\/span><\/td><td><span class=\"la\">a solution to<\/span><\/td><\/tr><\/table><\/div>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>Drei Klassiker der Übertragung aus dem Deutschen: <span class=\"la\">discuss<\/span> steht ohne <span class=\"la\">about<\/span>, <span class=\"la\">answer<\/span> ohne <span class=\"la\">to<\/span> beim Objekt (<span class=\"la\">answer the question<\/span>) und <span cl
