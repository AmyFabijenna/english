ndow<\/span><\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div><b class=\"e\">please ergänzen.<\/b> am Satzende, nach einem Komma.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Ergebnis: <span class=\"la\">Could you open the window, please?<\/span><\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"s02","t":"Nach dem Weg fragen und den Weg beschreiben","kl":"6","k":6,"a":"U","tag":"6. Schulstufe","goals":["Du fragst höflich nach dem Weg.","Du beschreibst einen Weg Schritt für Schritt.","Du verwendest die Präpositionen der Richtung."],"ex":[{"type":"mc","q":"Du sprichst eine fremde Person auf der Straße an. Womit beginnst du?","o":["Excuse me,","Sorry for me,","Hello you,","Please,"],"s":"Zum Ansprechen sagt man <b>Excuse me<\/b>."},{"type":"mc","q":"How do I <span class=\"gap\">___<\/span> to the station?","o":["get","come","arrive","reach"],"s":"Feste Wendung: <b>How do I get to …?<\/b>"},{"type":"mc","q":"Go <span class=\"gap\">___<\/span> on until you see a church.","o":["straight","direct","forwards","even"],"s":"geradeaus = <b>straight on<\/b>."},{"type":"mc","q":"The museum is <span class=\"gap\">___<\/span> the left.","o":["on","in","at","to"],"s":"auf der linken Seite = <b>on the left<\/b>."},{"type":"mc","q":"Go <span class=\"gap\">___<\/span> the supermarket and then turn right.","o":["past","passed","pass","passing"],"s":"an etwas vorbeigehen = <b>go past<\/b>. (<span class=\"la\">passed<\/span> ist die Vergangenheit des Verbs <span class=\"la\">pass<\/span>.)"},{"type":"mc","q":"Turn left <span class=\"gap\">___<\/span> the traffic lights.","o":["at","on","in","to"],"s":"an der Ampel = <b>at the traffic lights<\/b>."},{"type":"txt","q":"Ergänze: Take the first street <span class=\"gap\">___<\/span> the right.","a":["on"],"s":"<b>on the right<\/b> = auf der rechten Seite."},{"type":"mc","q":"Was bedeutet <span class=\"la\">Cross the bridge<\/span>?","o":["Überquere die Brücke.","Geh unter der Brücke durch.","Bleib vor der Brücke stehen.","Geh an der Brücke vorbei."],"s":"<b>cross<\/b> = überqueren."}],"gen":[],"html":"<div class=\"tw\"><table class=\"plain\"><tr><th>Deutsch<\/th><th>Englisch<\/th><\/tr><tr><td>Entschuldigung, wie komme ich zu …?<\/td><td>Excuse me, how do I get to …?<\/td><\/tr><tr><td>Gehen Sie geradeaus.<\/td><td>Go straight on.<\/td><\/tr><tr><td>Biegen Sie links / rechts ab.<\/td><td>Turn left / right.<\/td><\/tr><tr><td>Nehmen Sie die zweite Straße rechts.<\/td><td>Take the second street on the right.<\/td><\/tr><tr><td>Gehen Sie an der Bank vorbei.<\/td><td>Go past the bank.<\/td><\/tr><tr><td>Überqueren Sie die Straße.<\/td><td>Cross the street.<\/td><\/tr><tr><td>Es ist auf der linken Seite.<\/td><td>It's on the left.<\/td><\/tr><tr><td>an der Ampel / an der Ecke<\/td><td>at the traffic lights / at the corner<\/td><\/tr><\/table><\/div>\n<p>Fremde spricht man mit <b>Excuse me<\/b> an. <span class=\"la\">Sorry<\/span> sagt man, wenn man sich entschuldigt oder etwas nicht verstanden hat.<\/p>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b><span class=\"la\">Turn left<\/span> steht ohne Präposition; aber <span class=\"la\">on the left<\/span> (auf der linken Seite) mit <span class=\"la\">on<\/span>.<\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Einen Weg beschreiben<\/h4><div class=\"task\">Beschreibe: geradeaus, bei der Ampel links, dann ist die Post auf der rechten Seite.<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div><b class=\"e\">Start.<\/b> <span class=\"la\">Go straight on.<\/span><\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div><b class=\"e\">Abbiegen.<\/b> <span class=\"la\">Turn left at the traffic lights.<\/span><\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div><b class=\"e\">Ziel.<\/b> <span class=\"la\">The post office is on the right.<\/span><\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Ergebnis: <span class=\"la\">Go straight on and turn left at the traffic lights. The post office is on the right.<\/span><\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"s03","t":"Im Geschäft und im Restaurant","kl":"6","k":6,"a":"U","tag":"6. Schulstufe","goals":["Du bestellst höflich Essen und Getränke.","Du führst ein Einkaufsgespräch.","Du verwendest <b>I'd like<\/b> statt <b>I want<\/b>."],"ex":[{"type":"mc","q":"“What would you like to drink?” – Welche Antwort ist höflich und richtig?","o":["I'd like an orange juice, please.","I like an orange juice, please.","I'm liking an orange juice, please.","I'd like have an orange juice, please."],"s":"Höflich bestellt man mit <b>I'd like …, please.<\/b>"},{"type":"mc","q":"“Would you like some dessert?” – “<span class=\"gap\">___<\/span> I'm full.”","o":["No, thank you.","No, please.","Yes, thank you.","Not, thanks."],"s":"Höflich ablehnen: <b>No, thank you.<\/b>"},{"type":"mc","q":"Du willst eine Hose anprobieren. Was fragst du?","o":["Can I try them on?","Can I try them out?","Can I probe them?","Can I put them in?"],"s":"anprobieren = <b>try on<\/b>; <span class=\"la\">trousers<\/span> ist Mehrzahl, daher <span class=\"la\">them<\/span>."},{"type":"mc","q":"Du möchtest im Restaurant zahlen: Can I have the <span class=\"gap\">___<\/span>, please?","o":["bill","menu","recipe","calculation"],"s":"die Rechnung = <b>the bill<\/b>."},{"type":"mc","q":"Have you got this T-shirt <span class=\"gap\">___<\/span> a larger size?","o":["in","on","at","with"],"s":"<b>in<\/b> a larger size / <b>in<\/b> blue."},{"type":"mc","q":"Die Verkäuferin fragt: <span class=\"la\">Can I help you?<\/span> Du willst dich nur umsehen.","o":["I'm just looking, thanks.","I just see, thanks.","I'm only watching, thanks.","I look me around, thanks."],"s":"Feste Wendung: <b>I'm just looking, thanks.<\/b>"},{"type":"txt","q":"Ergänze: I'd like <span class=\"gap\">___<\/span> pay by card, please.","a":["to"],"s":"Nach <span class=\"la\">I'd like<\/span> folgt <b>to<\/b> + Infinitiv."},{"type":"txt","q":"Ergänze: How <span class=\"gap\">___<\/span> is this jacket?","a":["much"],"s":"Nach dem Preis fragt man mit <b>How much<\/b>."}],"gen":[],"html":"<p><b>I'd like<\/b> (= I would like) ist die höfliche Form von „ich möchte“. <span class=\"la\">I want<\/span> klingt in einem Geschäft oder Restaurant fordernd.<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Situation<\/th><th>Englisch<\/th><\/tr><tr><td>bestellen<\/td><td>I'd like a cheese sandwich, please. / Can I have …, please?<\/td><\/tr><tr><td>Angebot des Kellners<\/td><td>What would you like to drink?<\/td><\/tr><tr><td>annehmen / ablehnen<\/td><td>Yes, please. / No, thank you.<\/td><\/tr><tr><td>Größe, Farbe<\/td><td>Have you got this in a smaller size / in blue?<\/td><\/tr><tr><td>anprobieren<\/td><td>Can I try it on?<\/td><\/tr><tr><td>zahlen<\/td><td>Can I have the bill, please? / How much is it?<\/td><\/tr><tr><td>nur schauen<\/td><td>I'm just looking, thanks.<\/td><\/tr><\/table><\/div>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>Nach <span class=\"la\">I'd like<\/span> steht <b>to<\/b> + Infinitiv: <span class=\"la\">I'd like to order<\/span> – nicht „I'd like order“.<\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Eine Bestellung aufbauen<\/h4><div class=\"task\">Bestelle höflich eine Suppe und ein Glas Wasser.<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div><b class=\"e\">Höfliche Einleitung.<\/b> <span class=\"la\">I'd like …<\/span><\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div><b class=\"e\">Mengen angeben.<\/b> <span class=\"la\">a soup and a glass of water<\/span><\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div><b class=\"e\">please nicht vergessen.<\/b><\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Ergebnis: <span class=\"la\">I'd like a soup and a glass of water, please.<\/span><\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"s04","t":"Meinung sagen, zustimmen, widersprechen","kl":"7","k":7,"a":"U","tag":"7. Schulstufe","goals":["Du äußerst deine Meinung mit passenden Redemitteln.","Du stimmst höflich zu oder widersprichst.","Du verbindest Gedanken mit <b>because, but, so, although, however<\/b>."],"ex":[{"type":"mc","q":"Welcher Satz ist richtig?","o":["I agree with you.","I am agree with you.","I'm agreeing to you.","I agree you."],"s":"<span class=\"la\">agree<\/span> ist ein Vollverb und steht mit <b>with<\/b>."},{"type":"mc","q":"<span class=\"gap\">___<\/span> my opinion, school should start later.","o":["In","After","On","For"],"s":"Feste Wendung: <b>In my opinion<\/b>."},{"type":"mc","q":"I stayed at home <span class=\"gap\">___<\/span> I was ill.","o":["because","so","although","however"],"s":"Der zweite Teil nennt den Grund: <b>because<\/b>."},{"type":"mc","q":"I was ill, <span class=\"gap\">___<\/span> I stayed at home.","o":["so","because","although","but"],"s":"Der zweite Teil nennt die Folge: <b>so<\/b>."},{"type":"mc","q":"<span class=\"gap\">___<\/span> it was raining, we went for a walk.","o":["Although","Because","However","So"],"s":"Ein Gegensatz, eingeleitet durch einen Nebensatz: <b>Although<\/b> (obwohl)."},{"type":"mc","q":"Du willst höflich widersprechen. Was passt am besten?","o":["I see your point, but I don't agree.","I see your point, but I am not agree.","I see your point, but I not agree.","I see your point, but I disagree not."],"s":"Höflich: zuerst den anderen Standpunkt anerkennen, dann widersprechen."},{"type":"txt","q":"Ergänze: Many teenagers do sports, <span class=\"gap\">___<\/span> example football or swimming.","a":["for"],"s":"<b>for example<\/b> = zum Beispiel."},{"type":"mc","q":"The film was long. <span class=\"gap\">___<\/span>, it was never boring.","o":["However","Although","Because","So that"],"s":"Zwei eigene Sätze mit Gegensatz verbindet <b>However,<\/b> am Satzanfang."}],"gen":[],"html":"<div class=\"tw\"><table class=\"plain\"><tr><th>Zweck<\/th><th>Redemittel<\/th><\/tr><tr><td>Meinung<\/td><td>I think … / In my opinion, … / I believe …<\/td><\/tr><tr><td>zustimmen<\/td><td>I agree (with you). / That's true. / You're right.<\/td><\/tr><tr><td>widersprechen<\/td><td>I don't agree. / I'm not sure about that. / I see your point, but …<\/td><\/tr><tr><td>begründen<\/td><td>because … / That's why …<\/td><\/tr><tr><td>Beispiel geben<\/td><td>for example, … / such as …<\/td><\/tr><\/table><\/div>\n<p>Verbindungswörter machen aus einzelnen Sätzen einen Gedankengang: <b>because<\/b> (weil), <b>so<\/b> (deshalb), <b>but<\/b> (aber), <b>although<\/b> (obwohl), <b>however<\/b> (jedoch – steht am Satzanfang, mit Komma).<\/p>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b><span class=\"la\">I am agree<\/span> ist falsch. <b>agree<\/b> ist ein Verb: <span class=\"la\">I agree. I don't agree.<\/span><\/div>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>„Meiner Meinung nach“ = <b>In my opinion<\/b> – nicht „After my opinion“ und nicht „In my opinion I think“.<\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Eine Meinung begründen<\/h4><div class=\"task\">Sage deine Meinung zu Schuluniformen und begründe sie.<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div><b class=\"e\">Meinung einleiten.<\/b> <span class=\"la\">In my opinion, …<\/span><\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div><b class=\"e\">Behauptung.<\/b> <span class=\"la\">school uniforms are a good idea<\/span><\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div><b class=\"e\">Grund mit because.<\/b> <span class=\"la\">because everybody looks the same and nobody is laughed at.<\/span><\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Ergebnis: <span class=\"la\">In my opinion, school uniforms are a good idea because everybody looks the same and nobody is laughed at.<\/span><\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"t01","t":"Eine E-Mail an einen Freund oder eine Freundin","kl":"6","k":6,"a":"T","tag":"6. Schulstufe","goals":["Du kennst den Aufbau einer persönlichen E-Mail.","Du verwendest passende Anrede, Einleitung und Schlussformel.","Du gliederst deinen Text in Absätze."],"ex":[{"type":"mc","q":"Welche Anrede passt für eine E-Mail an eine Freundin?","o":["Hi Emma,","Dear Mrs Emma,","Dear Sir or Madam,","To Emma:"],"s":"Unter Freunden schreibt man <b>Hi<\/b> oder <span class=\"la\">Dear<\/span> + Vorname, danach ein Komma."},{"type":"mc","q":"Nach der Anrede <span class=\"la\">Hi Tom,<\/span> – wie beginnt die nächste Zeile?","o":["Thanks for your email.","thanks for your email.","Thanks, for your email","thanks For your email."],"s":"Im Englischen beginnt der erste Satz nach der Anrede mit einem Großbuchstaben."},{"type":"mc","q":"Welcher Schlusssatz ist richtig?","o":["I'm looking forward to hearing from you.","I'm looking forward to hear from you.","I look forward hearing from you.","I'm looking forward for hearing from you."],"s":"<b>look forward to + -ing<\/b>."},{"type":"mc","q":"Welcher Gruß passt NICHT in eine E-Mail an einen Freund?","o":["Yours faithfully,","Best wishes,","See you soon,","Love,"],"s":"<b>Yours faithfully<\/b> gehört in förmliche Briefe an Unbekannte."},{"type":"mc","q":"In welcher Reihenfolge stehen die Teile?","o":["Anrede – Einleitung – Hauptteil – Schluss – Gruß und Name","Anrede – Hauptteil – Einleitung – Gruß – Schluss","Einleitung – Anrede – Hauptteil – Schluss – Name","Anrede – Einleitung – Schluss – Hauptteil – Gruß"],"s":"So ist jede persönliche E-Mail aufgebaut."},{"type":"txt","q":"Ergänze: Sorry I <span class=\"gap\">___<\/span> written for so long. (Kurzform, present perfect verneint)","a":["haven't"],"s":"<b>haven't written<\/b> – die Zeit reicht bis jetzt, daher present perfect."},{"type":"self","q":"Schreibe die Einleitung (zwei bis drei Sätze) einer E-Mail an einen Freund, der dir von seinem neuen Hund geschrieben hat.","s":"Zum Beispiel: <span class=\"la\">Hi Ben, thanks for your email. It was great to hear from you! I can't believe you've got a dog now – that's fantastic news.<\/span> Wichtig sind: Dank für die Nachricht, eine persönliche Reaktion und der Bezug auf das, was der andere geschrieben hat."},{"type":"self","q":"Schreibe zu Hause eine E-Mail (etwa 100 Wörter) an eine Freundin in England: Erzähle von deiner Schule, deinem Lieblingsfach und lade sie für die Ferien ein.","s":"Prüfe deinen Text mit dieser Liste: Anrede mit Komma? Einleitungssatz? Ein Absatz pro Punkt (Schule – Lieblingsfach – Einladung)? Für die Einladung passt <span class=\"la\">Would you like to visit me in the holidays?<\/span> Schlusssatz und Gruß vorhanden? Bei <span class=\"la\">he, she, it<\/span> an das -s gedacht?"}],"gen":[],"html":"<p>Eine persönliche E-Mail hat immer dieselben fünf Teile:<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Teil<\/th><th>Redemittel<\/th><\/tr><tr><td>Anrede<\/td><td>Hi Sam, / Dear Sam,<\/td><\/tr><tr><td>Einleitung<\/td><td>Thanks for your email. / How are you? / Sorry I haven't written for so long.<\/td><\/tr><tr><td>Hauptteil<\/td><td>ein Absatz pro Punkt der Angabe<\/td><\/tr><tr><td>Schluss<\/td><td>Write back soon. / I'm looking forward to hearing from you. / Say hello to your family.<\/td><\/tr><tr><td>Gruß und Name<\/td><td>Best wishes, / Love, / See you soon,<\/td><\/tr><\/table><\/div>\n<p>Nach der Anrede steht ein Komma, und die erste Zeile danach beginnt im Englischen trotzdem mit einem <b>Großbuchstaben<\/b>. In einer E-Mail an Freunde sind Kurzformen (<span class=\"la\">I'm, don't<\/span>) richtig und erwünscht.<\/p>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>Nach <span class=\"la\">looking forward to<\/span> folgt die -ing-Form: <span class=\"la\">I'm looking forward to seeing you.<\/span><\/div>\n<div class=\"note t\"><b class=\"lab\">Tipp<\/b>Hake auf dem Angabenzettel jeden Punkt ab, den du geschrieben hast. Fehlt ein Punkt, kostet das Inhaltspunkte – auch wenn der Text sprachlich gut ist.<\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Eine E-Mail planen<\/h4><div class=\"task\">Angabe: Schreibe deinem Brieffreund über dein Wochenende und frage nach seinen Hobbys.<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div><b class=\"e\">Punkte der Angabe zählen.<\/b> Zwei: (1) mein Wochenende, (2) Frage nach Hobbys.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div><b class=\"e\">Absätze planen.<\/b> Einleitung – Absatz Wochenende – Absatz Fragen – Schluss.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div><b class=\"e\">Zeiten festlegen.<\/b> Wochenende = past simple; Fragen nach Hobbys = simple present.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Ergebnis: ein Plan mit vier Absätzen. Erst danach schreibst du – so vergisst du keinen Punkt der Angabe.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"t02","t":"Eine Geschichte in der Vergangenheit erzählen","kl":"7","k":7,"a":"T","tag":"7. Schulstufe","goals":["Du baust eine Geschichte mit Anfang, Hauptteil und Schluss.","Du erzählst im past simple und beschreibst den Hintergrund im past progressive.","Du verbindest Ereignisse mit Zeitwörtern."],"ex":[{"type":"mc","q":"Welcher Satz eignet sich am besten als Anfang einer Geschichte?","o":["It was a stormy night, and I was alone at home.","In the end, everything was fine.","Then I ran away.","After that, we went home."],"s":"Der Anfang nennt Zeit, Ort und Person."},{"type":"mc","q":"We were sitting in the garden. <span class=\"gap\">___<\/span>, we heard a loud noise.","o":["Suddenly","Finally","First","In the end"],"s":"Ein unerwartetes Ereignis leitet man mit <b>Suddenly<\/b> ein."},{"type":"mc","q":"Welcher Satz bleibt richtig in der Erzählzeit?","o":["I opened the box and found an old letter.","I opened the box and find an old letter.","I open the box and found an old letter.","I opened the box and have found an old letter."],"s":"Beide Handlungen stehen im past simple."},{"type":"mc","q":"The sun <span class=\"gap\">___<\/span> and the birds <span class=\"gap\">___<\/span> when we set off.","o":["was shining … were singing","shines … sing","is shining … are singing","was shining … was singing"],"s":"Hintergrundbeschreibung im past progressive; <span class=\"la\">birds<\/span> ist Mehrzahl."},{"type":"mc","q":"<span class=\"gap\">___<\/span>, we found the way back and got home safely.","o":["In the end","First of all","At first","Before that"],"s":"Den Schluss leitet <b>In the end<\/b> ein."},{"type":"txt","q":"Ergänze: First we had lunch. After <span class=\"gap\">___<\/span>, we went to the beach.","a":["that"],"s":"<b>After that<\/b> = danach."},{"type":"self","q":"Mach diesen Satz lebendiger, indem du zwei Adjektive und ein Adverb einbaust: <span class=\"la\">The man opened the door.<\/span>","s":"Zum Beispiel: <span class=\"la\">The tall, strange man slowly opened the heavy door.<\/span> Adjektive stehen vor dem Nomen, das Adverb vor dem Verb oder am Satzende."},{"type":"self","q":"Schreibe zu Hause eine Geschichte (120 bis 150 Wörter), die mit diesem Satz beginnt: <span class=\"la\">When I woke up, the house was completely silent.<\/span>","s":"Prüfe: Bleibst du durchgehend in der Vergangenheit? Gibt es mindestens drei Zeitwörter (<span class=\"la\">then, suddenly, after that, in the end<\/span>)? Gibt es einen Höhepunkt und einen Schlusssatz? Hast du mindestens einmal das past progressive für den Hintergrund verwendet?"}],"gen":[],"html":"<p>Eine gute Geschichte beantwortet am Anfang <b>wer, wann, wo<\/b>, steigert sich zu einem spannenden Moment und hat einen klaren Schluss.<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Teil<\/th><th>Aufgabe<\/th><th>Redemittel<\/th><\/tr><tr><td>Anfang<\/td><td>Ort, Zeit, Personen<\/td><td>It was a cold evening in November. / Last summer …<\/td><\/tr><tr><td>Hauptteil<\/td><td>Ereignisse der Reihe nach<\/td><td>First, … Then … After that, … Suddenly, …<\/td><\/tr><tr><td>Höhepunkt<\/td><td>der spannendste Moment<\/td><td>At that moment … / To my surprise, …<\/td><\/tr><tr><td>Schluss<\/td><td>Auflösung, Gefühl<\/td><td>In the end, … / Finally, … / It was the best day of my life.<\/td><\/tr><\/table><\/div>\n<p>Die Ereignisse stehen im <b>past simple<\/b>. Was im Hintergrund lief, steht im <b>past progressive<\/b>: <span class=\"la\">The wind was blowing when we left the house.<\/span><\/p>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>Bleib in der Vergangenheit. Ein plötzlicher Wechsel ins Präsens mitten in der Geschichte ist einer der häufigsten Fehler.<\/div>\n<div class=\"note t\"><b class=\"lab\">Tipp<\/b>Adjektive und Adverbien machen die Geschichte lebendig: nicht nur <span class=\"la\">a house<\/span>, sondern <span class=\"la\">an old, empty house<\/span>; nicht nur <span class=\"la\">he opened the door<\/span>, sondern <span class=\"la\">he slowly opened the door<\/span>.<\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Einen Höhepunkt aufbauen<\/h4><div class=\"task\">Schreibe den spannendsten Moment: Jemand hört nachts ein Geräusch im Keller.<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div><b class=\"e\">Hintergrund im past progressive.<\/b> <span class=\"la\">I was lying in bed and the rain was beating against the window.<\/span><\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div><b class=\"e\">Plötzliches Ereignis.<\/b> <span class=\"la\">Suddenly, I heard a strange noise from the cellar.<\/span><\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div><b class=\"e\">Reaktion und Gefühl.<\/b> <span class=\"la\">My heart was beating fast, but I slowly opened the door.<\/span><\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Ergebnis: drei Sätze – Hintergrund, Ereignis, Reaktion. Dieses Muster funktioniert für jeden Höhepunkt.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"t03","t":"Personen und Bilder beschreiben","kl":"6","k":6,"a":"T","tag":"6. Schulstufe","goals":["Du beschreibst ein Bild geordnet von der Übersicht zum Detail.","Du verwendest das present progressive für das, was Personen tun.","Du gibst an, wo etwas im Bild ist."],"ex":[{"type":"mc","q":"<span class=\"gap\">___<\/span> the picture I can see a family at the beach.","o":["In","On","At","By"],"s":"im Bild = <b>in the picture<\/b>."},{"type":"mc","q":"In the picture, a man <span class=\"gap\">___<\/span> a newspaper.","o":["is reading","reads","read","has read"],"s":"Handlungen auf Bildern stehen im present progressive."},{"type":"mc","q":"<span class=\"gap\">___<\/span> the background there are some mountains.","o":["In","On","At","To"],"s":"<b>in the background / in the foreground<\/b>."},{"type":"mc","q":"The dog is <span class=\"gap\">___<\/span> the left.","o":["on","in","at","by"],"s":"<b>on the left / on the right<\/b>."},{"type":"mc","q":"There is a bird <span class=\"gap\">___<\/span> the top of the picture.","o":["at","on","in","over"],"s":"<b>at the top / at the bottom<\/b>."},{"type":"mc","q":"Womit beginnt eine gute Bildbeschreibung?","o":["mit einem Satz, der sagt, was das Bild insgesamt zeigt","mit einem kleinen Detail am Bildrand","mit der eigenen Meinung zum Bild","mit einer Frage an den Leser"],"s":"Zuerst der Überblick, dann die Einzelheiten, am Ende Vermutung und Meinung."},{"type":"txt","q":"Ergänze: She <span class=\"gap\">___<\/span> happy. (wirkt, sieht … aus)","a":["looks","seems"],"s":"<b>look<\/b> + Adjektiv = aussehen, wirken."},{"type":"self","q":"Sieh aus dem Fenster oder nimm ein Foto zur Hand. Beschreibe es in fünf Sätzen: Überblick, drei Einzelheiten mit Ortsangabe, eine Vermutung.","s":"Vergleiche mit diesem Muster: <span class=\"la\">The picture shows a busy street. In the foreground, two children are waiting at a bus stop. On the left, there is a small bakery. In the background, I can see some tall trees. I think it is early in the morning because the shops are just opening.<\/span>"}],"gen":[],"html":"<p>Eine Bildbeschreibung geht vom Allgemeinen zum Einzelnen: zuerst, was das Bild insgesamt zeigt, dann die Einzelheiten, zum Schluss deine Vermutung oder Meinung.<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Zweck<\/th><th>Redemittel<\/th><\/tr><tr><td>Überblick<\/td><td>The picture shows … / In the picture I can see …<\/td><\/tr><tr><td>Ort im Bild<\/td><td>in the foreground / in the background / in the middle / on the left / on the right / at the top / at the bottom<\/td><\/tr><tr><td>Handlung<\/td><td>A girl is reading a book. Two boys are playing football.<\/td><\/tr><tr><td>Vermutung<\/td><td>I think … / Maybe … / It looks like … / She looks happy.<\/td><\/tr><\/table><\/div>\n<p>Was Personen auf einem Bild tun, steht im <b>present progressive<\/b>, weil man es „gerade“ sieht. Für das, was da ist, verwendest du <span class=\"la\">there is / there are<\/span>.<\/p>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>Es heißt <b>in<\/b> the picture (im Bild), aber <b>on<\/b> the left / right und <b>at<\/b> the top / bottom.<\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Ein Bild in vier Sätzen beschreiben<\/h4><div class=\"task\">Bild: Ein Park. Vorne füttert eine Frau Enten, hinten spielen Kinder Fußball.<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div><b class=\"e\">Überblick.<\/b> <span class=\"la\">The picture shows a park.<\/span><\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div><b class=\"e\">Vordergrund.<\/b> <span class=\"la\">In the foreground, a woman is feeding some ducks.<\/span><\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div><b class=\"e\">Hintergrund.<\/b> <span class=\"la\">In the background, some children are playing football.<\/span><\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Ergebnis mit Vermutung: <span class=\"la\">I think it is a warm afternoon because nobody is wearing a jacket.<\/span><\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"t04","t":"Die eigene Meinung schreiben","kl":"8","k":8,"a":"T","tag":"8. Schulstufe","goals":["Du baust einen Meinungstext mit Einleitung, Argumenten und Schluss.","Du begründest jedes Argument und gibst ein Beispiel.","Du verbindest deine Gedanken mit passenden Konnektoren."],"ex":[{"type":"mc","q":"Womit leitest du dein erstes Argument ein?","o":["First of all,","All in all,","To sum up,","On the other hand,"],"s":"<b>First of all<\/b> eröffnet die Reihe der Argumente."},{"type":"mc","q":"Mobile phones can be useful in lessons. <span class=\"gap\">___<\/span>, they can also distract students.","o":["On the other hand","First of all","For example","To sum up"],"s":"Die Gegenseite führt man mit <b>On the other hand<\/b> ein."},{"type":"mc","q":"Welcher Satz ist ein vollständiges Argument (Behauptung, Grund, Beispiel)?","o":["School uniforms are a good idea because nobody is judged by their clothes; for example, expensive brands no longer matter.","School uniforms are a good idea.","I like school uniforms very much, and my friends like them too.","School uniforms exist in many countries, for example in England."],"s":"Nur der erste Satz enthält Behauptung, Begründung (<span class=\"la\">because<\/span>) und Beispiel (<span class=\"la\">for example<\/span>)."},{"type":"mc","q":"Was gehört in den Schluss?","o":["eine Zusammenfassung der eigenen Meinung","ein ganz neues Argument","ein weiteres Beispiel zum ersten Argument","eine ausführliche Darstellung der Gegenseite"],"s":"Der Schluss fasst zusammen und greift die Meinung aus der Einleitung auf."},{"type":"mc","q":"<span class=\"gap\">___<\/span>, I believe that homework is useful if there is not too much of it.","o":["To sum up","First of all","Secondly","For example"],"s":"<b>To sum up<\/b> leitet den Schluss ein."},{"type":"txt","q":"Ergänze: Another <span class=\"gap\">___<\/span> is that sport keeps you healthy. (Grund)","a":["reason"],"s":"<b>Another reason is that …<\/b> führt ein weiteres Argument ein."},{"type":"self","q":"Schreibe ein vollständiges Argument (zwei bis drei Sätze) zum Thema: <span class=\"la\">Should pupils have less homework?<\/span>","s":"Zum Beispiel: <span class=\"la\">First of all, I think pupils should have less homework because they need time to relax after a long school day. For example, many of my classmates get home at four o'clock and then still have to work for two hours.<\/span> Prüfe: Behauptung, <span class=\"la\">because<\/span>, Beispiel – alle drei da?"},{"type":"self","q":"Schreibe zu Hause einen Meinungstext (150 Wörter) zu: <span class=\"la\">Are computer games bad for teenagers?<\/span>","s":"Prüfe mit dieser Liste: Einleitung mit klarer Meinung? Zwei Argumente, jedes in einem eigenen Absatz, jedes mit Begründung und Beispiel? Ein Satz zur Gegenseite? Ein Schluss ohne neues Argument? Mindestens vier Konnektoren (<span class=\"la\">first of all, because, for example, on the other hand, to sum up<\/span>)?"}],"gen":[],"html":"<div class=\"tw\"><table class=\"plain\"><tr><th>Teil<\/th><th>Inhalt<\/th><th>Redemittel<\/th><\/tr><tr><td>Einleitung<\/td><td>Thema nennen, eigene Meinung<\/td><td>Many people think that … / In my opinion, …<\/td><\/tr><tr><td>Argument 1<\/td><td>Behauptung + Grund + Beispiel<\/td><td>First of all, … because … For example, …<\/td><\/tr><tr><td>Argument 2<\/td><td>weiterer Punkt<\/td><td>Secondly, … / Another reason is that …<\/td><\/tr><tr><td>Gegenseite<\/td><td>kurz anerkennen<\/td><td>On the other hand, … / Of course, …<\/td><\/tr><tr><td>Schluss<\/td><td>Meinung zusammenfassen<\/td><td>All in all, … / To sum up, I believe that …<\/td><\/tr><\/table><\/div>\n<p>Ein Argument ist erst vollständig, wenn es aus drei Teilen besteht: <b>Behauptung – Begründung – Beispiel<\/b>. Ein Absatz behandelt genau einen Gedanken.<\/p>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b><b>On the one hand … on the other hand<\/b> gehören zusammen und stellen zwei Seiten gegenüber. <span class=\"la\">On the other side<\/span> ist hier falsch.<\/div>\n<div class=\"note t\"><b class=\"lab\">Tipp<\/b>Der Schluss bringt kein neues Argument. Er fasst zusammen und nimmt die Meinung aus der Einleitung wieder auf.<\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Ein Argument in drei Teilen<\/h4><div class=\"task\">Thema: <span class=\"la\">Should every pupil learn an instrument?<\/span><\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div><b class=\"e\">Behauptung.<\/b> <span class=\"la\">First of all, learning an instrument is good for you<\/span><\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div><b class=\"e\">Begründung.<\/b> <span class=\"la\">because it trains your memory and your patience.<\/span><\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div><b class=\"e\">Beispiel.<\/b> <span class=\"la\">For example, you have to practise every day to play a song well.<\/span><\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Ergebnis: <span class=\"la\">First of all, learning an instrument is good for you because it trains your memory and your patience. For example, you have to practise every day to play a song well.<\/span><\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"f01","t":"Lesen: Texte verstehen ohne jedes Wort zu kennen","kl":"7","k":7,"a":"P","tag":"7. Schulstufe","goals":["Du unterscheidest überfliegendes und genaues Lesen.","Du erschließt unbekannte Wörter aus dem Zusammenhang.","Du belegst deine Antwort mit einer Textstelle."],"ex":[{"type":"mc","q":"Worum geht es im Text insgesamt?","o":["um ein Mädchen, das sich an einem neuen Wohnort einlebt","um die Vorteile des Radfahrens","um die Arbeit in einem Tierheim","um einen Streit in einer Schulklasse"],"s":"Der ganze Text beschreibt, wie Maya im Dorf ankommt und Anschluss findet – das erkennst du beim Überfliegen."},{"type":"mc","q":"How does Maya get to school?","o":["by bike","on foot","by bus","by boat"],"s":"Im Text steht <span class=\"la\">she cycles to school<\/span> – ein anderes Wort für dieselbe Sache."},{"type":"mc","q":"Richtig, falsch oder steht nicht im Text? <span class=\"la\">Maya liked the village from the first day.<\/span>","o":["falsch","richtig","steht nicht im Text"],"s":"<span class=\"la\">At first she missed the noise of the city<\/span> – am Anfang gefiel es ihr also nicht."},{"type":"mc","q":"Richtig, falsch oder steht nicht im Text? <span class=\"la\">Maya has got a dog.<\/span>","o":["steht nicht im Text","richtig","falsch"],"s":"Sie hilft im Tierheim, aber über ein eigenes Haustier sagt der Text nichts."},{"type":"mc","q":"Was bedeutet <span class=\"la\">reserved<\/span> in diesem Text am ehesten?","o":["zurückhaltend","reserviert für jemanden","unfreundlich und laut","neugierig"],"s":"Der Satz danach erklärt es: <span class=\"la\">they hardly spoke to her<\/span> – sie redeten kaum mit ihr."},{"type":"mc","q":"Was bedeutet <span class=\"la\">abandoned<\/span> am ehesten?","o":["ausgesetzt, verlassen","gefährlich","krank","teuer"],"s":"Die Tiere warten <span class=\"la\">for a new home<\/span> – sie haben also kein Zuhause mehr."},{"type":"mc","q":"Was bedeutet <span class=\"la\">hardly<\/span> in <span class=\"la\">they hardly spoke to her<\/span>?","o":["kaum","hart","laut","unhöflich"],"s":"<b>hardly<\/b> = kaum. Das Adverb zu <span class=\"la\">hard<\/span> heißt ebenfalls <span class=\"la\">hard<\/span>."},{"type":"txt","q":"How long does Maya's way to school take? About <span class=\"gap\">___<\/span> minutes. (Zahl in Worten)","a":["twenty","20"],"s":"Gezieltes Suchen nach einer Zahl: <span class=\"la\">which takes about twenty minutes<\/span>."}],"gen":[],"html":"<p>Beim Lesen gibt es zwei Gangarten. <b>Skimming<\/b>: den Text rasch überfliegen, um das Thema zu erfassen. <b>Scanning<\/b>: gezielt nach einer bestimmten Information suchen, etwa nach einer Zahl oder einem Namen.<\/p>\n<p>So gehst du bei einer Leseaufgabe vor:<\/p>\n<ul><li>Lies zuerst die Fragen, dann den Text – so weißt du, wonach du suchst.<\/li><li>Unterstreiche in jeder Frage das Schlüsselwort.<\/li><li>Suche die Stelle im Text. Oft steht dort nicht dasselbe Wort, sondern ein anderes mit gleicher Bedeutung.<\/li><li>Bei Richtig-Falsch-Aufgaben zählt nur, was <b>im Text<\/b> steht – nicht, was du selbst weißt.<\/li><\/ul>\n<p>Unbekannte Wörter erschließt du aus dem Satz davor und danach, aus Wortteilen (<span class=\"la\">un-<\/span>, <span class=\"la\">-less<\/span>) oder aus der Ähnlichkeit mit dem Deutschen.<\/p>\n<h3>Text für die Aufgaben<\/h3>\n<p><span class=\"la\">Maya moved to a small village last spring. At first she missed the noise of the city, but after a few weeks she began to enjoy the silence. Every morning she cycles to school along the river, which takes about twenty minutes. Her new classmates were rather reserved in the beginning; they hardly spoke to her. Now she has two close friends, and on Saturdays they help at the local animal shelter, where abandoned dogs and cats wait for a new home.<\/span><\/p>\n<div class=\"walk\"><h4>Schritt für Schritt: Ein unbekanntes Wort erschließen<\/h4><div class=\"task\"><span class=\"la\">The path was so steep that we had to stop and rest every few minutes.<\/span> – Was heißt <span class=\"la\">steep<\/span>?<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div><b class=\"e\">Wortart bestimmen.<\/b> Es steht nach <span class=\"la\">was so<\/span> → ein Adjektiv, das den Weg beschreibt.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div><b class=\"e\">Folge ansehen.<\/b> Man musste ständig rasten – der Weg war also anstrengend.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div><b class=\"e\">Vermutung bilden.<\/b> Ein Weg, der anstrengend ist, weil er nach oben führt.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Ergebnis: <span class=\"la\">steep<\/span> = steil. So kommst du ohne Wörterbuch zur Bedeutung.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"f02","t":"Hören: gut vorbereitet zuhören","kl":"7","k":7,"a":"P","tag":"7. Schulstufe","goals":["Du nutzt die Zeit vor dem Hören.","Du achtest auf Schlüsselwörter und Signale.","Du lässt dich von Ablenkern nicht täuschen."],"ex":[{"type":"mc","q":"Was tust du in der Zeit, bevor die Aufnahme beginnt?","o":["die Fragen lesen und Schlüsselwörter unterstreichen","mögliche Antworten vorab ankreuzen","die Fragen ins Deutsche übersetzen und aufschreiben","nur die erste Frage lesen und dann warten"],"s":"So weißt du beim Hören, worauf du achten musst."},{"type":"mc","q":"Du hörst: <span class=\"la\">“Let's meet at four … no wait, I've got football until half past. Let's say five.”<\/span> – Wann treffen sie sich?","o":["at five","at four","at half past four","at half past five"],"s":"Die erste Zeit wird mit <span class=\"la\">no wait<\/span> zurückgenommen; es gilt, was am Ende gesagt wird."},{"type":"mc","q":"Du hörst: <span class=\"la\">“I wanted to buy the red jacket, but in the end I took the blue one.”<\/span> – Welche Jacke hat sie gekauft?","o":["the blue one","the red one","both jackets","no jacket"],"s":"<span class=\"la\">but in the end<\/span> kündigt an, was tatsächlich geschah."},{"type":"mc","q":"Welches Wort hat die Betonung auf der ersten Silbe?","o":["thirty","thirteen","fifteen","nineteen"],"s":"Zehnerzahlen auf -ty betont man vorne, Zahlen auf -teen hinten."},{"type":"mc","q":"Du verstehst ein Wort nicht. Was ist das Beste?","o":["weiter zuhören und auf den Zusammenhang achten","bei dem Wort bleiben, bis es dir einfällt","die Aufgabe sofort leer lassen","das Wort aufschreiben und darüber nachdenken"],"s":"Der Zusammenhang hilft meist weiter, und Wichtiges wird oft noch einmal gesagt."},{"type":"mc","q":"Die Frage lautet: <span class=\"la\">Why is Tom late?<\/span> Welche Art Antwort erwartest du?","o":["einen Grund","eine Uhrzeit","einen Ort","einen Namen"],"s":"<span class=\"la\">Why<\/span> fragt nach einem Grund – achte beim Hören auf <span class=\"la\">because<\/span>."},{"type":"mc","q":"Du hörst: <span class=\"la\">“The train usually leaves from platform two, but today it's leaving from platform six instead.”<\/span> – Wohin gehst du heute?","o":["platform six","platform two","platform twenty-six","to the ticket office"],"s":"<span class=\"la\">but today … instead<\/span> zeigt die Änderung an."},{"type":"mc","q":"Wofür nutzt du das zweite Hören?","o":["zum Überprüfen und zum Füllen der Lücken","um alle Antworten neu zu entscheiden","um die Fragen erst jetzt genau zu lesen","um nur noch die letzte Aufgabe zu bearbeiten"],"s":"Beim zweiten Mal bestätigst du sichere Antworten und ergänzt, was noch fehlt."}],"gen":[],"html":"<p>Beim Hören kannst du nicht zurückblättern. Deshalb entscheidet die Vorbereitung:<\/p>\n<ul><li><b>Vor dem Hören:<\/b> Lies alle Fragen und Antwortmöglichkeiten. Unterstreiche Schlüsselwörter. Überlege, welche Art Antwort gesucht ist – eine Zahl, ein Ort, ein Grund?<\/li><li><b>Beim ersten Hören:<\/b> Verschaffe dir einen Überblick und kreuze an, was du sicher weißt.<\/li><li><b>Beim zweiten Hören:<\/b> Überprüfe und fülle Lücken.<\/li><\/ul>\n<p>In Hörtexten werden oft mehrere Möglichkeiten genannt, aber nur eine gilt am Ende. Achte auf Wörter, die eine Aussage zurücknehmen: <span class=\"la\">but, actually, no wait, in the end, instead<\/span>.<\/p>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>Wer an einem unbekannten Wort hängen bleibt, verpasst die nächsten zwei Sätze. Hör weiter – oft wird das Wichtige wiederholt.<\/div>\n<div class=\"note\"><b class=\"lab\">Merke<\/b>Zahlenpaare, die ähnlich klingen: <span class=\"la\">thirteen – thirty, fifteen – fifty<\/span>. Bei <span class=\"la\">-teen<\/span> liegt die Betonung hinten, bei <span class=\"la\">-ty<\/span> vorne.<\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Eine Höraufgabe vorbereiten<\/h4><div class=\"task\">Frage: <span class=\"la\">What time does the museum close on Sundays?<\/span><\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div><b class=\"e\">Schlüsselwörter.<\/b> <span class=\"la\">museum<\/span>, <span class=\"la\">close<\/span>, <span class=\"la\">Sundays<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div><b class=\"e\">Art der Antwort.<\/b> Gesucht ist eine Uhrzeit.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div><b class=\"e\">Mit Ablenkern rechnen.<\/b> Wahrscheinlich hörst du auch die Zeit für andere Tage – notiere nur die für Sonntag.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Ergebnis: Du hörst gezielt auf <span class=\"la\">Sunday<\/span> und die Uhrzeit danach und lässt dich von anderen Zeiten nicht ablenken.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"f03","t":"Schularbeit: den eigenen Text überprüfen","kl":"8","k":8,"a":"P","tag":"8. Schulstufe","goals":["Du findest typische Fehler in deinem eigenen Text.","Du gehst beim Korrekturlesen in festen Schritten vor.","Du teilst dir die Zeit bei der Schularbeit ein."],"ex":[{"type":"mc","q":"In welchem Satz ist alles richtig?","o":["My sister doesn't like spinach.","My sister don't like spinach.","My sister doesn't likes spinach.","My sister not like spinach."],"s":"<b>doesn't<\/b> + Infinitiv bei he / she / it."},{"type":"mc","q":"Welcher Satz ist richtig geschrieben?","o":["On Monday I have English and French.","On monday I have english and french.","On Monday i have English and French.","On Monday I have English and french."],"s":"Wochentage, Sprachen und <span class=\"la\">I<\/span> schreibt man groß."},{"type":"mc","q":"<span class=\"gap\">___<\/span> going to visit <span class=\"gap\">___<\/span> grandparents.","o":["They're … their","Their … they're","There … their","They're … there"],"s":"<b>They're<\/b> = they are; <b>their<\/b> zeigt Besitz an."},{"type":"mc","q":"Finde den Satz ohne Fehler.","o":["Last week we went to the cinema.","Last week we have gone to the cinema.","Last week we go to the cinema.","Last week went we to the cinema."],"s":"<span class=\"la\">Last week<\/span> verlangt das past simple; das Subjekt bleibt vor dem Verb."},{"type":"mc","q":"This film is better <span class=\"gap\">___<\/span> the last one. I liked it <span class=\"gap\">___<\/span> much.","o":["than … too","then … to","than … to","then … too"],"s":"Vergleich mit <b>than<\/b>; „zu sehr / sehr gern“ mit <b>too<\/b>."},{"type":"mc","q":"Was prüfst du im ersten Durchgang?","o":["ob alle Punkte der Angabe behandelt sind","die Rechtschreibung jedes Wortes","die Präpositionen","die Kommas"],"s":"Ein fehlender Inhaltspunkt wiegt schwerer als ein Schreibfehler."},{"type":"txt","q":"Verbessere das fehlerhafte Wort: <span class=\"la\">She can to swim very well.<\/span> → She can <span class=\"gap\">___<\/span> very well.","a":["swim"],"s":"Nach einem Modalverb steht der Infinitiv ohne <span class=\"la\">to<\/span>."},{"type":"self","q":"In diesem Text stecken fünf Fehler. Schreibe ihn richtig ab: <span class=\"la\">Yesterday i go to the park with my friend. She have a new bike and it is more fast then mine.<\/span>","s":"Richtig: <span class=\"la\">Yesterday I went to the park with my friend. She has a new bike and it is faster than mine.<\/span> Die fünf Fehler: <span class=\"la\">i<\/span> → <span class=\"la\">I<\/span>; <span class=\"la\">go<\/span> → <span class=\"la\">went<\/span> (past simple wegen yesterday); <span class=\"la\">have<\/span> → <span class=\"la\">has<\/span>; <span class=\"la\">more fast<\/span> → <span class=\"la\">faster<\/span>; <span class=\"la\">then<\/span> → <span class=\"la\">than<\/span>."}],"gen":[],"html":"<p>Plane am Ende jeder Schularbeit fünf bis zehn Minuten zum Durchlesen ein. Lies deinen Text mehrmals und achte jedes Mal auf nur eine Sache:<\/p>\n<ul><li><b>Durchgang 1 – Inhalt:<\/b> Sind alle Punkte der Angabe behandelt? Stimmt die Wortanzahl ungefähr?<\/li><li><b>Durchgang 2 – Verben:<\/b> Stimmt die Zeit? Steht bei <span class=\"la\">he, she, it<\/span> das -s? Folgt nach <span class=\"la\">did / does / can / will<\/span> der Infinitiv?<\/li><li><b>Durchgang 3 – Kleinwörter:<\/b> Artikel, Präpositionen, <span class=\"la\">much / many<\/span>, <span class=\"la\">than<\/span> beim Vergleich.<\/li><li><b>Durchgang 4 – Schreibung:<\/b> Großschreibung von <span class=\"la\">I<\/span>, Wochentagen, Monaten, Sprachen und Nationalitäten.<\/li><\/ul>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>Im Englischen schreibt man Nomen klein – groß nur Satzanfänge, Namen, <span class=\"la\">I<\/span>, Tage, Monate, Sprachen und Länder.<\/div>\n<div class=\"note t\"><b class=\"lab\">Tipp<\/b>Typische Schreibfallen: <span class=\"la\">their / there / they're<\/span>, <span class=\"la\">its / it's<\/span>, <span class=\"la\">then / than<\/span>, <span class=\"la\">were / where<\/span>, <span class=\"la\">to / too / two<\/span>.<\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Einen Satz Schritt für Schritt korrigieren<\/h4><div class=\"task\">Finde die Fehler: <span class=\"la\">My brother don't likes maths, but he is very good in english.<\/span><\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div><b class=\"e\">Verben prüfen.<\/b> <span class=\"la\">My brother<\/span> = he → <span class=\"la\">doesn't<\/span>; danach Infinitiv → <span class=\"la\">like<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div><b class=\"e\">Kleinwörter prüfen.<\/b> gut in etwas sein = <span class=\"la\">good at<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div><b class=\"e\">Großschreibung prüfen.<\/b> Sprachen schreibt man groß: <span class=\"la\">English<\/span>.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Ergebnis: <span class=\"la\">My brother doesn't like maths, but he is very good at English.<\/span><\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"}]};

const norm=s=>String(s).toLowerCase().replace(/[’‘`´]/g,"'").normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[.,;:!?"„“()]/g,' ').replace(/\s+/g,' ').trim();
function check(e,val){
  if(e.type==='num'){const x=Number(String(val).trim().replace(/\./g,'').replace(',','.'));if(String(val).trim()===''||isNaN(x))return null;return Math.abs(x-e.a)<0.001}
  const v=norm(val);if(!v)return null;return e.a.some(a=>norm(a)===v);
}
const ansText=e=>e.type==='num'?String(e.a):e.a[0];

/* ---------- Aufgaben ---------- */
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function exHTML(e,label){
  let h='<div class="nr">'+label+'</div><div class="q">'+e.q+'</div>';
  if(e.type==='mc'){h+='<div class="opts">'+shuffle(e.o.map((o,i)=>[o,i])).map(([o,i])=>'<button class="opt" data-i="'+i+'">'+o+'</button>').join('')+'</div>'}
  else if(e.type==='self'){h+='<div class="row"><button class="ghost show">Musterlösung zeigen</button></div>'}
  else{h+='<div class="row"><input type="text" placeholder="deine Antwort" autocomplete="off" autocapitalize="off" spellcheck="false"> <button class="chk">Prüfen</button><button class="ghost show" style="display:none">Lösung zeigen</button></div>'}
  return h+'<div class="fb"></div>';
}
function wireEx(box,e,onOk){
  const fb=box.querySelector('.fb');let tries=0;
  const show=(cls,head,body)=>{fb.className='fb show '+cls;fb.innerHTML='<b class="h">'+head+'</b>'+body};
  const sol=()=>'<div>'+e.s+'</div>';
  const good=()=>{box.classList.remove('no');box.classList.add('ok');show('good','Richtig!',sol());onOk&&onOk()};
  if(e.type==='mc'){
    box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      if(box.dataset.fin)return;
      if(+b.dataset.i===0){b.classList.add('right');box.dataset.fin=1;if(tries===0)good();else show('good','Jetzt stimmt es.',sol())}
      else{b.classList.add('wrong');b.disabled=true;tries++;box.classList.add('no');
        if(tries===1&&e.o.length>2)show('hint','Noch nicht.',e.h?('Tipp: '+e.h):'Lies die Angabe noch einmal genau und versuche es erneut.');
        else{box.dataset.fin=1;box.querySelector('.opt[data-i="0"]').classList.add('right');show('bad','Die richtige Antwort ist markiert.',sol())}}
    });
  }else if(e.type==='self'){
    box.querySelector('.show').onclick=()=>{show('good','Musterlösung',sol()+'<div class="row"><button class="petrol yes">Sinngemäß hatte ich das auch</button><button class="ghost nope">Noch nicht ganz</button></div>');
      fb.querySelector('.yes').onclick=()=>{box.classList.add('ok');onOk&&onOk();fb.querySelector('.row').remove()};
      fb.querySelector('.nope').onclick=()=>{fb.querySelector('.row').innerHTML='Kein Problem. Vergleiche Wort für Wort mit der Musterlösung, markiere die Stelle, an der du abgewichen bist, und versuche den Satz morgen noch einmal.'}};
  }else{
    const inp=box.querySelector('input'),sb=box.querySelector('.show');
    const go=()=>{
      const r=check(e,inp.value);
      if(r===null){show('hint','Noch keine Eingabe.',e.type==='num'?'Gib eine Zahl ein.':'Tippe deine Antwort ins Feld. Groß- und Kleinschreibung spielt keine Rolle.');return}
      if(r){if(box.dataset.shown)show('good','Stimmt.',sol());else good();return}
      tries++;box.classList.add('no');sb.style.display='';
      show(tries===1&&e.h?'hint':'bad','Noch nicht richtig.',tries===1&&e.h?('Tipp: '+e.h):(e.type==='num'?'Überlege noch einmal – oder sieh dir die Lösung an.':'Prüfe Form und Schreibung noch einmal – oder sieh dir die Lösung an und schreibe die Antwort danach selbst.'));
    };
    box.querySelector('.chk').onclick=go;inp.onkeydown=ev=>{if(ev.key==='Enter')go()};
    sb.onclick=()=>{box.dataset.shown=1;show('bad','Lösung: '+ansText(e),sol())};
  }
}

num:{n:'Zahlen in Worten',f(){const n=ri(11,99);
  return{type:'txt',q:'Schreibe die Zahl <b>'+n+'</b> auf Englisch in Worten.',a:[words(n),words(n).replace('-',' ')],
  s:'Richtig ist '+L(words(n))+'. Zehner und Einer verbindet ein Bindestrich; achte auf '+L('forty')+' (ohne u) und auf '+L('fifteen')+' und '+L('fifty')+'.'}}},
prep:{n:'in, on, at',f(){const v=pick(PREP);
  return{type:'mc',q:'Welche Präposition fehlt? '+L(v[0].replace('___',GAP)),o:[v[1]].concat(['in','on','at'].filter(x=>x!==v[1])),s:v[2]}}},
vok:{n:'Wortschatz',f(){const v=pick(VOK);
  return{type:'txt',q:'Wie heißt <b>'+v[0]+'</b> auf Englisch?',a:v.slice(1),s:'Richtig ist '+L(v[1])+'.'}}}
};

function genBox(ids,host,label){
  const box=document.createElement('div');box.className='ex';host.appendChild(box);let cnt=0,ok=0;
  const next=()=>{const id=pick(ids),e=GEN[id].f();cnt++;
    box.className='ex';delete box.dataset.shown;delete box.dataset.fin;
    box.innerHTML=exHTML(e,(label||'Endlos-Training')+' · '+GEN[id].n+' · Nr. '+cnt)+'<div class="row"><button class="lilac nx">Neue Aufgabe</button><span class="score">'+ok+' richtig</span></div>';
    wireEx(box,e,()=>{ok++;box.querySelector('.score').textContent=ok+' richtig'});box.querySelector('.nx').onclick=next;const i=box.querySelector('input');if(i&&cnt>1)i.focus()};
  next();
}

/* ---------- Seiten ---------- */
function sidebar(){
  let h='<input id="q" placeholder="Thema suchen …"><a class="homelink" href="#">⌂ Startseite & Lernplan</a><a class="homelink" href="#mix">∞ Grammatik- und Wortschatztrainer</a>';
  Object.keys(AREAS).forEach(a=>{h+='<div class="c'+a+'"><h5>'+AREAS[a]+'</h5>'+CH.filter(c=>c.a===a).map(c=>'<a class="ch" data-id="'+c.id+'" href="#'+c.id+'"><span class="dot"></span><span>'+c.t+'</span></a>').join('')+'</div>'});
  $('#side').innerHTML=h;
  $('#q').oninput=e=>{const v=e.target.value.toLowerCase();$$('aside a.ch').forEach(a=>{const c=BYID[a.dataset.id];a.style.display=(c.t+' '+c.goals.join(' ')).toLowerCase().includes(v)?'':'none'})};
  $('#side').onclick=e=>{if(e.target.closest('a'))$('#side').classList.remove('open')};
}
function home(){
  let h='<div class="hero"><h1>Englisch Unterstufe</h1><p>Der komplette Stoff von <span class="la">to be</span> bis zur indirekten Rede in '+CH.length+' Kapiteln: verständlich erklärt, an Beispielen Schritt für Schritt gezeigt und mit Aufgaben zum Selbermachen. Für Hausübungen, Tests und Schularbeiten von der fünften bis zur achten Schulstufe.</p><div class="chips"><span>'+CH.length+' Kapitel</span><span>'+CH.reduce((s,c)=>s+c.ex.length,0)+' Aufgaben mit Erklärung</span><span>Zehn Trainer ohne Ende</span><span>Grammatik, Wortschatz, Sprechen und Schreiben</span><span>Fortschritt wird gespeichert</span></div></div>';
  h+='<h2>So arbeitest du mit dem Kurs</h2><div class="grid g3 step3"><div class="card"><h4>Verstehen</h4>Lies die Erklärung langsam und sprich die englischen Beispiele halblaut mit. Beim Beispiel Schritt für Schritt gilt: erst selbst überlegen, dann den nächsten Schritt aufdecken.</div><div class="card"><h4>Anwenden</h4>Löse die Aufgaben. Die offenen Schreibaufgaben schreibst du zuerst selbst und vergleichst sie dann mit der Musterlösung. Zu jeder Aufgabe gibt es eine Begründung.</div><div class="card"><h4>Automatisieren</h4>Verbformen, Mehrzahl und Wortschatz müssen ohne Nachdenken kommen. Dafür ist der Trainer da: lieber jeden Tag zehn Minuten als einmal pro Woche eine Stunde.</div></div>';
  h+='<div class="note"><b class="lab">Wo fange ich an?</b>Bei jedem Kapitel steht die <b>Schulstufe</b>, in der das Thema meist zum ersten Mal vorkommt. Beginne mit den Kapiteln deiner Schulstufe. Merkst du dabei, dass etwas von früher fehlt, gehst du einen Schritt zurück: Die Kapitel bauen aufeinander auf. Wer schon sicher ist, beginnt mit dem Trainer – zeigt er Lücken, liest du das passende Kapitel nach.</div>';
  Object.keys(AREAS).forEach(a=>{h+='<h3>'+AREAS[a]+'</h3><div class="grid g2">'+CH.filter(c=>c.a===a).map(c=>{const d=chDone(c);return '<a class="tile c'+c.a+(d===c.ex.length?' done':'')+'" href="#'+c.id+'"><b>'+c.t+'</b><small>'+c.tag+' · '+d+' von '+c.ex.length+' Aufgaben'+(d===c.ex.length?' ✓':'')+'</small></a>'}).join('')+'</div>'});
  h+='<footer>Alle Erklärungen, Beispielsätze und Aufgaben wurden eigens für diesen Kurs geschrieben. Dein Fortschritt wird nur in deinem Browser gespeichert. <a href="#" id="reset">Fortschritt zurücksetzen</a></footer>';
  $('#main').innerHTML=h;
  $('#reset').onclick=e=>{e.preventDefault();if(e.target.dataset.sure){ST={ok:{}};save();route()}else{e.target.dataset.sure=1;e.target.textContent='Wirklich alles löschen? Noch einmal klicken.'}};
}
function mix(){
  const sets=[['Alles gemischt',Object.keys(GEN)],['Verbformen',['irr','s3','ing','past']],['Nomen und Adjektive',['plur','comp','aan']],['Wortschatz und Zahlen',['vok','num']],['in, on, at',['prep']],['Unregelmäßige Verben',['irr']]];
  $('#main').innerHTML='<div class="chead cG"><span class="tag">Training</span><h2 style="margin-top:.5em">Grammatik- und Wortschatztrainer</h2><p style="margin:0">Hier entstehen laufend neue Aufgaben. Wähle, was du üben willst. Wenn du zehn Aufgaben hintereinander ohne Fehler schaffst, sitzt der Bereich.</p></div><div class="row" id="mixsel" style="margin-bottom:18px">'+sets.map((s,i)=>'<button class="'+(i?'ghost':'')+'" data-i="'+i+'">'+s[0]+'</button>').join('')+'</div><div class="cG" id="mixhost"></div>';
  const start=i=>{$('#mixhost').innerHTML='';genBox(sets[i][1],$('#mixhost'),sets[i][0]);$$('#mixsel button').forEach((b,j)=>b.className=j===i?'':'ghost')};
  $$('#mixsel button').forEach(b=>b.onclick=()=>start(+b.dataset.i));start(0);
}
function chapter(c){
  const prev=CH[c.i-1],next=CH[c.i+1];
  let h='<div class="c'+c.a+'"><div class="chead"><span class="tag">'+AREAS[c.a]+'</span><span class="tag">'+c.tag+'</span><h2 style="margin-top:.5em">'+c.t+'</h2><b>Das kannst du nach diesem Kapitel:</b><ul class="goals">'+c.goals.map(g=>'<li>'+g+'</li>').join('')+'</ul></div>';
  h+=c.html;
  h+='<h3 id="ueb">Übungen</h3><p>Groß- und Kleinschreibung spielt beim Eintippen keine Rolle, Kurzformen wie <span class="la">don’t</span> sind erlaubt. Wo mehrere Lösungen richtig sind, wird jede davon anerkannt. Bei den offenen Aufgaben schreibst du zuerst selbst und vergleichst dann mit der Musterlösung.</p><div id="exhost"></div>';
  if(c.gen.length)h+='<h3>Endlos-Training</h3><p>Immer neue Aufgaben nach demselben Muster. Übe so lange weiter, bis du nicht mehr überlegen musst.</p><div id="genhost"></div>';
  h+='<div class="navrow">'+(prev?'<a href="#'+prev.id+'"><button class="ghost">← '+prev.t+'</button></a>':'<span></span>')+(next?'<a href="#'+next.id+'"><button>'+next.t+' →</button></a>':'<a href="#"><button>Zur Startseite</button></a>')+'</div></div>';
  $('#main').innerHTML=h;
  $$('.walk').forEach(w=>{const st=[...w.querySelectorAll('.wstep')],b=w.querySelector('.nxt'),all=w.querySelector('.all');let i=0;
    const upd=()=>{b.disabled=i>=st.length;b.textContent=i>=st.length?'Fertig':(i===0?'Ersten Schritt zeigen':'Nächster Schritt');if(i>=st.length)all.style.display='none'};
    b.onclick=()=>{if(i<st.length){st[i++].classList.add('show');upd()}};all.onclick=()=>{st.forEach(s=>s.classList.add('show'));i=st.length;upd()};upd()});
  const host=$('#exhost');
  c.ex.forEach((e,i)=>{const box=document.createElement('div');box.className='ex'+(ST.ok[c.id+'_'+i]?' ok':'');box.innerHTML=exHTML(e,'Aufgabe '+(i+1)+(ST.ok[c.id+'_'+i]?' · schon gelöst ✓':''));host.appendChild(box);wireEx(box,e,()=>{ST.ok[c.id+'_'+i]=1;save();progress()})});
  if(c.gen.length)genBox(c.gen,$('#genhost'));
}
function route(){
  const id=location.hash.slice(1);
  if(id==='mix')mix();else if(BYID[id])chapter(BYID[id]);else home();
  $$('aside a.ch').forEach(a=>a.classList.toggle('on',a.dataset.id===id));
  const on=$('aside a.ch.on');if(on&&on.scrollIntoView)on.scrollIntoView({block:'nearest'});
  progress();window.scrollTo(0,0);
}
sidebar();window.addEventListener('hashchange',route);$('#menuBtn').onclick=()=>$('#side').classList.toggle('open');route();

</script>
</body>
