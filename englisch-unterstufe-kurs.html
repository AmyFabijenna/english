re haben keine (<span class=\"la\">milk, water, money, homework, information, bread<\/span>).<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th><\/th><th>zählbar<\/th><th>nicht zählbar<\/th><\/tr><tr><td>viel<\/td><td>many<\/td><td>much<\/td><\/tr><tr><td>wenig, aber etwas<\/td><td>a few<\/td><td>a little<\/td><\/tr><tr><td>in jedem Satztyp<\/td><td>a lot of<\/td><td>a lot of<\/td><\/tr><tr><td>Frage nach der Menge<\/td><td>How many …?<\/td><td>How much …?<\/td><\/tr><\/table><\/div>\n<p><b>some<\/b> steht in bejahten Sätzen, <b>any<\/b> in Verneinungen und den meisten Fragen: <span class=\"la\">I've got some money. I haven't got any money. Have you got any money?<\/span><\/p>\n<div class=\"note\"><b class=\"lab\">Merke<\/b>Bietest du etwas an oder bittest du um etwas, steht auch in der Frage <b>some<\/b>: <span class=\"la\">Would you like some tea?<\/span><\/div>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b><span class=\"la\">homework, information, advice, furniture<\/span> sind nicht zählbar: nie „homeworks“ oder „an information“.<\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: much oder many, some oder any?<\/h4><div class=\"task\">Setze ein: <span class=\"la\">We haven't got <span class=\"gap\">___<\/span> eggs, and there isn't <span class=\"gap\">___<\/span> flour either.<\/span><\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div><b class=\"e\">Zählbar?<\/b> <span class=\"la\">eggs<\/span> kann man zählen, <span class=\"la\">flour<\/span> (Mehl) nicht.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div><b class=\"e\">Satztyp?<\/b> Beide Sätze sind verneint.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div><b class=\"e\">Wort wählen.<\/b> In Verneinungen: <span class=\"la\">many<\/span> (zählbar) und <span class=\"la\">much<\/span> (nicht zählbar) – oder für beide <span class=\"la\">any<\/span>.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Ergebnis: <span class=\"la\">We haven't got many eggs, and there isn't much flour either.<\/span> Auch richtig: <span class=\"la\">… any eggs … any flour<\/span>.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"g17","t":"Fragewörter und Wortstellung","kl":"6","k":6,"a":"G","tag":"6. Schulstufe","goals":["Du verwendest die Fragewörter <b>who, what, where, when, why, which, whose, how<\/b>.","Du baust Aussagesätze nach dem Muster Subjekt – Verb – Objekt.","Du stellst Ort vor Zeit."],"ex":[{"type":"mc","q":"“<span class=\"gap\">___<\/span> is your English teacher?” – “Mrs Green.”","o":["Who","Where","Whose","How"],"s":"Gefragt ist nach einer Person: <b>Who<\/b> = wer."},{"type":"mc","q":"“<span class=\"gap\">___<\/span> bag is this?” – “It's mine.”","o":["Whose","Who","Who's","Whom"],"s":"Gefragt ist nach dem Besitzer: <b>Whose<\/b> = wessen."},{"type":"mc","q":"Welcher Satz hat die richtige Wortstellung?","o":["We went to London last year.","We went last year to London.","Last year went we to London.","To London we last year went."],"s":"Ort (<span class=\"la\">to London<\/span>) steht vor Zeit (<span class=\"la\">last year<\/span>)."},{"type":"mc","q":"Welcher Satz ist richtig?","o":["Yesterday I met my friends in town.","Yesterday met I my friends in town.","I met yesterday in town my friends.","I yesterday my friends met in town."],"s":"Auch nach einer Zeitangabe am Satzanfang bleibt die Reihenfolge Subjekt – Verb."},{"type":"mc","q":"“<span class=\"gap\">___<\/span> do you go swimming?” – “Twice a week.”","o":["How often","How long","How much","How many"],"s":"Die Antwort nennt eine Häufigkeit: <b>How often<\/b>."},{"type":"mc","q":"Who <span class=\"gap\">___<\/span> this picture? It's beautiful.","o":["painted","did paint","did painted","does painted"],"s":"<span class=\"la\">Who<\/span> fragt nach dem Subjekt – deshalb ohne <span class=\"la\">did<\/span>: Who painted …?"},{"type":"txt","q":"Ergänze das Fragewort: “<span class=\"gap\">___<\/span> are you late?” – “Because I missed the bus.”","a":["Why"],"s":"Auf <b>Why<\/b> (warum) antwortet man mit <span class=\"la\">Because<\/span>."},{"type":"mc","q":"Welcher Satz ist richtig?","o":["She speaks English very well.","She speaks very well English.","She very well speaks English.","Very well she speaks English."],"s":"Verb und Objekt bleiben zusammen; die Art und Weise (<span class=\"la\">very well<\/span>) folgt danach."}],"gen":[],"html":"<p>Der englische Satz hat eine feste Reihenfolge: <b>Subjekt – Verb – Objekt – Ort – Zeit<\/b>. Beispiel: <span class=\"la\">I play football in the park on Sundays.<\/span> Anders als im Deutschen bleibt das Subjekt vor dem Verb, auch wenn der Satz mit einer Zeitangabe beginnt: <span class=\"la\">Yesterday I played football.<\/span><\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Fragewort<\/th><th>Bedeutung<\/th><\/tr><tr><td>who<\/td><td>wer<\/td><\/tr><tr><td>what<\/td><td>was<\/td><\/tr><tr><td>where<\/td><td>wo, wohin<\/td><\/tr><tr><td>when<\/td><td>wann<\/td><\/tr><tr><td>why<\/td><td>warum<\/td><\/tr><tr><td>which<\/td><td>welche/r/s (aus einer Auswahl)<\/td><\/tr><tr><td>whose<\/td><td>wessen<\/td><\/tr><tr><td>how often / how old / how long<\/td><td>wie oft / wie alt / wie lange<\/td><\/tr><\/table><\/div>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b><b>who<\/b> heißt „wer“, <b>where<\/b> heißt „wo“ – das Gegenteil von dem, was man vom Deutschen her erwartet.<\/div>\n<div class=\"note\"><b class=\"lab\">Merke<\/b>Fragt <span class=\"la\">who<\/span> oder <span class=\"la\">what<\/span> nach dem Subjekt, steht kein <span class=\"la\">do / does / did<\/span>: <span class=\"la\">Who lives here?<\/span><\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Einen Satz in die richtige Reihenfolge bringen<\/h4><div class=\"task\">Ordne: <span class=\"la\">every Friday / plays / in the gym / my class / basketball<\/span><\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div><b class=\"e\">Subjekt und Verb.<\/b> Wer tut etwas? <span class=\"la\">My class plays<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div><b class=\"e\">Objekt.<\/b> Was? <span class=\"la\">basketball<\/span> – direkt nach dem Verb.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div><b class=\"e\">Ort vor Zeit.<\/b> <span class=\"la\">in the gym<\/span> kommt vor <span class=\"la\">every Friday<\/span>.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Ergebnis: <span class=\"la\">My class plays basketball in the gym every Friday.<\/span> Merkhilfe: Subjekt – Verb – Objekt – Ort – Zeit.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"g18","t":"Zukunft: going to und will","kl":"7","k":7,"a":"G","tag":"7. Schulstufe","goals":["Du drückst Pläne mit <b>going to<\/b> aus.","Du verwendest <b>will<\/b> für Vorhersagen und spontane Entscheidungen.","Du bildest Fragen und Verneinungen in beiden Formen."],"ex":[{"type":"mc","q":"We've already bought the tickets. We <span class=\"gap\">___<\/span> to Rome in July.","o":["are going to fly","flew","have flown","were flying"],"s":"Die Tickets sind gekauft – ein fester Plan: <b>going to<\/b>."},{"type":"mc","q":"“I'm thirsty.” – “Wait, I <span class=\"gap\">___<\/span> you a glass of water.”","o":["'ll get","got","have got","was getting"],"s":"Eine spontane Entscheidung im Moment des Sprechens: <b>will<\/b>."},{"type":"mc","q":"I think our team <span class=\"gap\">___<\/span> the match next Saturday.","o":["will win","won","has won","was winning"],"s":"Nach <span class=\"la\">I think<\/span> steht für eine Vermutung <b>will<\/b>."},{"type":"mc","q":"Look at those dark clouds! It <span class=\"gap\">___<\/span> soon.","o":["is going to rain","rained","has rained","was raining"],"s":"Man sieht schon, was gleich passiert: <b>going to<\/b>. Wegen <span class=\"la\">soon<\/span> kommt keine Vergangenheit in Frage."},{"type":"mc","q":"Übersetze: <span class=\"la\">Ich will ein neues Handy.<\/span>","o":["I want a new phone.","I will a new phone.","I will have want a new phone.","I'm willing a new phone."],"s":"„wollen“ = <b>want<\/b>. <span class=\"la\">will<\/span> bildet nur die Zukunft."},{"type":"txt","q":"Verneine: <span class=\"la\">She will be at home tomorrow.<\/span> → She <span class=\"gap\">___<\/span> be at home tomorrow. <b>(Kurzform)<\/b>","a":["won't"],"s":"Die Kurzform von <span class=\"la\">will not<\/span> ist <b>won't<\/b>."},{"type":"txt","q":"Bilde die Frage: <span class=\"la\">They are going to move.<\/span> → <span class=\"gap\">___<\/span> going to move?","a":["Are they"],"s":"Bei der Frage rückt die Form von <span class=\"la\">to be<\/span> vor das Subjekt."},{"type":"mc","q":"Don't worry, I <span class=\"gap\">___<\/span> anyone your secret. I promise.","o":["won't tell","don't will tell","won't to tell","will not telling"],"s":"Ein Versprechen steht mit <b>will / won't<\/b>."}],"gen":[],"html":"<div class=\"tw\"><table class=\"plain\"><tr><th><\/th><th>going to<\/th><th>will<\/th><\/tr><tr><td>Verwendung<\/td><td>Plan, feste Absicht; etwas ist schon erkennbar<\/td><td>Vermutung, Vorhersage; spontane Entscheidung; Versprechen<\/td><\/tr><tr><td>Form<\/td><td>am / is / are + going to + Infinitiv<\/td><td>will + Infinitiv<\/td><\/tr><tr><td>Beispiel<\/td><td>I'm going to visit my aunt on Friday.<\/td><td>I think it will rain tomorrow.<\/td><\/tr><tr><td>Verneinung<\/td><td>She isn't going to come.<\/td><td>She won't come.<\/td><\/tr><\/table><\/div>\n<p>Signalwörter für <span class=\"la\">will<\/span>: <span class=\"la\">I think, I hope, probably, maybe, I'm sure<\/span>. Entscheidest du dich erst im Moment des Sprechens, nimmst du ebenfalls <span class=\"la\">will<\/span>: <span class=\"la\">The phone is ringing. – I'll get it.<\/span><\/p>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b><b>will<\/b> hat nichts mit „wollen“ zu tun. „Ich will ein Eis“ heißt <span class=\"la\">I want an ice cream<\/span>.<\/div>\n<div class=\"note\"><b class=\"lab\">Merke<\/b>Siehst du schon, was gleich passiert, steht <span class=\"la\">going to<\/span>: <span class=\"la\">Look at those clouds! It's going to rain.<\/span><\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: going to oder will?<\/h4><div class=\"task\">Setze ein: <span class=\"la\">I <span class=\"gap\">___<\/span> (study) tonight – I've got a test tomorrow. I think it <span class=\"gap\">___<\/span> (be) difficult.<\/span><\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div><b class=\"e\">Erste Lücke: Plan oder Vermutung?<\/b> Der Entschluss steht schon fest → <span class=\"la\">going to<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div><b class=\"e\">Zweite Lücke.<\/b> <span class=\"la\">I think<\/span> zeigt eine Vermutung an → <span class=\"la\">will<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div><b class=\"e\">Formen bilden.<\/b> <span class=\"la\">I am going to study<\/span> / <span class=\"la\">it will be<\/span>.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Ergebnis: <span class=\"la\">I'm going to study tonight. I think it will be difficult.<\/span><\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"g19","t":"Present perfect: Form und Verwendung","kl":"7","k":7,"a":"G","tag":"7. Schulstufe","goals":["Du bildest das present perfect mit <b>have / has<\/b> + 3. Form.","Du verwendest <b>ever, never, just, already, yet<\/b>.","Du unterscheidest <b>for<\/b> und <b>since<\/b>."],"ex":[{"type":"mc","q":"I <span class=\"gap\">___<\/span> my homework. Can I go out now?","o":["have finished","has finished","have finish","finishing"],"s":"<span class=\"la\">I<\/span> + <b>have<\/b> + 3. Form: have finished."},{"type":"mc","q":"She <span class=\"gap\">___<\/span> never <span class=\"gap\">___<\/span> a horse.","o":["has … ridden","have … ridden","has … rode","is … ridden"],"s":"<span class=\"la\">she<\/span> + <b>has<\/b>; die 3. Form von <span class=\"la\">ride<\/span> ist <b>ridden<\/b>."},{"type":"mc","q":"We have lived in this house <span class=\"gap\">___<\/span> 2019.","o":["since","for","ago","from"],"s":"2019 ist ein Startpunkt: <b>since<\/b>."},{"type":"mc","q":"I haven't seen him <span class=\"gap\">___<\/span> three weeks.","o":["for","since","ago","before"],"s":"<span class=\"la\">three weeks<\/span> ist eine Dauer: <b>for<\/b>."},{"type":"mc","q":"Have you tidied your room <span class=\"gap\">___<\/span>?","o":["yet","ago","since","last week"],"s":"In Fragen steht <b>yet<\/b> (schon) am Satzende."},{"type":"txt","q":"3. Form (past participle) von <span class=\"la\">write<\/span>:","a":["written"],"s":"<b>write – wrote – written<\/b>."},{"type":"txt","q":"Setze ein: Have you ever <span class=\"gap\">___<\/span> sushi? (eat)","a":["eaten"],"s":"Nach <span class=\"la\">have<\/span> steht die 3. Form: <b>eat – ate – eaten<\/b>."},{"type":"mc","q":"“Where's Dad?” – “He's <span class=\"gap\">___<\/span> to the supermarket. He'll be back soon.”","o":["gone","been","went","going"],"s":"Er ist noch dort bzw. unterwegs: <b>gone to<\/b>."}],"gen":[],"html":"<p>Das present perfect verbindet Vergangenheit und Gegenwart. Du verwendest es, wenn der Zeitpunkt nicht genannt wird oder unwichtig ist (<span class=\"la\">I have lost my key.<\/span>), für Erfahrungen (<span class=\"la\">Have you ever been to Italy?<\/span>) und für etwas, das bis jetzt andauert (<span class=\"la\">I have lived here for five years.<\/span>).<\/p>\n<p>Form: <b>have / has<\/b> + <b>past participle<\/b> (3. Form). Bei regelmäßigen Verben ist das die -ed-Form, die unregelmäßigen lernst du auswendig.<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Signalwort<\/th><th>Stellung<\/th><th>Beispiel<\/th><\/tr><tr><td>just, already, ever, never<\/td><td>vor dem Vollverb<\/td><td>She has just arrived.<\/td><\/tr><tr><td>yet<\/td><td>am Satzende, in Frage und Verneinung<\/td><td>I haven't finished yet.<\/td><\/tr><tr><td>for + Zeitraum<\/td><td>| for two weeks<\/td><\/tr><tr><td>since + Zeitpunkt<\/td><td>| since Monday<\/td><\/tr><\/table><\/div>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>„seit“ hat zwei Übersetzungen: <b>for<\/b> bei einer Dauer (for three days), <b>since<\/b> bei einem Startpunkt (since 2020).<\/div>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b><span class=\"la\">been to<\/span> = dort gewesen und wieder zurück; <span class=\"la\">gone to<\/span> = hingefahren und noch dort.<\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Present perfect bilden<\/h4><div class=\"task\">Setze ein: <span class=\"la\">She <span class=\"gap\">___<\/span> just <span class=\"gap\">___<\/span> (break) a glass.<\/span><\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div><b class=\"e\">Signalwort.<\/b> <span class=\"la\">just<\/span> = gerade eben, Ergebnis jetzt sichtbar → present perfect.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div><b class=\"e\">Hilfsverb.<\/b> <span class=\"la\">She<\/span> → <span class=\"la\">has<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div><b class=\"e\">3. Form.<\/b> <span class=\"la\">break – broke – broken<\/span>.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Ergebnis: <span class=\"la\">She has just broken a glass.<\/span> Das Signalwort <span class=\"la\">just<\/span> steht zwischen <span class=\"la\">has<\/span> und der 3. Form.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"g20","t":"Present perfect oder past simple?","kl":"7","k":7,"a":"G","tag":"7. Schulstufe","goals":["Du entscheidest zwischen den beiden Zeiten.","Du erkennst die Signalwörter beider Zeiten.","Du vermeidest den typischen Fehler deutschsprachiger Lernender."],"ex":[{"type":"mc","q":"I <span class=\"gap\">___<\/span> my grandparents last weekend.","o":["visited","have visited","has visited","visit"],"s":"<span class=\"la\">last weekend<\/span> ist eine abgeschlossene Zeitangabe: past simple."},{"type":"mc","q":"<span class=\"gap\">___<\/span> you ever <span class=\"gap\">___<\/span> a famous person?","o":["Have … met","Did … meet","Have … meet","Did … met"],"s":"<span class=\"la\">ever<\/span> fragt nach einer Erfahrung ohne Zeitpunkt: present perfect."},{"type":"mc","q":"When <span class=\"gap\">___<\/span> your phone?","o":["did you lose","have you lost","you lost","have you lose"],"s":"<span class=\"la\">When<\/span> fragt nach einem Zeitpunkt: past simple."},{"type":"mc","q":"She <span class=\"gap\">___<\/span> here since 2020.","o":["has worked","worked","works","did work"],"s":"<span class=\"la\">since<\/span> + Startpunkt, und es dauert noch an: present perfect."},{"type":"mc","q":"We <span class=\"gap\">___<\/span> to Spain two years ago.","o":["went","have gone","have been","go"],"s":"<span class=\"la\">ago<\/span> verlangt das past simple."},{"type":"mc","q":"I <span class=\"gap\">___<\/span> this book yet, so don't tell me the ending.","o":["haven't read","didn't read","don't read","wasn't read"],"s":"<span class=\"la\">yet<\/span> in der Verneinung: present perfect."},{"type":"txt","q":"Setze ein: My uncle <span class=\"gap\">___<\/span> me a present yesterday. (give)","a":["gave"],"s":"<span class=\"la\">yesterday<\/span> → past simple: <b>give – gave – given<\/b>."},{"type":"mc","q":"“Have you ever been to London?” – “Yes, I <span class=\"gap\">___<\/span> there last summer.”","o":["went","have gone","have been","go"],"s":"Die Erfahrung wird jetzt mit einer Zeitangabe (<span class=\"la\">last summer<\/span>) genauer erzählt: past simple."}],"gen":[],"html":"<div class=\"tw\"><table class=\"plain\"><tr><th><\/th><th>Past simple<\/th><th>Present perfect<\/th><\/tr><tr><td>Wann?<\/td><td>Zeitpunkt genannt und vorbei<\/td><td>Zeitpunkt nicht genannt; Bezug zu jetzt<\/td><\/tr><tr><td>Signalwörter<\/td><td>yesterday, last week, ago, in 2021, when …?<\/td><td>ever, never, just, already, yet, so far, for, since<\/td><\/tr><tr><td>Beispiel<\/td><td>I saw that film last week.<\/td><td>I have seen that film.<\/td><\/tr><\/table><\/div>\n<p>Die wichtigste Regel: Steht im Satz eine abgeschlossene Zeitangabe, muss das <b>past simple<\/b> stehen. Auch Fragen mit <span class=\"la\">When …?<\/span> verlangen das past simple, weil sie nach einem Zeitpunkt fragen.<\/p>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>Das deutsche Perfekt führt in die Irre: „Ich habe ihn gestern gesehen“ = <span class=\"la\">I saw him yesterday<\/span> – nie „I have seen him yesterday“.<\/div>\n<div class=\"note t\"><b class=\"lab\">Tipp<\/b>Oft beginnt ein Gespräch im present perfect (<span class=\"la\">Have you ever been to Paris?<\/span>) und geht im past simple weiter, sobald es um Einzelheiten geht (<span class=\"la\">Yes, I went there in 2022.<\/span>).<\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Die Zeitangabe entscheidet<\/h4><div class=\"task\">Setze ein: <span class=\"la\">I <span class=\"gap\">___<\/span> (see) that film. I <span class=\"gap\">___<\/span> (see) it last month.<\/span><\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div><b class=\"e\">Erster Satz.<\/b> Keine Zeitangabe; wichtig ist nur, dass ich den Film kenne → present perfect: <span class=\"la\">have seen<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div><b class=\"e\">Zweiter Satz.<\/b> <span class=\"la\">last month<\/span> = abgeschlossene Zeitangabe → past simple.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div><b class=\"e\">Form.<\/b> <span class=\"la\">see – saw – seen<\/span>.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Ergebnis: <span class=\"la\">I have seen that film. I saw it last month.<\/span><\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"g21","t":"Past progressive und past simple","kl":"7","k":7,"a":"G","tag":"7. Schulstufe","goals":["Du bildest das past progressive mit <b>was / were<\/b> + <b>-ing<\/b>.","Du verbindest eine laufende Handlung mit einem plötzlichen Ereignis.","Du verwendest <b>when<\/b> und <b>while<\/b> richtig."],"ex":[{"type":"mc","q":"I <span class=\"gap\">___<\/span> TV when the lights went out.","o":["was watching","watched","am watching","were watching"],"s":"Die laufende Handlung im Hintergrund: past progressive; zu <span class=\"la\">I<\/span> gehört <b>was<\/b>."},{"type":"mc","q":"While we <span class=\"gap\">___<\/span> in the park, we <span class=\"gap\">___<\/span> a fox.","o":["were walking … saw","walked … were seeing","were walking … were seeing","walk … saw"],"s":"Lange Handlung (were walking) + kurzes Ereignis (saw)."},{"type":"mc","q":"What <span class=\"gap\">___<\/span> at nine o'clock last night?","o":["were you doing","did you doing","you were doing","was you doing"],"s":"Frage: <b>were<\/b> + Subjekt + -ing-Form."},{"type":"mc","q":"She came home, <span class=\"gap\">___<\/span> her shoes and <span class=\"gap\">___<\/span> the cat.","o":["took off … fed","was taking off … was feeding","took off … was feeding","takes off … fed"],"s":"Handlungen, die nacheinander passieren, stehen im past simple."},{"type":"mc","q":"<span class=\"gap\">___<\/span> I was having a shower, somebody rang the doorbell.","o":["While","During","Until","Since"],"s":"Vor einer laufenden Handlung mit Subjekt und Verb steht <b>While<\/b>. (<span class=\"la\">During<\/span> steht nur vor einem Nomen.)"},{"type":"txt","q":"Setze ein: The sun <span class=\"gap\">___<\/span> when we left the house. (shine)","a":["was shining"],"s":"Hintergrundbeschreibung: <b>was shining<\/b>."},{"type":"txt","q":"Setze ein: I was riding my bike when I <span class=\"gap\">___<\/span> off. (fall)","a":["fell"],"s":"Das plötzliche Ereignis steht im past simple: <b>fall – fell<\/b>."},{"type":"mc","q":"While Dad was cooking, the children <span class=\"gap\">___<\/span> the table.","o":["were laying","was laying","are laying","have laid"],"s":"Zwei gleichzeitige längere Handlungen: beide im past progressive; <span class=\"la\">the children<\/span> → <b>were<\/b>."}],"gen":[],"html":"<p>Das past progressive beschreibt, was zu einem Zeitpunkt in der Vergangenheit <b>gerade im Gange<\/b> war: <span class=\"la\">At eight o'clock I was having dinner.<\/span><\/p>\n<p>Oft kommen beide Zeiten zusammen vor: Eine längere Handlung läuft (past progressive), und eine kurze neue Handlung tritt ein (past simple).<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>laufende Handlung<\/th><th>neues Ereignis<\/th><\/tr><tr><td>I was doing my homework<\/td><td>when the phone rang.<\/td><\/tr><tr><td>While we were walking home,<\/td><td>it started to rain.<\/td><\/tr><\/table><\/div>\n<p><b>while<\/b> steht meist vor der langen Handlung, <b>when<\/b> vor dem kurzen Ereignis. Laufen zwei lange Handlungen gleichzeitig, stehen beide im past progressive: <span class=\"la\">While I was cooking, he was reading.<\/span><\/p>\n<div class=\"note\"><b class=\"lab\">Merke<\/b>Folgen mehrere kurze Handlungen aufeinander, stehen alle im past simple: <span class=\"la\">He got up, had breakfast and left.<\/span><\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Hintergrund und Ereignis<\/h4><div class=\"task\">Setze ein: <span class=\"la\">While I <span class=\"gap\">___<\/span> (walk) the dog, it <span class=\"gap\">___<\/span> (start) to rain.<\/span><\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div><b class=\"e\">Was dauert länger?<\/b> Das Spazierengehen – die laufende Handlung.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div><b class=\"e\">Laufende Handlung.<\/b> past progressive: <span class=\"la\">was walking<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div><b class=\"e\">Neues Ereignis.<\/b> past simple: <span class=\"la\">started<\/span>.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Ergebnis: <span class=\"la\">While I was walking the dog, it started to rain.<\/span><\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"g22","t":"Adjektiv oder Adverb?","kl":"7","k":7,"a":"G","tag":"7. Schulstufe","goals":["Du bildest Adverbien mit <b>-ly<\/b>.","Du unterscheidest, ob ein Nomen oder ein Verb beschrieben wird.","Du kennst die Ausnahmen <b>good – well, fast, hard, late<\/b>."],"ex":[{"type":"mc","q":"She sings <span class=\"gap\">___<\/span>.","o":["beautifully","beautiful","beautifuly","more beautiful"],"s":"Wie singt sie? Ein Verb wird beschrieben, also Adverb: <b>beautifully<\/b>."},{"type":"mc","q":"He is a very <span class=\"gap\">___<\/span> driver.","o":["careful","carefully","care","carefuly"],"s":"Beschrieben wird das Nomen <span class=\"la\">driver<\/span>: Adjektiv."},{"type":"mc","q":"You speak English very <span class=\"gap\">___<\/span>.","o":["well","good","goodly","best"],"s":"Das Adverb zu <span class=\"la\">good<\/span> ist <b>well<\/b>."},{"type":"mc","q":"This cake tastes <span class=\"gap\">___<\/span>.","o":["wonderful","wonderfully","wonderfuly","well"],"s":"Nach <span class=\"la\">taste<\/span> steht ein Adjektiv."},{"type":"mc","q":"They worked <span class=\"gap\">___<\/span> all day.","o":["hard","hardly","hardily"],"s":"<span class=\"la\">hard<\/span> ist Adjektiv und Adverb zugleich; <span class=\"la\">hardly<\/span> hieße „kaum“."},{"type":"txt","q":"Bilde das Adverb: <span class=\"la\">easy<\/span> → <span class=\"gap\">___<\/span>","a":["easily"],"s":"-y wird zu <b>-ily<\/b>."},{"type":"txt","q":"Setze ein: The children were playing <span class=\"gap\">___<\/span> in the garden. (happy)","a":["happily"],"s":"Wie spielten sie? Adverb: <b>happily<\/b>."},{"type":"mc","q":"Don't drive so <span class=\"gap\">___<\/span> – the road is wet.","o":["fast","fastly","speed","speedy"],"s":"<span class=\"la\">fast<\/span> bleibt als Adverb unverändert; „fastly“ gibt es nicht."}],"gen":[],"html":"<p>Ein <b>Adjektiv<\/b> beschreibt ein Nomen: <span class=\"la\">a slow car<\/span>. Ein <b>Adverb<\/b> beschreibt, <b>wie<\/b> jemand etwas tut: <span class=\"la\">He drives slowly.<\/span> Im Deutschen sieht beides gleich aus („langsam“), im Englischen nicht.<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Adjektiv<\/th><th>Adverb<\/th><th>Regel<\/th><\/tr><tr><td>quick<\/td><td>quickly<\/td><td>+ ly<\/td><\/tr><tr><td>happy<\/td><td>happily<\/td><td>y → ily<\/td><\/tr><tr><td>terrible<\/td><td>terribly<\/td><td>-le → -ly<\/td><\/tr><tr><td>good<\/td><td>well<\/td><td>unregelmäßig<\/td><\/tr><tr><td>fast, hard, late, early<\/td><td>fast, hard, late, early<\/td><td>gleich<\/td><\/tr><\/table><\/div>\n<p>Nach den Verben <span class=\"la\">be, look, feel, sound, smell, taste<\/span> steht ein <b>Adjektiv<\/b>, weil sie einen Zustand beschreiben: <span class=\"la\">The soup smells good. You look tired.<\/span><\/p>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b><b>hardly<\/b> bedeutet „kaum“, nicht „hart“: <span class=\"la\">He works hard<\/span> (fleißig) – <span class=\"la\">He hardly works<\/span> (fast gar nicht).<\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Adjektiv oder Adverb?<\/h4><div class=\"task\">Setze ein: <span class=\"la\">She is a <span class=\"gap\">___<\/span> (quiet) girl. She speaks very <span class=\"gap\">___<\/span> (quiet).<\/span><\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div><b class=\"e\">Erste Lücke: Was wird beschrieben?<\/b> Das Nomen <span class=\"la\">girl<\/span> → Adjektiv: <span class=\"la\">quiet<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div><b class=\"e\">Zweite Lücke.<\/b> Beschrieben wird, wie sie spricht – also das Verb → Adverb.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div><b class=\"e\">Adverb bilden.<\/b> <span class=\"la\">quiet<\/span> + <span class=\"la\">-ly<\/span> = <span class=\"la\">quietly<\/span>.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Ergebnis: <span class=\"la\">She is a quiet girl. She speaks very quietly.<\/span><\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"g23","t":"If-Sätze Typ 1 und Typ 2","kl":"8","k":8,"a":"G","tag":"8. Schulstufe","goals":["Du bildest Bedingungssätze vom Typ 1 für mögliche Fälle.","Du bildest Bedingungssätze vom Typ 2 für nur vorgestellte Fälle.","Du setzt in den if-Teil nie <b>will<\/b> oder <b>would<\/b>."],"ex":[{"type":"mc","q":"If you <span class=\"gap\">___<\/span> now, you will catch the bus.","o":["leave","will leave","left","would leave"],"s":"Typ 1: im if-Teil simple present."},{"type":"mc","q":"If I had more time, I <span class=\"gap\">___<\/span> another language.","o":["would learn","will learn","learn","learned"],"s":"Typ 2: if + past simple, Hauptsatz mit <b>would<\/b>."},{"type":"mc","q":"We <span class=\"gap\">___<\/span> to the lake if the weather is nice tomorrow.","o":["will go","would go","went","had gone"],"s":"Typ 1: Der if-Teil steht im simple present, also Hauptsatz mit <b>will<\/b>."},{"type":"mc","q":"If I <span class=\"gap\">___<\/span> you, I would talk to her.","o":["were","am","will be","would be"],"s":"Feste Wendung im Typ 2: <b>If I were you<\/b>."},{"type":"mc","q":"What would you do if you <span class=\"gap\">___<\/span> a wallet in the street?","o":["found","find","will find","would find"],"s":"Hauptsatz mit <span class=\"la\">would<\/span> → Typ 2 → if-Teil im past simple."},{"type":"txt","q":"Setze ein: If she <span class=\"gap\">___<\/span> hard, she will pass the test. (study)","a":["studies"],"s":"Typ 1: simple present, bei <span class=\"la\">she<\/span> mit <b>-ies<\/b>."},{"type":"txt","q":"Setze ein: If we lived by the sea, we <span class=\"gap\">___<\/span> swimming every day. (go)","a":["would go","'d go"],"s":"Typ 2: <b>would<\/b> + Infinitiv."},{"type":"mc","q":"Welcher Satz ist richtig?","o":["If it snows, we will build a snowman.","If it will snow, we will build a snowman.","If it snows, we would build a snowman.","If it would snow, we build a snowman."],"s":"Kein <span class=\"la\">will<\/span> im if-Teil; Typ 1 kombiniert simple present mit <span class=\"la\">will<\/span>."}],"gen":[],"html":"<div class=\"tw\"><table class=\"plain\"><tr><th><\/th><th>if-Teil<\/th><th>Hauptsatz<\/th><th>Bedeutung<\/th><\/tr><tr><td>Typ 1<\/td><td>simple present<\/td><td>will + Infinitiv<\/td><td>gut möglich<\/td><\/tr><tr><td>Typ 2<\/td><td>past simple<\/td><td>would + Infinitiv<\/td><td>unwahrscheinlich oder nur vorgestellt<\/td><\/tr><\/table><\/div>\n<p>Beispiele: <span class=\"la\">If it rains, we will stay at home.<\/span> (Das kann leicht passieren.) – <span class=\"la\">If I won a million euros, I would travel around the world.<\/span> (Das stelle ich mir nur vor.)<\/p>\n<p>Der if-Teil kann vorne oder hinten stehen. Steht er vorne, kommt ein Komma: <span class=\"la\">We will stay at home if it rains.<\/span><\/p>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>Merksatz: <b>If and will make the teacher ill.<\/b> Im if-Teil steht kein <span class=\"la\">will<\/span> und kein <span class=\"la\">would<\/span>.<\/div>\n<div class=\"note\"><b class=\"lab\">Merke<\/b>Im Typ 2 sagt man oft <span class=\"la\">If I were you, …<\/span> (an deiner Stelle …) – <span class=\"la\">were<\/span> für alle Personen.<\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Typ 1 oder Typ 2?<\/h4><div class=\"task\">Setze ein: <span class=\"la\">If I <span class=\"gap\">___<\/span> (be) a bird, I <span class=\"gap\">___<\/span> (fly) to Africa.<\/span><\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div><b class=\"e\">Möglich oder nur vorgestellt?<\/b> Ich kann kein Vogel werden → Typ 2.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div><b class=\"e\">if-Teil.<\/b> past simple; bei <span class=\"la\">be<\/span> für alle Personen <span class=\"la\">were<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div><b class=\"e\">Hauptsatz.<\/b> <span class=\"la\">would<\/span> + Infinitiv.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Ergebnis: <span class=\"la\">If I were a bird, I would fly to Africa.<\/span><\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"g24","t":"Das Passiv","kl":"8","k":8,"a":"G","tag":"8. Schulstufe","goals":["Du bildest das Passiv im simple present und past simple.","Du wandelst aktive Sätze in passive um.","Du nennst den Handelnden mit <b>by<\/b>."],"ex":[{"type":"mc","q":"This castle <span class=\"gap\">___<\/span> in 1250.","o":["was built","is built","built","was build"],"s":"Vergangenheit + Passiv: <b>was<\/b> + 3. Form <b>built<\/b>."},{"type":"mc","q":"Millions of emails <span class=\"gap\">___<\/span> every day.","o":["are sent","is sent","are send","sent"],"s":"Gegenwart, Mehrzahl: <b>are<\/b> + 3. Form <b>sent<\/b>."},{"type":"mc","q":"The song was written <span class=\"gap\">___<\/span> a 15-year-old girl.","o":["by","from","of","with"],"s":"Der Handelnde wird mit <b>by<\/b> angeschlossen."},{"type":"mc","q":"Wandle um: <span class=\"la\">Somebody cleans the classrooms every day.<\/span>","o":["The classrooms are cleaned every day.","The classrooms is cleaned every day.","The classrooms were cleaned every day.","The classrooms are cleaning every day."],"s":"Gegenwart bleibt Gegenwart; <span class=\"la\">classrooms<\/span> ist Mehrzahl: <b>are cleaned<\/b>."},{"type":"mc","q":"Wandle um: <span class=\"la\">A dog bit the postman.<\/span>","o":["The postman was bitten by a dog.","The postman was bit from a dog.","The postman is bitten by a dog.","The postman bit by a dog."],"s":"Past simple → <b>was<\/b> + 3. Form <b>bitten<\/b> + <b>by<\/b>."},{"type":"txt","q":"Setze ein: Chocolate <span class=\"gap\">___<\/span> from cocoa beans. (make, simple present passive)","a":["is made"],"s":"<span class=\"la\">chocolate<\/span> ist Einzahl: <b>is made<\/b>."},{"type":"txt","q":"Setze ein: The first photos <span class=\"gap\">___<\/span> about 200 years ago. (take, past simple passive)","a":["were taken"],"s":"Mehrzahl + Vergangenheit: <b>were taken<\/b>."},{"type":"mc","q":"Welcher Satz ist ein Passivsatz?","o":["The letters were delivered this morning.","The postman was delivering letters.","She has delivered the letters.","They were tired this morning."],"s":"Passiv = Form von <span class=\"la\">to be<\/span> + 3. Form, und das Subjekt tut selbst nichts."}],"gen":[],"html":"<p>Im Passiv ist wichtig, <b>was<\/b> mit jemandem oder etwas geschieht – nicht, wer es tut. Form: eine Form von <b>to be<\/b> + <b>past participle<\/b> (3. Form).<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Zeit<\/th><th>Aktiv<\/th><th>Passiv<\/th><\/tr><tr><td>simple present<\/td><td>They speak English here.<\/td><td>English is spoken here.<\/td><\/tr><tr><td>past simple<\/td><td>Someone stole my bike.<\/td><td>My bike was stolen.<\/td><\/tr><\/table><\/div>\n<p>Beim Umwandeln wird das Objekt des aktiven Satzes zum Subjekt. Die Zeit bleibt gleich; <span class=\"la\">to be<\/span> richtet sich nach dem neuen Subjekt. Den Handelnden kannst du mit <b>by<\/b> anhängen: <span class=\"la\">The book was written by a young author.<\/span><\/p>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>„von“ beim Passiv heißt <b>by<\/b>, nicht „from“ oder „of“.<\/div>\n<div class=\"note\"><b class=\"lab\">Merke<\/b>Achte auf Einzahl und Mehrzahl: <span class=\"la\">The window was broken. The windows were broken.<\/span><\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Vom Aktiv ins Passiv<\/h4><div class=\"task\">Wandle um: <span class=\"la\">My grandfather built this house.<\/span><\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div><b class=\"e\">Objekt suchen.<\/b> <span class=\"la\">this house<\/span> – es wird zum Subjekt des Passivsatzes.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div><b class=\"e\">Zeit bestimmen und to be bilden.<\/b> <span class=\"la\">built<\/span> ist past simple; <span class=\"la\">this house<\/span> ist Einzahl → <span class=\"la\">was<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div><b class=\"e\">3. Form und Handelnder.<\/b> <span class=\"la\">build – built – built<\/span>; der Großvater kommt mit <span class=\"la\">by<\/span> ans Ende.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Ergebnis: <span class=\"la\">This house was built by my grandfather.<\/span><\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"g25","t":"Relativsätze: who, which, that, whose","kl":"8","k":8,"a":"G","tag":"8. Schulstufe","goals":["Du verbindest zwei Sätze mit einem Relativpronomen.","Du wählst zwischen <b>who<\/b>, <b>which<\/b>, <b>that<\/b> und <b>whose<\/b>.","Du weißt, wann das Relativpronomen wegfallen kann."],"ex":[{"type":"mc","q":"The woman <span class=\"gap\">___<\/span> lives upstairs is a doctor.","o":["who","which","whose","where"],"s":"<span class=\"la\">the woman<\/span> ist eine Person, und das Pronomen ist Subjekt: <b>who<\/b>."},{"type":"mc","q":"This is the phone <span class=\"gap\">___<\/span> I got for my birthday.","o":["which","who","whose","where"],"s":"Ein Ding: <b>which<\/b> (oder <span class=\"la\">that<\/span>)."},{"type":"mc","q":"I know a girl <span class=\"gap\">___<\/span> father is a pilot.","o":["whose","who","which","who's"],"s":"Besitz (deren Vater): <b>whose<\/b>."},{"type":"mc","q":"That's the café <span class=\"gap\">___<\/span> we first met.","o":["where","which","who","whose"],"s":"Ein Ort, an dem etwas geschah: <b>where<\/b>."},{"type":"mc","q":"In welchem Satz kann das Relativpronomen wegfallen?","o":["The jacket that I bought was cheap.","The boy who sits next to me is new.","The bus that goes to the centre is late.","The dog which bit me was small."],"s":"Nach <span class=\"la\">that<\/span> folgt ein neues Subjekt (<span class=\"la\">I<\/span>), das Pronomen ist also Objekt und darf wegfallen."},{"type":"mc","q":"Übersetze: <span class=\"la\">Das ist alles, was ich weiß.<\/span>","o":["That's everything that I know.","That's everything what I know.","That's everything who I know.","That's everything whose I know."],"s":"Nach <span class=\"la\">everything, something, all<\/span> steht <b>that<\/b> – nie <span class=\"la\">what<\/span>."},{"type":"txt","q":"Verbinde mit einem Relativpronomen: <span class=\"la\">I have a friend. He plays the drums.<\/span> → I have a friend <span class=\"gap\">___<\/span> plays the drums.","a":["who","that"],"s":"Person + Subjekt des Relativsatzes: <b>who<\/b> (oder <span class=\"la\">that<\/span>)."},{"type":"mc","q":"Welcher Satz ist richtig?","o":["The students who passed the test were happy.","The students, who passed the test were happy.","The students which passed the test were happy.","The students who passed the test, were happy."],"s":"Personen → <b>who<\/b>; und vor einem notwendigen Relativsatz steht kein Komma."}],"gen":[],"html":"<p>Ein Relativsatz beschreibt ein Nomen genauer: <span class=\"la\">The girl who lives next door is my friend.<\/span><\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Pronomen<\/th><th>für<\/th><th>Beispiel<\/th><\/tr><tr><td>who<\/td><td>Personen<\/td><td>the man who helped me<\/td><\/tr><tr><td>which<\/td><td>Dinge und Tiere<\/td><td>the book which I bought<\/td><\/tr><tr><td>that<\/td><td>Personen und Dinge<\/td><td>the film that we saw<\/td><\/tr><tr><td>whose<\/td><td>Besitz (dessen, deren)<\/td><td>the boy whose bike was stolen<\/td><\/tr><tr><td>where<\/td><td>Orte<\/td><td>the town where I was born<\/td><\/tr><\/table><\/div>\n<p>Ist das Relativpronomen das <b>Objekt<\/b> des Relativsatzes (dann folgt direkt ein neues Subjekt), kann es wegfallen: <span class=\"la\">the book (which) I bought<\/span>. Ist es das Subjekt, muss es bleiben: <span class=\"la\">the man who helped me<\/span>.<\/p>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>Im Englischen steht vor diesen Relativsätzen kein Komma – anders als im Deutschen.<\/div>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>„was“ als Relativpronomen heißt nicht <span class=\"la\">what<\/span>: „alles, was ich weiß“ = <span class=\"la\">everything (that) I know<\/span>.<\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Zwei Sätze verbinden<\/h4><div class=\"task\">Verbinde: <span class=\"la\">That's the girl. Her brother plays in a band.<\/span><\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div><b class=\"e\">Was haben beide Sätze gemeinsam?<\/b> <span class=\"la\">the girl<\/span> und <span class=\"la\">her<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div><b class=\"e\">Welche Rolle hat das Wort im zweiten Satz?<\/b> <span class=\"la\">her<\/span> zeigt Besitz an.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div><b class=\"e\">Relativpronomen wählen.<\/b> Besitz → <span class=\"la\">whose<\/span>; es ersetzt <span class=\"la\">her<\/span>.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Ergebnis: <span class=\"la\">That's the girl whose brother plays in a band.<\/span><\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"g26","t":"Indirekte Rede","kl":"8","k":8,"a":"G","tag":"8. Schulstufe","goals":["Du gibst wieder, was jemand gesagt hat.","Du verschiebst die Zeiten um eine Stufe zurück.","Du passt Pronomen und Zeitangaben an."],"ex":[{"type":"mc","q":"“I am tired.” → She said that she <span class=\"gap\">___<\/span> tired.","o":["was","am","were","has been"],"s":"simple present (<span class=\"la\">am<\/span>) wird zu past simple: <b>was<\/b>."},{"type":"mc","q":"“We will call you.” → They said they <span class=\"gap\">___<\/span> me.","o":["would call","would called","calling","would to call"],"s":"<span class=\"la\">will<\/span> wird zu <b>would<\/b> + Infinitiv."},{"type":"mc","q":"“I can't find my keys.” → He said he <span class=\"gap\">___<\/span> his keys.","o":["couldn't find","couldn't to find","couldn't found","didn't can find"],"s":"<span class=\"la\">can't<\/span> wird zu <b>couldn't<\/b>; <span class=\"la\">my<\/span> wird zu <span class=\"la\">his<\/span>."},{"type":"mc","q":"He <span class=\"gap\">___<\/span> me that he was busy.","o":["told","said","spoke","talked"],"s":"Mit einer Person als Objekt (<span class=\"la\">me<\/span>) steht <b>tell<\/b>."},{"type":"mc","q":"“I bought a new bike.” → Emma said she <span class=\"gap\">___<\/span> a new bike.","o":["had bought","has bought","buys","was buying"],"s":"past simple wird zu past perfect: <b>had bought<\/b>."},{"type":"mc","q":"“Where do you live?” → She asked me where <span class=\"gap\">___<\/span>.","o":["I lived","did I live","do I live","lived I"],"s":"Indirekte Frage: Aussagesatz-Wortstellung, ohne <span class=\"la\">do<\/span>, Zeit zurückverschoben."},{"type":"txt","q":"“I'll come tomorrow.” → He said he would come the <span class=\"gap\">___<\/span> day.","a":["next","following"],"s":"<span class=\"la\">tomorrow<\/span> wird zu <b>the next day<\/b> (oder <span class=\"la\">the following day<\/span>)."},{"type":"mc","q":"“I am doing my homework.” → Tom said he <span class=\"gap\">___<\/span> his homework.","o":["was doing","were doing","did","has done"],"s":"present progressive wird zu past progressive."}],"gen":[],"html":"<p>Steht das einleitende Verb in der Vergangenheit (<span class=\"la\">said, told me<\/span>), rücken die Zeiten eine Stufe zurück.<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>direkte Rede<\/th><th>indirekte Rede<\/th><\/tr><tr><td>simple present: “I like it.”<\/td><td>past simple: He said he liked it.<\/td><\/tr><tr><td>present progressive: “I am working.”<\/td><td>past progressive: She said she was working.<\/td><\/tr><tr><td>past simple: “I saw it.”<\/td><td>past perfect: He said he had seen it.<\/td><\/tr><tr><td>will: “I will help.”<\/td><td>would: She said she would help.<\/td><\/tr><tr><td>can: “I can come.”<\/td><td>could: He said he could come.<\/td><\/tr><\/table><\/div>\n<p>Auch Pronomen und Zeitangaben ändern sich: <span class=\"la\">I<\/span> → <span class=\"la\">he / she<\/span>, <span class=\"la\">my<\/span> → <span class=\"la\">his / her<\/span>, <span class=\"la\">today<\/span> → <span class=\"la\">that day<\/span>, <span class=\"la\">tomorrow<\/span> → <span class=\"la\">the next day<\/span>, <span class=\"la\">yesterday<\/span> → <span class=\"la\">the day before<\/span>, <span class=\"la\">here<\/span> → <span class=\"la\">there<\/span>.<\/p>\n<div class=\"note\"><b class=\"lab\">Merke<\/b><b>say<\/b> steht ohne Person (<span class=\"la\">He said that …<\/span>), <b>tell<\/b> braucht eine Person (<span class=\"la\">He told me that …<\/span>).<\/div>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>Indirekte Fragen haben die Wortstellung eines Aussagesatzes und kein <span class=\"la\">do<\/span>: <span class=\"la\">She asked where I lived.<\/span><\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Direkte in indirekte Rede umwandeln<\/h4><div class=\"task\">Wandle um: <span class=\"la\">Lena said, “I am reading my new book today.”<\/span><\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div><b class=\"e\">Pronomen anpassen.<\/b> <span class=\"la\">I<\/span> → <span class=\"la\">she<\/span>, <span class=\"la\">my<\/span> → <span class=\"la\">her<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div><b class=\"e\">Zeit zurückverschieben.<\/b> <span class=\"la\">am reading<\/span> → <span class=\"la\">was reading<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div><b class=\"e\">Zeitangabe anpassen.<\/b> <span class=\"la\">today<\/span> → <span class=\"la\">that day<\/span>.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Ergebnis: <span class=\"la\">Lena said (that) she was reading her new book that day.<\/span><\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"w01","t":"Zahlen, Uhrzeit und Datum","kl":"5","k":5,"a":"W","tag":"5. Schulstufe","goals":["Du schreibst Grund- und Ordnungszahlen richtig.","Du sagst die Uhrzeit mit <b>past<\/b> und <b>to<\/b>.","Du sprichst und schreibst ein Datum auf Englisch."],"ex":[{"type":"mc","q":"Wie spät ist es? <span class=\"la\">It's half past seven.<\/span>","o":["7:30","6:30","7:15","8:30"],"s":"<span class=\"la\">half past seven<\/span> = eine halbe Stunde <b>nach<\/b> sieben, also 7:30 (halb acht)."},{"type":"mc","q":"Wie sagt man 8:45?","o":["quarter to nine","quarter past nine","quarter to eight","half to nine"],"s":"15 Minuten <b>vor<\/b> neun: <b>quarter to nine<\/b>."},{"type":"txt","q":"Schreibe in Worten: 40","a":["forty"],"s":"<b>forty<\/b> – ohne u, obwohl es <span class=\"la\">four<\/span> heißt."},{"type":"txt","q":"Schreibe die Ordnungszahl in Worten: 12th","a":["twelfth"],"s":"<b>twelfth<\/b>: Aus dem v von <span class=\"la\">twelve<\/span> wird ein f."},{"type":"mc","q":"Wie spricht man das Datum <span class=\"la\">21st March<\/span>?","o":["the twenty-first of March","the twenty-one March","twenty-first the March","the twenty-oneth of March"],"s":"Ordnungszahl mit <span class=\"la\">the<\/span> davor und <span class=\"la\">of<\/span> danach."},{"type":"mc","q":"Wie spricht man die Jahreszahl 1985?","o":["nineteen eighty-five","one thousand nine hundred eighty-five","nineteen hundred and eighty-fifth","one nine eight five"],"s":"Jahreszahlen werden in zwei Zweiergruppen gesprochen."},{"type":"txt","q":"Schreibe in Worten: 15","a":["fifteen"],"s":"<b>fifteen<\/b> – nicht „fiveteen“."},{"type":"mc","q":"Welche Ordnungszahl ist richtig geschrieben?","o":["ninth","nineth","ninethe","nint"],"s":"Bei <b>ninth<\/b> fällt das e von <span class=\"la\">nine<\/span> weg."}],"gen":["num"],"html":"<p>Bei den Zahlen gibt es ein paar Stolperstellen in der Schreibung: <span class=\"la\">four<\/span> – aber <span class=\"la\">forty<\/span>; <span class=\"la\">five<\/span> – aber <span class=\"la\">fifteen, fifty<\/span>; <span class=\"la\">eight<\/span> – <span class=\"la\">eighteen<\/span> (nur ein t). Zehner und Einer verbindet ein Bindestrich: <span class=\"la\">twenty-one<\/span>.<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Grundzahl<\/th><th>Ordnungszahl<\/th><\/tr><tr><td>one<\/td><td>first (1st)<\/td><\/tr><tr><td>two<\/td><td>second (2nd)<\/td><\/tr><tr><td>three<\/td><td>third (3rd)<\/td><\/tr><tr><td>five<\/td><td>fifth (5th)<\/td><\/tr><tr><td>nine<\/td><td>ninth (9th)<\/td><\/tr><tr><td>twelve<\/td><td>twelfth (12th)<\/td><\/tr><tr><td>twenty<\/td><td>twentieth (20th)<\/td><\/tr><\/table><\/div>\n<p>Bei der Uhrzeit nennst du zuerst die Minuten, dann die Stunde: <span class=\"la\">ten past three<\/span> (3:10), <span class=\"la\">quarter past three<\/span> (3:15), <span class=\"la\">half past three<\/span> (3:30), <span class=\"la\">quarter to four<\/span> (3:45).<\/p>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b><b>half past three<\/b> ist halb <b>vier<\/b> – das Englische zählt von der vollen Stunde weiter, das Deutsche zur nächsten hin.<\/div>\n<div class=\"note\"><b class=\"lab\">Merke<\/b>Datum: Man schreibt <span class=\"la\">3rd May<\/span> und spricht <span class=\"la\">the third of May<\/span>. Jahre teilt man: 1999 = <span class=\"la\">nineteen ninety-nine<\/span>.<\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Die Uhrzeit sagen<\/h4><div class=\"task\">Wie sagt man 6:40?<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div><b class=\"e\">Vor oder nach der halben Stunde?<\/b> 40 Minuten sind über die Hälfte → <span class=\"la\">to<\/span> und die nächste Stunde.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div><b class=\"e\">Minuten bis zur vollen Stunde.<\/b> Von 6:40 bis 7:00 sind es 20 Minuten.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div><b class=\"e\">Zusammensetzen.<\/b> Minuten + <span class=\"la\">to<\/span> + nächste Stunde.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Ergebnis: <span class=\"la\">twenty to seven<\/span>. Bis Minute 30 rechnest du mit <span class=\"la\">past<\/span> (6:20 = <span class=\"la\">twenty past six<\/span>), danach mit <span class=\"la\">to<\/span>.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"w02","t":"Zeitangaben mit in, on, at","kl":"5","k":5,"a":"W","tag":"5. Schulstufe","goals":["Du wählst die richtige Präposition für Uhrzeit, Tag und Monat.","Du kennst die festen Wendungen <b>at night<\/b> und <b>at the weekend<\/b>.","Du weißt, wann gar keine Präposition steht."],"ex":[{"type":"mc","q":"The film starts <span class=\"gap\">___<\/span> eight o'clock.","o":["at","on","in"],"s":"Uhrzeiten stehen mit <b>at<\/b>."},{"type":"mc","q":"We always go skiing <span class=\"gap\">___<\/span> February.","o":["in","on","at"],"s":"Monate stehen mit <b>in<\/b>."},{"type":"mc","q":"I have a guitar lesson <span class=\"gap\">___<\/span> Wednesday afternoon.","o":["on","in","at"],"s":"Tag + Tagesabschnitt: <b>on<\/b>."},{"type":"mc","q":"Owls hunt <span class=\"gap\">___<\/span> night.","o":["at","in","on"],"s":"Feste Wendung: <b>at night<\/b>."},{"type":"mc","q":"See you <span class=\"gap\">___<\/span> next week!","o":["– (keine Präposition)","on","in","at"],"s":"Vor <span class=\"la\">next<\/span> steht keine Präposition."},{"type":"mc","q":"My sister was born <span class=\"gap\">___<\/span> 2015.","o":["in","on","at"],"s":"Jahreszahlen stehen mit <b>in<\/b>."},{"type":"txt","q":"Ergänze: The party is <span class=\"gap\">___<\/span> Saturday.","a":["on"],"s":"Wochentage stehen mit <b>on<\/b>."},{"type":"txt","q":"Ergänze: I usually do my homework <span class=\"gap\">___<\/span> the evening.","a":["in"],"s":"Tagesabschnitte: <b>in the morning / afternoon / evening<\/b>."}],"gen":["prep"],"html":"<div class=\"tw\"><table class=\"plain\"><tr><th>Präposition<\/th><th>bei<\/th><th>Beispiele<\/th><\/tr><tr><td>at<\/td><td>Uhrzeit, Zeitpunkt<\/td><td>at six o'clock, at noon, at night, at the weekend<\/td><\/tr><tr><td>on<\/td><td>Tag, Datum<\/td><td>on Monday, on 3rd May, on my birthday, on Friday evening<\/td><\/tr><tr><td>in<\/td><td>Monat, Jahreszeit, Jahr, Tagesabschnitt<\/td><td>in July, in summer, in 2024, in the morning<\/td><\/tr><\/table><\/div>\n<p>Eselsbrücke: Je kleiner der Zeitpunkt, desto „spitzer“ die Präposition – <span class=\"la\">at<\/span> für den Punkt, <span class=\"la\">on<\/span> für den Tag, <span class=\"la\">in<\/span> für den langen Zeitraum.<\/p>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>Vor <span class=\"la\">last, next, this, every<\/span> steht <b>keine<\/b> Präposition: <span class=\"la\">next week, last Monday, every day<\/span>.<\/div>\n<div class=\"note\"><b class=\"lab\">Merke<\/b><span class=\"la\">in the morning<\/span>, aber <span class=\"la\">on Monday morning<\/span>: Sobald ein Tag dabei ist, gewinnt <span class=\"la\">on<\/span>.<\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: in, on oder at?<\/h4><div class=\"task\">Setze ein: <span class=\"la\">We arrived <span class=\"gap\">___<\/span> Sunday morning <span class=\"gap\">___<\/span> nine o'clock <span class=\"gap\">___<\/span> August.<\/span><\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div><b class=\"e\">Kommt ein Tag vor?<\/b> <span class=\"la\">Sunday morning<\/span> → <span class=\"la\">on<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div><b class=\"e\">Uhrzeit?<\/b> <span class=\"la\">nine o'clock<\/span> → <span class=\"la\">at<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div><b class=\"e\">Monat?<\/b> <span class=\"la\">August<\/span> → <span class=\"la\">in<\/span>.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Ergebnis: <span class=\"la\">We arrived on Sunday morning at nine o'clock in August.<\/span><\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"w03","t":"Menschen beschreiben: Familie, Aussehen, Charakter","kl":"6","k":6,"a":"W","tag":"6. Schulstufe","goals":["Du benennst Familienmitglieder.","Du beschreibst Aussehen mit <b>be<\/b> und <b>have got<\/b>.","Du verwendest Adjektive für Charakter und Gefühle."],"ex":[{"type":"mc","q":"My mother's brother is my <span class=\"gap\">___<\/span>.","o":["uncle","nephew","cousin","grandfather"],"s":"Der Bruder der Mutter ist der <b>uncle<\/b>."},{"type":"mc","q":"Her hair <span class=\"gap\">___<\/span> very long.","o":["is","are","have","has got"],"s":"<span class=\"la\">hair<\/span> ist Einzahl: <b>is<\/b>."},{"type":"mc","q":"He <span class=\"gap\">___<\/span> blue eyes and a beard.","o":["has got","is","is got","has be"],"s":"Augen und Bart „hat“ man: <b>has got<\/b>."},{"type":"mc","q":"The lesson was so <span class=\"gap\">___<\/span> that I nearly fell asleep.","o":["boring","bored","bore","boredom"],"s":"Die Stunde selbst war langweilig: <b>boring<\/b>. <span class=\"la\">bored<\/span> wäre das Gefühl der Person."},{"type":"mc","q":"Someone who always shares things with others is <span class=\"gap\">___<\/span>.","o":["generous","stubborn","shy","nervous"],"s":"<b>generous<\/b> = großzügig."},{"type":"mc","q":"Welche Reihenfolge ist richtig?","o":["She has got long straight black hair.","She has got black long straight hair.","She has got straight black long hair.","She has got long black straight hair."],"s":"Reihenfolge: Länge – Art – Farbe."},{"type":"txt","q":"Wie heißt die Tochter deiner Tante auf Englisch?","a":["cousin","my cousin"],"s":"<b>cousin<\/b> gilt für Cousin und Cousine."},{"type":"mc","q":"I'm really <span class=\"gap\">___<\/span> about the school trip tomorrow – I can't wait!","o":["excited","exciting","boring","bored"],"s":"Das eigene Gefühl endet auf -ed: <b>excited<\/b>."}],"gen":[],"html":"<p>Für das Aussehen brauchst du zwei Verben. <b>be<\/b> steht bei Größe, Alter und Figur (<span class=\"la\">She is tall and slim.<\/span>), <b>have got<\/b> bei Haaren, Augen und allem, was man „hat“ (<span class=\"la\">He has got short dark hair and green eyes.<\/span>).<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Bereich<\/th><th>nützliche Wörter<\/th><\/tr><tr><td>Familie<\/td><td>parents, grandparents, aunt, uncle, cousin, nephew (Neffe), niece (Nichte)<\/td><\/tr><tr><td>Aussehen<\/td><td>tall, short, slim, curly, straight, a beard, glasses, freckles (Sommersprossen)<\/td><\/tr><tr><td>Charakter<\/td><td>friendly, shy, funny, generous (großzügig), reliable (verlässlich), stubborn (stur)<\/td><\/tr><tr><td>Gefühle<\/td><td>excited (aufgeregt, voller Vorfreude), nervous, bored, proud, disappointed<\/td><\/tr><\/table><\/div>\n<p>Adjektive stehen in fester Reihenfolge vor dem Nomen: zuerst Länge, dann Art, dann Farbe – <span class=\"la\">long curly brown hair<\/span>.<\/p>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b><b>hair<\/b> ist im Englischen Einzahl: <span class=\"la\">Her hair is long<\/span> – nicht „are“.<\/div>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b><b>bored<\/b> = gelangweilt (so fühle ich mich), <b>boring<\/b> = langweilig (so ist die Sache).<\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Eine Person beschreiben<\/h4><div class=\"task\">Beschreibe: ein großer Mann mit kurzen grauen Haaren und Brille, der freundlich wirkt.<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div><b class=\"e\">Größe und Figur mit be.<\/b> <span class=\"la\">He is tall.<\/span><\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div><b class=\"e\">Haare und Brille.<\/b> <span class=\"la\">He has got short grey hair<\/span> (Länge vor Farbe) und <span class=\"la\">he wears glasses<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div><b class=\"e\">Eindruck.<\/b> <span class=\"la\">look<\/span> + Adjektiv: <span class=\"la\">He looks friendly.<\/span><\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Ergebnis: <span class=\"la\">He is tall and has got short grey hair. He wears glasses and looks friendly.<\/span><\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"w04","t":"Essen, Einkaufen und Geld","kl":"6","k":6,"a":"W","tag":"6. Schulstufe","goals":["Du benennst Lebensmittel und Verpackungen.","Du fragst nach Preisen und Mengen.","Du unterscheidest die Verben rund ums Geld."],"ex":[{"type":"mc","q":"Can I have a <span class=\"gap\">___<\/span> of bread, please?","o":["loaf","bar","carton","bottle"],"s":"Brot kauft man als <b>a loaf of bread<\/b>."},{"type":"mc","q":"I'd like a <span class=\"gap\">___<\/span> of chocolate.","o":["bar","loaf","carton","tin"],"s":"Eine Tafel Schokolade = <b>a bar of chocolate<\/b>."},{"type":"mc","q":"I forgot my pencil case. Can I <span class=\"gap\">___<\/span> a pen from you?","o":["borrow","lend","spend","pay"],"s":"Ich möchte etwas <b>von<\/b> jemandem ausleihen: <b>borrow<\/b>."},{"type":"mc","q":"Could you <span class=\"gap\">___<\/span> me five euros until tomorrow?","o":["lend","borrow","save","cost"],"s":"Du gibst mir etwas leihweise: <b>lend<\/b>."},{"type":"mc","q":"He <span class=\"gap\">___<\/span> all his pocket money on computer games.","o":["spends","pays","costs","buys"],"s":"Geld ausgeben für = <b>spend … on<\/b>."},{"type":"mc","q":"“<span class=\"gap\">___<\/span> are the apples?” – “Two euros a kilo.”","o":["How much","How many","How often","How long"],"s":"Nach dem Preis fragt man mit <b>How much<\/b>."},{"type":"txt","q":"Ergänze die Präposition: Who paid <span class=\"gap\">___<\/span> the pizza?","a":["for"],"s":"<b>pay for<\/b> something – ohne <span class=\"la\">for<\/span> ist der Satz unvollständig."},{"type":"mc","q":"In einem Londoner Imbiss bestellst du Pommes frites. Du sagst:","o":["A portion of chips, please.","A portion of crisps, please.","A portion of pommes, please.","A portion of french, please."],"s":"Im britischen Englisch heißen Pommes frites <b>chips<\/b>."}],"gen":[],"html":"<p>Viele Lebensmittel sind nicht zählbar. Um sie zu zählen, brauchst du eine Verpackung oder Menge: <span class=\"la\">a bottle of water, a carton of milk, a loaf of bread, a bar of chocolate, a slice of cheese, a packet of crisps, a tin of tomatoes<\/span>.<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Verb<\/th><th>Bedeutung<\/th><th>Beispiel<\/th><\/tr><tr><td>cost<\/td><td>kosten<\/td><td>How much does it cost?<\/td><\/tr><tr><td>pay for<\/td><td>bezahlen<\/td><td>I paid for the tickets.<\/td><\/tr><tr><td>spend … on<\/td><td>ausgeben für<\/td><td>She spends a lot on books.<\/td><\/tr><tr><td>save<\/td><td>sparen<\/td><td>I'm saving for a new bike.<\/td><\/tr><tr><td>borrow<\/td><td>sich ausleihen<\/td><td>Can I borrow your pen?<\/td><\/tr><tr><td>lend<\/td><td>herleihen<\/td><td>Can you lend me your pen?<\/td><\/tr><\/table><\/div>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b><b>borrow<\/b> und <b>lend<\/b> sind die zwei Seiten derselben Sache: Ich <span class=\"la\">borrow<\/span> etwas <b>von<\/b> dir, du <span class=\"la\">lendest<\/span> es <b>mir<\/b>.<\/div>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b><span class=\"la\">chips<\/span> sind in Großbritannien Pommes frites; Kartoffelchips heißen dort <span class=\"la\">crisps<\/span>.<\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: borrow oder lend?<\/h4><div class=\"task\">Übersetze: <span class=\"la\">Kannst du mir dein Fahrrad leihen?<\/span><\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div><b class=\"e\">Wer gibt, wer nimmt?<\/b> Du gibst, ich nehme.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div><b class=\"e\">Aus wessen Sicht ist der Satz?<\/b> Subjekt ist <span class=\"la\">du<\/span> – die Person, die gibt → <span class=\"la\">lend<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div><b class=\"e\">Satz bauen.<\/b> <span class=\"la\">Can you lend me …?<\/span><\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Ergebnis: <span class=\"la\">Can you lend me your bike?<\/span> Aus meiner Sicht hieße es: <span class=\"la\">Can I borrow your bike?<\/span><\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"w05","t":"Phrasal verbs für den Alltag","kl":"7","k":7,"a":"W","tag":"7. Schulstufe","goals":["Du verstehst häufige Phrasal verbs.","Du wählst die richtige Partikel.","Du stellst ein Pronomen zwischen Verb und Partikel."],"ex":[{"type":"mc","q":"It's dark in here. Can you <span class=\"gap\">___<\/span> the light, please?","o":["turn on","turn off","put on","pick up"],"s":"Licht einschalten = <b>turn on<\/b>."},{"type":"mc","q":"I can't find my keys. Can you help me <span class=\"gap\">___<\/span> them?","o":["look for","look after","look at","look up to"],"s":"suchen = <b>look for<\/b>."},{"type":"mc","q":"My neighbour <span class=\"gap\">___<\/span> our cat when we are on holiday.","o":["looks after","looks for","looks at","looks out"],"s":"sich kümmern um = <b>look after<\/b>."},{"type":"mc","q":"It's cold outside. <span class=\"gap\">___<\/span> your jacket <span class=\"gap\">___<\/span>.","o":["Put … on","Take … off","Turn … on","Give … up"],"s":"anziehen = <b>put on<\/b>."},{"type":"mc","q":"Welcher Satz ist richtig?","o":["The music is too loud. Turn it down.","The music is too loud. Turn down it.","The music is too loud. It turn down.","The music is too loud. Turn down."],"s":"Ein Pronomen steht zwischen Verb und Partikel: <span class=\"la\">turn it down<\/span>."},{"type":"mc","q":"We've <span class=\"gap\">___<\/span> milk. Can you buy some?","o":["run out of","given up","found out","picked up"],"s":"<span class=\"la\">run out of<\/span> = etwas ist ausgegangen."},{"type":"txt","q":"Ergänze die Partikel: Don't give <span class=\"gap\">___<\/span> – you can do it!","a":["up"],"s":"<b>give up<\/b> = aufgeben."},{"type":"txt","q":"Ergänze die Partikel: I want to find <span class=\"gap\">___<\/span> who wrote this message.","a":["out"],"s":"<b>find out<\/b> = herausfinden."}],"gen":[],"html":"<p>Ein Phrasal verb besteht aus einem Verb und einem kleinen Wort (Partikel). Zusammen haben sie oft eine neue Bedeutung, die man nicht erraten kann.<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Phrasal verb<\/th><th>Bedeutung<\/th><\/tr><tr><td>get up / wake up<\/td><td>aufstehen / aufwachen<\/td><\/tr><tr><td>turn on / turn off<\/td><td>ein- / ausschalten<\/td><\/tr><tr><td>put on / take off<\/td><td>anziehen / ausziehen<\/td><\/tr><tr><td>look for<\/td><td>suchen<\/td><\/tr><tr><td>look after<\/td><td>sich kümmern um<\/td><\/tr><tr><td>find out<\/td><td>herausfinden<\/td><\/tr><tr><td>give up<\/td><td>aufgeben<\/td><\/tr><tr><td>pick up<\/td><td>aufheben, abholen<\/td><\/tr><tr><td>run out of<\/td><td>ausgehen (kein … mehr haben)<\/td><\/tr><\/table><\/div>\n<p>Ist das Objekt ein Pronomen, steht es bei vielen Phrasal verbs <b>zwischen<\/b> Verb und Partikel: <span class=\"la\">Turn it off. Put them on.<\/span> – nicht „Turn off it“.<\/p>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b><b>look for<\/b> = suchen, <b>look at<\/b> = ansehen, <b>look after<\/b> = sich kümmern: Die Partikel entscheidet über die Bedeutung.<\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Wohin mit dem Pronomen?<\/h4><div class=\"task\">Ersetze durch ein Pronomen: <span class=\"la\">Please turn off the TV.<\/span><\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div><b class=\"e\">Objekt finden.<\/b> <span class=\"la\">the TV<\/span> → Pronomen <span class=\"la\">it<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div><b class=\"e\">Stellung.<\/b> Ein Pronomen steht zwischen Verb und Partikel.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div><b class=\"e\">Satz bauen.<\/b> <span class=\"la\">turn<\/span> + <span class=\"la\">it<\/span> + <span class=\"la\">off<\/span>.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Ergebnis: <span class=\"la\">Please turn it off.<\/span> Mit dem Nomen geht beides: <span class=\"la\">turn off the TV<\/span> oder <span class=\"la\">turn the TV off<\/span>.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"w06","t":"False friends: falsche Freunde","kl":"7","k":7,"a":"W","tag":"7. Schulstufe","goals":["Du erkennst englische Wörter, die deutschen Wörtern nur ähnlich sehen.","Du kennst die richtige Übersetzung der häufigsten Fallen.","Du vermeidest typische Übersetzungsfehler."],"ex":[{"type":"mc","q":"Übersetze: <span class=\"la\">Ich habe zum Geburtstag ein Fahrrad bekommen.<\/span>","o":["I got a bike for my birthday.","I became a bike for my birthday.","I become a bike for my birthday.","I was a bike for my birthday."],"s":"bekommen = <b>get<\/b>. <span class=\"la\">become<\/span> heißt „werden“."},{"type":"mc","q":"The <span class=\"gap\">___<\/span> of the restaurant cooks wonderful pasta.","o":["chef","chief","boss","cooker"],"s":"<b>chef<\/b> = Koch. (<span class=\"la\">cooker<\/span> ist der Herd, <span class=\"la\">boss<\/span> der Chef.)"},{"type":"mc","q":"Was bedeutet <span class=\"la\">sensible<\/span> in diesem Satz? <span class=\"la\">That was a sensible decision.<\/span>","o":["vernünftig","sensibel","spürbar","sinnlos"],"s":"<b>sensible<\/b> = vernünftig; „sensibel“ heißt <span class=\"la\">sensitive<\/span>."},{"type":"mc","q":"Übersetze: <span class=\"la\">Hast du mein Handy gesehen?<\/span>","o":["Have you seen my mobile?","Have you seen my handy?","Have you seen my hand?","Have you seen my handle?"],"s":"Handy = <b>mobile (phone)<\/b>; <span class=\"la\">handy<\/span> bedeutet „praktisch“."},{"type":"mc","q":"We waited for an hour and <span class=\"gap\">___<\/span> the bus arrived.","o":["eventually","possibly","maybe","actual"],"s":"<b>eventually<\/b> = schließlich, am Ende."},{"type":"mc","q":"Snow White ate an apple with <span class=\"gap\">___<\/span> in it.","o":["poison","gift","present","medicine"],"s":"das Gift = <b>poison<\/b>; ein <span class=\"la\">gift<\/span> ist ein Geschenk."},{"type":"txt","q":"Übersetze das Wort: She wants to <span class=\"gap\">___<\/span> a doctor. (werden)","a":["become","be"],"s":"werden = <b>become<\/b>."},{"type":"mc","q":"Was ist ein <span class=\"la\">gymnasium<\/span> im Englischen?","o":["eine Turnhalle","eine höhere Schule","ein Sportverein","ein Stadion"],"s":"<b>gymnasium<\/b> (kurz <span class=\"la\">gym<\/span>) = Turnhalle."}],"gen":[],"html":"<p>Falsche Freunde sehen einem deutschen Wort ähnlich, bedeuten aber etwas anderes.<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Englisch<\/th><th>bedeutet<\/th><th>NICHT<\/th><th>das wäre<\/th><\/tr><tr><td>become<\/td><td>werden<\/td><td>bekommen<\/td><td>get<\/td><\/tr><tr><td>gift<\/td><td>Geschenk<\/td><td>Gift<\/td><td>poison<\/td><\/tr><tr><td>chef<\/td><td>Koch, Köchin<\/td><td>Chef<\/td><td>boss<\/td><\/tr><tr><td>also<\/td><td>auch<\/td><td>also<\/td><td>so<\/td><\/tr><tr><td>handy<\/td><td>praktisch<\/td><td>Handy<\/td><td>mobile (phone)<\/td><\/tr><tr><td>gymnasium<\/td><td>Turnhalle<\/td><td>Gymnasium<\/td><td>grammar school<\/td><\/tr><tr><td>sensible<\/td><td>vernünftig<\/td><td>sensibel<\/td><td>sensitive<\/td><\/tr><tr><td>map<\/td><td>Landkarte<\/td><td>Mappe<\/td><td>folder<\/td><\/tr><tr><td>actual<\/td><td>tatsächlich<\/td><td>aktuell<\/td><td>current<\/td><\/tr><tr><td>eventually<\/td><td>schließlich<\/td><td>eventuell<\/td><td>maybe, possibly<\/td><\/tr><\/table><\/div>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>Der Klassiker: „Ich bekomme ein Schnitzel“ – <span class=\"la\">I become a schnitzel<\/span> hieße „Ich werde ein Schnitzel“. Richtig: <span class=\"la\">I'll have / I get …<\/span><\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Einen falschen Freund entlarven<\/h4><div class=\"task\">Übersetze: <span class=\"la\">Mein Chef ist sehr sensibel.<\/span><\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div><b class=\"e\">Verdächtige Wörter markieren.<\/b> <span class=\"la\">Chef<\/span> und <span class=\"la\">sensibel<\/span> haben englische Doppelgänger.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div><b class=\"e\">Bedeutung prüfen.<\/b> <span class=\"la\">chef<\/span> = Koch, <span class=\"la\">sensible<\/span> = vernünftig – beides passt nicht.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div><b class=\"e\">Richtige Wörter einsetzen.<\/b> Chef = <span class=\"la\">boss<\/span>, sensibel = <span class=\"la\">sensitive<\/span>.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Ergebnis: <span class=\"la\">My boss is very sensitive.<\/span><\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"w07","t":"Wortbildung: Vorsilben und Nachsilben","kl":"8","k":8,"a":"W","tag":"8. Schulstufe","goals":["Du bildest Gegenteile mit <b>un-, im-, in-, dis-<\/b>.","Du machst aus Verben Nomen und aus Nomen Adjektive.","Du erkennst die Wortart an der Endung."],"ex":[{"type":"txt","q":"Bilde das Gegenteil: <span class=\"la\">polite<\/span> → <span class=\"gap\">___<\/span>","a":["impolite"],"s":"Vor p steht <b>im-<\/b>."},{"type":"txt","q":"Bilde das Nomen: <span class=\"la\">happy<\/span> → <span class=\"gap\">___<\/span>","a":["happiness"],"s":"-y wird zu -i, dann <b>-ness<\/b>."},{"type":"txt","q":"Bilde das Adjektiv: <span class=\"la\">danger<\/span> → <span class=\"gap\">___<\/span>","a":["dangerous"],"s":"Nomen + <b>-ous<\/b>."},{"type":"mc","q":"Thank you, that was very <span class=\"gap\">___<\/span> of you.","o":["helpful","helpless","helpfully","helper"],"s":"Nach <span class=\"la\">very<\/span> + vor <span class=\"la\">of you<\/span> steht ein Adjektiv mit positiver Bedeutung: <b>helpful<\/b>."},{"type":"mc","q":"We need to make a <span class=\"gap\">___<\/span> soon.","o":["decision","decide","decisive","decided"],"s":"Nach dem Artikel <span class=\"la\">a<\/span> steht ein Nomen: <b>decision<\/b>."},{"type":"mc","q":"I <span class=\"gap\">___<\/span> with you. I think you're wrong.","o":["disagree","unagree","inagree","misagree"],"s":"Das Gegenteil von <span class=\"la\">agree<\/span> bildet man mit <b>dis-<\/b>."},{"type":"mc","q":"Which word is an adjective?","o":["comfortable","comfort","comfortably","discomfort"],"s":"Die Endung <b>-able<\/b> bildet Adjektive."},{"type":"txt","q":"Setze das passende Wort ein: The <span class=\"gap\">___<\/span> of our school are from ten countries. (teach)","a":["teachers"],"s":"Verb + <b>-er<\/b> = Person; wegen <span class=\"la\">are<\/span> in der Mehrzahl."}],"gen":[],"html":"<div class=\"tw\"><table class=\"plain\"><tr><th>Baustein<\/th><th>macht<\/th><th>Beispiele<\/th><\/tr><tr><td>un-, in-, im-, dis-<\/td><td>Gegenteil<\/td><td>unhappy, incorrect, impossible, dislike<\/td><\/tr><tr><td>-er, -or<\/td><td>Person<\/td><td>teacher, visitor<\/td><\/tr><tr><td>-ion, -ment, -ness<\/td><td>Nomen<\/td><td>decision, agreement, happiness<\/td><\/tr><tr><td>-ful / -less<\/td><td>Adjektiv: mit / ohne<\/td><td>careful, careless<\/td><\/tr><tr><td>-able, -ous, -y<\/td><td>Adjektiv<\/td><td>comfortable, dangerous, sunny<\/td><\/tr><tr><td>-ly<\/td><td>Adverb<\/td><td>quickly<\/td><\/tr><\/table><\/div>\n<p>Vor <b>p<\/b> und <b>m<\/b> heißt die Vorsilbe meist <span class=\"la\">im-<\/span> (impossible, impolite), sonst oft <span class=\"la\">un-<\/span> oder <span class=\"la\">in-<\/span>. Welche passt, musst du mit dem Wort mitlernen.<\/p>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>Die Endung <b>-ful<\/b> schreibt man mit einem l (<span class=\"la\">helpful<\/span>), das Adverb dazu mit zwei (<span class=\"la\">helpfully<\/span>).<\/div>\n<div class=\"note t\"><b class=\"lab\">Tipp<\/b>In Wortbildungsaufgaben fragst du zuerst: Welche Wortart fehlt in der Lücke? Vor einem Nomen ein Adjektiv, nach einem Artikel ein Nomen, beim Verb ein Adverb.<\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Welche Wortart fehlt?<\/h4><div class=\"task\">Setze ein: <span class=\"la\">It was a <span class=\"gap\">___<\/span> (wonder) evening, and everybody danced <span class=\"gap\">___<\/span> (happy).<\/span><\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div><b class=\"e\">Erste Lücke.<\/b> Sie steht zwischen Artikel und Nomen → Adjektiv: <span class=\"la\">wonder<\/span> + <span class=\"la\">-ful<\/span> = <span class=\"la\">wonderful<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div><b class=\"e\">Zweite Lücke.<\/b> Sie beschreibt, wie getanzt wurde → Adverb.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div><b class=\"e\">Adverb bilden.<\/b> <span class=\"la\">happy<\/span> → <span class=\"la\">happily<\/span>.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Ergebnis: <span class=\"la\">It was a wonderful evening, and everybody danced happily.<\/span><\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"s01","t":"Classroom English und höfliche Bitten","kl":"5","k":5,"a":"U","tag":"5. Schulstufe","goals":["Du bittest höflich um etwas.","Du verstehst und verwendest typische Sätze im Unterricht.","Du reagierst passend auf Danke und Entschuldigung."],"ex":[{"type":"mc","q":"“Thank you for your help.” – “<span class=\"gap\">___<\/span>”","o":["You're welcome.","Please.","Yes, please.","Here you are."],"s":"Die Antwort auf Dank ist <b>You're welcome.<\/b>"},{"type":"mc","q":"Du reichst jemandem ein Buch. Was sagst du?","o":["Here you are.","Please.","You're welcome.","Thank you."],"s":"Beim Überreichen sagt man <b>Here you are.<\/b>"},{"type":"mc","q":"Du hast die Lehrerin nicht verstanden. Welche Bitte ist höflich und richtig?","o":["Sorry, could you say that again, please?","Sorry, could you say that again me, please?","Sorry, can you repeat you, please?","Sorry, could you saying that again, please?"],"s":"Höflich mit <span class=\"la\">Sorry<\/span>, <span class=\"la\">could you<\/span> und <span class=\"la\">please<\/span>."},{"type":"mc","q":"Du willst wissen, wie „Schere“ auf Englisch heißt.","o":["What's “Schere” in English?","How is “Schere” on English?","What means “Schere” on English?","How calls “Schere” in English?"],"s":"Das feste Muster lautet <b>What's … in English?<\/b>"},{"type":"mc","q":"“I'm sorry I'm late.” – “<span class=\"gap\">___<\/span>”","o":["That's all right.","You're welcome.","Here you are.","Yes, please."],"s":"Auf eine Entschuldigung antwortet man mit <b>That's all right.<\/b> oder <span class=\"la\">No problem.<\/span>"},{"type":"mc","q":"Welche Bitte ist am höflichsten?","o":["Could you help me with this exercise, please?","Help me with this exercise.","You help me with this exercise.","I want help with this exercise."],"s":"<b>Could you …, please?<\/b> ist die höfliche Standardform."},{"type":"txt","q":"Ergänze: What <span class=\"gap\">___<\/span> “library” mean?","a":["does"],"s":"Frage im simple present mit <b>does<\/b>: What does … mean?"},{"type":"txt","q":"Ergänze: <span class=\"gap\">___<\/span> I go to the toilet, please? (dürfen)","a":["Can","May","Could"],"s":"Um Erlaubnis bittet man mit <b>Can I …?<\/b> oder förmlicher <span class=\"la\">May I …?<\/span>"}],"gen":[],"html":"<p>Im Englischen klingt eine Bitte ohne Höflichkeitsform schnell unfreundlich. Diese Muster passen fast immer:<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Du willst …<\/th><th>Du sagst<\/th><\/tr><tr><td>um Erlaubnis bitten<\/td><td>Can I / May I open the window, please?<\/td><\/tr><tr><td>um Hilfe bitten<\/td><td>Could you help me, please?<\/td><\/tr><tr><td>etwas nicht verstanden haben<\/td><td>Sorry, could you say that again, please?<\/td><\/tr><tr><td>ein Wort nicht wissen<\/td><td>What's … in English? / What does … mean?<\/td><\/tr><tr><td>dich bedanken – antworten<\/td><td>Thank you. – You're welcome.<\/td><\/tr><tr><td>dich entschuldigen – antworten<\/td><td>I'm sorry. – That's all right. / No problem.<\/td><\/tr><\/table><\/div>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>Auf <span class=\"la\">Thank you<\/span> antwortet man nicht mit „Please“. „Bitte“ als Antwort heißt <b>You're welcome<\/b>.<\/div>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>Wenn du jemandem etwas gibst, sagst du <b>Here you are<\/b> – ebenfalls nicht „Please“.<\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Aus einem Befehl eine höfliche Bitte machen<\/h4><div class=\"task\">Mache höflich: <span class=\"la\">Open the window.<\/span><\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div><b class=\"e\">Frageform wählen.<\/b> <span class=\"la\">Could you …?<\/span> oder <span class=\"la\">Can you …?<\/span><\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div><b class=\"e\">Verb im Infinitiv anhängen.<\/b> <span class=\"la\">Could you open the wi
