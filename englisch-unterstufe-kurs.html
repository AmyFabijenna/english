<!DOCTYPE html>
<html lang="de">
<head>
<script src="passwort.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Englisch Unterstufe – der komplette Kurs (5.–8. Schulstufe)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f2ec; --card:#ffffff; --ink:#1b1b1f; --muted:#56535d; --line:#e3ddd3;
  --blue:#3a5a8c; --blue-soft:#e7edf6;
  --petrol:#1d6b74; --petrol-soft:#e3eff1;
  --lilac:#5d4a7e; --lilac-soft:#eee9f5;
  --terra:#9c4f3d; --terra-soft:#f6e9e4;
  --gold:#a7843b; --gold-soft:#f6efdf;
  --radius:20px; --shadow:0 6px 24px rgba(40,30,20,.07);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Lexend',system-ui,sans-serif;font-size:18px;line-height:1.75}
h1,h2,h3,h4{line-height:1.3;font-weight:600;margin:0 0 .6em}
h2{font-size:1.75rem} h3{font-size:1.25rem;margin-top:1.5em} h4{font-size:1.05rem}
p{margin:0 0 1em} a{color:var(--blue)}
ul{margin:0 0 1em;padding-left:1.3em} li{margin-bottom:.35em}
.gap{letter-spacing:.04em;color:#8a8490}
.la{font-style:italic;font-weight:500;color:#2c3f63}
.la b.e,b.e{color:var(--terra);font-weight:600}
.note .la,.fb .gap{letter-spacing:.04em;color:#8a8490}
.la{color:inherit}
.big{font-size:1.15rem;line-height:1.9}
.vers{background:var(--bg);border-radius:14px;padding:12px 18px;margin:12px 0;font-size:1.1rem;line-height:2.1;overflow-x:auto;white-space:nowrap}
.vers u{text-decoration:none;border-bottom:3px solid var(--blue);padding-bottom:1px}
.vers s{text-decoration:none;border-bottom:3px dotted var(--terra);padding-bottom:1px}

.topbar{position:sticky;top:0;z-index:60;background:rgba(245,242,236,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 18px}
.topbar .brand{font-weight:600;cursor:pointer;white-space:nowrap}
.topbar .brand small{font-weight:400;color:var(--muted)}
.topbar .grow{flex:1}
.pbar{width:150px;height:10px;background:#e6dfd3;border-radius:99px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--petrol);border-radius:99px;width:0;transition:.4s}
.ptxt{font-size:.85rem;color:var(--muted);white-space:nowrap}
#menuBtn{display:none}

.layout{display:grid;grid-template-columns:320px minmax(0,1fr);max-width:1380px;margin:0 auto}
aside{position:sticky;top:57px;height:calc(100vh - 57px);overflow-y:auto;padding:18px 14px 40px;border-right:1px solid var(--line)}
aside input{width:100%;font:inherit;font-size:.95rem;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:#fff;margin-bottom:10px}
aside h5{margin:16px 6px 6px;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
aside a.ch{display:flex;gap:8px;align-items:center;text-decoration:none;color:var(--ink);padding:7px 10px;border-radius:12px;font-size:.93rem;line-height:1.35}
aside a.ch:hover{background:#fff}
aside a.ch.on{background:#fff;box-shadow:var(--shadow);font-weight:500}
aside a.ch .dot{flex-shrink:0;width:18px;height:18px;border-radius:50%;border:2px solid var(--line);font-size:.7rem;display:grid;place-items:center;color:#fff}
aside a.ch.done .dot{background:var(--petrol);border-color:var(--petrol)}
aside a.ch.part .dot{border-color:var(--gold);background:var(--gold-soft)}
aside a.homelink{display:block;text-decoration:none;color:var(--ink);padding:8px 10px;border-radius:12px;font-weight:500}
aside a.homelink:hover{background:#fff}
main{padding:28px 30px 90px;min-width:0}
.inner{max-width:880px;margin:0 auto}

.hero{background:linear-gradient(135deg,#2f4a75 0%,#1d5d68 50%,#4a3e6b 100%);color:#fff;padding:44px 38px;border-radius:30px;margin-bottom:26px}
.hero h1{font-size:2.3rem;font-weight:700;margin-bottom:.3em}
.hero p{font-size:1.1rem;max-width:720px;opacity:.96;margin-bottom:0}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.chips span{background:rgba(255,255,255,.15);border-radius:999px;padding:6px 14px;font-size:.92rem}

.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:26px 28px;margin-bottom:20px;border:1px solid #efe9df}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.tile{display:block;text-decoration:none;color:var(--ink);background:#fff;border-radius:16px;padding:14px 16px;border:1px solid #efe9df;border-left:6px solid var(--blue);transition:.15s}
.tile:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.tile b{display:block;font-weight:500;line-height:1.35}
.tile small{color:var(--muted)}
.tile.done{background:var(--petrol-soft)}
.cG{--c:var(--blue);--cs:var(--blue-soft)}.cU{--c:var(--petrol);--cs:var(--petrol-soft)}.cW{--c:var(--gold);--cs:var(--gold-soft)}.cT{--c:var(--lilac);--cs:var(--lilac-soft)}.cP{--c:var(--terra);--cs:var(--terra-soft)}
.tile{border-left-color:var(--c)} aside h5{color:var(--c)}
.step3{counter-reset:s}
.step3 .card{position:relative;padding-top:54px;margin:0}
.step3 .card:before{counter-increment:s;content:counter(s);position:absolute;top:16px;left:24px;width:32px;height:32px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:600}

.chead{border-radius:26px;padding:30px 32px;background:var(--cs);border-top:6px solid var(--c);margin-bottom:22px}
.chead h2{margin-bottom:.35em}
.tag{display:inline-block;font-size:.8rem;padding:3px 11px;border-radius:999px;font-weight:500;background:#fff;color:var(--c);margin-right:6px}
.goals{margin:14px 0 0;padding-left:1.2em;font-size:.98rem}
.goals li{margin-bottom:.15em}
.formula{background:var(--bg);border-radius:14px;padding:12px 18px;margin:12px 0;overflow-x:auto}
.note{border-left:5px solid var(--gold);background:var(--gold-soft);padding:14px 18px;border-radius:12px;margin:14px 0}
.note.f{border-color:var(--terra);background:var(--terra-soft)}
.note.t{border-color:var(--petrol);background:var(--petrol-soft)}
.note b.lab{display:block;font-size:.8rem;letter-spacing:.05em;text-transform:uppercase;margin-bottom:2px}
.tw{overflow-x:auto;margin:12px 0}
table.plain{width:100%;border-collapse:separate;border-spacing:0;font-size:.97rem}
table.plain th{background:var(--cs);text-align:left;padding:10px 14px;font-weight:600}
table.plain td{padding:9px 14px;border-bottom:1px solid var(--line);vertical-align:top}
table.plain tr:last-child td{border-bottom:none}
table.plain th:first-child{border-radius:12px 0 0 0}table.plain th:last-child{border-radius:0 12px 0 0}
figure{margin:14px 0;text-align:center}
figure svg{max-width:100%;height:auto;background:#fff;border-radius:16px;border:1px solid var(--line)}
figcaption{font-size:.88rem;color:var(--muted);margin-top:4px}

.walk{background:#fff;border-radius:18px;box-shadow:var(--shadow);padding:22px 26px;margin:20px 0;border:1px solid #efe9df}
.walk h4{color:var(--c);margin-bottom:.3em}
.walk .task{background:var(--bg);border-radius:14px;padding:14px 18px;margin:8px 0 12px}
.wstep{display:none;gap:14px;padding:12px 0;border-top:1px dashed var(--line);animation:fade .35s}
.wstep.show{display:flex}
.wstep .n{flex-shrink:0;width:32px;height:32px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:.9rem;font-weight:600}
.wstep>div:last-child{min-width:0;flex:1}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1}}

button{font-family:inherit;font-size:1rem;border:none;border-radius:14px;padding:10px 20px;cursor:pointer;background:var(--blue);color:#fff;transition:.2s}
button:hover{filter:brightness(1.08)}
button.ghost{background:#fff;color:var(--blue);border:2px solid var(--blue);padding:8px 18px}
button.petrol{background:var(--petrol)} button.lilac{background:var(--lilac)}
button:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}

.ex{background:#fff;border-radius:18px;border:1px solid #efe9df;box-shadow:var(--shadow);padding:20px 24px;margin-bottom:16px}
.ex.ok{border-left:6px solid var(--petrol)}
.ex.no{border-left:6px solid var(--terra)}
.ex .nr{font-size:.82rem;font-weight:600;color:var(--c);letter-spacing:.05em;text-transform:uppercase}
.ex input[type=text]{font:inherit;padding:9px 14px;border-radius:12px;border:2px solid var(--line);width:210px;max-width:100%}
.ex input[type=text]:focus{outline:none;border-color:var(--blue)}
.ex .unit{color:var(--muted);font-size:.95rem}
.opts{display:grid;gap:8px;margin:10px 0}
.opt{display:block;text-align:left;background:var(--bg);color:var(--ink);border:2px solid transparent;border-radius:14px;padding:10px 16px;cursor:pointer;font:inherit;line-height:1.5}
.opt:hover{border-color:var(--blue);filter:none}
.opt.right{background:var(--petrol-soft);border-color:var(--petrol)}
.opt.wrong{background:var(--terra-soft);border-color:var(--terra)}
.fb{margin-top:12px;border-radius:14px;padding:12px 16px;display:none}
.fb.show{display:block;animation:fade .3s}
.fb.good{background:var(--petrol-soft)} .fb.bad{background:var(--terra-soft)} .fb.hint{background:var(--gold-soft)}
.fb b.h{display:block;margin-bottom:2px}
.hintline{font-size:.88rem;color:var(--muted);margin-top:6px}
.navrow{display:flex;justify-content:space-between;gap:12px;margin-top:34px;flex-wrap:wrap}
.score{font-weight:600;color:var(--petrol)}
.phi{background:var(--bg);border-radius:14px;padding:14px 18px;margin:12px 0}
.phi input{font:inherit;width:110px;padding:7px 10px;border-radius:10px;border:2px solid var(--line)}
footer{color:var(--muted);font-size:.85rem;margin-top:50px;text-align:center}

@media(max-width:560px){.ptxt{display:none}}
@media(max-width:980px){
  .layout{grid-template-columns:1fr}
  aside{position:fixed;left:0;top:57px;width:min(330px,88vw);background:var(--bg);z-index:55;transform:translateX(-105%);transition:.25s;box-shadow:0 0 40px rgba(0,0,0,.2)}
  aside.open{transform:none}
  #menuBtn{display:block;padding:7px 14px}
  main{padding:20px 14px 80px}
  .hero{padding:30px 24px}.hero h1{font-size:1.8rem}
  .pbar{width:80px}
  .topbar .brand small{display:none}
  .topbar{gap:8px;padding:8px 12px}.topbar .brand{overflow:hidden;text-overflow:ellipsis;font-size:.95rem}
  #menuBtn{white-space:nowrap;flex-shrink:0}
  .pbar{flex-shrink:0;width:64px}
  .card,.walk,.ex{padding:18px 16px}.chead{padding:22px 18px}
  .ex input[type=text]{width:100%}
  body{font-size:17px}
}
.note .la{color:inherit;letter-spacing:0}
</style>
</head>
<body>
<div class="topbar">
  <button id="menuBtn" class="ghost">☰ Inhalt</button>
  <div class="brand" onclick="location.hash=''">Englisch Unterstufe <small>· der komplette Kurs</small></div>
  <div class="grow"></div>
  <span class="ptxt" id="ptxt"></span><div class="pbar"><i id="pbar"></i></div>
</div>
<div class="layout">
  <aside id="side"></aside>
  <main><div class="inner" id="main"></div></main>
</div>
<script>
const DATA={"chapters":[{"id":"g01","t":"Das Verb to be: am, is, are","kl":"5","k":5,"a":"G","tag":"5. Schulstufe","goals":["Du bildest alle Formen von <b>to be<\/b> in der Gegenwart.","Du verwendest Kurzformen und Verneinungen sicher.","Du bildest Fragen und Kurzantworten mit <b>to be<\/b>."],"ex":[{"type":"mc","q":"My friends <span class=\"gap\">___<\/span> in the garden.","o":["are","is","am","be"],"s":"<span class=\"la\">My friends<\/span> ist Mehrzahl (= they), also steht <b>are<\/b>."},{"type":"mc","q":"My sister and I <span class=\"gap\">___<\/span> in the same class.","o":["are","is","am","be"],"s":"<span class=\"la\">My sister and I<\/span> kannst du durch <b>we<\/b> ersetzen, und zu <span class=\"la\">we<\/span> gehört <b>are<\/b> – auch wenn direkt vor der Lücke <span class=\"la\">I<\/span> steht."},{"type":"mc","q":"“Are you from Austria?” – “Yes, <span class=\"gap\">___<\/span>.”","o":["I am","I'm","I are","I is"],"s":"In der bejahten Kurzantwort steht immer die Langform: <b>Yes, I am.<\/b>"},{"type":"mc","q":"Welche Verneinung ist richtig?","o":["The shop isn't open today.","The shop not is open today.","The shop aren't open today.","The shop no is open today."],"s":"Die Verneinung von <span class=\"la\">is<\/span> lautet <b>isn't<\/b> (is not) und steht dort, wo sonst <span class=\"la\">is<\/span> steht."},{"type":"txt","q":"Ergänze die richtige Form von <span class=\"la\">to be<\/span>: The news <span class=\"gap\">___<\/span> really good today.","a":["is"],"s":"<span class=\"la\">news<\/span> sieht nach Mehrzahl aus, ist im Englischen aber Einzahl: <b>The news is …<\/b>"},{"type":"txt","q":"Bilde die Frage: <span class=\"la\">He is your brother.<\/span> → <span class=\"gap\">___<\/span> ?","a":["Is he your brother"],"s":"Bei der Frage rückt die Form von <span class=\"la\">to be<\/span> an den Satzanfang: <b>Is he your brother?<\/b>"},{"type":"txt","q":"Übersetze: <span class=\"la\">Ich bin dreizehn Jahre alt.<\/span> (Beginne mit „I“.)","a":["I am thirteen","I'm thirteen","I am thirteen years old","I'm thirteen years old","I am 13","I'm 13","I am 13 years old","I'm 13 years old"],"s":"Das Alter gibt man mit <b>to be<\/b> an: <span class=\"la\">I am thirteen (years old).<\/span> Mit <span class=\"la\">have<\/span> wäre der Satz falsch."},{"type":"mc","q":"“<span class=\"gap\">___<\/span> your parents at home?” – “No, they <span class=\"gap\">___<\/span>.”","o":["Are … aren't","Is … isn't","Are … isn't","Is … aren't"],"s":"<span class=\"la\">your parents<\/span> = they, also <b>Are<\/b> in der Frage und <b>aren't<\/b> in der Antwort."}],"gen":["vok"],"html":"<p>Das Verb <b>to be<\/b> (sein) hat in der Gegenwart drei Formen. Welche du brauchst, hängt nur vom Subjekt ab.<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Person<\/th><th>Langform<\/th><th>Kurzform<\/th><th>Verneinung<\/th><\/tr><tr><td>I<\/td><td>am<\/td><td>I'm<\/td><td>I'm not<\/td><\/tr><tr><td>he / she / it<\/td><td>is<\/td><td>he's<\/td><td>he isn't<\/td><\/tr><tr><td>you / we / they<\/td><td>are<\/td><td>we're<\/td><td>we aren't<\/td><\/tr><\/table><\/div>\n<p>Bei einer Frage tauschen Subjekt und Verb den Platz: <span class=\"la\">She is late.<\/span> wird zu <span class=\"la\">Is she late?<\/span> Die Kurzantwort wiederholt nur das Pronomen und die Form von <b>to be<\/b>: <span class=\"la\">Yes, she is.<\/span> / <span class=\"la\">No, she isn't.<\/span><\/p>\n<div class=\"note\"><b class=\"lab\">Merke<\/b>In einer bejahten Kurzantwort gibt es keine Kurzform: <span class=\"la\">Yes, I am.<\/span> – nie „Yes, I'm.“<\/div>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>Im Deutschen sagt man „Ich habe Hunger“ und „Ich bin 12 Jahre alt“. Im Englischen steht beide Male <b>to be<\/b>: <span class=\"la\">I am hungry. I am twelve.<\/span><\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Die richtige Form von to be finden<\/h4><div class=\"task\">Setze ein: <span class=\"la\">My brother and his friend <span class=\"gap\">___<\/span> in the kitchen.<\/span><\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div><b class=\"e\">Subjekt suchen.<\/b> Wer ist in der Küche? <span class=\"la\">My brother and his friend<\/span> – das sind zwei Personen.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div><b class=\"e\">Durch ein Pronomen ersetzen.<\/b> Zwei Personen, über die ich spreche = <span class=\"la\">they<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div><b class=\"e\">Form zuordnen.<\/b> Zu <span class=\"la\">they<\/span> gehört <span class=\"la\">are<\/span>.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Ergebnis: <span class=\"la\">My brother and his friend are in the kitchen.<\/span> Lass dich nicht vom letzten Wort vor der Lücke (<span class=\"la\">friend<\/span>, Einzahl) täuschen – es zählt das ganze Subjekt.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"g02","t":"have got und has got","kl":"5","k":5,"a":"G","tag":"5. Schulstufe","goals":["Du sagst mit <b>have got / has got<\/b>, was jemand besitzt.","Du bildest Fragen, Verneinungen und Kurzantworten.","Du unterscheidest <b>he's<\/b> = he is von <b>he's<\/b> = he has."],"ex":[{"type":"mc","q":"My brother <span class=\"gap\">___<\/span> a new phone.","o":["has got","have got","is got","haves got"],"s":"<span class=\"la\">My brother<\/span> = he, also <b>has got<\/b>."},{"type":"mc","q":"“Have you got a pet?” – “Yes, <span class=\"gap\">___<\/span>.”","o":["I have","I have got","I've","I do have got"],"s":"In der Kurzantwort steht nur <b>have<\/b> – ohne <span class=\"la\">got<\/span> und ohne Kurzform."},{"type":"mc","q":"Wofür steht <span class=\"la\">'s<\/span> in diesem Satz? <span class=\"la\">Emma's got two sisters.<\/span>","o":["has","is","does","us"],"s":"Nach <span class=\"la\">'s<\/span> folgt <b>got<\/b>, also ist es die Kurzform von <b>has<\/b>: Emma has got two sisters."},{"type":"mc","q":"We <span class=\"gap\">___<\/span> any homework today.","o":["haven't got","hasn't got","aren't got","don't got"],"s":"Zu <span class=\"la\">we<\/span> gehört <b>have<\/b>, die Verneinung ist <b>haven't got<\/b>."},{"type":"txt","q":"Ergänze: <span class=\"gap\">___<\/span> your sister got a bike?","a":["Has"],"s":"Die Frage beginnt mit der Form von <span class=\"la\">have<\/span>; <span class=\"la\">your sister<\/span> = she, also <b>Has<\/b>."},{"type":"txt","q":"Verneine: <span class=\"la\">He has got a computer.<\/span> → He <span class=\"gap\">___<\/span> a computer. <b>(Kurzform)<\/b>","a":["hasn't got"],"s":"<b>hasn't got<\/b> = has not got."},{"type":"txt","q":"Ergänze die Kurzantwort: “Has your dad got a car?” – “No, he <span class=\"gap\">___<\/span>.”","a":["hasn't","has not"],"s":"Kurzantwort ohne <span class=\"la\">got<\/span>: <b>No, he hasn't.<\/b>"},{"type":"mc","q":"In welchem Satz bedeutet <span class=\"la\">'s<\/span> „is“?","o":["Tom's very tired today.","Tom's got a cold.","Tom's got three cousins.","Tom's got no time."],"s":"Ohne <span class=\"la\">got<\/span> dahinter und mit einem Adjektiv (<span class=\"la\">tired<\/span>) steht <span class=\"la\">'s<\/span> für <b>is<\/b>."}],"gen":[],"html":"<p>Mit <b>have got<\/b> drückst du Besitz aus. Nur bei <b>he, she, it<\/b> heißt es <b>has got<\/b>.<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Aussage<\/th><th>Verneinung<\/th><th>Frage<\/th><\/tr><tr><td>I have got (I've got) a dog.<\/td><td>I haven't got a dog.<\/td><td>Have you got a dog?<\/td><\/tr><tr><td>She has got (She's got) a cat.<\/td><td>She hasn't got a cat.<\/td><td>Has she got a cat?<\/td><\/tr><\/table><\/div>\n<p>In der Kurzantwort fällt <span class=\"la\">got<\/span> weg: <span class=\"la\">Have you got a pen? – Yes, I have. / No, I haven't.<\/span><\/p>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b><b>She's<\/b> kann zwei Dinge bedeuten. Steht dahinter <span class=\"la\">got<\/span>, ist es <b>she has<\/b>: <span class=\"la\">She's got a bike.<\/span> Sonst meist <b>she is<\/b>: <span class=\"la\">She's happy.<\/span><\/div>\n<div class=\"note t\"><b class=\"lab\">Tipp<\/b><span class=\"la\">I have a dog<\/span> (ohne got) ist genauso richtig. Dann bildest du Frage und Verneinung aber mit <span class=\"la\">do<\/span>: <span class=\"la\">Do you have a dog?<\/span><\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Von der Aussage zur Frage<\/h4><div class=\"task\">Bilde die Frage zu: <span class=\"la\">Your cousin has got a skateboard.<\/span><\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div><b class=\"e\">Hilfsverb finden.<\/b> Das Verb besteht aus <span class=\"la\">has<\/span> und <span class=\"la\">got<\/span>. Das Hilfsverb ist <span class=\"la\">has<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div><b class=\"e\">Umstellen.<\/b> Das Hilfsverb rückt vor das Subjekt: <span class=\"la\">Has your cousin …<\/span><\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div><b class=\"e\">Rest anhängen.<\/b> <span class=\"la\">got a skateboard<\/span> bleibt unverändert.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Ergebnis: <span class=\"la\">Has your cousin got a skateboard?<\/span> – Kurzantwort: <span class=\"la\">Yes, he has.<\/span> / <span class=\"la\">No, he hasn't.<\/span><\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"g03","t":"Pronomen: I, me, my, mine","kl":"5","k":5,"a":"G","tag":"5. Schulstufe","goals":["Du unterscheidest Subjekt- und Objektpronomen.","Du verwendest <b>my, your, his, her, its, our, their<\/b> richtig.","Du kennst <b>mine, yours, hers<\/b> und verwechselst <b>its<\/b> und <b>it's<\/b> nicht."],"ex":[{"type":"mc","q":"This is Anna and this is <span class=\"gap\">___<\/span> brother.","o":["her","his","she","hers"],"s":"Der Besitzer ist Anna (weiblich), also <b>her<\/b> – egal, dass der Bruder männlich ist."},{"type":"mc","q":"Can you help <span class=\"gap\">___<\/span>, please? We are lost.","o":["us","we","our","ours"],"s":"Nach dem Verb <span class=\"la\">help<\/span> steht das Objektpronomen: <b>us<\/b>."},{"type":"mc","q":"The cat is drinking <span class=\"gap\">___<\/span> milk.","o":["its","it's","it","their"],"s":"Besitz bei Tieren und Dingen: <b>its<\/b> ohne Apostroph."},{"type":"mc","q":"“Whose jacket is this?” – “It's <span class=\"gap\">___<\/span>.”","o":["mine","my","me","I"],"s":"Das Pronomen steht allein, ohne Nomen dahinter – also <b>mine<\/b>."},{"type":"mc","q":"My grandparents live in Linz. I visit <span class=\"gap\">___<\/span> every month.","o":["them","they","their","theirs"],"s":"<span class=\"la\">my grandparents<\/span> wird als Objekt zu <b>them<\/b>."},{"type":"txt","q":"Ersetze durch ein Pronomen: <span class=\"la\">Mr Brown<\/span> teaches English. → <span class=\"gap\">___<\/span> teaches English.","a":["He"],"s":"Ein Mann als Subjekt = <b>He<\/b>."},{"type":"txt","q":"Ergänze: We love <span class=\"gap\">___<\/span> new classroom. (unser)","a":["our"],"s":"<b>our<\/b> + Nomen = unser/e."},{"type":"mc","q":"That's not your pen, it's <span class=\"gap\">___<\/span>.","o":["hers","her","she","her's"],"s":"Allein stehend heißt es <b>hers<\/b> – immer ohne Apostroph."}],"gen":[],"html":"<div class=\"tw\"><table class=\"plain\"><tr><th>Subjekt<\/th><th>Objekt<\/th><th>vor dem Nomen<\/th><th>allein stehend<\/th><\/tr><tr><td>I<\/td><td>me<\/td><td>my<\/td><td>mine<\/td><\/tr><tr><td>you<\/td><td>you<\/td><td>your<\/td><td>yours<\/td><\/tr><tr><td>he<\/td><td>him<\/td><td>his<\/td><td>his<\/td><\/tr><tr><td>she<\/td><td>her<\/td><td>her<\/td><td>hers<\/td><\/tr><tr><td>it<\/td><td>it<\/td><td>its<\/td><td>–<\/td><\/tr><tr><td>we<\/td><td>us<\/td><td>our<\/td><td>ours<\/td><\/tr><tr><td>they<\/td><td>them<\/td><td>their<\/td><td>theirs<\/td><\/tr><\/table><\/div>\n<p>Das Subjektpronomen steht vor dem Verb (<span class=\"la\">She likes me.<\/span>), das Objektpronomen nach dem Verb oder nach einer Präposition (<span class=\"la\">Look at them.<\/span>). <span class=\"la\">my, your …<\/span> brauchen immer ein Nomen dahinter (<span class=\"la\">my bag<\/span>), <span class=\"la\">mine, yours …<\/span> stehen allein (<span class=\"la\">The bag is mine.<\/span>).<\/p>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b><b>its<\/b> (ohne Apostroph) zeigt Besitz an: <span class=\"la\">The dog wags its tail.<\/span> <b>it's<\/b> ist die Kurzform von <span class=\"la\">it is<\/span> oder <span class=\"la\">it has<\/span>.<\/div>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b><b>his<\/b> und <b>her<\/b> richten sich nach dem Besitzer, nicht nach dem Ding: Annas Bruder = <span class=\"la\">her brother<\/span>, Pauls Schwester = <span class=\"la\">his sister<\/span>.<\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Das passende Pronomen wählen<\/h4><div class=\"task\">Setze ein: <span class=\"la\">Paul has a sister. <span class=\"gap\">___<\/span> name is Mia. He often helps <span class=\"gap\">___<\/span>.<\/span><\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div><b class=\"e\">Erste Lücke: Was fehlt?<\/b> Vor einem Nomen (<span class=\"la\">name<\/span>) steht ein besitzanzeigendes Wort. Wem gehört der Name? Der Schwester – also <span class=\"la\">her<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div><b class=\"e\">Zweite Lücke: Subjekt oder Objekt?<\/b> Die Lücke steht nach dem Verb <span class=\"la\">helps<\/span>, also brauche ich ein Objektpronomen.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div><b class=\"e\">Form wählen.<\/b> Objektpronomen für <span class=\"la\">she<\/span> ist <span class=\"la\">her<\/span>.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Ergebnis: <span class=\"la\">Her name is Mia. He often helps her.<\/span> Hier sehen beide Formen gleich aus – beim Bruder wären es <span class=\"la\">his name<\/span> und <span class=\"la\">helps him<\/span>.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"g04","t":"Artikel: a, an, the – und this, that, these, those","kl":"5","k":5,"a":"G","tag":"5. Schulstufe","goals":["Du entscheidest zwischen <b>a<\/b> und <b>an<\/b> nach dem Laut.","Du weißt, wann <b>the<\/b> steht und wann kein Artikel steht.","Du zeigst mit <b>this, that, these, those<\/b> auf Dinge."],"ex":[{"type":"mc","q":"She is <span class=\"gap\">___<\/span> honest person.","o":["an","a","the","–"],"s":"Das <span class=\"la\">h<\/span> in <span class=\"la\">honest<\/span> ist stumm, das Wort beginnt mit einem Vokallaut – also <b>an<\/b>."},{"type":"mc","q":"My uncle is <span class=\"gap\">___<\/span> engineer.","o":["an","a","– (kein Artikel)","the"],"s":"Bei Berufen steht im Englischen der unbestimmte Artikel; <span class=\"la\">engineer<\/span> beginnt mit Vokallaut, also <b>an<\/b>."},{"type":"mc","q":"We always have <span class=\"gap\">___<\/span> lunch at one o'clock.","o":["– (kein Artikel)","a","the","an"],"s":"Mahlzeiten stehen ohne Artikel: <span class=\"la\">have lunch<\/span>."},{"type":"mc","q":"I bought a book and a pen. <span class=\"gap\">___<\/span> book was very cheap.","o":["The","A","An","– (kein Artikel)"],"s":"Das Buch wurde schon erwähnt – jetzt ist klar, welches gemeint ist: <b>The book<\/b>."},{"type":"mc","q":"Look at <span class=\"gap\">___<\/span> birds over there on the roof!","o":["those","this","that","these"],"s":"Mehrzahl (<span class=\"la\">birds<\/span>) und weit weg (<span class=\"la\">over there<\/span>): <b>those<\/b>."},{"type":"mc","q":"<span class=\"gap\">___<\/span> shoes I'm wearing are new.","o":["These","This","That","Those"],"s":"Mehrzahl und ganz nah (ich habe sie an): <b>These<\/b>."},{"type":"txt","q":"Ergänze a oder an: It takes <span class=\"gap\">___<\/span> hour to get there.","a":["an"],"s":"<span class=\"la\">hour<\/span> beginnt mit einem Vokallaut (stummes h): <b>an hour<\/b>."},{"type":"mc","q":"Can you play <span class=\"gap\">___<\/span> guitar?","o":["the","a","an","– (kein Artikel)"],"s":"Musikinstrumente stehen nach <span class=\"la\">play<\/span> mit <b>the<\/b>: play the guitar."}],"gen":["aan"],"html":"<p><b>a<\/b> steht vor einem Konsonantenlaut, <b>an<\/b> vor einem Vokallaut. Es zählt, was du hörst: <span class=\"la\">an hour<\/span> (das h ist stumm), aber <span class=\"la\">a uniform<\/span> (man spricht „ju“).<\/p>\n<p><b>the<\/b> verwendest du, wenn klar ist, welche Sache gemeint ist: weil sie schon erwähnt wurde (<span class=\"la\">I saw a dog. The dog was huge.<\/span>) oder weil es nur eine gibt (<span class=\"la\">the sun<\/span>).<\/p>\n<p>Kein Artikel steht, wenn du ganz allgemein sprichst (<span class=\"la\">I like music. Dogs are friendly.<\/span>), und bei Mahlzeiten, Schulfächern und Sportarten (<span class=\"la\">have breakfast, play football<\/span>).<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th><\/th><th>nah<\/th><th>fern<\/th><\/tr><tr><td>Einzahl<\/td><td>this<\/td><td>that<\/td><\/tr><tr><td>Mehrzahl<\/td><td>these<\/td><td>those<\/td><\/tr><\/table><\/div>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>Bei Berufen braucht das Englische den Artikel: <span class=\"la\">My mum is a doctor.<\/span> Bei Musikinstrumenten steht <span class=\"la\">the<\/span>: <span class=\"la\">play the piano<\/span>.<\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: a, an, the oder gar nichts?<\/h4><div class=\"task\">Setze ein: <span class=\"la\">I saw <span class=\"gap\">___<\/span> elephant at <span class=\"gap\">___<\/span> zoo. <span class=\"gap\">___<\/span> elephant was eating <span class=\"gap\">___<\/span> apples.<\/span><\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div><b class=\"e\">Erste Erwähnung, zählbar, Einzahl?<\/b> Der Elefant kommt zum ersten Mal vor → unbestimmter Artikel. <span class=\"la\">elephant<\/span> beginnt mit Vokallaut → <span class=\"la\">an<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div><b class=\"e\">Ist klar, welcher gemeint ist?<\/b> Der Zoo (der, in dem ich war) und der Elefant beim zweiten Mal sind bekannt → <span class=\"la\">the<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div><b class=\"e\">Mehrzahl, allgemein?<\/b> <span class=\"la\">apples<\/span> steht in der Mehrzahl und es ist nicht wichtig, welche → kein Artikel (oder <span class=\"la\">some<\/span>).<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Ergebnis: <span class=\"la\">I saw an elephant at the zoo. The elephant was eating apples.<\/span><\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"g05","t":"Die Mehrzahl der Nomen","kl":"5","k":5,"a":"G","tag":"5. Schulstufe","goals":["Du bildest die regelmäßige Mehrzahl mit <b>-s<\/b> und <b>-es<\/b>.","Du kennst die wichtigsten unregelmäßigen Formen.","Du schreibst Wörter auf <b>-y<\/b> und <b>-f<\/b> in der Mehrzahl richtig."],"ex":[{"type":"txt","q":"Plural: one <span class=\"la\">child<\/span> → two <span class=\"gap\">___<\/span>","a":["children"],"s":"Unregelmäßig: <b>child – children<\/b>."},{"type":"txt","q":"Plural: one <span class=\"la\">story<\/span> → three <span class=\"gap\">___<\/span>","a":["stories"],"s":"Konsonant + y wird zu <b>-ies<\/b>."},{"type":"txt","q":"Plural: one <span class=\"la\">knife<\/span> → two <span class=\"gap\">___<\/span>","a":["knives"],"s":"-fe wird zu <b>-ves<\/b>."},{"type":"mc","q":"Welche Mehrzahl ist richtig?","o":["monkeys","monkies","monkeyes","monkey's"],"s":"Vor dem <span class=\"la\">y<\/span> steht ein Vokal (e), deshalb nur <b>+ s<\/b>."},{"type":"mc","q":"There are three <span class=\"gap\">___<\/span> in the field.","o":["sheep","sheeps","sheepes","shoop"],"s":"<span class=\"la\">sheep<\/span> bleibt in der Mehrzahl gleich."},{"type":"mc","q":"My new jeans <span class=\"gap\">___<\/span> too long.","o":["are","is","am","be"],"s":"<span class=\"la\">jeans<\/span> ist immer Mehrzahl, das Verb also auch: <b>are<\/b>."},{"type":"mc","q":"The dentist looked at all my <span class=\"gap\">___<\/span>.","o":["teeth","tooths","teeths","toothes"],"s":"Unregelmäßig: <b>tooth – teeth<\/b>."},{"type":"txt","q":"Plural: one <span class=\"la\">woman<\/span> → two <span class=\"gap\">___<\/span>","a":["women"],"s":"Unregelmäßig: <b>woman – women<\/b> (gesprochen „wimin“)."}],"gen":["plur"],"html":"<div class=\"tw\"><table class=\"plain\"><tr><th>Regel<\/th><th>Beispiel<\/th><\/tr><tr><td>meist: + s<\/td><td>book → books<\/td><\/tr><tr><td>nach -s, -ss, -sh, -ch, -x: + es<\/td><td>box → boxes, watch → watches<\/td><\/tr><tr><td>Konsonant + y: y → ies<\/td><td>city → cities<\/td><\/tr><tr><td>Vokal + y: nur + s<\/td><td>boy → boys<\/td><\/tr><tr><td>-f / -fe: oft → ves<\/td><td>knife → knives, leaf → leaves<\/td><\/tr><tr><td>einige auf -o: + es<\/td><td>potato → potatoes, tomato → tomatoes<\/td><\/tr><\/table><\/div>\n<p>Unregelmäßig sind: <span class=\"la\">man – men, woman – women, child – children, tooth – teeth, foot – feet, mouse – mice, person – people<\/span>. Gleich bleiben: <span class=\"la\">sheep – sheep, fish – fish<\/span>.<\/p>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>Der Apostroph hat in der Mehrzahl nichts verloren: <span class=\"la\">two photos<\/span>, nicht „two photo's“.<\/div>\n<div class=\"note\"><b class=\"lab\">Merke<\/b>Manche Wörter gibt es nur in der Mehrzahl: <span class=\"la\">trousers, jeans, glasses, scissors<\/span>. Dazu gehört ein Verb in der Mehrzahl: <span class=\"la\">My jeans are new.<\/span><\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Die Mehrzahl in drei Fragen<\/h4><div class=\"task\">Bilde die Mehrzahl von <span class=\"la\">lady<\/span>, <span class=\"la\">key<\/span> und <span class=\"la\">wife<\/span>.<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div><b class=\"e\">Ist das Wort unregelmäßig?<\/b> Nein, keines der drei steht auf der Liste (<span class=\"la\">men, children, feet …<\/span>).<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div><b class=\"e\">Wie endet es?<\/b> <span class=\"la\">lady<\/span>: Konsonant + y → <span class=\"la\">ladies<\/span>. <span class=\"la\">key<\/span>: Vokal + y → nur <span class=\"la\">keys<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div><b class=\"e\">Endet es auf -f oder -fe?<\/b> <span class=\"la\">wife<\/span> → <span class=\"la\">wives<\/span>.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Ergebnis: <span class=\"la\">ladies, keys, wives<\/span>. Die Reihenfolge der Fragen hilft immer: unregelmäßig? – Endung -y? – Endung -f? – sonst einfach -s oder -es.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"g06","t":"Besitz anzeigen: 's-Genitiv und of","kl":"5","k":5,"a":"G","tag":"5. Schulstufe","goals":["Du bildest den 's-Genitiv in Einzahl und Mehrzahl.","Du weißt, wann du lieber <b>of<\/b> verwendest.","Du setzt den Apostroph an die richtige Stelle."],"ex":[{"type":"mc","q":"This is <span class=\"gap\">___<\/span> bike. (Das Fahrrad gehört Tom.)","o":["Tom's","Toms","Toms'","the bike of Tom"],"s":"Ein Besitzer, eine Person: <b>Tom's<\/b>."},{"type":"mc","q":"Mehrere Lehrer haben ein gemeinsames Zimmer. Wie heißt es?","o":["the teachers' room","the teacher's room","the teachers room","the teachers's room"],"s":"Mehrzahl auf -s: Der Apostroph steht <b>nach<\/b> dem s."},{"type":"mc","q":"The <span class=\"gap\">___<\/span> toys are all over the floor.","o":["children's","childrens'","childrens","children"],"s":"<span class=\"la\">children<\/span> ist eine Mehrzahl ohne -s, deshalb <b>'s<\/b>."},{"type":"mc","q":"Was passt am besten?","o":["the roof of the house","the house's roof of","the houses' roof","the roof's house"],"s":"Bei Dingen verwendet man meist <b>of<\/b>."},{"type":"txt","q":"Ergänze: This is my <span class=\"gap\">___<\/span> car. (Das Auto gehört meinen Eltern.) <b>(parents)<\/b>","a":["parents'"],"s":"<span class=\"la\">parents<\/span> ist Mehrzahl auf -s, also nur ein Apostroph: <b>parents'<\/b>."},{"type":"txt","q":"Ergänze: Where is the <span class=\"gap\">___<\/span> bowl? (Der Napf gehört einem Hund.) <b>(dog)<\/b>","a":["dog's"],"s":"Ein Tier als Besitzer: <b>dog's<\/b>."},{"type":"mc","q":"Wie viele Brüder gibt es hier? <span class=\"la\">My brothers' room is small.<\/span>","o":["mehr als einen","genau einen","keinen","das lässt sich nicht sagen"],"s":"Der Apostroph nach dem s zeigt die Mehrzahl: mehrere Brüder teilen ein Zimmer."},{"type":"mc","q":"Have you done <span class=\"gap\">___<\/span> homework?","o":["today's","todays","todays'","the today"],"s":"Zeitangaben bekommen ebenfalls <b>'s<\/b>."}],"gen":[],"html":"<p>Bei Personen und Tieren zeigst du Besitz mit <b>'s<\/b> an: <span class=\"la\">Lisa's bike, the dog's ball<\/span>. Bei Dingen nimmst du meist <b>of<\/b>: <span class=\"la\">the door of the house<\/span>.<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Besitzer<\/th><th>Form<\/th><th>Beispiel<\/th><\/tr><tr><td>Einzahl<\/td><td>+ 's<\/td><td>my sister's room<\/td><\/tr><tr><td>Mehrzahl auf -s<\/td><td>nur + '<\/td><td>my sisters' room (mehrere Schwestern)<\/td><\/tr><tr><td>Mehrzahl ohne -s<\/td><td>+ 's<\/td><td>the children's toys<\/td><\/tr><\/table><\/div>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>Der Apostroph zeigt, wie viele Besitzer es sind: <span class=\"la\">the girl's books<\/span> = ein Mädchen, <span class=\"la\">the girls' books<\/span> = mehrere Mädchen.<\/div>\n<div class=\"note t\"><b class=\"lab\">Tipp<\/b>Auch bei Zeitangaben steht 's: <span class=\"la\">today's homework, a week's holiday<\/span>.<\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Wohin kommt der Apostroph?<\/h4><div class=\"task\">Übersetze: <span class=\"la\">das Zimmer meiner Brüder<\/span> (zwei Brüder teilen ein Zimmer).<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div><b class=\"e\">Wer besitzt?<\/b> Die Brüder – Mehrzahl: <span class=\"la\">my brothers<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div><b class=\"e\">Endet der Besitzer schon auf -s?<\/b> Ja. Dann kommt nur ein Apostroph dazu, kein weiteres s.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div><b class=\"e\">Besitz anhängen.<\/b> Danach folgt das, was ihnen gehört: <span class=\"la\">room<\/span>.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Ergebnis: <span class=\"la\">my brothers' room<\/span>. Bei nur einem Bruder: <span class=\"la\">my brother's room<\/span>.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"g07","t":"there is, there are und Präpositionen des Ortes","kl":"5","k":5,"a":"G","tag":"5. Schulstufe","goals":["Du sagst mit <b>there is / there are<\/b>, was es wo gibt.","Du bildest Fragen und Verneinungen dazu.","Du verwendest <b>in, on, under, next to, behind, in front of, between, opposite<\/b>."],"ex":[{"type":"mc","q":"<span class=\"gap\">___<\/span> a big park in our town.","o":["There is","There are","It gives","It is giving"],"s":"<span class=\"la\">a big park<\/span> ist Einzahl: <b>There is<\/b>."},{"type":"mc","q":"<span class=\"gap\">___<\/span> any shops near your school?","o":["Are there","Is there","There are","Are they"],"s":"Frage + Mehrzahl (<span class=\"la\">shops<\/span>): <b>Are there …?<\/b>"},{"type":"mc","q":"The bus stop is <span class=\"gap\">___<\/span> the cinema. (vor dem Kino)","o":["in front of","before","opposite","between"],"s":"„vor“ als Ort = <b>in front of<\/b>. <span class=\"la\">opposite<\/span> wäre „gegenüber“."},{"type":"mc","q":"The bank is <span class=\"gap\">___<\/span> the post office and the bakery.","o":["between","next","behind of","among to"],"s":"Zwischen zwei Dingen = <b>between … and …<\/b>"},{"type":"mc","q":"Welcher Satz ist richtig?","o":["There is a sofa and two armchairs in the room.","There are a sofa and two armchairs in the room.","It is a sofa and two armchairs in the room.","They are a sofa and two armchairs in the room."],"s":"Es zählt das erste Nomen nach <span class=\"la\">there<\/span>: <span class=\"la\">a sofa<\/span> ist Einzahl, also <b>There is<\/b>."},{"type":"txt","q":"Verneine: <span class=\"la\">There are some books on the shelf.<\/span> → There <span class=\"gap\">___<\/span> any books on the shelf. <b>(Kurzform)<\/b>","a":["aren't"],"s":"Verneinung der Mehrzahl: <b>There aren't any …<\/b>"},{"type":"txt","q":"Ergänze die Kurzantwort: “Is there a library here?” – “Yes, there <span class=\"gap\">___<\/span>.”","a":["is"],"s":"Die Kurzantwort wiederholt <span class=\"la\">there<\/span> und das Verb: <b>Yes, there is.<\/b>"},{"type":"mc","q":"My school bag is <span class=\"gap\">___<\/span> the table – on the floor.","o":["under","on","between","opposite"],"s":"Auf dem Boden, also <b>under<\/b> dem Tisch."}],"gen":[],"html":"<p><b>There is<\/b> steht vor einem Nomen in der Einzahl, <b>there are<\/b> vor der Mehrzahl. Es zählt das erste Nomen: <span class=\"la\">There is a desk and two chairs.<\/span><\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th><\/th><th>Einzahl<\/th><th>Mehrzahl<\/th><\/tr><tr><td>Aussage<\/td><td>There is (There's) a park.<\/td><td>There are two parks.<\/td><\/tr><tr><td>Verneinung<\/td><td>There isn't a park.<\/td><td>There aren't any parks.<\/td><\/tr><tr><td>Frage<\/td><td>Is there a park?<\/td><td>Are there any parks?<\/td><\/tr><\/table><\/div>\n<p>Wichtige Ortsangaben: <span class=\"la\">in<\/span> (in), <span class=\"la\">on<\/span> (auf), <span class=\"la\">under<\/span> (unter), <span class=\"la\">next to<\/span> (neben), <span class=\"la\">behind<\/span> (hinter), <span class=\"la\">in front of<\/span> (vor), <span class=\"la\">between<\/span> (zwischen zwei), <span class=\"la\">opposite<\/span> (gegenüber).<\/p>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>„Es gibt“ heißt nicht „it gives“, sondern <b>there is / there are<\/b>.<\/div>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>„vor dem Haus“ (Ort) = <span class=\"la\">in front of the house<\/span>. Das Wort <span class=\"la\">before<\/span> verwendet man fast nur für die Zeit.<\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Ein Zimmer beschreiben<\/h4><div class=\"task\">Beschreibe: Im Zimmer stehen ein Bett und zwei Regale. Die Lampe steht neben dem Bett.<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div><b class=\"e\">Es gibt …<\/b> → <span class=\"la\">There is / There are<\/span>. Das erste Nomen ist <span class=\"la\">a bed<\/span> (Einzahl) → <span class=\"la\">There is<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div><b class=\"e\">Aufzählung anhängen.<\/b> <span class=\"la\">There is a bed and two shelves in the room.<\/span><\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div><b class=\"e\">Ortsangabe wählen.<\/b> „neben“ = <span class=\"la\">next to<\/span>.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Ergebnis: <span class=\"la\">There is a bed and two shelves in the room. The lamp is next to the bed.<\/span><\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"g08","t":"Simple present: Aussagen","kl":"5","k":5,"a":"G","tag":"5. Schulstufe","goals":["Du verwendest das simple present für Gewohnheiten und Tatsachen.","Du denkst an das <b>-s<\/b> bei <b>he, she, it<\/b>.","Du stellst Häufigkeitswörter wie <b>always<\/b> und <b>never<\/b> an die richtige Stelle."],"ex":[{"type":"mc","q":"My dad <span class=\"gap\">___<\/span> to work by train every day.","o":["goes","go","going","is go"],"s":"<span class=\"la\">My dad<\/span> = he; <span class=\"la\">go<\/span> endet auf -o, also <b>goes<\/b>."},{"type":"mc","q":"My friends and I <span class=\"gap\">___<\/span> football on Saturdays.","o":["play","plays","playing","are play"],"s":"<span class=\"la\">My friends and I<\/span> = we, also ohne -s: <b>play<\/b>."},{"type":"mc","q":"Welcher Satz hat die richtige Wortstellung?","o":["She always does her homework.","She does always her homework.","Always she does her homework.","She does her homework always."],"s":"Das Häufigkeitswort steht direkt <b>vor<\/b> dem Vollverb: <span class=\"la\">always does<\/span>."},{"type":"mc","q":"Welcher Satz ist richtig?","o":["He is never late for school.","He never is late for school.","He is late never for school.","Never he is late for school."],"s":"Bei <span class=\"la\">to be<\/span> steht das Häufigkeitswort <b>nach<\/b> dem Verb: <span class=\"la\">is never<\/span>."},{"type":"txt","q":"Setze ein: Lisa <span class=\"gap\">___<\/span> English every evening. (study)","a":["studies"],"s":"Konsonant + y wird zu <b>-ies<\/b>: studies."},{"type":"txt","q":"Setze ein: My brother <span class=\"gap\">___<\/span> a lot of TV. (watch)","a":["watches"],"s":"Nach -ch kommt <b>-es<\/b>: watches."},{"type":"txt","q":"Setze ein: Our cat <span class=\"gap\">___<\/span> a white tail. (have)","a":["has"],"s":"<span class=\"la\">have<\/span> ist unregelmäßig: he / she / it <b>has<\/b>."},{"type":"mc","q":"The sun <span class=\"gap\">___<\/span> in the east.","o":["rises","rise","is rise","rising"],"s":"Eine Tatsache, die immer gilt, steht im simple present; <span class=\"la\">the sun<\/span> = it, also <b>rises<\/b>."}],"gen":["s3"],"html":"<p>Das simple present beschreibt, was regelmäßig passiert oder immer gilt: <span class=\"la\">I get up at seven. Water boils at 100 degrees.<\/span> Signalwörter sind <span class=\"la\">always, usually, often, sometimes, never, every day, on Mondays<\/span>.<\/p>\n<p>Die Form ist der Infinitiv – nur bei <b>he, she, it<\/b> kommt ein <b>-s<\/b> dazu: <span class=\"la\">I play – she plays<\/span>.<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Endung des Verbs<\/th><th>he / she / it<\/th><th>Beispiel<\/th><\/tr><tr><td>normal<\/td><td>+ s<\/td><td>works, reads<\/td><\/tr><tr><td>-s, -sh, -ch, -x, -o<\/td><td>+ es<\/td><td>watches, goes<\/td><\/tr><tr><td>Konsonant + y<\/td><td>y → ies<\/td><td>studies, tries<\/td><\/tr><tr><td>unregelmäßig<\/td><td>| have → has<\/td><\/tr><\/table><\/div>\n<div class=\"note\"><b class=\"lab\">Merke<\/b>Merkspruch: <b>He, she, it – das s muss mit.<\/b><\/div>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>Häufigkeitswörter stehen <b>vor<\/b> dem Vollverb, aber <b>nach<\/b> <span class=\"la\">to be<\/span>: <span class=\"la\">She often reads. She is often late.<\/span><\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Braucht das Verb ein -s?<\/h4><div class=\"task\">Setze ein: <span class=\"la\">My best friend <span class=\"gap\">___<\/span> (watch) films every weekend.<\/span><\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div><b class=\"e\">Zeit bestimmen.<\/b> <span class=\"la\">every weekend<\/span> = Gewohnheit → simple present.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div><b class=\"e\">Subjekt prüfen.<\/b> <span class=\"la\">My best friend<\/span> = he oder she → das Verb braucht eine Endung.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div><b class=\"e\">Endung wählen.<\/b> <span class=\"la\">watch<\/span> endet auf -ch → <span class=\"la\">-es<\/span>.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Ergebnis: <span class=\"la\">My best friend watches films every weekend.<\/span><\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"g09","t":"Simple present: Fragen und Verneinung mit do und does","kl":"5","k":5,"a":"G","tag":"5. Schulstufe","goals":["Du bildest Fragen mit <b>do<\/b> und <b>does<\/b>.","Du verneinst mit <b>don't<\/b> und <b>doesn't<\/b>.","Du weißt, dass das Verb nach <b>does<\/b> kein <b>-s<\/b> mehr hat."],"ex":[{"type":"mc","q":"<span class=\"gap\">___<\/span> your sister play the piano?","o":["Does","Do","Is","Has"],"s":"<span class=\"la\">your sister<\/span> = she, also <b>Does<\/b>."},{"type":"mc","q":"He doesn't <span class=\"gap\">___<\/span> in Vienna.","o":["live","lives","living","lived"],"s":"Nach <span class=\"la\">doesn't<\/span> steht der Infinitiv ohne -s: <b>live<\/b>."},{"type":"mc","q":"“Do your parents speak English?” – “Yes, <span class=\"gap\">___<\/span>.”","o":["they do","they speak","they does","they are"],"s":"Die Kurzantwort wiederholt das Hilfsverb: <b>Yes, they do.<\/b>"},{"type":"mc","q":"Welche Frage ist richtig?","o":["Where does your uncle work?","Where your uncle works?","Where do your uncle work?","Where does your uncle works?"],"s":"Fragewort + <b>does<\/b> + Subjekt + Infinitiv."},{"type":"txt","q":"Verneine: <span class=\"la\">I like spinach.<\/span> → I <span class=\"gap\">___<\/span> spinach. <b>(Kurzform)<\/b>","a":["don't like"],"s":"Bei <span class=\"la\">I<\/span> verneint man mit <b>don't<\/b> + Infinitiv."},{"type":"txt","q":"Verneine: <span class=\"la\">Tom gets up early.<\/span> → Tom <span class=\"gap\">___<\/span> early. <b>(Kurzform)<\/b>","a":["doesn't get up"],"s":"<b>doesn't<\/b> + Infinitiv: Das -s von <span class=\"la\">gets<\/span> verschwindet."},{"type":"txt","q":"Bilde die Frage: <span class=\"la\">They walk to school.<\/span> → <span class=\"gap\">___<\/span> to school?","a":["Do they walk"],"s":"Bei <span class=\"la\">they<\/span> steht <b>Do<\/b> + Subjekt + Infinitiv."},{"type":"mc","q":"Welche Frage braucht KEIN do / does?","o":["<span class=\"gap\">___<\/span> you hungry?","<span class=\"gap\">___<\/span> you like pizza?","<span class=\"gap\">___<\/span> she live here?","<span class=\"gap\">___<\/span> they play tennis?"],"s":"Mit <span class=\"la\">hungry<\/span> brauchst du <span class=\"la\">to be<\/span>: <b>Are you hungry?<\/b> Bei <span class=\"la\">to be<\/span> gibt es kein do."}],"gen":[],"html":"<p>Für Fragen und Verneinungen brauchst du das Hilfsverb <b>do<\/b>. Bei <b>he, she, it<\/b> heißt es <b>does<\/b> – und dann steht das Vollverb wieder im Infinitiv, denn das -s steckt schon in <span class=\"la\">does<\/span>.<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th><\/th><th>I / you / we / they<\/th><th>he / she / it<\/th><\/tr><tr><td>Verneinung<\/td><td>I don't like fish.<\/td><td>She doesn't like fish.<\/td><\/tr><tr><td>Frage<\/td><td>Do you like fish?<\/td><td>Does she like fish?<\/td><\/tr><tr><td>Kurzantwort<\/td><td>Yes, I do. / No, I don't.<\/td><td>Yes, she does. / No, she doesn't.<\/td><\/tr><\/table><\/div>\n<p>Fragewörter stehen ganz vorne: <span class=\"la\">Where do you live? What does he want?<\/span><\/p>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>Zwei -s sind eines zu viel: <span class=\"la\">Does she like …?<\/span> – nicht „Does she likes …?“<\/div>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>Bei <span class=\"la\">to be<\/span> und <span class=\"la\">have got<\/span> brauchst du kein <span class=\"la\">do<\/span>: <span class=\"la\">Are you tired? Have you got a pen?<\/span><\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Eine Frage mit does bauen<\/h4><div class=\"task\">Frage nach dem hervorgehobenen Teil: <span class=\"la\">Anna lives <b>in Salzburg<\/b>.<\/span><\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div><b class=\"e\">Fragewort wählen.<\/b> Gefragt ist nach einem Ort → <span class=\"la\">Where<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div><b class=\"e\">Hilfsverb wählen.<\/b> <span class=\"la\">Anna<\/span> = she → <span class=\"la\">does<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div><b class=\"e\">Vollverb in den Infinitiv setzen.<\/b> Aus <span class=\"la\">lives<\/span> wird <span class=\"la\">live<\/span>, weil das -s schon in <span class=\"la\">does<\/span> steckt.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Ergebnis: <span class=\"la\">Where does Anna live?<\/span><\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"g10","t":"Present progressive: Was passiert gerade?","kl":"5","k":5,"a":"G","tag":"5. Schulstufe","goals":["Du bildest das present progressive mit <b>am / is / are<\/b> + <b>-ing<\/b>.","Du schreibst die <b>-ing<\/b>-Form richtig.","Du bildest Fragen und Verneinungen."],"ex":[{"type":"mc","q":"Listen! Somebody <span class=\"gap\">___<\/span> at the door.","o":["is knocking","knocks","knocking","are knocking"],"s":"<span class=\"la\">Listen!<\/span> zeigt: Es passiert gerade. <span class=\"la\">Somebody<\/span> ist Einzahl, also <b>is knocking<\/b>."},{"type":"mc","q":"The children <span class=\"gap\">___<\/span> in the garden at the moment.","o":["are playing","is playing","play","plays"],"s":"<span class=\"la\">at the moment<\/span> + Mehrzahl: <b>are playing<\/b>."},{"type":"mc","q":"Welche Frage ist richtig?","o":["What are you doing?","What do you doing?","What you are doing?","What are you do?"],"s":"Fragewort + <b>are<\/b> + Subjekt + <b>-ing<\/b>-Form."},{"type":"txt","q":"-ing-Form von <span class=\"la\">swim<\/span>:","a":["swimming"],"s":"Kurzer Vokal + ein Konsonant: Das <span class=\"la\">m<\/span> wird verdoppelt."},{"type":"txt","q":"-ing-Form von <span class=\"la\">make<\/span>:","a":["making"],"s":"Das stumme -e fällt weg."},{"type":"txt","q":"Setze ein: Look! The dog <span class=\"gap\">___<\/span> in the mud. (lie)","a":["is lying","'s lying"],"s":"-ie wird zu -y: <b>is lying<\/b>."},{"type":"mc","q":"I <span class=\"gap\">___<\/span> TV right now, I'm doing my homework.","o":["'m not watching","don't watching","not watching","isn't watching"],"s":"Verneinung: <b>am not<\/b> + -ing-Form. Zu <span class=\"la\">I<\/span> gehört <span class=\"la\">am<\/span>."},{"type":"mc","q":"“Is your mum working today?” – “No, <span class=\"gap\">___<\/span>.”","o":["she isn't","she doesn't","she not","she aren't"],"s":"Die Kurzantwort wiederholt die Form von <span class=\"la\">to be<\/span>: <b>No, she isn't.<\/b>"}],"gen":["ing"],"html":"<p>Das present progressive beschreibt, was <b>jetzt gerade<\/b> passiert: <span class=\"la\">Look! It is raining.<\/span> Signalwörter sind <span class=\"la\">now, at the moment, right now, Look!, Listen!<\/span><\/p>\n<p>Du brauchst zwei Teile: eine Form von <b>to be<\/b> und das Verb mit <b>-ing<\/b>.<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Regel für -ing<\/th><th>Beispiel<\/th><\/tr><tr><td>normal: + ing<\/td><td>read → reading<\/td><\/tr><tr><td>stummes -e fällt weg<\/td><td>write → writing<\/td><\/tr><tr><td>kurzer betonter Vokal + Konsonant: verdoppeln<\/td><td>run → running, sit → sitting<\/td><\/tr><tr><td>-ie wird zu -y<\/td><td>lie → lying<\/td><\/tr><\/table><\/div>\n<p>Frage: <span class=\"la\">Are you listening?<\/span> Verneinung: <span class=\"la\">She isn't sleeping.<\/span><\/p>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>Ohne <span class=\"la\">to be<\/span> ist die Zeit unvollständig: <span class=\"la\">She is reading<\/span> – nicht „She reading“.<\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Eine -ing-Form richtig schreiben<\/h4><div class=\"task\">Setze ein: <span class=\"la\">Look! Tom <span class=\"gap\">___<\/span> (sit) on the wall and <span class=\"gap\">___<\/span> (write) a message.<\/span><\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div><b class=\"e\">Zeit bestimmen.<\/b> <span class=\"la\">Look!<\/span> → es passiert gerade → present progressive: <span class=\"la\">is<\/span> + -ing.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div><b class=\"e\">sit:<\/b> kurzer Vokal + ein Konsonant → verdoppeln: <span class=\"la\">sitting<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div><b class=\"e\">write:<\/b> endet auf stummes -e → das e fällt weg: <span class=\"la\">writing<\/span>.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Ergebnis: <span class=\"la\">Tom is sitting on the wall and writing a message.<\/span> Das <span class=\"la\">is<\/span> muss beim zweiten Verb nicht wiederholt werden.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"g11","t":"Simple present oder present progressive?","kl":"6","k":6,"a":"G","tag":"6. Schulstufe","goals":["Du entscheidest anhand der Signalwörter zwischen den beiden Zeiten.","Du unterscheidest Gewohnheit und Moment.","Du kennst Verben, die fast nie in der -ing-Zeit stehen."],"ex":[{"type":"mc","q":"My mum usually <span class=\"gap\">___<\/span> to work, but today she <span class=\"gap\">___<\/span> the bus.","o":["drives … is taking","is driving … takes","drives … takes","is driving … is taking"],"s":"<span class=\"la\">usually<\/span> = Gewohnheit (simple present), <span class=\"la\">today<\/span> = Ausnahme im Moment (present progressive)."},{"type":"mc","q":"Be quiet, please! The baby <span class=\"gap\">___<\/span>.","o":["is sleeping","sleeps","sleep","sleeping"],"s":"Es geht um diesen Moment: <b>is sleeping<\/b>."},{"type":"mc","q":"I <span class=\"gap\">___<\/span> this song – who is the singer?","o":["like","am liking","liking","does like"],"s":"<span class=\"la\">like<\/span> ist ein Zustandsverb und steht nicht in der -ing-Zeit."},{"type":"mc","q":"We <span class=\"gap\">___<\/span> to the cinema every Saturday.","o":["go","are going","goes","going"],"s":"<span class=\"la\">every Saturday<\/span> = Gewohnheit: simple present."},{"type":"mc","q":"Why <span class=\"gap\">___<\/span> ? Did something happen?","o":["are you crying","do you cry","you are crying","you cry"],"s":"Die Frage bezieht sich auf jetzt: present progressive, mit Umstellung in der Frage."},{"type":"txt","q":"Setze ein: Look! It <span class=\"gap\">___<\/span> . (snow)","a":["is snowing","'s snowing"],"s":"<span class=\"la\">Look!<\/span> zeigt den Moment an: <b>is snowing<\/b>."},{"type":"txt","q":"Setze ein: Water <span class=\"gap\">___<\/span> at 0 degrees. (freeze)","a":["freezes"],"s":"Eine Tatsache steht im simple present; <span class=\"la\">water<\/span> = it, also mit -s."},{"type":"mc","q":"Sorry, I <span class=\"gap\">___<\/span> what you mean.","o":["don't understand","am not understanding","not understand","doesn't understand"],"s":"<span class=\"la\">understand<\/span> ist ein Zustandsverb: simple present, verneint mit <b>don't<\/b>."}],"gen":[],"html":"<div class=\"tw\"><table class=\"plain\"><tr><th><\/th><th>Simple present<\/th><th>Present progressive<\/th><\/tr><tr><td>Bedeutung<\/td><td>regelmäßig, immer, Tatsache<\/td><td>jetzt gerade, im Moment<\/td><\/tr><tr><td>Signalwörter<\/td><td>always, often, usually, every day, never<\/td><td>now, at the moment, Look!, today<\/td><\/tr><tr><td>Beispiel<\/td><td>She plays tennis on Fridays.<\/td><td>She is playing tennis now.<\/td><\/tr><\/table><\/div>\n<p>Manche Verben beschreiben keinen Vorgang, sondern einen Zustand. Sie stehen im simple present, auch wenn es um jetzt geht: <span class=\"la\">like, love, hate, want, need, know, understand, believe, belong<\/span>.<\/p>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b><span class=\"la\">I am knowing<\/span> gibt es nicht. Richtig: <span class=\"la\">I know the answer.<\/span><\/div>\n<div class=\"note t\"><b class=\"lab\">Tipp<\/b>Frage dich: Könnte ich „gerade“ dazusagen? Dann progressive. Könnte ich „normalerweise“ dazusagen? Dann simple.<\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Gewohnheit oder Moment?<\/h4><div class=\"task\">Setze ein: <span class=\"la\">Ben usually <span class=\"gap\">___<\/span> (walk) to school, but this week he <span class=\"gap\">___<\/span> (take) the bus.<\/span><\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div><b class=\"e\">Signalwörter markieren.<\/b> <span class=\"la\">usually<\/span> und <span class=\"la\">this week<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div><b class=\"e\">Erste Lücke.<\/b> <span class=\"la\">usually<\/span> = Gewohnheit → simple present, <span class=\"la\">Ben<\/span> = he → <span class=\"la\">walks<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div><b class=\"e\">Zweite Lücke.<\/b> <span class=\"la\">this week<\/span> = vorübergehend, jetzt → present progressive: <span class=\"la\">is taking<\/span> (das e von <span class=\"la\">take<\/span> fällt weg).<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Ergebnis: <span class=\"la\">Ben usually walks to school, but this week he is taking the bus.<\/span><\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"g12","t":"Modalverben: can, must, mustn't, needn't, should","kl":"6","k":6,"a":"G","tag":"6. Schulstufe","goals":["Du drückst Fähigkeit, Erlaubnis, Pflicht und Rat aus.","Du unterscheidest <b>mustn't<\/b> (Verbot) und <b>needn't<\/b> (nicht nötig).","Du weißt, dass nach einem Modalverb der Infinitiv ohne <b>to<\/b> steht."],"ex":[{"type":"mc","q":"You <span class=\"gap\">___<\/span> touch that wire – it's dangerous!","o":["mustn't","needn't","don't have to","must"],"s":"Ein Verbot wegen Gefahr: <b>mustn't<\/b> = darfst nicht."},{"type":"mc","q":"It's Sunday tomorrow, so you <span class=\"gap\">___<\/span> get up early.","o":["needn't","mustn't","can't","must"],"s":"Es ist nicht nötig – <b>needn't<\/b>. Mit <span class=\"la\">mustn't<\/span> wäre es verboten, früh aufzustehen."},{"type":"mc","q":"My little sister <span class=\"gap\">___<\/span> ride a bike. She's only two.","o":["can't","mustn't","needn't","shouldn't"],"s":"Es fehlt die Fähigkeit: <b>can't<\/b>."},{"type":"mc","q":"You look tired. You <span class=\"gap\">___<\/span> go to bed earlier.","o":["should","mustn't","can't","needn't"],"s":"Ein Rat: <b>should<\/b>."},{"type":"mc","q":"Welcher Satz ist richtig?","o":["He can speak three languages.","He cans speak three languages.","He can to speak three languages.","He can speaks three languages."],"s":"Kein -s am Modalverb, kein <span class=\"la\">to<\/span>, Vollverb im Infinitiv."},{"type":"txt","q":"Übersetze das Modalverb: Yesterday we <span class=\"gap\">___<\/span> tidy our rooms. (mussten)","a":["had to"],"s":"Die Vergangenheit von <span class=\"la\">must<\/span> ist <b>had to<\/b>."},{"type":"txt","q":"Ergänze: When I was five, I <span class=\"gap\">___<\/span> already read. (konnte)","a":["could"],"s":"Die Vergangenheit von <span class=\"la\">can<\/span> ist <b>could<\/b>."},{"type":"mc","q":"Auf einem Schild im Museum steht: <span class=\"la\">Visitors <span class=\"gap\">___<\/span> take photos.<\/span> (Fotografieren verboten)","o":["mustn't","needn't","don't have to","should"],"s":"Ein Verbot wird mit <b>mustn't<\/b> ausgedrückt."}],"gen":[],"html":"<div class=\"tw\"><table class=\"plain\"><tr><th>Modalverb<\/th><th>Bedeutung<\/th><th>Beispiel<\/th><\/tr><tr><td>can / can't<\/td><td>können, dürfen<\/td><td>I can swim. Can I go now?<\/td><\/tr><tr><td>must<\/td><td>müssen<\/td><td>You must wear a helmet.<\/td><\/tr><tr><td>mustn't<\/td><td>nicht dürfen (Verbot)<\/td><td>You mustn't run here.<\/td><\/tr><tr><td>needn't / don't have to<\/td><td>nicht müssen<\/td><td>You needn't hurry.<\/td><\/tr><tr><td>should / shouldn't<\/td><td>sollte / sollte nicht<\/td><td>You should sleep more.<\/td><\/tr><\/table><\/div>\n<p>Modalverben haben in allen Personen dieselbe Form – kein -s bei <span class=\"la\">he, she, it<\/span>. Danach steht der Infinitiv ohne <span class=\"la\">to<\/span>: <span class=\"la\">She can dance.<\/span><\/p>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b><b>mustn't<\/b> sieht aus wie „muss nicht“, bedeutet aber <b>darf nicht<\/b>. „Du musst nicht“ heißt <span class=\"la\">you needn't<\/span> oder <span class=\"la\">you don't have to<\/span>.<\/div>\n<div class=\"note\"><b class=\"lab\">Merke<\/b>In der Vergangenheit: <span class=\"la\">could<\/span> (konnte) und <span class=\"la\">had to<\/span> (musste).<\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Das richtige Modalverb finden<\/h4><div class=\"task\">Übersetze: <span class=\"la\">Du musst mir nicht helfen.<\/span><\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div><b class=\"e\">Was ist gemeint?<\/b> Es ist nicht nötig – kein Verbot.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div><b class=\"e\">Falle erkennen.<\/b> <span class=\"la\">mustn't<\/span> hieße „du darfst nicht“. Das passt hier nicht.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div><b class=\"e\">Richtiges Verb wählen.<\/b> nicht nötig = <span class=\"la\">needn't<\/span> oder <span class=\"la\">don't have to<\/span>.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Ergebnis: <span class=\"la\">You needn't help me.<\/span> oder <span class=\"la\">You don't have to help me.<\/span><\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"g13","t":"Past simple: regelmäßige Verben und was / were","kl":"6","k":6,"a":"G","tag":"6. Schulstufe","goals":["Du bildest das past simple regelmäßiger Verben mit <b>-ed<\/b>.","Du verwendest <b>was<\/b> und <b>were<\/b> richtig.","Du erkennst Signalwörter für die Vergangenheit."],"ex":[{"type":"txt","q":"Past simple von <span class=\"la\">stop<\/span>:","a":["stopped"],"s":"Kurzer betonter Vokal + Konsonant: Das <span class=\"la\">p<\/span> wird verdoppelt."},{"type":"txt","q":"Past simple von <span class=\"la\">try<\/span>:","a":["tried"],"s":"Konsonant + y wird zu <b>-ied<\/b>."},{"type":"mc","q":"We <span class=\"gap\">___<\/span> at home last night.","o":["were","was","are","be"],"s":"Zu <span class=\"la\">we<\/span> gehört in der Vergangenheit <b>were<\/b>."},{"type":"mc","q":"The weather <span class=\"gap\">___<\/span> terrible yesterday.","o":["was","were","is","has been"],"s":"<span class=\"la\">the weather<\/span> = it → <b>was<\/b>; <span class=\"la\">yesterday<\/span> verlangt das past simple."},{"type":"mc","q":"Übersetze: <span class=\"la\">Ich habe gestern meine Oma besucht.<\/span>","o":["I visited my grandma yesterday.","I have visited my grandma yesterday.","I visit my grandma yesterday.","I was visit my grandma yesterday."],"s":"Mit <span class=\"la\">yesterday<\/span> steht das past simple, nicht das present perfect."},{"type":"mc","q":"We moved to a new flat two weeks <span class=\"gap\">___<\/span>.","o":["ago","for","last","since"],"s":"„vor zwei Wochen“ = <b>two weeks ago<\/b>; <span class=\"la\">ago<\/span> steht hinter der Zeitangabe."},{"type":"txt","q":"Setze ein: She <span class=\"gap\">___<\/span> her bag to school. (carry, past simple)","a":["carried"],"s":"Konsonant + y wird zu <b>-ied<\/b>."},{"type":"mc","q":"“<span class=\"gap\">___<\/span> you at the party on Friday?” – “Yes, I <span class=\"gap\">___<\/span>.”","o":["Were … was","Was … were","Did … was","Were … were"],"s":"Frage mit <span class=\"la\">you<\/span>: <b>Were<\/b>; Antwort mit <span class=\"la\">I<\/span>: <b>was<\/b>."}],"gen":["past"],"html":"<p>Das past simple beschreibt, was zu einem bestimmten Zeitpunkt in der Vergangenheit geschah und abgeschlossen ist. Signalwörter: <span class=\"la\">yesterday, last week, two days ago, in 2020, when I was six<\/span>.<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Regel für -ed<\/th><th>Beispiel<\/th><\/tr><tr><td>normal: + ed<\/td><td>play → played<\/td><\/tr><tr><td>nach -e: nur + d<\/td><td>like → liked<\/td><\/tr><tr><td>Konsonant + y: y → ied<\/td><td>carry → carried<\/td><\/tr><tr><td>kurzer betonter Vokal + Konsonant: verdoppeln<\/td><td>stop → stopped<\/td><\/tr><\/table><\/div>\n<p>Die Form ist für alle Personen gleich – außer bei <span class=\"la\">to be<\/span>: <b>was<\/b> bei <span class=\"la\">I, he, she, it<\/span> und <b>were<\/b> bei <span class=\"la\">you, we, they<\/span>.<\/p>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>Im Deutschen erzählt man oft im Perfekt („Ich habe gestern gespielt“). Im Englischen steht bei einer Zeitangabe wie <span class=\"la\">yesterday<\/span> das past simple: <span class=\"la\">I played yesterday.<\/span><\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Past simple bilden<\/h4><div class=\"task\">Setze ein: <span class=\"la\">Last Saturday we <span class=\"gap\">___<\/span> (visit) our aunt. She <span class=\"gap\">___<\/span> (be) very happy.<\/span><\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div><b class=\"e\">Signalwort.<\/b> <span class=\"la\">Last Saturday<\/span> → past simple.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div><b class=\"e\">visit:<\/b> regelmäßig → <span class=\"la\">visited<\/span> (das t wird nicht verdoppelt, weil die Betonung auf der ersten Silbe liegt).<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div><b class=\"e\">be:<\/b> <span class=\"la\">she<\/span> → <span class=\"la\">was<\/span>.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Ergebnis: <span class=\"la\">Last Saturday we visited our aunt. She was very happy.<\/span><\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"g14","t":"Past simple: unregelmäßige Verben, Fragen und Verneinung","kl":"6","k":6,"a":"G","tag":"6. Schulstufe","goals":["Du kennst die 2. Form wichtiger unregelmäßiger Verben.","Du bildest Fragen mit <b>did<\/b> und Verneinungen mit <b>didn't<\/b>.","Du weißt, dass nach <b>did<\/b> immer der Infinitiv steht."],"ex":[{"type":"txt","q":"Past simple von <span class=\"la\">buy<\/span>:","a":["bought"],"s":"<b>buy – bought – bought<\/b>."},{"type":"txt","q":"Past simple von <span class=\"la\">take<\/span>:","a":["took"],"s":"<b>take – took – taken<\/b>."},{"type":"mc","q":"<span class=\"gap\">___<\/span> you <span class=\"gap\">___<\/span> the film last night?","o":["Did … see","Did … saw","Have … saw","Were … see"],"s":"<b>Did<\/b> + Subjekt + Infinitiv: Did you see …?"},{"type":"mc","q":"We <span class=\"gap\">___<\/span> to the zoo last Sunday. We stayed at home.","o":["didn't go","didn't went","weren't go","don't went"],"s":"<b>didn't<\/b> + Infinitiv: didn't go."},{"type":"mc","q":"Where <span class=\"gap\">___<\/span> your holidays last summer?","o":["did you spend","did you spent","you spent","spent you"],"s":"Fragewort + <b>did<\/b> + Subjekt + Infinitiv."},{"type":"mc","q":"“Did Tom call you?” – “No, <span class=\"gap\">___<\/span>.”","o":["he didn't","he didn't call","he wasn't","he doesn't"],"s":"Die Kurzantwort wiederholt nur das Hilfsverb: <b>No, he didn't.<\/b>"},{"type":"txt","q":"Setze ein: I <span class=\"gap\">___<\/span> a letter to my aunt yesterday. (write)","a":["wrote"],"s":"<b>write – wrote – written<\/b>."},{"type":"mc","q":"She <span class=\"gap\">___<\/span> happy when she <span class=\"gap\">___<\/span> the news.","o":["wasn't … heard","didn't be … heard","wasn't … hear","didn't was … heard"],"s":"<span class=\"la\">to be<\/span> wird ohne <span class=\"la\">did<\/span> verneint (<b>wasn't<\/b>); <span class=\"la\">hear<\/span> hat die 2. Form <b>heard<\/b>."}],"gen":["irr"],"html":"<p>Viele häufige Verben haben eine eigene Vergangenheitsform, die du auswendig lernen musst: <span class=\"la\">go – went, see – saw, buy – bought, take – took, eat – ate, come – came, write – wrote<\/span>.<\/p>\n<p>Für Fragen und Verneinungen brauchst du <b>did<\/b> – für alle Personen gleich. Danach steht der <b>Infinitiv<\/b>, weil <span class=\"la\">did<\/span> die Vergangenheit schon anzeigt.<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th><\/th><th>Beispiel<\/th><\/tr><tr><td>Aussage<\/td><td>She went home.<\/td><\/tr><tr><td>Verneinung<\/td><td>She didn't go home.<\/td><\/tr><tr><td>Frage<\/td><td>Did she go home?<\/td><\/tr><tr><td>Kurzantwort<\/td><td>Yes, she did. / No, she didn't.<\/td><\/tr><\/table><\/div>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>Doppelte Vergangenheit ist falsch: <span class=\"la\">Did you see …?<\/span> – nicht „Did you saw …?“<\/div>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>Bei <span class=\"la\">was / were<\/span> brauchst du kein <span class=\"la\">did<\/span>: <span class=\"la\">Were you tired? I wasn't tired.<\/span><\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Verneinung im past simple<\/h4><div class=\"task\">Verneine: <span class=\"la\">She found her keys.<\/span><\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div><b class=\"e\">Hilfsverb.<\/b> Verneinung im past simple = <span class=\"la\">didn't<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div><b class=\"e\">Infinitiv suchen.<\/b> <span class=\"la\">found<\/span> ist die 2. Form von <span class=\"la\">find<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div><b class=\"e\">Zusammensetzen.<\/b> <span class=\"la\">didn't<\/span> + Infinitiv.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Ergebnis: <span class=\"la\">She didn't find her keys.<\/span> Die Vergangenheit steckt in <span class=\"la\">didn't<\/span> – das Vollverb steht deshalb in der Grundform.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"g15","t":"Steigerung der Adjektive","kl":"6","k":6,"a":"G","tag":"6. Schulstufe","goals":["Du bildest Komparativ und Superlativ kurzer und langer Adjektive.","Du vergleichst mit <b>than<\/b> und <b>as … as<\/b>.","Du kennst die unregelmäßigen Formen von <b>good, bad, far<\/b>."],"ex":[{"type":"mc","q":"This exercise is <span class=\"gap\">___<\/span> than the last one.","o":["easier","more easy","easyer","the easiest"],"s":"-y wird zu <b>-ier<\/b>; vor <span class=\"la\">than<\/span> steht der Komparativ."},{"type":"mc","q":"Mount Everest is <span class=\"gap\">___<\/span> mountain in the world.","o":["the highest","higher","the most high","highest than"],"s":"Superlativ eines kurzen Adjektivs: <b>the highest<\/b>."},{"type":"mc","q":"My bike was <span class=\"gap\">___<\/span> than yours.","o":["more expensive","expensiver","most expensive","more expensiver"],"s":"Lange Adjektive steigert man mit <b>more<\/b>."},{"type":"mc","q":"I'm not <span class=\"gap\">___<\/span> my brother.","o":["as tall as","as taller as","so tall than","taller as"],"s":"Gleichheit bzw. Ungleichheit: <b>(not) as<\/b> + Grundform + <b>as<\/b>."},{"type":"txt","q":"Komparativ von <span class=\"la\">good<\/span>:","a":["better"],"s":"Unregelmäßig: <b>good – better – best<\/b>."},{"type":"txt","q":"Superlativ von <span class=\"la\">bad<\/span>: the <span class=\"gap\">___<\/span>","a":["worst"],"s":"Unregelmäßig: <b>bad – worse – worst<\/b>."},{"type":"txt","q":"Setze ein: Today is <span class=\"gap\">___<\/span> than yesterday. (hot)","a":["hotter"],"s":"Kurzer Vokal + Konsonant: Das <span class=\"la\">t<\/span> wird verdoppelt."},{"type":"mc","q":"Übersetze: <span class=\"la\">Sie ist älter als ich.<\/span>","o":["She is older than me.","She is older as me.","She is more old than me.","She is older then me."],"s":"„als“ beim Vergleich = <b>than<\/b>."}],"gen":["comp"],"html":"<div class=\"tw\"><table class=\"plain\"><tr><th>Adjektiv<\/th><th>Komparativ<\/th><th>Superlativ<\/th><\/tr><tr><td>kurz: old<\/td><td>older<\/td><td>the oldest<\/td><\/tr><tr><td>auf -e: nice<\/td><td>nicer<\/td><td>the nicest<\/td><\/tr><tr><td>kurzer Vokal + Konsonant: big<\/td><td>bigger<\/td><td>the biggest<\/td><\/tr><tr><td>auf -y: happy<\/td><td>happier<\/td><td>the happiest<\/td><\/tr><tr><td>lang: expensive<\/td><td>more expensive<\/td><td>the most expensive<\/td><\/tr><tr><td>good<\/td><td>better<\/td><td>the best<\/td><\/tr><tr><td>bad<\/td><td>worse<\/td><td>the worst<\/td><\/tr><\/table><\/div>\n<p>Beim Vergleich steht <b>than<\/b>: <span class=\"la\">Tom is taller than me.<\/span> Sind zwei Dinge gleich, heißt es <b>as … as<\/b>: <span class=\"la\">I am as tall as you.<\/span> Das Gegenteil ist <span class=\"la\">not as … as<\/span>.<\/p>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>„als“ beim Vergleich heißt <b>than<\/b>, nicht „as“ und nicht „then“.<\/div>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>Nie doppelt steigern: <span class=\"la\">more better<\/span> und <span class=\"la\">more easier<\/span> sind falsch.<\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Ein Adjektiv steigern<\/h4><div class=\"task\">Vergleiche: <span class=\"la\">Tina's bag is heavy. My bag is even <span class=\"gap\">___<\/span>.<\/span><\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div><b class=\"e\">Wie lang ist das Adjektiv?<\/b> <span class=\"la\">heavy<\/span> hat zwei Silben und endet auf -y → Steigerung mit -er.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div><b class=\"e\">Schreibung.<\/b> -y wird zu -i: <span class=\"la\">heavier<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div><b class=\"e\">Vergleich anschließen.<\/b> Wenn ein Vergleichswort folgt: <span class=\"la\">than<\/span>.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Ergebnis: <span class=\"la\">My bag is even heavier (than Tina's).<\/span> Superlativ: <span class=\"la\">the heaviest<\/span>.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"g16","t":"Mengenwörter: some, any, much, many, a lot of","kl":"6","k":6,"a":"G","tag":"6. Schulstufe","goals":["Du unterscheidest zählbare und nicht zählbare Nomen.","Du verwendest <b>some<\/b> und <b>any<\/b> richtig.","Du wählst zwischen <b>much, many, a few, a little<\/b>."],"ex":[{"type":"mc","q":"How <span class=\"gap\">___<\/span> brothers and sisters have you got?","o":["many","much","lot","any"],"s":"<span class=\"la\">brothers and sisters<\/span> kann man zählen: <b>How many<\/b>."},{"type":"mc","q":"There isn't <span class=\"gap\">___<\/span> milk in the fridge.","o":["any","some","many","a few"],"s":"Verneinter Satz: <b>any<\/b>."},{"type":"mc","q":"Would you like <span class=\"gap\">___<\/span> orange juice?","o":["some","many","a few","a lot"],"s":"Ein Angebot – deshalb auch in der Frage <b>some<\/b>."},{"type":"mc","q":"We haven't got <span class=\"gap\">___<\/span> time. Hurry up!","o":["much","many","a few","some"],"s":"<span class=\"la\">time<\/span> ist nicht zählbar und der Satz ist verneint: <b>much<\/b>."},{"type":"mc","q":"I only have <span class=\"gap\">___<\/span> friends in my new town, but they are great.","o":["a few","a little","much","any"],"s":"<span class=\"la\">friends<\/span> ist zählbar: <b>a few<\/b>."},{"type":"mc","q":"Can I have <span class=\"gap\">___<\/span> sugar in my tea, please? Just one spoon.","o":["a little","a few","many","much"],"s":"<span class=\"la\">sugar<\/span> ist nicht zählbar: <b>a little<\/b>."},{"type":"txt","q":"Ergänze: How <span class=\"gap\">___<\/span> does this T-shirt cost?","a":["much"],"s":"Nach dem Preis fragt man mit <b>How much<\/b>."},{"type":"mc","q":"Welcher Satz ist richtig?","o":["We've got a lot of homework today.","We've got many homeworks today.","We've got a lot of homeworks today.","We've got much homeworks today."],"s":"<span class=\"la\">homework<\/span> ist nicht zählbar und hat keine Mehrzahl."}],"gen":[],"html":"<p>Zählbare Nomen haben eine Mehrzahl (<span class=\"la\">an apple – two apples<\/span>). Nicht zählba
