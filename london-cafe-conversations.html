<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>London Calling – Cafés, Conversations & Christmas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F1EA; --card:#FFFFFF; --ink:#1B1B1F; --soft:#5A5866;
  --sky:#3D5A88; --sky-l:#E4EAF4;
  --petrol:#1F6B78; --petrol-l:#E0EEF0;
  --lilac:#5A4878; --lilac-l:#ECE7F3;
  --berry:#86384F; --berry-l:#F4E5E9;
  --gold:#B08433; --gold-l:#F6EEDC;
  --line:#E3DDD3;
  --radius:20px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:'Lexend',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:18px;line-height:1.6}
header.hero{background:linear-gradient(135deg,#2E4470 0%,#4A3E6E 55%,#7A3550 100%);color:#fff;padding:48px 24px 40px;text-align:center}
.hero h1{margin:0 0 8px;font-size:clamp(28px,5vw,46px);font-weight:600;letter-spacing:.3px}
.hero p{margin:0 auto;max-width:720px;font-weight:300;font-size:19px;opacity:.95}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:22px}
.tbtn{font-family:inherit;font-size:15px;border:1.5px solid rgba(255,255,255,.55);background:rgba(255,255,255,.1);color:#fff;border-radius:999px;padding:8px 16px;cursor:pointer;transition:.2s}
.tbtn:hover{background:rgba(255,255,255,.22)}
.tbtn.on{background:#fff;color:#2E4470;border-color:#fff}
.score{font-size:15px;margin-top:14px;opacity:.9}
nav.chips{position:sticky;top:0;z-index:20;background:rgba(245,241,234,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);display:flex;gap:8px;overflow-x:auto;padding:12px 16px;scrollbar-width:thin}
.chip{flex:0 0 auto;font-family:inherit;font-size:15px;border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:8px 15px;cursor:pointer;white-space:nowrap;transition:.2s}
.chip:hover{border-color:var(--sky)}
.chip.active{background:var(--sky);border-color:var(--sky);color:#fff}
main{max-width:980px;margin:0 auto;padding:28px 18px 80px}
.mod-head{border-radius:var(--radius);padding:26px 28px;margin-bottom:22px;color:#fff}
.mod-head h2{margin:0 0 4px;font-size:30px;font-weight:600}
.mod-head p{margin:0;font-weight:300;font-size:18px;opacity:.95}
.card{background:var(--card);border-radius:var(--radius);padding:24px 26px;margin-bottom:22px;box-shadow:0 2px 14px rgba(40,30,60,.06)}
.card h3{margin:0 0 14px;font-size:22px;font-weight:600;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tag{font-size:13px;font-weight:500;border-radius:999px;padding:3px 11px;background:var(--sky-l);color:var(--sky)}
.note{background:var(--gold-l);border-left:5px solid var(--gold);border-radius:14px;padding:16px 20px}
.note h3{color:#6E5220}
.note ul{margin:0;padding-left:20px}
.note li{margin:6px 0}
.dlg-title{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.dlg-scene{color:var(--soft);font-size:16px;margin:0 0 14px}
.line{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed var(--line)}
.line:last-child{border-bottom:none}
.who{flex:0 0 92px;font-size:14px;font-weight:600;color:var(--petrol);padding-top:4px}
.line.me .who{color:var(--berry)}
.line.me .txt .en{font-weight:500}
.txt{flex:1}
.en{display:block}
.de{display:none;color:var(--soft);font-size:16px;font-weight:300;margin-top:2px}
body.show-de .de{display:block}
.spk{flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:#fff;cursor:pointer;font-size:17px;display:flex;align-items:center;justify-content:center;transition:.2s}
.spk:hover{border-color:var(--sky);background:var(--sky-l)}
.spk.playing{background:var(--sky);border-color:var(--sky);color:#fff}
.pbtn{font-family:inherit;font-size:15px;border:none;border-radius:999px;padding:8px 16px;cursor:pointer;background:var(--sky-l);color:var(--sky);font-weight:500}
.pbtn:hover{background:#d5dff0}
.phrases{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.ph{border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;gap:10px;align-items:flex-start}
.ph .en{font-weight:500}
.ph .de{display:block}
.ph .why{font-size:14.5px;color:var(--lilac);margin-top:6px}
.q{border:1.5px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:16px}
.q .qhead{display:flex;gap:10px;align-items:flex-start;margin-bottom:6px}
.q .qtext{font-weight:500;flex:1}
.q .ctx{font-size:15px;color:var(--soft);margin:0 0 12px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{font-family:inherit;font-size:17px;text-align:left;border:1.5px solid var(--line);background:#FBFAF7;border-radius:14px;padding:11px 15px;cursor:pointer;transition:.15s;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--sky);background:var(--sky-l)}
.opt.right{background:var(--petrol-l);border-color:var(--petrol);color:#123f47;font-weight:500}
.opt.wrong{background:var(--berry-l);border-color:var(--berry);color:#5c2234}
.opt:disabled{cursor:default}
.expl{display:none;margin-top:12px;background:var(--lilac-l);border-radius:12px;padding:12px 16px;font-size:16px}
.expl.show{display:block}
.expl b{color:var(--lilac)}
.puzzle-pool,.puzzle-done{display:flex;flex-direction:column;gap:8px}
.puzzle-done{margin-bottom:14px;min-height:20px}
.pz{font-family:inherit;font-size:16.5px;text-align:left;border:1.5px solid var(--line);background:#FBFAF7;border-radius:14px;padding:10px 14px;cursor:pointer;color:var(--ink)}
.pz:hover{border-color:var(--sky)}
.pz.shake{animation:shake .35s;border-color:var(--berry);background:var(--berry-l)}
.done-line{border-radius:14px;padding:10px 14px;background:var(--petrol-l);font-size:16.5px}
.done-line small{color:var(--petrol);font-weight:600;margin-right:8px}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.hint{font-size:15px;color:var(--soft);margin:0 0 12px}
.flip-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.flip{border-radius:16px;min-height:130px;cursor:pointer;perspective:900px}
.flip-in{position:relative;width:100%;height:100%;min-height:130px;transition:transform .5s;transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:16px;padding:16px 18px;backface-visibility:hidden;display:flex;flex-direction:column;justify-content:center}
.front{background:var(--sky-l);border:1.5px solid #cdd8ea}
.front .en{font-weight:500;font-size:18px}
.front small{color:var(--soft);font-size:13px;margin-top:8px}
.back{background:var(--lilac);color:#fff;transform:rotateY(180deg);font-size:16px}
.role{border:1.5px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:12px}
.role b{color:var(--berry)}
.role ul{margin:8px 0 0;padding-left:20px}
.minis{font-size:15px;color:var(--soft)}
.modscore{font-size:15px;color:var(--soft);text-align:right;margin-top:-8px}
footer{text-align:center;color:var(--soft);font-size:14px;padding:30px}
@media(max-width:600px){.who{flex-basis:70px;font-size:13px}.card{padding:20px 18px}body{font-size:17px}}
</style>
</head>
<body>

<header class="hero">
  <h1>London Calling</h1>
  <p>Cafés, conversations, the Tube, shopping and Christmas in London – real situations, real British English.</p>
  <div class="toolbar">

    <button class="tbtn" id="btnStop">⏹ Stop</button>
  </div>

</header>

<nav class="chips" id="chips"></nav>
<main id="main"></main>

id:"counter", icon:"☕", title:"Coffee at the Counter", sub:"Ordering, finding a seat, small problems – all in a London café.", color:"var(--sky)",
notes:[

"<b>Eat in or take away?</b> is British English. <b>For here or to go?</b> is American – in London you hear both.",
"<b>Flat white</b> (strong coffee with a little silky milk) is a London favourite. <b>Oat milk</b> is the most common plant milk.",
"Paying: almost everyone pays <b>contactless</b> (card or phone). Many cafés don't take cash at all.",
"<b>Cheers!</b> often means simply <b>Thanks!</b> – nothing to do with drinking."

dialogues:[
{title:"At the counter", scene:"A busy café in Soho, Saturday morning.", puzzle:true, lines:[
["Barista","Hiya, what can I get you?","Hallo, was darf es sein?"],
["You","Hi! Could I have a flat white with oat milk, please?","Hallo! Könnte ich einen Flat White mit Hafermilch haben?"],
["Barista","Sure. Small or regular?","Klar. Klein oder normal?"],
["You","Regular, please. And what would you recommend to eat? Something not too sweet.","Normal, bitte. Und was würden Sie zum Essen empfehlen? Etwas nicht zu Süßes."],
["Barista","The cheese and chive scone is lovely. We can warm it up for you.","Der Käse-Schnittlauch-Scone ist herrlich. Wir können ihn Ihnen aufwärmen."],
["You","Sounds perfect. I'll have one of those.","Klingt perfekt. Davon nehme ich einen."],
["Barista","Eating in or taking away?","Hier essen oder zum Mitnehmen?"],
["You","Eating in, please – if I can find a seat!","Hier, bitte – wenn ich einen Platz finde!"],
["Barista","There's a table by the window. That's seven pounds eighty.","Am Fenster ist ein Tisch frei. Das macht 7,80 Pfund."],
["You","Can I just tap my card?","Kann ich einfach mit Karte kontaktlos zahlen?"],
["Barista","Yep, go ahead. Can I take a name for the order?","Ja, bitte. Welchen Namen darf ich für die Bestellung notieren?"],
["You","It's Lin. L – I – N.","Lin. L – I – N."],
["Barista","Lovely. We'll call you when it's ready.","Super. Wir rufen Sie, wenn es fertig ist."]

["Stranger","No, go ahead. Let me just move my bag.","Nein, bitte. Ich nehme nur kurz meine Tasche weg."],
["You","Thank you, that's very kind. It's packed in here today!","Danke, sehr nett. Heute ist es hier ja gerammelt voll!"],
["Stranger","It's always like this when it rains. The whole of London hides in cafés.","So ist es immer, wenn es regnet. Ganz London versteckt sich in Cafés."],
["You","Then today I'm a real Londoner.","Dann bin ich heute eine echte Londonerin."],
["Stranger","Ha! You're getting the hang of it.","Ha! Sie haben den Dreh schon raus."],

{title:"A small mistake", scene:"Your coffee arrives – but something isn't right.", lines:[

["Barista","Oh, I'm so sorry! I'll make you a fresh one right away.","Oh, das tut mir so leid! Ich mache Ihnen sofort einen neuen."],

["Barista","Here you go. Oat flat white – and sorry again.","Bitte sehr. Flat White mit Hafermilch – und nochmals Entschuldigung."],

phrases:[
["Could I get a … , please?","Könnte ich ein/e … bekommen?","Very common and polite when ordering."],
["Could I have it extra hot, please?","Könnte ich ihn extra heiß haben?",""],
["Just a splash of milk, please.","Nur einen Schuss Milch, bitte.",""],
["Could I have a glass of tap water as well?","Könnte ich auch ein Glas Leitungswasser haben?","Tap water is free – you only need to ask."],
["Do you have anything dairy-free?","Haben Sie etwas ohne Milchprodukte?",""],

quiz:[
{q:"The barista asks: “Eating in or taking away?” You want to sit in the café. What do you say?",o:["Eating in, please.","Taking away, please.","Just a regular, please."],a:0,e:"<b>Eating in</b> = im Café bleiben. <b>Taking away</b> = mitnehmen. ‘Just a regular’ beantwortet die Frage nach der Größe – das wurde hier nicht gefragt."},
{q:"Someone asks you: “Do you mind if I sit here?” The chair is free and you are happy to share. Which answer is correct?",o:["No, not at all.","Yes, of course.","Yes, I do."],a:0,e:"Achtung, Falle! ‘Do you mind…?’ heißt wörtlich ‘Stört es Sie…?’. Wer es erlauben will, sagt also <b>No</b> (= nein, es stört mich nicht). ‘Yes’ würde bedeuten: Ja, es stört mich."},
{q:"Someone asks: “Is anyone sitting here?” The seat is free. What do you say?",o:["No, go ahead.","Yes, please sit down.","No, thank you."],a:0,e:"<b>No</b> = niemand sitzt hier; <b>go ahead</b> = bitte sehr. ‘Yes’ würde heißen, dass schon jemand dort sitzt. ‘No, thank you’ klingt wie eine Ablehnung."},
{q:"What is a “builder's tea” in Britain?",o:["A strong black tea with milk","A large pot of green tea","A herbal tea with honey and lemon"],a:0,e:"<b>Builder's tea</b> ist kräftiger Schwarztee mit Milch (oft mit Zucker) – der britische Alltagstee schlechthin."},
{q:"Your coffee has the wrong milk. Which sentence sounds the most natural and polite in London?",o:["Sorry, I think this might be regular milk – I asked for oat.","This is the wrong milk. Make a new one.","Sorry, can I have oat milk next time?"],a:0,e:"Briten verpacken Kritik gern weich: <b>Sorry, I think this might be…</b>. Der zweite Satz ist grammatikalisch korrekt, klingt aber sehr direkt und unhöflich. Der dritte löst das Problem nicht."},
{q:"The barista hands you your coffee and says “Cheers!”. What does it mean here?",o:["Thanks!","Enjoy your drink, it's alcohol-free!","Please pay now."],a:0,e:"Im Alltag heißt <b>Cheers</b> sehr oft einfach <b>Danke</b> (oder auch Tschüss). Nur beim Anstoßen ist es ‘Prost’."},
{q:"You want to pay with your phone. Which question fits?",o:["Can I pay contactless?","Can I pay in cash with my phone?","Can I pay by bill?"],a:0,e:"<b>Contactless</b> = kontaktlos (Karte oder Handy). ‘Bill’ ist die Rechnung im Restaurant, keine Zahlungsart."}
]

["Friend","You too! How was the flight?","Dich auch! Wie war der Flug?"],

{title:"Catching up", scene:"Coffee and cake. Time to talk.", lines:[

phrases:[

["You","Oh, thank you! I bought it yesterday in Covent Garden.","Oh, danke! Den habe ich gestern in Covent Garden gekauft."],
["Stranger","Good choice. Are you here on holiday?","Gute Wahl. Sind Sie im Urlaub hier?"],
["You","Yes, just for a few days. I'm originally from China, but I live in Austria – in Graz.","Ja, nur für ein paar Tage. Ich komme ursprünglich aus China, lebe aber in Österreich – in Graz."],
["Stranger","Austria! I've always wanted to go. Is it like in The Sound of Music?","Österreich! Da wollte ich immer schon hin. Ist es wie in ‘The Sound of Music’?"],
["You","Everybody asks that! Graz is a bit different – lots of students, old buildings and very good food.","Das fragen alle! Graz ist etwas anders – viele Studierende, alte Gebäude und sehr gutes Essen."]
]},
{title:"Any tips?", scene:"The conversation continues.", lines:[
["You","Do you have any tips? What shouldn't I miss?","Haben Sie Tipps? Was sollte ich nicht verpassen?"],
["Stranger","Borough Market, definitely. Go hungry.","Borough Market, unbedingt. Gehen Sie hungrig hin."],
["You","I always go hungry. Food is my job – I own a restaurant.","Ich gehe immer hungrig. Essen ist mein Beruf – ich habe ein Restaurant."],
["Stranger","No way! What kind of food?","Echt jetzt? Was für Essen?"],
["You","Chinese. So I'm a very strict judge of Chinese food in London.","Chinesisch. Darum bin ich eine sehr strenge Richterin für chinesisches Essen in London."],
["Stranger","Then you have to try Chinatown and tell me if it passes the test!","Dann müssen Sie Chinatown probieren und mir sagen, ob es den Test besteht!"],
["You","I will. It was really nice talking to you.","Mache ich. Es war wirklich nett, mit Ihnen zu plaudern."],
["Stranger","You too. Enjoy the rest of your trip!","Ebenso. Genießen Sie den Rest Ihrer Reise!"]
]},
{title:"Saying no – nicely", scene:"On the street, a fundraiser with a clipboard stops you.", lines:[
["Fundraiser","Hi there! Have you got a minute for the children's hospital?","Hallo! Haben Sie eine Minute für das Kinderkrankenhaus?"],
["You","Sorry, I'm in a bit of a rush. Good luck, though!","Tut mir leid, ich hab's ein bisschen eilig. Aber viel Erfolg!"],
["Fundraiser","No problem. Have a lovely day!","Kein Problem. Schönen Tag noch!"],
["You","You too!","Ebenso!"]
]}
],
phrases:[

["That's a great tip, thank you.","Das ist ein toller Tipp, danke.",""],

],
quiz:[
{q:"A stranger says: “I love your scarf!” What is the most natural reaction?",o:["Oh, thank you! I bought it here in London.","Yes, it is very beautiful.","No, it is not special."],a:0,e:"Ein Kompliment nimmt man mit <b>Thank you</b> an und gibt gern eine kleine Info dazu – so geht das Gespräch weiter. ‘Yes, it is very beautiful’ klingt, als lobe man sich selbst; ‘No…’ weist das Kompliment zurück."},
{q:"How do you best explain where you're from?",o:["I'm originally from China, but I've lived in Austria for years.","I'm originally from China, but I live in Austria since years.","I'm originally from China, but I'm living in Austria for years."],a:0,e:"Für ‘seit Jahren’ braucht man im Englischen das <b>Present Perfect</b>: <b>I've lived … for years</b>. ‘I live since years’ ist ein typischer Fehler aus dem Deutschen."},
{q:"You want to end a nice chat politely. Which sentence fits best?",o:["It was really nice talking to you.","I must go now. Bye.","Please stop talking now."],a:0,e:"<b>It was really nice talking to you</b> beendet ein Gespräch warm und höflich. ‘I must go now. Bye.’ ist korrekt, klingt aber abrupt."},
{q:"A fundraiser asks: “Have you got a minute?” You don't want to stop. What do you say?",o:["Sorry, I'm in a bit of a rush.","Yes, I have got a minute.","I don't have minutes."],a:0,e:"Freundlich und klar: <b>Sorry, I'm in a bit of a rush</b>. ‘Yes, I have got a minute’ würde bedeuten, dass Sie stehen bleiben."},
{q:"Choose the correct question tag: “You're not from here, ___?”",o:["are you","aren't you","do you"],a:0,e:"Verneinter Satz → positives Tag: <b>You're not …, are you?</b>"}
]

{
id:"restaurant", icon:"🍽️", title:"Restaurant & Pub", sub:"Table, menu, ordering, the bill – and how a British pub works.", color:"var(--berry)",
notes:[
"In restaurants you often wait to be seated: <b>A table for two, please.</b> Booking ahead is wise in December.",
"<b>Service charge</b>: many London restaurants add about 12.5 % to the bill. It is ‘discretionary’ (freiwillig). If it is already on the bill, you don't tip extra.",
"In a <b>pub</b> there is usually no table service: you <b>order and pay at the bar</b>. Food orders often go with your <b>table number</b>.",
"<b>Tap water</b> is free. ‘Still or sparkling?’ usually means bottled water – and that costs money.",
"British English: <b>the bill</b> (US: the check), <b>starter</b> (Vorspeise), <b>main</b> (Hauptspeise), <b>pudding / dessert</b>."
],
dialogues:[
{title:"A table for two", scene:"A busy restaurant in Covent Garden, Friday evening.", puzzle:true, lines:[
["Waiter","Good evening! Have you got a reservation?","Guten Abend! Haben Sie reserviert?"],
["You","Yes, a table for two at seven thirty. The name is Lin.","Ja, einen Tisch für zwei um halb acht. Auf den Namen Lin."],
["Waiter","Perfect, follow me, please. Can I get you something to drink?","Perfekt, folgen Sie mir bitte. Darf ich Ihnen etwas zu trinken bringen?"],
["You","Could we have a jug of tap water, please? And a glass of the house red.","Könnten wir einen Krug Leitungswasser haben? Und ein Glas Hauswein rot."],
["Waiter","Of course. Are you ready to order, or do you need a few more minutes?","Natürlich. Möchten Sie bestellen, oder brauchen Sie noch ein paar Minuten?"],
["You","A few more minutes, please. Everything looks so good.","Noch ein paar Minuten, bitte. Alles sieht so gut aus."]
]},
{title:"Ordering", scene:"The waiter comes back.", lines:[
["Waiter","Have you decided?","Haben Sie sich entschieden?"],
["You","Yes. Could I start with the soup of the day, and then the fish, please?","Ja. Könnte ich als Vorspeise die Tagessuppe haben und danach den Fisch?"],
["Waiter","Great choice. The fish comes with chips or new potatoes.","Gute Wahl. Zum Fisch gibt es Pommes oder junge Kartoffeln."],
["You","New potatoes, please. And does the sauce contain nuts?","Junge Kartoffeln, bitte. Und sind in der Soße Nüsse?"],
["Waiter","No nuts, but there's a little cream in it.","Keine Nüsse, aber ein bisschen Sahne."],
["You","That's fine. Thank you.","Das passt. Danke."],
["Waiter","How is everything?","Schmeckt es Ihnen?"],
["You","Delicious! Please give my compliments to the chef. As a chef myself, I'm impressed.","Köstlich! Bitte richten Sie dem Koch meine Komplimente aus. Als Köchin bin ich beeindruckt."]
]},
{title:"The bill", scene:"Dinner is finished.", lines:[
["You","Excuse me, could we have the bill, please?","Entschuldigung, könnten wir bitte zahlen?"],
["Waiter","Of course. Would you like to pay together or separately?","Natürlich. Zusammen oder getrennt?"],
["You","Together, please. Is service included?","Zusammen, bitte. Ist das Trinkgeld inbegriffen?"],
["Waiter","Yes, there's a twelve and a half percent service charge.","Ja, es gibt einen Servicezuschlag von 12,5 Prozent."],
["You","Lovely. Everything was wonderful, thank you.","Wunderbar. Es war alles großartig, danke."]
]},
{title:"At the pub bar", scene:"A traditional pub. You go to the bar.", lines:[
["Bartender","Hiya, what can I get you?","Hallo, was darf's sein?"],
["You","Could I have half a pint of cider and a lemonade, please?","Könnte ich ein kleines Glas Cider und eine Limonade haben?"],
["Bartender","Sure. Anything else?","Klar. Sonst noch was?"],
["You","Are you still serving food?","Gibt es noch Essen?"],
["Bartender","Kitchen's open till nine. Just order here and give me your table number.","Die Küche hat bis neun offen. Einfach hier bestellen und mir die Tischnummer sagen."],
["You","Great. Then one fish and chips for table twelve, please.","Super. Dann einmal Fish and Chips für Tisch zwölf, bitte."],
["Bartender","No problem. That's nineteen pounds fifty altogether.","Kein Problem. Das macht zusammen 19,50 Pfund."]
]}
],
phrases:[
["A table for two, please.","Einen Tisch für zwei, bitte.",""],
["Could we have a few more minutes?","Könnten wir noch ein paar Minuten haben?",""],
["What do you recommend?","Was empfehlen Sie?",""],
["I'll go for the …","Ich nehme den/die/das …","Natural alternative to ‘I'll have…’."],
["Does this contain nuts / gluten?","Enthält das Nüsse / Gluten?",""],
["Could I have it without onions?","Könnte ich das ohne Zwiebeln haben?",""],
["Please give my compliments to the chef.","Bitte richten Sie dem Koch meine Komplimente aus.","A classy compliment – perfect from a restaurant owner."],
["Could we have the bill, please?","Könnten wir bitte die Rechnung haben?",""],
["Is service included?","Ist das Trinkgeld inbegriffen?",""],
["A pint / half a pint of …","Ein großes / kleines Glas …","A pint ≈ 0,57 l, half a pint ≈ 0,28 l."]
],
quiz:[
{q:"You are in a typical London pub and want a drink. What do you do?",o:["Go to the bar, order and pay there.","Sit down and wait for the waiter.","Order at the bar and pay when you leave."],a:0,e:"Im Pub bestellt und zahlt man <b>direkt an der Bar</b>. Tischservice ist die Ausnahme. Später zahlen ist an der Bar nicht üblich."},
{q:"The bill says: “Service charge 12.5 % (discretionary)”. What does this mean?",o:["The tip is already added, but you can ask to remove it.","You must add another 12.5 % in cash.","It is a tax that everyone has to pay."],a:0,e:"<b>Discretionary</b> = freiwillig. Das Trinkgeld ist schon auf der Rechnung; extra Trinkgeld ist nicht nötig."},
{q:"The waiter asks: “Still or sparkling?” You want free water. What do you say?",o:["Just tap water, please.","Still, please.","Sparkling, please."],a:0,e:"‘Still or sparkling’ meint meist Flaschenwasser, das kostet. Für kostenloses Leitungswasser sagt man <b>tap water</b>."},
{q:"In British English, what do you ask for at the end of a meal?",o:["the bill","the check","the account"],a:0,e:"<b>The bill</b> ist britisch. <b>The check</b> ist amerikanisch – man versteht es in London, aber es klingt amerikanisch."},
{q:"The waiter asks: “Are you ready to order?” You need more time. What do you say?",o:["Could we have a few more minutes, please?","We are not ready to order.","Could you come later back?"],a:0,e:"<b>Could we have a few more minutes?</b> ist die natürliche, höfliche Antwort. Satz 2 ist korrekt, aber kühl. In Satz 3 ist die Wortstellung falsch: richtig wäre ‘come back later’."},
{q:"Which word fits? “The fish comes ___ chips or new potatoes.”",o:["with","by","from"],a:0,e:"<b>comes with</b> = wird serviert mit / dazu gibt es."},
{q:"How do you compliment the food in a stylish way?",o:["Please give my compliments to the chef.","Please tell the chef he cooks okay.","The chef is a good person."],a:0,e:"<b>Please give my compliments to the chef</b> ist die feste, elegante Formel. Die anderen Sätze klingen ungeschickt oder treffen nicht das Essen."}
]
},

quiz:[

quiz:[

/* ================= AUDIO ================= */
let rate = 0.95, voices = [], gbVoices = [], speaking = null;
function loadVoices(){
  try{
    voices = speechSynthesis.getVoices();
    gbVoices = voices.filter(v=>/en[-_]GB/i.test(v.lang));
    if(!gbVoices.length) gbVoices = voices.filter(v=>/^en/i.test(v.lang));
  }catch(e){}
}
if('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function clearPlaying(){ document.querySelectorAll('.spk.playing').forEach(b=>b.classList.remove('playing')); }
function say(text, btn, voiceIdx=0, onend){
  if(!('speechSynthesis' in window)) { alert('Audio is not supported in this browser.'); return; }
  speechSynthesis.cancel(); clearPlaying();
  const u = new SpeechSynthesisUtterance(text.replace(/[“”‘’]/g,"'"));
  u.lang = 'en-GB'; u.rate = rate;
  if(gbVoices.length) u.voice = gbVoices[voiceIdx % gbVoices.length];
  if(btn) btn.classList.add('playing');
  u.onend = ()=>{ if(btn) btn.classList.remove('playing'); if(onend) onend(); };
  u.onerror = ()=>{ if(btn) btn.classList.remove('playing'); };
  speechSynthesis.speak(u);
}
function playDialogue(lines, btns){
  let i = 0; const speakers = [...new Set(lines.map(l=>l[0]))];
  const next = ()=>{
    if(i >= lines.length) return;
    const idx = i++;
    say(lines[idx][1], btns[idx], speakers.indexOf(lines[idx][0]), next);
  };
  next();
}
function spkBtn(text, vi=0){
  const b = document.createElement('button');
  b.className='spk'; b.type='button'; b.title='Listen'; b.textContent='🔈';
  b.onclick = ()=>say(text,b,vi);
  return b;
}

const scores = {};
function updateTotal(){
  let r=0,t=0; Object.values(scores).forEach(s=>{r+=s.r; t+=s.t;});
  const all = MODULES.reduce((n,m)=>n+m.quiz.length,0);
  document.getElementById('totalScore').textContent = `Quiz: ${r} correct out of ${t} answered · ${all} questions in total`;
}

/* ================= RENDER ================= */
const main = document.getElementById('main'), chips = document.getElementById('chips');
const sections = {};

function renderModule(m){
  const sec = el('section'); sec.id = m.id;
  const head = el('div','mod-head',`<h2>${m.icon} ${m.title}</h2><p>${m.sub}</p>`);
  head.style.background = m.color; sec.appendChild(head);

  const n = el('div','card note','<h3>💡 Good to know</h3>');
  const ul = el('ul'); m.notes.forEach(t=>ul.appendChild(el('li','',t))); n.appendChild(ul); sec.appendChild(n);

  m.dialogues.forEach((d,di)=>{
    const c = el('div','card');
    const t = el('div','dlg-title');
    t.appendChild(el('h3','',`🎧 ${d.title} <span class="tag">Dialogue ${di+1}</span>`));
    const pb = el('button','pbtn','▶ Play whole dialogue'); t.appendChild(pb);
    c.appendChild(t);
    c.appendChild(el('p','dlg-scene',d.scene));
    const speakers = [...new Set(d.lines.map(l=>l[0]))];
    const btns = [];
    d.lines.forEach(l=>{
      const row = el('div','line'+(l[0]==='You'?' me':''));
      row.appendChild(el('div','who',l[0]));
      const tx = el('div','txt'); tx.appendChild(el('span','en',l[1])); tx.appendChild(el('span','de',l[2]));
      row.appendChild(tx);
      const b = spkBtn(l[1], speakers.indexOf(l[0])); btns.push(b); row.appendChild(b);
      c.appendChild(row);
    });
    pb.onclick = ()=>playDialogue(d.lines,btns);
    sec.appendChild(c);
  });

  // puzzle
  const pd = m.dialogues.find(d=>d.puzzle);
  if(pd){
    const c = el('div','card');
    c.appendChild(el('h3','',`🧩 Dialogue puzzle <span class="tag">Put the lines in order</span>`));
    c.appendChild(el('p','hint','Click the lines in the right order. Try it from memory first – without scrolling up.'));
    const done = el('div','puzzle-done'), pool = el('div','puzzle-pool');
    const lines = pd.lines.slice(0,6);
    let step = 0;
    const reset = el('button','pbtn','↺ Start again');
    function build(){
      done.innerHTML=''; pool.innerHTML=''; step=0;
      shuffle(lines.map((l,i)=>({l,i}))).forEach(o=>{
        const b = el('button','pz',`<b>${o.l[0]}:</b> ${o.l[1]}`);
        b.onclick = ()=>{
          if(o.i===step){
            step++; b.remove();
            done.appendChild(el('div','done-line',`<small>${step}</small><b>${o.l[0]}:</b> ${o.l[1]}`));
            if(step===lines.length) done.appendChild(el('div','expl show','<b>Well done!</b> The dialogue is complete. Now try to act it out with the other role.'));
          } else { b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); }
        };
        pool.appendChild(b);
      });
    }
    reset.onclick = build; build();
    c.appendChild(done); c.appendChild(pool);
    const rw = el('div'); rw.style.marginTop='14px'; rw.appendChild(reset); c.appendChild(rw);
    sec.appendChild(c);
  }

  // phrases
  const pc = el('div','card');
  pc.appendChild(el('h3','',`🗝️ Key phrases <span class="tag">${m.phrases.length} phrases</span>`));
  const grid = el('div','phrases');
  m.phrases.forEach(p=>{
    const ph = el('div','ph');
    const tx = el('div','txt'); tx.appendChild(el('span','en',p[0])); tx.appendChild(el('span','de',p[1]));
    if(p[2]) tx.appendChild(el('div','why',p[2]));
    ph.appendChild(tx); ph.appendChild(spkBtn(p[0].replace(/…/g,'').replace(/ \/ /g,', or ')));
    grid.appendChild(ph);
  });
  pc.appendChild(grid); sec.appendChild(pc);

  // quiz
  const qc = el('div','card');
  qc.appendChild(el('h3','',`✅ Check yourself <span class="tag">${m.quiz.length} questions</span>`));
  const ms = el('div','modscore'); qc.appendChild(ms);
  scores[m.id] = {r:0,t:0};
  const upd = ()=>{ ms.textContent = `${scores[m.id].r} / ${m.quiz.length} correct`; updateTotal(); };
  m.quiz.forEach((q,qi)=>{
    const box = el('div','q');
    const qh = el('div','qhead'); qh.appendChild(el('div','qtext',`${qi+1}. ${q.q}`)); box.appendChild(qh);
    const opts = el('div','opts'); const ex = el('div','expl');
    shuffle(q.o.map((t,i)=>({t,i}))).forEach(o=>{
      const b = el('button','opt'); b.textContent = o.t;
      b.onclick = ()=>{
        const all = opts.querySelectorAll('.opt'); all.forEach(x=>x.disabled=true);
        scores[m.id].t++;
        if(o.i===q.a){ b.classList.add('right'); scores[m.id].r++; ex.innerHTML = '<b>Right!</b> '+q.e; }
        else { b.classList.add('wrong'); all.forEach(x=>{ if(x.textContent===q.o[q.a]) x.classList.add('right'); }); ex.innerHTML = '<b>Not quite.</b> '+q.e; }
        ex.classList.add('show'); upd();
      };
      opts.appendChild(b);
    });
    box.appendChild(opts); box.appendChild(ex); qc.appendChild(box);
  });
  upd();
  sec.appendChild(qc);
  return sec;
}

function renderDecoder(){
  const sec = el('section'); sec.id='decoder';
  const head = el('div','mod-head','<h2>🕵️ The British Decoder</h2><p>What Brits say – and what they really mean. Click a card to turn it.</p>');
  head.style.background='var(--lilac)'; sec.appendChild(head);
  const c = el('div','card'); const g = el('div','flip-grid');
  DECODER.forEach(d=>{
    const f = el('div','flip'); const inn = el('div','flip-in');
    const fr = el('div','face front'); fr.appendChild(el('span','en',`“${d[0]}”`)); fr.appendChild(el('small','','What it really means?'));
    const bk = el('div','face back',d[1]);
    inn.appendChild(fr); inn.appendChild(bk); f.appendChild(inn);
    const sb = spkBtn(d[0]); sb.style.position='absolute'; sb.style.top='10px'; sb.style.right='10px';
    sb.addEventListener('click',e=>e.stopPropagation()); fr.appendChild(sb);
    f.onclick = ()=>f.classList.toggle('on');
    g.appendChild(f);
  });
  c.appendChild(g); sec.appendChild(c);
  const n = el('div','card note','<h3>💡 Good to know</h3><ul><li>Understatement is part of British humour – things are said more softly than they are meant.</li><li>When in doubt, look at the face and the tone of voice: a smile and ‘Brilliant!’ means real joy; a flat ‘brilliant’ can just mean ‘okay’.</li></ul>');
  sec.appendChild(n);
  return sec;
}

function renderRoles(){
  const sec = el('section'); sec.id='roles';
  const head = el('div','mod-head','<h2>🎭 Role-plays</h2><p>Act out the situations in class – your teacher plays the other person.</p>');
  head.style.background='var(--berry)'; sec.appendChild(head);
  const c = el('div','card');
  ROLES.forEach((r,i)=>{
    const b = el('div','role',`<b>${i+1}. ${r[0]}</b><br>${r[1]}`);
    const ul = el('ul','minis'); r[2].forEach(p=>ul.appendChild(el('li','',p))); b.appendChild(ul);
    c.appendChild(b);
  });
  sec.appendChild(c);
  return sec;
}

const ALL = [...MODULES.map(m=>({id:m.id,label:m.icon+' '+m.title,render:()=>renderModule(m)})),
  {id:'decoder',label:'🕵️ British Decoder',render:renderDecoder},
  {id:'roles',label:'🎭 Role-plays',render:renderRoles}];

ALL.forEach((a,i)=>{
  const s = a.render(); s.style.display = i===0?'block':'none'; main.appendChild(s); sections[a.id]=s;
  const ch = el('button','chip'+(i===0?' active':''),a.label);
  ch.onclick = ()=>{
    speechSynthesis && speechSynthesis.cancel(); clearPlaying();
    Object.values(sections).forEach(x=>x.style.display='none'); s.style.display='block';
    document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active')); ch.classList.add('active');
    ch.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
    window.scrollTo({top: document.querySelector('nav.chips').offsetTop, behavior:'smooth'});
  };
  chips.appendChild(ch);
});
updateTotal();

/* toolbar */
const bDe=document.getElementById('btnDe'), bN=document.getElementById('btnNormal'), bS=document.getElementById('btnSlow');
bDe.onclick=()=>{document.body.classList.toggle('show-de'); bDe.classList.toggle('on'); bDe.textContent = document.body.classList.contains('show-de')?'🇩🇪 Deutsch ausblenden':'🇩🇪 Deutsch anzeigen';};
bN.onclick=()=>{rate=0.95; bN.classList.add('on'); bS.classList.remove('on');};
bS.onclick=()=>{rate=0.72; bS.classList.add('on'); bN.classList.remove('on');};
document.getElementById('btnStop').onclick=()=>{ if('speechSynthesis' in window) speechSynthesis.cancel(); clearPlaying(); };
</script>
</body>
</html>
