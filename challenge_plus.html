<!DOCTYPE html>
<html lang="de">
<head>
<script src="passwort.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Challenge Plus</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--primary:#132033;--primary-light:#1a4262;--accent:#4a9eff;--accent-glow:#85c1ff;--accent-dark:#2d7acc;--success:#4ade80;--error:#ff5252;--text:#fff;--text-muted:#b4c8e8;--gold:#ffd740;--card:rgba(19,32,51,.92)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Quicksand',system-ui,sans-serif;background:linear-gradient(180deg,#0e1a2b 0%,#153454 40%,#1f4d70 70%,#2c72a8 100%) fixed;min-height:100vh;color:var(--text);line-height:1.5}
.container{max-width:1000px;margin:0 auto;padding:16px 16px 60px}
header{text-align:center;padding:8px 0 10px}
h1{font-family:'Fredoka',sans-serif;font-size:2.2rem;background:linear-gradient(135deg,#4a9eff,#85c1ff,#ffd740);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:4px}
.subtitle{color:var(--text-muted);font-size:.95rem}
.view{display:none;animation:fadeIn .35s ease}.view.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#topnav{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;position:sticky;top:0;z-index:50;padding:8px 4px;margin-bottom:12px;background:rgba(14,26,43,.92);backdrop-filter:blur(6px);border-bottom:1px solid rgba(74,158,255,.2)}
.tabbtn{background:rgba(26,66,98,.7);border:1px solid rgba(74,158,255,.3);border-radius:20px;padding:8px 14px;color:var(--text);font-family:inherit;font-weight:700;font-size:.88rem;cursor:pointer;transition:.2s}
.tabbtn:hover{border-color:var(--accent-glow)}.tabbtn.on{background:linear-gradient(135deg,var(--accent-dark),var(--accent));border-color:var(--accent-glow)}
.tab{display:none}.tab.on{display:block}
.card{background:linear-gradient(135deg,rgba(19,32,51,.95),rgba(26,66,98,.88));border-radius:18px;padding:20px;margin-bottom:16px;border:1px solid rgba(74,158,255,.25);box-shadow:0 8px 26px rgba(0,0,0,.3)}
.card h2{font-family:'Fredoka',sans-serif;font-size:1.3rem;color:var(--accent-glow);margin-bottom:4px}
.card h3{font-family:'Fredoka',sans-serif;font-size:1.05rem;color:var(--gold);margin:10px 0 6px}
.desc{color:var(--text-muted);font-size:.88rem;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.tcard{background:rgba(14,26,43,.6);border:1px solid rgba(74,158,255,.2);border-radius:14px;padding:14px}
.tcard .tt{font-family:'Fredoka',sans-serif;color:var(--gold);font-size:1.02rem;margin-bottom:2px}
.tcard .td{color:var(--text-muted);font-size:.8rem;margin-bottom:8px;min-height:2.4em}
.btnrow{display:flex;gap:6px;flex-wrap:wrap}
.sbtn{flex:1;min-width:76px;background:linear-gradient(135deg,var(--primary),var(--primary-light));border:2px solid rgba(74,158,255,.3);border-radius:10px;padding:8px 10px;color:var(--text);font-family:inherit;font-size:.82rem;font-weight:700;cursor:pointer;transition:.2s;text-align:center}
.sbtn:hover:not(:disabled){border-color:var(--accent-glow);background:linear-gradient(135deg,var(--accent-dark),var(--accent));transform:translateY(-2px)}
.sbtn:disabled{opacity:.35;cursor:not-allowed}
.sbtn.gold{border-color:var(--gold);color:var(--gold)}
.best{font-size:.72rem;color:var(--success);margin-left:6px;font-weight:700}
.modebtn{width:100%;display:block;background:linear-gradient(135deg,var(--primary),var(--primary-light));border:2px solid rgba(74,158,255,.3);border-radius:12px;padding:12px 16px;color:var(--text);font-family:inherit;font-size:.98rem;font-weight:700;cursor:pointer;text-align:left;margin-bottom:8px;transition:.2s}
.modebtn small{display:block;color:var(--text-muted);font-weight:500;font-size:.8rem}
.modebtn:hover{border-color:var(--accent-glow);transform:translateX(5px);background:linear-gradient(135deg,var(--accent-dark),var(--accent))}
.modebtn:hover small{color:#eaf3ff}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{background:rgba(26,66,98,.7);border:2px solid rgba(74,158,255,.3);border-radius:12px;padding:8px 12px;color:var(--text);font-family:inherit;font-weight:700;font-size:.85rem;cursor:pointer;transition:.2s}
.chip:hover{border-color:var(--accent-glow)}.chip.on{background:linear-gradient(135deg,var(--accent-dark),var(--accent));border-color:var(--gold)}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.vtile{background:rgba(14,26,43,.6);border:2px solid rgba(74,158,255,.25);border-radius:14px;padding:12px;color:var(--text);cursor:pointer;font-family:inherit;text-align:left;transition:.2s}
.vtile:hover{border-color:var(--accent-glow);transform:translateY(-3px)}
.vtile .ic{font-size:1.6rem}.vtile .vt{font-weight:700;font-size:.92rem}.vtile .vn{font-size:.75rem;color:var(--text-muted)}
.bar{background:rgba(19,32,51,.7);border-radius:10px;height:14px;overflow:hidden;border:1px solid rgba(74,158,255,.2)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent-dark),var(--accent-glow));transition:width .4s}
.bar.gold i{background:linear-gradient(90deg,#ff9800,var(--gold))}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:10px 0}
.stat{background:rgba(19,32,51,.7);border:1px solid rgba(74,158,255,.25);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-family:'Fredoka',sans-serif;font-size:1.5rem;color:var(--accent-glow)}.stat span{font-size:.72rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px}
/* Spiel */
.ghead{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.mode-ind{background:linear-gradient(135deg,var(--accent-dark),var(--accent));padding:7px 16px;border-radius:20px;font-weight:700;font-family:'Fredoka',sans-serif;font-size:.9rem}
.sbar{display:flex;gap:8px}.si{background:rgba(19,32,51,.7);padding:6px 12px;border-radius:10px;border:1px solid rgba(74,158,255,.25);text-align:center;min-width:64px}
.si small{display:block;font-size:.62rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px}.si b{font-family:'Fredoka',sans-serif;color:var(--accent-glow);font-size:1.1rem}
.ptext{text-align:center;color:var(--text-muted);font-size:.8rem;margin:4px 0 14px}
.qprompt{text-align:center;color:var(--gold);font-weight:700;margin-bottom:8px;font-size:.95rem}
.sbox{background:linear-gradient(135deg,rgba(19,32,51,.95),rgba(26,66,98,.85));border-radius:18px;padding:28px 20px;margin-bottom:18px;border:1px solid rgba(74,158,255,.3);text-align:center;box-shadow:0 8px 28px rgba(0,0,0,.3)}
.sent{font-family:'Fredoka',sans-serif;font-size:1.45rem;line-height:2.1}
.blank{display:inline-block;min-width:80px;padding:2px 12px;background:rgba(74,158,255,.15);border:2px dashed rgba(133,193,255,.6);border-radius:9px;color:var(--accent-glow);font-weight:700}
.blank.correct{background:rgba(74,222,128,.25);border:2px solid var(--success);color:var(--success)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:18px}
.opts.wide{grid-template-columns:1fr}
.opt{background:linear-gradient(135deg,var(--primary),var(--primary-light));border:2px solid rgba(74,158,255,.3);border-radius:12px;padding:13px 14px;color:var(--text);font-family:inherit;font-size:1rem;font-weight:700;cursor:pointer;transition:.2s;text-align:center}
.opts.wide .opt{text-align:left}
.opt:hover:not(:disabled){border-color:var(--accent-glow);background:linear-gradient(135deg,var(--accent-dark),var(--accent));transform:translateY(-2px)}
.opt:disabled{opacity:.55;cursor:default}
.opt.correct{background:linear-gradient(135deg,rgba(74,222,128,.35),rgba(74,222,128,.15));border-color:var(--success);color:var(--success);opacity:1;animation:pulse .5s}
.opt.wrong{background:linear-gradient(135deg,rgba(255,82,82,.35),rgba(255,82,82,.15));border-color:var(--error);color:#ffb4b4;animation:shake .4s}
@keyframes pulse{50%{transform:scale(1.06)}}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.tin{font-family:'Fredoka',sans-serif;font-size:1.25rem;background:rgba(14,26,43,.8);border:2px solid rgba(133,193,255,.5);border-radius:9px;color:#fff;padding:2px 8px;margin:0 4px;text-align:center;outline:none}
.tin:focus{border-color:var(--gold)}.tin.ok{border-color:var(--success);background:rgba(74,222,128,.2);color:var(--success)}.tin.bad{border-color:var(--error);background:rgba(255,82,82,.2);animation:shake .4s}
.tin.wide{width:min(94%,640px);display:block;margin:10px auto 0}
.ctrl{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.cbtn{background:linear-gradient(135deg,var(--primary),var(--primary-light));border:2px solid rgba(74,158,255,.3);border-radius:11px;padding:10px 20px;color:var(--text);font-family:inherit;font-size:.9rem;font-weight:700;cursor:pointer;transition:.2s}
.cbtn:hover{border-color:var(--accent-glow);transform:translateY(-2px)}.cbtn.primary{background:linear-gradient(135deg,var(--accent-dark),var(--accent));border-color:var(--accent-glow)}
.fb{min-height:1.5em;text-align:center;margin:0 auto 12px;max-width:720px;font-size:.95rem;padding:0 6px}
.fb.hint{color:#ffe08a;background:rgba(255,215,64,.1);border:1px solid rgba(255,215,64,.35);border-radius:10px;padding:8px 12px}
.fb.ok{color:var(--success)}
.chipwrap{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0;min-height:44px}
.wchip{background:linear-gradient(135deg,var(--primary),var(--primary-light));border:2px solid rgba(74,158,255,.4);border-radius:10px;padding:8px 13px;color:#fff;font-family:'Fredoka',sans-serif;font-size:1.05rem;cursor:pointer;transition:.15s}
.wchip:hover{border-color:var(--gold);transform:translateY(-2px)}.wchip.used{opacity:.25;pointer-events:none}
.ansline{min-height:56px;background:rgba(14,26,43,.6);border:2px dashed rgba(133,193,255,.5);border-radius:12px;padding:8px}
.ansline.ok .wchip{border-color:var(--success);color:var(--success)}.ansline.bad .wchip{border-color:var(--error);color:#ffb4b4}
.deside{color:var(--accent-glow);font-size:1.15rem;font-family:'Fredoka',sans-serif;margin-bottom:6px}
.fcard{perspective:900px;max-width:520px;margin:0 auto 16px;height:240px;cursor:pointer}
.fin{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.fcard.flip .fin{transform:rotateY(180deg)}
.fside{position:absolute;inset:0;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:18px;border:2px solid rgba(133,193,255,.5);font-family:'Fredoka',sans-serif;font-size:2rem;text-align:center;padding:16px;background:linear-gradient(135deg,rgba(19,32,51,.98),rgba(26,66,98,.9))}
.fside.back{transform:rotateY(180deg);background:linear-gradient(135deg,#1a4262,#2d7acc);color:var(--gold)}
.fside small{font-size:.8rem;color:var(--text-muted);font-family:'Quicksand'}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:640px;margin:0 auto 14px}
.mcard{min-height:72px;background:linear-gradient(135deg,var(--primary),var(--primary-light));border:2px solid rgba(74,158,255,.4);border-radius:12px;color:#fff;font-family:inherit;font-weight:700;font-size:.85rem;cursor:pointer;padding:6px;transition:.2s}
.mcard.up{background:linear-gradient(135deg,var(--accent-dark),var(--accent));border-color:var(--gold)}.mcard.done{background:rgba(74,222,128,.25);border-color:var(--success);color:var(--success);pointer-events:none}
.hang{font-family:'Fredoka',sans-serif;font-size:2.2rem;letter-spacing:.35em;margin:10px 0}
.kb{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:560px;margin:0 auto 12px}
.kb button{width:38px;height:42px;border-radius:9px;border:2px solid rgba(74,158,255,.4);background:var(--primary-light);color:#fff;font-weight:700;font-family:inherit;cursor:pointer}
.kb button:disabled{opacity:.3}.kb button.g{background:rgba(74,222,128,.3);border-color:var(--success)}.kb button.b{background:rgba(255,82,82,.3);border-color:var(--error)}
.back-btn{position:fixed;top:12px;left:12px;z-index:100;display:none;background:var(--card);border:1px solid rgba(74,158,255,.4);border-radius:11px;padding:8px 14px;color:#fff;font-family:inherit;font-weight:700;font-size:.85rem;cursor:pointer}
/* Regel & Tabellen */
.rule table,.ref table{width:100%;border-collapse:collapse;margin:8px 0;font-size:.88rem}
.rule th,.rule td,.ref th,.ref td{border:1px solid rgba(133,193,255,.25);padding:6px 9px;text-align:left;vertical-align:top}
.rule th,.ref th{background:rgba(74,158,255,.2);color:var(--gold)}
.rule p,.ref p{margin:8px 0;font-size:.92rem}.ex{color:var(--accent-glow);font-style:italic}
.tablewrap{overflow-x:auto}
details{background:rgba(14,26,43,.55);border:1px solid rgba(74,158,255,.2);border-radius:12px;margin-bottom:8px;padding:2px 12px}
details summary{cursor:pointer;padding:10px 0;font-weight:700;color:var(--gold);font-family:'Fredoka',sans-serif}
#modal{position:fixed;inset:0;background:rgba(5,10,20,.85);z-index:200;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:20px}
#modal.on{display:flex}.mbox{background:linear-gradient(135deg,#132033,#1a4262);border:1px solid var(--accent);border-radius:18px;padding:22px;max-width:760px;width:100%;margin:auto}
.mbox h2{font-family:'Fredoka',sans-serif;color:var(--gold);margin-bottom:8px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--gold);padding:10px 18px;border-radius:14px;z-index:300;display:none;font-weight:700}
.badge{display:inline-block;margin:4px;padding:8px 12px;border-radius:12px;border:1px solid rgba(74,158,255,.3);background:rgba(14,26,43,.6);font-size:.85rem}.badge.on{border-color:var(--gold);background:rgba(255,215,64,.12)}.badge.off{opacity:.4;filter:grayscale(1)}
.plan-week{margin-bottom:10px}.day{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-top:1px solid rgba(133,193,255,.15);padding:6px 0}.day b{min-width:52px;color:var(--gold)}
.task{font-size:.8rem;padding:5px 10px;border-radius:9px;border:1px solid rgba(74,158,255,.35);background:rgba(26,66,98,.6);color:#fff;cursor:pointer;font-family:inherit;font-weight:600}
.task:hover{border-color:var(--accent-glow)}.task.done{background:rgba(74,222,128,.2);border-color:var(--success);color:var(--success)}
table.rl{width:100%;border-collapse:collapse;font-size:.85rem}table.rl td,table.rl th{border-bottom:1px solid rgba(133,193,255,.15);padding:5px 8px;text-align:left}table.rl th{color:var(--gold)}
.cloze{font-family:'Fredoka',sans-serif;font-size:1.15rem;line-height:2.4;text-align:left}
.cloze select{font-family:inherit;font-size:1.05rem;border-radius:8px;background:#0e1a2b;color:#fff;border:2px solid rgba(133,193,255,.5);padding:2px 4px}
.cloze .tin{font-size:1.05rem;width:9em}
.timer{color:var(--gold)}
@media(max-width:700px){h1{font-size:1.7rem}.sent{font-size:1.15rem}.mem{grid-template-columns:repeat(4,1fr)}.tabbtn{padding:6px 10px;font-size:.8rem}.fside{font-size:1.5rem}}

body.ingame header{padding-top:46px}

/* ===== Tenses Talk: Ergänzungen ===== */
body.ingame header{padding-top:46px}
.tlsvg{width:100%;max-width:560px;height:auto;display:block;margin:6px auto}
.tl-line{stroke:#85c1ff;stroke-width:3}.tl-arrow{fill:#85c1ff}.tl-now{stroke:#ffffff;stroke-width:2;stroke-dasharray:3 3;opacity:.7}
.tl-t{fill:#ffffff;font:700 12px Fredoka,Quicksand,sans-serif;letter-spacing:1px}.tl-t.dim{fill:#85c1ff;opacity:.8}.tl-l{fill:#ffd740;font:600 12.5px Quicksand,sans-serif}
.tl-dot{fill:#ffd740}.tl-dot2{fill:#4ade80}.tl-bar{fill:#ffd740}.tl-hit{stroke:#ff6b6b;stroke-width:4;stroke-linecap:round}
.tl-arc{fill:none;stroke:#ffd740;stroke-width:3;stroke-dasharray:5 4}.tl-arrowf{fill:#ffd740}
.tlmini{max-width:560px;margin:10px auto 0}
.explain{margin-top:14px;padding:12px 14px;border-radius:12px;background:rgba(74,222,128,.10);border:1px solid rgba(74,222,128,.45);line-height:1.55}
.sent.big{font-size:1.45rem}
.explain small{opacity:.8}
.model .say,.say{background:rgba(255,215,64,.08);border-left:4px solid var(--gold);padding:12px 14px;border-radius:10px;font-size:1.08rem;line-height:1.7}
.de-bridge{margin-top:12px;padding:10px 12px;border-radius:10px;background:rgba(74,158,255,.12);border:1px solid rgba(74,158,255,.35)}
.wrongc{color:#ff9d9d;text-decoration:line-through;text-decoration-color:rgba(255,157,157,.6)}.rightc{color:#8df0b0;font-weight:700}
.exrow{margin:3px 0}.tiny{background:none;border:none;cursor:pointer;font-size:.95rem;margin-left:6px;padding:0 4px}
.chip.static{cursor:default}.chip.static:hover{transform:none}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}.crumb{background:rgba(74,158,255,.18);border:1px solid rgba(74,158,255,.4);border-radius:999px;padding:3px 12px;font-size:.85rem}
.tbtn{text-align:left;cursor:pointer;font-family:inherit;color:inherit}.tbtn:hover{border-color:var(--gold)}
.rate{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}.rate span{margin-right:6px;font-weight:700}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0}.pairbox{background:rgba(14,26,43,.5);border:1px solid rgba(74,158,255,.3);border-radius:14px;padding:12px}
.pts{line-height:1.7;margin:10px 0 0 20px}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-top:10px}
.qtile{background:rgba(19,32,51,.8);border:2px solid rgba(74,158,255,.35);border-radius:14px;padding:12px 14px;text-align:left;color:#fff;font-family:inherit;cursor:pointer}
.qtile:hover{border-color:var(--gold)}.qtile.done{border-color:#4ade80}.qtile .qq{display:block;font-weight:700;margin-bottom:4px}.qtile small{opacity:.75}
.phr{display:flex;flex-direction:column;gap:6px}.phrbtn{text-align:left;background:rgba(14,26,43,.6);border:1px solid rgba(74,158,255,.3);color:#fff;border-radius:10px;padding:9px 12px;font-family:inherit;font-size:1rem;cursor:pointer}.phrbtn:hover{border-color:var(--gold)}
.transcript{margin:10px 0;padding:10px 12px;border-radius:10px;background:rgba(14,26,43,.7);border:1px dashed rgba(133,193,255,.5);font-style:italic}
.checks{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.chk{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border-radius:999px;border:1px solid rgba(74,158,255,.4);background:rgba(14,26,43,.5);cursor:pointer}.chk.on{border-color:#4ade80;background:rgba(74,222,128,.14)}
.lesson-step.done{opacity:.72}.lhead{display:flex;align-items:center;gap:6px;border:none;background:none;padding:0;font-size:1.1rem;cursor:pointer}.lhead .min{margin-left:auto;color:var(--gold);font-weight:700}
.lesson-step p{line-height:1.65}
.barlab{position:absolute;left:8px;top:0;font-size:.75rem;line-height:14px;color:#fff}.bar{position:relative}
.dim{opacity:.6}
@media(max-width:700px){.pair{grid-template-columns:1fr}.sent.big{font-size:1.2rem}}
@media print{#topnav,.back-btn,.noprint,.btnrow,.cbtn,.sbtn,.tiny{display:none!important}body{background:#fff!important;color:#000!important}.card{background:#fff!important;border:1px solid #888!important;color:#000!important;box-shadow:none!important;break-inside:avoid}h1,h2,h3,.subtitle{color:#000!important;-webkit-text-fill-color:#000!important}.lesson-step.done{opacity:1}}
.seqlist{list-style:none;padding:0;margin:10px 0;counter-reset:s}.seqitem{counter-increment:s;background:rgba(74,222,128,.12);border:2px solid rgba(133,193,255,.4);border-radius:12px;padding:10px 14px;margin:6px 0;cursor:pointer}
.seqitem::before{content:counter(s) ". ";font-weight:700;color:var(--gold)}.seqlist.ok .seqitem{border-color:var(--success)}.seqlist.bad .seqitem{border-color:var(--error);animation:shake .4s}

<script>
'use strict';
/* ===== Zeiten (schwer): Lückensätze mit Tipp-Antworten ===== */
/* {a|b} = Tipp-Lücke (Varianten), (hint) bleibt als Text stehen. Kurzformen werden automatisch erkannt. */
const TGAP = [
 // Present Simple
 ['My cousin {does not like} (not like) spiders, but she {loves} (love) snakes.','ps','Negative: does not + base verb. Love is a state verb, so it stays in the Present Simple.'],
 ['Trains to Salzburg {leave} (leave) every hour, and the journey {takes} (take) about three hours.','ps','Timetables and facts → Present Simple.'],
 ['How often {does} your brother {play} (play) volleyball?','ps','Question: does + subject + base verb.'],
 ['She {always goes} (always / go) to bed at ten, and she {never watches} (never / watch) TV after eight.','ps','Frequency adverbs stand before the main verb; he/she/it needs -s or -es.'],
 ['He {tries} (try) hard, but he {misses} (miss) the bus every morning.','ps','Consonant + y → -ies; after -s, -sh, -ch, -x → -es.'],
 ['I {do not understand} (not understand) this exercise. What {does} this word {mean} (mean)?','ps','State verbs (understand, mean) have no -ing form.'],
 ['This soup {tastes} (taste) great, and it {smells} (smell) even better.','ps','Verbs of the senses (taste, smell) describing a quality are state verbs.'],
 ['My teacher {has} (have) three dogs, and she {washes} (wash) them every Sunday.','ps','Have = own (state); every Sunday = routine.'],
 ['Mia {hardly ever eats} (hardly ever / eat) sweets, because she {does not like} (not like) sugar.','ps','Adverb before the main verb; negative with does not.'],
 ['{Do} you and your friends often {meet} (meet) after school?','ps','Question with you + friends → do.'],
 ['If you {mix} (mix) blue and yellow, you {get} (get) green.','ps','General truth with if → Present Simple in both parts.'],
 // Present Continuous
 ['Be quiet! I {am trying} (try) to concentrate.','pc','Happening right now → am / is / are + -ing.'],
 ['Why {are} you {wearing} (wear) a jacket? It is thirty degrees outside!','pc','Right now, so Present Continuous.'],
 ['My brother {is being} (be) really annoying today.','pc','be + -ing describes behaviour at the moment: he is behaving annoyingly.'],
 ['Ella {is always borrowing} (always / borrow) my pens, and she never gives them back!','pc','always + -ing = an annoying habit.'],
 ['I {am meeting} (meet) Anna at six, and she {is bringing} (bring) her cousin.','pc','Personal arrangement for the future → Present Continuous.'],
 ['Your English {is getting} (get) better every month.','pc','A change that is developing → Present Continuous.'],
 ['I {do not know} (not know) why she {is laughing} (laugh).','pc','Know is a state verb; laughing is happening right now.'],
 ['Max cannot answer the phone because he {is having} (have) a shower.','pc','Have = take/do something (action) → -ing is possible.'],
 ['Look at him! He {is wearing} (wear) two different socks.','pc','Look! → right now.'],
 ['We {are staying} (stay) with my aunt this week, because there {is} (be) no heating at home.','pc','Temporary situation → Present Continuous; a state (there is) stays simple.'],
 ['{Are} you {listening} (listen) to me, or {are} you {thinking} (think) about lunch again?','pc','Think about = a process in progress.'],
 // Past Simple
 ['When I was little, we {went} (go) to the lake every summer, and my dad always {let} (let) me steer the boat.','pas','Past habit → Past Simple; go – went, let – let.'],
 ['She {did not hear} (not hear) the alarm, so she {slept} (sleep) until nine.','pas','Negative: did not + base verb; sleep – slept.'],
 ['{Did} you {see} (see) the match last night?','pas','Question: did + subject + base verb.'],
 ['He {stopped} (stop), {looked} (look) around and {ran} (run) away.','pas','A sequence of finished actions; stop doubles the p.'],
 ['I {studied} (study) hard, but I {did not pass} (not pass) the test.','pas','Consonant + y → -ied.'],
 ['Where {did} you {buy} (buy) that jacket, and how much {did} it {cost} (cost)?','pas','Question words + did + base verb; cost is the same in all forms.'],
 ['They {planned} (plan) a picnic, but it {rained} (rain) all day.','pas','plan → planned (short vowel + consonant doubles).'],
 ['Who {broke} (break) the window? – I {did not see} (not see) anything.','pas','Subject question has no did: Who broke…? But the negative needs did not.'],
 ['I {lost} (lose) my keys last week, but a boy {found} (find) them in the park.','pas','Last week = finished time.'],
 ['She {wrote} (write) three letters and {sent} (send) them on Monday.','pas','Irregular: write – wrote, send – sent.'],
 ['We {travelled|traveled} (travel) to Spain last year and {visited} (visit) three cities.','pas','British: travelled; American: traveled.'],
 ['My grandpa {taught} (teach) me chess when I {was} (be) seven.','pas','teach – taught; be – was/were.'],
 // Present Perfect
 ['{Have} you ever {eaten} (eat) octopus?','pp','Experience without a time → Have you ever + participle.'],
 ['She {has known} (know) him for ten years, but they {have never talked} (never / talk) about it.','pp','for + period → Present Perfect.'],
 ['It is the best film I {have ever seen} (ever / see).','pp','Superlative + ever → Present Perfect.'],
 ['We {have not finished} (not finish) the project yet.','pp','yet → Present Perfect.'],
 ['Tom {has just gone} (just / go) out, but he will be back soon.','pp','just → Present Perfect.'],
 ['How long {have} you {had} (have) this phone?','pp','How long (until now) → Present Perfect.'],
 ['This is the first time I {have been} (be) on a plane.','pp','It is the first time … → Present Perfect.'],
 ['She {has been} (be) to Rome twice, but she {has never seen} (never / see) the Colosseum.','pp','Experience in a lifetime.'],
 ['I {have already read} (already / read) that book. I {read} (read) it in June.','pp','Have read (no time) vs read (Past Simple, in June). Same spelling, different tense!'],
 ['We {have been} (be) friends since primary school.','pp','since + starting point.'],
 ['{Has} the post {come} (come) yet?','pp','yet in a question → Present Perfect.'],
 ['He {has lost} (lose) his wallet, so he cannot pay for the ticket.','pp','Result in the present.'],
 ['They {have not seen} (not see) each other for ages.','pp','for ages = up to now.'],
 // Zukunft
 ['Look at those clouds! It {is going to rain} (rain) any minute.','fut','Evidence now → going to.'],
 ['The phone is ringing. – I {will get} (get) it!','fut','Spontaneous decision → will.'],
 ['I {am going to learn} (learn) the piano next year. I have already found a teacher.','fut','Plan made before → going to.'],
 ['If it {rains} (rain) tomorrow, we {will stay|are going to stay} (stay) at home.','fut','After if: Present Simple (not will).'],
 ['I will call you as soon as I {get} (get) home.','fut','After as soon as: Present Simple.'],
 ['I {am seeing|am going to see} (see) the dentist at four on Friday.','fut','Arrangement → Present Continuous (going to is possible too).'],
 ['The film {starts} (start) at 8.30 tonight.','fut','Timetable → Present Simple.'],
 ['Perhaps we {will go} (go) to the cinema – I have not decided yet.','fut','Perhaps + undecided → will.'],
 ['Do not worry, I {will not tell|am not going to tell} (not tell) anybody.','fut','Promise → will not (won\'t).'],
 ['Wait! You {are going to drop} (drop) the glass!','fut','You can see it happening → going to.'],
 ['Before you {leave} (leave), I {will give|am going to give} (give) you my address.','fut','Time clause with before → Present Simple.'],
 ['He {is going to be|will be} (be) late again – it is already eight and he has not left yet.','fut','Evidence → going to (will is acceptable for a guess).'],
 ['What time {does} the shop {close} (close) tomorrow?','fut','Opening hours = timetable → Present Simple.'],
 ['I think she {will win|is going to win} (win) the competition, but I am not sure.','fut','Opinion (I think) → will.'],
 // Mischung
 ['Yesterday I {met} (meet) Lisa. We {have not seen} (not see) each other since June, so we {talked} (talk) for hours. Next week we {are going} (go) to the cinema together.','mix','Past Simple (yesterday), Present Perfect (since June), Present Continuous (arrangement).'],
 ['My brother {works} (work) in Berlin now. He {moved} (move) there in 2022, and he {has had} (have) the same flat since then.','mix','Present Simple (routine), Past Simple (in 2022), Present Perfect (since then).'],
 ['Listen! Somebody {is playing} (play) the piano. I think it {is} (be) Anna – she {has played} (play) since she was five.','mix','Right now; opinion with a state verb; since → Present Perfect.'],
 ['Sorry, I {am} (be) late. My bus {broke} (break) down, and I {have been} (be) here only for two minutes.','mix','State now; finished event; for two minutes.'],
 ['Tom {does not eat} (not eat) meat. He {became} (become) a vegetarian two years ago, and he {has never regretted} (never / regret) it.','mix','Habit; ago → Past Simple; never … it → Present Perfect.'],
 ['I {have never been} (never / be) to Paris, but I {am going to visit|will visit} (visit) it next summer. My aunt {lives} (live) there, so I {will stay|am going to stay} (stay) with her.','mix','Experience; plan; fact; consequence.']
];

/* ===== Zeiten: Auswahl-Fallen [Satz, richtig, [falsch x3], Bereich, Erklärung] ===== */
const TMC = [
 ['I ___ that you are right.','think',['am thinking','have thought','thinks'],'pc','Think as an opinion is a state → Present Simple.'],
 ['Listen! Somebody ___ at the door.','is knocking',['knocks','knocked','has knocked'],'pc','Right now → Present Continuous.'],
 ['She ___ to music when she studies.','listens',['is listening','listened','will listen'],'ps','A habit in a when-clause → Present Simple.'],
 ['My bus ___ at 7.10 every day.','leaves',['is leaving','left','has left'],'ps','Routine and timetable → Present Simple.'],
 ['Tom usually drinks coffee, but today he ___ tea.','is drinking',['drinks','drink','has drunk'],'pc','Today = different from the routine → Present Continuous.'],
 ['Stop it! Why ___ at me like that?','are you looking',['do you look','did you look','have you looked'],'pc','Happening right now → Present Continuous.'],
 ['This bag ___ to my sister.','belongs',['is belonging','belong','belonged'],'ps','Belong is a state verb: no -ing.'],
 ["I can't talk now. I ___ dinner.",'am cooking',['cook','cooks','will cook'],'pc','In progress at this moment.'],
 ['He never ___ his homework on time.','hands in',['hand in','is handing in','handing in'],'ps','Never + he → Present Simple with -s.'],
 ['I ___ my homework yet.',"haven't finished",["am not finishing","don't finish","wasn't finishing"],'pp','yet → Present Perfect.'],
 ['My parents ___ married in 1998.','got',['have got','get','are getting'],'pas','1998 is a finished time → Past Simple.'],
 ['How long ___ in Graz? – Since 2015.','have you lived',['did you live','do you live','are you living'],'pp','Since → Present Perfect.'],
 ['When ___ the accident?','did it happen',['has it happened','does it happen','is it happening'],'pas','When + question → Past Simple.'],
 ['She ___ in London for three years, but now she lives in Vienna.','lived',['has lived','lives','is living'],'pas','The period is finished → Past Simple.'],
 ['I ___ to Italy three times so far.','have been',['went','was','am going'],'pp','So far → Present Perfect.'],
 ['We ___ him since Monday.',"haven't seen",["didn't see","don't see","aren't seeing"],'pp','Since Monday → Present Perfect.'],
 ['Yesterday I ___ my old friend Jan at the station.','met',['have met','meet','am meeting'],'pas','Yesterday → Past Simple.'],
 ['This is the most boring book I ___.','have ever read',['ever read','had ever read','did ever read'],'pp','Superlative + ever → Present Perfect.'],
 ['___ you ever ridden a horse?','Have',['Did','Do','Are'],'pp','Ever + experience → Have you ever + participle.'],
 ['Mozart ___ over 600 works.','wrote',['has written','writes','is writing'],'pas','Mozart is dead → Past Simple.'],
 ['I ___ my dentist appointment last week.','forgot',['have forgotten','forget','am forgetting'],'pas','Last week → Past Simple.'],
 ['He ___ in this company since 2010.','has worked',['worked','works','is working'],'pp','Since → Present Perfect.'],
 ['Why have you bought so much paint? – We ___ paint the kitchen.','are going to',['will','would','are'],'fut','A plan made before → going to.'],
 ['Careful! You ___ spill your coffee!','are going to',['will','are','would'],'fut','You can see it coming → going to.'],
 ["I'm sure you ___ this book.",'will love',['loved','have loved','are loving'],'fut','Opinion about the future → will.'],
 ['As soon as the film ___, we will leave.','ends',['will end','ended','is ending'],'fut','Time clause → Present Simple.'],
 ['I ___ my grandparents this weekend. We have arranged it.','am visiting',['will visit','visit','visited'],'fut','Arrangement → Present Continuous.'],
 ['Promise me you ___ tell anybody.',"won't",["don't","haven't","didn't"],'fut','Promise → will not.'],
 ['Before I ___ for the airport, I will call you.','leave',['will leave','left','am leaving'],'fut','Time clause → Present Simple.'],
 ['The shop ___ at six tomorrow, so we must hurry.','closes',['closed','has closed','close'],'fut','Timetable → Present Simple.'],
 ['If you ___ me, I will help you.','ask',['will ask','asked','are asking'],'fut','After if: Present Simple.'],
 ['I have decided: next summer I ___ work on a farm.','am going to',['will','work','have'],'fut','Decision already made → going to.'],
 ['The phone is ringing. – I ___ it!','will get',['am getting','get','got'],'fut','Spontaneous decision → will.']
];

/* ===== Fehlersuche Zeiten [richtig, falsch1, falsch2, Bereich, Hinweis] ===== */
const TERR = [
 ['I have lived here since 2019.','I live here since 2019.','I am living here since 2019.','pp','Since + starting point up to now → Present Perfect.'],
 ["She doesn't know the answer.","She isn't knowing the answer.","She doesn't knows the answer.",'ps','Know is a state verb; after doesn\'t the verb has no -s.'],
 ['When I get home, I will call you.',"When I will get home, I call you.","When I'll get home, I call you.",'fut','No will in the when-clause.'],
 ['Did you finish your homework yesterday?','Have you finished your homework yesterday?','Do you finish your homework yesterday?','pas','Yesterday → Past Simple.'],
 ['He has never been to Spain.','He never has been to Spain.','He has been never to Spain.','pp','never goes between has and the participle.'],
 ['How long have you known her?','How long do you know her?','How long are you knowing her?','pp','How long (until now) → Present Perfect, and know has no -ing.'],
 ['She usually drinks tea, but today she is drinking coffee.','She is usually drinking tea, but today she drinks coffee.','She usually drink tea, but today she drinks coffee.','pc','Routine = Present Simple, today = Present Continuous.'],
 ["Look at the sky! It's going to snow.","Look at the sky! It will to snow.","Look at the sky! It goes to snow.",'fut','Evidence → going to.'],
 ['I bought this jacket last week.','I have bought this jacket last week.','I buy this jacket last week.','pas','Last week → Past Simple.'],
 ['The film starts at nine tonight.','The film will starts at nine tonight.','The film is start at nine tonight.','fut','Timetable → Present Simple.'],
 ["I didn't see him yesterday.","I didn't saw him yesterday.","I haven't seen him yesterday.",'pas','did not + base verb.'],
 ['Have you ever tried sushi?','Did you ever tried sushi?','Have you ever try sushi?','pp','Have + ever + participle.'],
 ['My sister has been to Rome twice.','My sister has gone to Rome twice.','My sister is to Rome twice.','pp','Been = visited and returned; gone = still there.'],
 ["Are you coming to the party tomorrow? I'm taking my cousin.","Are you coming to the party tomorrow? I take my cousin.","Are you coming to the party tomorrow? I took my cousin.",'fut','Arrangement → Present Continuous.']

/* ===== Profi-Wissen ===== */
const TNOTES = {
 ps:['Spelling of he / she / it: -es after s, sh, ch, x, o (goes, watches); consonant + y → -ies (tries); vowel + y → -ys (plays).','Frequency adverbs stand before the main verb but after be: She always goes. She is always late.','State verbs have no -ing form: know, understand, believe, remember, like, love, hate, want, need, prefer, belong, own, seem, mean, cost, taste, smell.','Time clauses (when, as soon as, before, after, until, if) use the Present Simple for the future: When I get home, I will call you.','Questions and negatives: does / doesn\'t + base verb – the -s moves to does.'],
 pc:['State vs action: I think it is good (opinion) – I am thinking about it (process). I have a bike (own) – I am having lunch (action).','be + -ing describes behaviour: He is being silly = he is behaving silly right now.','always + -ing expresses annoyance: She is always losing her keys!','Arrangements in the future: I am meeting Tom at six.','Spelling: running, sitting, making, lying, dying.'],
 pas:['Spelling: stop → stopped, plan → planned (short vowel + one consonant doubles); study → studied; play → played; travel → travelled (BrE).','Negatives and questions: did / did not + base verb – never "did not went".','Finished-time words: yesterday, last week, in 2019, two years ago, when (question). They exclude the Present Perfect.','Subject questions have no did: Who broke the window? (not Who did break …).','Irregular verbs: learn the three forms together (see → saw → seen).'],
 pp:['Form: have / has + past participle. Position of adverbs: I have already finished. / Have you finished yet? / I have not finished yet. / She has never been there.','for + period (for two years), since + starting point (since 2019).','been vs gone: She has been to Rome (she is back). She has gone to Rome (she is still there).','Typical frames: It is the first time I have … / the best film I have ever seen / How long have you …?','No finished-time words (yesterday, last year, when …?). There the Past Simple is needed.'],
 fut:['will: spontaneous decisions, offers, promises, opinions (I think, probably, perhaps).','going to: plans made before the moment of speaking, and predictions with evidence you can see now.','Present Continuous: personal arrangements with a fixed time and place. Present Simple: timetables.','After if, when, as soon as, before, after, until: Present Simple – never will.','won\'t can also express refusal: The car won\'t start.']
};
const SUBNAMES = { ps:'Present Simple', pc:'Present Continuous', pas:'Past Simple', pp:'Present Perfect', fut:'will & going to', mix:'Tense mix', prt:'Principal parts', con:'Sentence starters', cmp:'Comparison' };


/* ===== Stammformen ===== */
const IRREG = ('be|was/were|been|sein;beat|beat|beaten|schlagen;become|became|become|werden;begin|began|begun|beginnen;bite|bit|bitten|beißen;blow|blew|blown|blasen;break|broke|broken|brechen;bring|brought|brought|bringen;' +
  'build|built|built|bauen;buy|bought|bought|kaufen;catch|caught|caught|fangen;choose|chose|chosen|wählen;come|came|come|kommen;cost|cost|cost|kosten;cut|cut|cut|schneiden;dig|dug|dug|graben;do|did|done|tun;' +

  'mean|meant|meant|bedeuten;meet|met|met|treffen;pay|paid|paid|bezahlen;put|put|put|legen/stellen;read|read|read|lesen;ride|rode|ridden|reiten/fahren;ring|rang|rung|läuten;rise|rose|risen|aufgehen;run|ran|run|rennen;' +
  'say|said|said|sagen;see|saw|seen|sehen;sell|sold|sold|verkaufen;send|sent|sent|senden;set|set|set|setzen;shine|shone|shone|scheinen;shoot|shot|shot|schießen;show|showed|shown|zeigen;shut|shut|shut|schließen;' +
  'sing|sang|sung|singen;sink|sank|sunk|sinken;sit|sat|sat|sitzen;sleep|slept|slept|schlafen;speak|spoke|spoken|sprechen;spend|spent|spent|ausgeben/verbringen;stand|stood|stood|stehen;steal|stole|stolen|stehlen;' +

  'wake|woke|woken|aufwachen;wear|wore|worn|tragen;win|won|won|gewinnen;write|wrote|written|schreiben').split(';').map(s => {
  const p = s.split('|'); return { inf: p[0], past: p[1].split('/'), pp: p[2].split('/'), de: p[3] };
});
const VERB = Object.fromEntries(IRREG.map(v => [v.inf, v]));

/* [Verb, Satz Past Simple, Satz Present Perfect] – {…} = Lücke, (…) = Hinweis */
const VSENT = [

let G = null;

const GRADE_NAMES = { 1: 'Sehr gut', 2: 'Gut', 3: 'Befriedigend', 4: 'Genügend', 5: 'Nicht genügend' };
function showView(v) {

}
function startRun(title, items, opts) {

  $('#modeInd').textContent = title; showView('game'); nextItem();
}
function endRun() { stopSpeak(); G = null; showView('menu'); renderAll(); }
function note(sub, ok) {

}
function gain(n) { if (!G) return; G.xp += n; addXP(n); }
function nextItem() {

  const it = G.items[G.idx]; G.cur = it; DB.seen[it.key] = (DB.seen[it.key] || 0) + 1;
  $('#nextRow').style.display = 'none'; hint('');
  $('#pfill').style.width = (G.idx / G.total * 100) + '%'; $('#ptext').textContent = `${G.idx + 1} / ${G.total}`;
  const box = $('#qArea'); box.innerHTML = '';

}
function showNext(label) { const b = $('#nextBtn'); b.textContent = label || 'Weiter ➜'; $('#nextRow').style.display = 'flex'; setTimeout(() => b.focus(), 30); }
function goNext() { if (!G) return; G.idx++; nextItem(); }
function hint(t, cls) { const f = $('#fb'); f.className = 'fb ' + (cls || 'hint'); f.textContent = t || ''; if (!t) f.className = 'fb'; }
const explainBox = html => h('div', { class: 'explain', html });
const exam = () => G && G.opts.exam;

function rMC(it, box) {
  box.append(h('div', { class: 'qprompt' }, it.prompt));
  let blank = null;
  if (it.big) box.append(h('div', { class: 'sbox' }, h('div', { class: 'sent big' }, it.big)));
  if (it.q) { const p = it.q.split('___'); blank = h('span', { class: 'blank' }, '      '); box.append(h('div', { class: 'sbox' }, h('div', { class: 'sent' }, p[0], blank, p[1] || ''))); }
  let tries = 0; const wrap = h('div', { class: 'opts' + (it.opts.some(o => o.length > 24) ? ' wide' : '') });
  const finish = (first, b) => {
    note(it.sub, first); if (first) gain(8); else G.wrong.push({ s: it.q ? it.q.replace('___', it.correct) : (it.big ? it.big + ' → ' + it.correct : it.correct), e: it.e });

    box.append(explainBox(`<b>✔ ${it.correct}</b>${it.e ? '<br>' + it.e : ''}`));
    const say = it.q ? it.q.replace('___', it.correct) : (it.plain && !it.big ? it.correct : null); if (say && it.sub !== 'cmp' || (say && it.sub === 'cmp')) speak(say);

  it.opts.forEach(o => {
    const b = h('button', { class: 'opt', onclick: () => {
      if (b.disabled) return;
      if (o === it.correct) { [...wrap.children].forEach(x => x.disabled = true); b.classList.add('correct'); hint(''); finish(tries === 0, b); }
      else if (exam()) { [...wrap.children].forEach(x => { x.disabled = true; if (x.textContent === it.correct) x.classList.add('correct'); }); b.classList.add('wrong'); finish(false, b); }
      else { tries++; b.classList.add('wrong'); b.disabled = true; hint('Not quite – look again and try once more. 🙂'); }
    } }, o);

function rGap(it, box) {
  if (it.title) box.append(h('div', { class: 'qprompt' }, '📖 ' + it.title));
  box.append(h('div', { class: 'qprompt' }, it.prompt || 'Complete the sentence (put the verbs in the correct form):'));
  if (it.big) box.append(h('div', { class: 'sbox' }, h('div', { class: 'sent big' }, it.big)));
  const wrap = h('div', { class: 'sbox cloze' + (it.long ? ' long' : '') }); const fields = [];
  it.segs.forEach(s => {
    if (s.t != null) wrap.append(document.createTextNode(s.t));
    else if (s.b) { const w = Math.max(6, Math.max(...s.ans.map(a => a.length)) + 2); const inp = h('input', { class: 'tin', type: 'text', autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false', style: `width:${w}ch;display:inline-block` }); inp._s = s; fields.push(inp); wrap.append(inp); }
    else { const sel = h('select', {}, h('option', { value: '' }, '…'), ...s.options.map(o => h('option', { value: o }, o))); sel._s = s; fields.push(sel); wrap.append(sel); }

function rSeq(it, box) {

    modeBtn('🧬 Muster erkennen (8)', 'A–B–C, A–B–B, A–A–A oder A–B–A: erkenne das Muster und ordne Verben richtig ein', run('Stammformen – Muster', () => prtPatternItems(8))),
    modeBtn('🔠 Regelmäßige Verben: Rechtschreibung (10)', 'stop → stopped, study → studied, travel → travelled', run('Rechtschreibung der regelmäßigen Verben', () => prtRegItems(10)))));
  const fam = h('div', { class: 'card ref' }, h('h2', {}, '🧬 Verb-Familien'), h('div', { class: 'desc' }, 'Verben, die sich ähnlich verhalten, lernen sich zusammen leichter.'));
  Object.entries(FAMILIES).forEach(([name, list]) => fam.append(h('p', {}, h('b', {}, name + ': '), list.map(v => trip(VERB[v])).join('  ·  '))));

/* ---------- Satzanfänge ---------- */

/* ---------- Story Studio ---------- */
const STARTER_LIST = uniq(STARTERS.flatMap(g => g[1].map(x => x[0].replace(/[,…]/g, '').trim()))).filter(x => x && x.split(' ').length <= 4).sort((a, b) => b.length - a.length);
function analyse(text) {
  const sents = text.replace(/\s+/g, ' ').trim().split(/(?<=[.!?])\s+/).filter(Boolean);
  const out = { n: sents.length, starters: [], warn: [], comp: [], sup: [], fut: [], pp: [], past: 0 };
  const irrPast = new Set(IRREG.flatMap(v => v.past.map(x => x.toLowerCase())));
  const irrPP = new Set(IRREG.flatMap(v => v.pp.map(x => x.toLowerCase())));
  sents.forEach(s => {
    const low = s.toLowerCase();
    const st = STARTER_LIST.find(x => low.startsWith(x.toLowerCase() + ' ') || low.startsWith(x.toLowerCase() + ','));
    if (st) { out.starters.push(st); const after = s.slice(st.length); const clause = /^(when|while|as soon as|after|before|as|until|by the time|once|if|although|though|even though)$/i.test(st);
      if (!clause && !after.startsWith(',') && /^(first|first of all|at first|to begin with|suddenly|finally|at last|in the end|eventually|however|meanwhile|afterwards|after that|unfortunately|luckily|fortunately|surprisingly|one day|later|in addition|besides|therefore|for example|in conclusion|on the other hand|at the same time)$/i.test(st)) out.warn.push(`Nach “${st}” am Satzanfang fehlt ein Komma: ${s}`); }
    if (/\b(\w+er|more \w+|better|worse|less|further|farther) than\b/i.test(s)) out.comp.push(s);
    if (/\bthe (\w+est|most \w+|best|worst|least|furthest|farthest)\b/i.test(s)) out.sup.push(s);
    if (/\b(will|won't|'ll)\s+\w+|\b(am|is|are|'m|'s|'re) going to\b/i.test(s)) out.fut.push(s);
    if (/\b(have|has|'ve|haven't|hasn't)\s+(?:(?:never|ever|just|already|not|still)\s+)?(\w+ed|been|gone|\w+en|\w+n|done|seen|met|had|made|said|heard|found|got|kept|left|lost|read|run|sung|won|written)\b/i.test(s)) out.pp.push(s);
    if (/\bmore \w+er\b|\bmost \w+est\b|\bmore (better|bigger|taller|faster|older|younger|easier)\b|\bmost (best|biggest|tallest|fastest)\b/i.test(s)) out.warn.push('Doppelte Steigerung: nicht “more bigger”, sondern “bigger”: ' + s);
    if (/\bmore (\w+) than\b/i.test(s) === false && /\bthan\b/i.test(s) === false && /\b\w+er\b/.test(s) && false) { }
    s.split(/\W+/).forEach(w => { const lw = w.toLowerCase(); if (irrPast.has(lw) || /^[a-z]{3,}ed$/.test(lw)) out.past++; });
    if (/\bgoed\b|\bbringed\b|\bbuyed\b|\bseed\b|\bteached\b|\bthinked\b|\beated\b|\bwrited\b/i.test(s)) out.warn.push('Unregelmäßiges Verb: Past Simple prüfen: ' + s);
    if (/\bsince \d+ (years|months|days|weeks)\b|\bfor (20\d\d|19\d\d)\b/i.test(s)) out.warn.push('since + Zeitpunkt, for + Zeitraum: ' + s);
    if (/\bwhen\b[^,.]*\bwill\b/i.test(s) && /\bwhen\b[^,.]*\bwill\b[^,.]*,/i.test(s)) out.warn.push('Nach when / as soon as / before steht für die Zukunft Present Simple, nicht will: ' + s);
  });
  out.starters = uniq(out.starters); return out;
}
function rStudio(el) {
  const saved = (DB.studio && DB.studio.text) || '';
  const ta = h('textarea', { class: 'studio', rows: 9, placeholder: 'Schreibe hier eine kleine Geschichte (mindestens sechs Sätze) …\n\nZum Beispiel: Last summer, my family and I travelled to Italy. First, we …' }); ta.value = saved;
  const res = h('div', { class: 'studiores' });
  const draw = () => {
    DB.studio = { text: ta.value }; saveDB(); const a = analyse(ta.value); res.innerHTML = '';
    if (!ta.value.trim()) return;
    const chk = (ok, t) => h('div', { class: 'chk2' + (ok ? ' ok' : '') }, (ok ? '✔ ' : '○ ') + t);
    res.append(h('div', { class: 'checklist' }, chk(a.n >= 6, `Mindestens 6 Sätze (${a.n})`), chk(a.starters.length >= 4, `Mindestens 4 verschiedene Starter (${a.starters.length}${a.starters.length ? ': ' + a.starters.join(', ') : ''})`), chk(a.pp.length >= 1, 'Ein Satz im Present Perfect'), chk(a.fut.length >= 1, 'Ein Satz mit will oder going to'), chk(a.comp.length >= 1, 'Ein Komparativ (… than …)'), chk(a.sup.length >= 1, 'Ein Superlativ (the …est / the most …)'), chk(!a.warn.length, 'Keine Hinweise offen')));
    if (a.warn.length) res.append(h('div', { class: 'explain' }, h('b', {}, 'Hinweise'), h('ul', { class: 'pts' }, a.warn.slice(0, 6).map(w => h('li', {}, w)))));
  };
  ta.oninput = () => { clearTimeout(draw.t); draw.t = setTimeout(draw, 350); };
  el.append(card('✍️ Story Studio', 'Schreibe selbst eine kurze Geschichte. Die Seite prüft keine Rechtschreibung, aber sie zeigt dir, welche Starter du verwendet hast, ob Kommas fehlen und ob alle vier Themen vorkommen.', ta, res));
  draw();
}

    modeBtn('✍️ Drei Stufen schreiben (12)', 'Grundform gegeben, du schreibst Komparativ und Superlativ', run('Steigerung – Stufen schreiben', () => kTriItems(12))),
    modeBtn('🪤 Mehrfachauswahl (12)', 'Fallen wie than / then, the + Superlativ, less / fewer, as … as', run('Steigerung – Auswahl', () => kMcItems(12))),
    modeBtn('📝 Sätze ergänzen (10)', 'Aus dem Adjektiv in Klammern die passende Form bilden', run('Steigerung – Sätze', () => kGapItems(10))),

/* ---------- Nachschlagen ---------- */
function rRef(el) {
  el.append(h('div', { class: 'chips', style: 'margin-bottom:12px' }, [['verbs', 'Unregelmäßige Verben'], ['starters', 'Starter'], ['adj', 'Steigerung']].map(([id, l]) => h('button', { class: 'chip' + (V.ref === id ? ' on' : ''), onclick: () => { V.ref = id; renderAll(); } }, l))));
  const sp = t => TTS ? h('button', { class: 'tiny', onclick: () => speak(t) }, '🔊') : '';
  if (V.ref === 'verbs') el.append(card('Unregelmäßige Verben', `${IRREG.length} Verben mit Übersetzung. Tippe auf 🔊, um die drei Formen zu hören.`, h('div', { class: 'tablewrap' }, h('table', { class: 'rl' }, h('tr', {}, h('th', {}, 'Infinitive'), h('th', {}, 'Past Simple'), h('th', {}, 'Past Participle'), h('th', {}, 'Deutsch'), h('th', {})), ...IRREG.map(v => h('tr', {}, h('td', {}, v.inf), h('td', {}, v.past.join(' / ')), h('td', {}, v.pp.join(' / ')), h('td', {}, v.de), h('td', {}, sp(`${v.inf}. ${v.past[0]}. ${v.pp[0]}`))))))));
  if (V.ref === 'starters') STARTERS.forEach(([t, list]) => el.append(card(t, '', h('div', { class: 'tablewrap' }, h('table', { class: 'rl' }, ...list.map(([p, de, ex]) => h('tr', {}, h('td', {}, h('b', {}, p)), h('td', {}, de), h('td', {}, ex, sp(ex)))))))));
  if (V.ref === 'adj') el.append(card('Steigerung von A bis Z', '', h('div', { class: 'tablewrap' }, h('table', { class: 'rl' }, h('tr', {}, h('th', {}, 'positive'), h('th', {}, 'comparative'), h('th', {}, 'superlative'), h('th', {}, 'Regel')), ...ADJ.map(r => h('tr', {}, h('td', {}, r[0]), h('td', {}, r[1].join(' / ')), h('td', {}, 'the ' + r[2].join(' / the ')), h('td', {}, r[3])))))));
}

/* ---------- Fortschritt ---------- */
function rProg(el) {
  const lv = level(DB.xp), acc = DB.answered ? Math.round(DB.correct / DB.answered * 100) + ' %' : '–';
  el.append(card('📊 Dein Fortschritt', '', h('div', { class: 'stats' }, stat('Level', lv.n), stat('XP', DB.xp), stat('Aufgaben', DB.answered), stat('Auf Anhieb richtig', acc))));
  el.append(card('Nach Themen', 'Anteil der Antworten, die beim ersten Versuch richtig waren.', h('table', { class: 'rl' }, ...Object.keys(SUBNAMES).map(k => { const s = DB.tst[k], p = s ? Math.round(s.c / s.n * 100) : null; return h('tr', {}, h('td', {}, SUBNAMES[k]), h('td', {}, p === null ? h('span', { class: 'dim' }, 'noch nichts geübt') : h('div', { class: 'bar' + (p >= 70 ? '' : ' gold') }, h('i', { style: 'width:' + p + '%' }), h('span', { class: 'barlab' }, p + ' %  (' + s.n + ')')))); }))));
  const inp = h('input', { type: 'file', accept: '.json', style: 'display:none', onchange: e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { try { DB = Object.assign(defaultDB(), JSON.parse(r.result)); saveDB(); renderAll(); toast('Fortschritt geladen ✔'); } catch (er) { toast('Die Datei konnte nicht gelesen werden.'); } }; r.readAsText(f); } });
  el.append(card('💾 Sichern & Einstellungen', 'Der Fortschritt liegt im Browser dieses Geräts. Mit der Sicherung kannst du ihn auf ein anderes Gerät mitnehmen.', h('div', { class: 'btnrow' }, sbtn('⬇ Fortschritt sichern', () => { const b = new Blob([JSON.stringify(DB)], { type: 'application/json' }); const a = h('a', { href: URL.createObjectURL(b), download: 'challenge-plus-fortschritt.json' }); document.body.append(a); a.click(); a.remove(); }), sbtn('⬆ Fortschritt laden', () => inp.click()), inp, TTS ? sbtn(DB.sound ? '🔊 Ton: an' : '🔇 Ton: aus', () => { DB.sound = !DB.sound; saveDB(); renderAll(); }) : '', sbtn('🗑 Zurücksetzen', () => { if (confirm('Wirklich alles zurücksetzen?')) { DB = defaultDB(); saveDB(); renderAll(); } }))));
}

/* ==================== Aufbau ==================== */
function renderAll() {
  const nav = $('#topnav'); nav.innerHTML = '';
  TABS.forEach(([id, label]) => nav.append(h('button', { class: 'tabbtn' + (V.tab === id ? ' on' : ''), onclick: () => go(id) }, label)));
  const root = $('#tabs'); root.innerHTML = ''; const el = h('div', { class: 'tab on' }); root.append(el);
  ({ home: rHome, ten: rTen, prt: rPrt, con: rCon, cmp: rCmp, tests: rTests, ref: rRef, prog: rProg })[V.tab](el);
}
function init() {
  $('#backBtn').onclick = endRun; $('#nextBtn').onclick = goNext;
  document.addEventListener('keydown', e => { if (!G) return; const t = e.target && e.target.tagName; if (e.key === 'Enter' && $('#nextRow').style.display !== 'none' && t !== 'INPUT') { e.preventDefault(); goNext(); } });
  showView('menu'); renderAll();
}

init();
</script>
